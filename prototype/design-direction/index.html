<!doctype html>
<!--
  PROTOTYPE, THROWAWAY. Not product code. Lives only on the prototype/design-direction branch.

  Question: the learner chose the "warm and calm" look (cream surfaces, soft raised panels,
  one orange accent, big clear numbers). How should the tree, a grammar node page and a test
  be laid out in that look?

  Plan: three structurally different variants of the same three screens, switchable with
  ?variant=A|B|C from the floating bar. ?screen=tree|page|test, ?lang=en|fa|de, ?frame=phone|full.
  Node titles are real; states, vocabulary themes, phrases and all texts are invented samples.
  Nothing is saved.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · deutsch-tree design direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece6dd; --panel:#f6f2ec; --hi:#fdfbf8; --ink:#201d1a; --muted:#857b70; --line:#dcd2c5;
  --accent:#f08a2b; --accent-ink:#a4520b; --accent-soft:#fbe2c8; --ok:#4f7a52; --bad:#b4492f;
  --g:#dccbb0; --v:#bccab1; --p:#b6c4d4; --x:#dfb7ac;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#cfc7bb;color:var(--ink);font-family:"Outfit","Vazirmatn",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#stage{height:100%;display:grid;place-items:center}
#stage.full #app{width:100%;height:100%}
#stage.phone #app{width:390px;height:min(800px,calc(100% - 110px));border-radius:36px;box-shadow:0 0 0 10px #201d1a,0 30px 60px rgba(0,0,0,.3);margin-bottom:70px}
#app{background:var(--bg);overflow:auto;container-type:inline-size;container-name:app;position:relative}
#app[dir=rtl]{font-family:"Vazirmatn","Outfit",system-ui,sans-serif}
.de{direction:ltr;unicode-bidi:isolate;font-family:"Outfit",system-ui,sans-serif}
.wrap{max-width:1120px;margin:auto;padding:16px 16px 120px}
.narrow{max-width:720px}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.85);border-radius:22px;padding:16px;
  box-shadow:0 16px 30px -20px rgba(96,72,40,.4),0 2px 5px rgba(96,72,40,.06)}
.panel+.panel{margin-block-start:14px}
.big{font-weight:300;font-size:46px;line-height:1;letter-spacing:-.02em}
.mid{font-weight:300;font-size:30px;line-height:1}
.cap{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
[dir=rtl] .cap,[dir=rtl] .big{letter-spacing:0}
[dir=rtl] .cap{font-size:13px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
h1{font-weight:400;font-size:30px;line-height:1.15;margin:0}
h2{font-weight:500;font-size:18px;margin:0 0 8px}
p{margin:0 0 10px}
.btn{border:0;border-radius:999px;padding:12px 20px;background:var(--ink);color:#fff;font-weight:500;white-space:nowrap}
.btn.acc{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.wide{width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:12px}
.chip{border:0;border-radius:999px;padding:7px 14px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.seg{display:flex;background:#e2dacf;border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 10px;font-weight:500}
.seg button.on{background:var(--hi);box-shadow:0 2px 6px rgba(96,72,40,.15)}
.bar{height:6px;border-radius:9px;background:#e2dacf;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:#e6ded2;color:#5e554b;white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* node tokens: shape = kind, fill = state */
.tok{--sz:36px;inline-size:var(--sz);block-size:var(--sz);flex:none;display:inline-grid;place-items:center;background:var(--tint);border:0;padding:0;font-size:calc(var(--sz)*.42);font-weight:600;color:var(--ink);position:relative}
.tok>b{font-weight:600;line-height:1}
.k-grammar{--tint:var(--g);border-radius:28%}
.k-vocab{--tint:var(--v);border-radius:50%}
.k-phrase{--tint:var(--p);border-radius:50% 50% 50% 14%}
[dir=rtl] .k-phrase{border-radius:50% 50% 14% 50%}
.k-exam{--tint:var(--x);border-radius:18%;transform:rotate(45deg) scale(.8)}
.k-exam>b{transform:rotate(-45deg)}
.s-done{background:var(--ink);color:#fff}
.s-prog{box-shadow:inset 0 0 0 3px var(--ink)}
.s-soon{background:transparent;box-shadow:inset 0 0 0 1.5px var(--tint);opacity:.75}
.s-soon>b{opacity:0}
.tok.next{outline:3px solid var(--accent);outline-offset:3px}
.tok.dim{opacity:.12}
.tok.sel{outline:3px solid var(--ink);outline-offset:3px}

.top{display:flex;align-items:center;justify-content:space-between;margin-block-end:14px}
.logo{font-weight:600;letter-spacing:-.01em}
.logo i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-inline-end:7px}
.langs{display:flex;gap:2px;background:#e2dacf;border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font-size:13px}
.langs button.on{background:var(--hi)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-block:10px}

/* ---------- A: path ---------- */
.A-grid{display:block}
.hero .title{font-size:22px;line-height:1.2;margin-block:6px 4px}
.stage{padding:0;overflow:hidden}
.stage>header{display:flex;align-items:center;gap:10px;padding:14px 16px;width:100%;border:0;background:transparent;text-align:start}
.stage .path{padding:4px 16px 18px}
.pnode{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:start;padding:9px 0;margin-inline-start:calc(var(--o)*13%);position:relative;max-width:calc(100% - var(--o)*13%)}
.pnode+.pnode::before{content:"";position:absolute;inset-block-start:-5px;inset-inline-start:21px;width:4px;height:4px;border-radius:50%;background:#cfc4b5;box-shadow:0 8px 0 transparent}
.pnode .tok{--sz:46px}
.pnode .lbl{font-size:15px;line-height:1.25}
.pnode.soon .lbl{color:var(--muted)}
@container app (min-width:820px){
  .A-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  .A-grid>aside{position:sticky;inset-block-start:16px}
}

/* ---------- B: map ---------- */
.mapgrid{display:grid;gap:14px}
.lvl .toks{display:flex;flex-wrap:wrap;gap:9px;margin-block-start:14px}
.lvl .tok{--sz:27px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:#5e554b;margin-block:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .tok{--sz:18px}
.sheet{position:sticky;inset-block-end:76px;margin-block-start:14px;background:var(--hi);z-index:3}
.B-side .panel+.panel{margin-block-start:14px}
@container app (min-width:820px){
  .B-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  .B-side{position:sticky;inset-block-start:16px}
  .sheet{position:static}
  .lvl .tok{--sz:30px}
}

/* ---------- C: index ---------- */
.lv3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lv3 button{border:0;text-align:start;background:var(--panel);border-radius:18px;padding:12px;border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 20px -16px rgba(96,72,40,.4)}
.lv3 button.on{background:var(--ink);color:#fff;border-color:transparent}
.lv3 button.on .cap,.lv3 button.on .muted{color:#cfc7bb}
.lv3 button.on .bar{background:#4a443d}.lv3 button.on .bar i{background:#fff}
.search{width:100%;border:0;border-radius:999px;padding:12px 18px;background:var(--hi);box-shadow:inset 0 0 0 1.5px var(--line);margin-block-start:14px}
.list{padding:4px 0;margin-block-start:4px}
.li{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:start;padding:11px 16px;border-block-end:1px solid #e7dfd3}
.li:last-child{border:0}
.li .n{inline-size:28px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.li .tok{--sz:24px;font-size:11px}
.li .ttl{flex:1;min-width:0;font-size:15px;line-height:1.25}
.li.soon .ttl{color:var(--muted)}
.li.next{background:var(--accent-soft)}
.li .st{font-size:12px;color:var(--muted);white-space:nowrap}
@container app (min-width:820px){
  .C-grid{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
  .C-grid>aside{position:sticky;inset-block-start:16px}
  .lv3{grid-template-columns:1fr}
}

/* ---------- trees, second round ---------- */
.kk-grammar{--tint:var(--g)}.kk-vocab{--tint:var(--v)}.kk-phrase{--tint:var(--p)}.kk-exam{--tint:var(--x)}
.intro h1{font-size:28px}
.intro p{margin-block:6px 14px}
.how{background:var(--hi);border-radius:18px;padding:12px 14px;margin-block-end:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.how ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px;flex:1}
.how li{display:flex;gap:8px;align-items:center;font-size:14px}
.how li b{inline-size:24px;block-size:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:500;flex:none}
.cont .title{font-size:22px;line-height:1.2;margin-block:6px 8px}
.kp{font-size:12px;border-radius:7px;padding:2px 8px;background:var(--tint);color:#3b352e;white-space:nowrap;font-weight:500}
.mk{inline-size:26px;block-size:26px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:13px;box-shadow:inset 0 0 0 2px #b9ad9c;color:#fff}
.m-done{background:var(--ink);box-shadow:none}
.m-prog{background:conic-gradient(var(--ink) 0 50%,transparent 0);box-shadow:inset 0 0 0 2px var(--ink)}
.m-soon{box-shadow:none;border:2px dashed #cdc2b2;opacity:.7}
.m-next{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px #f6cfa6}
.pill{font-size:13px;border-radius:999px;padding:4px 12px;background:var(--ink);color:#fff;white-space:nowrap;font-weight:500}
.pill.acc{background:var(--accent)}
.pill.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.nr{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:start;padding:12px 14px;border-block-start:1px solid #e7dfd3;font-size:15px}
.nr:first-child{border-block-start:0}
.nr .ttl{flex:1;min-width:0;line-height:1.3}
.nr.soon .ttl{color:var(--muted)}
.nr.done .ttl{color:#5e554b}
.nr.isnext{background:var(--accent-soft)}
.nr>.muted{font-size:13px;white-space:nowrap}
.sm{font-size:13px}
.cname{font-size:17px;font-weight:500;line-height:1.25;display:block}
.chev{color:var(--muted);font-size:22px;line-height:1}
[dir=rtl] .flip{display:inline-block;transform:scaleX(-1)}
.lvname{font-size:17px;font-weight:500}
.rowsp{padding:0;overflow:hidden}
/* route */
.strip{display:flex;align-items:flex-start;gap:6px;margin-block:14px 4px;padding-block-start:28px}
.strip i{flex:1;height:3px;background:#cfc4b5;border-radius:3px;margin-block-start:21px}
.strip .end{font-size:12px;color:var(--muted);margin-block-start:13px;white-space:nowrap}
.strip button{position:relative;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:0}
.strip button b{inline-size:44px;block-size:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel);box-shadow:inset 0 0 0 2px #b9ad9c;font-weight:500}
.strip button.on b{background:var(--ink);color:#fff;box-shadow:none}
.strip button small{font-size:12px;color:var(--muted)}
.strip em{position:absolute;inset-block-end:100%;margin-block-end:4px;white-space:nowrap;font-style:normal;font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px}
.lh{margin-block:18px 12px;font-size:18px}
.route{position:relative;padding-inline-start:46px}
.route::before{content:"";position:absolute;inset-inline-start:16px;inset-block:10px 24px;width:3px;background:#cfc4b5;border-radius:3px}
.st{position:relative;margin-block-end:14px}
.st .dot{position:absolute;inset-inline-start:-46px;inset-block-start:12px;inline-size:35px;block-size:35px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px #b9ad9c;display:grid;place-items:center;font-size:14px;font-weight:500;color:var(--muted)}
.st.full .dot{background:var(--ink);color:#fff;box-shadow:none}
.st.cur .dot{background:var(--accent);color:#fff;box-shadow:0 0 0 5px #f6cfa6;inset-block-start:38px}
.herebadge{display:inline-block;font-size:12px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;margin-block-end:6px}
.stc{padding:0;overflow:hidden}
.stc.soft{padding:14px 16px;background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.st-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:start;padding:14px 16px}
.rows{border-block-start:1px solid #e7dfd3}
/* folders */
.fold .col,.fold .fhome{display:none}
.fold.view-levels .c-levels,.fold.view-chaps .c-chaps,.fold.view-nodes .c-nodes{display:block}
.fold.view-levels .fhome{display:block;margin-block-end:16px}
.colh{margin-block:6px 12px}
.lvcard{display:grid;gap:6px;width:100%;text-align:start;border:1px solid rgba(255,255,255,.85);background:var(--panel);border-radius:22px;padding:16px;margin-block-end:12px;box-shadow:0 16px 30px -20px rgba(96,72,40,.4)}
.lvcard.exam{background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.kh{margin-block:16px 8px}
.chrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--panel);border-radius:16px;padding:12px 14px;margin-block-end:8px;border:1px solid rgba(255,255,255,.85)}
.chrow .cname{font-size:16px}
.crumb{display:block;margin-block-end:4px}
.big2{font-size:22px}
@container app (min-width:820px){
  .fold{display:grid;grid-template-columns:250px 1fr 1.25fr;gap:22px;align-items:start}
  .fold .col,.fold .fhome{display:block!important}
  .fold .fhome{grid-column:1/-1;max-width:520px;margin:0}
  .fold .crumb{display:none}
  .lvcard.on,.chrow.on{box-shadow:inset 0 0 0 2.5px var(--ink)}
}
/* checklist */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:16px 10px}
.tile{display:grid;gap:5px;text-align:start;border:1px solid rgba(255,255,255,.85);background:var(--panel);border-radius:20px;padding:14px;box-shadow:0 16px 30px -20px rgba(96,72,40,.4);align-content:start}
.tile .sw{inline-size:26px;block-size:8px;border-radius:9px;background:var(--tint)}
.tname{font-size:17px;font-weight:500}
.tdesc{font-size:13px;color:var(--muted);line-height:1.3;min-height:2.6em}
.tile.on{background:var(--ink);color:#fff;border-color:transparent}
.tile.on .tdesc{color:#cfc7bb}.tile.on .bar{background:#4a443d}.tile.on .bar i{background:#fff}
@container app (min-width:820px){.tiles{grid-template-columns:repeat(4,1fr)}}
.hd{display:flex;gap:8px;align-items:center;font-size:14px;margin-block:10px 4px;color:#5e554b}
.clh{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:start;padding:14px 2px;border-block-start:1px solid var(--line);margin-block-start:10px}
.cch{font-size:14px;font-weight:500;color:#5e554b;margin-block:14px 8px}

/* ---------- node page ---------- */
.back{border:0;background:transparent;padding:6px 0;color:var(--muted)}
.ph{margin-block:6px 16px}
.ph .meta{display:flex;flex-wrap:wrap;gap:6px;margin-block-start:10px;align-items:center}
.rule{font-size:18px;line-height:1.55}
.dia{direction:ltr;background:var(--hi);border-radius:16px;padding:10px;overflow:auto}
.dia svg{display:block;width:100%;min-width:300px;height:auto}
.ex{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-block-end:1px solid #e7dfd3}
.ex:last-child{border:0}
.play{flex:none;inline-size:38px;block-size:38px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px}
.ex .de{font-size:17px;display:block}
.ex small{color:var(--muted);font-size:14px}
.mis{border-radius:16px;background:var(--hi);padding:12px;margin-block-end:10px}
.mis .w{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px;display:block}
.mis .r{color:var(--ok);display:block;font-weight:500}
.mis small{color:var(--muted)}
.cta{position:sticky;inset-block-end:76px;display:flex;gap:10px;margin-block-start:16px;z-index:3}
.cta .btn{flex:1;box-shadow:0 12px 24px -10px rgba(96,72,40,.6)}
.tabs{margin-block:0 14px}
.B-page .tabpane{display:none}
.B-page .tabpane.on{display:block}
@container app (min-width:820px){
  .B-page .tabs{display:none}
  .B-page .panes{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .B-page .tabpane{display:block;margin:0!important}
}
.book{max-width:680px}
.book h1{font-size:40px;font-weight:300}
.book section{padding-block:18px;border-block-start:1px solid var(--line)}
.book h2{display:flex;gap:10px;align-items:baseline}
.book h2 span{color:var(--accent);font-weight:300;font-size:22px}
.book .mis{background:transparent;border-inline-start:3px solid var(--accent);border-radius:0;padding:2px 14px}
.toc{display:none}
@container app (min-width:820px){
  .C-page{display:grid;grid-template-columns:1fr 240px;gap:40px;max-width:980px}
  .toc{display:block;position:sticky;inset-block-start:16px;align-self:start}
  .toc a{display:block;padding:7px 0;color:var(--ink);text-decoration:none;border-block-end:1px solid var(--line)}
  .C-page .cta{display:none}
}

/* ---------- test ---------- */
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:6px;border-radius:9px;background:#dcd2c5}
.dots i.on{background:var(--ink)}
.dots i.cur{background:var(--accent)}
.prompt{font-size:15px;color:#5e554b;margin-block-end:12px}
.sent{font-size:22px;line-height:1.5;margin-block-end:16px}
.opt{display:block;width:100%;text-align:start;border:0;background:var(--hi);border-radius:16px;padding:14px 16px;margin-block-end:10px;font-size:17px;box-shadow:inset 0 0 0 1.5px var(--line)}
.opt.on{box-shadow:inset 0 0 0 2.5px var(--ink)}
.gap{border:0;border-block-end:2.5px solid var(--ink);background:transparent;inline-size:7.5em;font-size:22px;padding:0 4px;text-align:center;outline:none}
.gap:focus{border-color:var(--accent)}
.uml{display:flex;gap:8px;margin-block:4px 6px;direction:ltr}
.uml button{inline-size:44px;block-size:44px;border-radius:12px;border:0;background:var(--hi);box-shadow:inset 0 0 0 1.5px var(--line);font-size:18px}
.line{min-height:56px;border-block-end:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-block-end:10px;margin-block-end:14px;direction:ltr;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;direction:ltr}
.word{border:0;border-radius:12px;padding:9px 14px;background:var(--hi);box-shadow:0 3px 0 #d5cabb,inset 0 0 0 1px var(--line);font-size:17px}
.word.used{opacity:.25}
.T-A{display:flex;flex-direction:column;min-height:100%}
.T-A .qcard{flex:1}
.rail{display:flex;gap:8px;margin-block-end:14px}
.rail button{inline-size:40px;block-size:40px;border-radius:50%;border:0;background:#e2dacf;font-weight:500}
.rail button.cur{background:var(--ink);color:#fff}
.rail button.ans{box-shadow:inset 0 0 0 2px var(--ink)}
@container app (min-width:820px){
  .T-B{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
  .T-B .rail{flex-direction:column}
  .T-B .rail button{inline-size:100%;border-radius:14px;text-align:start;padding-inline:14px}
}

const levelSeg=()=>`<div class="seg">${LEVELS.map(L=>`<button data-a="level" data-v="${L}" class="${S.level===L?'on':''}">${L} <span class="muted">${num(count(L).done)}/${num(count(L).total)}</span></button>`).join('')}</div>`;
const kindChips=()=>`<div class="chips"><button class="chip ${S.kind==='all'?'on':''}" data-a="kind" data-v="all">${t('all')}</button>${KINDS.map(k=>`<button class="chip ${S.kind===k?'on':''}" data-a="kind" data-v="${k}"><span class="tok k-${k} s-todo" style="--sz:14px"></span>${t(k)}</button>`).join('')}</div>`;
const hero=()=>`<section class="panel hero"><div class="cap">${t('next')}</div><div class="row" style="margin-block:10px 14px">${tok(NEXT)}<div class="grow"><div class="title">${de(NEXT.title)}</div><span class="tag">${NEXT.level}</span> <span class="tag">${t(NEXT.kind)}</span></div></div><div class="row"><button class="btn acc grow" data-a="go" data-v="page">${t('start')}</button><button class="btn ghost" data-a="go" data-v="test">${t('take')}</button></div></section>`;
const totals=()=>{const c=count();return `<section class="panel"><div class="row spread"><div><div class="big">${num(c.done)}</div><div class="cap">${t('done')}</div></div><div style="text-align:end"><div class="big">${num(c.total-c.done)}</div><div class="cap">${t('left')}</div></div></div><div class="bar" style="margin-block-start:14px"><i style="width:${c.done/c.total*100}%"></i></div></section>`};
const legend=()=>`<div class="legend">${KINDS.map(k=>`<span><span class="tok k-${k} s-todo"></span>${t(k)}</span>`).join('')}<span><span class="tok k-vocab s-done" style="font-size:9px"><b>✓</b></span>${t('done')}</span><span><span class="tok k-vocab s-prog"></span>${t('prog')}</span><span><span class="tok k-vocab s-soon"></span>${t('soon')}</span></div>`;

/* ---------- trees (second round: words over symbols, named chapters, one obvious next step) ---------- */
const pct=(a,b)=>b?a/b*100:0;
const ofDone=(a,b)=>({en:`${a} of ${b} done`,fa:`${num(a)} از ${num(b)} تمام‌شده`,de:`${a} von ${b} fertig`})[S.lang];
const kp=k=>`<span class="kp kk-${k}">${t(k)}</span>`;
const mk=n=>`<span class="mk m-${n.state} ${n===NEXT?'m-next':''}">${n.state==='done'?'✓':''}</span>`;
const act=n=>n.state==='done'?`<span class="muted">${t('done')}</span>`:n===NEXT?`<span class="pill acc">${n.state==='prog'?t('cont'):t('startHere')}</span>`:n.state==='prog'?`<span class="pill">${t('cont')}</span>`:n.state==='soon'?`<span class="muted">${t('soon')}</span>`:`<span class="pill ghost">${t('startW')}</span>`;
const nrow=n=>`<button class="nr ${n.state} ${n===NEXT?'isnext':''}" data-a="node" data-v="${n.id}">${mk(n)}<span class="ttl">${de(n.title)}${n.rec?` <span class="tag">${t('recog')}</span>`:''}</span>${act(n)}</button>`;
const cstat=c=>{const d=c.nodes.filter(n=>n.state==='done').length;return{d,n:c.nodes.length,all:d===c.nodes.length}};
const intro=()=>`<header class="intro"><h1>${t('h1')}</h1><p class="muted">${t('sub')}</p>${S.how?`<div class="how"><ol>${[1,2,3].map(i=>`<li><b>${num(i)}</b><span>${t('how'+i)}</span></li>`).join('')}</ol><button class="btn ghost sm" data-a="how">${t('gotit')}</button></div>`:''}</header>`;
const cont=()=>`<section class="panel cont"><div class="cap">${t('yourNext')}</div><div class="title">${de(NEXT.title)}</div><div class="row" style="flex-wrap:wrap;gap:6px">${kp(NEXT.kind)}<span class="tag">${NEXT.level}</span><span class="muted sm">${NEXT.chap.name[S.lang]}</span></div><div class="row" style="margin-block-start:14px"><button class="btn acc grow" data-a="go" data-v="page">${t('start')}</button><button class="btn ghost" data-a="go" data-v="test">${t('take')}</button></div></section>`;

function treeA(){ /* Route: one line from Start to the exam, with named stops */
  const L=S.level,chs=CHAPS.filter(c=>c.level===L),lc=count(L),li=LEVELS.indexOf(L);
  const strip=`<nav class="strip"><span class="end">${t('startW')}</span>${LEVELS.map(x=>{const c=count(x);return `<i></i><button data-a="level" data-v="${x}" class="${x===L?'on':''}">${x===NEXT.level?`<em>${t('here')}</em>`:''}<b>${x}</b><small>${num(c.done)}/${num(c.total)}</small></button>`}).join('')}<i></i><span class="end">⚑ ${t('examShort')}</span></nav>`;
  const stations=chs.map((c,i)=>{const st=cstat(c),cur=c===NEXT.chap,open=c.id in S.open?S.open[c.id]:cur;
    return `<div class="st ${st.all?'full':''} ${cur?'cur':''}"><span class="dot">${st.all?'✓':num(i+1)}</span>${cur?`<div class="herebadge">${t('here')}</div>`:''}
    <section class="panel stc"><button class="st-h" data-a="stage" data-v="${c.id}" data-open="${open?1:0}"><span class="grow"><span class="cname">${c.name[S.lang]}</span><span class="row" style="gap:8px;margin-block-start:6px">${kp(c.kind)}<span class="muted sm">${ofDone(st.d,st.n)}</span></span></span><span class="chev">${open?'−':'+'}</span></button>${open?`<div class="rows">${c.nodes.map(nrow).join('')}</div>`:''}</section></div>`}).join('');
  const tail=`<div class="st"><span class="dot">?</span><section class="panel stc soft"><div class="cname">${t('checkpoint').replace('X',L)}</div></section></div>`+
    (li<2?`<div class="st"><span class="dot">${S.lang==='fa'?'←':'→'}</span><button class="btn ghost" data-a="levelTop" data-v="${LEVELS[li+1]}" style="margin-block-start:6px">${t('nextLevel')} ${LEVELS[li+1]}</button></div>`
         :`<div class="st"><span class="dot">⚑</span><section class="panel stc soft"><div class="cname">${t('examEnd')}</div><p class="muted sm" style="margin:6px 0 0">${t('ready')}</p></section></div>`);
  return `<div class="wrap narrow">${topbar()}${intro()}${cont()}${strip}<h2 class="lh">${L} · ${t('lv'+L)} <span class="muted" style="font-weight:400">· ${ofDone(lc.done,lc.total)}</span></h2><div class="route">${stations}${tail}</div></div>`;
}
function treeB(){ /* Folders: levels, then chapters, then topics */
  const L=S.fLevel,chs=CHAPS.filter(c=>c.level===L),ch=chs.find(c=>c.id===S.fChap)||chs[0],cs=cstat(ch);
  const bk=`<span class="flip">‹</span>`,fw=`<span class="chev flip">›</span>`;
  const levels=`<div class="col c-levels"><div class="cap colh">${t('allLevels')}</div>${LEVELS.map(x=>{const c=count(x);return `<button class="lvcard ${x===L?'on':''}" data-a="fl" data-v="${x}"><span class="row spread"><span class="mid">${x}</span>${x===NEXT.level?`<span class="pill acc">${t('here')}</span>`:fw}</span><span class="lvname">${t('lv'+x)}</span><span class="bar"><i style="width:${pct(c.done,c.total)}%"></i></span><span class="muted sm">${ofDone(c.done,c.total)}</span></button>`}).join('')}<div class="lvcard exam"><span class="mid">⚑</span><span class="lvname">${t('examEnd')}</span><span class="muted sm">${t('ready')}</span></div></div>`;
  const chaps=`<div class="col c-chaps"><button class="back crumb" data-a="fb" data-v="levels">${bk} ${t('allLevels')}</button><div class="colh"><span class="mid">${L}</span> <span class="lvname">${t('lv'+L)}</span> <span class="muted sm">· ${t('chapters')}</span></div>${KINDS.filter(k=>chs.some(c=>c.kind===k)).map(k=>`<div class="kh">${kp(k)}</div>`+chs.filter(c=>c.kind===k).map(c=>{const st=cstat(c);return `<button class="chrow ${c===ch?'on':''}" data-a="fc" data-v="${c.id}"><span class="mk ${st.all?'m-done':st.d?'m-prog':'m-todo'}">${st.all?'✓':''}</span><span class="grow"><span class="cname">${c.name[S.lang]}</span><span class="muted sm">${ofDone(st.d,st.n)}</span></span>${c===NEXT.chap?`<span class="pill acc">${t('here')}</span>`:''}${fw}</button>`}).join('')).join('')}</div>`;
  const nodes=`<div class="col c-nodes"><button class="back crumb" data-a="fb" data-v="chaps">${bk} ${L} · ${t('chapters')}</button><div class="colh"><div class="cname big2">${ch.name[S.lang]}</div><div class="row" style="gap:8px;margin-block-start:6px">${kp(ch.kind)}<span class="muted sm">${ofDone(cs.d,cs.n)}</span></div></div><section class="panel rowsp">${ch.nodes.map(nrow).join('')}</section></div>`;
  return `<div class="wrap">${topbar()}${intro()}<div class="fold view-${S.fView}"><div class="fhome">${cont()}</div>${levels}${chaps}${nodes}</div></div>`;
}
function treeC(){ /* Checklist: four piles, each a to-do list */
  const k=S.ck;
  const tiles=`<div class="tiles">${KINDS.map(x=>{const c=count(null,x);return `<button class="tile ${x===k?'on':''}" data-a="ck" data-v="${x}"><span class="sw kk-${x}"></span><span class="tname">${t(x)}</span><span class="tdesc">${t('d_'+x)}</span><span class="bar"><i style="width:${pct(c.done,c.total)}%"></i></span><span class="sm">${ofDone(c.done,c.total)}</span></button>`}).join('')}</div>`;
  const firstL=LEVELS.find(L=>NODES.some(n=>n.level===L&&n.kind===k&&n.state!=='done'));
  const body=LEVELS.map(L=>{const chs=CHAPS.filter(c=>c.level===L&&c.kind===k);if(!chs.length)return '';
    const ns=chs.flatMap(c=>c.nodes),d=ns.filter(n=>n.state==='done').length,open=L in S.copen?S.copen[L]:L===firstL;
    return `<section class="clv"><button class="clh" data-a="cl" data-v="${L}" data-open="${open?1:0}"><span class="mid">${L}</span><span class="grow"><span class="lvname">${t('lv'+L)}</span><span class="muted sm"> · ${ofDone(d,ns.length)}</span></span><span class="chev">${open?'−':'+'}</span></button>${open?chs.map(c=>{const rows=c.nodes.filter(n=>!(S.hideDone&&n.state==='done'));return rows.length?`<div class="cch">${c.name[S.lang]}</div><section class="panel rowsp">${rows.map(nrow).join('')}</section>`:''}).join(''):''}</section>`}).join('');
  return `<div class="wrap narrow">${topbar()}${intro()}${cont()}${tiles}<label class="hd"><input type="checkbox" data-hd ${S.hideDone?'checked':''}> ${t('hideDone')}</label>${body}</div>`;
}

/* ---------- node page ---------- */
const diagram=()=>`<div class="dia"><svg viewBox="0 0 430 150" font-family="Outfit,system-ui,sans-serif" font-size="16" text-anchor="middle">
  <g fill="#f6f2ec" stroke="#dcd2c5" stroke-width="1.5"><rect x="8" y="26" width="46" height="38" rx="10"/><rect x="146" y="26" width="92" height="38" rx="10"/><rect x="84" y="100" width="46" height="38" rx="10"/><rect x="138" y="100" width="142" height="38" rx="10"/></g>
  <g fill="#f08a2b"><rect x="62" y="26" width="76" height="38" rx="10"/><rect x="288" y="100" width="92" height="38" rx="10"/></g>
  <rect x="8" y="100" width="68" height="38" rx="10" fill="#201d1a"/>
  <g fill="#201d1a"><text x="31" y="51">Ich</text><text x="192" y="51">Deutsch</text><text x="250" y="51">,</text><text x="107" y="125">ich</text><text x="209" y="125">in Deutschland</text><text x="388" y="125">.</text></g>
  <g fill="#fff" font-weight="500"><text x="100" y="51">lerne</text><text x="334" y="125">arbeite</text><text x="42" y="125">weil</text></g>
  <g fill="#857b70" font-size="12"><text x="100" y="17">Position 2</text><text x="334" y="91">Ende</text></g></svg></div>`;
const examples=()=>PAGE.ex.map(e=>`<div class="ex"><button class="play" aria-label="play">▶</button><div>${de(e[0])}${S.lang==='de'?'':`<small>${S.lang==='fa'?e[2]:e[1]}</small>`}</div></div>`).join('');
const mistakes=()=>PAGE.mis.map(m=>`<div class="mis"><span class="w de">${m[0]}</span><span class="r de">${m[1]}</span><small>${m[2][S.lang]}</small></div>`).join('');
const phead=()=>`<button class="back" data-a="go" data-v="tree">${S.lang==='fa'?'→':'←'} ${t('tree')}</button><div class="ph"><h1>${de(PAGE.title)}</h1><div class="meta"><span class="tag">${PAGE.level}</span><span class="tag">${t('grammar')}</span><span class="tag">${t('todo')}</span><span class="muted" style="font-size:14px">${t('builds')}: ${de(PAGE.pre)}</span></div></div>`;
const cta=()=>`<div class="cta"><button class="btn acc" data-a="go" data-v="test">${t('take')}</button></div>`;
const sample=()=>`<p class="note">${t('sample')}</p>`;
function pageA(){return `<div class="wrap narrow">${topbar()}${phead()}
  <section class="panel"><div class="cap">${t('rule')}</div><p class="rule" style="margin-block-start:8px">${PAGE.rule[S.lang]}</p></section>
  <section class="panel"><div class="cap" style="margin-block-end:10px">${t('dia')}</div>${diagram()}</section>
  <section class="panel"><div class="cap">${t('ex')}</div>${examples()}</section>
  <section class="panel"><div class="cap" style="margin-block-end:10px">${t('mis')}</div>${mistakes()}</section>${cta()}${sample()}</div>`}
function pageB(){const tabs=[['rule','rule'],['dia','dia'],['ex','ex'],['mis','mis']];
  const pane=(k,body)=>`<section class="panel tabpane ${S.tab===k?'on':''}"><div class="cap" style="margin-block-end:10px">${t(k)}</div>${body}</section>`;
  return `<div class="wrap B-page">${topbar()}<div class="row spread" style="align-items:flex-start;flex-wrap:wrap"><div>${phead()}</div><button class="btn acc" data-a="go" data-v="test" style="margin-block-start:34px">${t('take')}</button></div>
  <div class="seg tabs">${tabs.map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${S.tab===k?'on':''}" style="font-size:14px;padding-inline:4px">${t(l)}</button>`).join('')}</div>
  <div class="panes">${pane('rule',`<p class="rule">${PAGE.rule[S.lang]}</p>`)}${pane('dia',diagram())}${pane('ex',examples())}${pane('mis',mistakes())}</div>${sample()}</div>`}
function pageC(){return `<div class="wrap">${topbar()}<div class="C-page"><article class="book">${phead()}
  <p class="rule" style="font-size:20px">${PAGE.rule[S.lang]}</p>
  <section id="s2"><h2><span>${num(1)}</span>${t('dia')}</h2>${diagram()}</section>
  <section id="s3"><h2><span>${num(2)}</span>${t('ex')}</h2>${examples()}</section>
  <section id="s4"><h2><span>${num(3)}</span>${t('mis')}</h2>${mistakes()}</section>${cta()}${sample()}</article>
  <nav class="toc"><div class="cap" style="margin-block-end:8px">${t('contents')}</div><a href="#s2">${t('dia')}</a><a href="#s3">${t('ex')}</a><a href="#s4">${t('mis')}</a><button class="btn acc wide" data-a="go" data-v="test" style="margin-block-start:16px">${t('take')}</button></nav></div></div>`}

/* ---------- test ---------- */
function qBody(i){const q=QS[i],x=S.t;
  if(q.type==='choice')return `<p class="prompt">${q.p[S.lang]}</p>${q.opts.map((o,j)=>`<button class="opt de ${x.choice===j?'on':''}" data-a="choice" data-v="${j}">${o}</button>`).join('')}`;
  if(q.type==='typed')return `<p class="prompt">${q.p[S.lang]}</p><p class="sent de">${q.a}<input class="gap" data-typed value="${x.typed.replace(/"/g,'&quot;')}" autocapitalize="off" autocomplete="off" spellcheck="false">${q.b}</p><div class="uml">${['ä','ö','ü','ß'].map(c=>`<button data-a="uml" data-v="${c}">${c}</button>`).join('')}</div>`;
  return `<p class="prompt">${q.p[S.lang]}</p><p class="sent de">${q.lead}</p><div class="line">${x.order.map(j=>`<button class="word" data-a="unword" data-v="${j}">${q.words[j]}</button>`).join('')}</div><div class="bank">${q.words.map((w,j)=>`<button class="word ${x.order.includes(j)?'used':''}" data-a="word" data-v="${j}">${w}</button>`).join('')}</div>`}
const answered=i=>i===0?S.t.choice!==null:i===1?!!S.t.typed:S.t.order.length>0;
const thead=()=>`<div class="row" style="margin-block-end:14px"><button class="back" data-a="go" data-v="page">✕</button><div class="grow"></div><span class="tag">${de('weil')}</span><span class="tag">${t('pass')}</span></div>`;
function result(){return `<div class="wrap narrow">${topbar()}<section class="panel res"><div class="cap">${t('passed')}</div><div class="big" style="margin-block:14px 6px">${num(9)}<span class="muted" style="font-size:34px"> / ${num(10)}</span></div><div class="mid">${S.lang==='fa'?'۹۰٪':'90%'}</div><p style="margin-block:14px">${t('nodeDone')}</p>
  <div class="wrong"><div class="cap">${t('wrong')} · ${t('q')} ${num(7)}</div><span class="de" style="display:block;color:var(--bad);text-decoration:line-through">Weil es regnet, wir nehmen den Bus.</span><span class="de" style="display:block;color:var(--ok);font-weight:500">Weil es regnet, nehmen wir den Bus.</span><small class="muted">${PAGE.mis[1][2][S.lang]}</small></div>
  <div class="row" style="margin-block-start:18px"><button class="btn acc grow" data-a="go" data-v="tree">${t('toTree')}</button><button class="btn ghost" data-a="retry">${t('retry')}</button></div></section></div>`}
function testA(){const i=S.t.i,last=i===QS.length-1;return `<div class="wrap narrow T-A">${thead()}<div class="row" style="margin-block-end:18px"><div class="dots">${QS.map((_,j)=>`<i class="${j<i?'on':j===i?'cur':''}"></i>`).join('')}</div><span class="muted" style="font-size:14px">${num(i+1)} ${t('of')} ${num(QS.length)}</span></div>
  <section class="panel qcard">${qBody(i)}</section><div class="cta"><button class="btn ${answered(i)?'acc':''}" data-a="${last?'finish':'nextq'}">${last?t('check'):t('nextq')}</button></div></div>`}
function testB(){const i=S.t.i,last=i===QS.length-1;return `<div class="wrap">${thead()}<div class="T-B"><div class="rail">${QS.map((_,j)=>`<button data-a="jump" data-v="${j}" class="${j===i?'cur':answered(j)?'ans':''}">${num(j+1)}</button>`).join('')}</div>
  <div><section class="panel"><div class="cap" style="margin-block-end:10px">${t('q')} ${num(i+1)} ${t('of')} ${num(QS.length)}</div>${qBody(i)}</section><div class="row" style="margin-block-start:14px;justify-content:flex-end">${last?'':`<button class="btn ghost" data-a="nextq">${t('nextq')}</button>`}<button class="btn ${QS.every((_,j)=>answered(j))?'acc':''}" data-a="finish">${t('check')}</button></div></div></div></div>`}
function testC(){return `<div class="wrap narrow">${thead()}<h1 style="font-weight:300;font-size:36px">${t('test')}: ${de('weil')}</h1>${QS.map((_,i)=>`<div class="sheetq"><div class="row"><span class="qn">${num(i+1)}</span><div class="grow">${qBody(i)}</div></div></div>`).join('')}<div class="cta"><button class="btn acc" data-a="finish">${t('check')}</button></div></div>`}

const SCREENS={tree:{A:treeA,B:treeB,C:treeC},page:{A:pageA,B:pageB,C:pageC},test:{A:testA,B:testB,C:testC}};
const app=document.getElementById('app'),stage=document.getElementById('stage'),pb=document.querySelector('#pb>div');
function render(keep){
  const y=app.scrollTop;
  stage.className=S.frame; app.dir=t('dir'); app.lang=S.lang;
  app.innerHTML=(S.screen==='test'&&S.t.result)?result():SCREENS[S.screen][S.variant]();
  app.scrollTop=keep?y:0;
  pb.innerHTML=`<span class="g"><button data-a="var" data-v="-1">←</button><span class="v">${S.variant} · ${VARIANTS[S.variant]}</span><button data-a="var" data-v="1">→</button></span>
   <span class="g">${[['tree','Tree'],['page','Node page'],['test','Test']].map(([k,l])=>`<button data-a="go" data-v="${k}" class="${S.screen===k?'on':''}">${l}</button>`).join('')}</span>
   <span class="g">${[['phone','Phone'],['full','Full width']].map(([k,l])=>`<button data-a="frame" data-v="${k}" class="${S.frame===k?'on':''}">${l}</button>`).join('')}</span>`;
  history.replaceState(null,'','?'+new URLSearchParams({variant:S.variant,screen:S.screen,lang:S.lang,frame:S.frame}));
}
const ACT={
  how:()=>{S.how=false;return true}, levelTop:v=>{S.level=v}, fl:v=>{S.fLevel=v;S.fView='chaps';const c=CHAPS.filter(c=>c.level===v);S.fChap=(c.includes(NEXT.chap)?NEXT.chap:c[0]).id},
  fc:v=>{S.fChap=v;S.fView='nodes'}, fb:v=>{S.fView=v}, ck:v=>{S.ck=v;return true}, cl:(v,el)=>{S.copen[v]=el.dataset.open!=='1';return true},
  lang:v=>{S.lang=v;return true}, level:v=>{S.level=v;S.find='';return true}, kind:v=>{S.kind=v;return true}, frame:v=>{S.frame=v;return true},
  stage:(v,el)=>{S.open[v]=el.dataset.open!=='1';return true}, node:v=>{const n=byId(v);if(n.state==='soon')return true;S.screen='page'}, sel:v=>{S.sel=v;return true},
  go:v=>{S.screen=v;if(v==='test')S.t={i:0,choice:null,typed:'',order:[],result:false}}, tab:v=>{S.tab=v;return true},
  var:v=>{const k=Object.keys(VARIANTS);S.variant=k[(k.indexOf(S.variant)+ +v+k.length)%k.length];return true},
  choice:v=>{S.t.choice=+v;return true}, word:v=>{if(!S.t.order.includes(+v))S.t.order.push(+v);return true}, unword:v=>{S.t.order=S.t.order.filter(j=>j!==+v);return true},
  uml:v=>{const inp=app.querySelector('[data-typed]');const s=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,s)+v+inp.value.slice(inp.selectionEnd??s);S.t.typed=inp.value;inp.focus();inp.setSelectionRange(s+1,s+1);return 'none'},
  nextq:()=>{S.t.i=Math.min(S.t.i+1,QS.length-1)}, jump:v=>{S.t.i=+v;return true}, finish:()=>{S.t.result=true}, retry:()=>{S.t={i:0,choice:null,typed:'',order:[],result:false}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const r=ACT[el.dataset.a](el.dataset.v,el);if(r!=='none')render(r===true)});
document.addEventListener('input',e=>{if(e.target.matches('[data-typed]'))S.t.typed=e.target.value;
  if(e.target.matches('[data-find]')){S.find=e.target.value;render(true);const i=app.querySelector('[data-find]');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-hd]')){S.hideDone=e.target.checked;render(true)}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'){ACT.var(-1);render(true)}if(e.key==='ArrowRight'){ACT.var(1);render(true)}});
render();
</script>
</body>
