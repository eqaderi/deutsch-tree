    prompt: ___ siehst du? – Ich sehe Paul.
    options: [Wen, Wem, Wer]
    answer: Wen
    explanation:
      en: "Paul is the object of *sehen* (*Akkusativ*): *wen*."
      fa: "پاول مفعولِ *sehen* است (حالت *Akkusativ*): *wen*."
      de: "Paul ist das Objekt von *sehen* (Akkusativ): *wen*."
  - id: choice-3
    type: multiple-choice
    prompt: Wer ___ heute Abend? – Lisa und Max.
    options: [kommt, kommen, kommst]
    answer: kommt
    explanation:
      en: "After *wer* the verb is singular, even for two people: *wer kommt*."
      fa: "پس از *wer* فعل مفرد است، حتی برای دو نفر: *wer kommt*."
      de: "Nach *wer* steht das Verb im Singular, auch bei zwei Personen: *wer kommt*."
  - id: true-1
    type: true-false
    prompt: Wen fragst du?
    answer: true
    explanation:
      en: "The person asked is the object of *fragen*: *wen*. The sentence is correct."
      fa: "کسی که از او پرسیده می‌شود مفعولِ *fragen* است: *wen*. جمله درست است."
      de: "Die Person ist das Objekt von *fragen*: *wen*. Der Satz ist richtig."
