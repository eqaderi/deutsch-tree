# Grammar list row 86.
id: grammar-086
kind: grammar
level: A1
chapter: a1-pronouns
order: 5
status: published
recogniseOnly: false
prerequisites: [grammar-062, grammar-063, grammar-141]
title:
  en: "Question pronouns *wer*, *was*, *wen*, *wem*"
  fa: "ضمیرهای پرسشی *wer*، *was*، *wen*، *wem*"
  de: "Fragepronomen *wer*, *was*, *wen*, *wem*"

explanations:
  en:
    rule: >
      *Wer?* (who?) asks for the person who does something, the subject:
      *Wer kommt heute?* *Wen?* (whom?) asks for a person in the *Akkusativ*,
      the object: *Wen besuchst du?* *Wem?* (to whom?) asks for a person in
      the *Dativ*, after verbs such as *helfen*, *gehören* and *gefallen* and
      after *mit*: *Wem gehört die Jacke?*, *Mit wem fährst du?* *Was?* (what?)
      asks for a thing, as subject or as object. The endings are those of the
      article: *wer*, *wen*, *wem* like *der*, *den*, *dem*. After *wer* the
      verb is singular, even when the answer is several people: *Wer kommt?*
  fa:
    rule: >
      *Wer?* (چه کسی؟) کسی را می‌پرسد که کاری می‌کند، یعنی فاعل را: *Wer kommt
      heute?* *Wen?* (چه کسی را؟) شخصی را در حالت *Akkusativ* می‌پرسد، یعنی
      مفعول را: *Wen besuchst du?* *Wem?* (به چه کسی؟) شخصی را در حالت *Dativ*
      می‌پرسد، پس از فعل‌هایی مانند *helfen*، *gehören* و *gefallen* و پس از
      *mit*: *Wem gehört die Jacke?* و *Mit wem fährst du?* *Was?* (چه؟ چه
      چیزی؟) چیزی را می‌پرسد، چه فاعل باشد چه مفعول. پایانه‌ها همان پایانه‌های
      حرف تعریف‌اند: *wer*، *wen*، *wem* مانند *der*، *den*، *dem*. در فارسی
      «چه کسی» ثابت است و فقط «را» یا «به» عوض می‌شود؛ در آلمانی خود ضمیر
      پرسشی تغییر می‌کند. پس از *wer* فعل مفرد است، حتی اگر پاسخ چند نفر
      باشد: *Wer kommt?*
  de:
    rule: >
      Mit *wer* fragt man nach dem Subjekt, nach einer Person: *Wer kommt
      heute?* Mit *wen* fragt man nach einer Person im Akkusativ: *Wen
      besuchst du?* Mit *wem* fragt man nach einer Person im Dativ, zum
      Beispiel nach *helfen*, *gehören* und *mit*: *Wem gehört die Jacke?* Mit
      *was* fragt man nach einer Sache. Die Endungen sind wie beim Artikel:
      *wer*, *wen*, *wem* wie *der*, *den*, *dem*. Nach *wer* steht das Verb im
      Singular: *Wer kommt?*

# The article-change table of content/README.md for the question pronouns:
# wer, wen, wem beside der, den, dem, which share their endings.
table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "*Akkusativ*", fa: "حالت *Akkusativ*", de: Akkusativ }
    - { en: "*Dativ*", fa: "حالت *Dativ*", de: Dativ }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [wer (Person), wen, wem, Wen besuchst du? – Meine Oma.]
    - [der (Artikel), den, dem, Ich besuche den Mann.]
    - [was (Sache), was, –, Was kaufst du? – Brot.]

examples:
  - de: Wer ist das? – Das ist mein Bruder.
    en: Who is that? – That's my brother.
    fa: او کیست؟ – برادر من است.
  - de: Wen besuchst du am Wochenende?
    en: Who are you visiting at the weekend?
    fa: آخر هفته به دیدن چه کسی می‌روی؟
  - de: Wem gehört die Jacke?
    en: Whose jacket is this?
    fa: این کت مال کیست؟
  - de: Mit wem gehst du ins Kino?
    en: Who are you going to the cinema with?
    fa: با چه کسی به سینما می‌روی؟
  - de: Was machst du heute?
    en: What are you doing today?
    fa: امروز چه کار می‌کنی؟
  - de: Was ist das? – Das ist ein Geschenk für dich.
    en: What is that? – It's a present for you.
    fa: این چیست؟ – هدیه‌ای برای توست.
  - de: Wer kommt heute Abend? – Anna und Tom.
    en: Who is coming tonight? – Anna and Tom.
    fa: امشب چه کسی می‌آید؟ – آنا و تام.
  - de: Wem hilfst du? – Meiner Nachbarin.
    en: Who are you helping? – My neighbour.
    fa: به چه کسی کمک می‌کنی؟ – به همسایه‌ام.

mistakes:
  - wrong: Wer besuchst du?
    right: Wen besuchst du?
    why:
      en: "*Du* is the subject; the person you ask about is the object, so the *Akkusativ*: *wen*."
      fa: "*du* فاعل است و شخصی که پرسیده می‌شود مفعول است، پس حالت *Akkusativ*: *wen*."
      de: "*Du* ist das Subjekt. Die Person ist das Objekt, also Akkusativ: *wen*."
  - wrong: Wen gehört das Fahrrad?
    right: Wem gehört das Fahrrad?
    why:
      en: "*Gehören* takes the *Dativ*, so the question is *wem*."
      fa: "*gehören* حالت *Dativ* می‌گیرد، پس پرسش با *wem* است."
      de: "*Gehören* hat den Dativ. Darum fragt man mit *wem*."
  - wrong: Wer kommen heute?
    right: Wer kommt heute?
    why:
      en: "After *wer* the verb is singular, even when several people come."
      fa: "پس از *wer* فعل مفرد است، حتی اگر چند نفر بیایند."
      de: "Nach *wer* steht das Verb im Singular, auch bei mehreren Personen."
  - wrong: Mit wen sprichst du?
    right: Mit wem sprichst du?
    why:
      en: "*Mit* takes the *Dativ*, so *mit wem*."
      fa: "*mit* حالت *Dativ* می‌گیرد، پس *mit wem*."
      de: "Nach *mit* steht der Dativ: *mit wem*."

