# Grammar list row 130. The principal parts (stand, gestanden; stellte,
# gestellt), the two past forms of hängen and sich setzen/legen/stellen are B1
# in the list, so this node keeps to the present tense.
id: grammar-130
kind: grammar
level: A2
chapter: a2-prepositions
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-129]
title:
  en: "Position and direction verb pairs"
  fa: "جفت‌فعل‌های مکان و جهت (*stehen* / *stellen* …)"
  de: "Verbpaare für Ort und Richtung (*stehen* / *stellen* …)"

explanations:
  en:
    rule: >
      German has pairs of verbs for a place and for a movement to it.
      *Stehen*, *liegen* and *sitzen* say where something is (*Wo?*), so the
      *Dativ* follows, and they have no object: *Die Vase steht auf dem
      Tisch.* *Stellen*, *legen* and *setzen* say that someone puts something
      there (*Wohin?*), so the *Akkusativ* follows, and they have an object:
      *Ich stelle die Vase auf den Tisch.* *Stehen* and *stellen* are for
      things upright, on their base or their feet (a bottle, a lamp, books on
      a shelf); *liegen* and *legen* for things flat (a key, a newspaper, a
      person in bed); *sitzen* and *setzen* for sitting. *Hängen* is both:
      *Das Bild hängt an der Wand. Ich hänge das Bild an die Wand.* To sit
      down yourself is *sich setzen*, a later topic.
  fa:
    rule: >
      آلمانی برای جای چیزی و برای حرکت به آن‌جا جفت‌فعل دارد. *stehen*،
      *liegen* و *sitzen* می‌گویند چیزی کجاست (*Wo?*)، پس پس از آن‌ها حالت
      *Dativ* (حالت مفعول باواسطه) می‌آید؛ این فعل‌ها مفعول ندارند: *Die Vase
      steht auf dem Tisch.* *stellen*، *legen* و *setzen* می‌گویند کسی چیزی
      را جایی می‌گذارد (*Wohin?*)، پس حالت *Akkusativ* (حالت مفعولی) می‌آید؛
      این فعل‌ها مفعول دارند: *Ich stelle die Vase auf den Tisch.* *stehen* و
      *stellen* برای چیزهای ایستاده‌اند، روی پایه یا پایه‌هایشان (بطری، چراغ،
      کتاب در قفسه)؛ *liegen* و *legen* برای چیزهای خوابیده (کلید، روزنامه،
      کسی که در تخت است)؛ *sitzen* و *setzen* برای حالت نشسته. *hängen* هر دو
      معنا را دارد: *Das Bild hängt an der Wand.* و *Ich hänge das Bild an die
      Wand.* برای نشستن خودِ شخص *sich setzen* به کار می‌رود که موضوع درسی
      دیگر است.
  de:
    rule: >
      Für einen Ort und für eine Bewegung dorthin gibt es Verbpaare. *Stehen*,
      *liegen* und *sitzen* sagen, wo etwas ist (*Wo?*). Danach steht der
      Dativ, und sie haben kein Objekt: *Die Vase steht auf dem Tisch.*
      *Stellen*, *legen* und *setzen* sagen, dass jemand etwas an einen Ort
      bringt (*Wohin?*). Danach steht der Akkusativ, und sie haben ein Objekt:
      *Ich stelle die Vase auf den Tisch.* *Stehen* und *stellen*: Die Sache
      steht gerade, auf dem Boden oder auf Beinen (eine Flasche, eine Lampe,
      Bücher im Regal). *Liegen* und *legen*: Die Sache ist flach (ein
      Schlüssel, eine Zeitung, ein Mensch im Bett). *Sitzen* und *setzen*:
      Jemand sitzt. *Hängen* gibt es für beides: *Das Bild hängt an der Wand.
      Ich hänge das Bild an die Wand.* Selbst Platz nehmen heißt *sich
      setzen*. Das kommt später.

# Three rows: a bottle upright, a bottle flat, a picture on a wall. On the
# left it is there (Wo?), on the right someone puts it there (Wohin?) and the
# dashed shape is where it ends.
diagrams:
  - caption:
      en: >
        On the left a thing is somewhere: *steht*, *liegt*, *hängt* + *Dativ*.
        On the right someone puts it there: *stellt*, *legt*, *hängt* +
        *Akkusativ*. An upright bottle *steht*, a bottle on its side *liegt*.
      fa: >
        در سمت چپ چیزی جایی قرار دارد: *steht*، *liegt*، *hängt* + حالت
        *Dativ*. در سمت راست کسی آن را آن‌جا می‌گذارد: *stellt*، *legt*،
        *hängt* + حالت *Akkusativ*. بطری ایستاده *steht* و بطری خوابیده
        *liegt*.
      de: >
        Links ist eine Sache an einem Ort: *steht*, *liegt*, *hängt* + Dativ.
        Rechts bringt jemand sie dorthin: *stellt*, *legt*, *hängt* +
        Akkusativ. Eine Flasche, die gerade ist, *steht*. Eine Flasche auf der
        Seite *liegt*.
