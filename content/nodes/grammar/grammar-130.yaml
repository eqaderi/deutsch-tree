table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "*Wo?*: *Dativ*", fa: "*Wo?*: حالت *Dativ*", de: "*Wo?*: Dativ" }
    - { en: "*Wohin?*: *Akkusativ*", fa: "*Wohin?*: حالت *Akkusativ*", de: "*Wohin?*: Akkusativ" }
  rows:
    - [der Tisch, Die Vase steht auf dem Tisch., Ich stelle die Vase auf den Tisch.]
    - [die Couch, Die Zeitung liegt auf der Couch., Ich lege die Zeitung auf die Couch.]
    - [das Bett, Das Baby liegt im Bett., Ich lege das Baby ins Bett.]
    - [ein Stuhl, Das Kind sitzt auf einem Stuhl., Ich setze das Kind auf einen Stuhl.]
    - [die Haken (Plural), Die Jacken hängen an den Haken., Ich hänge die Jacken an die Haken.]

examples:
  - de: Die Vase steht auf dem Tisch.
    en: The vase is on the table.
    fa: گلدان روی میز است.
  - de: Ich stelle die Vase auf den Tisch.
    en: I put the vase on the table.
    fa: گلدان را روی میز می‌گذارم.
  - de: Dein Handy liegt neben dem Bett.
    en: Your phone is next to the bed.
    fa: گوشی‌ات کنار تخت است.
  - de: Ich lege dein Handy neben das Bett.
    en: I put your phone next to the bed.
    fa: گوشی‌ات را کنار تخت می‌گذارم.
  - de: Die Kinder sitzen schon im Auto.
    en: The children are already sitting in the car.
    fa: بچه‌ها از قبل در ماشین نشسته‌اند.
  - de: Der Vater setzt das Kind in den Kindersitz.
    en: The father puts the child in the child seat.
    fa: پدر بچه را روی صندلی کودک می‌نشاند.
  - de: Der Mantel hängt an der Garderobe.
    en: The coat is hanging on the coat rack.
    fa: پالتو به جالباسی آویزان است.
  - de: Ich hänge den Mantel an die Garderobe.
    en: I hang the coat on the coat rack.
    fa: پالتو را به جالباسی آویزان می‌کنم.
  - de: Die Bücher stehen im Regal.
    en: The books are on the shelf.
    fa: کتاب‌ها در قفسه‌اند.
  - de: Stell die Flaschen bitte in den Kühlschrank.
    en: Please put the bottles in the fridge.
    fa: بطری‌ها را در یخچال بگذار.

mistakes:
  - wrong: Ich stehe die Vase auf den Tisch.
    right: Ich stelle die Vase auf den Tisch.
    why:
      en: "*Stehen* has no object. To put something upright somewhere is *stellen*."
      fa: "*stehen* مفعول نمی‌گیرد. برای گذاشتن چیزی به‌صورت ایستاده *stellen* به کار می‌رود."
      de: "*Stehen* hat kein Objekt. Wenn man etwas gerade hinstellt, sagt man *stellen*."
  - wrong: Das Buch legt auf dem Tisch.
    right: Das Buch liegt auf dem Tisch.
    why:
      en: "The book is somewhere (*Wo?*) and nobody moves it: *liegen*. *Legen* needs someone who puts something down."
      fa: "کتاب جایی است (*Wo?*) و کسی آن را جابه‌جا نمی‌کند: *liegen*. *legen* کسی را لازم دارد که چیزی را بگذارد."
      de: "Das Buch ist an einem Ort (*Wo?*), niemand bewegt es: *liegen*. Bei *legen* bringt jemand etwas an einen Ort."
  - wrong: Das Kind setzt auf dem Stuhl.
    right: Das Kind sitzt auf dem Stuhl.
    why:
      en: "The child is in a place (*Wo?*): *sitzen*. *Setzen* has an object: *Ich setze das Kind auf den Stuhl.*"
      fa: "بچه جایی است (*Wo?*): *sitzen*. *setzen* مفعول می‌گیرد: *Ich setze das Kind auf den Stuhl.*"
      de: "Das Kind ist an einem Ort (*Wo?*): *sitzen*. *Setzen* hat ein Objekt: *Ich setze das Kind auf den Stuhl.*"
  - wrong: Stell die Tassen auf dem Tisch.
    right: Stell die Tassen auf den Tisch.
    why:
      en: "*Stellen* is a movement (*Wohin?*), so the *Akkusativ* follows: *auf den Tisch*."
      fa: "*stellen* حرکت است (*Wohin?*)، پس حالت *Akkusativ* می‌آید: *auf den Tisch*."
      de: "*Stellen* ist eine Bewegung (*Wohin?*). Darum Akkusativ: *auf den Tisch*."
  - wrong: Die Jacke hängt an die Tür.
    right: Die Jacke hängt an der Tür.
    why:
      en: "Here *hängen* has no object and says where the jacket is (*Wo?*), so the *Dativ*: *an der Tür*."
      fa: "این‌جا *hängen* مفعول ندارد و می‌گوید کت کجاست (*Wo?*)، پس حالت *Dativ* می‌آید: *an der Tür*."
      de: "Hier hat *hängen* kein Objekt und sagt, wo die Jacke ist (*Wo?*). Darum Dativ: *an der Tür*."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Die Vase ___ auf dem Tisch.
    options: [steht, stellt, legt]
    answer: steht
    explanation:
      en: "The vase is somewhere (*Wo?*, *dem Tisch*) and has no object: *stehen*."
      fa: "گلدان جایی است (*Wo?*، *dem Tisch*) و مفعولی در کار نیست: *stehen*."
      de: "Die Vase ist an einem Ort (*Wo?*, *dem Tisch*), ohne Objekt: *stehen*."
  - id: gap-2
    type: gap-fill
    prompt: Ich ___ die Vase auf den Tisch.
    options: [stelle, stehe, liege]
    answer: stelle
    explanation:
      en: "I put the vase there (*Wohin?*, *den Tisch*), and *die Vase* is the object: *stellen*."
      fa: "گلدان را آن‌جا می‌گذارم (*Wohin?*، *den Tisch*) و *die Vase* مفعول است: *stellen*."
      de: "Ich bringe die Vase dorthin (*Wohin?*, *den Tisch*). *Die Vase* ist das Objekt: *stellen*."
  - id: gap-3
    type: gap-fill
    prompt: Der Schlüssel ___ neben dem Handy.
    options: [liegt, legt, sitzt]
    answer: liegt
    explanation:
      en: "A key is flat, and it is somewhere (*Wo?*): *liegen*."
      fa: "کلید چیزی خوابیده است و جایی قرار دارد (*Wo?*): *liegen*."
      de: "Ein Schlüssel ist flach und an einem Ort (*Wo?*): *liegen*."
  - id: gap-4
    type: gap-fill
    prompt: ___ dein Handy bitte nicht auf den Boden!
    options: [Leg, Lieg, Sitz]
    answer: Leg
    explanation:
      en: "Someone puts the phone down (*Wohin?*, *den Boden*), with an object: *legen*, imperative *Leg!*"
      fa: "کسی گوشی را جایی می‌گذارد (*Wohin?*، *den Boden*) و مفعول دارد: *legen*، امر آن *Leg!*"
      de: "Jemand bringt das Handy an einen Ort (*Wohin?*, *den Boden*), mit Objekt: *legen*, Imperativ *Leg!*"
  - id: gap-5
    type: gap-fill
    prompt: Die Kinder ___ schon im Auto.
    options: [sitzen, setzen, stellen]
    answer: sitzen
    explanation:
      en: "The children are somewhere (*Wo?*, *im Auto*) and there is no object: *sitzen*."
      fa: "بچه‌ها جایی هستند (*Wo?*، *im Auto*) و مفعولی در کار نیست: *sitzen*."
      de: "Die Kinder sind an einem Ort (*Wo?*, *im Auto*), ohne Objekt: *sitzen*."
  - id: choice-1
    type: multiple-choice
    prompt: Der Vater ___ das Kind in den Kindersitz.
    options: [setzt, sitzt, liegt]
    answer: setzt
    explanation:
      en: "The father puts the child there (*Wohin?*, *den Kindersitz*), and *das Kind* is the object: *setzen*."
      fa: "پدر بچه را آن‌جا می‌نشاند (*Wohin?*، *den Kindersitz*) و *das Kind* مفعول است: *setzen*."
      de: "Der Vater bringt das Kind dorthin (*Wohin?*, *den Kindersitz*). *Das Kind* ist das Objekt: *setzen*."
  - id: choice-2
    type: multiple-choice
    prompt: Die Flasche ist umgefallen. Jetzt ___ sie auf dem Boden.
    options: [liegt, steht, legt]
    answer: liegt
    explanation:
      en: "The bottle has fallen over, so it is on its side (*Wo?*): *liegen*."
      fa: "بطری افتاده است، پس به پهلو قرار دارد (*Wo?*): *liegen*."
      de: "Die Flasche ist umgefallen. Sie ist jetzt auf der Seite (*Wo?*): *liegen*."
  - id: choice-3
    type: multiple-choice
    prompt: Wohin ___ du die Bücher? – Ins Regal.
    options: [stellst, stehst, liegst]
    answer: stellst
    explanation:
      en: "*Wohin?* asks about a movement with an object (*die Bücher*): *stellen*."
      fa: "*Wohin?* حرکتی با مفعول (*die Bücher*) را می‌پرسد: *stellen*."
      de: "*Wohin?* fragt nach einer Bewegung mit Objekt (*die Bücher*): *stellen*."
  - id: choice-4
    type: multiple-choice
    prompt: Das Bild hängt an ___ Wand.
    options: [der, die, den]
    answer: der
    explanation:
      en: "*Hängen* without an object says where the picture is (*Wo?*): *die Wand* in the *Dativ* is *der Wand*."
      fa: "*hängen* بدون مفعول می‌گوید تابلو کجاست (*Wo?*)؛ *die Wand* در حالت *Dativ* می‌شود *der Wand*."
      de: "*Hängen* ohne Objekt sagt, wo das Bild ist (*Wo?*). *Die Wand* im Dativ: *der Wand*."
  - id: true-1
    type: true-false
    prompt: Ich lege die Zeitung auf den Tisch.
    answer: true
    explanation:
      en: "A newspaper is flat, I put it there (*Wohin?*): *legen* with *auf den Tisch*. The sentence is correct."
      fa: "روزنامه چیزی خوابیده است و آن را آن‌جا می‌گذارم (*Wohin?*): *legen* با *auf den Tisch*. جمله درست است."
      de: "Eine Zeitung ist flach, ich bringe sie dorthin (*Wohin?*): *legen* mit *auf den Tisch*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Das Kind setzt auf dem Stuhl.
