      fa: "بچه جایی است و مفعولی در کار نیست: *Das Kind sitzt auf dem Stuhl.*"
      de: "Das Kind ist an einem Ort, ohne Objekt: *Das Kind sitzt auf dem Stuhl.*"
  - id: true-3
    type: true-false
    prompt: Die Lampe steht neben dem Bett.
    answer: true
    explanation:
      en: "A lamp stands on its base (*Wo?*, *Dativ*): *steht neben dem Bett*. The sentence is correct."
      fa: "چراغ روی پایه‌اش ایستاده است (*Wo?*، حالت *Dativ*): *steht neben dem Bett*. جمله درست است."
      de: "Eine Lampe steht auf ihrem Fuß (*Wo?*, Dativ): *steht neben dem Bett*. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Ich stelle die Tassen in dem Schrank.
    answer: false
    explanation:
      en: "*Stellen* is a movement (*Wohin?*), so the *Akkusativ*: *in den Schrank*."
      fa: "*stellen* حرکت است (*Wohin?*)، پس حالت *Akkusativ* می‌آید: *in den Schrank*."
      de: "*Stellen* ist eine Bewegung (*Wohin?*). Darum Akkusativ: *in den Schrank*."
  - id: typed-gap-1
    type: typed-gap-fill
