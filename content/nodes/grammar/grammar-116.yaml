# Grammar list row 116.
id: grammar-116
kind: grammar
level: B1
chapter: b1-adjectives-participles
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-071, grammar-109]
title:
  en: "Adjective endings in the *Genitiv*"
  fa: "پایانهٔ صفت در حالت *Genitiv*"
  de: "Adjektivendungen im Genitiv"

explanations:
  en:
    rule: >
      In the *Genitiv*, an adjective after an article always ends in *-en*,
      in every gender and in the plural: *wegen des schlechten Wetters*
      (because of the bad weather), *der Name der neuen Kollegin*, *das Haus
      eines alten Freundes*, *die Zimmer meiner kleinen Kinder*. The article
      already shows the case, so the adjective needs no more. Without an
      article, the adjective takes the ending of the missing article where
      it can: *-er*, as in *der*, for feminine and plural nouns (*wegen
      großer Hitze*, *die Meinung junger Leute*). Masculine and neuter nouns
      are the exception: the adjective takes *-en*, not *-es*, because the
      noun already shows the *Genitiv* with its *-(e)s*: *trotz schlechten
      Wetters*, *wegen starken Regens*. These forms are mostly written.
  fa:
    rule: >
      در حالت *Genitiv* (حالت ملکی)، صفتی که پس از حرف تعریف بیاید همیشه
      پایانهٔ *-en* می‌گیرد، با هر جنسی و در جمع: *wegen des schlechten
      Wetters* (به‌خاطر هوای بد)، *der Name der neuen Kollegin*، *das Haus
      eines alten Freundes* و *die Zimmer meiner kleinen Kinder*. خود حرف
      تعریف حالت را نشان می‌دهد و صفت به چیز دیگری نیاز ندارد. بدون حرف
      تعریف، صفت تا جایی که بتواند پایانهٔ حرف تعریفی را می‌گیرد که نیامده
      است: برای اسم مؤنث و جمع *-er*، مانند *der* (*wegen großer Hitze*،
      *die Meinung junger Leute*). اسم مذکر و خنثی استثنا هستند: صفت *-en*
      می‌گیرد، نه *-es*، چون خود اسم با *-(e)s* حالت *Genitiv* را نشان
      می‌دهد: *trotz schlechten Wetters* (با وجود هوای بد) و *wegen starken
      Regens*. این شکل‌ها بیشتر در نوشتار به کار می‌روند.
  de:
    rule: >
      Im Genitiv hat ein Adjektiv nach einem Artikel immer die Endung *-en*,
      bei jedem Genus und im Plural: *wegen des schlechten Wetters*, *der
      Name der neuen Kollegin*, *das Haus eines alten Freundes*, *die Zimmer
      meiner kleinen Kinder*. Der Artikel zeigt schon den Kasus. Ohne Artikel
      bekommt das Adjektiv bei feminin und im Plural die Endung *-er* wie
      *der*: *wegen großer Hitze*, *die Meinung junger Leute*. Bei maskulin
      und neutral ist die Endung *-en*, nicht *-es*, denn das Nomen zeigt den
      Genitiv schon mit *-(e)s*: *trotz schlechten Wetters*, *wegen starken
      Regens*. Diese Formen schreibt man vor allem.

# The article-change table of content/README.md for the Genitiv: first with
# an article (always -en), then without one, where "ein" has no form (–).
table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "*Genitiv*", fa: "حالت *Genitiv*", de: Genitiv }
    - { en: "With *ein*", fa: "با *ein*", de: "Mit *ein*" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [der alte Freund, des alten Freundes, eines alten Freundes, das Haus eines alten Freundes]
    - [die neue Kollegin, der neuen Kollegin, einer neuen Kollegin, der Name der neuen Kollegin]
    - [das kleine Kind, des kleinen Kindes, eines kleinen Kindes, die Eltern des kleinen Kindes]
    - [die alten Häuser (Plural), der alten Häuser, –, die Dächer der alten Häuser]
    - [starker Regen, starken Regens, –, wegen starken Regens]
    - [große Hitze, großer Hitze, –, wegen großer Hitze]
    - [schlechtes Wetter, schlechten Wetters, –, trotz schlechten Wetters]
    - [junge Leute (Plural), junger Leute, –, die Meinung junger Leute]

examples:
  - de: Wegen des schlechten Wetters bleiben wir zu Hause.
    en: Because of the bad weather we are staying at home.
    fa: به‌خاطر هوای بد در خانه می‌مانیم.
  - de: Das ist das Haus eines alten Freundes.
    en: That is the house of an old friend.
    fa: این خانهٔ یکی از دوستان قدیمی من است.
  - de: Wie ist der Name der neuen Kollegin?
    en: What is the new colleague's name?
    fa: اسم همکار جدید چیست؟
  - de: Während der langen Fahrt haben wir viel gelesen.
    en: During the long journey we read a lot.
    fa: در طول سفر طولانی خیلی کتاب خواندیم.
  - de: Am Ende des letzten Jahres bin ich umgezogen.
    en: At the end of last year I moved house.
    fa: آخر سال گذشته اسباب‌کشی کردم.
  - de: Die Zimmer meiner kleinen Kinder sind oben.
    en: My small children's rooms are upstairs.
    fa: اتاق‌های بچه‌های کوچکم طبقهٔ بالاست.
  - de: Trotz schlechten Wetters sind viele Leute gekommen.
    en: Despite bad weather, many people came.
    fa: با وجود هوای بد، آدم‌های زیادی آمدند.
  - de: Wegen großer Hitze ist das Schwimmbad heute voll.
    en: Because of the great heat the swimming pool is full today.
    fa: به‌خاطر گرمای شدید، استخر امروز شلوغ است.
  - de: Die Meinung junger Leute ist uns wichtig.
    en: The opinion of young people is important to us.
    fa: نظر جوانان برای ما مهم است.

mistakes:
  - wrong: Wegen des schlechtes Wetters bleiben wir zu Hause.
    right: Wegen des schlechten Wetters bleiben wir zu Hause.
    why:
      en: "After an article in the *Genitiv* the adjective always ends in *-en*: *des schlechten Wetters*."
      fa: "در حالت *Genitiv*، صفت پس از حرف تعریف همیشه پایانهٔ *-en* می‌گیرد: *des schlechten Wetters*."
      de: "Im Genitiv hat das Adjektiv nach einem Artikel immer *-en*: *des schlechten Wetters*."
  - wrong: Wie ist der Name der neue Kollegin?
    right: Wie ist der Name der neuen Kollegin?
    why:
      en: "*Der neuen Kollegin* is *Genitiv*, not *Nominativ*: after this *der* the ending is *-en*."
      fa: "*der neuen Kollegin* در حالت *Genitiv* است، نه *Nominativ*؛ پس از این *der* پایانه *-en* است."
      de: "*Der neuen Kollegin* ist Genitiv, nicht Nominativ. Nach diesem *der* ist die Endung *-en*."
  - wrong: Das ist das Haus eines alter Freundes.
    right: Das ist das Haus eines alten Freundes.
    why:
      en: "*Eines* shows the case itself, so the adjective takes *-en*. The *-er* of *ein alter Freund* is only for the *Nominativ*."
      fa: "*eines* خودش حالت را نشان می‌دهد، پس صفت *-en* می‌گیرد. *-er* در *ein alter Freund* فقط برای حالت *Nominativ* است."
      de: "*Eines* zeigt den Kasus schon, also hat das Adjektiv *-en*. Das *-er* von *ein alter Freund* gibt es nur im Nominativ."
  - wrong: Trotz schlechtes Wetters sind viele Leute gekommen.
    right: Trotz schlechten Wetters sind viele Leute gekommen.
    why:
      en: "Without an article, a masculine or neuter noun in the *Genitiv* has an adjective in *-en*: the *-s* of *Wetters* already shows the case."
      fa: "بدون حرف تعریف، صفتِ اسم مذکر یا خنثی در حالت *Genitiv* پایانهٔ *-en* می‌گیرد؛ *-s* در *Wetters* خودش حالت را نشان می‌دهد."
      de: "Ohne Artikel hat das Adjektiv bei *der*- und *das*-Nomen im Genitiv *-en*. Das *-s* von *Wetters* zeigt den Kasus schon."
  - wrong: Wegen große Hitze ist das Schwimmbad voll.
    right: Wegen großer Hitze ist das Schwimmbad voll.
    why:
      en: "Without an article, a feminine noun in the *Genitiv* has an adjective in *-er*, the ending of the missing *der*."
      fa: "بدون حرف تعریف، صفتِ اسم مؤنث در حالت *Genitiv* پایانهٔ *-er* می‌گیرد، یعنی پایانهٔ *der* که نیامده است."
      de: "Ohne Artikel hat das Adjektiv bei *die*-Nomen im Genitiv *-er*, wie der Artikel *der*."

