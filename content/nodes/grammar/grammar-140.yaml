      fa: >
        *Ich trinke heute Tee.* و *Heute trinke ich Tee.*: جای *ich* و *heute*
        عوض می‌شود. فعل، که رنگی است، در جایگاه دوم می‌ماند.
      de: >
        *Ich trinke heute Tee.* und *Heute trinke ich Tee.*: *Ich* und *heute*
        tauschen den Platz. Das Verb (farbig) bleibt auf Position 2.
