# Grammar list row 140.
id: grammar-140
kind: grammar
level: A1
chapter: a1-first-sentences
order: 4
status: published
recogniseOnly: false
prerequisites: [grammar-139]
title:
  en: "Inversion"
  fa: "جابه‌جایی فاعل و فعل (*Inversion*)"
  de: "Inversion: Das Subjekt steht nach dem Verb"

explanations:
  en:
    rule: >
      Position 1 does not have to be the subject. A time (*morgen*, *am
      Montag*), a place (*in Berlin*) or another part of the sentence can
      stand there. The verb still stays in position 2, so the subject moves
      behind the verb: *Morgen fahre ich nach Stuttgart.* This is called
      inversion, and it is very common, above all with a time at the start.
      English keeps the subject before the verb ("Tomorrow I go"); German
      does not.
  fa:
    rule: >
      جایگاه اول همیشه از آنِ فاعل نیست. یک قید زمان (*morgen*، *am Montag*)،
      یک قید مکان (*in Berlin*) یا جزء دیگری از جمله هم می‌تواند در آغاز
      بیاید. فعل باز هم در جایگاه دوم می‌ماند، پس فاعل به پس از فعل می‌رود:
      *Morgen fahre ich nach Stuttgart.* به این جابه‌جایی *Inversion* می‌گویند
      و بسیار رایج است، به‌ویژه وقتی جمله با قید زمان آغاز شود. در فارسی
      می‌توان گفت «فردا من می‌روم»، ولی در آلمانی، وقتی جزء دیگری در آغاز آمده
      باشد، فاعل نمی‌تواند پیش از فعل بماند.
  de:
    rule: >
      Auf Position 1 muss nicht das Subjekt stehen. Dort kann auch eine Zeit
      (*morgen*, *am Montag*), ein Ort (*in Berlin*) oder ein anderer Satzteil
      stehen. Das Verb bleibt auf Position 2. Das Subjekt steht dann nach dem
      Verb: *Morgen fahre ich nach Stuttgart.* Das heißt Inversion. Man macht
      das sehr oft, vor allem mit einer Zeit am Anfang.

table:
  columns:
    - { en: Position 1, fa: جایگاه اول, de: Position 1 }
    - { en: "Position 2: verb", fa: "جایگاه دوم: فعل", de: "Position 2: Verb" }
    - { en: Subject, fa: فاعل, de: Subjekt }
    - { en: The rest, fa: بقیهٔ جمله, de: Rest }
  rows:
    - [Ich, fahre, –, morgen nach Stuttgart.]
    - [Morgen, fahre, ich, nach Stuttgart.]
    - [Heute, kocht, mein Vater, –]
    - [Am Montag, beginnt, der Kurs, um 9 Uhr.]
    - [In Hamburg, wohnt, meine Schwester, –]
    - [Jetzt, habe, ich, Zeit.]

# The subject and the time change places; the verb stays in position 2.
