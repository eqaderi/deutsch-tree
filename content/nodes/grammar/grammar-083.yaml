    answer: mich
    explanation:
      en: "*Helfen* takes the *Dativ*: *Kannst du mir bitte helfen?*"
      fa: "*helfen* حالت *Dativ* می‌گیرد: *Kannst du mir bitte helfen?*"
      de: "*Helfen* hat den Dativ: *Kannst du mir bitte helfen?*"
  - id: error-2
    type: find-error
    prompt: Herr Wolf, wie geht es Sie?
    answer: Sie
    explanation:
      en: "Polite *Sie* in the *Dativ* is *Ihnen*: *Wie geht es Ihnen?*"
      fa: "*Sie* رسمی در حالت *Dativ* می‌شود *Ihnen*: *Wie geht es Ihnen?*"
      de: "*Sie* im Dativ ist *Ihnen*: *Wie geht es Ihnen?*"
  - id: match-1
    type: matching
    answer:
      - [ich, mir]
      - [du, dir]
      - [er, ihm]
      - [sie (Plural), ihnen]
      - [Sie, Ihnen]
    explanation:
      en: "The *Dativ* forms: *mir*, *dir*, *ihm*, plural *ihnen* and polite *Ihnen*."
      fa: "شکل‌های حالت *Dativ*: *mir*، *dir*، *ihm*، *ihnen* برای جمع و *Ihnen* رسمی."
      de: "Die Formen im Dativ: *mir*, *dir*, *ihm*, *ihnen* (Plural) und *Ihnen*."

