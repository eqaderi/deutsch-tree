    prompt: Das Hotel ist nicht nur schön, sondern aber günstig.
    answer: aber
    explanation:
      en: "The second half is *sondern auch*: *sondern auch günstig*."
      fa: "بخش دوم *sondern auch* است: *sondern auch günstig*."
      de: "Der zweite Teil ist *sondern auch*: *sondern auch günstig*."
  - id: order-1
    type: word-order
    answers:
      - ["das Hotel ist nicht nur schön,", sondern, auch, sehr günstig]
    explanation:
      en: "*Sondern auch* comes together, right before the second part: *sondern auch sehr günstig*."
      fa: "*sondern auch* با هم و درست پیش از بخش دوم می‌آید: *sondern auch sehr günstig*."
      de: "*Sondern auch* steht zusammen direkt vor dem zweiten Teil: *sondern auch sehr günstig*."
  - id: order-2
    type: word-order
    answers:
      - ["sie singt nicht nur,", sondern, sie, tanzt, auch]
    explanation:
      en: "*Sondern* is position 0, then statement order, *sie tanzt*, and *auch* after the verb."
      fa: "*sondern* در جایگاه صفر است، سپس ترتیب جملهٔ خبری، *sie tanzt*، و *auch* پس از فعل."
      de: "*Sondern* steht auf Position 0. Dann kommt ein Aussagesatz, *sie tanzt*, und *auch* nach dem Verb."

