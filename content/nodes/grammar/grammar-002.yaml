examples:
  - de: Ich bin Lehrerin.
    en: I am a teacher.
    fa: من معلم هستم.
  - de: Bist du müde?
    en: Are you tired?
    fa: خسته‌ای؟
  - de: Wir sind aus dem Iran.
    en: We are from Iran.
    fa: ما اهل ایران هستیم.
  - de: Ihr seid sehr nett.
    en: You (plural) are very kind.
    fa: شما (جمع) خیلی مهربان هستید.
  - de: Hast du heute Zeit?
    en: Do you have time today?
    fa: امروز وقت داری؟
  - de: Meine Schwester hat zwei Kinder.
    en: My sister has two children.
    fa: خواهرم دو فرزند دارد.
  - de: Ich weiß es nicht.
    en: I don't know.
    fa: نمی‌دانم.
  - de: Was tust du am Wochenende?
    en: What do you do at the weekend?
    fa: آخر هفته چه کار می‌کنی؟
  - de: Es tut mir leid.
    en: I am sorry.
    fa: متأسفم.

mistakes:
  - wrong: Ich habe dreißig Jahre alt.
    right: Ich bin dreißig Jahre alt.
    why:
      en: German gives your age with *sein*, not with *haben*.
      fa: در فارسی می‌گوییم «سی سال دارم»، اما آلمانی سن را با *sein* می‌گوید، نه با *haben*.
      de: Das Alter sagt man mit *sein*, nicht mit *haben*.
  - wrong: Ich bin Hunger.
    right: Ich habe Hunger.
    why:
      en: "*Hunger* is a noun, and German says *Hunger haben*, like *Zeit haben* and *Durst haben*."
      fa: "*Hunger* اسم است و آلمانی می‌گوید *Hunger haben*، مانند *Zeit haben* و *Durst haben*."
      de: "*Hunger* ist ein Nomen. Man sagt *Hunger haben*, wie *Zeit haben* und *Durst haben*."
  - wrong: Ihr sind sehr nett.
    right: Ihr seid sehr nett.
    why:
      en: With *ihr* the form of *sein* is *seid*. *Sind* is for *wir*, *sie* and *Sie*.
      fa: صرف *sein* با *ihr* می‌شود *seid*. *sind* برای *wir*، *sie* و *Sie* است.
      de: Bei *ihr* heißt es *seid*. *Sind* ist für *wir*, *sie* und *Sie*.
  - wrong: Er weißt das nicht.
    right: Er weiß das nicht.
    why:
      en: "*Wissen* has no ending with *er/sie/es*: *er weiß*. Only *du* adds *-t*: *du weißt*."
      fa: "*wissen* در سوم‌شخص مفرد شناسه ندارد: *er weiß*. فقط *du* شناسهٔ *-t* می‌گیرد: *du weißt*."
      de: "*Wissen* hat bei *er/sie/es* keine Endung: *er weiß*. Nur bei *du* kommt *-t*: *du weißt*."

