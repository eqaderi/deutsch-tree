title:
  en: "*sein* and *haben* in *Präsens*"
  fa: "*sein* و *haben* در زمان حال"
  de: "*sein* und *haben* im Präsens"

explanations:
  en:
    rule: >
      *Sein* (to be) and *haben* (to have) are the most frequent German verbs,
      and they are irregular: learn their forms by heart. *Wissen* (to know a
      fact) changes its vowel in the singular and has no ending with *ich* and
      *er/sie/es*: *ich weiß*, *du weißt*, *er weiß*. *Tun* (to do) keeps the
      usual endings, but its infinitive ends in *-n* only, so *wir tun* and
      *sie tun* also have just *-n*.
  fa:
    rule: >
      *sein* (بودن) و *haben* (داشتن) پرکاربرد‌ترین فعل‌های آلمانی‌اند و هر دو
      بی‌قاعده‌اند؛ صرف آن‌ها را باید از بر کرد. *wissen* (دانستن، آگاه بودن از
      چیزی) در مفرد واکهٔ دیگری می‌گیرد و در اول‌شخص و سوم‌شخص مفرد شناسه
      ندارد: *ich weiß*، *du weißt*، *er weiß*. *tun* (انجام دادن) شناسه‌های
      معمول را می‌گیرد، اما مصدرش فقط به *-n* ختم می‌شود؛ از این رو *wir tun* و
      *sie tun* نیز فقط *-n* دارند.
  de:
    rule: >
      *Sein* und *haben* sind sehr wichtige Verben. Sie sind unregelmäßig. Man
      lernt die Formen am besten auswendig. Bei *wissen* ändert sich im
      Singular der Vokal, und bei *ich* und *er/sie/es* gibt es keine Endung:
      *ich weiß*, *du weißt*, *er weiß*. *Tun* hat die normalen Endungen, aber
      bei *wir* und *sie* nur *-n*: *wir tun*.

