    type: gap-fill
    prompt: Ich trinke gern ___ Wasser.
    options: [kaltes, kalte, kalten]
    answer: kaltes
    explanation:
      en: "*Wasser* is a *das* noun, so without an article the adjective takes *-es*."
      fa: "*Wasser* اسم خنثی (*das*) است، پس بدون حرف تعریف صفت *-es* می‌گیرد."
      de: "*Wasser* hat den Artikel *das*. Ohne Artikel: *-es*."
  - id: gap-2
    type: gap-fill
    prompt: Wir essen heute ___ Fisch.
    options: [frischen, frischer, frisches]
    answer: frischen
    explanation:
      en: "*Fisch* is masculine and the object (*Akkusativ*), so *-en*, as in *den*."
      fa: "*Fisch* مذکر و مفعول است (حالت *Akkusativ*)، پس *-en*، مانند *den*."
      de: "*Fisch* ist maskulin und im Akkusativ, also *-en* wie bei *den*."
  - id: gap-3
    type: gap-fill
    prompt: Ich trinke Kaffee mit ___ Milch.
    options: [warmer, warme, warmem]
    answer: warmer
    explanation:
      en: "*Mit* takes the *Dativ*; *Milch* is feminine, so *-er*, as in *der*."
      fa: "*mit* با حالت *Dativ* می‌آید و *Milch* مؤنث است، پس *-er*، مانند *der*."
      de: "Nach *mit* steht der Dativ. *Milch* ist feminin, also *-er* wie bei *der*."
  - id: gap-4
    type: gap-fill
    prompt: ___ Kinder spielen im Park.
    options: [Kleine, Kleinen, Kleiner]
    answer: Kleine
    explanation:
      en: "*Kinder* is plural and the subject, without an article: *-e*, as in *die*."
      fa: "*Kinder* جمع و فاعل است و حرف تعریف ندارد: *-e*، مانند *die*."
      de: "*Kinder* ist Plural und Subjekt, ohne Artikel: *-e* wie bei *die*."
  - id: gap-5
    type: gap-fill
    prompt: Bei ___ Wetter fahren wir nicht.
    options: [schlechtem, schlechten, schlechtes]
    answer: schlechtem
    explanation:
      en: "*Bei* takes the *Dativ*; *Wetter* is a *das* noun, so *-em*, as in *dem*."
      fa: "*bei* با حالت *Dativ* می‌آید و *Wetter* خنثی است، پس *-em*، مانند *dem*."
      de: "Nach *bei* steht der Dativ. *Wetter* hat *das*, also *-em* wie bei *dem*."
  - id: choice-1
    type: multiple-choice
    prompt: ___ Wochenende!
    options: [Schönes, Schöne, Schönen]
    answer: Schönes
    explanation:
      en: "*Wochenende* is a *das* noun, so the wish without an article is *Schönes Wochenende!*"
      fa: "*Wochenende* اسم خنثی (*das*) است، پس این آرزو بدون حرف تعریف *Schönes Wochenende!* است."
      de: "*Wochenende* hat den Artikel *das*. Ohne Artikel: *Schönes Wochenende!*"
  - id: choice-2
    type: multiple-choice
    prompt: Mit ___ Grüßen
    options: [freundlichen, freundliche, freundlicher]
    answer: freundlichen
    explanation:
      en: "*Mit* takes the *Dativ*, and in the *Dativ* plural the ending is *-en*, as in *den*."
      fa: "*mit* با حالت *Dativ* می‌آید و در حالت *Dativ* جمع پایانه *-en* است، مانند *den*."
      de: "Nach *mit* steht der Dativ. Im Dativ Plural ist die Endung *-en* wie bei *den*."
  - id: choice-3
    type: multiple-choice
    prompt: Hier gibt es ___ Brot.
    options: [frisches, frische, frischen]
    answer: frisches
    explanation:
      en: "*Brot* is a *das* noun (*es gibt* takes the *Akkusativ*, which is the same for *das*): *-es*."
      fa: "*Brot* اسم خنثی (*das*) است (*es gibt* با حالت *Akkusativ* می‌آید که برای *das* تغییری ندارد): *-es*."
      de: "*Brot* hat den Artikel *das* (*es gibt* + Akkusativ, bei *das* gleich): *-es*."
  - id: true-1
    type: true-false
    prompt: Herzlichen Glückwunsch zum Geburtstag!
    answer: true
    explanation:
      en: "A wish is in the *Akkusativ*: masculine *Glückwunsch* takes *-en*. The sentence is correct."
      fa: "آرزو در حالت *Akkusativ* است و *Glückwunsch* مذکر است، پس *-en*. جمله درست است."
      de: "Ein Wunsch steht im Akkusativ. *Glückwunsch* ist maskulin: *-en*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Ich trinke gern heiße Tee.
    answer: false
    explanation:
      en: "*Tee* is masculine and the object (*Akkusativ*), so *-en*: *heißen Tee*."
      fa: "*Tee* مذکر و مفعول است (حالت *Akkusativ*)، پس *-en*: *heißen Tee*."
      de: "*Tee* ist maskulin und im Akkusativ, also *-en*: *heißen Tee*."
  - id: true-3
    type: true-false
    prompt: Das Zimmer hat große Fenster.
    answer: true
    explanation:
      en: "*Fenster* here is plural and has no article, so *-e*, as in *die*. The sentence is correct."
      fa: "*Fenster* در اینجا جمع است و حرف تعریف ندارد، پس *-e*، مانند *die*. جمله درست است."
      de: "*Fenster* ist hier Plural ohne Artikel, also *-e* wie bei *die*. Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Ich trinke morgens ___ (schwarz) Tee.
    answers: [schwarzen]
    explanation:
      en: "*Tee* is masculine *Akkusativ*: *-en*, as in *den*."
