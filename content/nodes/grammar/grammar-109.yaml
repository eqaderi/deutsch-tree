      de: "*Tee* ist Akkusativ maskulin: *-en* wie bei *den*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Er isst gern ___ (frisch) Obst.
    answers: [frisches]
    explanation:
      en: "*Obst* is a *das* noun: *-es*, as in *das*."
      fa: "*Obst* اسم خنثی (*das*) است: *-es*، مانند *das*."
      de: "*Obst* hat den Artikel *das*: *-es*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Wir suchen eine Wohnung mit ___ (groß) Balkon.
    answers: [großem]
    explanation:
      en: "*Mit* takes the *Dativ*; *Balkon* is masculine, so *-em*, as in *dem*."
      fa: "*mit* با حالت *Dativ* می‌آید و *Balkon* مذکر است، پس *-em*، مانند *dem*."
      de: "Nach *mit* steht der Dativ. *Balkon* ist maskulin, also *-em* wie bei *dem*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: ___ (gut) Morgen, Frau Weber!
    answers: [Guten]
    explanation:
      en: "A greeting is a wish in the *Akkusativ*; *Morgen* is masculine: *Guten Morgen*."
      fa: "سلام آرزویی در حالت *Akkusativ* است و *Morgen* مذکر است: *Guten Morgen*."
      de: "Ein Gruß ist ein Wunsch im Akkusativ. *Morgen* ist maskulin: *Guten Morgen*."
  - id: typed-gap-5
    type: typed-gap-fill
    prompt: Ich mag ___ (rot) Äpfel.
    answers: [rote]
    explanation:
      en: "*Äpfel* is plural without an article: *-e*, as in *die*."
      fa: "*Äpfel* جمع است و حرف تعریف ندارد: *-e*، مانند *die*."
      de: "*Äpfel* ist Plural ohne Artikel: *-e* wie bei *die*."
  - id: error-1
    type: find-error
    prompt: Ich trinke Tee mit kalte Milch.
    answer: kalte
    explanation:
      en: "After *mit* comes the *Dativ*; feminine *Milch* takes *-er*: *mit kalter Milch*."
      fa: "پس از *mit* حالت *Dativ* می‌آید و *Milch* مؤنث است، پس *-er*: *mit kalter Milch*."
      de: "Nach *mit* steht der Dativ. *Milch* ist feminin: *mit kalter Milch*."
  - id: error-2
    type: find-error
    prompt: Ich wasche die Hände mit warmen Wasser.
    answer: warmen
    explanation:
      en: "*Wasser* is a *das* noun in the *Dativ*, and without an article that is *-em*: *mit warmem Wasser*."
      fa: "*Wasser* اسم خنثی در حالت *Dativ* است و بدون حرف تعریف پایانه‌اش *-em* است: *mit warmem Wasser*."
      de: "*Wasser* hat *das* und steht im Dativ. Ohne Artikel: *-em*, also *mit warmem Wasser*."
  - id: match-1
    type: matching
    answer:
      - [___ Kaffee (Nominativ), heißer]
      - [___ Suppe (Nominativ), heiße]
      - [___ Wasser (Nominativ), heißes]
      - [mit ___ Wasser (Dativ), heißem]
    explanation:
      en: "Without an article the adjective takes the article's ending: *der* gives *-er*, *die* gives *-e*, *das* gives *-es*, *dem* gives *-em*."
      fa: "بدون حرف تعریف، صفت پایانهٔ حرف تعریف را می‌گیرد: از *der* پایانهٔ *-er*، از *die* پایانهٔ *-e*، از *das* پایانهٔ *-es* و از *dem* پایانهٔ *-em*."
      de: "Ohne Artikel hat das Adjektiv die Endung vom Artikel: *der* → *-er*, *die* → *-e*, *das* → *-es*, *dem* → *-em*."

