# Grammar list row 109.
id: grammar-109
kind: grammar
level: A2
chapter: a2-adjectives
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-075, grammar-108]
title:
  en: "Adjective endings without article"
  fa: "پایانهٔ صفت بدون حرف تعریف"
  de: "Adjektivendungen ohne Artikel"

explanations:
  en:
    rule: >
      When no article stands before the noun, the adjective takes the ending
      the article would have had, so it shows the gender and the case by
      itself: *der* gives *-er*, *die* gives *-e*, *das* gives *-es*, *den*
      gives *-en*, and *dem* gives *-em*. So *frischer Fisch*, *frische
      Milch*, *frisches Brot*; *Ich esse gern frischen Fisch*; *Tee mit
      frischer Milch*; *bei schlechtem Wetter*. This happens with food,
      drinks and materials, with plurals (*kleine Kinder*), and in many
      greetings and wishes: *Guten Morgen!*, *Schönes Wochenende!*, *Mit
      freundlichen Grüßen*.
  fa:
    rule: >
      وقتی پیش از اسم حرف تعریفی نیاید، صفت همان پایانه‌ای را می‌گیرد که
      حرف تعریف می‌داشت و خودش جنس و حالت اسم را نشان می‌دهد: از *der*
      پایانهٔ *-er*، از *die* پایانهٔ *-e*، از *das* پایانهٔ *-es*، از *den*
      پایانهٔ *-en* و از *dem* پایانهٔ *-em*. بنابراین *frischer Fisch*،
      *frische Milch*، *frisches Brot*؛ *Ich esse gern frischen Fisch*؛ *Tee
      mit frischer Milch*؛ *bei schlechtem Wetter*. این حالت با خوراکی‌ها،
      نوشیدنی‌ها و جنس چیزها پیش می‌آید، با اسم جمع (*kleine Kinder*)، و در
      بسیاری از سلام‌ها و آرزوها: *Guten Morgen!*، *Schönes Wochenende!*،
      *Mit freundlichen Grüßen*.
  de:
    rule: >
      Steht kein Artikel vor dem Nomen, bekommt das Adjektiv die Endung von
      dem Artikel. Es zeigt dann selbst Genus und Kasus: aus *der* wird
      *-er*, aus *die* wird *-e*, aus *das* wird *-es*, aus *den* wird *-en*
      und aus *dem* wird *-em*. Also *frischer Fisch*, *frische Milch*,
      *frisches Brot*; *Ich esse gern frischen Fisch*; *Tee mit frischer
      Milch*; *bei schlechtem Wetter*. Das gibt es bei Essen, Getränken und
      Material, im Plural (*kleine Kinder*) und in vielen Grüßen und
      Wünschen: *Guten Morgen!*, *Schönes Wochenende!*, *Mit freundlichen
      Grüßen*.

# The article-change table of content/README.md without an article: each
# ending is the ending of the article that is missing (der -> -er, dem -> -em).
table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "*Akkusativ*", fa: "حالت *Akkusativ*", de: Akkusativ }
    - { en: "*Dativ*", fa: "حالت *Dativ*", de: Dativ }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [frischer Fisch, frischen Fisch, frischem Fisch, Ich esse gern frischen Fisch.]
    - [frische Milch, frische Milch, frischer Milch, Ich trinke Tee mit frischer Milch.]
    - [frisches Brot, frisches Brot, frischem Brot, Hier gibt es frisches Brot.]
    - [frische Äpfel (Plural), frische Äpfel, frischen Äpfeln, ein Kuchen mit frischen Äpfeln]

examples:
  - de: Ich esse gern frischen Fisch.
    en: I like eating fresh fish.
    fa: ماهی تازه را دوست دارم.
  - de: Ich trinke Kaffee mit warmer Milch.
    en: I drink coffee with warm milk.
    fa: قهوه را با شیر گرم می‌نوشم.
  - de: Kleine Kinder brauchen viel Schlaf.
    en: Small children need a lot of sleep.
    fa: بچه‌های کوچک به خواب زیادی نیاز دارند.
  - de: Bei schlechtem Wetter bleiben wir zu Hause.
    en: In bad weather we stay at home.
    fa: در هوای بد در خانه می‌مانیم.
  - de: Wir suchen eine Wohnung mit großem Balkon.
    en: We are looking for a flat with a big balcony.
    fa: دنبال آپارتمانی با بالکن بزرگ می‌گردیم.
  - de: Der Tisch ist aus altem Holz.
    en: The table is made of old wood.
    fa: این میز از چوب کهنه ساخته شده است.
  - de: Ich habe neue Schuhe gekauft.
    en: I have bought new shoes.
    fa: کفش نو خریده‌ام.
  - de: Schönes Wochenende!
    en: Have a nice weekend!
    fa: آخر هفتهٔ خوبی داشته باشید!
  - de: Herzlichen Glückwunsch zum Geburtstag!
    en: Happy birthday!
    fa: تولدت مبارک!
  - de: Mit freundlichen Grüßen
    en: Kind regards (at the end of a formal letter)
    fa: با احترام (در پایان نامهٔ رسمی)

mistakes:
  - wrong: Ich trinke gern kalte Wasser.
    right: Ich trinke gern kaltes Wasser.
    why:
      en: "*Wasser* is a *das* noun. Without an article the adjective takes the *-es* of *das*."
      fa: "*Wasser* اسم خنثی (*das*) است. بدون حرف تعریف، صفت *-es* حرف تعریف *das* را می‌گیرد."
      de: "*Wasser* hat den Artikel *das*. Ohne Artikel hat das Adjektiv *-es*."
  - wrong: Ich esse gern frische Fisch.
    right: Ich esse gern frischen Fisch.
    why:
      en: "*Fisch* is masculine and the object (*Akkusativ*): *den* gives *-en*."
      fa: "*Fisch* مذکر و مفعول است (حالت *Akkusativ*): از *den* پایانهٔ *-en* می‌آید."
      de: "*Fisch* ist maskulin und steht im Akkusativ: aus *den* wird *-en*."
  - wrong: Wir trinken Tee mit warme Milch.
    right: Wir trinken Tee mit warmer Milch.
    why:
      en: "After *mit* comes the *Dativ*. *Milch* is feminine, and the *Dativ* article *der* gives *-er*."
      fa: "پس از *mit* حالت *Dativ* می‌آید. *Milch* مؤنث است و حرف تعریف *der* در این حالت پایانهٔ *-er* را می‌دهد."
      de: "Nach *mit* steht der Dativ. *Milch* ist feminin, und aus *der* wird *-er*."
  - wrong: Bei schlechten Wetter bleiben wir zu Hause.
    right: Bei schlechtem Wetter bleiben wir zu Hause.
    why:
      en: "Without an article the *Dativ* ending of *der* and *das* nouns is *-em*, like *dem*."
      fa: "بدون حرف تعریف، پایانهٔ حالت *Dativ* اسم مذکر و خنثی *-em* است، مانند *dem*."
      de: "Ohne Artikel ist die Dativ-Endung bei *der* und *das* *-em*, wie bei *dem*."
  - wrong: Gute Morgen!
    right: Guten Morgen!
    why:
      en: "A greeting is a wish (*Ich wünsche dir einen guten Morgen*), so *Morgen* is masculine *Akkusativ*: *-en*."
      fa: "سلام در واقع یک آرزوست (*Ich wünsche dir einen guten Morgen*)، پس *Morgen* در حالت *Akkusativ* مذکر است: *-en*."
      de: "Ein Gruß ist ein Wunsch (*Ich wünsche dir einen guten Morgen*). *Morgen* steht im Akkusativ: *-en*."

questions:
