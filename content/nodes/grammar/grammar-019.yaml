    answers: [sagte]
    explanation:
      en: "*Sagen* is regular: *er sagte*."
      fa: "*sagen* باقاعده است: *er sagte*."
      de: "*Sagen* ist regelmäßig: *er sagte*."
  - id: typed-1
    type: typed-answer
    prompt: "Präteritum: ich komme"
    answers: [ich kam]
    explanation:
      en: "*Kommen* is irregular: *ich kam*."
      fa: "*kommen* بی‌قاعده است: *ich kam*."
      de: "*Kommen* ist unregelmäßig: *ich kam*."
  - id: typed-2
    type: typed-answer
    prompt: "Präteritum: wir gehen"
    answers: [wir gingen]
    explanation:
      en: "*Gehen* is irregular: *wir gingen*."
      fa: "*gehen* بی‌قاعده است: *wir gingen*."
      de: "*Gehen* ist unregelmäßig: *wir gingen*."
  - id: order-1
    type: word-order
    answers:
      - [wann, kam, der Bus]
    end: "?"
    explanation:
      en: "The question word comes first and the verb *kam* second."
      fa: "واژهٔ پرسشی در آغاز و فعل *kam* در جایگاه دوم می‌آید."
      de: "Das Fragewort steht am Anfang, das Verb *kam* auf Position 2."
