    prompt: Gestern Abend ___ wir das Essen sehr gut (finden).
    answers: [fanden]
    explanation:
      en: "*Finden* is irregular, and *wir* adds *-en*: *fanden*."
      fa: "*finden* بی‌قاعده است و با *wir* *-en* می‌گیرد: *fanden*."
      de: "*Finden* ist unregelmäßig, bei *wir* mit *-en*: *fanden*."
  - id: typed-gap-5
    type: typed-gap-fill
