      fa: "واژهٔ پرسشی در آغاز و فعل *fandest* در جایگاه دوم می‌آید."
      de: "Das Fragewort steht am Anfang, das Verb *fandest* auf Position 2."
  - id: match-1
    type: matching
    answer:
      - [kommen, kam]
      - [gehen, ging]
      - [geben, gab]
      - [finden, fand]
      - [sagen, sagte]
    explanation:
      en: "Irregular verbs change their vowel (*kam*, *ging*, *gab*, *fand*); the regular *sagen* adds *-te*."
      fa: "فعل‌های بی‌قاعده واکهٔ خود را تغییر می‌دهند (*kam*، *ging*، *gab*، *fand*)؛ *sagen* باقاعده است و *-te* می‌گیرد."
      de: "Unregelmäßige Verben ändern den Vokal (*kam*, *ging*, *gab*, *fand*); das regelmäßige *sagen* bekommt *-te*."

