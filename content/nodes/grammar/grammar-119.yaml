examples:
  - de: Am Montag beginnt der Kurs.
    en: The course starts on Monday.
    fa: کلاس دوشنبه شروع می‌شود.
  - de: Ich habe am 3. Mai Geburtstag.
    en: My birthday is on the third of May.
    fa: تولدم سوم مه است.
  - de: Am Abend lese ich gern.
    en: In the evening I like to read.
    fa: شب‌ها دوست دارم کتاب بخوانم.
  - de: In der Nacht ist es hier sehr ruhig.
    en: At night it is very quiet here.
    fa: شب‌ها این‌جا خیلی آرام است.
  - de: Der Film beginnt um 20 Uhr.
    en: The film starts at 8 p.m.
    fa: فیلم ساعت ۸ شب شروع می‌شود.
  - de: Wir stehen um halb sieben auf.
    en: We get up at half past six.
    fa: ما ساعت شش و نیم بیدار می‌شویم.
  - de: Im Februar ist es oft kalt.
    en: It is often cold in February.
    fa: در فوریه هوا اغلب سرد است.
  - de: Im Sommer gehen wir oft schwimmen.
    en: In summer we often go swimming.
    fa: تابستان‌ها اغلب به شنا می‌رویم.
  - de: Das Geschäft ist von Montag bis Samstag geöffnet.
    en: The shop is open from Monday to Saturday.
    fa: مغازه از دوشنبه تا شنبه باز است.
  - de: Ich arbeite von 9 bis 17 Uhr.
    en: I work from 9 a.m. to 5 p.m.
    fa: من از ساعت ۹ تا ۱۷ کار می‌کنم.
  - de: Ab Montag habe ich Urlaub.
    en: From Monday on I'm on holiday.
    fa: از دوشنبه به بعد مرخصی هستم.
  - de: Ich bin 1998 geboren.
    en: I was born in 1998.
    fa: من سال ۱۹۹۸ به دنیا آمده‌ام.

mistakes:
  - wrong: Ich komme am 8 Uhr.
    right: Ich komme um 8 Uhr.
    why:
      en: "A clock time takes *um*: *um 8 Uhr*. *Am* is for days, dates and times of day."
      fa: "ساعت با *um* می‌آید: *um 8 Uhr*. *am* برای روز، تاریخ و بخش‌های روز است."
      de: "Bei der Uhrzeit steht *um*: *um 8 Uhr*. *Am* steht bei Tagen, beim Datum und bei Tageszeiten."
  - wrong: Wir fahren in Juli nach Spanien.
    right: Wir fahren im Juli nach Spanien.
    why:
      en: "A month needs the article too: *in dem Juli*, always shortened to *im Juli*."
      fa: "ماه هم حرف تعریف می‌خواهد: *in dem Juli* که همیشه کوتاه می‌شود: *im Juli*."
      de: "Beim Monat braucht man auch den Artikel: *in dem Juli*, immer kurz *im Juli*."
  - wrong: Ich bin in 1998 geboren.
    right: Ich bin 1998 geboren.
    why:
      en: 'English says "in 1998"; German puts no preposition before a year, or says *im Jahr 1998*.'
      fa: "در انگلیسی می‌گویند *in 1998*، ولی آلمانی پیش از سال حرف اضافه نمی‌گذارد؛ یا می‌گوید *im Jahr 1998*."
      de: "Vor einer Jahreszahl steht keine Präposition. Man kann auch sagen: *im Jahr 1998*."
  - wrong: Ich arbeite am Nacht.
    right: Ich arbeite in der Nacht.
    why:
      en: "*Nacht* is the exception among the times of day: *am Morgen*, *am Abend*, but *in der Nacht*."
      fa: "*Nacht* در میان بخش‌های روز استثناست: *am Morgen* و *am Abend*، ولی *in der Nacht*."
      de: "*Nacht* ist die Ausnahme: *am Morgen*, *am Abend*, aber *in der Nacht*."
  - wrong: Im Montag habe ich frei.
    right: Am Montag habe ich frei.
    why:
      en: "Days of the week take *am*. *Im* is for months and seasons."
      fa: "روزهای هفته با *am* می‌آیند. *im* برای ماه‌ها و فصل‌هاست."
      de: "Bei Wochentagen steht *am*. *Im* steht bei Monaten und Jahreszeiten."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Der Kurs beginnt ___ Montag.
    options: [am, um, im]
    answer: am
    explanation:
      en: "A day of the week takes *am*: *am Montag*."
      fa: "روز هفته با *am* می‌آید: *am Montag*."
      de: "Beim Wochentag steht *am*: *am Montag*."
  - id: gap-2
    type: gap-fill
    prompt: Wir essen ___ 19 Uhr.
    options: [um, am, im]
    answer: um
    explanation:
      en: "A clock time takes *um*: *um 19 Uhr*."
      fa: "ساعت با *um* می‌آید: *um 19 Uhr*."
      de: "Bei der Uhrzeit steht *um*: *um 19 Uhr*."
  - id: gap-3
    type: gap-fill
    prompt: ___ Winter ist es kalt.
    options: [Im, Am, Um]
    answer: Im
    explanation:
      en: "A season takes *im*: *im Winter*."
      fa: "فصل با *im* می‌آید: *im Winter*."
      de: "Bei Jahreszeiten steht *im*: *im Winter*."
  - id: gap-4
    type: gap-fill
    prompt: Das Baby schläft ___ Nacht nicht gut.
    options: [in der, am, im]
    answer: in der
    explanation:
      en: "*Nacht* is the exception: *in der Nacht*, not *am*."
      fa: "*Nacht* استثناست: *in der Nacht*، نه *am*."
      de: "*Nacht* ist die Ausnahme: *in der Nacht*, nicht *am*."
  - id: gap-5
    type: gap-fill
    prompt: Die Praxis ist von Montag ___ Freitag geöffnet.
    options: [bis, ab, um]
    answer: bis
    explanation:
      en: "*Von … bis* gives the start and the end: *von Montag bis Freitag*."
      fa: "*von … bis* آغاز و پایان را نشان می‌دهد: *von Montag bis Freitag*."
      de: "*Von … bis* sagt Anfang und Ende: *von Montag bis Freitag*."
  - id: choice-1
    type: multiple-choice
    prompt: Wann hast du Geburtstag? – ___ 12. Oktober.
    options: [Am, Im, Um]
    answer: Am
    explanation:
      en: "A date takes *am*: *am 12. Oktober*."
      fa: "تاریخ با *am* می‌آید: *am 12. Oktober*."
      de: "Beim Datum steht *am*: *am 12. Oktober*."
  - id: choice-2
    type: multiple-choice
    prompt: Mein Bruder ist ___ geboren.
    options: ["1990", im 1990, in 1990]
    answer: "1990"
    explanation:
      en: "A year stands alone, with no preposition: *Er ist 1990 geboren*."
      fa: "سال تنها و بدون حرف اضافه می‌آید: *Er ist 1990 geboren*."
      de: "Vor der Jahreszahl steht keine Präposition: *Er ist 1990 geboren*."
  - id: choice-3
    type: multiple-choice
    prompt: Der Laden ist neu. Er ist ___ heute geöffnet.
    options: [ab, um, im]
    answer: ab
    explanation:
      en: "*Ab* gives a start with no end: *ab heute*, from today on."
      fa: "*ab* آغازی را می‌گوید که پایان ندارد: *ab heute*، یعنی از امروز به بعد."
      de: "*Ab* sagt einen Anfang ohne Ende: *ab heute*."
  - id: true-1
    type: true-false
    prompt: Wir treffen uns um halb acht.
    answer: true
    explanation:
      en: "A clock time takes *um*. The sentence is correct."
      fa: "ساعت با *um* می‌آید. جمله درست است."
      de: "Bei der Uhrzeit steht *um*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Im Sonntag gehen wir spazieren.
    answer: false
    explanation:
      en: "A day of the week takes *am*: *am Sonntag*."
      fa: "روز هفته با *am* می‌آید: *am Sonntag*."
      de: "Beim Wochentag steht *am*: *am Sonntag*."
  - id: true-3
    type: true-false
    prompt: Meine Mutter arbeitet in der Nacht.
    answer: true
    explanation:
      en: "*Nacht* takes *in der*, not *am*. The sentence is correct."
      fa: "*Nacht* با *in der* می‌آید، نه با *am*. جمله درست است."
      de: "Bei *Nacht* steht *in der*, nicht *am*. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Sie ist in 2001 geboren.
    answer: false
    explanation:
      en: "No preposition before a year: *Sie ist 2001 geboren*."
      fa: "پیش از سال حرف اضافه نمی‌آید: *Sie ist 2001 geboren*."
      de: "Vor der Jahreszahl steht keine Präposition: *Sie ist 2001 geboren*."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Der Zug fährt genau ___ 6 Uhr ab.
    answers: [um]
    explanation:
      en: "An exact clock time takes *um*: *um 6 Uhr*."
      fa: "ساعت دقیق با *um* می‌آید: *um 6 Uhr*."
      de: "Bei der genauen Uhrzeit steht *um*: *um 6 Uhr*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Wir fahren ___ (in) August nach Italien.
    answers: [im]
    explanation:
      en: "A month takes *im*, short for *in dem*: *im August*."
      fa: "ماه با *im* می‌آید که کوتاه‌شدهٔ *in dem* است: *im August*."
      de: "Beim Monat steht *im*, kurz für *in dem*: *im August*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Ich habe ___ (an) Wochenende Zeit.
    answers: [am]
    explanation:
      en: "*Das Wochenende* takes *am*, short for *an dem*: *am Wochenende*."
      fa: "*das Wochenende* با *am* می‌آید که کوتاه‌شدهٔ *an dem* است: *am Wochenende*."
      de: "Bei *das Wochenende* steht *am*, kurz für *an dem*: *am Wochenende*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Das Café ist ___ 8 bis 18 Uhr geöffnet.
    answers: [von]
    explanation:
      en: "*Bis* gives the end; the start goes with *von*: *von 8 bis 18 Uhr*."
      fa: "*bis* پایان را می‌گوید و آغاز با *von* می‌آید: *von 8 bis 18 Uhr*."
      de: "*Bis* sagt das Ende, den Anfang sagt *von*: *von 8 bis 18 Uhr*."
  - id: typed-1
    type: typed-answer
    prompt: "Wann? an + der Abend"
    answers: [am Abend, an dem Abend]
    explanation:
      en: "*An dem Abend* is almost always said as *am Abend*."
      fa: "*an dem Abend* تقریباً همیشه کوتاه می‌شود: *am Abend*."
      de: "*An dem Abend* sagt man fast immer kurz: *am Abend*."
  - id: error-1
    type: find-error
    prompt: Der Unterricht beginnt am 9 Uhr.
    answer: am
    explanation:
      en: "A clock time takes *um*: *um 9 Uhr*."
      fa: "ساعت با *um* می‌آید: *um 9 Uhr*."
      de: "Bei der Uhrzeit steht *um*: *um 9 Uhr*."
  - id: error-2
    type: find-error
    prompt: Wir arbeiten von Montag ab Freitag.
    answer: ab
    explanation:
      en: "*Von* goes with *bis*: *von Montag bis Freitag*."
      fa: "*von* با *bis* همراه می‌شود: *von Montag bis Freitag*."
      de: "Zu *von* gehört *bis*: *von Montag bis Freitag*."
  - id: order-1
    type: word-order
    answers:
      - [der Unterricht, beginnt, um acht Uhr]
      - [um acht Uhr, beginnt, der Unterricht]
    explanation:
      en: "The verb comes second. The time can stand first or last."
      fa: "فعل در جایگاه دوم می‌آید. قید زمان می‌تواند در آغاز یا پایان جمله باشد."
      de: "Das Verb steht an Position 2. Die Zeit kann am Anfang oder am Ende stehen."
  - id: match-1
    type: matching
    answer:
      - [___ Dienstag, am]
      - [___ 10 Uhr, um]
      - [___ Frühling, im]
      - [___ Nacht, in der]
    explanation:
      en: "A day takes *am*, a clock time *um*, a season *im*, and *Nacht* takes *in der*."
      fa: "روز با *am*، ساعت با *um* و فصل با *im* می‌آید؛ *Nacht* با *in der*."
      de: "Beim Tag steht *am*, bei der Uhrzeit *um*, bei der Jahreszeit *im*, bei *Nacht* *in der*."

