# Grammar list row 119.
id: grammar-119
kind: grammar
level: A1
chapter: a1-prepositions
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-191, grammar-192]
title:
  en: "Temporal: *am*, *um*, *im*, *von … bis*, *ab*"
  fa: "حرف‌های اضافهٔ زمان: *am*، *um*، *im*، *von … bis*، *ab*"
  de: "Zeit: *am*, *um*, *im*, *von … bis*, *ab*"

explanations:
  en:
    rule: >
      To say when, German uses a few fixed prepositions. *Am* goes with days,
      dates and times of day: *am Montag*, *am 3. Mai*, *am Abend*, *am
      Wochenende*. The one exception is *in der Nacht*. *Um* goes with clock
      times: *um 8 Uhr*, *um halb sieben*. *Im* goes with months and seasons:
      *im Februar*, *im Sommer*. *Am* is short for *an dem* and *im* for *in
      dem*: the article is in the *Dativ*. *Von … bis* gives a start and an
      end: *von Montag bis Freitag*. *Ab* gives only the start: *ab Montag*,
      from Monday on. A year takes no preposition: *Ich bin 1998 geboren*, or
      *im Jahr 1998*.
  fa:
    rule: >
      آلمانی برای بیان زمان چند حرف اضافهٔ ثابت دارد. *am* با روزهای هفته،
      تاریخ و بخش‌های روز می‌آید: *am Montag*، *am 3. Mai*، *am Abend* و *am
      Wochenende*. تنها استثنا *in der Nacht* است. *um* با ساعت می‌آید: *um
      8 Uhr* و *um halb sieben*. *im* با ماه‌ها و فصل‌ها می‌آید: *im Februar*
      و *im Sommer*. *am* کوتاه‌شدهٔ *an dem* است و *im* کوتاه‌شدهٔ *in dem*؛
      یعنی حرف تعریف در حالت *Dativ* (حالت مفعول باواسطه) است. *von … bis*
      آغاز و پایان یک بازه را نشان می‌دهد: *von Montag bis Freitag*. *ab* فقط
      آغاز را می‌گوید: *ab Montag*، یعنی از دوشنبه به بعد. سال حرف اضافه
      نمی‌گیرد: *Ich bin 1998 geboren* یا *im Jahr 1998*.
  de:
    rule: >
      Für die Zeit gibt es feste Präpositionen. *Am* steht bei Tagen, beim
      Datum und bei Tageszeiten: *am Montag*, *am 3. Mai*, *am Abend*, *am
      Wochenende*. Aber: *in der Nacht*. *Um* steht bei der Uhrzeit: *um 8
      Uhr*, *um halb sieben*. *Im* steht bei Monaten und Jahreszeiten: *im
      Februar*, *im Sommer*. *Am* ist kurz für *an dem*, *im* für *in dem*:
      Der Artikel steht im Dativ. *Von … bis* sagt Anfang und Ende: *von
      Montag bis Freitag*. *Ab* sagt nur den Anfang: *ab Montag*. Vor einer
      Jahreszahl steht keine Präposition: *Ich bin 1998 geboren* oder *im Jahr
      1998*.

