      en: >
        A week from Monday (*Mo*) to Sunday (*So*). *Von Montag bis Freitag*
        has a start and an end. *Ab Samstag* has only a start: the arrow goes
        on.
      fa: >
        یک هفته از دوشنبه (*Mo*) تا یکشنبه (*So*). *von Montag bis Freitag*
        آغاز و پایان دارد. *ab Samstag* فقط آغاز دارد و پیکان ادامه پیدا
        می‌کند.
      de: >
        Eine Woche von Montag (*Mo*) bis Sonntag (*So*). *Von Montag bis
        Freitag* hat einen Anfang und ein Ende. *Ab Samstag* hat nur einen
        Anfang: Der Pfeil geht weiter.
