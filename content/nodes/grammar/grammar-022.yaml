# Grammar list row 22. A2 scope: having something done. Allowing, the Perfekt
# with lassen, lassen as "leave" and the reflexive come at B1.
id: grammar-022
kind: grammar
level: A2
chapter: a2-werden-lassen-passive
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-003, grammar-144]
title:
  en: "*lassen* + *Infinitiv*"
  fa: "*lassen* + مصدر"
  de: "*lassen* + Infinitiv"

explanations:
  en:
    rule: >
      *Lassen* + infinitive says that you do not do something yourself: you
      have someone else do it for you, often a firm or an expert. *Ich lasse
      mein Auto reparieren.* (I'm having my car repaired.) Compare *Ich
      repariere mein Auto*: I do it myself. *Lassen* is conjugated and stands
      in position 2; the infinitive goes to the end, without *zu*, and closes
      the *Satzklammer*. With *du* and *er* / *sie* / *es* the vowel takes an
      umlaut: *du lässt*, *er lässt*; but *ihr lasst*.
  fa:
    rule: >
      *lassen* + مصدر یعنی کاری را خودتان انجام نمی‌دهید، بلکه کس دیگری،
      اغلب یک شرکت یا متخصص، آن را برایتان انجام می‌دهد: *Ich lasse mein
      Auto reparieren.* (ماشینم را می‌دهم تعمیر کنند.) مقایسه کنید: *Ich
      repariere mein Auto.* یعنی خودم آن را تعمیر می‌کنم. *lassen* صرف
      می‌شود و در جایگاه دوم می‌آید؛ مصدر بدون *zu* به پایان جمله می‌رود و
      قاب جمله (*Satzklammer*) را می‌بندد. واکهٔ *lassen* با *du* و
      *er/sie/es* دو نقطه (*Umlaut*) می‌گیرد: *du lässt*، *er lässt*؛ اما
      *ihr lasst*.
  de:
    rule: >
      Mit *lassen* + Infinitiv sagt man: Ich mache das nicht selbst. Eine
      andere Person macht es für mich, oft eine Firma oder ein Fachmann. *Ich
      lasse mein Auto reparieren.* Das heißt: Eine Werkstatt repariert es.
      *Ich repariere mein Auto* heißt: Ich mache es selbst. *Lassen* steht auf
      Position 2, der Infinitiv ohne *zu* am Ende (Satzklammer). Bei *du* und
      *er/sie/es* hat *lassen* einen Umlaut: *du lässt*, *er lässt*. Aber:
      *ihr lasst*.

