table:
  columns:
    - { en: Person, fa: شخص, de: Person }
    - { en: "*lassen*", fa: "*lassen*", de: "*lassen*" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [ich, lasse, Ich lasse mein Auto reparieren.]
    - [du, lässt, Du lässt die Jacke reinigen.]
    - [er / sie / es, lässt, Sie lässt ihr Handy reparieren.]
    - [wir, lassen, Wir lassen das Bad renovieren.]
    - [ihr, lasst, Ihr lasst die Küche streichen.]
    - [sie / Sie, lassen, Sie lassen eine Pizza liefern.]

examples:
  - de: Ich lasse mein Auto in der Werkstatt reparieren.
    en: I'm having my car repaired at the garage.
    fa: ماشینم را به تعمیرگاه می‌دهم تا تعمیرش کنند.
  - de: Lässt du deine Jacke reinigen?
    en: Are you having your jacket cleaned?
    fa: کاپشنت را به خشک‌شویی می‌دهی؟
  - de: Frau Krause lässt ihre Wohnung streichen.
    en: Ms Krause is having her flat painted.
    fa: خانم کراوزه آپارتمانش را می‌دهد رنگ کنند.
  - de: Wir lassen heute Abend eine Pizza liefern.
    en: We're having a pizza delivered tonight.
    fa: امشب پیتزا سفارش می‌دهیم.
  - de: Ich repariere mein Fahrrad selbst, aber mein Nachbar lässt sein Fahrrad reparieren.
    en: I repair my bike myself, but my neighbour has his repaired.
    fa: من دوچرخه‌ام را خودم تعمیر می‌کنم، اما همسایه‌ام دوچرخه‌اش را برای تعمیر می‌برد.
  - de: Die Firma lässt die Büros jeden Abend putzen.
    en: The company has the offices cleaned every evening.
    fa: شرکت هر شب دفترها را می‌دهد تمیز کنند.
  - de: Wo lasst ihr eure Fotos drucken?
    en: Where do you (plural) have your photos printed?
    fa: شما (جمع) عکس‌هایتان را کجا چاپ می‌کنید؟
  - de: Herr Wolf lässt seine Uhr reparieren.
    en: Mr Wolf is having his watch repaired.
    fa: آقای وولف ساعتش را برای تعمیر می‌برد.

mistakes:
  - wrong: Ich lasse reparieren mein Auto.
    right: Ich lasse mein Auto reparieren.
    why:
      en: "The infinitive goes to the very end of the sentence."
      fa: "مصدر به پایان جمله می‌رود."
      de: "Der Infinitiv steht ganz am Ende."
  - wrong: Er lasst sein Auto reparieren.
    right: Er lässt sein Auto reparieren.
    why:
      en: "With *er*, *sie* and *es* the form is *lässt*, with an umlaut."
      fa: "با *er*، *sie* و *es* صورت فعل *lässt* است، با دو نقطه (*Umlaut*)."
      de: "Bei *er*, *sie* und *es* heißt es *lässt*, mit Umlaut."
  - wrong: Ich lasse meine Jacke gereinigt.
    right: Ich lasse meine Jacke reinigen.
    why:
      en: 'After *lassen* comes the infinitive, not the *Partizip II*, although English says "have it cleaned".'
      fa: "پس از *lassen* مصدر می‌آید، نه صفت مفعولی (*Partizip II*)."
      de: "Nach *lassen* steht der Infinitiv, nicht das Partizip II."
  - wrong: Wir lassen das Bad zu renovieren.
    right: Wir lassen das Bad renovieren.
    why:
      en: "*Lassen* takes the infinitive without *zu*, as a modal verb does."
      fa: "*lassen* مانند فعل وجهی، مصدر را بدون *zu* می‌گیرد."
      de: "Nach *lassen* steht der Infinitiv ohne *zu*, wie bei einem Modalverb."

