    explanation:
      en: "With *ich* the form is *lasse*."
      fa: "با *ich* صورت فعل *lasse* است."
      de: "Bei *ich* heißt es *lasse*."
  - id: gap-2
    type: gap-fill
    prompt: ___ du deine Jacke reinigen?
    options: [Lasse, Lasst, Lässt]
    answer: Lässt
    explanation:
      en: "With *du* the form is *lässt*, with an umlaut."
      fa: "با *du* صورت فعل *lässt* است، با دو نقطه (*Umlaut*)."
      de: "Bei *du* heißt es *lässt*, mit Umlaut."
