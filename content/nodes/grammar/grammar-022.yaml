      fa: "با *ihr* صورت فعل *lasst* است، بدون دو نقطه (*Umlaut*)."
      de: "Bei *ihr* heißt es *lasst*, ohne Umlaut."
  - id: gap-4
    type: gap-fill
    prompt: Frau Krause lässt ihre Wohnung ___.
    options: [gestrichen, streichen, zu streichen]
    answer: streichen
    explanation:
      en: "After *lassen* comes the infinitive, without *zu*: *streichen*."
      fa: "پس از *lassen* مصدر بدون *zu* می‌آید: *streichen*."
      de: "Nach *lassen* steht der Infinitiv ohne *zu*: *streichen*."
  - id: gap-5
    type: gap-fill
    prompt: Unsere Nachbarn ___ das Dach reparieren.
    options: [lassen, lässt, lasst]
    answer: lassen
    explanation:
      en: "*Unsere Nachbarn* is plural (*sie*), so the form is *lassen*."
      fa: "*unsere Nachbarn* سوم‌شخص جمع است (*sie*)، پس صورت فعل *lassen* است."
      de: "*Unsere Nachbarn* ist Plural (*sie*). Darum heißt es *lassen*."
  - id: choice-1
    type: multiple-choice
    prompt: Ich lasse meine Uhr reparieren.
    options:
      - Ich repariere meine Uhr selbst.
      - Meine Uhr ist schon repariert.
      - Eine andere Person repariert meine Uhr.
    answer: Eine andere Person repariert meine Uhr.
    explanation:
      en: "*Lassen* + infinitive: someone else does the work for me."
      fa: "*lassen* + مصدر یعنی کس دیگری کار را برایم انجام می‌دهد."
      de: "*Lassen* + Infinitiv: Eine andere Person macht die Arbeit für mich."
  - id: choice-2
    type: multiple-choice
    prompt: Tom repariert sein Fahrrad selbst.
    options:
      - Eine Werkstatt repariert Toms Fahrrad.
      - Tom macht die Arbeit allein.
      - Tom lässt sein Fahrrad reparieren.
    answer: Tom macht die Arbeit allein.
    explanation:
      en: "Without *lassen*, Tom does it himself. *Er lässt es reparieren* would mean someone else does it."
      fa: "بدون *lassen*، تام کار را خودش انجام می‌دهد. *er lässt es reparieren* یعنی کس دیگری آن را تعمیر می‌کند."
      de: "Ohne *lassen* macht Tom es selbst. *Er lässt es reparieren* heißt: Eine andere Person macht es."
  - id: choice-3
    type: multiple-choice
    prompt: Tom kann sein Auto nicht selbst reparieren. Er ___ es in der Werkstatt reparieren.
    options: [hat, lässt, ist]
    answer: lässt
    explanation:
      en: "The garage does the work for him: *er lässt es reparieren*."
      fa: "تعمیرگاه کار را برایش انجام می‌دهد: *er lässt es reparieren*."
      de: "Die Werkstatt macht die Arbeit für ihn: *Er lässt es reparieren.*"
  - id: true-1
    type: true-false
    prompt: Er lässt sein Handy reparieren.
    answer: true
    explanation:
      en: "*Er lässt* with an umlaut, and the infinitive at the end. The sentence is correct."
      fa: "*er lässt* با دو نقطه (*Umlaut*)، و مصدر در پایان جمله. جمله درست است."
      de: "*Er lässt* mit Umlaut, der Infinitiv am Ende. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Ich lasse meinen Mantel gereinigt.
    answer: false
    explanation:
      en: "After *lassen* comes the infinitive: *Ich lasse meinen Mantel reinigen.*"
      fa: "پس از *lassen* مصدر می‌آید: *Ich lasse meinen Mantel reinigen.*"
      de: "Nach *lassen* steht der Infinitiv: *Ich lasse meinen Mantel reinigen.*"
  - id: true-3
    type: true-false
    prompt: Du lasst die Fenster putzen.
    answer: false
    explanation:
      en: "With *du* the form is *lässt*, with an umlaut: *Du lässt die Fenster putzen.*"
      fa: "با *du* صورت فعل *lässt* است، با دو نقطه (*Umlaut*): *Du lässt die Fenster putzen.*"
      de: "Bei *du* heißt es *lässt*, mit Umlaut: *Du lässt die Fenster putzen.*"
  - id: true-4
    type: true-false
    prompt: Wir lassen am Samstag eine Pizza liefern.
    answer: true
    explanation:
      en: "*Wir lassen* in position 2, *liefern* at the end. The sentence is correct."
      fa: "*wir lassen* در جایگاه دوم و *liefern* در پایان جمله. جمله درست است."
      de: "*Wir lassen* auf Position 2, *liefern* am Ende. Der Satz ist richtig."
