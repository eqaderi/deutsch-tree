# Grammar list row 186.
id: grammar-186
kind: grammar
level: B1
chapter: b1-two-part-connectors
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-184]
title:
  en: "*sowohl … als auch*"
  fa: "*sowohl … als auch*"
  de: "*sowohl … als auch*"

explanations:
  en:
    rule: >
      *Sowohl … als auch* (both … and) says that two things are both true. It
      is a stronger *und*, and the two parts weigh the same. *Sowohl* stands
      right before the first part, *als auch* before the second: *Ich trinke
      sowohl Kaffee als auch Tee.* It joins words and parts of a sentence, and
      as before *und*, there is no comma before *als auch*. For two whole
      clauses, use *nicht nur … sondern auch*. *Sowohl … wie auch* means the
      same. With two subjects the verb is usually plural: *Sowohl mein Vater
      als auch meine Mutter arbeiten hier.*
  fa:
    rule: >
      *sowohl … als auch* (هم … هم) می‌گوید که هر دو چیز درست است. این حرف
      ربط دوجزئی همان *und* است با تأکید بیشتر، و دو بخش آن هم‌وزن‌اند.
      *sowohl* درست پیش از بخش اول می‌آید و *als auch* پیش از بخش دوم: *Ich
      trinke sowohl Kaffee als auch Tee.* این حرف ربط واژه‌ها و بخش‌های جمله
      را به هم وصل می‌کند و، مانند پیش از *und*، پیش از *als auch* ویرگول
      نمی‌آید. برای وصل کردن دو جملهٔ کامل از *nicht nur … sondern auch*
      استفاده می‌شود. *sowohl … wie auch* نیز همین معنا را دارد. اگر دو فاعل
      با آن بیایند، فعل معمولاً جمع است: *Sowohl mein Vater als auch meine
      Mutter arbeiten hier.*
  de:
    rule: >
      Mit *sowohl … als auch* sagt man: Beides stimmt. Es ist wie ein starkes
      *und*. Beide Teile sind gleich wichtig. *Sowohl* steht direkt vor dem
      ersten Teil, *als auch* vor dem zweiten: *Ich trinke sowohl Kaffee als
      auch Tee.* Man verbindet damit Wörter und Satzteile. Wie vor *und*
      steht vor *als auch* kein Komma. Für zwei ganze Sätze nimmt man *nicht
      nur … sondern auch*. *Sowohl … wie auch* bedeutet das Gleiche. Bei zwei
      Subjekten steht das Verb meistens im Plural: *Sowohl mein Vater als auch
      meine Mutter arbeiten hier.*

table:
  columns:
    - { en: "First part: *sowohl*", fa: "بخش اول: *sowohl*", de: "Erster Teil: *sowohl*" }
    - { en: "Second part: *als auch*", fa: "بخش دوم: *als auch*", de: "Zweiter Teil: *als auch*" }
  rows:
    - [Ich trinke sowohl Kaffee, als auch Tee.]
    - [Sie spricht sowohl Arabisch, als auch Persisch.]
    - [Das Restaurant ist sowohl mittags, als auch abends geöffnet.]
    - [Der Kurs ist sowohl für Anfänger, als auch für Fortgeschrittene.]
    - [Sowohl mein Vater, als auch meine Mutter arbeiten hier.]

examples:
  - de: Ich trinke sowohl Kaffee als auch Tee.
    en: I drink both coffee and tea.
    fa: هم قهوه می‌نوشم، هم چای.
  - de: Sie spricht sowohl Arabisch als auch Persisch.
    en: She speaks both Arabic and Persian.
    fa: او هم عربی صحبت می‌کند، هم فارسی.
  - de: Das Restaurant ist sowohl mittags als auch abends geöffnet.
    en: The restaurant is open both at lunchtime and in the evening.
    fa: رستوران هم ظهرها باز است، هم شب‌ها.
  - de: Der Kurs ist sowohl für Anfänger als auch für Fortgeschrittene.
    en: The course is for both beginners and advanced learners.
    fa: این دوره هم برای مبتدی‌هاست، هم برای پیشرفته‌ها.
  - de: Wir haben sowohl in Hamburg als auch in München gewohnt.
    en: We have lived both in Hamburg and in Munich.
    fa: ما هم در هامبورگ زندگی کرده‌ایم، هم در مونیخ.
  - de: Man kann sowohl bar als auch mit Karte bezahlen.
    en: You can pay both in cash and by card.
    fa: هم می‌توان نقد پرداخت کرد، هم با کارت.
  - de: Die Wohnung ist sowohl hell als auch ruhig.
    en: The flat is both bright and quiet.
    fa: آپارتمان هم روشن است، هم آرام.
  - de: Sowohl mein Vater als auch meine Mutter arbeiten im Krankenhaus.
    en: Both my father and my mother work at the hospital.
    fa: هم پدرم و هم مادرم در بیمارستان کار می‌کنند.

mistakes:
  - wrong: Ich trinke sowohl Kaffee und auch Tee.
    right: Ich trinke sowohl Kaffee als auch Tee.
    why:
      en: "*Sowohl* goes with *als auch*, not with *und auch*."
      fa: "*sowohl* با *als auch* می‌آید، نه با *und auch*."
      de: "Zu *sowohl* gehört *als auch*, nicht *und auch*."
  - wrong: Ich trinke sowohl Kaffee, als auch Tee.
    right: Ich trinke sowohl Kaffee als auch Tee.
    why:
      en: "No comma before *als auch*, just as there is none before *und*."
      fa: "پیش از *als auch* ویرگول نمی‌آید، همان‌طور که پیش از *und* نمی‌آید."
      de: "Vor *als auch* steht kein Komma, so wie vor *und*."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Ich trinke sowohl Kaffee ___ auch Tee.
    options: [oder, und, als]
    answer: als
    explanation:
      en: "*Sowohl* goes with *als auch*."
      fa: "*sowohl* با *als auch* می‌آید."
      de: "Zu *sowohl* gehört *als auch*."
  - id: gap-2
    type: gap-fill
    prompt: ___ mein Vater als auch meine Mutter arbeiten im Krankenhaus.
    options: [Entweder, Sowohl, Weder]
    answer: Sowohl
    explanation:
      en: "*Als auch* is the second half of *sowohl … als auch*. *Entweder* goes with *oder*, *weder* with *noch*."
      fa: "*als auch* بخش دوم *sowohl … als auch* است. *entweder* با *oder* می‌آید و *weder* با *noch*."
      de: "*Als auch* ist der zweite Teil von *sowohl … als auch*. *Entweder* steht mit *oder*, *weder* mit *noch*."
  - id: gap-3
    type: gap-fill
    prompt: Das Restaurant ist sowohl mittags als ___ abends geöffnet.
    options: [noch, auch, oder]
    answer: auch
    explanation:
      en: "The second half is *als auch*: open at lunchtime and in the evening."
      fa: "بخش دوم *als auch* است: هم ظهر باز است و هم شب."
      de: "Der zweite Teil ist *als auch*: mittags und abends geöffnet."
  - id: choice-1
    type: multiple-choice
    prompt: Ich spiele sowohl Gitarre als auch Klavier.
    options: [Ich spiele nur Gitarre., Ich spiele keins von beiden., Ich spiele beides.]
    answer: Ich spiele beides.
    explanation:
      en: "*Sowohl … als auch*: both, the guitar and the piano."
      fa: "*sowohl … als auch* یعنی هر دو: هم گیتار و هم پیانو."
      de: "*Sowohl … als auch* heißt: beides, Gitarre und Klavier."
  - id: choice-2
    type: multiple-choice
    prompt: "Welcher Satz ist richtig?"
    options:
      [
        "Wir waren sowohl in Rom und auch in Paris.",
        "Wir waren sowohl in Rom, als auch in Paris.",
        "Wir waren sowohl in Rom als auch in Paris.",
      ]
    answer: Wir waren sowohl in Rom als auch in Paris.
    explanation:
      en: "*Sowohl* goes with *als auch*, and there is no comma before *als auch*."
      fa: "*sowohl* با *als auch* می‌آید و پیش از *als auch* ویرگول نمی‌آید."
      de: "Zu *sowohl* gehört *als auch*, und davor steht kein Komma."
  - id: choice-3
    type: multiple-choice
    prompt: Der Kurs ist ___ für Anfänger als auch für Fortgeschrittene.
    options: [sowohl, entweder, nicht nur]
    answer: sowohl
    explanation:
      en: "*Als auch* is answered by *sowohl* in the first half."
      fa: "جفت *als auch* در بخش اول *sowohl* است."
      de: "Zu *als auch* gehört im ersten Teil *sowohl*."
  - id: true-1
    type: true-false
    prompt: Ich esse sowohl Fisch als auch Fleisch.
    answer: true
    explanation:
      en: "*Sowohl* before the first thing, *als auch* before the second, no comma. The sentence is correct."
      fa: "*sowohl* پیش از چیز اول و *als auch* پیش از چیز دوم آمده و ویرگولی نیست. جمله درست است."
      de: "*Sowohl* vor dem ersten Teil, *als auch* vor dem zweiten, kein Komma. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Ich esse sowohl Fisch, als auch Fleisch.
    answer: false
    explanation:
      en: "There is no comma before *als auch*: *sowohl Fisch als auch Fleisch*."
      fa: "پیش از *als auch* ویرگول نمی‌آید: *sowohl Fisch als auch Fleisch*."
      de: "Vor *als auch* steht kein Komma: *sowohl Fisch als auch Fleisch*."
  - id: true-3
    type: true-false
    prompt: Wir haben sowohl in Hamburg als auch in München gewohnt.
    answer: true
    explanation:
      en: "*Sowohl … als auch* joins two places in the middle of the sentence. The sentence is correct."
      fa: "*sowohl … als auch* دو مکان را در میانهٔ جمله به هم وصل می‌کند. جمله درست است."
      de: "*Sowohl … als auch* verbindet zwei Orte in der Satzmitte. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Die Wohnung ist sowohl hell und ruhig.
    answer: false
    explanation:
      en: "*Sowohl* needs *als auch*: *sowohl hell als auch ruhig*."
      fa: "*sowohl* به *als auch* نیاز دارد: *sowohl hell als auch ruhig*."
      de: "Zu *sowohl* gehört *als auch*: *sowohl hell als auch ruhig*."
  - id: true-5
    type: true-false
    prompt: Man kann sowohl bar wie auch mit Karte bezahlen.
    answer: true
    explanation:
      en: "*Sowohl … wie auch* means the same as *sowohl … als auch*. The sentence is correct."
      fa: "*sowohl … wie auch* همان معنای *sowohl … als auch* را دارد. جمله درست است."
      de: "*Sowohl … wie auch* bedeutet das Gleiche wie *sowohl … als auch*. Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Meine Kinder essen sowohl Obst ___ auch Gemüse.
    answers: [als, wie]
    explanation:
      en: "*Sowohl … als auch*: *sowohl Obst als auch Gemüse*. *Wie auch* is right too."
      fa: "*sowohl … als auch*: *sowohl Obst als auch Gemüse*. *wie auch* نیز درست است."
      de: "*Sowohl … als auch*: *sowohl Obst als auch Gemüse*. Auch *wie auch* ist richtig."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Das Hotel hat sowohl ein Schwimmbad als ___ eine Sauna.
    answers: [auch]
    explanation:
      en: "The second half is *als auch*."
      fa: "بخش دوم *als auch* است."
      de: "Der zweite Teil ist *als auch*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: ___ Tom als auch Lisa kommen zur Party.
    answers: [Sowohl]
    explanation:
      en: "*Als auch* is answered by *Sowohl* in the first half."
      fa: "جفت *als auch* در بخش اول *Sowohl* است."
      de: "Zu *als auch* gehört im ersten Teil *Sowohl*."
  - id: error-1
    type: find-error
    prompt: Er spricht sowohl Deutsch und auch Englisch.
    answer: und
    explanation:
      en: "*Sowohl* goes with *als auch*: *sowohl Deutsch als auch Englisch*."
      fa: "*sowohl* با *als auch* می‌آید: *sowohl Deutsch als auch Englisch*."
      de: "Zu *sowohl* gehört *als auch*: *sowohl Deutsch als auch Englisch*."
  - id: error-2
    type: find-error
    prompt: Wir besuchen sowohl Wien oder auch Graz.
    answer: oder
    explanation:
      en: "*Sowohl* goes with *als auch*: *sowohl Wien als auch Graz*."
      fa: "*sowohl* با *als auch* می‌آید: *sowohl Wien als auch Graz*."
      de: "Zu *sowohl* gehört *als auch*: *sowohl Wien als auch Graz*."
  - id: order-1
    type: word-order
    answers:
      - [ich, trinke, sowohl Kaffee, als auch Tee]
      - [sowohl Kaffee, als auch Tee, trinke, ich]
    explanation:
      en: "The verb comes second. *Sowohl Kaffee als auch Tee* stays together, first or after the verb."
      fa: "فعل در جایگاه دوم می‌آید. *sowohl Kaffee als auch Tee* با هم می‌ماند، در آغاز جمله یا پس از فعل."
      de: "Das Verb steht auf Position 2. *Sowohl Kaffee als auch Tee* bleibt zusammen, am Anfang oder nach dem Verb."

