title:
  en: "Clock time, informal and official"
  fa: "ساعت: گفتاری و رسمی"
  de: "Uhrzeit, informell und offiziell"

explanations:
  en:
    rule: >
      *Wie spät ist es?* or *Wie viel Uhr ist es?* asks the time, and *um*
      says at what time: *um acht Uhr*. The official time, on the radio, at
      the station and in writing, counts 24 hours: the hour, then *Uhr*, then
      the minutes, so *18.30 Uhr* is *achtzehn Uhr dreißig*. In everyday
      speech people count 12 hours and say the minutes first, with *nach*
      (past) or *vor* (to): *zehn nach sechs*, *Viertel vor acht*. *Halb*
      looks ahead to the next hour: *halb acht* is 7.30, not 8.30.
  fa:
    rule: >
      برای پرسیدن ساعت می‌گویند *Wie spät ist es?* یا *Wie viel Uhr ist es?*
      و برای گفتن زمان یک کار، حرف اضافهٔ *um* می‌آید: *um acht Uhr* (ساعت
      هشت). ساعت رسمی، مثلاً در رادیو، در ایستگاه قطار و در نوشته‌ها،
      بیست‌وچهارساعته است: اول ساعت، سپس *Uhr* و بعد دقیقه. پس *18.30 Uhr*
      را *achtzehn Uhr dreißig* می‌خوانند. در گفت‌وگوی روزمره ساعت را
      دوازده‌ساعته می‌گویند و دقیقه را پیش از ساعت، با *nach* (گذشته از) یا
      *vor* (مانده به): *zehn nach sechs* (شش و ده دقیقه)، *Viertel vor acht*
      (یک ربع به هشت). *halb* به ساعت بعد اشاره دارد: *halb acht* یعنی هفت و
      نیم، نه هشت و نیم.
  de:
    rule: >
      Nach der Uhrzeit fragt man: *Wie spät ist es?* oder *Wie viel Uhr ist
      es?* Für einen Zeitpunkt sagt man *um*: *um acht Uhr*. Offiziell, im
      Radio, am Bahnhof und in Texten, hat der Tag 24 Stunden: zuerst die
      Stunde, dann *Uhr*, dann die Minuten. *18.30 Uhr* sagt man *achtzehn Uhr
      dreißig*. Im Alltag zählt man nur bis zwölf und sagt zuerst die
      Minuten, mit *nach* oder *vor*: *zehn nach sechs*, *Viertel vor acht*.
      *Halb* zählt schon zur nächsten Stunde: *halb acht* ist 7.30 Uhr.

