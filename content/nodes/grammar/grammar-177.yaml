# Grammar list row 177.
id: grammar-177
kind: grammar
level: A2
chapter: a2-relative-clauses
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-079, grammar-157]
title:
  en: "Relative clause, *Nominativ*"
  fa: "جملهٔ موصولی در حالت *Nominativ*"
  de: "Relativsatz im Nominativ"

explanations:
  en:
    rule: >
      A relative clause (*Relativsatz*) says more about a noun: *Wer ist die
      Frau, die dort rechts steht?* Where English has "who", "which" or
      "that", German has a relative pronoun, and it looks like the definite
      article: *der*, *die*, *das*, and *die* for the plural. It takes the
      gender and number of the noun it refers to: *der Mann, der …*, *die
      Frau, die …*, *das Kind, das …*, *die Leute, die …*. The grammatical
      gender counts, not the person's sex: *das Mädchen, das …*. When the
      pronoun is the subject of the relative clause, it is in the
      *Nominativ*, whatever the case of the noun in the main clause: *Ich
      habe einen Bruder, der in Hamburg wohnt.* A relative clause is a
      subordinate clause: a comma comes before it, and its conjugated verb
      goes to the end, in the form that fits the noun (*die Kinder, die dort
      spielen*). It usually stands right after its noun.
  fa:
    rule: >
      جملهٔ موصولی (*Relativsatz*) دربارهٔ یک اسم توضیح بیشتری می‌دهد: *Wer
      ist die Frau, die dort rechts steht?* در فارسی این کار را «که» انجام
      می‌دهد و همیشه یکسان است؛ در آلمانی جملهٔ موصولی با ضمیر موصولی آغاز
      می‌شود که شکل حرف تعریف معین را دارد: *der*، *die*، *das* و برای جمع
      *die*. ضمیر موصولی با اسمی که به آن برمی‌گردد هم‌جنس و هم‌شمار است:
      *der Mann, der …*، *die Frau, die …*، *das Kind, das …* و *die Leute,
      die …*. ملاک، جنس دستوری اسم است، نه جنس طبیعی: *das Mädchen, das …*.
      اگر ضمیر موصولی فاعل جملهٔ موصولی باشد، در حالت *Nominativ* (حالت
      فاعلی) می‌آید و حالت اسم در جملهٔ پایه در آن اثری ندارد: *Ich habe
      einen Bruder, der in Hamburg wohnt.* جملهٔ موصولی نوعی جملهٔ پیرو است:
      پیش از آن ویرگول می‌آید و فعل صرف‌شدهٔ آن به پایان جمله می‌رود، با
      شناسه‌ای که با همان اسم جور است (*die Kinder, die dort spielen*). این
      جمله معمولاً درست پس از اسم خود می‌آید.
  de:
    rule: >
      Ein Relativsatz sagt mehr über ein Nomen: *Wer ist die Frau, die dort
      rechts steht?* Er beginnt mit einem Relativpronomen. Es sieht aus wie
      der Artikel: *der*, *die*, *das* und im Plural *die*. Das
      Relativpronomen passt zum Nomen: *der Mann, der …*, *die Frau, die …*,
      *das Kind, das …*, *die Leute, die …*. Wichtig ist der Artikel, nicht
      Mann oder Frau: *das Mädchen, das …*. Ist das Relativpronomen im
      Relativsatz das Subjekt, steht es im Nominativ. Der Kasus vom Nomen im
      Hauptsatz ist dabei egal: *Ich habe einen Bruder, der in Hamburg
      wohnt.* Der Relativsatz ist ein Nebensatz: Vor ihm steht ein Komma, und
      das konjugierte Verb steht am Ende. Das Verb passt zum Nomen: *die
      Kinder, die dort spielen*. Meistens steht der Relativsatz direkt nach
      dem Nomen.

