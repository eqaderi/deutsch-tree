examples:
  - de: Wer ist die Frau, die dort rechts steht?
    en: Who is the woman standing over there on the right?
    fa: خانمی که آنجا سمت راست ایستاده است کیست؟
  - de: Das ist der Bus, der zum Bahnhof fährt.
    en: This is the bus that goes to the station.
    fa: این همان اتوبوسی است که به ایستگاه قطار می‌رود.
  - de: Ich suche ein Hotel, das nicht so teuer ist.
    en: I'm looking for a hotel that isn't so expensive.
    fa: دنبال هتلی می‌گردم که چندان گران نباشد.
  - de: Wir haben Nachbarn, die sehr nett sind.
    en: We have neighbours who are very nice.
    fa: همسایه‌هایی داریم که خیلی مهربان‌اند.
  - de: Ich habe einen Bruder, der in Hamburg wohnt.
    en: I have a brother who lives in Hamburg.
    fa: برادری دارم که در هامبورگ زندگی می‌کند.
  - de: Wie heißt das Mädchen, das neben dir sitzt?
    en: What's the name of the girl sitting next to you?
    fa: اسم دختری که کنارت نشسته چیست؟
  - de: Das ist ein Film, der mir sehr gut gefällt.
    en: This is a film that I like very much.
    fa: این فیلمی است که خیلی از آن خوشم می‌آید.
  - de: Hast du einen Kollegen, der Spanisch sprechen kann?
    en: Do you have a colleague who can speak Spanish?
    fa: همکاری داری که بتواند اسپانیایی حرف بزند؟
  - de: Wo sind die Kinder, die hier gespielt haben?
    en: Where are the children who were playing here?
    fa: بچه‌هایی که این‌جا بازی می‌کردند کجا هستند؟

mistakes:
  - wrong: Wer ist die Frau, die steht dort rechts?
    right: Wer ist die Frau, die dort rechts steht?
    why:
      en: "A relative clause is a subordinate clause: its conjugated verb goes to the end."
      fa: "جملهٔ موصولی جملهٔ پیرو است و فعل صرف‌شدهٔ آن به پایان جمله می‌رود."
      de: "Der Relativsatz ist ein Nebensatz. Das konjugierte Verb steht am Ende."
  - wrong: Das ist der Mann, die neben uns wohnt.
    right: Das ist der Mann, der neben uns wohnt.
    why:
      en: "*Mann* is a *der* noun, so the relative pronoun is *der*."
      fa: "*Mann* اسم مذکر (*der*) است، پس ضمیر موصولی هم *der* است."
      de: "*Mann* hat den Artikel *der*. Darum ist das Relativpronomen *der*."
  - wrong: Ich habe einen Bruder, den in Hamburg wohnt.
    right: Ich habe einen Bruder, der in Hamburg wohnt.
    why:
      en: "The pronoun is the subject of *wohnt*, so it is in the *Nominativ*: *der*. *Einen* belongs to the main clause and does not count."
      fa: "ضمیر موصولی فاعل *wohnt* است، پس در حالت *Nominativ* می‌آید: *der*. *einen* به جملهٔ پایه تعلق دارد و در انتخاب ضمیر اثری ندارد."
      de: "Das Relativpronomen ist das Subjekt von *wohnt*. Darum Nominativ: *der*. *Einen* gehört zum Hauptsatz."
  - wrong: Kennst du das Mädchen, die dort singt?
    right: Kennst du das Mädchen, das dort singt?
    why:
      en: "*Mädchen* is a *das* noun, so the pronoun is *das*, even though a girl is female."
      fa: "*Mädchen* اسم خنثی (*das*) است، پس ضمیر موصولی *das* است، هرچند دختر مؤنث است."
      de: "*Mädchen* hat den Artikel *das*. Darum heißt das Relativpronomen *das*."
  - wrong: Ich habe zwei Freunde, die in Berlin wohnt.
    right: Ich habe zwei Freunde, die in Berlin wohnen.
    why:
      en: "*Die* stands for *Freunde*, a plural, so the verb takes the plural form: *wohnen*."
      fa: "*die* به *Freunde* برمی‌گردد که جمع است، پس فعل نیز جمع می‌آید: *wohnen*."
      de: "*Die* steht für *Freunde*, also Plural. Darum: *wohnen*."
  - wrong: Das ist der Kollege, wer mir immer hilft.
    right: Das ist der Kollege, der mir immer hilft.
    why:
      en: 'English says "who", but German does not use *wer* here: after a noun the relative pronoun is *der*, *die* or *das*.'
      fa: "این‌جا *wer* به کار نمی‌رود: پس از اسم، ضمیر موصولی *der*، *die* یا *das* است."
      de: "Nach einem Nomen steht nicht *wer*, sondern *der*, *die* oder *das*."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Wer ist die Frau, ___ dort rechts steht?
    options: [der, das, die]
    answer: die
    explanation:
      en: "*Frau* is a *die* noun, and the pronoun is the subject of *steht*: *die*."
      fa: "*Frau* اسم مؤنث (*die*) است و ضمیر موصولی فاعل *steht* است: *die*."
      de: "*Frau* hat den Artikel *die*, und das Pronomen ist das Subjekt: *die*."
  - id: gap-2
    type: gap-fill
    prompt: Das ist der Bus, ___ zum Bahnhof fährt.
    options: [der, die, den]
    answer: der
    explanation:
      en: "*Bus* is a *der* noun, and the pronoun is the subject of *fährt*, so it is in the *Nominativ*: *der*."
      fa: "*Bus* اسم مذکر (*der*) است و ضمیر موصولی فاعل *fährt* است، پس در حالت *Nominativ* می‌آید: *der*."
      de: "*Bus* hat den Artikel *der*. Das Pronomen ist das Subjekt, also Nominativ: *der*."
  - id: gap-3
    type: gap-fill
    prompt: Ich suche ein Hotel, ___ nicht so teuer ist.
    options: [der, die, das]
    answer: das
    explanation:
      en: "*Hotel* is a *das* noun, so the relative pronoun is *das*."
      fa: "*Hotel* اسم خنثی (*das*) است، پس ضمیر موصولی *das* است."
      de: "*Hotel* hat den Artikel *das*. Das Relativpronomen ist *das*."
  - id: gap-4
    type: gap-fill
    prompt: Wo sind die Kinder, ___ hier gespielt haben?
    options: [die, der, das]
    answer: die
    explanation:
      en: "*Kinder* is plural, and the plural relative pronoun is *die*."
      fa: "*Kinder* جمع است و ضمیر موصولی جمع *die* است."
      de: "*Kinder* ist Plural. Im Plural heißt das Relativpronomen *die*."
  - id: gap-5
    type: gap-fill
    prompt: Ich habe zwei Freunde, die in Berlin ___.
    options: [wohnt, wohnen, wohnst]
    answer: wohnen
    explanation:
      en: "*Die* stands for *Freunde*, a plural, so the verb is *wohnen*."
      fa: "*die* به *Freunde* برمی‌گردد که جمع است، پس فعل *wohnen* است."
      de: "*Die* steht für *Freunde*, also Plural: *wohnen*."
  - id: choice-1
    type: multiple-choice
    prompt: Ich kenne die Frau, …
    options: [die arbeitet im Café., die im Café arbeitet., arbeitet die im Café.]
    answer: die im Café arbeitet.
    explanation:
      en: "The relative pronoun comes first in the relative clause, and the conjugated verb goes to the end."
      fa: "ضمیر موصولی در آغاز جملهٔ موصولی می‌آید و فعل صرف‌شده در پایان آن."
      de: "Das Relativpronomen steht am Anfang vom Relativsatz, das konjugierte Verb am Ende."
  - id: choice-2
    type: multiple-choice
    prompt: Ich habe einen Kollegen, ___ sehr gut kocht.
    options: [den, dem, der]
    answer: der
    explanation:
      en: "The pronoun is the subject of *kocht*, so it is in the *Nominativ*: *der*. *Einen Kollegen* belongs to the main clause."
      fa: "ضمیر موصولی فاعل *kocht* است، پس در حالت *Nominativ* می‌آید: *der*. *einen Kollegen* به جملهٔ پایه تعلق دارد."
      de: "Das Pronomen ist das Subjekt von *kocht*, also Nominativ: *der*. *Einen Kollegen* gehört zum Hauptsatz."
  - id: true-1
    type: true-false
    prompt: Wir suchen eine Wohnung, die einen Balkon hat.
    answer: true
    explanation:
      en: "*Wohnung* is a *die* noun, the pronoun *die* is the subject, and *hat* is at the end. The sentence is correct."
      fa: "*Wohnung* اسم مؤنث (*die*) است، ضمیر *die* فاعل است و *hat* در پایان آمده است. جمله درست است."
      de: "*Wohnung* hat den Artikel *die*, das Pronomen *die* ist das Subjekt, und *hat* steht am Ende. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Das ist das Hotel, der am Bahnhof liegt.
    answer: false
    explanation:
      en: "*Hotel* is a *das* noun, so the pronoun is *das*: *das Hotel, das am Bahnhof liegt*."
      fa: "*Hotel* اسم خنثی (*das*) است، پس ضمیر موصولی *das* است: *das Hotel, das am Bahnhof liegt*."
      de: "*Hotel* hat den Artikel *das*. Richtig ist: *das Hotel, das am Bahnhof liegt*."
  - id: true-3
    type: true-false
    prompt: Hier sind die Kollegen, die mir immer helfen.
    answer: true
    explanation:
      en: "*Kollegen* is plural: the pronoun *die* and the verb *helfen* fit it. The sentence is correct."
      fa: "*Kollegen* جمع است و ضمیر *die* و فعل *helfen* با آن جورند. جمله درست است."
      de: "*Kollegen* ist Plural. Das Pronomen *die* und das Verb *helfen* passen. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Ich habe einen Bruder, den in Hamburg wohnt.
    answer: false
    explanation:
      en: "The pronoun is the subject of *wohnt*, so it is in the *Nominativ*: *der in Hamburg wohnt*."
      fa: "ضمیر موصولی فاعل *wohnt* است، پس در حالت *Nominativ* می‌آید: *der in Hamburg wohnt*."
      de: "Das Pronomen ist das Subjekt von *wohnt*, also Nominativ: *der in Hamburg wohnt*."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Das ist der Mann, ___ neben uns wohnt.
