      de: "*Mann* hat den Artikel *der*, und das Pronomen ist das Subjekt: *der*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Ich kaufe die Lampe, ___ dort im Fenster steht.
    answers: [die, welche]
    explanation:
      en: "*Lampe* is a *die* noun, so the relative pronoun is *die*."
      fa: "*Lampe* اسم مؤنث (*die*) است، پس ضمیر موصولی *die* است."
      de: "*Lampe* hat den Artikel *die*. Das Relativpronomen ist *die*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Kennst du ein Café, ___ auch am Sonntag geöffnet hat?
    answers: [das, welches]
    explanation:
      en: "*Café* is a *das* noun, so the relative pronoun is *das*."
      fa: "*Café* اسم خنثی (*das*) است، پس ضمیر موصولی *das* است."
      de: "*Café* hat den Artikel *das*. Das Relativpronomen ist *das*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Ich habe eine Nachbarin, die sehr gut Deutsch ___ (sprechen).
    answers: [spricht]
    explanation:
      en: "*Die* stands for one woman, so the verb is in the third person singular: *spricht*, at the end."
      fa: "*die* به یک نفر برمی‌گردد، پس فعل سوم‌شخص مفرد است و در پایان می‌آید: *spricht*."
      de: "*Die* steht für eine Person. Darum: *spricht*, am Ende."
  - id: error-1
    type: find-error
    prompt: Das ist die Frau, der neben mir wohnt.
    answer: der
    explanation:
      en: "*Frau* is a *die* noun, so the pronoun is *die*: *die neben mir wohnt*."
      fa: "*Frau* اسم مؤنث (*die*) است، پس ضمیر موصولی *die* است: *die neben mir wohnt*."
      de: "*Frau* hat den Artikel *die*. Richtig ist: *die neben mir wohnt*."
  - id: error-2
    type: find-error
    prompt: Ich habe eine Freundin, die in Wien wohnen.
    answer: wohnen
    explanation:
      en: "*Die* stands for one *Freundin*, so the verb is singular: *wohnt*."
      fa: "*die* به یک *Freundin* برمی‌گردد که مفرد است، پس فعل نیز مفرد است: *wohnt*."
      de: "*Die* steht für eine *Freundin*, also Singular: *wohnt*."
  - id: error-3
    type: find-error
    prompt: Kennst du das Mädchen, die dort singt?
    answer: die
    explanation:
      en: "*Mädchen* is a *das* noun, so the pronoun is *das*, even though a girl is female."
      fa: "*Mädchen* اسم خنثی (*das*) است، پس ضمیر موصولی *das* است، هرچند دختر مؤنث است."
      de: "*Mädchen* hat den Artikel *das*. Darum: *das dort singt*."
  - id: order-1
    type: word-order
    answers:
      - ["das ist der Mann,", der, neben uns, wohnt]
    explanation:
      en: "The relative pronoun *der* comes right after the comma, and the verb *wohnt* goes to the end."
      fa: "ضمیر موصولی *der* درست پس از ویرگول می‌آید و فعل *wohnt* به پایان جمله می‌رود."
      de: "Das Relativpronomen *der* steht nach dem Komma, das Verb *wohnt* am Ende."
  - id: order-2
    type: word-order
    answers:
      - ["ich habe eine Freundin,", die, sehr gut, kochen, kann]
    explanation:
      en: "With a modal verb, the conjugated *kann* comes last, after the infinitive *kochen*."
      fa: "با فعل وجهی، *kann* که صرف‌شده است در آخر می‌آید، پس از مصدر *kochen*."
      de: "Mit Modalverb steht das konjugierte *kann* ganz am Ende, nach dem Infinitiv *kochen*."
  - id: match-1
    type: matching
    answer:
      - ["Wir haben einen Hund,", der gern schwimmt.]
      - ["Wir haben eine Katze,", die viel schläft.]
      - ["Wir haben ein Pferd,", das schnell läuft.]
      - ["Wir haben zwei Kinder,", die zur Schule gehen.]
    explanation:
      en: "The pronoun follows the noun: *Hund* → *der*, *Katze* → *die*, *Pferd* → *das*. Plural *Kinder* takes *die* and a plural verb: *gehen*."
      fa: "ضمیر موصولی از اسم پیروی می‌کند: *der* برای *Hund*، *die* برای *Katze* و *das* برای *Pferd*. *Kinder* جمع است و *die* و فعل جمع *gehen* می‌گیرد."
      de: "Das Pronomen passt zum Nomen: *der Hund*, *die Katze*, *das Pferd*. *Kinder* ist Plural: *die* und das Verb *gehen*."

