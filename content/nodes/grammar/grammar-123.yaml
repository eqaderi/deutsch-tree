# Grammar list row 123.
id: grammar-123
kind: grammar
level: A1
chapter: a1-prepositions
order: 5
status: published
recogniseOnly: false
prerequisites: [grammar-121]
title:
  en: "Local, *Woher?*: *aus*; *von*"
  fa: "مبدأ، *Woher?*: *aus* و *von*"
  de: "Herkunft, *Woher?*: *aus*; *von*"

explanations:
  en:
    rule: >
      To say where someone or something comes from (*Woher?*), German uses
      *aus* and *von*. Both always take the *Dativ*. *Aus* is out of a place
      you were in: a room, a building, a city or a country. So it also says
      where a person is from: *aus der Küche*, *aus dem Kino*, *aus Berlin*,
      *aus dem Iran*. *Von* is away from a person, an activity or a place you
      were at: *von meiner Freundin*, *vom Arzt*, *von der Arbeit*. *Von dem*
      is shortened to *vom*. So *aus* answers *in*, and *von* answers *zu* and
      *bei*: *im Kino* – *aus dem Kino*, *beim Arzt* – *vom Arzt*. *Von zu
      Hause* means from home.
  fa:
    rule: >
      برای گفتن این‌که کسی یا چیزی از کجا می‌آید (*Woher?*)، آلمانی *aus* و
      *von* را به کار می‌برد. هر دو همیشه با حالت *Dativ* (حالت مفعول
      باواسطه) می‌آیند. *aus* یعنی بیرون آمدن از جایی که درونش بوده‌اید: یک
      اتاق، یک ساختمان، یک شهر یا یک کشور. به همین دلیل *aus* اهل جایی بودن
      را هم نشان می‌دهد: *aus der Küche*، *aus dem Kino*، *aus Berlin* و *aus
      dem Iran*. *von* یعنی دور شدن از یک شخص، یک کار یا جایی که کنارش
      بوده‌اید: *von meiner Freundin*، *vom Arzt* و *von der Arbeit*. *von
      dem* کوتاه می‌شود: *vom*. پس *aus* در برابر *in* است و *von* در برابر
      *zu* و *bei*: *im Kino* و *aus dem Kino*، *beim Arzt* و *vom Arzt*.
      *von zu Hause* یعنی «از خانه».
  de:
    rule: >
      Auf die Frage *Woher?* stehen *aus* und *von*, beide immer mit Dativ.
      *Aus* heißt: Man war in einem Raum, einem Haus, einer Stadt oder einem
      Land und kommt heraus. Darum sagt *aus* auch die Herkunft: *aus der
      Küche*, *aus dem Kino*, *aus Berlin*, *aus dem Iran*. *Von* steht bei
      Personen, bei einer Tätigkeit und bei Orten, an denen man war: *von
      meiner Freundin*, *vom Arzt*, *von der Arbeit*. *Von dem* sagt man kurz
      *vom*. Also: *im Kino* – *aus dem Kino*, *beim Arzt* – *vom Arzt*. *Von
      zu Hause* heißt: von der eigenen Wohnung.

