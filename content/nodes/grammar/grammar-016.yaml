  rows:
    - [essen, gegessen, Ich habe schon gegessen.]
    - [trinken, getrunken, Du hast Kaffee getrunken.]
    - [schreiben, geschrieben, Er hat eine E-Mail geschrieben.]
    - [lesen, gelesen, Wir haben das Buch gelesen.]
    - [sehen, gesehen, Habt ihr den Film gesehen?]
    - [sprechen, gesprochen, Sie hat mit dem Chef gesprochen.]
    - [nehmen, genommen, Ich habe den Bus genommen.]
    - [finden, gefunden, Hast du den Schlüssel gefunden?]
    - [schlafen, geschlafen, Das Baby hat gut geschlafen.]
    - [helfen, geholfen, Er hat mir geholfen.]
    - [bringen (gemischt), gebracht, Sie hat Blumen gebracht.]
    - [denken (gemischt), gedacht, Ich habe an dich gedacht.]
    - [kennen (gemischt), gekannt, Wir haben ihn nicht gekannt.]
    - [wissen (gemischt), gewusst, Das habe ich nicht gewusst.]

examples:
  - de: Ich habe schon gegessen.
    en: I have already eaten.
    fa: من غذا خورده‌ام.
  - de: Hast du heute genug Wasser getrunken?
    en: Did you drink enough water today?
    fa: امروز به اندازهٔ کافی آب خوردی؟
  - de: Meine Oma hat mir einen Brief geschrieben.
    en: My grandma wrote me a letter.
    fa: مادربزرگم برایم نامه‌ای نوشت.
  - de: Habt ihr den Film schon gesehen?
    en: Have you (plural) seen the film yet?
    fa: شما (جمع) فیلم را دیده‌اید؟
  - de: Ich habe meinen Schlüssel nicht gefunden.
    en: I didn't find my key.
    fa: کلیدم را پیدا نکردم.
  - de: Wir haben lange mit dem Arzt gesprochen.
    en: We talked with the doctor for a long time.
    fa: مدت زیادی با پزشک صحبت کردیم.
  - de: Er hat seiner Freundin Blumen gebracht.
    en: He brought his girlfriend flowers.
    fa: او برای دوست‌دخترش گل آورد.
  - de: Das habe ich nicht gewusst.
    en: I didn't know that.
    fa: این را نمی‌دانستم.

mistakes:
  - wrong: Ich habe Pizza geesst.
    right: Ich habe Pizza gegessen.
    why:
      en: "*Essen* is irregular: its *Partizip II* is *gegessen*."
      fa: "*essen* بی‌قاعده است: صفت مفعولی آن *gegessen* است."
      de: "*Essen* ist unregelmäßig. Das Partizip II ist *gegessen*."
  - wrong: Er hat mir Blumen gebringt.
    right: Er hat mir Blumen gebracht.
    why:
      en: "*Bringen* is mixed: it ends in *-t*, but the vowel changes: *gebracht*."
      fa: "*bringen* آمیخته است: به *-t* ختم می‌شود، اما واکه‌اش تغییر می‌کند: *gebracht*."
      de: "*Bringen* ist gemischt: Es endet auf *-t*, aber der Vokal ändert sich: *gebracht*."
  - wrong: Wir haben den Bus genehmt.
    right: Wir haben den Bus genommen.
    why:
      en: "*Nehmen* is irregular: *genommen*, with *-en* and a new vowel."
      fa: "*nehmen* بی‌قاعده است: *genommen*، با *-en* و واکه‌ای دیگر."
      de: "*Nehmen* ist unregelmäßig: *genommen*, mit *-en* und einem anderen Vokal."

