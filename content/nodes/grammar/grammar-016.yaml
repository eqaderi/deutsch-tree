recogniseOnly: false
prerequisites: [grammar-014, grammar-015]
title:
  en: "Irregular *Partizip II*"
  fa: "صفت مفعولی (*Partizip II*) بی‌قاعده"
  de: "Unregelmäßiges Partizip II"

explanations:
  en:
    rule: >
      Many frequent verbs are irregular: their *Partizip II* is *ge-* + stem
      + *-en*, and the vowel of the stem often changes. *Essen* becomes
      *gegessen*, *trinken* becomes *getrunken*, *schreiben* becomes
      *geschrieben*. A few verbs are mixed: they end in *-t* like a regular
      verb but change their vowel too, as in *bringen*, *gebracht* and
      *wissen*, *gewusst*. No rule tells you which verbs are irregular, so
      learn each *Partizip II* together with its verb.
  fa:
    rule: >
      بسیاری از فعل‌های پرکاربرد بی‌قاعده‌اند: صفت مفعولی (*Partizip II*)
      آن‌ها از *ge-* + بن + *-en* ساخته می‌شود و واکهٔ بن نیز اغلب تغییر
      می‌کند. *essen* می‌شود *gegessen*، *trinken* می‌شود *getrunken* و
      *schreiben* می‌شود *geschrieben*. چند فعل آمیخته‌اند: مانند فعل باقاعده
      به *-t* ختم می‌شوند، اما واکهٔ آن‌ها هم تغییر می‌کند؛ مانند *bringen*،
      *gebracht* و *wissen*، *gewusst*. هیچ قاعده‌ای نمی‌گوید کدام فعل
      بی‌قاعده است؛ از این رو صفت مفعولی هر فعل را همراه با خود فعل از بر کنید.
  de:
    rule: >
      Viele wichtige Verben sind unregelmäßig. Das Partizip II ist *ge-* +
      Stamm + *-en*, und oft ändert sich der Vokal: *essen*, *gegessen*;
      *trinken*, *getrunken*; *schreiben*, *geschrieben*. Einige Verben sind
      gemischt: Sie enden auf *-t*, aber der Vokal ändert sich: *bringen*,
      *gebracht*; *wissen*, *gewusst*. Lernen Sie das Partizip II immer mit
      dem Verb.

