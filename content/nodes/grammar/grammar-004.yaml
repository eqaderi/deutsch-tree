prerequisites: [grammar-001]
title:
  en: "Stem-ending specials"
  fa: "فعل‌هایی با بن ویژه (*-t*، *-d*، *-s*، *-eln*)"
  de: "Besondere Verbstämme (*-t*, *-d*, *-s*, *-eln*)"

explanations:
  en:
    rule: >
      When the stem ends in *-t* or *-d*, an *e* goes before the endings *-st*
      and *-t*, so that they can be heard: *du arbeitest*, *er arbeitet*, *ihr
      findet*. When the stem ends in *-s*, *-ß* or *-z*, *du* adds only *-t*:
      *du heißt*, *du tanzt*, the same form as *er heißt*. Verbs in *-eln*
      usually drop the *e* of the stem with *ich* (*ich sammle*) and add only
      *-n* with *wir* and *sie/Sie* (*wir sammeln*).
  fa:
    rule: >
      اگر بن فعل به *-t* یا *-d* ختم شود، پیش از شناسه‌های *-st* و *-t* یک *e*
      می‌آید تا شناسه شنیده شود: *du arbeitest*، *er arbeitet*، *ihr findet*.
      اگر بن به *-s*، *-ß* یا *-z* ختم شود، *du* فقط *-t* می‌گیرد: *du heißt*،
      *du tanzt*؛ این صورت با صرف سوم‌شخص مفرد یکی است: *er heißt*. فعل‌هایی که
      مصدرشان به *-eln* ختم می‌شود، با *ich* معمولاً *e* بن را از دست می‌دهند
      (*ich sammle*) و با *wir* و *sie/Sie* فقط *-n* می‌گیرند (*wir sammeln*).
  de:
    rule: >
      Endet der Stamm auf *-t* oder *-d*, kommt vor *-st* und *-t* ein *e*:
      *du arbeitest*, *er arbeitet*, *ihr findet*. Endet der Stamm auf *-s*,
      *-ß* oder *-z*, bekommt *du* nur *-t*: *du heißt*, *du tanzt*. Das ist
      die gleiche Form wie bei *er*. Bei Verben auf *-eln* fällt bei *ich* das
      *e* meistens weg (*ich sammle*), und bei *wir* und *sie/Sie* kommt nur
      *-n* (*wir sammeln*).

