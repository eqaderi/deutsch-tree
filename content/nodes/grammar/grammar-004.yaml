examples:
  - de: Du arbeitest viel.
    en: You work a lot.
    fa: تو خیلی کار می‌کنی.
  - de: Er wartet auf den Bus.
    en: He is waiting for the bus.
    fa: او منتظر اتوبوس است.
  - de: Findest du das gut?
    en: Do you think that is good?
    fa: به نظرت این خوب است؟
  - de: Was kostet das?
    en: How much is that?
    fa: قیمتش چند است؟
  - de: Wie heißt du?
    en: What is your name?
    fa: اسمت چیست؟
  - de: Du tanzt sehr gut.
    en: You dance very well.
    fa: تو خیلی خوب می‌رقصی.
  - de: Ihr redet zu laut.
    en: You (plural) are talking too loudly.
    fa: شما (جمع) خیلی بلند حرف می‌زنید.
  - de: Ich sammle Briefmarken.
    en: I collect stamps.
    fa: من تمبر جمع می‌کنم.

mistakes:
  - wrong: Du arbeitst viel.
    right: Du arbeitest viel.
    why:
      en: "The stem *arbeit-* ends in *-t*, so an *e* goes before *-st*: *du arbeitest*."
      fa: "بن *arbeit-* به *-t* ختم می‌شود، پس پیش از *-st* یک *e* می‌آید: *du arbeitest*."
      de: "Der Stamm *arbeit-* endet auf *-t*. Darum kommt vor *-st* ein *e*: *du arbeitest*."
  - wrong: Er wart auf dich.
    right: Er wartet auf dich.
    why:
      en: "The stem *wart-* ends in *-t*, so *er* takes *-et*: *er wartet*."
      fa: "بن *wart-* به *-t* ختم می‌شود، پس سوم‌شخص مفرد *-et* می‌گیرد: *er wartet*."
      de: "Der Stamm *wart-* endet auf *-t*. Darum heißt es bei *er*: *er wartet*."
  - wrong: Du heißst Tom.
    right: Du heißt Tom.
    why:
      en: "The stem *heiß-* ends in *-ß*, so *du* adds only *-t*: *du heißt*."
      fa: "بن *heiß-* به *-ß* ختم می‌شود، پس *du* فقط *-t* می‌گیرد: *du heißt*."
      de: "Der Stamm *heiß-* endet auf *-ß*. Darum bekommt *du* nur *-t*: *du heißt*."
  - wrong: Wir sammelen Briefmarken.
    right: Wir sammeln Briefmarken.
    why:
      en: "With *wir* the form is the infinitive, and *sammeln* ends in *-n* only: *wir sammeln*."
      fa: "صرف فعل با *wir* همان مصدر است و *sammeln* فقط به *-n* ختم می‌شود: *wir sammeln*."
      de: "Bei *wir* ist die Form wie der Infinitiv, und *sammeln* hat nur *-n*: *wir sammeln*."

