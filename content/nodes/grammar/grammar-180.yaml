diagrams:
  - caption:
      en: >
        *Das ist der Mann, dem ich helfe.* The pronoun *dem* has the gender of
        *Mann*. It is in the *Dativ* because, as a sentence of its own, the
        relative clause is *Ich helfe dem Mann.*
      fa: >
        ضمیر *dem* با *Mann* هم‌جنس است. حالت آن *Dativ* است، زیرا فعل
        *helfen* با حالت *Dativ* می‌آید، همان‌طور که جملهٔ موصولی به‌تنهایی
        نشان می‌دهد.
      de: >
        *Das ist der Mann, dem ich helfe.* Das Pronomen *dem* passt zu
        *Mann*. Es steht im Dativ, denn der Relativsatz allein heißt: *Ich
        helfe dem Mann.*
