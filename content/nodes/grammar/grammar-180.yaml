title:
  en: "Relative clause, *Dativ*"
  fa: "جملهٔ موصولی در حالت *Dativ*"
  de: "Relativsatz im Dativ"

explanations:
  en:
    rule: >
      When the relative pronoun is the *Dativ* object of the relative clause,
      it is in the *Dativ*: *Das ist der Kollege, dem ich geholfen habe.* The
      forms are almost those of the article: *dem* for masculine and neuter,
      *der* for feminine, but *denen* for the plural, not *den*: *die
      Nachbarn, denen wir geholfen haben*. As always, the gender and number
      come from the noun, and the case comes from the relative clause. The
      *Dativ* follows verbs such as *helfen*, *danken*, *gehören*,
      *gefallen*, *schmecken* and *antworten*, and it marks the person who
      is given, shown or told something (*geben*, *schenken*, *zeigen*,
      *erklären*, *erzählen*). To find the case, say the relative clause as
      a sentence of its own: *Ich habe dem Kollegen geholfen.* The conjugated
      verb goes to the end.
  fa:
    rule: >
      اگر ضمیر موصولی در جملهٔ موصولی مفعول باواسطه باشد، در حالت *Dativ*
      (حالت مفعول باواسطه) می‌آید: *Das ist der Kollege, dem ich geholfen
      habe.* شکل‌های آن تقریباً همان شکل‌های حرف تعریف است: *dem* برای مذکر
      و خنثی و *der* برای مؤنث. ولی ضمیر موصولی جمع *denen* است، نه *den*:
      *die Nachbarn, denen wir geholfen haben*. مانند همیشه، جنس و شمار ضمیر
      از اسم می‌آید و حالت آن از جملهٔ موصولی. حالت *Dativ* پس از فعل‌هایی
      مانند *helfen*، *danken*، *gehören*، *gefallen*، *schmecken* و
      *antworten* می‌آید و نیز برای کسی که چیزی به او داده، نشان داده یا
      گفته می‌شود (*geben*، *schenken*، *zeigen*، *erklären*، *erzählen*).
      برای یافتن حالت، جملهٔ موصولی را جمله‌ای مستقل فرض کنید: *Ich habe dem
      Kollegen geholfen.* فعل صرف‌شده به پایان جمله می‌رود.
  de:
    rule: >
      Ist das Relativpronomen im Relativsatz das Dativobjekt, steht es im
      Dativ: *Das ist der Kollege, dem ich geholfen habe.* Die Formen sind
      fast wie beim Artikel: *dem* für maskulin und neutral, *der* für
      feminin. Aber im Plural heißt es *denen*, nicht *den*: *die Nachbarn,
      denen wir geholfen haben*. Das Genus kommt vom Nomen, der Kasus vom
      Relativsatz. Den Dativ haben Verben wie *helfen*, *danken*, *gehören*,
      *gefallen*, *schmecken* und *antworten*. Auch die Person, der man etwas
      gibt, zeigt oder erzählt, steht im Dativ (*geben*, *schenken*, *zeigen*,
      *erklären*, *erzählen*). So finden Sie den Kasus: Sagen Sie den
      Relativsatz als eigenen Satz: *Ich habe dem Kollegen geholfen.* Das
      konjugierte Verb steht am Ende.

