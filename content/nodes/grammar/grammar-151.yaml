# Grammar list row 151.
id: grammar-151
kind: grammar
level: A2
chapter: a2-adverbs
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-140, grammar-150]
title:
  en: "*deshalb*, *sonst*"
  fa: "*deshalb* و *sonst*"
  de: "*deshalb*, *sonst*"

explanations:
  en:
    rule: >
      *Deshalb* (that's why, so) joins a result to its reason: the reason comes
      first, *deshalb* starts the result. *Sonst* (otherwise, or else) says what
      happens if something is not done: *Schreib es dir auf, sonst vergisst du
      es.* Both are adverbs, not conjunctions like *und* or *denn*: at the start
      of a clause they take position 1, so the verb comes next and the subject
      after it: *Peter muss lernen, deshalb kommt er nicht mit.* After *und*
      (position 0) they are position 1 too: *und deshalb bleibe ich zu Hause*.
      *Deshalb* can also stand after the verb: *Ich bleibe deshalb zu Hause.*
      *Denn* goes the other way: it gives the reason after the result, and the
      subject stays before the verb: *Peter kommt nicht mit, denn er muss
      lernen.* *Darum* and *deswegen* mean the same as *deshalb*.
  fa:
    rule: >
      *deshalb* (به همین دلیل، برای همین) نتیجه را به دلیلش وصل می‌کند: نخست
      دلیل می‌آید و جملهٔ نتیجه با *deshalb* آغاز می‌شود. *sonst* (وگرنه)
      می‌گوید اگر کاری انجام نشود، چه پیش می‌آید: *Schreib es dir auf, sonst
      vergisst du es.* هر دو قیدند، نه حرف ربط مانند *und* یا *denn*. وقتی در
      آغاز جمله بیایند، خودشان جایگاه اول را می‌گیرند؛ پس فعل پس از آن‌ها می‌آید
      و فاعل پس از فعل: *Peter muss lernen, deshalb kommt er nicht mit.* پس از
      *und* (جایگاه صفر) هم جایگاه اول‌اند: *und deshalb bleibe ich zu Hause*.
      *deshalb* می‌تواند پس از فعل هم بیاید: *Ich bleibe deshalb zu Hause.*
      *denn* راه وارونه را می‌رود: دلیل را پس از نتیجه می‌آورد و فاعل پیش از
      فعل می‌ماند: *Peter kommt nicht mit, denn er muss lernen.* *darum* و
      *deswegen* همان معنای *deshalb* را دارند.
  de:
    rule: >
      *Deshalb* verbindet einen Grund mit seiner Folge: Zuerst kommt der Grund,
      dann die Folge mit *deshalb*. *Sonst* sagt, was passiert, wenn man etwas
      nicht macht: *Schreib es dir auf, sonst vergisst du es.* Beide sind
      Adverbien, keine Konjunktionen wie *und* oder *denn*. Am Anfang vom Satz
      sind sie Position 1. Dann kommt das Verb und danach das Subjekt: *Peter
      muss lernen, deshalb kommt er nicht mit.* Auch nach *und* (Position 0)
      sind sie Position 1: *und deshalb bleibe ich zu Hause*. *Deshalb* kann
      auch nach dem Verb stehen: *Ich bleibe deshalb zu Hause.* Mit *denn* ist
      es umgekehrt: Der Grund kommt nach der Folge, und das Subjekt steht vor
      dem Verb: *Peter kommt nicht mit, denn er muss lernen.* *Darum* und
      *deswegen* bedeuten das Gleiche wie *deshalb*.

table:
  columns:
    - { en: First clause, fa: جملهٔ نخست, de: Erster Satz }
    - { en: Position 1, fa: جایگاه اول, de: Position 1 }
    - { en: "Position 2: verb", fa: "جایگاه دوم: فعل", de: "Position 2: Verb" }
    - { en: Subject, fa: فاعل, de: Subjekt }
    - { en: The rest, fa: بقیهٔ جمله, de: Rest }
  rows:
    - ["Peter muss lernen,", deshalb, kommt, er, nicht mit.]
    - ["Es regnet,", deshalb, nehme, ich, den Bus.]
    - ["Mein Auto ist kaputt, und", deshalb, fahre, ich, mit dem Rad.]
    - ["Schreib es dir auf,", sonst, vergisst, du, es.]
    - ["Beeil dich,", sonst, verpassen, wir, den Zug.]

# Which way each word points: deshalb from the reason to the result, denn from
# the result back to the reason, sonst to what happens if you don't.
diagrams:
  - caption:
      en: >
        *Ich bin müde, deshalb schlafe ich.* The reason comes first and
        *deshalb* starts the result. *Ich schlafe, denn ich bin müde.* The same
        two facts the other way round: *denn* adds the reason after the result.
        *Beeil dich, sonst kommst du zu spät.* *Sonst* says what happens if you
        don't.
      fa: >
        *Ich bin müde, deshalb schlafe ich.* نخست دلیل می‌آید و جملهٔ نتیجه با
        *deshalb* آغاز می‌شود. *Ich schlafe, denn ich bin müde.* همان دو واقعیت
        به ترتیب وارونه: *denn* دلیل را پس از نتیجه می‌آورد. *Beeil dich, sonst
        kommst du zu spät.* *sonst* می‌گوید اگر آن کار انجام نشود، چه پیش
        می‌آید.
      de: >
        *Ich bin müde, deshalb schlafe ich.* Zuerst kommt der Grund, dann die
        Folge mit *deshalb*. *Ich schlafe, denn ich bin müde.* Das Gleiche
        umgekehrt: Mit *denn* kommt der Grund nach der Folge. *Beeil dich, sonst
        kommst du zu spät.* *Sonst* sagt, was passiert, wenn man es nicht macht.
    labels:
      reason: { en: the reason, fa: دلیل, de: der Grund }
      result: { en: the result, fa: نتیجه, de: die Folge }
      advice: { en: what to do, fa: کار لازم, de: was man tun soll }
      ifnot: { en: "if you don't", fa: اگر انجام نشود, de: wenn nicht }
