examples:
  - de: Ich habe keine Milch mehr. Hast du welche?
    en: I've run out of milk. Have you got any?
    fa: شیرم تمام شده است. تو داری؟
  - de: Ich brauche einen Stift. Hast du einen?
    en: I need a pen. Do you have one?
    fa: خودکار لازم دارم. تو یکی داری؟
  - de: Hast du ein Fahrrad? – Nein, ich habe keins.
    en: Do you have a bike? – No, I don't have one.
    fa: دوچرخه داری؟ – نه، ندارم.
  - de: Gibt es hier eine Apotheke? – Ja, da vorne ist eine.
    en: Is there a pharmacy here? – Yes, there's one up ahead.
    fa: این‌جا داروخانه هست؟ – بله، آن جلو یکی هست.
  - de: Wir brauchen Eier. – Im Kühlschrank sind noch welche.
    en: We need eggs. – There are still some in the fridge.
    fa: تخم‌مرغ لازم داریم. – هنوز چندتایی در یخچال هست.
  - de: Möchtest du einen Kaffee? – Danke, ich habe schon einen.
    en: Would you like a coffee? – Thanks, I already have one.
    fa: قهوه می‌خواهی؟ – ممنون، یکی دارم.
  - de: Hast du Kinder? – Nein, ich habe keine.
    en: Do you have children? – No, I don't have any.
    fa: بچه داری؟ – نه، ندارم.
  - de: Hier ist kein Stuhl frei. – Doch, da ist noch einer.
    en: There's no free chair here. – Yes there is, there's one over there.
    fa: این‌جا صندلی خالی نیست. – چرا، آن‌جا یکی هست.

mistakes:
  - wrong: Ich brauche einen Stift. Hast du ein?
    right: Ich brauche einen Stift. Hast du einen?
    why:
      en: "*Stift* is masculine and the object, so the pronoun is *einen*. Without a noun, *ein* alone is not used."
      fa: "*Stift* اسم مذکر و مفعول است، پس ضمیر *einen* است. *ein* به‌تنهایی و بی‌اسم به کار نمی‌رود."
      de: "*Stift* ist maskulin und das Objekt. Darum *einen*. *Ein* allein ohne Nomen sagt man nicht."
  - wrong: Wir brauchen Tomaten. Hast du eine?
    right: Wir brauchen Tomaten. Hast du welche?
    why:
      en: "*Tomaten* is a plural, and *ein* has no plural: *welche*."
      fa: "*Tomaten* جمع است و *ein* جمع ندارد: *welche*."
      de: "*Tomaten* ist Plural, und *ein* hat keinen Plural: *welche*."
  - wrong: Das Messer? Hier ist keiner.
    right: Das Messer? Hier ist keins.
    why:
      en: "*Messer* is neuter, so the pronoun is *keins* (or *keines*)."
      fa: "*Messer* اسم خنثی است، پس ضمیر *keins* (یا *keines*) است."
      de: "*Messer* ist neutral. Darum *keins* (oder *keines*)."
  - wrong: Hast du Geld? – Nein, ich habe nicht welche.
    right: Hast du Geld? – Nein, ich habe keins.
    why:
      en: "The answer \"none\" is a form of *kein*; *Geld* is neuter: *keins*."
      fa: "برای پاسخ منفی، شکلی از *kein* می‌آید؛ *Geld* اسم خنثی است: *keins*."
      de: "Die negative Antwort ist eine Form von *kein*. *Geld* ist neutral: *keins*."

