title:
  en: "*einer*, *keiner*, *welche* as pronouns"
  fa: "*einer*، *keiner* و *welche* به‌عنوان ضمیر"
  de: "*einer*, *keiner*, *welche* als Pronomen"

explanations:
  en:
    rule: >
      So as not to repeat a noun with *ein* or *kein*, German uses *einer*
      (one) and *keiner* (none) alone: *Ich brauche einen Stift. Hast du
      einen?* – *Nein, ich habe keinen.* Without its noun the word shows the
      gender itself: *einer* (masculine), *eine* (feminine), *eins*
      (neuter, also *eines*); in the *Akkusativ* only the masculine changes:
      *einen*. *Keiner*, *keine*, *keins* work the same way. *Ein* has no
      plural, so for a plural, or for something you cannot count such as
      *Milch*, the pronoun is *welche* (some): *Ich habe keine Milch mehr.
      Hast du welche?* The answer "none" is then *keine*.
  fa:
    rule: >
      در آلمانی برای این‌که اسمی که با *ein* یا *kein* آمده تکرار نشود،
      *einer* (یکی) و *keiner* (هیچ‌کدام) را بی‌اسم به کار می‌بریم: *Ich
      brauche einen Stift. Hast du einen?* (خودکار لازم دارم. یکی داری؟) –
      *Nein, ich habe keinen.* (نه، ندارم.) این ضمیر مبهم چون اسمی پس از
      خود ندارد، جنس را خودش نشان می‌دهد: *einer* برای مذکر، *eine* برای
      مؤنث و *eins* (یا *eines*) برای خنثی. در حالت *Akkusativ* (حالت مفعولی)
      فقط مذکر تغییر می‌کند: *einen*. *keiner*، *keine* و *keins* نیز همین
      شکل‌ها را دارند. *ein* جمع ندارد؛ پس برای اسم جمع و برای چیزهای
      ناشمردنی مانند *Milch* ضمیر *welche* (مقداری، چندتایی) به کار می‌رود:
      *Ich habe keine Milch mehr. Hast du welche?* و پاسخ منفی آن *keine* است.
  de:
    rule: >
      Man möchte ein Nomen mit *ein* oder *kein* nicht wiederholen. Dann sagt
      man nur *einer* oder *keiner*: *Ich brauche einen Stift. Hast du einen?*
      – *Nein, ich habe keinen.* Ohne Nomen zeigt das Wort selbst das Genus:
      *einer* (maskulin), *eine* (feminin), *eins* (neutral, auch *eines*).
      Im Akkusativ ändert sich nur das Maskulinum: *einen*. Bei *keiner*,
      *keine*, *keins* ist es genauso. *Ein* hat keinen Plural. Darum sagt man
      im Plural und bei Sachen wie *Milch* *welche*: *Ich habe keine Milch
      mehr. Hast du welche?* Die Antwort „nein“ heißt dann *keine*.

