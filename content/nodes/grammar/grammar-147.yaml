# Grammar list row 147.
id: grammar-147
kind: grammar
level: A1
chapter: a1-negation
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-076, grammar-146]
title:
  en: "Negation with *kein*"
  fa: "نفی با *kein*"
  de: "Verneinung mit *kein*"

explanations:
  en:
    rule: >
      A noun with *ein* or with no article is negated with *kein*, never with
      *nicht*: *ein Problem* becomes *kein Problem*, *Zeit* becomes *keine
      Zeit*. *Kein* has the endings of *ein*, and in the plural it is *keine*.
      After *haben* a masculine noun takes *keinen*: *Ich habe keinen Hund.*
      Everything else is negated with *nicht*: a verb, an adjective, and a
      noun with *der*, *die* or *das*.
  fa:
    rule: >
      اسمی که با *ein* یا بدون حرف تعریف می‌آید با *kein* منفی می‌شود، نه با
      *nicht*: *ein Problem* می‌شود *kein Problem* و *Zeit* می‌شود *keine
      Zeit*. *kein* همان پایانه‌های *ein* را می‌گیرد و در جمع *keine* است.
      پس از *haben*، اسم مذکر *keinen* می‌گیرد: *Ich habe keinen Hund.* بقیهٔ
      بخش‌های جمله با *nicht* منفی می‌شوند: فعل، صفت، و اسمی که با *der*،
      *die* یا *das* می‌آید.
  de:
    rule: >
      Ein Nomen mit *ein* oder ohne Artikel verneint man mit *kein*, nicht mit
      *nicht*: *ein Problem* wird zu *kein Problem*, *Zeit* wird zu *keine
      Zeit*. *Kein* hat die Endungen von *ein*. Im Plural heißt es *keine*.
      Nach *haben* bekommt ein maskulines Nomen *keinen*: *Ich habe keinen
      Hund.* Alles andere verneint man mit *nicht*: ein Verb, ein Adjektiv und
      ein Nomen mit *der*, *die* oder *das*.

table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "With *ein*", fa: "با *ein*", de: "Mit *ein*" }
    - { en: "With *kein*", fa: "با *kein*", de: "Mit *kein*" }
    - { en: "Example with *haben*", fa: "مثال با *haben*", de: "Beispiel mit *haben*" }
  rows:
    - [der Hund, ein Hund, kein Hund, Ich habe keinen Hund.]
    - [die Katze, eine Katze, keine Katze, Ich habe keine Katze.]
    - [das Auto, ein Auto, kein Auto, Ich habe kein Auto.]
    - [die Kinder (Plural), –, keine Kinder, Ich habe keine Kinder.]

examples:
  - de: Heute habe ich keine Zeit.
    en: I have no time today.
    fa: امروز وقت ندارم.
  - de: Das ist kein Problem.
    en: That's no problem.
    fa: مشکلی نیست.
  - de: Mein Bruder hat kein Auto.
    en: My brother doesn't have a car.
    fa: برادرم ماشین ندارد.
  - de: Ich habe keinen Hunger.
    en: I'm not hungry.
    fa: گرسنه نیستم.
  - de: Wir haben keine Kinder.
    en: We don't have any children.
    fa: ما بچه نداریم.
  - de: Hast du kein Handy?
    en: Don't you have a mobile phone?
    fa: گوشی نداری؟
  - de: Das ist nicht die Post, das ist die Bank.
    en: That isn't the post office, it's the bank.
    fa: این ادارهٔ پست نیست، بانک است.
  - de: Der Kaffee ist nicht heiß.
    en: The coffee isn't hot.
    fa: قهوه داغ نیست.

mistakes:
  - wrong: Ich habe nicht Zeit.
    right: Ich habe keine Zeit.
    why:
      en: "*Zeit* has no article, so it is negated with *kein*: *keine Zeit*."
      fa: "*Zeit* حرف تعریف ندارد، پس با *kein* منفی می‌شود: *keine Zeit*."
      de: "*Zeit* hat keinen Artikel. Darum verneint man mit *kein*: *keine Zeit*."
  - wrong: Das ist nicht ein Problem.
    right: Das ist kein Problem.
    why:
      en: "*Nicht* and *ein* together become *kein*."
      fa: "*nicht* و *ein* با هم می‌شوند *kein*."
      de: "*Nicht* und *ein* zusammen werden zu *kein*."
  - wrong: Der Film ist kein gut.
    right: Der Film ist nicht gut.
    why:
      en: "*Gut* is an adjective, not a noun, so it is negated with *nicht*."
      fa: "*gut* صفت است، نه اسم؛ پس با *nicht* منفی می‌شود."
      de: "*Gut* ist ein Adjektiv, kein Nomen. Darum verneint man mit *nicht*."
  - wrong: Ich habe kein Hund.
    right: Ich habe keinen Hund.
    why:
      en: "*Hund* is masculine (*der*). After *haben* it takes *keinen*, as *ein* becomes *einen*."
      fa: "*Hund* اسم مذکر (*der*) است. پس از *haben*، *keinen* می‌گیرد، همان‌طور که *ein* می‌شود *einen*."
      de: "*Hund* hat den Artikel *der*. Nach *haben* heißt es *keinen*, so wie *einen*."
  - wrong: Er hat keine Auto.
    right: Er hat kein Auto.
    why:
      en: "*Auto* is neuter (*das*), so *kein* has no ending, like *ein Auto*."
      fa: "*Auto* اسم خنثی (*das*) است، پس *kein* پایانه نمی‌گیرد، مانند *ein Auto*."
      de: "*Auto* hat den Artikel *das*. Darum *kein* ohne Endung, wie bei *ein Auto*."

