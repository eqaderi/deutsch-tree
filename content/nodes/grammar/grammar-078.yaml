# Grammar list row 78.
id: grammar-078
kind: grammar
level: A1
chapter: a1-more-articles
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-062]
title:
  en: "*Demonstrativartikel* *dieser*"
  fa: "حرف تعریف اشاره *dieser*"
  de: "Demonstrativartikel *dieser*"

explanations:
  en:
    rule: >
      *Dieser* (this, these) stands before a noun in place of *der*, *die* or
      *das* and points to one particular thing: this one, not another. It
      ends in the same letter as the definite article: *der* → *dieser*, *die*
      → *diese*, *das* → *dieses*, plural *die* → *diese*. In the
      *Akkusativ* only the masculine changes, *den* → *diesen*: *Ich nehme
      diesen Pullover.*
  fa:
    rule: >
      *dieser* (این) به جای *der*، *die* یا *das* پیش از اسم می‌آید و به
      چیزی معین اشاره می‌کند: همین یکی، نه دیگری. این واژه به همان حرفی ختم
      می‌شود که حرف تعریف معین: *der* می‌شود *dieser*، *die* می‌شود *diese*،
      *das* می‌شود *dieses* و *die* جمع می‌شود *diese*. در حالت *Akkusativ*
      (حالت مفعولی) فقط مذکر تغییر می‌کند و مانند *den* می‌شود *diesen*:
      *Ich nehme diesen Pullover.* «این» در فارسی همیشه یکسان است، ولی
      *dieser* در آلمانی با جنس، شمار و حالت اسم تغییر می‌کند.
  de:
    rule: >
      *Dieser* steht vor einem Nomen statt *der*, *die* oder *das*. Man zeigt
      damit auf eine bestimmte Sache: diese hier, keine andere. *Dieser* endet
      mit dem gleichen Buchstaben wie der Artikel: *der* → *dieser*, *die* → *diese*,
      *das* → *dieses*, Plural *die* → *diese*. Im Akkusativ ändert sich nur
      das Maskulinum: *den* → *diesen*.

table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "With *dieser*", fa: "با *dieser*", de: "Mit *dieser*" }
    - { en: "*Akkusativ* with *dieser*", fa: "حالت *Akkusativ* با *dieser*", de: "Akkusativ mit *dieser*" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [der Rock, dieser Rock, diesen Rock, Ich nehme diesen Rock.]
    - [die Jacke, diese Jacke, diese Jacke, Diese Jacke ist zu teuer.]
    - [das Hemd, dieses Hemd, dieses Hemd, Dieses Hemd gefällt mir.]
    - [die Schuhe (Plural), diese Schuhe, diese Schuhe, Ich kaufe diese Schuhe.]

examples:
  - de: Dieses Hemd gefällt mir.
    en: I like this shirt.
    fa: از این پیراهن خوشم می‌آید.
  - de: Ich nehme diesen Pullover.
    en: I'll take this jumper.
    fa: این پلیور را برمی‌دارم.
  - de: Diese Jacke ist zu teuer.
    en: This jacket is too expensive.
    fa: این کاپشن زیادی گران است.
  - de: Kennst du diesen Mann?
    en: Do you know this man?
    fa: این مرد را می‌شناسی؟
  - de: Diese Schuhe sind sehr bequem.
    en: These shoes are very comfortable.
    fa: این کفش‌ها خیلی راحت‌اند.
  - de: Dieser Zug fährt nach Hamburg.
    en: This train goes to Hamburg.
    fa: این قطار به هامبورگ می‌رود.
  - de: Wie findest du dieses Restaurant?
    en: What do you think of this restaurant?
    fa: این رستوران را چطور می‌بینی؟
  - de: Diese Woche habe ich viel Arbeit.
    en: I have a lot of work this week.
    fa: این هفته کارم زیاد است.

mistakes:
  - wrong: Ich kaufe dieser Rock.
    right: Ich kaufe diesen Rock.
    why:
      en: "*Rock* is masculine and the object, so the *Akkusativ*: *diesen*, like *den*."
      fa: "*Rock* اسم مذکر و مفعول جمله است، پس در حالت *Akkusativ* می‌آید: *diesen*، مانند *den*."
      de: "*Rock* ist maskulin und das Objekt. Darum Akkusativ: *diesen*, wie *den*."
  - wrong: Dieser Hemd ist schön.
    right: Dieses Hemd ist schön.
    why:
      en: "*Hemd* is a *das* noun, so *dieses*: it ends in *-s*, like *das*."
      fa: "*Hemd* اسم خنثی (*das*) است، پس *dieses* می‌آید که مانند *das* به *-s* ختم می‌شود."
      de: "*Hemd* hat den Artikel *das*. Darum *dieses*, mit *-s* wie *das*."
  - wrong: Dieses Schuhe sind neu.
    right: Diese Schuhe sind neu.
    why:
      en: "*Schuhe* is a plural, and the plural is *die*, so *diese*."
      fa: "*Schuhe* جمع است و حرف تعریف جمع *die* است، پس *diese* می‌آید."
      de: "*Schuhe* ist Plural. Der Artikel ist *die*, also *diese*."

