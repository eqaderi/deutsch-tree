# Grammar list row 169.
id: grammar-169
kind: grammar
level: B1
chapter: b1-time-clauses
order: 4
status: published
recogniseOnly: false
prerequisites: [grammar-160]
title:
  en: "*während* as conjunction"
  fa: "*während* به‌عنوان حرف ربط"
  de: "*während* als Konjunktion"

explanations:
  en:
    rule: >
      *Während* starts a subordinate clause, so the conjugated verb goes to
      the end. It has two meanings. Two things happen at the same time,
      "while": *Ich koche, während du den Tisch deckst.* Or two things are
      set side by side as a contrast, "whereas": *Mein Bruder ist sehr
      ordentlich, während ich eher chaotisch bin.* Both clauses usually have
      the same tense. The *während* clause can also come first; then the main
      clause starts with its verb: *Während das Baby schläft, räume ich die
      Wohnung auf.* Before a noun, *während* is a preposition (*während des
      Essens*); that is a topic of its own.
  fa:
    rule: >
      *während* جملهٔ پیرو را آغاز می‌کند، پس فعل صرف‌شده به پایان جمله
      می‌رود. *während* دو معنا دارد. دو کار هم‌زمان رخ می‌دهند، یعنی «در
      همان حال که، هنگامی که»: *Ich koche, während du den Tisch deckst.* یا
      دو چیز در برابر هم گذاشته می‌شوند، یعنی «در حالی که»: *Mein Bruder ist
      sehr ordentlich, während ich eher chaotisch bin.* زمان فعل در هر دو
      جمله معمولاً یکی است. جملهٔ پیرو با *während* می‌تواند اول هم بیاید؛
      آن‌گاه جملهٔ پایه با فعلش آغاز می‌شود: *Während das Baby schläft, räume
      ich die Wohnung auf.* *während* پیش از اسم حرف اضافه است (*während des
      Essens*) که موضوع درسی دیگری است.
  de:
    rule: >
      Mit *während* beginnt ein Nebensatz. Das konjugierte Verb steht am
      Ende. *Während* hat zwei Bedeutungen. Zwei Dinge passieren zur gleichen
      Zeit: *Ich koche, während du den Tisch deckst.* Oder man vergleicht zwei
      Dinge, die verschieden sind: *Mein Bruder ist sehr ordentlich, während
      ich eher chaotisch bin.* Meistens haben beide Sätze dieselbe Zeitform.
      Der *während*-Satz kann auch zuerst stehen. Dann beginnt der Hauptsatz
      mit dem Verb: *Während das Baby schläft, räume ich die Wohnung auf.*
      Vor einem Nomen ist *während* eine Präposition (*während des Essens*).
      Das ist ein anderes Thema.

table:
  columns:
    - { en: "At the same time: *während*", fa: "هم‌زمان: *während*", de: "Zur gleichen Zeit: *während*" }
    - { en: "Contrast: *während*", fa: "در برابر هم: *während*", de: "Gegensatz: *während*" }
  rows:
    - ["Ich koche, während du den Tisch deckst.", "Ich trinke viel Kaffee, während mein Mann nur Tee trinkt."]
    - ["Während das Baby schläft, lese ich.", "Während Berlin sehr groß ist, ist Weimar eher klein."]
    - ["Er hört Musik, während er arbeitet.", "Meine Schwester ist ordentlich, während ich eher chaotisch bin."]

# Two bars over the same stretch of the time line: two actions at the same time.
