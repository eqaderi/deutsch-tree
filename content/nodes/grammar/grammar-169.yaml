examples:
  - de: Ich koche, während du den Tisch deckst.
    en: I cook while you set the table.
    fa: من آشپزی می‌کنم و تو در همان حال میز را می‌چینی.
  - de: Während das Baby schläft, räume ich die Wohnung auf.
    en: While the baby is asleep, I tidy up the flat.
    fa: وقتی بچه خواب است، خانه را مرتب می‌کنم.
  - de: Er hört oft Musik, während er arbeitet.
    en: He often listens to music while he works.
    fa: او اغلب هنگام کار موسیقی گوش می‌دهد.
  - de: Während wir im Urlaub waren, hat der Nachbar die Blumen gegossen.
    en: While we were on holiday, the neighbour watered the flowers.
    fa: وقتی در تعطیلات بودیم، همسایه به گل‌ها آب داد.
  - de: Während ich telefoniert habe, ist die Milch übergekocht.
    en: While I was on the phone, the milk boiled over.
    fa: وقتی با تلفن حرف می‌زدم، شیر سر رفت.
  - de: Mein Bruder ist sehr ordentlich, während ich eher chaotisch bin.
    en: My brother is very tidy, whereas I'm rather messy.
    fa: برادرم خیلی منظم است، در حالی که من بیشتر بی‌نظمم.
  - de: Während es im Norden regnet, scheint im Süden die Sonne.
    en: While it's raining in the north, the sun is shining in the south.
    fa: در شمال باران می‌بارد، در حالی که در جنوب آفتاب است.
  - de: Während des Essens sprechen wir nicht über die Arbeit.
    en: During the meal we don't talk about work.
    fa: سر غذا دربارهٔ کار حرف نمی‌زنیم.

mistakes:
  - wrong: Während ich koche, du deckst den Tisch.
    right: Während ich koche, deckst du den Tisch.
    why:
      en: "The *während* clause is position 1, so the main clause starts with its verb: *deckst du*."
      fa: "جملهٔ پیرو با *während* جایگاه اول است، پس جملهٔ پایه با فعلش آغاز می‌شود: *deckst du*."
      de: "Der *während*-Satz ist Position 1. Danach kommt sofort das Verb: *deckst du*."
  - wrong: Ich höre Musik, während ich mache Hausaufgaben.
    right: Ich höre Musik, während ich Hausaufgaben mache.
    why:
      en: "In the *während* clause the conjugated verb *mache* goes to the end."
      fa: "در جملهٔ پیرو با *während* فعل صرف‌شدهٔ *mache* به پایان جمله می‌رود."
      de: "Im *während*-Satz steht das konjugierte Verb *mache* am Ende."
  - wrong: Während ich räume die Küche auf, saugst du Staub.
    right: Während ich die Küche aufräume, saugst du Staub.
    why:
      en: "In the *während* clause a separable verb is one word at the end: *aufräume*."
      fa: "در جملهٔ پیرو با *während* فعل جداشدنی یک‌جا در پایان جمله می‌آید: *aufräume*."
      de: "Im *während*-Satz steht ein trennbares Verb zusammen am Ende: *aufräume*."
  - wrong: Er hört Musik, wann er arbeitet.
    right: Er hört Musik, während er arbeitet.
    why:
      en: "*Wann* only asks for a time. For two things at the same time it is *während*."
      fa: "*wann* فقط زمان را می‌پرسد. برای دو کار هم‌زمان *während* می‌آید."
      de: "*Wann* fragt nur nach der Zeit. Für zwei Dinge zur gleichen Zeit sagt man *während*."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Ich koche, ___ du den Tisch deckst.
    options: [als, während, wann]
    answer: während
    explanation:
      en: "Two things at the same time, now: *während*. *Als* is only for the past, and *wann* asks a question."
      fa: "دو کار هم‌زمان، در زمان حال: *während*. *als* فقط برای گذشته است و *wann* پرسش است."
      de: "Zwei Dinge zur gleichen Zeit, jetzt: *während*. *Als* gibt es nur für die Vergangenheit, *wann* ist eine Frage."
  - id: gap-2
    type: gap-fill
    prompt: Mein Bruder ist sehr ordentlich, ___ ich eher chaotisch bin.
    options: [während, bevor, nachdem]
    answer: während
    explanation:
      en: 'Two people are set side by side as a contrast: *während*, "whereas".'
      fa: "دو نفر در برابر هم گذاشته شده‌اند: *während*، یعنی «در حالی که»."
      de: "Man vergleicht zwei Personen, die verschieden sind: *während*."
  - id: gap-3
    type: gap-fill
    prompt: Während wir im Urlaub ___, hat der Nachbar die Blumen gegossen.
    options: [sind, waren, sein]
    answer: waren
    explanation:
      en: "Both things happened at the same time in the past, so the *während* clause is in the past too: *waren*."
      fa: "هر دو کار هم‌زمان در گذشته رخ داده‌اند، پس جملهٔ پیرو با *während* هم در گذشته است: *waren*."
      de: "Beides war zur gleichen Zeit in der Vergangenheit. Darum steht auch der *während*-Satz in der Vergangenheit: *waren*."
  - id: gap-4
    type: gap-fill
    prompt: Während ich die Küche ___, saugst du Staub.
    options: [räume auf, aufräume, aufräumen]
    answer: aufräume
    explanation:
      en: "In the *während* clause the separable verb is one word at the end, with *ich*: *aufräume*."
      fa: "در جملهٔ پیرو با *während* فعل جداشدنی یک‌جا در پایان جمله می‌آید و با *ich* می‌شود *aufräume*."
      de: "Im *während*-Satz steht das trennbare Verb zusammen am Ende, bei *ich*: *aufräume*."
  - id: choice-1
    type: multiple-choice
    prompt: Während ich koche, …
    options: [du deckst den Tisch., den Tisch du deckst., deckst du den Tisch.]
    answer: deckst du den Tisch.
    explanation:
      en: "The *während* clause is position 1, so the main clause starts with its verb: *deckst du*."
      fa: "جملهٔ پیرو با *während* جایگاه اول است، پس جملهٔ پایه با فعلش آغاز می‌شود: *deckst du*."
      de: "Der *während*-Satz ist Position 1. Der Hauptsatz beginnt mit dem Verb: *deckst du*."
  - id: choice-2
    type: multiple-choice
    prompt: "Während Anna gern liest, sieht ihr Mann lieber fern. Was sagt der Satz?"
    options:
      ["Anna liest, bevor ihr Mann fernsieht.", Anna und ihr Mann mögen verschiedene Dinge., Anna liest nur am Abend.]
    answer: Anna und ihr Mann mögen verschiedene Dinge.
    explanation:
      en: "Here *während* sets two people side by side as a contrast: she likes reading, he likes television."
      fa: "این‌جا *während* دو نفر را در برابر هم می‌گذارد: او کتاب خواندن را دوست دارد و شوهرش تلویزیون را."
      de: "Hier vergleicht *während* zwei Personen: Sie liest gern, er sieht lieber fern."
  - id: choice-3
    type: multiple-choice
    prompt: "Er hört Musik, während er arbeitet. Was sagt der Satz?"
    options:
      [Er hört Musik nach der Arbeit., Er hört Musik und arbeitet zur gleichen Zeit., Er hört Musik vor der Arbeit.]
    answer: Er hört Musik und arbeitet zur gleichen Zeit.
    explanation:
      en: 'Here *während* means "while": the music and the work happen at the same time.'
      fa: "این‌جا *während* یعنی «هنگامی که»: موسیقی و کار هم‌زمان‌اند."
      de: "Hier heißt *während*: zur gleichen Zeit. Musik und Arbeit passieren gleichzeitig."
  - id: true-1
    type: true-false
    prompt: Während das Baby schläft, räume ich die Wohnung auf.
    answer: true
    explanation:
      en: "*Schläft* is at the end of the *während* clause, and the main clause starts with *räume*. The sentence is correct."
      fa: "*schläft* در پایان جملهٔ پیرو با *während* است و جملهٔ پایه با *räume* آغاز می‌شود. جمله درست است."
      de: "*Schläft* steht am Ende vom *während*-Satz, der Hauptsatz beginnt mit *räume*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Während ich koche, du deckst den Tisch.
    answer: false
    explanation:
      en: "After the *während* clause the verb comes first: *…, deckst du den Tisch.*"
      fa: "پس از جملهٔ پیرو با *während* فعل اول می‌آید: *…, deckst du den Tisch.*"
      de: "Nach dem *während*-Satz kommt zuerst das Verb: *…, deckst du den Tisch.*"
  - id: true-3
    type: true-false
    prompt: Mein Bruder ist sehr ordentlich, während ich eher chaotisch bin.
    answer: true
    explanation:
      en: "*Während* as a contrast, with *bin* at the end. The sentence is correct."
      fa: "*während* در معنای «در حالی که»، با *bin* در پایان جمله. جمله درست است."
      de: "*Während* als Gegensatz, *bin* steht am Ende. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Er hört Musik, während er macht Hausaufgaben.
    answer: false
    explanation:
      en: "In the *während* clause the verb goes to the end: *…, während er Hausaufgaben macht.*"
      fa: "در جملهٔ پیرو با *während* فعل به پایان جمله می‌رود: *…, während er Hausaufgaben macht.*"
      de: "Im *während*-Satz steht das Verb am Ende: *…, während er Hausaufgaben macht.*"
  - id: true-5
    type: true-false
    prompt: Während wir im Urlaub waren, hat der Nachbar die Blumen gegossen.
    answer: true
    explanation:
      en: "Two things at the same time in the past, *waren* at the end, the main clause verb first. The sentence is correct."
      fa: "دو کار هم‌زمان در گذشته، *waren* در پایان جملهٔ پیرو و فعل در آغاز جملهٔ پایه. جمله درست است."
      de: "Zwei Dinge zur gleichen Zeit in der Vergangenheit, *waren* am Ende, der Hauptsatz beginnt mit dem Verb. Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Während du ___ (duschen), mache ich das Frühstück.
    answers: [duschst]
    explanation:
      en: "With *du* the verb is *duschst*, at the end of the *während* clause."
      fa: "با *du* فعل *duschst* است و در پایان جملهٔ پیرو با *während* می‌آید."
      de: "Bei *du* heißt das Verb *duschst*. Es steht am Ende vom *während*-Satz."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Während das Wasser kocht, ___ (schneiden) ich das Gemüse.
    answers: [schneide]
    explanation:
      en: "The *während* clause is position 1, so the verb *schneide* comes next, before *ich*."
      fa: "جملهٔ پیرو با *während* جایگاه اول است، پس فعل *schneide* پیش از *ich* می‌آید."
      de: "Der *während*-Satz ist Position 1. Danach kommt das Verb *schneide*, vor *ich*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Während Tom ___ (einkaufen), räume ich die Wohnung auf.
    answers: [einkauft]
    explanation:
      en: "In the *während* clause the separable verb is one word at the end: *einkauft*."
      fa: "در جملهٔ پیرو با *während* فعل جداشدنی یک‌جا در پایان جمله می‌آید: *einkauft*."
      de: "Im *während*-Satz steht das trennbare Verb zusammen am Ende: *einkauft*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Meine Schwester trinkt nur Tee, ___ (während / bevor) ich viel Kaffee trinke.
    answers: [während]
    explanation:
      en: 'Two habits are set side by side as a contrast: *während*, "whereas".'
      fa: "دو عادت در برابر هم گذاشته شده‌اند: *während*، یعنی «در حالی که»."
      de: "Man vergleicht zwei Gewohnheiten, die verschieden sind: *während*."
  - id: error-1
    type: find-error
    prompt: Er hört Musik, wann er arbeitet.
    answer: wann
    explanation:
      en: "*Wann* only asks for a time. Two things at the same time: *…, während er arbeitet.*"
      fa: "*wann* فقط زمان را می‌پرسد. برای دو کار هم‌زمان: *…, während er arbeitet.*"
      de: "*Wann* fragt nur nach der Zeit. Zwei Dinge zur gleichen Zeit: *…, während er arbeitet.*"
  - id: order-1
    type: word-order
    answers:
      - ["während das Baby schläft,", räume, ich, die Wohnung, auf]
    explanation:
      en: "The *während* clause is position 1, so the verb *räume* comes next, then the subject, and *auf* last."
      fa: "جملهٔ پیرو با *während* جایگاه اول است، پس فعل *räume*، سپس فاعل و در آخر *auf* می‌آید."
      de: "Der *während*-Satz ist Position 1. Dann kommt das Verb *räume*, danach das Subjekt, *auf* steht am Ende."
  - id: order-2
    type: word-order
    answers:
      - ["ich höre Musik,", während, ich, die Hausaufgaben, mache]
    explanation:
      en: "*Während* starts the clause, then the subject and the object, and the verb *mache* comes last."
      fa: "*während* جمله را آغاز می‌کند، سپس فاعل و مفعول می‌آیند و فعل *mache* در آخر."
      de: "*Während* beginnt den Satz, dann kommen Subjekt und Objekt, das Verb *mache* steht am Ende."
  - id: match-1
    type: matching
    answer:
      - ["Ich höre Musik,", während ich jogge.]
      - ["Mein Bruder ist groß,", während ich klein bin.]
      - ["Im Norden regnet es,", während im Süden die Sonne scheint.]
    explanation:
      en: "Music and jogging happen at the same time; tall and small, rain and sun are contrasts."
      fa: "موسیقی و دویدن هم‌زمان‌اند؛ بلند و کوتاه، و باران و آفتاب در برابر هم‌اند."
      de: "Musik und Joggen passieren gleichzeitig. Groß und klein, Regen und Sonne sind Gegensätze."

