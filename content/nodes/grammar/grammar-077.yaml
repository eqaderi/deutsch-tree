examples:
  - de: Das ist meine Mutter.
    en: This is my mother.
    fa: این مادرم است.
  - de: Wo ist dein Bruder?
    en: Where is your brother?
    fa: برادرت کجاست؟
  - de: Peter sucht seinen Schlüssel.
    en: Peter is looking for his key.
    fa: پیتر دنبال کلیدش می‌گردد.
  - de: Anna besucht ihre Eltern.
    en: Anna is visiting her parents.
    fa: آنا به دیدن پدر و مادرش می‌رود.
  - de: Wir lieben unser Haus.
    en: We love our house.
    fa: ما خانه‌مان را دوست داریم.
  - de: Haben Sie Ihren Pass?
    en: Do you have your passport?
    fa: گذرنامه‌تان همراهتان است؟
  - de: Hast du dein Handy?
    en: Do you have your phone?
    fa: گوشی‌ات همراهت است؟
  - de: Heute besuche ich meinen Opa.
    en: Today I am visiting my grandpa.
    fa: امروز به دیدن پدربزرگم می‌روم.
  - de: Das sind unsere Kinder.
    en: These are our children.
    fa: این‌ها بچه‌های ما هستند.

mistakes:
  - wrong: Ich besuche mein Vater.
    right: Ich besuche meinen Vater.
    why:
      en: "*Vater* is masculine and the object, so the *Akkusativ*: *meinen*, like *einen*."
      fa: "*Vater* اسم مذکر و مفعول جمله است، پس در حالت *Akkusativ* می‌آید: *meinen*، مانند *einen*."
      de: "*Vater* ist maskulin und das Objekt. Darum Akkusativ: *meinen*, wie *einen*."
  - wrong: Das ist mein Schwester.
    right: Das ist meine Schwester.
    why:
      en: "*Schwester* is feminine, so *meine*, as in *eine Schwester*."
      fa: "*Schwester* اسم مؤنث است، پس *meine* می‌آید، مانند *eine Schwester*."
      de: "*Schwester* ist feminin. Darum *meine*, wie bei *eine Schwester*."
  - wrong: Das ist Lisa und seine Mutter.
    right: Das ist Lisa und ihre Mutter.
    why:
      en: "The owner is Lisa, a woman, so *ihr*. *Sein* is for an owner that is *er* or *es*."
      fa: "دارنده لیزا است که زن است، پس *ihr* می‌آید. *sein* برای دارنده‌ای است که *er* یا *es* باشد."
      de: "Lisa ist eine Frau. Darum *ihr*. *Sein* steht bei *er* und *es*."
  - wrong: Wir besuchen unser Großeltern.
    right: Wir besuchen unsere Großeltern.
    why:
      en: "*Großeltern* is a plural, and the plural takes *-e*: *unsere*."
      fa: "*Großeltern* جمع است و جمع *-e* می‌گیرد: *unsere*."
      de: "*Großeltern* ist Plural. Im Plural steht *-e*: *unsere*."

