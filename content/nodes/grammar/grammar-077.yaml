# Grammar list row 77.
id: grammar-077
kind: grammar
level: A1
chapter: a1-more-articles
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-062, grammar-081]
title:
  en: "*Possessivartikel*, *Nominativ* and *Akkusativ*"
  fa: "حرف تعریف ملکی (*Possessivartikel*) در حالت *Nominativ* و *Akkusativ*"
  de: "Possessivartikel im Nominativ und Akkusativ"

explanations:
  en:
    rule: >
      A possessive article (*mein*, *dein* …) stands before a noun and says
      whose it is. The word depends on the owner: *ich* → *mein*, *du* →
      *dein*, *er* and *es* → *sein*, *sie* → *ihr*, *wir* → *unser*, *sie*
      (plural) → *ihr*, *Sie* → *Ihr* (*euer*, for *ihr*, comes later). The
      ending depends on the noun after it, exactly as with *ein*: no ending
      for masculine and neuter nouns, *-e* for feminine nouns and the plural.
      In the *Akkusativ* only the masculine changes: *meinen*, like *einen*.
  fa:
    rule: >
      حرف تعریف ملکی (*Possessivartikel*) پیش از اسم می‌آید و نشان می‌دهد آن
      چیز به چه کسی تعلق دارد. خود واژه را دارنده تعیین می‌کند: *mein* برای *ich*،
      *dein* برای *du*، *sein* برای *er* و *es*، *ihr* برای *sie*، *unser*
      برای *wir*، *ihr* برای *sie* جمع و *Ihr* برای *Sie* رسمی (*euer* برای
      *ihr* در درس‌های بعدی می‌آید). پایانهٔ آن را اسمی تعیین می‌کند که پس از آن می‌آید،
      درست مانند *ein*: با اسم مذکر و خنثی پایانه‌ای ندارد و با اسم مؤنث و
      جمع *-e* می‌گیرد. در حالت *Akkusativ* (حالت مفعولی) فقط مذکر تغییر
      می‌کند: *meinen*، مانند *einen*. در فارسی «مادرش» برای دارندهٔ مرد و زن
      یکی است، ولی در آلمانی دارندهٔ مذکر یا خنثی *sein* می‌گیرد و دارندهٔ
      مؤنث *ihr*: *seine Mutter* و *ihre Mutter*.
  de:
    rule: >
      Der Possessivartikel steht vor einem Nomen und sagt, wem etwas gehört:
      *mein* (ich), *dein* (du), *sein* (er, es), *ihr* (sie), *unser* (wir),
      *ihr* (sie, Plural), *Ihr* (Sie). Die Endung kommt vom Nomen danach, wie
      bei *ein*: keine Endung bei maskulinen und neutralen Nomen, *-e* bei
      femininen Nomen und im Plural. Im Akkusativ ändert sich nur das
      Maskulinum: *meinen*, wie *einen*.

