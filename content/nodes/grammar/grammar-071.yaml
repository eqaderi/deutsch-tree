examples:
  - de: Das Auto meines Vaters ist schon sehr alt.
    en: My father's car is already very old.
    fa: ماشین پدرم دیگر خیلی قدیمی است.
  - de: Die Farbe des Hauses gefällt mir nicht.
    en: I don't like the colour of the house.
    fa: رنگ خانه را دوست ندارم.
  - de: Hast du die Rede des Bürgermeisters gehört?
    en: Did you hear the mayor's speech?
    fa: سخنرانی شهردار را شنیدی؟
  - de: Der Name der Straße ist sehr lang.
    en: The name of the street is very long.
    fa: اسم خیابان خیلی طولانی است.
  - de: Am Ende des Monats habe ich kein Geld mehr.
    en: At the end of the month I have no money left.
    fa: آخر ماه دیگر پولی ندارم.
  - de: Die Zimmer der Kinder sind oben.
    en: The children's rooms are upstairs.
    fa: اتاق‌های بچه‌ها طبقهٔ بالاست.
  - de: Das ist die Tochter einer Kollegin.
    en: That is a colleague's daughter.
    fa: او دختر یکی از همکارانم است.
  - de: Die Tür des Büros ist geschlossen.
    en: The office door is closed.
    fa: در دفتر بسته است.
  - de: Wir wohnen im Haus meiner Großeltern.
    en: We live in my grandparents' house.
    fa: ما در خانهٔ پدربزرگ و مادربزرگم زندگی می‌کنیم.
  - de: Die Preise von Wohnungen sind hier sehr hoch.
    en: Flat prices here are very high.
    fa: قیمت آپارتمان‌ها اینجا خیلی بالاست.

mistakes:
  - wrong: Das ist das Auto des Vater.
    right: Das ist das Auto des Vaters.
    why:
      en: "A masculine or neuter noun takes *-s* in the *Genitiv*: *des Vaters*."
      fa: "اسم مذکر و خنثی در حالت *Genitiv* پایانهٔ *-s* می‌گیرد: *des Vaters*."
      de: "Ein Nomen mit *der* oder *das* bekommt im Genitiv *-s*: *des Vaters*."
  - wrong: Der Name des Straße ist sehr lang.
    right: Der Name der Straße ist sehr lang.
    why:
      en: "*Straße* is feminine. In the *Genitiv* *die* becomes *der*, not *des*, and the noun takes no ending."
      fa: "*Straße* اسم مؤنث (*die*) است. در حالت *Genitiv*، *die* به *der* تبدیل می‌شود، نه به *des*، و اسم پایانه‌ای نمی‌گیرد."
      de: "*Straße* hat den Artikel *die*. Im Genitiv wird *die* zu *der*, nicht zu *des*. Das Nomen bekommt keine Endung."
  - wrong: Die Zimmer die Kinder sind oben.
    right: Die Zimmer der Kinder sind oben.
    why:
      en: "In the plural the *Genitiv* article is *der*: *der Kinder*."
      fa: "در جمع، حرف تعریف حالت *Genitiv* همان *der* است: *der Kinder*."
      de: "Im Plural ist der Artikel im Genitiv *der*: *der Kinder*."
  - wrong: Die Farbe des Haus gefällt mir nicht.
    right: Die Farbe des Hauses gefällt mir nicht.
    why:
      en: "*Haus* ends in *-s*, so it takes *-es* in the *Genitiv*: *des Hauses*."
      fa: "*Haus* به *-s* ختم می‌شود، پس در حالت *Genitiv* پایانهٔ *-es* می‌گیرد: *des Hauses*."
      de: "*Haus* endet auf *-s*. Darum bekommt es im Genitiv *-es*: *des Hauses*."
  - wrong: Das ist die Wohnung meines Eltern.
    right: Das ist die Wohnung meiner Eltern.
    why:
      en: "*Eltern* is plural. In the plural *meine* becomes *meiner* in the *Genitiv*."
      fa: "*Eltern* جمع است. در جمع، *meine* در حالت *Genitiv* به *meiner* تبدیل می‌شود."
      de: "*Eltern* ist Plural. Im Plural wird *meine* im Genitiv zu *meiner*."

