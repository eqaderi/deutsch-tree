title:
  en: "*Genitiv* with articles"
  fa: "*Genitiv* با حرف تعریف"
  de: "Genitiv mit Artikel"

explanations:
  en:
    rule: >
      The *Genitiv* says whose something is, or what it belongs to. It comes
      after the noun it describes: *das Auto des Lehrers* (the teacher's
      car), *die Farbe des Hauses* (the colour of the house). *Der* and *das*
      become *des*, and the noun takes *-s*: *des Vaters*, *des Büros*. A noun
      ending in *-s*, *-ß*, *-x* or *-z* takes *-es*: *des Hauses*,
      *des Kurses*; many short nouns may take it too (*des Tages*, *des Tisches*). *Die*
      becomes *der*, in the feminine and in the plural, and the noun stays as
      it is: *der Mutter*, *der Kinder*. *Ein* becomes *eines* or *einer*,
      and *mein*, *dein* or *kein* take the same endings: *meines Vaters*,
      *meiner Eltern*. A plural without an article has no *Genitiv*: use
      *von* + *Dativ* (*die Preise von Wohnungen*). The *Genitiv* is common in
      writing; in speech *von* + *Dativ* is often used instead.
  fa:
    rule: >
      حالت *Genitiv* (حالت ملکی) نشان می‌دهد چیزی مال کیست یا به چه تعلق
      دارد. این حالت پس از اسمی می‌آید که توصیفش می‌کند: *das Auto des
      Lehrers* (ماشین معلم) و *die Farbe des Hauses* (رنگ خانه). ترتیب مانند
      اضافهٔ فارسی است: اول خود چیز، سپس صاحب آن. *der* و *das* به *des*
      تبدیل می‌شوند و اسم *-s* می‌گیرد: *des Vaters* و *des Büros*. اسمی که
      به *-s*، *-ß*، *-x* یا *-z* ختم شود *-es* می‌گیرد: *des Hauses*
      و *des Kurses*؛ بسیاری از اسم‌های کوتاه هم می‌توانند *-es* بگیرند
      (*des Tages*، *des Tisches*). *die*، چه در مؤنث و چه در جمع، به *der* تبدیل می‌شود و
      خود اسم تغییری نمی‌کند: *der Mutter* و *der Kinder*. *ein* به *eines*
      یا *einer* تبدیل می‌شود و *mein*، *dein* و *kein* هم همین پایانه‌ها را
      می‌گیرند: *meines Vaters* و *meiner Eltern*. اسم جمعِ بدون حرف تعریف
      حالت *Genitiv* ندارد؛ به‌جای آن *von* با حالت *Dativ* می‌آید: *die
      Preise von Wohnungen*. حالت *Genitiv* در نوشتار رایج است و در گفتار
      بیشتر *von* با حالت *Dativ* به کار می‌رود.
  de:
    rule: >
      Der Genitiv sagt, wem etwas gehört oder wozu etwas gehört. Er steht
      nach dem Nomen: *das Auto des Lehrers*, *die Farbe des Hauses*. *Der*
      und *das* werden zu *des*, und das Nomen bekommt *-s*: *des Vaters*,
      *des Büros*. Endet das Nomen auf *-s*, *-ß*, *-x* oder *-z*,
      bekommt es *-es*: *des Hauses*, *des Kurses*. Viele kurze Nomen können
      auch *-es* haben (*des Tages*, *des Tisches*). *Die* wird zu *der*, bei feminin und im
      Plural, und das Nomen bleibt gleich: *der Mutter*, *der Kinder*. *Ein*
      wird zu *eines* oder *einer*. *Mein*, *dein* und *kein* haben die
      gleichen Endungen: *meines Vaters*, *meiner Eltern*. Im Plural ohne
      Artikel gibt es keinen Genitiv. Dann nimmt man *von* + Dativ: *die
      Preise von Wohnungen*. Den Genitiv schreibt man oft; beim Sprechen sagt
      man oft *von* + Dativ.

