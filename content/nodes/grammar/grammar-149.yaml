# Grammar list row 149.
id: grammar-149
kind: grammar
level: A1
chapter: a1-building-sentences
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-139]
title:
  en: "*und*, *oder*, *aber*, *denn*"
  fa: "*und*، *oder*، *aber*، *denn*"
  de: "*und*, *oder*, *aber*, *denn*"

explanations:
  en:
    rule: >
      *Und* (and), *oder* (or), *aber* (but) and *denn* (because) join two
      main clauses. They stand in position 0, outside the clause, before
      position 1. So the word order after them does not change: the verb stays
      in position 2. *Ich gehe nicht spazieren, denn es ist zu kalt.* Before
      *aber* and *denn* there is a comma. After *und*, *oder* and *aber* a part
      that is the same in both clauses can be left out: *Ich koche und räume
      danach auf.* *Denn* gives the reason, and it comes in the second clause.
      (*Weil* also means "because", but it sends the verb to the end; that is a
      later topic.)
  fa:
    rule: >
      *und* (و)، *oder* (یا)، *aber* (اما) و *denn* (زیرا) دو جملهٔ پایه را
      به هم وصل می‌کنند. این حرف‌های ربط در جایگاه صفر می‌آیند، یعنی بیرون از
      جمله و پیش از جایگاه اول. پس ترتیب واژه‌ها پس از آن‌ها تغییر نمی‌کند و
      فعل در جایگاه دوم می‌ماند: *Ich gehe nicht spazieren, denn es ist zu
      kalt.* پیش از *aber* و *denn* ویرگول می‌آید. پس از *und*، *oder* و
      *aber* می‌توان بخشی را که در هر دو جمله یکسان است انداخت: *Ich koche und
      räume danach auf.* *denn* علت را بیان می‌کند و در جملهٔ دوم می‌آید.
      *weil* نیز به معنای «زیرا» است، ولی فعل را به پایان جمله می‌فرستد؛ این
      موضوع درسی دیگر است.
  de:
    rule: >
      *Und*, *oder*, *aber* und *denn* verbinden zwei Hauptsätze. Sie stehen
      auf Position 0: vor Position 1, nicht im Satz. Darum ändert sich die
      Wortstellung danach nicht. Das Verb bleibt auf Position 2: *Ich gehe
      nicht spazieren, denn es ist zu kalt.* Vor *aber* und *denn* steht ein
      Komma. Nach *und*, *oder* und *aber* kann man einen Teil weglassen, der
      in beiden Sätzen gleich ist: *Ich koche und räume danach auf.* *Denn*
      nennt den Grund. Es steht im zweiten Satz. (Auch *weil* nennt einen
      Grund, aber dann steht das Verb am Ende. Das kommt später.)

table:
  columns:
    - { en: Clause 1, fa: جملهٔ اول, de: Satz 1 }
    - { en: Position 0, fa: جایگاه صفر, de: Position 0 }
    - { en: Position 1, fa: جایگاه اول, de: Position 1 }
    - { en: "Position 2: verb", fa: "جایگاه دوم: فعل", de: "Position 2: Verb" }
    - { en: The rest, fa: بقیهٔ جمله, de: Rest }
  rows:
    - [Ich trinke Kaffee, und, mein Mann, trinkt, Tee.]
    - [Wir fahren mit dem Zug, oder, wir, nehmen, das Auto.]
    - ["Das Hotel ist schön,", aber, es, ist, sehr teuer.]
    - ["Ich gehe nicht spazieren,", denn, es, ist, zu kalt.]
    - [Ich arbeite heute, und, morgen, habe, ich frei.]

examples:
  - de: Ich trinke Kaffee und mein Mann trinkt Tee.
    en: I drink coffee and my husband drinks tea.
    fa: من قهوه می‌نوشم و شوهرم چای.
  - de: Ich koche und räume danach auf.
    en: I cook and tidy up afterwards.
    fa: آشپزی می‌کنم و بعد همه‌جا را مرتب می‌کنم.
  - de: Trinkst du Tee oder Kaffee?
    en: Do you drink tea or coffee?
    fa: چای می‌نوشی یا قهوه؟
  - de: Wir fahren mit dem Zug oder wir nehmen das Auto.
    en: We'll go by train, or we'll take the car.
    fa: با قطار می‌رویم یا با ماشین.
  - de: Das Hotel ist schön, aber es ist sehr teuer.
    en: The hotel is nice, but it is very expensive.
    fa: هتل زیباست، اما خیلی گران است.
  - de: Er ist müde, aber er geht noch einkaufen.
    en: He is tired, but he is still going shopping.
    fa: خسته است، اما هنوز می‌خواهد به خرید برود.
  - de: Ich gehe nicht spazieren, denn es ist zu kalt.
    en: I'm not going for a walk, because it is too cold.
    fa: به پیاده‌روی نمی‌روم، زیرا هوا خیلی سرد است.
  - de: Ich lerne Deutsch, denn ich möchte in Wien arbeiten.
    en: I'm learning German, because I would like to work in Vienna.
    fa: آلمانی یاد می‌گیرم، زیرا می‌خواهم در وین کار کنم.
  - de: Ich arbeite heute und morgen habe ich frei.
    en: I'm working today, and tomorrow I'm off.
    fa: امروز کار می‌کنم و فردا تعطیلم.

mistakes:
  - wrong: Ich bleibe zu Hause, denn bin ich krank.
    right: Ich bleibe zu Hause, denn ich bin krank.
    why:
      en: "*Denn* is position 0, not position 1. The subject comes first, then the verb."
      fa: "*denn* در جایگاه صفر است، نه جایگاه اول. پس از آن نخست فاعل می‌آید و سپس فعل."
      de: "*Denn* steht auf Position 0, nicht auf Position 1. Zuerst kommt das Subjekt, dann das Verb."
  - wrong: Ich bleibe zu Hause, denn ich krank bin.
    right: Ich bleibe zu Hause, denn ich bin krank.
    why:
      en: "After *denn* the verb stays in position 2. Only after *weil* does it go to the end."
      fa: "پس از *denn* فعل در جایگاه دوم می‌ماند. فقط پس از *weil* فعل به پایان جمله می‌رود."
      de: "Nach *denn* bleibt das Verb auf Position 2. Nur nach *weil* steht es am Ende."
  - wrong: Ich arbeite heute und morgen ich habe frei.
    right: Ich arbeite heute und morgen habe ich frei.
    why:
      en: "*Und* is position 0, so *morgen* is position 1. The verb comes next, then the subject."
      fa: "*und* در جایگاه صفر است، پس *morgen* جایگاه اول است. فعل پس از آن می‌آید و سپس فاعل."
      de: "*Und* ist Position 0, *morgen* ist Position 1. Dann kommt das Verb und danach das Subjekt."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Ich bleibe zu Hause, ___ ich bin krank.
    options: [denn, aber, oder]
    answer: denn
    explanation:
      en: "Being ill is the reason for staying at home, and *denn* gives a reason."
      fa: "بیماری علتِ در خانه ماندن است و *denn* علت را بیان می‌کند."
      de: "Krank sein ist der Grund. *Denn* nennt den Grund."
  - id: gap-2
    type: gap-fill
    prompt: Das Hotel ist schön, ___ es ist sehr teuer.
    options: [aber, denn, oder]
    answer: aber
    explanation:
      en: "A good point and a bad point: *aber* sets them against each other."
      fa: "یک ویژگی خوب و یک ویژگی بد: *aber* آن دو را در برابر هم می‌گذارد."
      de: "Etwas Gutes und etwas Schlechtes: *aber* zeigt den Gegensatz."
  - id: gap-3
    type: gap-fill
    prompt: Trinkst du Tee ___ Kaffee?
    options: [oder, aber, denn]
    answer: oder
    explanation:
      en: "The question offers a choice between two things, so *oder*."
      fa: "پرسش میان دو چیز انتخاب می‌خواهد، پس *oder* می‌آید."
      de: "Die Frage fragt nach einer Wahl. Darum *oder*."
  - id: gap-4
    type: gap-fill
    prompt: Ich lerne Deutsch, denn ___ in Wien arbeiten.
    options: [ich möchte, möchte ich, möchten ich]
    answer: ich möchte
    explanation:
      en: "*Denn* is position 0, so the subject *ich* comes first and the verb *möchte* second."
      fa: "*denn* در جایگاه صفر است، پس نخست فاعل *ich* می‌آید و سپس فعل *möchte*."
      de: "*Denn* ist Position 0. Dann kommt das Subjekt *ich* und danach das Verb *möchte*."
  - id: gap-5
    type: gap-fill
    prompt: Ich arbeite heute und morgen ___ frei.
    options: [habe ich, ich habe, hat ich]
    answer: habe ich
    explanation:
      en: "After *und*, *morgen* is position 1. So the verb *habe* comes next, then *ich*."
      fa: "پس از *und*، *morgen* جایگاه اول است. پس فعل *habe* پس از آن می‌آید و سپس *ich*."
      de: "Nach *und* ist *morgen* Position 1. Dann kommt das Verb *habe* und danach *ich*."
  - id: choice-1
    type: multiple-choice
    prompt: "es regnet / aber / wir gehen spazieren"
    options:
      [
        "Es regnet, aber wir gehen spazieren.",
        "Es regnet, aber gehen wir spazieren.",
        "Es regnet, aber wir spazieren gehen.",
      ]
    answer: Es regnet, aber wir gehen spazieren.
    explanation:
      en: "*Aber* is position 0: subject *wir*, then the verb *gehen*, as in any statement."
      fa: "*aber* در جایگاه صفر است: نخست فاعل *wir* و سپس فعل *gehen*، مانند هر جملهٔ خبری."
      de: "*Aber* ist Position 0: zuerst das Subjekt *wir*, dann das Verb *gehen*, wie im Aussagesatz."
  - id: choice-2
    type: multiple-choice
    prompt: "ich gehe nicht schwimmen / denn / das Wasser ist kalt"
    options:
      [
        "Ich gehe nicht schwimmen, denn das Wasser ist kalt.",
        "Ich gehe nicht schwimmen, denn ist das Wasser kalt.",
        "Ich gehe nicht schwimmen, denn das Wasser kalt ist.",
      ]
    answer: Ich gehe nicht schwimmen, denn das Wasser ist kalt.
    explanation:
      en: "After *denn* the order is that of a statement: *das Wasser ist kalt*."
      fa: "پس از *denn* ترتیب واژه‌ها همان ترتیب جملهٔ خبری است: *das Wasser ist kalt*."
      de: "Nach *denn* ist die Wortstellung wie im Aussagesatz: *das Wasser ist kalt*."
  - id: choice-3
    type: multiple-choice
    prompt: Ich koche und ___.
    options: [räume danach auf, ich danach aufräume, danach ich räume auf]
    answer: räume danach auf
    explanation:
      en: "The subject *ich* is the same in both clauses, so it can be left out after *und*: *und räume danach auf*."
      fa: "فاعل *ich* در هر دو جمله یکسان است، پس پس از *und* می‌توان آن را انداخت: *und räume danach auf*."
      de: "Das Subjekt *ich* ist in beiden Sätzen gleich. Nach *und* kann es fehlen: *und räume danach auf*."
  - id: true-1
    type: true-false
    prompt: Ich bin müde, aber ich kann nicht schlafen.
    answer: true
    explanation:
      en: "After *aber* comes a normal statement: *ich kann nicht schlafen*. The sentence is correct."
      fa: "پس از *aber* یک جملهٔ خبری معمولی می‌آید: *ich kann nicht schlafen*. جمله درست است."
      de: "Nach *aber* kommt ein normaler Aussagesatz: *ich kann nicht schlafen*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Wir bleiben zu Hause, denn es regnet.
    answer: true
    explanation:
      en: "*Denn* gives the reason, and *es regnet* has the verb in position 2. The sentence is correct."
      fa: "*denn* علت را بیان می‌کند و در *es regnet* فعل در جایگاه دوم است. جمله درست است."
      de: "*Denn* nennt den Grund. In *es regnet* steht das Verb auf Position 2. Der Satz ist richtig."
  - id: true-3
    type: true-false
    prompt: Er kommt heute nicht, denn er krank ist.
    answer: false
    explanation:
      en: "After *denn* the verb stays in position 2: *denn er ist krank*."
      fa: "پس از *denn* فعل در جایگاه دوم می‌ماند: *denn er ist krank*."
      de: "Nach *denn* bleibt das Verb auf Position 2: *denn er ist krank*."
  - id: true-4
    type: true-false
    prompt: Ich lese ein Buch und mein Mann sieht fern.
    answer: true
    explanation:
      en: "After *und* comes a normal statement: *mein Mann sieht fern*. The sentence is correct."
      fa: "پس از *und* یک جملهٔ خبری معمولی می‌آید: *mein Mann sieht fern*. جمله درست است."
      de: "Nach *und* kommt ein normaler Aussagesatz: *mein Mann sieht fern*. Der Satz ist richtig."
  - id: true-5
    type: true-false
    prompt: Das Essen ist gut, aber ist es teuer.
    answer: false
    explanation:
      en: "*Aber* is position 0, so the subject comes first: *aber es ist teuer*."
      fa: "*aber* در جایگاه صفر است، پس نخست فاعل می‌آید: *aber es ist teuer*."
      de: "*Aber* ist Position 0. Zuerst kommt das Subjekt: *aber es ist teuer*."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Ich lerne Deutsch, denn ich ___ (wollen) in Berlin studieren.
    answers: [will]
    explanation:
      en: "After *denn ich* the verb comes in position 2: *ich will*."
      fa: "پس از *denn ich*، فعل در جایگاه دوم می‌آید: *ich will*."
      de: "Nach *denn ich* steht das Verb auf Position 2: *ich will*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Es ist kalt, aber wir ___ (gehen) spazieren.
    answers: [gehen]
    explanation:
      en: "After *aber wir* the verb comes in position 2, with the ending for *wir*: *gehen*."
      fa: "پس از *aber wir*، فعل با شناسهٔ *wir* در جایگاه دوم می‌آید: *gehen*."
      de: "Nach *aber wir* steht das Verb auf Position 2, mit der Endung für *wir*: *gehen*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Ich habe Hunger und mein Bruder ___ (haben) Durst.
    answers: [hat]
    explanation:
      en: "After *und* the clause *mein Bruder hat Durst* has its own subject, *mein Bruder* (*er*): *hat*."
      fa: "پس از *und*، جملهٔ *mein Bruder hat Durst* فاعل خودش را دارد: *mein Bruder* (*er*)، پس *hat*."
      de: "Nach *und* hat der Satz sein eigenes Subjekt *mein Bruder* (*er*): *hat*."
  - id: order-1
    type: word-order
    answers:
      - ["wir bleiben zu Hause,", denn, es, regnet]
    explanation:
      en: "*Denn* starts the second clause, and the reason follows in statement order: *es regnet*."
      fa: "*denn* جملهٔ دوم را آغاز می‌کند و علت با ترتیب جملهٔ خبری می‌آید: *es regnet*."
      de: "*Denn* beginnt den zweiten Satz. Der Grund folgt wie ein Aussagesatz: *es regnet*."
  - id: match-1
    type: matching
    answer:
      - ["Ich bleibe heute im Bett,", denn ich bin krank.]
      - [Möchtest du Tee, oder Kaffee?]
      - ["Das Auto ist alt,", aber es fährt noch gut.]
    explanation:
      en: "*Denn* gives the reason, *oder* offers a choice, and *aber* sets two things against each other."
      fa: "*denn* علت را بیان می‌کند، *oder* انتخاب می‌دهد و *aber* دو چیز را در برابر هم می‌گذارد."
      de: "*Denn* nennt den Grund, *oder* gibt eine Wahl, und *aber* zeigt einen Gegensatz."

