title:
  en: "*Imperativ*, *du*- and *ihr*-form"
  fa: "امر (*Imperativ*) با *du* و *ihr*"
  de: "Imperativ mit *du* und *ihr*"

explanations:
  en:
    rule: >
      The *du* imperative is the *du* form of the present without *du* and
      without *-st*: *du gehst*, *Geh!* Verbs that change *e* to *i* or *ie*
      keep the change (*Nimm!*, *Lies!*), but verbs with *a* to *ä* lose the
      umlaut (*du fährst*, *Fahr!*). A stem ending in *-t* or *-d* adds *-e*:
      *Warte!* The *ihr* imperative is the *ihr* form without *ihr*: *Kommt
      mit!* A separable prefix goes to the end (*Mach das Fenster zu!*).
      *Sein* and *haben* give *Sei!*, *Seid!* and *Hab!*, *Habt!*
  fa:
    rule: >
      امر با *du* همان صرف *du* در زمان حال است، بدون *du* و بدون *-st*: *du
      gehst*، *Geh!* فعل‌هایی که واکهٔ *e* را به *i* یا *ie* تغییر می‌دهند،
      این تغییر را نگه می‌دارند (*Nimm!*، *Lies!*)، اما فعل‌هایی که *a* را به
      *ä* تغییر می‌دهند، در امر *a* را نگه می‌دارند (*du fährst*، *Fahr!*).
      اگر بن فعل به *-t* یا *-d* ختم شود، *-e* می‌گیرد: *Warte!* امر با *ihr*
      همان صرف *ihr* است، بدون *ihr*: *Kommt mit!* پیشوند فعل جداشدنی به
      پایان جمله می‌رود (*Mach das Fenster zu!*). امر *sein* و *haben* چنین
      است: *Sei!*، *Seid!* و *Hab!*، *Habt!*
  de:
    rule: >
      Der Imperativ mit *du* ist die *du*-Form ohne *du* und ohne *-st*: *du
      gehst*, *Geh!* Bei *e* zu *i* oder *ie* bleibt der neue Vokal (*Nimm!*,
      *Lies!*), bei *a* zu *ä* nicht (*Fahr!*). Endet der Stamm auf *-t* oder
      *-d*, kommt *-e* dazu: *Warte!* Der Imperativ mit *ihr* ist die
      *ihr*-Form ohne *ihr*: *Kommt mit!* Das Präfix steht am Ende. *Sein*
      und *haben*: *Sei!*, *Seid!*, *Hab!*, *Habt!*

table:
  columns:
    - { en: Infinitive, fa: مصدر, de: Infinitiv }
    - { en: "*du*", fa: "*du*", de: "*du*" }
    - { en: "*ihr*", fa: "*ihr*", de: "*ihr*" }
  rows:
    - [gehen, Geh!, Geht!]
    - [kommen, Komm!, Kommt!]
    - [warten, Warte!, Wartet!]
    - [nehmen (e → i), Nimm!, Nehmt!]
    - [sprechen (e → i), Sprich!, Sprecht!]
    - [lesen (e → ie), Lies!, Lest!]
    - [fahren (a → ä), Fahr!, Fahrt!]
    - [zumachen, Mach … zu!, Macht … zu!]
    - [sein, Sei!, Seid!]
    - [haben, Hab!, Habt!]

examples:
  - de: Geh bitte nach Hause!
    en: Please go home!
    fa: لطفاً به خانه برو!
  - de: Mach das Fenster zu!
    en: Close the window!
    fa: پنجره را ببند!
  - de: Kinder, kommt mit!
    en: Children, come along!
    fa: بچه‌ها، با ما بیایید!
  - de: Sei bitte pünktlich!
    en: Please be on time!
    fa: لطفاً سر وقت باش!
  - de: Fahr langsam!
    en: Drive slowly!
    fa: آهسته رانندگی کن!
  - de: Nimm ein Stück Kuchen!
    en: Have a piece of cake!
    fa: یک تکه کیک بردار!
  - de: Lies den Text laut!
    en: Read the text aloud!
    fa: متن را بلند بخوان!
  - de: Seid bitte leise!
    en: Please be quiet! (to several people)
    fa: لطفاً ساکت باشید! (خطاب به چند نفر)
  - de: Hab keine Angst!
    en: Don't be afraid!
    fa: نترس!

mistakes:
  - wrong: Gehst nach Hause!
    right: Geh nach Hause!
    why:
      en: "The *du* imperative drops *du* and the ending *-st*: *Geh!*"
      fa: "امر با *du*، هم *du* و هم شناسهٔ *-st* را حذف می‌کند: *Geh!*"
      de: "Im Imperativ fallen *du* und *-st* weg: *Geh!*"
  - wrong: Fähr langsam!
    right: Fahr langsam!
    why:
      en: "Verbs with *a* to *ä* keep the plain *a* in the imperative: *Fahr!*"
      fa: "فعل‌هایی که *a* را به *ä* تغییر می‌دهند، در امر همان *a* را دارند: *Fahr!*"
      de: "Bei *a* zu *ä* steht im Imperativ wieder *a*: *Fahr!*"
  - wrong: Nehm den Bus!
    right: Nimm den Bus!
    why:
      en: "Verbs with *e* to *i* keep the change: *du nimmst*, *Nimm!*"
      fa: "فعل‌هایی که *e* را به *i* تغییر می‌دهند، این تغییر را در امر نگه می‌دارند: *du nimmst*، *Nimm!*"
      de: "Bei *e* zu *i* bleibt das *i*: *du nimmst*, *Nimm!*"
  - wrong: Bist ruhig!
    right: Sei ruhig!
    why:
      en: "The imperative of *sein* is *Sei!*, and with *ihr* *Seid!*"
      fa: "امر *sein* با *du* می‌شود *Sei!* و با *ihr* می‌شود *Seid!*"
      de: "Der Imperativ von *sein* ist *Sei!*, bei *ihr* *Seid!*"

