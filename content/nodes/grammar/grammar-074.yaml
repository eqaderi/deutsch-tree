# Grammar list row 74.
id: grammar-074
kind: grammar
level: A1
chapter: a1-nouns-articles
order: 4
status: published
recogniseOnly: false
prerequisites: [grammar-059]
title:
  en: "Indefinite article"
  fa: "حرف تعریف نامعین"
  de: "Unbestimmter Artikel"

explanations:
  en:
    rule: >
      The indefinite article is *ein* for masculine and neuter nouns and
      *eine* for feminine ones: *ein Tisch*, *ein Buch*, *eine Lampe*. It is
      used like English "a": for something new, or one of many. *Der*, *die*
      and *das* name something already known: *Da ist ein Hund. Der Hund ist
      groß.* *Ein* has no plural, so the plural stands without an article:
      *ein Tisch – Tische*.
  fa:
    rule: >
      حرف تعریف نامعین برای اسم‌های مذکر و خنثی *ein* و برای اسم‌های مؤنث
      *eine* است: *ein Tisch*، *ein Buch*، *eine Lampe*. کاربردش مانند «یک» یا
      «ـی» در فارسی است: برای چیزی که تازه از آن سخن می‌گوییم یا یکی از چند
      چیز است. *der*، *die* و *das* چیزی را نام می‌برند که شناخته است: *Da
      ist ein Hund. Der Hund ist groß.* حرف تعریف *ein* جمع ندارد، پس اسم جمع
      بدون حرف تعریف می‌آید: *ein Tisch – Tische*.
  de:
    rule: >
      Der unbestimmte Artikel ist *ein* bei maskulinen und neutralen Nomen und
      *eine* bei femininen Nomen: *ein Tisch*, *ein Buch*, *eine Lampe*. Man
      sagt *ein* oder *eine*, wenn etwas neu ist. Ist es schon bekannt, sagt
      man *der*, *die* oder *das*: *Da ist ein Hund. Der Hund ist groß.* Im
      Plural gibt es keinen unbestimmten Artikel: *ein Tisch – Tische*.

table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "With *ein*", fa: "با *ein*", de: "Mit *ein*" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [der Tisch, ein Tisch, Das ist ein Tisch.]
    - [die Lampe, eine Lampe, Das ist eine Lampe.]
    - [das Buch, ein Buch, Hier ist ein Buch.]
    - [die Tische (Plural), –, Das sind Tische.]

examples:
  - de: Das ist ein Tisch.
    en: This is a table.
    fa: این یک میز است.
  - de: Das ist eine Lampe.
    en: This is a lamp.
    fa: این یک چراغ است.
  - de: Hier ist ein Buch.
    en: Here is a book.
    fa: یک کتاب این‌جاست.
  - de: Ein Mann wartet vor der Tür.
    en: A man is waiting at the door.
    fa: مردی جلوی در منتظر است.
  - de: Eine Frau fragt nach dem Weg.
    en: A woman is asking the way.
    fa: زنی راه را می‌پرسد.
  - de: Da kommt ein Bus.
    en: Here comes a bus.
    fa: یک اتوبوس دارد می‌آید.
  - de: Ein Kaffee kostet 2 Euro.
    en: A coffee costs 2 euros.
    fa: یک قهوه ۲ یورو است.
  - de: Ist das ein Hund oder eine Katze?
    en: Is that a dog or a cat?
    fa: آن سگ است یا گربه؟
  - de: Da ist ein Hund. Der Hund ist groß.
    en: There is a dog. The dog is big.
    fa: آن‌جا سگی هست. سگ بزرگ است.
  - de: Das sind Äpfel.
    en: These are apples.
    fa: این‌ها سیب‌اند.

mistakes:
  - wrong: Das ist ein Lampe.
    right: Das ist eine Lampe.
    why:
      en: "*Lampe* is feminine, so *eine*: *eine Lampe*."
      fa: "*Lampe* اسم مؤنث است، پس *eine* می‌آید: *eine Lampe*."
      de: "*Lampe* ist feminin. Darum *eine*: *eine Lampe*."
  - wrong: Das ist eine Buch.
    right: Das ist ein Buch.
    why:
      en: "*Buch* is neuter, and neuter nouns take *ein*, like masculine ones."
      fa: "*Buch* اسم خنثی است و اسم خنثی، مانند اسم مذکر، *ein* می‌گیرد."
      de: "*Buch* ist neutral. Neutrale Nomen haben *ein*, wie maskuline Nomen."
  - wrong: Das sind eine Äpfel.
    right: Das sind Äpfel.
    why:
      en: "*Ein* has no plural. A plural noun stands without an article here."
      fa: "*ein* جمع ندارد. این‌جا اسم جمع بدون حرف تعریف می‌آید."
      de: "*Ein* hat keinen Plural. Hier steht das Nomen ohne Artikel."

