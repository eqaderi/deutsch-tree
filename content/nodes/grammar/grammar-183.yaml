kind: grammar
level: B1
chapter: b1-relative-clauses
order: 4
status: coming-soon
recogniseOnly: true
prerequisites: [grammar-071, grammar-180]
title:
  en: "Relative pronoun in the *Genitiv*"
  fa: "ضمیر موصولی در حالت *Genitiv* (*dessen*، *deren*)"
  de: "Relativpronomen im Genitiv (*dessen*, *deren*)"

explanations:
  en:
    rule: >
      *Dessen* and *deren* open a relative clause that says whose something
      is, like English "whose": *Florian Bader, dessen Zwillinge in die
      Krippe gehen, …* *Dessen* refers back to a masculine or neuter noun,
      *deren* to a feminine noun or a plural. The owner decides, not the
      thing owned: *die Frau, deren Sohn hier arbeitet* has *deren*, although
      *Sohn* is masculine. It helps to read *dessen* as *sein* and *deren* as
      *ihr*: *die Frau, deren Sohn …* is *die Frau – ihr Sohn …*. The noun
      after *dessen* or *deren* has no article of its own. You meet these
      forms mostly in written texts, and you only need to understand them; in
      your own sentences, two sentences do the same job: *Ich kenne die Frau.
      Ihr Sohn arbeitet hier.*
  fa:
    rule: >
      *dessen* و *deren* جملهٔ موصولی‌ای را آغاز می‌کنند که می‌گوید چیزی از
      آنِ کیست: *Florian Bader, dessen Zwillinge in die Krippe gehen, …* (فلوریان
      بادر که دوقلوهایش به مهدکودک می‌روند). *dessen* به اسم مذکر یا خنثی
      برمی‌گردد و *deren* به اسم مؤنث یا جمع. ملاک، صاحب چیز است، نه خود آن
      چیز: در *die Frau, deren Sohn hier arbeitet* ضمیر *deren* است، هرچند
      *Sohn* مذکر است. *dessen* را مانند *sein* و *deren* را مانند *ihr*
      بخوانید: *die Frau, deren Sohn …* یعنی «زنی که پسرش …». اسمِ پس از
      *dessen* یا *deren* حرف تعریف نمی‌گیرد. این شکل‌ها بیشتر در متن‌های
      نوشتاری می‌آیند و کافی است آن‌ها را بفهمید. در جمله‌های خودتان می‌توانید
      همین را با دو جمله بگویید: *Ich kenne die Frau. Ihr Sohn arbeitet hier.*
  de:
    rule: >
      Mit *dessen* und *deren* beginnt ein Relativsatz, der sagt, wem etwas
      gehört: *Florian Bader, dessen Zwillinge in die Krippe gehen, …*
      *Dessen* steht für ein maskulines oder neutrales Nomen, *deren* für ein
      feminines Nomen oder für den Plural. Wichtig ist der Besitzer, nicht die
      Sache: *die Frau, deren Sohn hier arbeitet*. *Sohn* ist maskulin, aber
      es heißt *deren*, wegen *die Frau*. Lesen Sie *dessen* wie *sein* und
      *deren* wie *ihr*: *die Frau, deren Sohn …* heißt *die Frau – ihr Sohn
      …*. Das Nomen nach *dessen* oder *deren* hat keinen Artikel. Die Formen
      stehen meistens in geschriebenen Texten. Sie müssen sie nur verstehen.
      Selbst können Sie zwei Sätze sagen: *Ich kenne die Frau. Ihr Sohn
      arbeitet hier.*

