examples:
  - de: Ich wasche mir die Hände.
    en: I wash my hands.
    fa: دست‌هایم را می‌شویم.
  - de: Ich kann mir das gut vorstellen.
    en: I can easily imagine that.
    fa: این را خوب می‌توانم تصور کنم.
  - de: Was wünschst du dir zum Geburtstag?
    en: What would you like for your birthday?
    fa: برای تولدت چه می‌خواهی؟
  - de: Ich habe mir für dieses Jahr viel vorgenommen.
    en: I've planned a lot for this year.
    fa: برای امسال برنامه‌های زیادی ریخته‌ام.
  - de: Putz dir bitte die Zähne!
    en: Please brush your teeth!
    fa: لطفاً دندان‌هایت را مسواک بزن!
  - de: Darf ich mich vorstellen? Ich bin die neue Kollegin.
    en: May I introduce myself? I'm the new colleague.
    fa: اجازه می‌دهید خودم را معرفی کنم؟ من همکار جدید هستم.
  - de: Merk dir bitte meine Telefonnummer.
    en: Please remember my phone number.
    fa: لطفاً شمارهٔ تلفنم را به خاطر بسپار.
  - de: Wir sehen uns morgen die Wohnung an.
    en: We're going to look at the flat tomorrow.
    fa: فردا آپارتمان را می‌بینیم.
  - de: Ich habe mir beim Skifahren das Bein gebrochen.
    en: I broke my leg skiing.
    fa: موقع اسکی پایم شکست.
  - de: Stell dir vor, ich habe die Stelle bekommen!
    en: Imagine, I got the job!
    fa: فکرش را بکن، کار را گرفتم!

mistakes:
  - wrong: Ich wasche mich die Hände.
    right: Ich wasche mir die Hände.
    why:
      en: "*Die Hände* is the *Akkusativ* object, so the reflexive pronoun is in the *Dativ*: *mir*."
      fa: "*die Hände* مفعول در حالت *Akkusativ* است، پس ضمیر انعکاسی در حالت *Dativ* می‌آید: *mir*."
      de: "*Die Hände* ist das Objekt im Akkusativ. Darum steht das Reflexivpronomen im Dativ: *mir*."
  - wrong: Stell dich vor, ich habe gewonnen!
    right: Stell dir vor, ich habe gewonnen!
    why:
      en: "To imagine is *sich etwas vorstellen*, with the *Dativ*: *dir*. *Stell dich vor* means introduce yourself."
      fa: "«تصور کردن» *sich etwas vorstellen* است و با حالت *Dativ* می‌آید: *dir*. *Stell dich vor* یعنی «خودت را معرفی کن»."
      de: "*Sich etwas vorstellen* (ein Bild im Kopf haben) hat den Dativ: *dir*. *Stell dich vor* heißt: Sag deinen Namen."
  - wrong: Ich muss mich die Adresse merken.
    right: Ich muss mir die Adresse merken.
    why:
      en: "*Sich etwas merken* always takes the *Dativ* pronoun: *mir*."
      fa: "*sich etwas merken* همیشه ضمیر انعکاسی در حالت *Dativ* می‌گیرد: *mir*."
      de: "*Sich etwas merken* hat immer das Pronomen im Dativ: *mir*."
  - wrong: Ich habe mir sehr gefreut.
    right: Ich habe mich sehr gefreut.
    why:
      en: "*Sich freuen* has no other object, so the *Akkusativ*: *mich*."
      fa: "*sich freuen* مفعول دیگری ندارد، پس ضمیر در حالت *Akkusativ* می‌آید: *mich*."
      de: "*Sich freuen* hat kein anderes Objekt. Darum Akkusativ: *mich*."
  - wrong: Ich kaufe ein neues Handy mir.
    right: Ich kaufe mir ein neues Handy.
    why:
      en: "The reflexive pronoun comes before a noun object: *mir ein neues Handy*."
      fa: "ضمیر انعکاسی پیش از مفعولی می‌آید که اسم است: *mir ein neues Handy*."
      de: "Das Reflexivpronomen steht vor dem Nomen: *mir ein neues Handy*."

