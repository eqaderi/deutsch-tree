# Grammar list row 101.
id: grammar-101
kind: grammar
level: B1
chapter: b1-pronouns
order: 4
status: published
recogniseOnly: false
prerequisites: [grammar-067, grammar-096]
title:
  en: "Reflexive pronoun in the *Dativ*"
  fa: "ضمیر انعکاسی در حالت *Dativ*"
  de: "Reflexivpronomen im Dativ"

explanations:
  en:
    rule: >
      A reflexive pronoun is in the *Dativ* when the verb also has an object
      in the *Akkusativ*: *Ich wasche mich*, but *Ich wasche mir die Hände.*
      You see the difference only with *ich* and *du*: *mir* and *dir*
      instead of *mich* and *dich*; *uns*, *euch* and *sich* stay the same.
      Some verbs always take a *Dativ* pronoun and a thing: *sich etwas
      wünschen*, *sich etwas vornehmen* (to plan), *sich etwas merken* (to
      remember), *sich etwas ansehen* (to look at). *Sich vorstellen* means
      "to introduce yourself" (*Darf ich mich vorstellen?*), but *sich etwas
      vorstellen* means "to imagine" (*Ich kann mir das gut vorstellen.*).
      For parts of the body German usually says the *Dativ* pronoun and
      *der*, *die*, *das* where English says "my": *Ich putze mir die
      Zähne.* The pronoun comes before a noun object: *Ich kaufe mir ein
      Fahrrad.*
  fa:
    rule: >
      اگر فعل جز ضمیر انعکاسی مفعولی در حالت *Akkusativ* (حالت مفعولی) هم
      داشته باشد، ضمیر انعکاسی در حالت *Dativ* (حالت مفعول باواسطه) می‌آید:
      *Ich wasche mich* (خودم را می‌شویم)، ولی *Ich wasche mir die Hände.*
      (دست‌هایم را می‌شویم.) این تفاوت فقط در *ich* و *du* دیده می‌شود:
      *mir* و *dir* به‌جای *mich* و *dich*؛ *uns*، *euch* و *sich* تغییر
      نمی‌کنند. برخی فعل‌ها همیشه ضمیر انعکاسی در حالت *Dativ* و یک مفعول
      می‌گیرند: *sich etwas wünschen* (آرزو کردن، خواستن)، *sich etwas
      vornehmen* (تصمیم گرفتن، برنامه ریختن)، *sich etwas merken* (به خاطر
      سپردن) و *sich etwas ansehen* (تماشا کردن). *sich vorstellen* یعنی
      «خود را معرفی کردن» (*Darf ich mich vorstellen?*)، ولی *sich etwas
      vorstellen* یعنی «چیزی را تصور کردن» (*Ich kann mir das gut
      vorstellen.*). برای اعضای بدن، آلمانی معمولاً ضمیر انعکاسی در حالت
      *Dativ* و حرف تعریف *der*، *die* یا *das* را به کار می‌برد، جایی که
      فارسی ضمیر ملکی می‌آورد: *Ich putze mir die Zähne.* (دندان‌هایم را
      مسواک می‌زنم.) ضمیر انعکاسی پیش از مفعولی می‌آید که اسم است: *Ich
      kaufe mir ein Fahrrad.*
  de:
    rule: >
      Hat das Verb noch ein Objekt im Akkusativ, steht das Reflexivpronomen
      im Dativ: *Ich wasche mich*, aber *Ich wasche mir die Hände.* Man sieht
      das nur bei *ich* und *du*: *mir* und *dir* statt *mich* und *dich*.
      *Uns*, *euch* und *sich* bleiben gleich. Manche Verben haben immer ein
      Pronomen im Dativ und eine Sache: *sich etwas wünschen*, *sich etwas
      vornehmen*, *sich etwas merken*, *sich etwas ansehen*. *Sich
      vorstellen* heißt: seinen Namen sagen (*Darf ich mich vorstellen?*).
      *Sich etwas vorstellen* heißt: ein Bild im Kopf haben (*Ich kann mir
      das gut vorstellen.*). Bei Teilen vom Körper sagt man meistens das
      Pronomen im Dativ und *der*, *die*, *das*: *Ich putze mir die Zähne.*
      Das Pronomen steht vor einem Nomen als Objekt: *Ich kaufe mir ein
      Fahrrad.*

