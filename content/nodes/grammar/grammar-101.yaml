      en: "*Die Zähne* is the *Akkusativ* object, so *mir*, and it comes before the noun."
      fa: "*die Zähne* مفعول در حالت *Akkusativ* است، پس *mir* می‌آید و پیش از اسم قرار می‌گیرد."
      de: "*Die Zähne* ist das Objekt im Akkusativ. Darum *mir*, und es steht vor dem Nomen."
  - id: choice-2
