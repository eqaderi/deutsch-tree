# Grammar list row 110.
id: grammar-110
kind: grammar
level: A2
chapter: a2-adjectives
order: 4
status: published
recogniseOnly: false
prerequisites: [grammar-105]
title:
  en: "*Komparativ* + *als*"
  fa: "صفت تفضیلی (*Komparativ*) + *als*"
  de: "Komparativ + *als*"

explanations:
  en:
    rule: >
      To say that one thing has more of a quality than another, add *-er* to
      the adjective (the *Komparativ*) and put *als* (than) before the
      second thing: *Mein Bruder ist jünger als ich.* Never use *mehr* for
      "more" before an adjective: *schöner*, not *mehr schön*. Many short
      adjectives with *a*, *o* or *u* take an umlaut: *alt* – *älter*, *groß*
      – *größer*, *jung* – *jünger*. A few change more: *hoch* – *höher*,
      *teuer* – *teurer*, *dunkel* – *dunkler*, *nah* – *näher*, and, as you
      know, *gut* – *besser*, *viel* – *mehr*, *gern* – *lieber*. After *als*
      a person stands in the *Nominativ*, like the first one: *als ich*,
      *als du*.
  fa:
    rule: >
      برای گفتن این‌که چیزی صفتی را بیشتر از چیز دیگری دارد، به صفت *-er*
      افزوده می‌شود (صفت تفضیلی یا *Komparativ*) و پیش از چیز دوم *als*
      (از) می‌آید: *Mein Bruder ist jünger als ich.* برای «بیشتر» پیش از صفت
      هرگز *mehr* به کار نرود: *schöner*، نه *mehr schön*. بسیاری از صفت‌های
      کوتاهی که *a*، *o* یا *u* دارند دو نقطه (*Umlaut*) می‌گیرند: *alt* –
      *älter*، *groß* – *größer*، *jung* – *jünger*. چند صفت بیشتر تغییر
      می‌کنند: *hoch* – *höher*، *teuer* – *teurer*، *dunkel* – *dunkler*،
      *nah* – *näher*، و آن‌هایی که می‌شناسید: *gut* – *besser*، *viel* –
      *mehr*، *gern* – *lieber*. در فارسی می‌گوییم «از من»، ولی در آلمانی پس
      از *als* شخص در حالت *Nominativ* (حالت فاعلی) می‌آید، مانند شخص اول:
      *als ich*، *als du*.
  de:
    rule: >
      Hat eine Sache mehr von einer Eigenschaft als eine andere, bekommt das
      Adjektiv *-er* (Komparativ). Vor der zweiten Sache steht *als*: *Mein
      Bruder ist jünger als ich.* Man sagt nie *mehr* vor dem Adjektiv:
      *schöner*, nicht *mehr schön*. Viele kurze Adjektive mit *a*, *o* oder
      *u* bekommen einen Umlaut: *alt* – *älter*, *groß* – *größer*, *jung* –
      *jünger*. Einige ändern sich mehr: *hoch* – *höher*, *teuer* –
      *teurer*, *dunkel* – *dunkler*, *nah* – *näher*, und *gut* – *besser*,
      *viel* – *mehr*, *gern* – *lieber*. Nach *als* steht eine Person im
      Nominativ, wie die erste: *als ich*, *als du*.

table:
  columns:
    - { en: Adjective, fa: صفت, de: Adjektiv }
    - { en: "*Komparativ*", fa: "صفت تفضیلی (*Komparativ*)", de: Komparativ }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [schnell, schneller, Der Zug ist schneller als der Bus.]
    - [billig, billiger, Der Bus ist billiger als das Taxi.]
    - [alt, älter, Meine Schwester ist älter als ich.]
    - [jung, jünger, Mein Bruder ist jünger als ich.]
    - [groß, größer, Hamburg ist größer als Bremen.]
    - [warm, wärmer, Heute ist es wärmer als gestern.]
    - [hoch, höher, Der Turm ist höher als die Kirche.]
    - [teuer, teurer, Das Taxi ist teurer als der Bus.]
    - [dunkel, dunkler, Die Jacke ist dunkler als die Hose.]
    - [nah, näher, Der Park ist näher als der See.]
    - [gut, besser, Dein Deutsch ist besser als meins.]
    - [viel, mehr, Sie arbeitet mehr als ich.]

examples:
  - de: Mein Bruder ist jünger als ich.
    en: My brother is younger than me.
    fa: برادرم از من کوچک‌تر است.
  - de: Der Zug ist schneller als das Auto.
    en: The train is faster than the car.
    fa: قطار از ماشین سریع‌تر است.
  - de: Im Sommer sind die Tage länger als im Winter.
    en: In summer the days are longer than in winter.
    fa: روزها در تابستان بلندتر از زمستان‌اند.
  - de: Heute ist es kälter als gestern.
    en: It is colder today than yesterday.
    fa: امروز هوا از دیروز سردتر است.
  - de: Der Turm ist höher als die Kirche.
    en: The tower is taller than the church.
    fa: برج از کلیسا بلندتر است.
  - de: Die Wohnung in der Stadt ist teurer als das Haus auf dem Land.
    en: The flat in town is more expensive than the house in the country.
    fa: آپارتمانِ شهر از خانهٔ روستا گران‌تر است.
  - de: Meine Schwester verdient mehr als ich.
    en: My sister earns more than me.
    fa: خواهرم از من بیشتر درآمد دارد.
  - de: Die Prüfung war leichter als gedacht.
    en: The exam was easier than expected.
    fa: امتحان از آنچه فکر می‌کردم آسان‌تر بود.
  - de: Sprich bitte langsamer!
    en: Please speak more slowly!
    fa: لطفاً آهسته‌تر حرف بزن!

mistakes:
  - wrong: Das Auto ist mehr schnell als der Bus.
    right: Das Auto ist schneller als der Bus.
    why:
      en: "German makes the *Komparativ* with *-er*, never with *mehr* before the adjective."
      fa: "آلمانی صفت تفضیلی را با *-er* می‌سازد، هرگز با *mehr* پیش از صفت."
      de: "Den Komparativ macht man mit *-er*, nie mit *mehr* vor dem Adjektiv."
  - wrong: Mein Bruder ist alter als ich.
    right: Mein Bruder ist älter als ich.
    why:
      en: "*Alt* takes an umlaut in the *Komparativ*: *älter*."
      fa: "*alt* در صفت تفضیلی دو نقطه (*Umlaut*) می‌گیرد: *älter*."
      de: "*Alt* bekommt im Komparativ einen Umlaut: *älter*."
  - wrong: Der Berg ist hocher als der Turm.
    right: Der Berg ist höher als der Turm.
    why:
      en: "*Hoch* loses its *c* and takes an umlaut: *höher*."
      fa: "*hoch* حرف *c* را از دست می‌دهد و دو نقطه می‌گیرد: *höher*."
      de: "*Hoch* verliert das *c* und bekommt einen Umlaut: *höher*."
  - wrong: Meine Schwester ist älter von mir.
    right: Meine Schwester ist älter als ich.
    why:
      en: "After a *Komparativ* German uses *als*, not *von*, and the person after it is in the *Nominativ*: *als ich*."
      fa: "در فارسی می‌گوییم «از من»، ولی آلمانی *als* به کار می‌برد و شخص پس از آن در حالت *Nominativ* است: *als ich*."
      de: "Nach dem Komparativ steht *als*, nicht *von*. Die Person steht im Nominativ: *als ich*."
  - wrong: Sie ist größer wie ihr Bruder.
    right: Sie ist größer als ihr Bruder.
    why:
      en: "After a *Komparativ* comes *als*. *Wie* is for things that are the same (*so groß wie*), the next topic but one."
      fa: "پس از صفت تفضیلی *als* می‌آید. *wie* برای برابری است (*so groß wie*) که موضوع دو درس بعد است."
      de: "Nach dem Komparativ steht *als*. *Wie* sagt man, wenn etwas gleich ist (*so groß wie*). Das kommt bald."

questions:
