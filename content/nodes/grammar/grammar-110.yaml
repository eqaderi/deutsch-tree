      - [gut, besser]
      - [viel, mehr]
      - [teuer, teurer]
    explanation:
      en: "*Alt* takes an umlaut, *hoch* also drops its *c*, *teuer* an *e*; *gut* and *viel* have their own forms."
      fa: "*alt* دو نقطه می‌گیرد، *hoch* افزون بر آن *c* را از دست می‌دهد و *teuer* یک *e* را؛ *gut* و *viel* شکل ویژهٔ خود را دارند."
      de: "*Alt* bekommt einen Umlaut, *hoch* verliert auch das *c*, *teuer* ein *e*. *Gut* und *viel* haben eigene Formen."

