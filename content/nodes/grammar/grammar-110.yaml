    type: gap-fill
    prompt: Der Zug ist ___ als der Bus.
    options: [schneller, schnell, mehr schnell]
    answer: schneller
    explanation:
      en: "Before *als* comes the *Komparativ*: *schnell* + *-er*."
      fa: "پیش از *als* صفت تفضیلی می‌آید: *schnell* + *-er*."
      de: "Vor *als* steht der Komparativ: *schnell* + *-er*."
  - id: gap-2
    type: gap-fill
    prompt: Meine Oma ist ___ als mein Opa.
    options: [älter, alter, mehr alt]
    answer: älter
    explanation:
      en: "*Alt* takes an umlaut: *älter*."
      fa: "*alt* دو نقطه می‌گیرد: *älter*."
      de: "*Alt* bekommt einen Umlaut: *älter*."
  - id: gap-3
    type: gap-fill
    prompt: Mein Bruder ist größer ___ ich.
    options: [als, von, so]
    answer: als
    explanation:
      en: "After a *Komparativ* comes *als* (than)."
      fa: "پس از صفت تفضیلی *als* می‌آید."
      de: "Nach dem Komparativ steht *als*."
  - id: gap-4
    type: gap-fill
    prompt: Der Berg ist ___ als der Turm.
    options: [höher, hocher, hoher]
    answer: höher
    explanation:
      en: "*Hoch* becomes *höher*: no *c*, and an umlaut."
      fa: "*hoch* می‌شود *höher*: بدون *c* و با دو نقطه."
      de: "*Hoch* wird zu *höher*: ohne *c*, mit Umlaut."
  - id: gap-5
    type: gap-fill
    prompt: Das Taxi ist ___ als die U-Bahn.
    options: [teurer, teuer, am teuersten]
    answer: teurer
    explanation:
      en: "Before *als* comes the *Komparativ*; *teuer* drops its second *e*: *teurer*."
      fa: "پیش از *als* صفت تفضیلی می‌آید و *teuer* یک *e* را از دست می‌دهد: *teurer*."
      de: "Vor *als* steht der Komparativ. Bei *teuer* fällt ein *e* weg: *teurer*."
  - id: choice-1
    type: multiple-choice
    prompt: Heute ist es ___ als gestern.
    options: [wärmer, warmer, mehr warm]
    answer: wärmer
    explanation:
      en: "*Warm* takes an umlaut: *wärmer*."
      fa: "*warm* دو نقطه می‌گیرد: *wärmer*."
      de: "*Warm* bekommt einen Umlaut: *wärmer*."
  - id: choice-2
    type: multiple-choice
    prompt: Ich trinke ___ Tee als Kaffee.
    options: [lieber, gerner, mehr gern]
    answer: lieber
    explanation:
      en: "The *Komparativ* of *gern* is *lieber*."
      fa: "صفت تفضیلی *gern* می‌شود *lieber*."
      de: "Der Komparativ von *gern* ist *lieber*."
  - id: choice-3
    type: multiple-choice
    prompt: Anna ist 20 Jahre alt, Lisa ist 25. Lisa ist ___ als Anna.
    options: [älter, jünger, kürzer]
    answer: älter
    explanation:
      en: "Lisa has more years than Anna, so she is *älter*."
      fa: "لیزا سال‌های بیشتری از آنا دارد، پس *älter* است."
      de: "Lisa hat mehr Jahre als Anna. Sie ist *älter*."
  - id: true-1
    type: true-false
    prompt: Mein Bruder ist jünger als ich.
    answer: true
    explanation:
      en: "*Jung* – *jünger* with an umlaut, then *als ich* in the *Nominativ*. The sentence is correct."
      fa: "*jung* – *jünger* با دو نقطه، و پس از آن *als ich* در حالت *Nominativ*. جمله درست است."
      de: "*Jung* – *jünger* mit Umlaut, dann *als ich* im Nominativ. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Das Fahrrad ist mehr billig als das Auto.
    answer: false
    explanation:
      en: "The *Komparativ* is made with *-er*: *billiger als das Auto*."
      fa: "صفت تفضیلی با *-er* ساخته می‌شود: *billiger als das Auto*."
      de: "Den Komparativ macht man mit *-er*: *billiger als das Auto*."
  - id: true-3
    type: true-false
    prompt: Er spricht besser Deutsch als ich.
    answer: true
    explanation:
      en: "*Gut* – *besser*, and *als ich*. The sentence is correct."
      fa: "*gut* – *besser* و *als ich*. جمله درست است."
      de: "*Gut* – *besser*, dann *als ich*. Der Satz ist richtig."
