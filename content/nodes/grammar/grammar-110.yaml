    answer: wie
    explanation:
      en: "After a *Komparativ* comes *als*: *älter als ihr Bruder*."
      fa: "پس از صفت تفضیلی *als* می‌آید: *älter als ihr Bruder*."
      de: "Nach dem Komparativ steht *als*: *älter als ihr Bruder*."
  - id: match-1
    type: matching
    answer:
