      fa: "صفت تفضیلی *gut* می‌شود *besser*."
      de: "Der Komparativ von *gut* ist *besser*."
  - id: error-1
    type: find-error
    prompt: Mein Vater ist alter als meine Mutter.
    answer: alter
    explanation:
      en: "*Alt* takes an umlaut in the *Komparativ*: *älter*."
      fa: "*alt* در صفت تفضیلی دو نقطه می‌گیرد: *älter*."
      de: "*Alt* hat im Komparativ einen Umlaut: *älter*."
  - id: error-2
