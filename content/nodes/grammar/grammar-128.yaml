table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "*Dativ*", fa: "حالت *Dativ*", de: Dativ }
    - { en: "With *ein*", fa: "با *ein*", de: "Mit *ein*" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [der Schrank, dem Schrank, einem Schrank, neben dem Schrank]
    - [die Tür, der Tür, einer Tür, hinter der Tür]
    - [das Regal, dem Regal, einem Regal, auf dem Regal]
    - [die Bücher (Plural), den Büchern, –, zwischen den Büchern]

examples:
  - de: Die Katze schläft unter dem Tisch.
    en: The cat is sleeping under the table.
    fa: گربه زیر میز خوابیده است.
  - de: Mein Handy liegt auf dem Sofa.
    en: My phone is on the sofa.
    fa: گوشی‌ام روی مبل است.
  - de: Das Bild hängt an der Wand.
    en: The picture is hanging on the wall.
    fa: تابلو به دیوار آویزان است.
  - de: Die Lampe hängt über dem Esstisch.
    en: The lamp hangs above the dining table.
    fa: چراغ بالای میز غذاخوری آویزان است.
  - de: Wir warten vor dem Kino.
    en: We are waiting in front of the cinema.
    fa: ما جلوی سینما منتظریم.
  - de: Das Fahrrad steht hinter dem Haus.
    en: The bike is behind the house.
    fa: دوچرخه پشت خانه است.
  - de: Der Schlüssel liegt neben dem Handy.
    en: The key is next to the phone.
    fa: کلید کنار گوشی است.
  - de: Der Supermarkt ist zwischen der Post und dem Bahnhof.
    en: The supermarket is between the post office and the station.
    fa: سوپرمارکت میان ادارهٔ پست و ایستگاه قطار است.
  - de: Die Milch ist im Kühlschrank.
    en: The milk is in the fridge.
    fa: شیر در یخچال است.
  - de: Wir sitzen am Fenster.
    en: We are sitting at the window.
    fa: ما کنار پنجره نشسته‌ایم.

mistakes:
  - wrong: Das Buch liegt auf den Tisch.
    right: Das Buch liegt auf dem Tisch.
    why:
      en: "*Liegen* says where something is (*Wo?*), so the *Dativ* follows: *dem Tisch*. *Den Tisch* is for a movement (*Wohin?*), a later topic."
      fa: "*liegen* جای چیزی را نشان می‌دهد (*Wo?*)، پس حالت *Dativ* می‌آید: *dem Tisch*. *den Tisch* برای حرکت به سوی جایی است (*Wohin?*) که موضوع درسی دیگر است."
      de: "*Liegen* sagt, wo etwas ist (*Wo?*). Darum steht der Dativ: *dem Tisch*. *Den Tisch* sagt man bei einer Bewegung (*Wohin?*). Das kommt später."
  - wrong: Das Bild hängt auf der Wand.
    right: Das Bild hängt an der Wand.
    why:
      en: 'English says "on the wall", German says *an der Wand*: *an* is for the side of something, *auf* for its top, like a table or the floor.'
      fa: "در فارسی می‌گوییم «روی دیوار»، ولی در آلمانی *an der Wand*؛ زیرا *an* برای سطح ایستاده و کنارهٔ چیزهاست و *auf* برای سطح بالایی آن‌ها، مانند میز یا زمین."
      de: "Bei einer Wand sagt man *an*: Das Bild ist an der Seite, nicht oben. *Auf* sagt man für oben, zum Beispiel *auf dem Tisch*."
  - wrong: Mein Bruder ist im Küche.
    right: Mein Bruder ist in der Küche.
    why:
      en: "*Im* is short for *in dem*, so it fits only *der* and *das* nouns. *Küche* is a *die* noun: *in der Küche*."
      fa: "*im* کوتاه‌شدهٔ *in dem* است و فقط با اسم مذکر (*der*) و خنثی (*das*) می‌آید. *Küche* اسم مؤنث (*die*) است: *in der Küche*."
      de: "*Im* ist kurz für *in dem*. Das passt nur bei *der* und *das*. *Küche* hat den Artikel *die*: *in der Küche*."
  - wrong: Die Apotheke ist neben dem Bank.
    right: Die Apotheke ist neben der Bank.
    why:
      en: "*Bank* is a *die* noun. In the *Dativ*, *die* becomes *der*, not *dem*."
      fa: "*Bank* اسم مؤنث (*die*) است. در حالت *Dativ*، *die* به *der* تبدیل می‌شود، نه به *dem*."
      de: "*Bank* hat den Artikel *die*. Im Dativ wird *die* zu *der*, nicht zu *dem*."
  - wrong: Die Bank ist zwischen dem Kino und das Café.
    right: Die Bank ist zwischen dem Kino und dem Café.
    why:
      en: "After *zwischen* both nouns are in the *Dativ*, the second one too."
      fa: "پس از *zwischen* هر دو اسم در حالت *Dativ* می‌آیند، اسم دوم نیز."
      de: "Nach *zwischen* stehen beide Nomen im Dativ, auch das zweite."

# 20 questions, every question type. A small topic: the spec asks for 15 to 20.
questions:
  - id: gap-1
    type: gap-fill
    prompt: Die Katze schläft unter ___ Tisch.
    options: [dem, den, der]
    answer: dem
    explanation:
      en: "*Der Tisch* in the *Dativ* is *dem Tisch*: the cat is somewhere (*Wo?*)."
      fa: "جای گربه پرسیده می‌شود (*Wo?*)، پس *der Tisch* در حالت *Dativ* می‌آید: *dem Tisch*."
      de: "Die Katze ist an einem Ort (*Wo?*). *Der Tisch* im Dativ: *dem Tisch*."
  - id: gap-2
    type: gap-fill
    prompt: Die Jacke hängt an ___ Tür.
    options: [der, die, dem]
    answer: der
    explanation:
      en: "*Die Tür* in the *Dativ* is *der Tür*."
      fa: "*die Tür* در حالت *Dativ* می‌شود *der Tür*."
      de: "*Die Tür* im Dativ: *der Tür*."
  - id: gap-3
    type: gap-fill
    prompt: Mein Fahrrad steht hinter ___ Haus.
    options: [dem, das, den]
    answer: dem
    explanation:
      en: "*Das Haus* in the *Dativ* is *dem Haus*."
      fa: "*das Haus* در حالت *Dativ* می‌شود *dem Haus*."
      de: "*Das Haus* im Dativ: *dem Haus*."
  - id: gap-4
    type: gap-fill
    prompt: Wir warten ___ Kino.
    options: [vor dem, vor das, vor den]
    answer: vor dem
    explanation:
      en: "We are somewhere (*Wo?*), so *das Kino* is in the *Dativ*: *vor dem Kino*."
      fa: "جای ما پرسیده می‌شود (*Wo?*)، پس *das Kino* در حالت *Dativ* می‌آید: *vor dem Kino*."
      de: "Wir sind an einem Ort (*Wo?*). *Das Kino* im Dativ: *vor dem Kino*."
  - id: choice-1
    type: multiple-choice
    prompt: Die Lampe hängt oben, ___ dem Esstisch.
    options: [über, auf, unter]
    answer: über
    explanation:
      en: "*Über*: higher up, without touching. *Auf* would sit on the table."
      fa: "*über* یعنی بالای چیزی، بی‌آن‌که به آن بچسبد. *auf* یعنی روی خود میز."
      de: "*Über*: oben, ohne Kontakt. *Auf* heißt: direkt auf dem Tisch."
  - id: choice-2
    type: multiple-choice
    prompt: Wo ist die Milch? – ___ Kühlschrank.
    options: [Im, In, Ins]
    answer: Im
    explanation:
      en: "*Der Kühlschrank* in the *Dativ* is *dem Kühlschrank*, and *in dem* is shortened to *im*."
      fa: "*der Kühlschrank* در حالت *Dativ* می‌شود *dem Kühlschrank* و *in dem* کوتاه می‌شود: *im*."
      de: "*Der Kühlschrank* im Dativ: *dem Kühlschrank*. *In dem* sagt man kurz: *im*."
  - id: choice-3
    type: multiple-choice
    prompt: Das Bild hängt ___ der Wand.
    options: [an, auf, in]
    answer: an
    explanation:
      en: "Something on a wall is *an der Wand*: *an* is for the side of a thing."
      fa: "برای چیزی که روی دیوار است می‌گوییم *an der Wand*، زیرا *an* برای سطح ایستاده و کنارهٔ چیزهاست."
      de: "Bei einer Wand sagt man *an*: *an der Wand*."
  - id: true-1
    type: true-false
    prompt: Das Handy liegt auf dem Sofa.
    answer: true
    explanation:
      en: "*Das Sofa* in the *Dativ* is *dem Sofa*. The sentence is correct."
      fa: "*das Sofa* در حالت *Dativ* می‌شود *dem Sofa*. جمله درست است."
      de: "*Das Sofa* im Dativ: *dem Sofa*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Die Tasse steht auf den Tisch.
    answer: false
    explanation:
      en: "The cup is somewhere (*Wo?*), so the *Dativ*: *auf dem Tisch*."
      fa: "جای فنجان پرسیده می‌شود (*Wo?*)، پس حالت *Dativ* می‌آید: *auf dem Tisch*."
      de: "Die Tasse ist an einem Ort (*Wo?*). Darum Dativ: *auf dem Tisch*."
  - id: true-3
    type: true-false
    prompt: Die Kinder spielen zwischen den Bäumen.
    answer: true
    explanation:
      en: "*Die Bäume* in the *Dativ* is *den Bäumen*, with *-n* on the noun. The sentence is correct."
      fa: "*die Bäume* در حالت *Dativ* می‌شود *den Bäumen* و اسم نیز *-n* می‌گیرد. جمله درست است."
      de: "*Die Bäume* im Dativ: *den Bäumen*, mit *-n*. Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Die Schuhe stehen unter ___ (das) Bett.
    answers: [dem]
    explanation:
      en: "*Das* becomes *dem* in the *Dativ*: *unter dem Bett*."
      fa: "*das* در حالت *Dativ* می‌شود *dem*: *unter dem Bett*."
      de: "*Das* wird im Dativ zu *dem*: *unter dem Bett*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Wir warten vor ___ (die) Post.
    answers: [der]
    explanation:
      en: "*Die* becomes *der* in the *Dativ*: *vor der Post*."
      fa: "*die* در حالت *Dativ* می‌شود *der*: *vor der Post*."
      de: "*Die* wird im Dativ zu *der*: *vor der Post*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Die Bücher stehen ___ (in + das) Regal.
    answers: [im, in dem]
    explanation:
      en: "*In* + *das Regal* in the *Dativ* is *in dem Regal*, almost always said as *im Regal*."
      fa: "*in* + *das Regal* در حالت *Dativ* می‌شود *in dem Regal* که تقریباً همیشه کوتاه می‌شود: *im Regal*."
      de: "*In* + *das Regal* im Dativ: *in dem Regal*. Kurz sagt man fast immer *im Regal*."
  - id: typed-1
    type: typed-answer
    prompt: "Wo? in + die Küche"
    answers: [in der Küche]
    explanation:
      en: "*Die Küche* in the *Dativ* is *der Küche*. *Im* is only for *der* and *das* nouns."
      fa: "*die Küche* در حالت *Dativ* می‌شود *der Küche*. *im* فقط با اسم مذکر (*der*) و خنثی (*das*) می‌آید."
      de: "*Die Küche* im Dativ: *der Küche*. *Im* gibt es nur bei *der* und *das*."
  - id: typed-2
    type: typed-answer
    prompt: "Wo? an + das Fenster"
    answers: [am Fenster, an dem Fenster]
    explanation:
      en: "*An* + *dem Fenster*, almost always said as *am Fenster*."
      fa: "*an* + *dem Fenster* که تقریباً همیشه کوتاه می‌شود: *am Fenster*."
      de: "*An* + *dem Fenster*. Kurz sagt man fast immer *am Fenster*."
  - id: error-1
    type: find-error
    prompt: Der Spiegel hängt an die Wand.
    answer: die
    explanation:
      en: "The mirror is somewhere (*Wo?*), so *die Wand* is in the *Dativ*: *an der Wand*."
      fa: "جای آینه پرسیده می‌شود (*Wo?*)، پس *die Wand* در حالت *Dativ* می‌آید: *an der Wand*."
      de: "Der Spiegel ist an einem Ort (*Wo?*). Darum Dativ: *an der Wand*."
  - id: error-2
    type: find-error
    prompt: Der Supermarkt ist zwischen der Bank und die Post.
    answer: die
    explanation:
      en: "After *zwischen* both nouns are in the *Dativ*: *und der Post*."
      fa: "پس از *zwischen* هر دو اسم در حالت *Dativ* می‌آیند: *und der Post*."
      de: "Nach *zwischen* stehen beide Nomen im Dativ: *und der Post*."
  - id: order-1
    type: word-order
    answers:
      - [die Katze, schläft, unter dem Sofa]
      - [unter dem Sofa, schläft, die Katze]
    explanation:
      en: "The verb comes second. The place can stand first or last."
      fa: "فعل در جایگاه دوم می‌آید. قید مکان می‌تواند در آغاز یا پایان جمله باشد."
      de: "Das Verb steht an Position 2. Der Ort kann am Anfang oder am Ende stehen."
  - id: order-2
    type: word-order
    answers:
      - [meine Freunde, warten, vor dem Kino]
      - [vor dem Kino, warten, meine Freunde]
    explanation:
      en: "The verb comes second. The place can stand first or last."
      fa: "فعل در جایگاه دوم می‌آید. قید مکان می‌تواند در آغاز یا پایان جمله باشد."
      de: "Das Verb steht an Position 2. Der Ort kann am Anfang oder am Ende stehen."
  - id: match-1
    type: matching
    answer:
      - [liegt unter ___ Tisch, dem]
      - [steht neben ___ Tür, der]
      - [steht zwischen ___ Autos, den]
    explanation:
      en: "Each thing is somewhere (*Wo?*), so the *Dativ*: *dem Tisch*, *der Tür*, and plural *den Autos*."
      fa: "در هر سه، جای چیزی پرسیده می‌شود (*Wo?*)، پس حالت *Dativ* می‌آید: *dem Tisch*، *der Tür* و برای جمع *den Autos*."
      de: "Alles ist an einem Ort (*Wo?*). Darum Dativ: *dem Tisch*, *der Tür* und im Plural *den Autos*."

