# Grammar list row 128. The grammar sample node: it shows every section a
# grammar node can have, a diagram among them. The format is in content/README.md.
id: grammar-128
kind: grammar
level: A1
chapter: a1-prepositions
order: 10
status: published
recogniseOnly: false
prerequisites: [grammar-121]
title:
  en: "Two-way prepositions, *Wo?* + *Dativ*"
  fa: "حرف‌های اضافهٔ دوحالته: *Wo?* و حالت *Dativ*"
  de: "Wechselpräpositionen, *Wo?* + Dativ"

explanations:
  en:
    rule: >
      The prepositions *an*, *auf*, *hinter*, *in*, *neben*, *über*, *unter*,
      *vor* and *zwischen* take the *Dativ* when they say where something is,
      in answer to *Wo?* (where?). In the *Dativ*, *der* and *das* become
      *dem*, *die* becomes *der*, and plural *die* becomes *den*, with *-n* on
      the noun. *In dem* and *an dem* are almost always shortened to *im* and
      *am*.
  fa:
    rule: >
      حرف‌های اضافهٔ *an*، *auf*، *hinter*، *in*، *neben*، *über*، *unter*،
      *vor* و *zwischen* وقتی جای چیزی را نشان می‌دهند، یعنی در پاسخ به پرسش
      *Wo?* (کجا؟)، با حالت *Dativ* (حالت مفعول باواسطه) می‌آیند. در این حالت
      *der* و *das* به *dem* تبدیل می‌شوند، *die* به *der*، و *die* جمع به
      *den*؛ اسم جمع نیز *-n* می‌گیرد. *in dem* و *an dem* تقریباً همیشه
      کوتاه می‌شوند: *im* و *am*.
  de:
    rule: >
      Die Präpositionen *an*, *auf*, *hinter*, *in*, *neben*, *über*, *unter*,
      *vor* und *zwischen* sagen, wo etwas ist. Auf die Frage *Wo?* steht
      danach der Dativ: *der* und *das* werden zu *dem*, *die* wird zu *der*,
      und im Plural steht *den*, das Nomen bekommt *-n*. *In dem* und *an dem*
      sagt man fast immer kurz: *im* und *am*.

