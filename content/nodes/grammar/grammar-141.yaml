# Grammar list row 141.
id: grammar-141
kind: grammar
level: A1
chapter: a1-first-sentences
order: 5
status: published
recogniseOnly: false
prerequisites: [grammar-087, grammar-139]
title:
  en: "W-question"
  fa: "پرسش با واژهٔ پرسشی (*W-Frage*)"
  de: "W-Frage"

explanations:
  en:
    rule: >
      A W-question starts with a question word in position 1. The conjugated
      verb follows in position 2, and the subject comes after the verb: *Wo
      wohnst du?* German needs no helper verb like English "do". A question
      word with its noun or adjective, such as *wie viele Kinder* or *wie
      alt*, fills position 1 together. At the end of a W-question the voice
      usually goes down.
  fa:
    rule: >
      پرسش با واژهٔ پرسشی (*W-Frage*) با واژهٔ پرسشی در جایگاه اول آغاز
      می‌شود. فعل صرف‌شده در جایگاه دوم می‌آید و فاعل پس از فعل: *Wo wohnst
      du?* در فارسی ترتیب جمله در پرسش عوض نمی‌شود («تو کجا زندگی می‌کنی؟»)،
      ولی در آلمانی فعل بلافاصله پس از واژهٔ پرسشی می‌آید. واژهٔ پرسشی همراه
      اسم یا صفتش، مانند *wie viele Kinder* یا *wie alt*، با هم جایگاه اول را
      پر می‌کند. در پایان این پرسش‌ها لحن صدا معمولاً پایین می‌آید.
  de:
    rule: >
      Eine W-Frage beginnt mit einem Fragewort auf Position 1. Das konjugierte
      Verb steht auf Position 2, und das Subjekt kommt nach dem Verb: *Wo
      wohnst du?* Ein Fragewort mit Nomen oder Adjektiv, zum Beispiel *wie
      viele Kinder* oder *wie alt*, ist zusammen Position 1. Am Ende von einer
      W-Frage geht die Stimme meistens nach unten.

table:
  columns:
    - { en: "Position 1: question word", fa: "جایگاه اول: واژهٔ پرسشی", de: "Position 1: Fragewort" }
    - { en: "Position 2: verb", fa: "جایگاه دوم: فعل", de: "Position 2: Verb" }
    - { en: Subject and the rest, fa: فاعل و بقیهٔ جمله, de: Subjekt und Rest }
  rows:
    - [Wo, ist, Peter?]
    - [Woher, kommen, Sie?]
    - [Wann, beginnt, der Kurs?]
    - [Wohin, fahrt, ihr im Sommer?]
    - [Warum, lernst, du Deutsch?]
    - [Wie viele Kinder, haben, Sie?]
    - [Wie alt, ist, deine Tochter?]

examples:
  - de: Wo ist Peter?
    en: Where is Peter?
    fa: پیتر کجاست؟
  - de: Woher kommen Sie?
    en: Where are you from?
    fa: اهل کجا هستید؟
  - de: Wann beginnt der Kurs?
    en: When does the course start?
    fa: کلاس کی شروع می‌شود؟
  - de: Wohin fahrt ihr im Sommer?
    en: Where are you (plural) going in the summer?
    fa: تابستان کجا می‌روید؟
  - de: Warum lernst du Deutsch?
    en: Why are you learning German?
    fa: چرا آلمانی یاد می‌گیری؟
  - de: Wie viele Kinder haben Sie?
    en: How many children do you have?
    fa: چند فرزند دارید؟
  - de: Wie alt ist deine Tochter?
    en: How old is your daughter?
    fa: دخترت چند سال دارد؟

mistakes:
  - wrong: Wo du wohnst?
    right: Wo wohnst du?
    why:
      en: "The verb comes right after the question word, and the subject after the verb."
      fa: "فعل بلافاصله پس از واژهٔ پرسشی می‌آید و فاعل پس از فعل."
      de: "Das Verb kommt direkt nach dem Fragewort, das Subjekt danach."
  - wrong: Wann der Zug kommt?
    right: Wann kommt der Zug?
    why:
      en: "*Der Zug* is the subject, so it comes after the verb *kommt*."
      fa: "*der Zug* فاعل است، پس پس از فعل *kommt* می‌آید."
      de: "*Der Zug* ist das Subjekt. Es steht nach dem Verb *kommt*."
  - wrong: Wie viele haben Sie Kinder?
    right: Wie viele Kinder haben Sie?
    why:
      en: "*Wie viele Kinder* stays together in position 1."
      fa: "*wie viele Kinder* با هم در جایگاه اول می‌ماند."
      de: "*Wie viele Kinder* bleibt zusammen auf Position 1."

questions:
