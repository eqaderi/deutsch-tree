    type: word-order
    answers:
      - [wo, wohnst, du]
    end: "?"
    explanation:
      en: "Question word, then the verb, then the subject."
      fa: "واژهٔ پرسشی، سپس فعل و بعد فاعل."
      de: "Fragewort, dann Verb, dann Subjekt."
  - id: order-2
    type: word-order
    answers:
