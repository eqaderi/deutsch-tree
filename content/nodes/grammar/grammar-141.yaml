    end: "?"
    explanation:
      en: "Question word, then the verb, then the subject *Ihr Mann*."
      fa: "واژهٔ پرسشی، سپس فعل و بعد فاعل *Ihr Mann*."
      de: "Fragewort, dann Verb, dann das Subjekt *Ihr Mann*."
  - id: order-3
