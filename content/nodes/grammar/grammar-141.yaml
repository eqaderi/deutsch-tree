      fa: "*wie viele Kinder* جایگاه اول را پر می‌کند، سپس فعل و بعد *Sie* می‌آید."
      de: "*Wie viele Kinder* ist Position 1, dann das Verb, dann *Sie*."
  - id: order-5
    type: word-order
    answers:
      - [wohin, fahrt, ihr, im Sommer]
    end: "?"
    explanation:
      en: "Question word, verb, subject, then the rest."
      fa: "واژهٔ پرسشی، فعل، فاعل و سپس بقیهٔ جمله."
      de: "Fragewort, Verb, Subjekt, dann der Rest."
  - id: order-6
