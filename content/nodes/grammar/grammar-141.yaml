      de: "Das Verb kommt direkt nach *warum*: *Warum ist Lisa müde?*"
  - id: choice-1
    type: multiple-choice
    prompt: "wo / arbeiten / Ihre Frau"
    options: [Wo arbeitet Ihre Frau?, Wo Ihre Frau arbeitet?, Ihre Frau wo arbeitet?]
    answer: Wo arbeitet Ihre Frau?
    explanation:
      en: "Question word, then the verb, then the subject *Ihre Frau*."
      fa: "واژهٔ پرسشی، سپس فعل و بعد فاعل *Ihre Frau*."
      de: "Fragewort, dann Verb, dann das Subjekt *Ihre Frau*."
  - id: gap-1
    type: gap-fill
    prompt: Wohin ___ im Sommer?
    options: [fahrt ihr, ihr fahrt, fahren ihr]
    answer: fahrt ihr
    explanation:
      en: "The verb comes right after *wohin*, then *ihr*; with *ihr* the ending is *-t*."
      fa: "فعل بلافاصله پس از *wohin* می‌آید و سپس *ihr*؛ با *ihr* شناسهٔ فعل *-t* است."
      de: "Das Verb kommt direkt nach *wohin*, dann *ihr*. Bei *ihr* ist die Endung *-t*."
  - id: gap-2
    type: gap-fill
    prompt: Woher ___?
    options: [kommst du, du kommst, kommen du]
    answer: kommst du
    explanation:
      en: "The verb comes right after *woher*, then *du*."
      fa: "فعل بلافاصله پس از *woher* می‌آید و سپس *du*."
      de: "Das Verb kommt direkt nach *woher*, dann *du*."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Wo ___ (arbeiten) dein Vater?
    answers: [arbeitet]
    explanation:
      en: "The subject *dein Vater* (*er*) comes after the verb, so *arbeitet*, with *-et* after *t*."
      fa: "فاعل *dein Vater* (*er*) پس از فعل آمده است، پس *arbeitet*؛ پس از *t* شناسه *-et* است."
      de: "Das Subjekt *dein Vater* (*er*) steht nach dem Verb: *arbeitet*, nach *t* mit *-et*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Wie ___ (heißen) Sie?
    answers: [heißen]
    explanation:
      en: "With the polite *Sie* the ending is *-en*: *Wie heißen Sie?*"
      fa: "با *Sie* رسمی شناسهٔ فعل *-en* است: *Wie heißen Sie?*"
      de: "Bei *Sie* ist die Endung *-en*: *Wie heißen Sie?*"

