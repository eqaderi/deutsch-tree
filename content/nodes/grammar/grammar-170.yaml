  columns:
    - {
        en: "*Seit* / *seitdem* clause: since when?",
        fa: "جملهٔ پیرو با *seit* / *seitdem*: از کی؟",
        de: "*Seit*- / *seitdem*-Satz: seit wann?",
      }
    - {
        en: "Main clause: up to now, in the *Präsens*",
        fa: "جملهٔ پایه: تا اکنون، در زمان حال",
        de: "Hauptsatz: bis jetzt, im Präsens",
      }
  rows:
    - ["Seitdem ich in Hamburg wohne,", fahre ich viel Fahrrad.]
    - ["Seit sie ein Baby hat,", schläft sie sehr wenig.]
    - ["Seit ich umgezogen bin,", brauche ich nur zehn Minuten zur Arbeit.]
    - ["Seitdem er jeden Tag Deutsch lernt,", versteht er die Nachrichten besser.]
    - ["Seit wir uns kennen,", sind wir gute Freunde.]

# A time line: a point where it began (the seit clause), and a bar from that
# point up to "jetzt" (the main clause).
diagrams:
  - caption:
      en: >
        *Seit ich umgezogen bin, fahre ich mit dem Rad.* The *seit* clause
        marks the start. The main clause runs from there up to *jetzt*, so it
        is in the *Präsens*.
      fa: >
        جملهٔ پیرو (*seit ich umgezogen bin*) نقطهٔ آغاز را نشان می‌دهد.
        جملهٔ پایه (*fahre ich mit dem Rad*) از آن‌جا تا *jetzt* ادامه دارد،
        پس در زمان حال است.
      de: >
        *Seit ich umgezogen bin, fahre ich mit dem Rad.* Der *seit*-Satz zeigt
        den Anfang. Der Hauptsatz geht von dort bis *jetzt*. Darum steht er im
        Präsens.
