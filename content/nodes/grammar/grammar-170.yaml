recogniseOnly: false
prerequisites: [grammar-120, grammar-157]
title:
  en: "*seit* / *seitdem*"
  fa: "*seit* / *seitdem*"
  de: "*seit* / *seitdem*"

explanations:
  en:
    rule: >
      *Seit* and *seitdem* (since) mean the same. Both start a subordinate
      clause, so the conjugated verb goes to the end. The clause says when
      something began; the main clause says what has gone on since then, up
      to now. So the main clause is usually in the *Präsens*, where English
      says "have been" or "have …": *Seitdem ich in Hamburg wohne, fahre ich
      viel Fahrrad.* If the start was one event, the clause is often in the
      *Perfekt*: *Seit ich umgezogen bin, brauche ich nur zehn Minuten zur
      Arbeit.* Before a noun, *seit* is the preposition with the *Dativ* that
      you know (*seit einem Jahr*). *Seitdem* can also stand alone as an
      adverb, "since then"; then the verb follows it: *Wir sind 2020 nach
      Köln gezogen. Seitdem wohnen wir dort.*
  fa:
    rule: >
      *seit* و *seitdem* (از وقتی که) یک معنا دارند. هر دو جملهٔ پیرو را
      آغاز می‌کنند، پس فعل صرف‌شده به پایان جمله می‌رود. جملهٔ پیرو می‌گوید
      کاری از کی آغاز شده است و جملهٔ پایه می‌گوید از آن زمان تا اکنون چه
      ادامه دارد. برای همین جملهٔ پایه معمولاً در زمان حال (*Präsens*) است:
      *Seitdem ich in Hamburg wohne, fahre ich viel Fahrrad.* اگر آغاز کار
      یک رویداد باشد، جملهٔ پیرو بیشتر در گذشتهٔ نقلی (*Perfekt*) می‌آید:
      *Seit ich umgezogen bin, brauche ich nur zehn Minuten zur Arbeit.* پیش
      از اسم، *seit* همان حرف اضافه با حالت *Dativ* است که می‌شناسید (*seit
      einem Jahr*). *seitdem* به‌تنهایی هم به‌عنوان قید می‌آید، یعنی «از آن
      وقت»؛ آن‌گاه فعل پس از آن می‌آید: *Wir sind 2020 nach Köln gezogen.
      Seitdem wohnen wir dort.*
  de:
    rule: >
      *Seit* und *seitdem* bedeuten dasselbe. Mit beiden beginnt ein
      Nebensatz. Das konjugierte Verb steht am Ende. Der Nebensatz sagt, wann
      etwas angefangen hat. Der Hauptsatz sagt, was seitdem bis jetzt so ist.
      Darum steht der Hauptsatz meistens im Präsens: *Seitdem ich in Hamburg
      wohne, fahre ich viel Fahrrad.* War der Anfang ein Ereignis, steht der
      Nebensatz oft im Perfekt: *Seit ich umgezogen bin, brauche ich nur zehn
      Minuten zur Arbeit.* Vor einem Nomen ist *seit* die Präposition mit
      Dativ (*seit einem Jahr*). *Seitdem* kann auch allein stehen, dann kommt
      danach das Verb: *Wir sind 2020 nach Köln gezogen. Seitdem wohnen wir
      dort.*

