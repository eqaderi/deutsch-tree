  rows:
    - [ich, hätte gern, Ich hätte gern einen Kaffee.]
    - [du, hättest gern, Was hättest du gern?]
    - [er / sie / es, hätte gern, Sie hätte gern ein Glas Wasser.]
    - [wir, hätten gern, Wir hätten gern die Rechnung.]
