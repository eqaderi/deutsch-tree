# Grammar list row 36.
id: grammar-036
kind: grammar
level: A2
chapter: a2-polite-forms
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-034]
title:
  en: "*hätte gern*"
  fa: "*hätte gern*"
  de: "*hätte gern*"

explanations:
  en:
    rule: >
      *Hätte gern* is the polite way to order or ask for something in a shop,
      a café or at a counter: *Ich hätte gern ein Brot, bitte.* It means the
      same as *ich möchte*. *Hätte* is a form of *haben*, its *Konjunktiv II*,
      the form for wishes and politeness. *Hätte* stands in position 2 (in a
      yes/no question, first), *gern* comes straight after it, or after the
      subject in a question, and then the thing you want, in the *Akkusativ*:
      *einen Kaffee*, *eine Cola*, *ein Brot*. *Ich* and *er* / *sie* / *es*
      have the same form, *hätte*. *Hätte gern* names a thing, not an action:
      for an action, use *möchte* or *würde gern* with an infinitive. The
      person serving you asks *Was hätten Sie gern?*
  fa:
    rule: >
      با *hätte gern* در فروشگاه، کافه یا پشت باجه مؤدبانه چیزی را سفارش
      می‌دهیم یا می‌خواهیم: *Ich hätte gern ein Brot, bitte.* معنای آن همان
      *ich möchte* است. *hätte* صورت *Konjunktiv II* (وجه شرطی) فعل *haben*
      است، صورتی که برای آرزو و ادب به کار می‌رود. *hätte* در جایگاه دوم
      می‌آید (در پرسش بله یا نه، در آغاز جمله) و *gern* بلافاصله پس از آن (در
      پرسش، پس از فاعل). سپس چیزی که می‌خواهید در حالت *Akkusativ* (حالت
      مفعولی) می‌آید: *einen Kaffee*، *eine Cola*، *ein Brot*. *ich* و *er* /
      *sie* / *es* صورت یکسان *hätte* را دارند. پس از *hätte gern* نام یک چیز
      می‌آید، نه یک کار؛ برای کار، *möchte* یا *würde gern* را با مصدر به کار
      ببرید. فروشنده یا پیشخدمت می‌پرسد: *Was hätten Sie gern?*
  de:
    rule: >
      Mit *hätte gern* bestellt man höflich, zum Beispiel im Geschäft, im Café
      oder am Schalter: *Ich hätte gern ein Brot, bitte.* Es bedeutet das
      Gleiche wie *ich möchte*. *Hätte* ist eine Form von *haben*, der
      Konjunktiv II. *Hätte* steht auf Position 2 (in der Ja/Nein-Frage am
      Anfang). *Gern* steht direkt danach, in der Frage nach dem Subjekt. Dann
      kommt die Sache, die man möchte, im Akkusativ: *einen Kaffee*, *eine
      Cola*, *ein Brot*. *Ich* und *er* / *sie* / *es* haben die gleiche Form
      *hätte*. Nach *hätte gern* steht eine Sache, keine Aktion. Für eine
      Aktion sagt man *möchte* oder *würde gern* + Infinitiv. Die Verkäuferin
      fragt: *Was hätten Sie gern?*

table:
  columns:
    - { en: Person, fa: شخص, de: Person }
