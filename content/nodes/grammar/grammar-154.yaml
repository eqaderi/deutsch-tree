# Grammar list row 154.
id: grammar-154
kind: grammar
level: B1
chapter: b1-connectors-negation
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-146, grammar-149]
title:
  en: "*nicht …, sondern …*"
  fa: "*nicht …, sondern …*"
  de: "*nicht …, sondern …*"

explanations:
  en:
    rule: >
      *Sondern* (but, rather) follows a negation with *nicht* or *kein* and
      gives the right thing in place of the wrong one: *Er kommt nicht heute,
      sondern morgen.* *Nicht* then stands directly before the part that is
      replaced (*nicht heute*), and a noun with *ein* takes *kein*: *Das ist
      kein Kuli, sondern ein Bleistift.* There is always a
      comma before *sondern*. After it often only the new part follows; a
      whole clause after it keeps its order, because *sondern*, like *und* and
      *aber*, stands in position 0: *sondern ich gehe ins Kino*. *Aber* is
      different: it does not replace anything, it adds something that is also
      true: *Das Hotel ist nicht neu, aber sehr sauber.*
  fa:
    rule: >
      *sondern* (بلکه) پس از نفی با *nicht* یا *kein* می‌آید و چیز درست را به
      جای چیز نادرست می‌نشاند: *Er kommt nicht heute, sondern morgen.* در این
      حالت *nicht* درست پیش از بخشی می‌آید که جایگزین می‌شود (*nicht
      heute*)، و اسمی که با *ein* می‌آید با *kein* منفی می‌شود: *Das ist
      kein Kuli, sondern ein Bleistift.* پیش از *sondern* همیشه
      ویرگول می‌آید. پس از آن اغلب فقط بخش تازه می‌آید؛ اگر جملهٔ کاملی بیاید،
      ترتیب واژه‌هایش تغییر نمی‌کند، چون *sondern* نیز مانند *und* و *aber*
      در جایگاه صفر است: *sondern ich gehe ins Kino*. *aber* فرق دارد: چیزی را
      جایگزین نمی‌کند، بلکه چیزی می‌افزاید که آن هم درست است: *Das Hotel ist
      nicht neu, aber sehr sauber.*
  de:
    rule: >
      *Sondern* kommt nach einer Verneinung mit *nicht* oder *kein*. Es nennt
      das Richtige statt dem Falschen: *Er kommt nicht heute, sondern morgen.*
      *Nicht* steht dann direkt vor dem Teil, den man ersetzt (*nicht
      heute*). Ein Nomen mit *ein* verneint man mit *kein*: *Das ist kein
      Kuli, sondern ein Bleistift.* Vor *sondern* steht immer ein Komma.
      Danach kommt oft nur der neue Teil. Kommt ein ganzer Satz, bleibt die
      Wortstellung gleich, denn *sondern* steht wie *und* und *aber* auf
      Position 0: *sondern ich gehe ins Kino*. *Aber* ist anders: Es ersetzt
      nichts, es nennt etwas, das auch stimmt: *Das Hotel ist nicht neu,
      aber sehr sauber.*

table:
  columns:
    - { en: "Not this: *nicht* / *kein*", fa: "نه این: *nicht* / *kein*", de: "Nicht das: *nicht* / *kein*" }
    - { en: "*sondern*", fa: "*sondern*", de: "*sondern*" }
    - { en: But this, fa: بلکه این, de: Sondern das }
  rows:
    - ["Er kommt nicht heute,", sondern, morgen.]
    - ["Sie wohnt nicht in Wien,", sondern, in Graz.]
    - ["Wir fahren nicht mit dem Auto,", sondern, mit dem Zug.]
    - ["Das ist kein Tee,", sondern, Kaffee.]
    - ["Ich habe keinen Bruder,", sondern, eine Schwester.]
    - ["Ich bleibe nicht zu Hause,", sondern, ich gehe ins Kino.]

# sondern crosses out the first part and puts another in its place;
# aber keeps both parts, and both are true.
diagrams:
  - caption:
      en: >
        *Sondern* replaces: the first part is wrong, and the part after
        *sondern* takes its place. *Aber* adds: both parts are true.
      fa: >
        واژهٔ *sondern* جایگزین می‌کند: بخش نخست نادرست است و بخش پس از
        *sondern* جای آن را می‌گیرد. واژهٔ *aber* می‌افزاید: هر دو بخش درست‌اند.
      de: >
        *Sondern* ersetzt: Der erste Teil ist falsch, der Teil nach *sondern*
        kommt an seine Stelle. *Aber* fügt etwas hinzu: Beide Teile stimmen.
    labels:
      wrong: { en: wrong, fa: نادرست, de: falsch }
      right: { en: right, fa: درست, de: richtig }
      holds: { en: "true", fa: درست, de: stimmt }
      alsotrue: { en: also true, fa: این هم درست, de: stimmt auch }
