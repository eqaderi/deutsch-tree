# Grammar list row 113.
id: grammar-113
kind: grammar
level: A2
chapter: a2-adjectives
order: 7
status: published
recogniseOnly: false
prerequisites: [grammar-102, grammar-126]
title:
  en: "Adjectives with fixed prepositions"
  fa: "صفت‌هایی با حرف اضافهٔ ثابت"
  de: "Adjektive mit festen Präpositionen"

explanations:
  en:
    rule: >
      Some adjectives go with one fixed preposition. Learn the two together,
      like one word: *zufrieden mit* (pleased with), *stolz auf* (proud of).
      The preposition is often not the one English or Persian would use:
      *stolz auf*, not *von*; *interessiert an*, not *in*. The noun after it
      takes the case of the preposition: after *mit* always the *Dativ*,
      after *für* always the *Akkusativ*. With these adjectives *auf* and
      *über* take the *Akkusativ*, and *an* (*interessiert an*) the *Dativ*.
      The preposition with its noun usually stands before the adjective, at
      the end of the sentence: *Ich bin mit meiner Note zufrieden.*
  fa:
    rule: >
      بعضی صفت‌ها با یک حرف اضافهٔ ثابت می‌آیند. این دو را با هم، مانند یک
      واژه، یاد بگیرید: *zufrieden mit* (راضی از)، *stolz auf* (مفتخر به).
      این حرف اضافه اغلب همانی نیست که فارسی به کار می‌برد: «راضی از» در
      آلمانی *zufrieden mit* است، نه *von*؛ «علاقه‌مند به» *interessiert an*
      است، نه *zu*. اسم پس از حرف اضافه در حالت همان حرف اضافه می‌آید: پس از
      *mit* همیشه حالت *Dativ* (حالت مفعول باواسطه) و پس از *für* همیشه حالت
      *Akkusativ* (حالت مفعولی). با این صفت‌ها *auf* و *über* با حالت
      *Akkusativ* می‌آیند و *an* (در *interessiert an*) با حالت *Dativ*. حرف
      اضافه و اسمش معمولاً پیش از صفت، در پایان جمله، می‌آیند: *Ich bin mit
      meiner Note zufrieden.*
  de:
    rule: >
      Manche Adjektive haben eine feste Präposition. Lernen Sie beide
      zusammen, wie ein Wort: *zufrieden mit*, *stolz auf*. Das Nomen danach
      hat den Kasus von der Präposition: nach *mit* immer Dativ, nach *für*
      immer Akkusativ. Bei diesen Adjektiven steht nach *auf* und *über* der
      Akkusativ, nach *an* (*interessiert an*) der Dativ. Die Präposition mit
      dem Nomen steht meistens vor dem Adjektiv, am Ende vom Satz: *Ich bin
      mit meiner Note zufrieden.*

table:
  columns:
