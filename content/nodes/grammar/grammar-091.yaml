# Grammar list row 91.
id: grammar-091
kind: grammar
level: A2
chapter: a2-articles-pronouns
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-074, grammar-080]
title:
  en: "*Was für ein …?*"
  fa: "*Was für ein …?*"
  de: "*Was für ein …?*"

explanations:
  en:
    rule: >
      *Was für ein …?* asks what kind of thing: *Was für ein Auto hast du? –
      Einen Kombi.* *Welch-* asks which one out of a known group: *Welches
      Auto ist deins, das rote oder das blaue?* Here *für* does not decide
      the case. *Ein* takes the case of the noun in the sentence: *ein* for
      the subject, *einen* for a masculine object: *Was für ein Film läuft
      heute?* but *Was für einen Film siehst du?* In the plural, and with
      nouns such as *Musik* or *Wetter*, there is no *ein*: *Was für Bücher
      liest du?* The answer usually has *ein* or no article.
  fa:
    rule: >
      با *Was für ein …?* نوع چیزی را می‌پرسیم: *Was für ein Auto hast du? –
      Einen Kombi.* (چه جور ماشینی داری؟ – یک استیشن.) ولی با *welch-* یکی
      را از میان چند چیز معلوم می‌پرسیم: *Welches Auto ist deins, das rote
      oder das blaue?* در این پرسش، *für* حالت اسم را تعیین نمی‌کند و *ein*
      همان حالتی را می‌گیرد که اسم در جمله دارد: برای فاعل *ein* و برای
      مفعول مذکر *einen*. پس می‌گوییم *Was für ein Film läuft heute?* ولی
      *Was für einen Film siehst du?* در جمع و با اسم‌هایی مانند *Musik* و
      *Wetter*، *ein* نمی‌آید: *Was für Bücher liest du?* در پاسخ معمولاً
      *ein* می‌آید یا اسمی بی‌حرف تعریف.
  de:
    rule: >
      Mit *Was für ein …?* fragt man nach der Art: *Was für ein Auto hast du?
      – Einen Kombi.* Mit *welch-* fragt man nach einer Sache aus einer
      bekannten Gruppe: *Welches Auto ist deins, das rote oder das blaue?*
      Hier bestimmt *für* den Kasus nicht. *Ein* hat den Kasus vom Nomen im
      Satz: *ein* beim Subjekt, *einen* bei einem maskulinen Objekt: *Was für
      ein Film läuft heute?*, aber *Was für einen Film siehst du?* Im Plural
      und bei Nomen wie *Musik* oder *Wetter* steht kein *ein*: *Was für
      Bücher liest du?*

