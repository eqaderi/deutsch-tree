# Grammar list row 127. Position (Wo?) only; directions with hin/her are row 133.
id: grammar-127
kind: grammar
level: A1
chapter: a1-prepositions
order: 9
status: published
recogniseOnly: false
prerequisites: [grammar-121]
title:
  en: "Place adverbs"
  fa: "قیدهای مکان (*hier*، *dort*، *oben* …)"
  de: "Ortsadverbien (*hier*, *dort*, *oben* …)"

explanations:
  en:
    rule: >
      A place adverb says where something is in one word, with no preposition
      and no article: *Ich wohne hier.* *Hier* is here, near the speaker;
      *dort* and *da* are there (in speech *da* can also mean here). *Oben*
      is up or upstairs, *unten* down or downstairs, *links* on the left and
      *rechts* on the right. They answer *Wo?*: *Wo ist das Bad? – Oben.* They
      can be joined to each other or to a place: *dort links*, *oben im Haus*,
      and *ganz* makes them stronger: *ganz oben*. A preposition needs a noun
      after it, an adverb does not: *unter dem Tisch*, but *unten*.
  fa:
    rule: >
      قید مکان در یک واژه می‌گوید چیزی کجاست و حرف اضافه و حرف تعریف
      نمی‌گیرد: *Ich wohne hier.* *hier* یعنی «این‌جا»، نزدیک گوینده؛ *dort*
      و *da* یعنی «آن‌جا» (در گفتار *da* به معنای «این‌جا» هم به کار می‌رود).
      *oben* یعنی «بالا» یا «طبقهٔ بالا»، *unten* یعنی «پایین» یا «طبقهٔ
      پایین»، *links* یعنی «سمت چپ» و *rechts* یعنی «سمت راست». این قیدها
      پاسخ پرسش *Wo?* هستند: *Wo ist das Bad? – Oben.* می‌توان آن‌ها را با هم
      یا با یک مکان آورد: *dort links* و *oben im Haus*؛ و *ganz* معنایشان
      را قوی‌تر می‌کند: *ganz oben*. پس از حرف اضافه اسم می‌آید، ولی پس از
      قید نه: *unter dem Tisch*، اما *unten*.
  de:
    rule: >
      Ein Ortsadverb sagt in einem Wort, wo etwas ist, ohne Präposition und
      ohne Artikel: *Ich wohne hier.* *Hier* ist nah, *dort* und *da* sind
      weiter weg (im Gespräch heißt *da* auch *hier*). Dazu kommen *oben*,
      *unten*, *links* und *rechts*. Sie antworten auf die Frage *Wo?*: *Wo
      ist das Bad? – Oben.* Man kann sie verbinden: *dort links*, *oben im
      Haus*. Mit *ganz* sind sie stärker: *ganz oben*. Nach einer Präposition
      steht ein Nomen, nach einem Adverb nicht: *unter dem Tisch*, aber
      *unten*.

table:
  columns:
    - { en: Adverb, fa: قید, de: Adverb }
    - { en: Opposite, fa: متضاد, de: Gegenteil }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [hier, dort / da, Ich wohne hier.]
    - [oben, unten, Das Bad ist oben.]
    - [links, rechts, Die Post ist links.]
