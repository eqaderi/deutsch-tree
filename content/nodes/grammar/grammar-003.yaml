title:
  en: "Verbs with stem-vowel change"
  fa: "فعل‌هایی که واکهٔ بنشان تغییر می‌کند"
  de: "Verben mit Vokalwechsel"

explanations:
  en:
    rule: >
      Some verbs change the vowel of their stem in the *Präsens*, but only
      with *du* and *er/sie/es*: *e* becomes *i* or *ie* (*sprechen*, *du
      sprichst*; *sehen*, *er sieht*), and *a* becomes *ä* (*fahren*, *du
      fährst*). With *ich*, *wir*, *ihr* and *sie/Sie* the vowel stays: *ich
      spreche*, *ihr fahrt*. The endings are the regular ones; learn each verb
      with its *er* form, for example *nehmen*, *er nimmt*.
  fa:
    rule: >
      برخی فعل‌ها در زمان حال (*Präsens*) واکهٔ بن خود را تغییر می‌دهند، اما
      فقط در دوم‌شخص مفرد (*du*) و سوم‌شخص مفرد (*er/sie/es*): *e* به *i* یا
      *ie* تبدیل می‌شود (*sprechen*، *du sprichst*؛ *sehen*، *er sieht*) و *a*
      به *ä* (*fahren*، *du fährst*). در شخص‌های دیگر (*ich*، *wir*، *ihr* و
      *sie/Sie*) واکه تغییر نمی‌کند: *ich spreche*، *ihr fahrt*. شناسه‌ها همان
      شناسه‌های فعل باقاعده‌اند. هر فعل را همراه با صرف سوم‌شخص مفردش به خاطر
      بسپارید، مثلاً *nehmen*، *er nimmt*.
  de:
    rule: >
      Bei manchen Verben ändert sich im Präsens der Vokal im Stamm, aber nur
      bei *du* und *er/sie/es*: *e* wird zu *i* oder *ie* (*sprechen*, *du
      sprichst*; *sehen*, *er sieht*), *a* wird zu *ä* (*fahren*, *du
      fährst*). Bei *ich*, *wir*, *ihr* und *sie/Sie* bleibt der Vokal: *ich
      spreche*, *ihr fahrt*. Die Endungen sind normal.

table:
  columns:
    - { en: Infinitive, fa: مصدر, de: Infinitiv }
    - { en: "*ich*", fa: "*ich*", de: "*ich*" }
    - { en: "*du*", fa: "*du*", de: "*du*" }
    - { en: "*er / sie / es*", fa: "*er / sie / es*", de: "*er / sie / es*" }
    - { en: "*ihr*", fa: "*ihr*", de: "*ihr*" }
  rows:
    - [sprechen (e → i), spreche, sprichst, spricht, sprecht]
    - [helfen (e → i), helfe, hilfst, hilft, helft]
    - [nehmen (e → i), nehme, nimmst, nimmt, nehmt]
    - [sehen (e → ie), sehe, siehst, sieht, seht]
    - [lesen (e → ie), lese, liest, liest, lest]
    - [fahren (a → ä), fahre, fährst, fährt, fahrt]
    - [schlafen (a → ä), schlafe, schläfst, schläft, schlaft]

examples:
  - de: Er spricht drei Sprachen.
    en: He speaks three languages.
    fa: او به سه زبان صحبت می‌کند.
  - de: Lena fährt morgen nach Köln.
    en: Lena is going to Cologne tomorrow.
    fa: لنا فردا به کلن می‌رود.
  - de: Liest du gern?
    en: Do you like reading?
    fa: کتاب خواندن را دوست داری؟
  - de: Siehst du den Bus?
    en: Can you see the bus?
    fa: اتوبوس را می‌بینی؟
  - de: Das Baby schläft schon.
    en: The baby is already asleep.
    fa: نوزاد دیگر خوابیده است.
  - de: Isst du gern Fisch?
    en: Do you like fish?
    fa: ماهی دوست داری؟
  - de: Mein Vater hilft mir.
    en: My father is helping me.
    fa: پدرم به من کمک می‌کند.
  - de: Wir fahren am Montag nach Wien.
    en: We are going to Vienna on Monday.
    fa: ما دوشنبه به وین می‌رویم.

mistakes:
  - wrong: Er sprecht gut Deutsch.
    right: Er spricht gut Deutsch.
    why:
      en: "*Sprechen* changes *e* to *i* with *er/sie/es*: *er spricht*."
      fa: "واکهٔ *sprechen* در سوم‌شخص مفرد از *e* به *i* تغییر می‌کند: *er spricht*."
      de: "Bei *sprechen* wird *e* bei *er/sie/es* zu *i*: *er spricht*."
  - wrong: Ihr fährt zu schnell.
    right: Ihr fahrt zu schnell.
    why:
      en: The vowel changes only with *du* and *er/sie/es*, not with *ihr*.
      fa: واکه فقط با *du* و *er/sie/es* تغییر می‌کند، نه با *ihr*.
      de: Der Vokal ändert sich nur bei *du* und *er/sie/es*, nicht bei *ihr*.
  - wrong: Ich fähre nach Hause.
    right: Ich fahre nach Hause.
    why:
      en: With *ich* the vowel stays as in the infinitive.
      fa: با *ich* واکه همان واکهٔ مصدر می‌ماند.
      de: Bei *ich* bleibt der Vokal wie im Infinitiv.
  - wrong: Lisa nehmt den Bus.
    right: Lisa nimmt den Bus.
    why:
      en: "*Nehmen* changes more than the vowel: *du nimmst*, *er/sie nimmt*."
      fa: "در *nehmen* افزون بر واکه، حرف‌های دیگری هم تغییر می‌کنند: *du nimmst*، *er/sie nimmt*."
      de: "Bei *nehmen* ändert sich mehr als der Vokal: *du nimmst*, *er/sie nimmt*."

