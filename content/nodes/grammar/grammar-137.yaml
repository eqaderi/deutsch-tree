# Grammar list row 137.
id: grammar-137
kind: grammar
level: B1
chapter: b1-prepositions
order: 4
status: published
recogniseOnly: false
prerequisites: [grammar-071]
title:
  en: "*innerhalb*, *außerhalb* + *Genitiv*"
  fa: "*innerhalb* و *außerhalb* + *Genitiv*"
  de: "*innerhalb*, *außerhalb* + Genitiv"

explanations:
  en:
    rule: >
      *Innerhalb* (inside, within) and *außerhalb* (outside) take the
      *Genitiv*: *des* with *-s* or *-es* on a masculine or neuter noun
      (*innerhalb des Hauses*), *der* for a feminine noun and the plural
      (*außerhalb der Stadt*), *eines* and *einer* with *ein*. For a place
      they say inside or outside an area: *Unser Hotel liegt außerhalb der
      Stadt.* For time, *innerhalb* gives a span inside which something
      happens, at the latest at its end: *Sie bekommen die Antwort innerhalb
      einer Woche.* *Außerhalb* gives a time outside a span: *außerhalb der
      Öffnungszeiten*. Before a number without an article, or before a name,
      you usually say *von* + *Dativ*: *innerhalb von drei Tagen*,
      *außerhalb von München*.
  fa:
    rule: >
      *innerhalb* (درون، در مدت) و *außerhalb* (بیرون از) با حالت *Genitiv*
      (حالت ملکی) می‌آیند: *des* برای اسم مذکر یا خنثی که *-s* یا *-es*
      می‌گیرد (*innerhalb des Hauses*)، *der* برای اسم مؤنث و جمع
      (*außerhalb der Stadt*)، و با *ein* صورت‌های *eines* و *einer*. برای
      مکان، این دو حرف اضافه می‌گویند چیزی درون یا بیرون یک محدوده است:
      *Unser Hotel liegt außerhalb der Stadt.* (هتل ما بیرون از شهر است).
      برای زمان، *innerhalb* مدتی را نشان می‌دهد که کاری در آن، و حداکثر تا
      پایانش، انجام می‌شود: *Sie bekommen die Antwort innerhalb einer Woche.*
      (ظرف یک هفته پاسخ را دریافت می‌کنید). *außerhalb* زمانی بیرون از یک
      بازه را می‌گوید: *außerhalb der Öffnungszeiten* (خارج از ساعات کاری).
      پیش از عددی که حرف تعریف ندارد، یا پیش از نام، معمولاً *von* با حالت
      *Dativ* می‌آید: *innerhalb von drei Tagen* و *außerhalb von München*.
  de:
    rule: >
      Nach *innerhalb* und *außerhalb* steht der Genitiv: *des* und am
      maskulinen oder neutralen Nomen *-s* oder *-es* (*innerhalb des
      Hauses*). Bei femininen Nomen und im Plural steht *der* (*außerhalb der
      Stadt*). Mit *ein*: *eines*, *einer*. Für einen Ort sagen sie: drinnen
      oder draußen, zum Beispiel *Unser Hotel liegt außerhalb der Stadt.* Für
      die Zeit sagt *innerhalb*: Es passiert in dieser Zeit, spätestens an
      ihrem Ende, zum Beispiel *Sie bekommen die Antwort innerhalb einer
      Woche.* *Außerhalb* sagt: nicht in dieser Zeit, zum Beispiel
      *außerhalb der Öffnungszeiten*. Vor einer Zahl ohne Artikel und vor
      einem Namen sagt man meistens *von* + Dativ: *innerhalb von drei
      Tagen*, *außerhalb von München*.

