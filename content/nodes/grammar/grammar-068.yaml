        <text class="note" x="260" y="228" text-anchor="middle">Dativ</text>
        <!-- two pronouns: Akkusativ, Dativ -->
        <text class="label" x="44" y="276" text-anchor="middle">Ich gebe</text>
        <rect class="shade" x="96" y="250" width="104" height="40"/>
