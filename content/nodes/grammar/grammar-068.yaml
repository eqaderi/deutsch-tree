        <text class="note" x="148" y="148" text-anchor="middle">Dativ</text>
        <text class="note" x="260" y="148" text-anchor="middle">Akkusativ</text>
        <!-- pronoun before noun: Akkusativ pronoun -->
        <text class="label" x="44" y="196" text-anchor="middle">Ich gebe</text>
        <rect class="shade" x="96" y="170" width="104" height="40"/>
