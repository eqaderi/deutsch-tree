# Grammar list row 68.
id: grammar-068
kind: grammar
level: A2
chapter: a2-dativ-objects
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-067, grammar-082, grammar-083]
title:
  en: "Order of objects and pronouns"
  fa: "ترتیب مفعول‌ها و ضمیرها"
  de: "Reihenfolge von Objekten und Pronomen"

explanations:
  en:
    rule: >
      When a verb has a *Dativ* and an *Akkusativ* object, the order depends
      on whether they are nouns or pronouns. Two nouns: the *Dativ* comes
      first, *Ich gebe dem Kind den Ball.* A pronoun comes before a noun,
      whatever its case: *Ich gebe ihm den Ball. Ich gebe ihn dem Kind.* Two
      pronouns: the *Akkusativ* comes first, *Ich gebe ihn ihm.* In short:
      pronouns first, and of two pronouns the *Akkusativ* first. Pronouns
      also stand right after the verb, before a time such as *gestern*: *Er
      hat ihn ihr gestern geschenkt.*
  fa:
    rule: >
      وقتی فعل یک مفعول در حالت *Dativ* و یک مفعول در حالت *Akkusativ* دارد،
      ترتیب آن‌ها به این بستگی دارد که اسم باشند یا ضمیر. اگر هر دو اسم
      باشند، حالت *Dativ* اول می‌آید: *Ich gebe dem Kind den Ball.* ضمیر، در
      هر حالتی که باشد، پیش از اسم می‌آید: *Ich gebe ihm den Ball.* و *Ich
      gebe ihn dem Kind.* اگر هر دو ضمیر باشند، حالت *Akkusativ* اول می‌آید:
      *Ich gebe ihn ihm.* خلاصه: ضمیر پیش از اسم، و از دو ضمیر، اول ضمیر
      حالت *Akkusativ*. ضمیرها درست پس از فعل و پیش از قید زمانی مانند
      *gestern* می‌آیند: *Er hat ihn ihr gestern geschenkt.*
  de:
    rule: >
      Hat ein Verb ein Objekt im Dativ und eins im Akkusativ, kommt es darauf
      an: Nomen oder Pronomen? Zwei Nomen: zuerst der Dativ, *Ich gebe dem
      Kind den Ball.* Ein Pronomen steht vor einem Nomen: *Ich gebe ihm den
      Ball. Ich gebe ihn dem Kind.* Zwei Pronomen: zuerst der Akkusativ,
      *Ich gebe ihn ihm.* Kurz: Pronomen zuerst, und bei zwei Pronomen der
      Akkusativ zuerst. Pronomen stehen auch vor einer Zeit wie *gestern*:
      *Er hat ihn ihr gestern geschenkt.*

# The same sentence four times. A tinted box is a pronoun, a plain box a
# noun; under each box its case. German only, so no labels.
diagrams:
  - caption:
      en: >
        *Ich gebe …* with the ball and the child as nouns or pronouns. A
        tinted box is a pronoun, a plain box a noun. Two nouns: *Dativ*
        first. A pronoun comes before a noun. Two pronouns: *Akkusativ*
        first.
      fa: >
        جملهٔ *Ich gebe …* با توپ و بچه، یک بار به صورت اسم و یک بار به صورت
        ضمیر. خانهٔ رنگی ضمیر است و خانهٔ بی‌رنگ اسم. دو اسم: اول حالت *Dativ*.
        ضمیر پیش از اسم می‌آید. دو ضمیر: اول حالت *Akkusativ*.
      de: >
        *Ich gebe …* mit dem Ball und dem Kind als Nomen oder Pronomen. Ein
        farbiger Kasten ist ein Pronomen, ein einfacher Kasten ein Nomen. Zwei
        Nomen: zuerst der Dativ. Ein Pronomen steht vor einem Nomen. Zwei
        Pronomen: zuerst der Akkusativ.
