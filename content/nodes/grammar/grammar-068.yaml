        <!-- pronoun before noun: Dativ pronoun -->
        <text class="label" x="44" y="116" text-anchor="middle">Ich gebe</text>
        <rect class="shade" x="96" y="90" width="104" height="40"/>
        <text class="label" x="148" y="116" text-anchor="middle">ihm</text>
        <rect class="surface" x="208" y="90" width="104" height="40"/>
