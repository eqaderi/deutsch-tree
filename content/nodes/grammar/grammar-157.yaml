table:
  columns:
    - { en: Main clause, fa: جملهٔ پایه, de: Hauptsatz }
    - { en: Conjunction, fa: حرف ربط, de: Konjunktion }
    - { en: Subject, fa: فاعل, de: Subjekt }
    - { en: Middle, fa: میانهٔ جمله, de: Mitte }
    - { en: "End: verb", fa: "پایان جمله: فعل", de: "Ende: Verb" }
  rows:
    - ["Ich bleibe zu Hause,", weil, ich, krank, bin.]
    - ["Ich weiß,", dass, du, morgen, arbeiten musst.]
    - ["Er ist müde,", weil, er, schlecht, geschlafen hat.]
    - ["Wir müssen laufen,", weil, der Zug, gleich, abfährt.]
    - ["Ich gehe ins Bett,", weil, ich, mich nicht, wohlfühle.]
