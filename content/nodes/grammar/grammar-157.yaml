# Grammar list row 157.
id: grammar-157
kind: grammar
level: A2
chapter: a2-subordinate-clauses
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-139, grammar-144]
title:
  en: "Subordinate clause word order"
  fa: "ترتیب واژه‌ها در جملهٔ پیرو"
  de: "Wortstellung im Nebensatz"

explanations:
  en:
    rule: >
      A subordinate clause (*Nebensatz*) begins with a word such as *weil*,
      *dass* or *wenn*, and its conjugated verb goes to the very end: *Ich
      bleibe zu Hause, weil ich krank bin.* The subject usually comes right
      after that first word. If the verb has two parts, the conjugated part
      comes last, after the infinitive or the *Partizip II*: *…, weil ich
      arbeiten muss.* *…, weil ich den Bus verpasst habe.* A separable verb is
      written as one word at the end: *…, weil der Zug gleich abfährt.* A
      reflexive pronoun does not go to the end; it stays next to the subject:
      *…, weil ich mich nicht wohlfühle.* A comma always separates the two
      clauses. If the subordinate clause comes first, it fills position 1 of
      the whole sentence, so the main clause starts with its verb: *Wenn Sie
      Zeit haben, kommen Sie uns besuchen.* After a *wenn* clause you may add
      *dann* before that verb: *Wenn du Zeit hast, dann komm vorbei.*
  fa:
    rule: >
      جملهٔ پیرو (*Nebensatz*) با واژه‌ای مانند *weil*، *dass* یا *wenn* آغاز
      می‌شود و فعل صرف‌شدهٔ آن به پایان جمله می‌رود: *Ich bleibe zu Hause,
      weil ich krank bin.* فاعل معمولاً درست پس از همان واژهٔ آغازین می‌آید.
      اگر فعل دو بخش داشته باشد، بخش صرف‌شده پس از مصدر یا صفت مفعولی
      (*Partizip II*) و در آخر می‌آید: *…, weil ich arbeiten muss.* و *…, weil
      ich den Bus verpasst habe.* فعل جداشدنی در پایان جملهٔ پیرو به هم
      چسبیده و یک‌جا نوشته می‌شود: *…, weil der Zug gleich abfährt.* ضمیر
      انعکاسی به پایان جمله نمی‌رود و کنار فاعل می‌ماند: *…, weil ich mich
      nicht wohlfühle.* میان دو جمله همیشه ویرگول می‌آید. اگر جملهٔ پیرو
      اول بیاید، جایگاه اول کل جمله را پر می‌کند؛ پس جملهٔ پایه با فعلش آغاز
      می‌شود: *Wenn Sie Zeit haben, kommen Sie uns besuchen.* پس از جملهٔ
      پیرو با *wenn* می‌توان پیش از این فعل *dann* آورد: *Wenn du Zeit hast,
      dann komm vorbei.*
  de:
    rule: >
      Ein Nebensatz beginnt mit einem Wort wie *weil*, *dass* oder *wenn*.
      Das konjugierte Verb steht ganz am Ende: *Ich bleibe zu Hause, weil ich
      krank bin.* Das Subjekt steht meistens direkt nach diesem Wort. Hat das
      Verb zwei Teile, steht der konjugierte Teil ganz am Schluss, nach dem
      Infinitiv oder dem Partizip II: *…, weil ich arbeiten muss.* *…, weil
      ich den Bus verpasst habe.* Ein trennbares Verb schreibt man am Ende
      zusammen: *…, weil der Zug gleich abfährt.* Das Reflexivpronomen geht
      nicht ans Ende. Es bleibt beim Subjekt: *…, weil ich mich nicht
      wohlfühle.* Zwischen den zwei Sätzen steht immer ein Komma. Steht der
      Nebensatz zuerst, ist er Position 1. Dann beginnt der Hauptsatz mit dem
      Verb: *Wenn Sie Zeit haben, kommen Sie uns besuchen.* Nach einem
      *wenn*-Satz kann vor dem Verb noch *dann* stehen: *Wenn du Zeit hast,
      dann komm vorbei.*

# Three rows of slots. Top: a main clause, verb in position 2. Middle: the
# same words as a subordinate clause, the verb moved to the end (the arrow).
# Bottom: a subordinate clause in position 1, the main verb right after it.
# The verbs are shaded.
diagrams:
  - caption:
      en: >
        *Ich bin heute krank.* has its verb *bin* in position 2. In *…, weil
        ich heute krank bin.* the verb goes to the end. In *Wenn es regnet,
        bleibe ich hier.* the whole subordinate clause is position 1, so the
        verb *bleibe* comes right after it. The verbs are shaded.
      fa: >
        در *Ich bin heute krank.* فعل *bin* در جایگاه دوم است. در *…, weil ich
        heute krank bin.* فعل به پایان جمله می‌رود. در *Wenn es regnet, bleibe
        ich hier.* کل جملهٔ پیرو جایگاه اول است، پس فعل *bleibe* درست پس از
        آن می‌آید. فعل‌ها رنگی‌اند.
      de: >
        In *Ich bin heute krank.* steht das Verb *bin* auf Position 2. In *…,
        weil ich heute krank bin.* steht das Verb am Ende. In *Wenn es regnet,
        bleibe ich hier.* ist der ganze Nebensatz Position 1. Darum kommt das
        Verb *bleibe* direkt danach. Die Verben sind farbig.
    labels:
      main: { en: "main clause: verb in position 2", fa: "جملهٔ پایه: فعل در جایگاه دوم", de: "Hauptsatz: Verb auf Position 2" }
      sub: { en: "subordinate clause: verb at the end", fa: "جملهٔ پیرو: فعل در پایان", de: "Nebensatz: Verb am Ende" }
      first: { en: "subordinate clause first", fa: "جملهٔ پیرو در آغاز", de: "Nebensatz zuerst" }
      pos1: { en: position 1, fa: جایگاه اول, de: Position 1 }
      pos2: { en: position 2, fa: جایگاه دوم, de: Position 2 }
