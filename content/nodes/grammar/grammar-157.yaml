examples:
  - de: Ich bleibe heute zu Hause, weil ich krank bin.
    en: I'm staying at home today because I'm ill.
    fa: امروز در خانه می‌مانم، چون بیمارم.
  - de: Ich glaube, dass der Film um acht Uhr anfängt.
    en: I think the film starts at eight o'clock.
    fa: فکر می‌کنم فیلم ساعت هشت شروع می‌شود.
  - de: Wir müssen schnell laufen, weil der Zug gleich abfährt.
    en: We have to run fast because the train is leaving any minute.
    fa: باید تند بدویم، چون قطار همین حالا حرکت می‌کند.
  - de: Ich weiß, dass du morgen arbeiten musst.
    en: I know that you have to work tomorrow.
    fa: می‌دانم که فردا باید کار کنی.
  - de: Er ist müde, weil er schlecht geschlafen hat.
    en: He is tired because he slept badly.
    fa: خسته است، چون بد خوابیده است.
  - de: Sie kommt nicht mit, weil sie sich nicht wohlfühlt.
    en: She isn't coming along because she doesn't feel well.
    fa: با ما نمی‌آید، چون حالش خوب نیست.
  - de: Weil es regnet, nehmen wir den Bus.
    en: Because it's raining, we'll take the bus.
    fa: چون باران می‌بارد، با اتوبوس می‌رویم.
  - de: Wenn Sie Zeit haben, kommen Sie uns besuchen.
    en: If you have time, come and visit us.
    fa: اگر وقت دارید، به دیدن ما بیایید.
  - de: Wenn du Hunger hast, dann iss doch ein Brot.
    en: If you're hungry, then have a sandwich.
    fa: اگر گرسنه‌ای، پس یک ساندویچ بخور.

mistakes:
  - wrong: Ich bleibe zu Hause, weil ich bin krank.
    right: Ich bleibe zu Hause, weil ich krank bin.
    why:
      en: "In the subordinate clause the conjugated verb goes to the very end: *weil ich krank bin*."
      fa: "در جملهٔ پیرو فعل صرف‌شده به پایان جمله می‌رود: *weil ich krank bin*."
      de: "Im Nebensatz steht das konjugierte Verb ganz am Ende: *weil ich krank bin*."
  - wrong: Weil es regnet, wir nehmen den Bus.
    right: Weil es regnet, nehmen wir den Bus.
    why:
      en: "The subordinate clause is position 1, so the main verb comes next: *nehmen wir*."
      fa: "جملهٔ پیرو جایگاه اول است، پس فعل جملهٔ پایه بلافاصله پس از آن می‌آید: *nehmen wir*."
      de: "Der Nebensatz ist Position 1. Darum kommt danach sofort das Verb: *nehmen wir*."
  - wrong: Wir laufen, weil der Zug fährt gleich ab.
    right: Wir laufen, weil der Zug gleich abfährt.
    why:
      en: "In a subordinate clause a separable verb stays in one piece at the end: *abfährt*."
      fa: "در جملهٔ پیرو فعل جداشدنی جدا نمی‌شود و یک‌جا در پایان می‌آید: *abfährt*."
      de: "Im Nebensatz bleibt das trennbare Verb zusammen und steht am Ende: *abfährt*."
  - wrong: Ich weiß, dass du musst morgen arbeiten.
    right: Ich weiß, dass du morgen arbeiten musst.
    why:
      en: "The modal verb is the conjugated part, so it comes last, after the infinitive: *arbeiten musst*."
      fa: "فعل وجهی بخش صرف‌شده است، پس در آخر و پس از مصدر می‌آید: *arbeiten musst*."
      de: "Das Modalverb ist der konjugierte Teil. Es steht ganz am Schluss, nach dem Infinitiv: *arbeiten musst*."
  - wrong: Ich komme zu spät, weil ich habe den Bus verpasst.
    right: Ich komme zu spät, weil ich den Bus verpasst habe.
    why:
      en: "In the *Perfekt* the conjugated *habe* goes to the end, after the *Partizip II*: *verpasst habe*."
      fa: "در گذشتهٔ نقلی (*Perfekt*) فعل صرف‌شدهٔ *habe* پس از صفت مفعولی و در پایان می‌آید: *verpasst habe*."
      de: "Im Perfekt steht das konjugierte *habe* am Ende, nach dem Partizip II: *verpasst habe*."

questions:
  - id: choice-1
    type: multiple-choice
    prompt: Ich komme heute nicht, weil …
    options: [ich krank bin., ich bin krank., bin ich krank.]
    answer: ich krank bin.
    explanation:
      en: "After *weil* the conjugated verb goes to the end: *ich krank bin*."
      fa: "پس از *weil* فعل صرف‌شده به پایان جمله می‌رود: *ich krank bin*."
      de: "Nach *weil* steht das konjugierte Verb am Ende: *ich krank bin*."
  - id: choice-2
    type: multiple-choice
    prompt: Weil es regnet, …
    options: [nehmen wir den Bus., wir nehmen den Bus., wir den Bus nehmen.]
    answer: nehmen wir den Bus.
    explanation:
      en: "The subordinate clause is position 1, so the main verb follows it directly: *nehmen wir*."
      fa: "جملهٔ پیرو جایگاه اول است، پس فعل جملهٔ پایه بلافاصله پس از آن می‌آید: *nehmen wir*."
      de: "Der Nebensatz ist Position 1. Danach kommt sofort das Verb: *nehmen wir*."
  - id: choice-3
    type: multiple-choice
    prompt: Wenn Sie Zeit haben, …
    options: [kommen Sie uns besuchen., Sie kommen uns besuchen., Sie uns besuchen kommen.]
    answer: kommen Sie uns besuchen.
    explanation:
      en: "The *wenn* clause is position 1, so the main clause starts with its verb: *kommen Sie*."
      fa: "جملهٔ پیرو با *wenn* جایگاه اول است، پس جملهٔ پایه با فعلش آغاز می‌شود: *kommen Sie*."
      de: "Der *wenn*-Satz ist Position 1. Der Hauptsatz beginnt mit dem Verb: *kommen Sie*."
  - id: gap-1
    type: gap-fill
    prompt: Wir müssen laufen, weil der Zug gleich ___.
    options: [abfährt, fährt ab, ab fährt]
    answer: abfährt
    explanation:
      en: "In a subordinate clause the separable verb is one word at the end: *abfährt*."
      fa: "در جملهٔ پیرو فعل جداشدنی یک‌جا در پایان می‌آید: *abfährt*."
      de: "Im Nebensatz steht das trennbare Verb zusammen am Ende: *abfährt*."
  - id: gap-2
    type: gap-fill
    prompt: Ich weiß, dass du morgen ___.
    options: [arbeiten musst, musst arbeiten, arbeitest musst]
    answer: arbeiten musst
    explanation:
      en: "The conjugated modal verb comes last, after the infinitive: *arbeiten musst*."
      fa: "فعل وجهی صرف‌شده در آخر و پس از مصدر می‌آید: *arbeiten musst*."
      de: "Das konjugierte Modalverb steht ganz am Schluss, nach dem Infinitiv: *arbeiten musst*."
  - id: gap-3
    type: gap-fill
    prompt: Er ist müde, weil er schlecht ___.
    options: [geschlafen hat, hat geschlafen, schlafen hat]
    answer: geschlafen hat
    explanation:
      en: "In the *Perfekt* the conjugated *hat* comes last, after the *Partizip II*: *geschlafen hat*."
      fa: "در گذشتهٔ نقلی (*Perfekt*) فعل صرف‌شدهٔ *hat* پس از صفت مفعولی و در آخر می‌آید: *geschlafen hat*."
      de: "Im Perfekt steht das konjugierte *hat* am Schluss, nach dem Partizip II: *geschlafen hat*."
  - id: gap-4
    type: gap-fill
    prompt: Sie kommt nicht mit, weil ___ nicht wohlfühlt.
    options: [sie sich, sich sie, sie]
    answer: sie sich
    explanation:
      en: "*Sich wohlfühlen* needs its *sich*, and the reflexive pronoun stays next to the subject: *sie sich*."
      fa: "*sich wohlfühlen* ضمیر انعکاسی *sich* را لازم دارد و این ضمیر کنار فاعل می‌ماند: *sie sich*."
      de: "*Sich wohlfühlen* braucht *sich*. Das Reflexivpronomen steht beim Subjekt: *sie sich*."
  - id: true-1
    type: true-false
    prompt: Ich glaube, dass der Film um acht Uhr anfängt.
    answer: true
    explanation:
      en: "After *dass* the verb is at the end, and the separable verb is one word: *anfängt*. The sentence is correct."
      fa: "پس از *dass* فعل در پایان جمله است و فعل جداشدنی یک‌جا آمده است: *anfängt*. جمله درست است."
      de: "Nach *dass* steht das Verb am Ende, das trennbare Verb zusammen: *anfängt*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Wenn du Zeit hast, du kannst mich besuchen.
    answer: false
    explanation:
      en: "After the *wenn* clause the verb comes first: *Wenn du Zeit hast, kannst du mich besuchen.*"
      fa: "پس از جملهٔ پیرو با *wenn* فعل اول می‌آید: *Wenn du Zeit hast, kannst du mich besuchen.*"
      de: "Nach dem *wenn*-Satz kommt zuerst das Verb: *Wenn du Zeit hast, kannst du mich besuchen.*"
  - id: true-3
    type: true-false
    prompt: Ich komme zu spät, weil ich habe den Bus verpasst.
    answer: false
    explanation:
      en: "*Habe* goes to the end of the subordinate clause: *weil ich den Bus verpasst habe*."
      fa: "*habe* به پایان جملهٔ پیرو می‌رود: *weil ich den Bus verpasst habe*."
      de: "*Habe* steht am Ende vom Nebensatz: *weil ich den Bus verpasst habe*."
  - id: true-4
    type: true-false
    prompt: Weil ich müde bin, gehe ich ins Bett.
    answer: true
    explanation:
      en: "*Bin* ends the subordinate clause, and the main clause starts with its verb *gehe*. The sentence is correct."
      fa: "*bin* جملهٔ پیرو را می‌بندد و جملهٔ پایه با فعل *gehe* آغاز می‌شود. جمله درست است."
      de: "*Bin* steht am Ende vom Nebensatz, der Hauptsatz beginnt mit dem Verb *gehe*. Der Satz ist richtig."
  - id: true-5
    type: true-false
    prompt: Ich hoffe, dass du dich bald besser fühlst.
    answer: true
    explanation:
      en: "The reflexive pronoun *dich* stays next to the subject, and the verb *fühlst* is at the end. The sentence is correct."
      fa: "ضمیر انعکاسی *dich* کنار فاعل مانده و فعل *fühlst* در پایان است. جمله درست است."
      de: "Das Reflexivpronomen *dich* steht beim Subjekt, das Verb *fühlst* am Ende. Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Wir müssen uns beeilen, weil der Bus gleich ___ (abfahren).
    answers: [abfährt]
    explanation:
      en: "The separable verb stays one word at the end of the subordinate clause: *abfährt*."
      fa: "فعل جداشدنی در پایان جملهٔ پیرو یک‌جا می‌ماند: *abfährt*."
      de: "Das trennbare Verb bleibt am Ende vom Nebensatz zusammen: *abfährt*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Es tut mir leid, dass ich so spät ___ (anrufen).
    answers: [anrufe, angerufen habe]
    explanation:
      en: "The verb goes to the end, and the separable verb is one word: *anrufe*."
      fa: "فعل به پایان جمله می‌رود و فعل جداشدنی یک‌جا نوشته می‌شود: *anrufe*."
      de: "Das Verb steht am Ende, das trennbare Verb zusammen: *anrufe*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Ich bin froh, dass du heute ___ (mitkommen).
    answers: [mitkommst, mitgekommen bist]
    explanation:
      en: "In the *dass* clause the separable verb stays one word at the end: *mitkommst*."
      fa: "در جملهٔ پیرو با *dass* فعل جداشدنی یک‌جا در پایان می‌آید: *mitkommst*."
      de: "Im *dass*-Satz steht das trennbare Verb zusammen am Ende: *mitkommst*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Wenn ich Zeit habe, ___ (helfen) ich dir.
    answers: [helfe]
    explanation:
      en: "The *wenn* clause is position 1, so the verb *helfe* comes next, before the subject."
      fa: "جملهٔ پیرو با *wenn* جایگاه اول است، پس فعل *helfe* پیش از فاعل می‌آید."
      de: "Der *wenn*-Satz ist Position 1. Danach kommt das Verb *helfe*, vor dem Subjekt."
  - id: order-1
    type: word-order
    answers:
      - ["ich bleibe heute zu Hause,", weil, ich, krank, bin]
    explanation:
      en: "*Weil* starts the subordinate clause, the subject follows, and the verb *bin* closes it."
      fa: "*weil* جملهٔ پیرو را آغاز می‌کند، فاعل پس از آن می‌آید و فعل *bin* آن را می‌بندد."
      de: "*Weil* beginnt den Nebensatz, dann kommt das Subjekt, am Ende das Verb *bin*."
  - id: order-2
    type: word-order
    answers:
      - ["wenn es regnet,", bleiben, wir, zu Hause]
    explanation:
      en: "The subordinate clause is position 1, so the verb *bleiben* comes next, then the subject."
      fa: "جملهٔ پیرو جایگاه اول است، پس فعل *bleiben* پس از آن و سپس فاعل می‌آید."
      de: "Der Nebensatz ist Position 1. Dann kommt das Verb *bleiben*, danach das Subjekt."
