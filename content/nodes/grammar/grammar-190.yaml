    explanation:
      en: "*-zehn* is 13 to 19, *-zig* the tens; thirty is the exception, *dreißig*. *Sieben* loses *-en*: *siebzehn*, *siebzig*."
      fa: "*-zehn* برای ۱۳ تا ۱۹ است و *-zig* برای دهگان؛ سی استثناست: *dreißig*. *sieben* بخش *-en* را از دست می‌دهد: *siebzehn*، *siebzig*."
