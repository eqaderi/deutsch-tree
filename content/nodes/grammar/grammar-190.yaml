# The digits of 42 and the order in which they are said: the lines cross.
diagrams:
  - caption:
      en: >
        *42* is said *zweiundvierzig*: first the ones (*zwei*), then *und*,
        then the tens (*vierzig*). The lines cross because German says the two
        digits in the opposite order to the one in which they are written.
      fa: >
        *42* را *zweiundvierzig* می‌خوانند: اول یکان (*zwei*)، سپس *und* و در
        آخر دهگان (*vierzig*). خط‌ها یکدیگر را قطع می‌کنند، زیرا آلمانی دو رقم
        را به ترتیبی وارونهٔ ترتیب نوشتنشان می‌خواند.
      de: >
        *42* sagt man *zweiundvierzig*: zuerst die Einer (*zwei*), dann *und*,
        dann die Zehner (*vierzig*). Die Linien kreuzen sich: Man spricht die
        zwei Ziffern in der anderen Reihenfolge, als man sie schreibt.
    svg: |
      <svg viewBox="0 0 320 186">
        <!-- the two digits as written -->
        <rect class="surface" x="95" y="20" width="50" height="50"/>
        <text class="label" x="120" y="51" text-anchor="middle">4</text>
        <rect class="surface" x="175" y="20" width="50" height="50"/>
        <text class="label" x="200" y="51" text-anchor="middle">2</text>
        <!-- the 2 is said first, the 4 last -->
        <line class="line" x1="200" y1="72" x2="68" y2="109"/>
        <polygon class="object" points="64,110 71.5,103.3 73.9,111.9"/>
        <line class="line" x1="120" y1="72" x2="252" y2="109"/>
        <polygon class="object" points="256,110 246.1,111.9 248.5,103.3"/>
        <!-- the words in the order they are said -->
        <text class="label" x="60" y="134" text-anchor="middle">zwei</text>
        <text class="note" x="160" y="134" text-anchor="middle">und</text>
        <text class="label" x="260" y="134" text-anchor="middle">vierzig</text>
        <text class="label" x="160" y="174" text-anchor="middle">zweiundvierzig</text>
      </svg>

