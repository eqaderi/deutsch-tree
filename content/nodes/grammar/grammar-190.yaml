mistakes:
  - wrong: Ich bin zwanzigvier Jahre alt.
    right: Ich bin vierundzwanzig Jahre alt.
    why:
      en: "From 21 on, the ones come first, then *und*, then the tens: *vierundzwanzig*."
      fa: "از ۲۱ به بعد، اول یکان می‌آید، سپس *und* و در آخر دهگان: *vierundzwanzig*."
      de: "Ab 21 kommen zuerst die Einer, dann *und*, dann die Zehner: *vierundzwanzig*."
  - wrong: Das kostet drei Komma fünfzig Euro.
    right: Das kostet drei Euro fünfzig.
    why:
      en: "A price is said in euros, then cents, without *Komma*: *drei Euro fünfzig*."
      fa: "قیمت را اول با یورو و بعد با سنت می‌گویند و *Komma* را نمی‌خوانند: *drei Euro fünfzig*."
      de: "Einen Preis sagt man ohne *Komma*: zuerst die Euro, dann die Cent. *Drei Euro fünfzig*."
  - wrong: Ich nehme drei Liters Milch.
    right: Ich nehme drei Liter Milch.
    why:
      en: "After a number, *Liter* has no plural ending: *drei Liter*, like *zwei Kilo* and *zehn Euro*."
      fa: "*Liter* پس از عدد پایانهٔ جمع نمی‌گیرد: *drei Liter*؛ مانند *zwei Kilo* و *zehn Euro*."
      de: "Nach einer Zahl bekommt *Liter* keine Endung: *drei Liter*, wie *zwei Kilo* und *zehn Euro*."
  - wrong: Berlin hat fast vier Million Einwohner.
    right: Berlin hat fast vier Millionen Einwohner.
    why:
      en: "*Million* is a noun, and from two on it is plural: *zwei Millionen*, *vier Millionen*."
      fa: "*Million* اسم است و از دو به بالا جمع می‌شود: *zwei Millionen*، *vier Millionen*."
      de: "*Million* ist ein Nomen. Ab zwei steht der Plural: *zwei Millionen*, *vier Millionen*."
  - wrong: Ich möchte eins Kilo Äpfel.
    right: Ich möchte ein Kilo Äpfel.
    why:
      en: "*Eins* is the number on its own. Before a noun it is *ein* or *eine*: *ein Kilo*, *eine Flasche*."
      fa: "*eins* فقط وقتی به کار می‌رود که عدد تنها بیاید. پیش از اسم، *ein* یا *eine* می‌آید: *ein Kilo*، *eine Flasche*."
      de: "*Eins* sagt man nur allein. Vor einem Nomen steht *ein* oder *eine*: *ein Kilo*, *eine Flasche*."

# 20 questions.
questions:
  - id: choice-1
    type: multiple-choice
    prompt: "21: ___"
    options: [einundzwanzig, zwanzigeins, einszwanzig]
    answer: einundzwanzig
    explanation:
      en: "The ones first, then *und*, then the tens. Before *und*, *eins* is *ein*: *einundzwanzig*."
      fa: "اول یکان، سپس *und* و بعد دهگان. پیش از *und*، *eins* می‌شود *ein*: *einundzwanzig*."
      de: "Zuerst die Einer, dann *und*, dann die Zehner. Vor *und* sagt man *ein*: *einundzwanzig*."
  - id: choice-2
    type: multiple-choice
    prompt: "36: ___"
    options: [sechsunddreißig, dreißigsechs, sechsunddreizig]
    answer: sechsunddreißig
    explanation:
      en: "Six, then *und*, then thirty. Thirty is *dreißig*, with *ß* and without *-zig*."
      fa: "اول شش، سپس *und* و بعد سی. سی در آلمانی *dreißig* است، با *ß* و بدون *-zig*."
      de: "Zuerst sechs, dann *und*, dann dreißig. *Dreißig* schreibt man mit *ß*, nicht mit *-zig*."
  - id: choice-3
    type: multiple-choice
    prompt: "17: ___"
    options: [siebzehn, siebzig, siebenundzehn]
    answer: siebzehn
    explanation:
      en: "13 to 19 add *-zehn*, and *sieben* loses its *-en*: *siebzehn*. *Siebzig* is 70."
      fa: "عددهای ۱۳ تا ۱۹ با *-zehn* ساخته می‌شوند و *sieben* بخش *-en* خود را از دست می‌دهد: *siebzehn*. *siebzig* یعنی ۷۰."
      de: "Von 13 bis 19 kommt *-zehn* dazu, und *sieben* verliert *-en*: *siebzehn*. *Siebzig* ist 70."
  - id: choice-4
    type: multiple-choice
    prompt: "Das kostet 3,50 €. Man sagt: Das kostet ___."
    options: [drei Euro fünfzig, drei Komma fünfzig Euro, dreihundertfünfzig Euro]
    answer: drei Euro fünfzig
    explanation:
      en: "A price is said in euros, then cents: *drei Euro fünfzig*."
      fa: "قیمت را اول با یورو و بعد با سنت می‌گویند: *drei Euro fünfzig*."
      de: "Einen Preis sagt man so: zuerst die Euro, dann die Cent. *Drei Euro fünfzig*."
  - id: gap-1
    type: gap-fill
    prompt: Wir brauchen 500 ___ Käse.
    options: [Gramm, Gramms]
    answer: Gramm
    explanation:
      en: "After a number, *Gramm* stays singular: *500 Gramm*."
      fa: "*Gramm* پس از عدد مفرد می‌ماند: *500 Gramm*."
      de: "Nach einer Zahl bleibt *Gramm* im Singular: *500 Gramm*."
  - id: gap-2
    type: gap-fill
    prompt: Ich nehme zwei ___ Wasser.
    options: [Flaschen, Flasche]
    answer: Flaschen
    explanation:
      en: "*Flasche* is not a unit like *Kilo* or *Liter*, so it takes its plural: *zwei Flaschen*."
      fa: "*Flasche* واحد اندازه‌گیری مانند *Kilo* یا *Liter* نیست، پس جمع می‌شود: *zwei Flaschen*."
      de: "*Flasche* ist keine Maßeinheit wie *Kilo* oder *Liter*. Darum steht der Plural: *zwei Flaschen*."
  - id: gap-3
    type: gap-fill
    prompt: Das Buch kostet zehn ___.
    options: [Euro, Euros]
    answer: Euro
    explanation:
      en: "In a price, *Euro* stays singular: *zehn Euro*."
      fa: "در قیمت، *Euro* مفرد می‌ماند: *zehn Euro*."
      de: "Bei einem Preis bleibt *Euro* im Singular: *zehn Euro*."
  - id: gap-4
    type: gap-fill
    prompt: Ich möchte ___ Kilo Äpfel.
    options: [ein, eins, eine]
    answer: ein
    explanation:
      en: "Before a noun, *eins* becomes *ein* or *eine*. *Kilo* is a *das* noun: *ein Kilo*."
      fa: "پیش از اسم، *eins* به *ein* یا *eine* تبدیل می‌شود. *Kilo* اسم خنثی (*das*) است: *ein Kilo*."
      de: "Vor einem Nomen wird *eins* zu *ein* oder *eine*. *Kilo* hat den Artikel *das*: *ein Kilo*."
  - id: true-1
    type: true-false
    prompt: Unsere Stadt hat zweihunderttausend Einwohner.
    answer: true
    explanation:
      en: "Hundreds and thousands are one word with the rest: *zweihunderttausend*. The sentence is correct."
      fa: "صدها و هزارها با بقیهٔ عدد در یک واژه نوشته می‌شوند: *zweihunderttausend*. جمله درست است."
      de: "Hunderter und Tausender schreibt man in ein Wort: *zweihunderttausend*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Mein Opa ist achtzigdrei Jahre alt.
    answer: false
    explanation:
      en: "The ones come first: 83 is *dreiundachtzig*."
      fa: "یکان اول می‌آید: ۸۳ می‌شود *dreiundachtzig*."
      de: "Die Einer kommen zuerst: 83 ist *dreiundachtzig*."
  - id: true-3
    type: true-false
    prompt: Hamburg hat fast zwei Million Einwohner.
    answer: false
    explanation:
      en: "From two on, *Million* is plural: *zwei Millionen*."
      fa: "*Million* از دو به بالا جمع می‌شود: *zwei Millionen*."
      de: "Ab zwei steht *Million* im Plural: *zwei Millionen*."
  - id: true-4
    type: true-false
    prompt: Der Kaffee kostet zwei Euro achtzig.
    answer: true
    explanation:
      en: "Euros first, then cents: *zwei Euro achtzig* is 2,80 €. The sentence is correct."
      fa: "اول یورو و بعد سنت: *zwei Euro achtzig* یعنی *2,80 €*. جمله درست است."
      de: "Zuerst die Euro, dann die Cent: *zwei Euro achtzig* ist *2,80 €*. Der Satz ist richtig."
  - id: typed-1
    type: typed-answer
    prompt: "In Worten: 45"
    answers: [fünfundvierzig]
    explanation:
      en: "Five, then *und*, then forty: *fünfundvierzig*, written as one word."
      fa: "اول پنج، سپس *und* و بعد چهل: *fünfundvierzig*، در یک واژه."
      de: "Zuerst fünf, dann *und*, dann vierzig: *fünfundvierzig*, in einem Wort."
  - id: typed-2
    type: typed-answer
    prompt: "In Worten: 99"
    answers: [neunundneunzig]
    explanation:
      en: "Nine, then *und*, then ninety: *neunundneunzig*."
      fa: "اول نه، سپس *und* و بعد نود: *neunundneunzig*."
      de: "Zuerst neun, dann *und*, dann neunzig: *neunundneunzig*."
  - id: typed-3
    type: typed-answer
    prompt: "In Worten: 16"
    answers: [sechzehn]
    explanation:
      en: "*Sechs* loses its *-s* before *-zehn*: *sechzehn*."
      fa: "*sechs* پیش از *-zehn* حرف *-s* خود را از دست می‌دهد: *sechzehn*."
      de: "*Sechs* verliert vor *-zehn* das *-s*: *sechzehn*."
  - id: typed-4
    type: typed-answer
    prompt: "In Worten: 300"
    answers: [dreihundert]
    explanation:
      en: "Hundreds are one word: *dreihundert*."
      fa: "صدها در یک واژه نوشته می‌شوند: *dreihundert*."
      de: "Hunderter schreibt man in ein Wort: *dreihundert*."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Berlin hat fast vier ___ (Million) Einwohner.
    answers: [Millionen]
    explanation:
      en: "From two on, *Million* is plural: *vier Millionen*."
      fa: "*Million* از دو به بالا جمع می‌شود: *vier Millionen*."
      de: "Ab zwei steht *Million* im Plural: *vier Millionen*."
  - id: error-1
