    answer: zwanzigdrei
    explanation:
      en: "The ones come first, then *und*: 23 is *dreiundzwanzig*."
      fa: "اول یکان می‌آید و سپس *und*: ۲۳ می‌شود *dreiundzwanzig*."
      de: "Zuerst die Einer, dann *und*: 23 ist *dreiundzwanzig*."
  - id: error-2
    type: find-error
    prompt: Wir kaufen drei Flasche Saft.
    answer: Flasche
    explanation:
      en: "*Flasche* is not a unit like *Liter*, so after *drei* it is plural: *drei Flaschen*."
