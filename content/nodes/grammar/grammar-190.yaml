title:
  en: "Cardinal numbers to one million; prices, quantities"
  fa: "عددهای اصلی تا یک میلیون؛ قیمت و مقدار"
  de: "Zahlen bis eine Million; Preise und Mengen"

explanations:
  en:
    rule: >
      The numbers 0 to 12 have their own words; 13 to 19 add *-zehn*:
      *dreizehn*, *sechzehn*, *siebzehn*. From 21 on, German says the ones
      first, then *und*, then the tens: *21* is *einundzwanzig*, *45* is
      *fünfundvierzig*. Hundreds and thousands join the rest into one word
      (*dreihundertzwanzig*), but *Million* is a noun: *eine Million*, *zwei
      Millionen*. German writes a comma before the cents and a point between
      the thousands (*3,50 €*, *1.000*), and a price is said in euros, then
      cents: *drei Euro fünfzig*. After a number, *Euro*, *Cent*, *Kilo*,
      *Gramm* and *Liter* stay singular: *zwei Kilo*, *zehn Euro*.
  fa:
    rule: >
      عددهای ۰ تا ۱۲ هر کدام نام خود را دارند و عددهای ۱۳ تا ۱۹ با *-zehn*
      ساخته می‌شوند: *dreizehn*، *sechzehn*، *siebzehn*. از ۲۱ به بعد، ترتیب
      وارونهٔ فارسی است: اول یکان، سپس *und* و در آخر دهگان. پس *21* می‌شود
      *einundzwanzig* (یعنی «یک و بیست») و *45* می‌شود *fünfundvierzig*. صدها
      و هزارها با بقیهٔ عدد در یک واژه نوشته می‌شوند (*dreihundertzwanzig*)،
      ولی *Million* اسم است: *eine Million*، *zwei Millionen*. در آلمانی پیش
      از سنت ویرگول می‌گذارند و هزارها را با نقطه جدا می‌کنند (*3,50 €*،
      *1.000*). قیمت را اول با یورو و بعد با سنت می‌گویند: *drei Euro
      fünfzig*. پس از عدد، *Euro*، *Cent*، *Kilo*، *Gramm* و *Liter* مفرد
      می‌مانند: *zwei Kilo*، *zehn Euro*.
  de:
    rule: >
      Die Zahlen von 0 bis 12 haben eigene Wörter. Von 13 bis 19 kommt
      *-zehn* dazu: *dreizehn*, *sechzehn*, *siebzehn*. Ab 21 sagt man zuerst
      die Einer, dann *und*, dann die Zehner: *einundzwanzig*,
      *fünfundvierzig*. Hunderter und Tausender schreibt man mit dem Rest in
      ein Wort: *dreihundertzwanzig*. Aber *Million* ist ein Nomen: *eine
      Million*, *zwei Millionen*. Vor den Cent steht ein Komma, bei den
      Tausendern ein Punkt: *3,50 €*, *1.000*. Den Preis sagt man so: *drei
      Euro fünfzig*. Nach einer Zahl bleiben *Euro*, *Cent*, *Kilo*, *Gramm*
      und *Liter* im Singular: *zwei Kilo*, *zehn Euro*.

