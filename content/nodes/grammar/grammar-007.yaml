    prompt: ___ Sie bitte hier!
    options: [Warten, Wartet, Warte]
    answer: Warten
    explanation:
      en: "The polite imperative is the *Sie* form: *Warten Sie!*"
      fa: "امر مؤدبانه همان صرف *Sie* است: *Warten Sie!*"
      de: "Der Imperativ mit *Sie* ist die *Sie*-Form: *Warten Sie!*"
  - id: gap-2
    type: gap-fill
    prompt: ___ Sie bitte pünktlich!
    options: [Seien, Sind, Sein]
