      fa: "با *Sie* فعل به صرف *Sie* می‌آید: *Gehen Sie bitte geradeaus!*"
      de: "Mit *Sie* steht die *Sie*-Form: *Gehen Sie bitte geradeaus!*"
  - id: error-2
