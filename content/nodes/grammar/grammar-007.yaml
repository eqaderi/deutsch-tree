    answer: true
    explanation:
      en: "*Machen Sie* first, the prefix *zu* at the end. The sentence is correct."
      fa: "*Machen Sie* در آغاز و پیشوند *zu* در پایان جمله. جمله درست است."
      de: "*Machen Sie* am Anfang, das Präfix *zu* am Ende. Der Satz ist richtig."
