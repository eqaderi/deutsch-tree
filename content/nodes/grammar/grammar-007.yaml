    answer: zu
    explanation:
      en: "*Machen* is first; the prefix *zu* goes to the end."
      fa: "*machen* در آغاز آمده است و پیشوند *zu* به پایان جمله می‌رود."
      de: "*Machen* steht am Anfang, das Präfix *zu* am Ende."
  - id: gap-4
    type: gap-fill
    prompt: Nehmen ___ Platz!
    options: [Sie, du, ihr]
    answer: Sie
    explanation:
      en: "*Nehmen* without a vowel change is the *Sie* form, so *Sie* follows it."
      fa: "*nehmen* بدون تغییر واکه صرف *Sie* است، پس پس از آن *Sie* می‌آید."
      de: "*Nehmen* ohne Vokalwechsel ist die *Sie*-Form. Danach steht *Sie*."
  - id: choice-1
    type: multiple-choice
    prompt: "sprechen, Imperativ mit Sie:"
    options: [Sprechen Sie bitte langsam!, Sprecht Sie bitte langsam!, Sprich Sie bitte langsam!]
    answer: Sprechen Sie bitte langsam!
    explanation:
      en: "The *Sie* form keeps the infinitive's vowel and ending: *Sprechen Sie!*"
      fa: "صرف *Sie* واکه و شناسهٔ مصدر را نگه می‌دارد: *Sprechen Sie!*"
      de: "Die *Sie*-Form ist wie der Infinitiv: *Sprechen Sie!*"
  - id: choice-2
    type: multiple-choice
    prompt: "anrufen, Imperativ mit Sie:"
    options: [Rufen Sie mich morgen an!, Anrufen Sie mich morgen!, Rufen Sie an mich morgen!]
    answer: Rufen Sie mich morgen an!
    explanation:
      en: "The verb part comes first, *Sie* after it, and *an* at the end."
      fa: "بخش فعلی در آغاز می‌آید، *Sie* پس از آن و *an* در پایان جمله."
      de: "Der Verbteil steht am Anfang, dann *Sie*, und *an* am Ende."
  - id: choice-3
    type: multiple-choice
    prompt: "sein, Imperativ mit Sie:"
    options: [Seien Sie leise!, Sind Sie leise!, Sein Sie leise!]
    answer: Seien Sie leise!
    explanation:
      en: "*Sein* has its own form: *Seien Sie!*"
      fa: "*sein* شکل ویژهٔ خود را دارد: *Seien Sie!*"
      de: "*Sein* hat eine eigene Form: *Seien Sie!*"
  - id: choice-4
    type: multiple-choice
    prompt: "fahren, Imperativ mit Sie:"
    options: [Fahren Sie bitte langsam!, Fährst Sie bitte langsam!, Fahrt Sie bitte langsam!]
    answer: Fahren Sie bitte langsam!
    explanation:
      en: "No vowel change with *Sie*: *Fahren Sie!*"
      fa: "با *Sie* واکه تغییر نمی‌کند: *Fahren Sie!*"
      de: "Mit *Sie* gibt es keinen Vokalwechsel: *Fahren Sie!*"
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: ___ (kommen) Sie bitte herein!
    answers: [Kommen]
    explanation:
      en: "The *Sie* form of *kommen* is *kommen*; at the start it has a capital: *Kommen Sie …!*"
      fa: "صرف *Sie* فعل *kommen* همان *kommen* است و در آغاز جمله با حرف بزرگ نوشته می‌شود: *Kommen Sie …!*"
      de: "Die *Sie*-Form von *kommen* ist *kommen*. Am Anfang schreibt man groß: *Kommen Sie …!*"
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: ___ (sein) Sie bitte vorsichtig!
    answers: [Seien]
    explanation:
      en: "*Sein* has a special form: *Seien Sie!*"
      fa: "*sein* شکل ویژه‌ای دارد: *Seien Sie!*"
      de: "*Sein* hat eine eigene Form: *Seien Sie!*"
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Rufen Sie mich bitte ___ (anrufen)!
    answers: [an]
    explanation:
      en: "*Rufen* is first, so the prefix *an* goes to the end."
      fa: "*rufen* در آغاز آمده است، پس پیشوند *an* به پایان جمله می‌رود."
      de: "*Rufen* steht am Anfang. Das Präfix *an* steht am Ende."
  - id: typed-gap-4
