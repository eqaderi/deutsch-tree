    answer: true
    explanation:
      en: "Verb first, *Sie* after it. The sentence is correct."
      fa: "فعل در آغاز و *Sie* پس از آن. جمله درست است."
      de: "Das Verb steht am Anfang, dann *Sie*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Sind Sie bitte ruhig!
    answer: false
    explanation:
      en: "The imperative of *sein* is *seien*: *Seien Sie bitte ruhig!*"
      fa: "امر *sein* با *Sie* می‌شود *seien*: *Seien Sie bitte ruhig!*"
      de: "Der Imperativ von *sein* ist *seien*: *Seien Sie bitte ruhig!*"
  - id: true-3
