      fa: "با *Sie* واکه تغییر نمی‌کند: *Lesen Sie!*، نه *Liest*."
      de: "Mit *Sie* gibt es keinen Vokalwechsel: *Lesen Sie!*, nicht *Liest*."
  - id: typed-gap-5
    type: typed-gap-fill
    prompt: Frau Klein, ___ (nehmen) Sie bitte Platz!
    answers: [nehmen]
    explanation:
      en: "The *Sie* form is *nehmen*, without a vowel change; after the comma it is lower case."
      fa: "صرف *Sie* همان *nehmen* است، بدون تغییر واکه؛ پس از ویرگول با حرف کوچک نوشته می‌شود."
      de: "Die *Sie*-Form ist *nehmen*, ohne Vokalwechsel. Nach dem Komma schreibt man klein."
  - id: true-1
