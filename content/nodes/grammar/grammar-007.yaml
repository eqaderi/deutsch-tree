# Grammar list row 7.
id: grammar-007
kind: grammar
level: A1
chapter: a1-verb-patterns
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-001, grammar-002]
title:
  en: "*Imperativ*, *Sie*-form"
  fa: "امر (*Imperativ*) با *Sie*"
  de: "Imperativ mit *Sie*"

explanations:
  en:
    rule: >
      The polite imperative (*Imperativ*) asks or tells one or more people you
      call *Sie* to do something. Take the *Sie* form of the present tense and
      put the verb first, with *Sie* right after it: *Sie kommen mit* becomes
      *Kommen Sie bitte mit!* There is never a vowel change, and a separable
      prefix still goes to the end. The one special form is *sein*: *Seien Sie
      pünktlich!* *Bitte* makes the request polite.
  fa:
    rule: >
      امر (*Imperativ*) مؤدبانه از یک یا چند نفر که آن‌ها را *Sie* خطاب
      می‌کنیم، می‌خواهد کاری انجام دهند. صرف *Sie* در زمان حال را بردارید و
      فعل را به آغاز جمله ببرید؛ *Sie* بلافاصله پس از آن می‌آید: *Sie kommen
      mit* می‌شود *Kommen Sie bitte mit!* در این امر هیچ‌گاه واکه تغییر
      نمی‌کند و پیشوند فعل جداشدنی همچنان به پایان جمله می‌رود. تنها شکل
      ویژه از آنِ *sein* است: *Seien Sie pünktlich!* واژهٔ *bitte* درخواست را
      مؤدبانه می‌کند.
  de:
    rule: >
      Mit dem Imperativ mit *Sie* bittet man eine Person oder mehrere
      Personen (*Sie*), etwas zu tun. Man nimmt die *Sie*-Form im Präsens.
      Das Verb steht am Anfang, *Sie* direkt danach: *Kommen Sie bitte mit!*
      Der Vokal ändert sich nie, und das Präfix steht am Ende. Bei *sein*
      heißt es: *Seien Sie pünktlich!*

table:
  columns:
    - { en: Infinitive, fa: مصدر, de: Infinitiv }
    - { en: "*Imperativ* (*Sie*)", fa: "امر با *Sie*", de: "Imperativ (*Sie*)" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [warten, Warten Sie!, Warten Sie bitte hier!]
    - [sprechen, Sprechen Sie!, Sprechen Sie bitte langsam!]
    - [nehmen, Nehmen Sie!, Nehmen Sie Platz!]
    - [fahren, Fahren Sie!, Fahren Sie bitte langsam!]
    - [mitkommen, Kommen Sie mit!, Kommen Sie bitte mit!]
    - [zumachen, Machen Sie zu!, Machen Sie bitte die Tür zu!]
    - [sein, Seien Sie!, Seien Sie bitte pünktlich!]
    - [haben, Haben Sie!, Haben Sie keine Angst!]

examples:
  - de: Kommen Sie bitte mit!
    en: Please come with me!
    fa: لطفاً با من بیایید!
  - de: Warten Sie bitte hier.
    en: Please wait here.
    fa: لطفاً اینجا منتظر بمانید.
  - de: Sprechen Sie bitte langsam.
    en: Please speak slowly.
    fa: لطفاً آهسته صحبت کنید.
  - de: Nehmen Sie Platz!
    en: Have a seat!
    fa: بفرمایید بنشینید!
  - de: Machen Sie bitte das Fenster zu.
    en: Please close the window.
    fa: لطفاً پنجره را ببندید.
  - de: Seien Sie unbesorgt.
    en: Don't worry.
    fa: نگران نباشید.
  - de: Rufen Sie mich morgen an!
    en: Call me tomorrow!
    fa: فردا به من زنگ بزنید!
  - de: Gehen Sie hier geradeaus.
    en: Go straight ahead here.
    fa: از اینجا مستقیم بروید.

mistakes:
  - wrong: Kommen bitte mit!
    right: Kommen Sie bitte mit!
    why:
      en: "The polite imperative keeps *Sie*, right after the verb."
      fa: "امر مؤدبانه *Sie* را نگه می‌دارد، بلافاصله پس از فعل."
      de: "Der Imperativ mit *Sie* braucht *Sie*, direkt nach dem Verb."
  - wrong: Sind Sie bitte pünktlich!
    right: Seien Sie bitte pünktlich!
    why:
      en: "*Sein* has its own imperative form: *Seien Sie!*"
      fa: "*sein* شکل امری ویژهٔ خود را دارد: *Seien Sie!*"
      de: "*Sein* hat eine eigene Form: *Seien Sie!*"
  - wrong: Sprich Sie bitte langsam!
    right: Sprechen Sie bitte langsam!
    why:
      en: "The *Sie* form never changes the vowel: *sprechen*, *Sprechen Sie!*"
      fa: "در امر با *Sie* واکه هرگز تغییر نمی‌کند: *sprechen*، *Sprechen Sie!*"
      de: "Mit *Sie* ändert sich der Vokal nie: *sprechen*, *Sprechen Sie!*"
  - wrong: Machen Sie zu das Fenster!
    right: Machen Sie das Fenster zu!
    why:
      en: "The prefix *zu* goes to the end, also in the imperative."
      fa: "پیشوند *zu* در جملهٔ امری هم به پایان جمله می‌رود."
      de: "Das Präfix *zu* steht auch im Imperativ am Ende."

# 20 questions, every question type.
questions:
