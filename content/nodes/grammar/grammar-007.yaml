    explanation:
      en: "The imperative of *sein* is *seien*, not the infinitive: *Seien Sie bitte pünktlich!*"
      fa: "امر *sein* با *Sie* می‌شود *seien*، نه خودِ مصدر: *Seien Sie bitte pünktlich!*"
