      - [lesen, Lesen Sie!]
    explanation:
      en: "The *Sie* form, verb first; only *sein* is special, and a prefix goes to the end."
      fa: "صرف *Sie* با فعل در آغاز؛ فقط *sein* شکل ویژه دارد و پیشوند به پایان می‌رود."
      de: "Die *Sie*-Form, das Verb am Anfang. Nur *sein* ist besonders, das Präfix steht am Ende."
  - id: order-1
    type: word-order
    answers:
      - [kommen, Sie, bitte, mit]
      - [bitte, kommen, Sie, mit]
    end: "!"
    explanation:
      en: "*Kommen Sie* stays together, *mit* goes to the end, and *bitte* can stand after *Sie* or first."
      fa: "*Kommen Sie* با هم می‌مانند، *mit* به پایان جمله می‌رود و *bitte* می‌تواند پس از *Sie* یا در آغاز بیاید."
      de: "*Kommen Sie* bleibt zusammen, *mit* steht am Ende. *Bitte* steht nach *Sie* oder am Anfang."

