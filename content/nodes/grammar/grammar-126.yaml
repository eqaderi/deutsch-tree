# Grammar list row 126.
id: grammar-126
kind: grammar
level: A1
chapter: a1-prepositions
order: 8
status: published
recogniseOnly: false
prerequisites: [grammar-120, grammar-123, grammar-125]
title:
  en: "*Dativ* set and *Akkusativ* set"
  fa: "حرف‌های اضافه با حالت *Dativ* و حرف‌های اضافه با حالت *Akkusativ*"
  de: "Präpositionen mit Dativ und Präpositionen mit Akkusativ"

explanations:
  en:
    rule: >
      Some prepositions always take the same case, whatever the sentence
      says. Always *Dativ*: *aus*, *bei*, *mit*, *nach*, *seit*, *von*, *zu*.
      Always *Akkusativ*: *durch*, *für*, *gegen*, *ohne*, *um*. Learn the two
      sets by heart. Three of them are new: *durch* means through (*durch den
      Park*), *gegen* against (*gegen die Wand*, *gegen Bayern*), and *um*
      around (*um den See*); you already know *um* with a clock time. In the
      *Dativ*, *der* and *das* become *dem*, *die* becomes *der*, and plural
      *die* becomes *den*, with *-n* on the noun. In the *Akkusativ* only
      *der* changes, to *den*.
  fa:
    rule: >
      بعضی از حرف‌های اضافه همیشه با یک حالت می‌آیند، معنای جمله هر چه باشد.
      همیشه با حالت *Dativ* (حالت مفعول باواسطه): *aus*، *bei*، *mit*،
      *nach*، *seit*، *von* و *zu*. همیشه با حالت *Akkusativ* (حالت مفعولی):
      *durch*، *für*، *gegen*، *ohne* و *um*. این دو گروه را از بر کنید. سه
      حرف اضافه تازه است: *durch* یعنی «از میان» (*durch den Park*)، *gegen*
      یعنی «به» یا «علیه» (*gegen die Wand* و *gegen Bayern*) و *um* یعنی «دور»
      (*um den See*)؛ *um* را با ساعت پیش‌تر دیده‌اید. در حالت *Dativ*، *der*
      و *das* به *dem* تبدیل می‌شوند، *die* به *der*، و *die* جمع به *den*؛
      اسم جمع نیز *-n* می‌گیرد. در حالت *Akkusativ* فقط *der* تغییر می‌کند و
      *den* می‌شود.
  de:
    rule: >
      Nach manchen Präpositionen steht immer derselbe Kasus. Immer Dativ:
      *aus*, *bei*, *mit*, *nach*, *seit*, *von*, *zu*. Immer Akkusativ:
      *durch*, *für*, *gegen*, *ohne*, *um*. Lernen Sie die zwei Gruppen
      auswendig. Neu sind *durch* (*durch den Park*), *gegen* (*gegen die
      Wand*, *gegen Bayern*) und *um* für einen Kreis (*um den See*). *Um* mit
      der Uhrzeit kennen Sie schon. Im Dativ werden *der* und *das* zu *dem*,
      *die* wird zu *der*, und im Plural steht *den*, das Nomen bekommt *-n*.
      Im Akkusativ ändert sich nur *der*: Er wird zu *den*.

