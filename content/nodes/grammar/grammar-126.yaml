# The three Akkusativ prepositions that are new here, as movements.
diagrams:
  - caption:
      en: >
        Three *Akkusativ* prepositions as pictures: *durch* goes through
        something, *um* goes around it, and *gegen* runs into it.
      fa: >
        سه حرف اضافه با حالت *Akkusativ* در تصویر: *durch* از میان چیزی
        می‌گذرد، *um* دور آن می‌چرخد و *gegen* به آن می‌خورد.
      de: >
        Drei Präpositionen mit Akkusativ als Bild: *durch* geht durch etwas
        hindurch, *um* geht im Kreis darum herum, *gegen* stößt daran.
    svg: |
      <svg viewBox="0 0 320 136">
        <!-- durch: the arrow is drawn over the box, so it goes through -->
        <rect class="surface" x="35" y="30" width="40" height="60"/>
        <line class="line" x1="10" y1="60" x2="90" y2="60"/>
        <polygon class="object" points="90,53 102,60 90,67"/>
        <text class="label" x="55" y="124" text-anchor="middle">durch</text>
        <!-- um: an arc around the circle, ending upwards on the left -->
        <circle class="surface" cx="160" cy="60" r="22"/>
        <path class="line" d="M 160 26 A 34 34 0 1 1 126 60"/>
        <polygon class="object" points="120,64 126,52 132,64"/>
        <text class="label" x="160" y="124" text-anchor="middle">um</text>
        <!-- gegen: the arrow stops at a wall -->
        <rect class="surface" x="285" y="20" width="14" height="80"/>
        <line class="line" x1="220" y1="60" x2="272" y2="60"/>
        <polygon class="object" points="272,53 285,60 272,67"/>
        <text class="label" x="262" y="124" text-anchor="middle">gegen</text>
      </svg>

