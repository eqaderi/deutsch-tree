diagrams:
  - caption:
      en: >
        *Das ist der Tisch, den ich kaufe.* The pronoun *den* has the gender
        of *Tisch*. It is in the *Akkusativ* because, as a sentence of its
        own, the relative clause is *Ich kaufe den Tisch.*
      fa: >
        *Das ist der Tisch, den ich kaufe.* ضمیر *den* با *Tisch* هم‌جنس
        است. حالت آن *Akkusativ* است، زیرا جملهٔ موصولی به‌تنهایی چنین
        می‌شود: *Ich kaufe den Tisch.*
      de: >
        *Das ist der Tisch, den ich kaufe.* Das Pronomen *den* passt zu
        *Tisch*. Es steht im Akkusativ, denn der Relativsatz allein heißt:
        *Ich kaufe den Tisch.*
