# Grammar list row 178.
id: grammar-178
kind: grammar
level: A2
chapter: a2-relative-clauses
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-062, grammar-177]
title:
  en: "Relative clause, *Akkusativ*"
  fa: "جملهٔ موصولی در حالت *Akkusativ*"
  de: "Relativsatz im Akkusativ"

explanations:
  en:
    rule: >
      When the relative pronoun is the direct object of the relative clause,
      it is in the *Akkusativ*: *Der Tisch, den wir gekauft haben, war
      kaputt.* As with the article, only the masculine changes: *der* becomes
      *den*. *Die*, *das* and plural *die* stay the same. The gender and
      number come from the noun; the case comes from the pronoun's job in the
      relative clause, never from the main clause. To find the case, say the
      relative clause as a sentence of its own: *Wir haben den Tisch
      gekauft.* *Den Tisch* is the object, so the pronoun is *den*. The
      relative clause then has a subject of its own (*wir*), which usually
      comes right after the pronoun, and its verb fits that subject and goes
      to the end: *der Mann, den ich kenne*, but *der Mann, der mich kennt*.
  fa:
    rule: >
      اگر ضمیر موصولی مفعول مستقیم جملهٔ موصولی باشد، در حالت *Akkusativ*
      (حالت مفعولی) می‌آید: *Der Tisch, den wir gekauft haben, war kaputt.*
      مانند حرف تعریف، فقط مذکر تغییر می‌کند و *der* به *den* تبدیل
      می‌شود؛ *die*، *das* و *die* جمع همان می‌مانند. جنس و شمار ضمیر از
      اسم می‌آید، ولی حالت آن را نقشش در جملهٔ موصولی تعیین می‌کند، نه
      جملهٔ پایه. برای یافتن حالت، جملهٔ موصولی را جمله‌ای مستقل فرض کنید:
      *Wir haben den Tisch gekauft.* در این جمله *den Tisch* مفعول است، پس
      ضمیر موصولی *den* است. در چنین جمله‌ای فاعل دیگری هم هست (*wir*) که
      معمولاً درست پس از ضمیر موصولی می‌آید. فعل با همین فاعل صرف می‌شود و
      به پایان جمله می‌رود. این دو را با هم مقایسه کنید: *der Mann, den ich
      kenne* (مردی که من می‌شناسم) و *der Mann, der mich kennt* (مردی که مرا
      می‌شناسد).
  de:
    rule: >
      Ist das Relativpronomen im Relativsatz das Objekt, steht es im
      Akkusativ: *Der Tisch, den wir gekauft haben, war kaputt.* Wie beim
      Artikel ändert sich nur das Maskulinum: *der* wird zu *den*. *Die*,
      *das* und *die* im Plural bleiben gleich. Das Genus kommt vom Nomen,
      der Kasus vom Relativsatz, nicht vom Hauptsatz. So finden Sie den
      Kasus: Sagen Sie den Relativsatz als eigenen Satz: *Wir haben den Tisch
      gekauft.* *Den Tisch* ist Akkusativ, also *den*. Der Relativsatz hat
      dann ein eigenes Subjekt (*wir*). Es steht meistens direkt nach dem
      Relativpronomen. Das Verb passt zu diesem Subjekt und steht am Ende:
      *der Mann, den ich kenne*, aber *der Mann, der mich kennt*.

