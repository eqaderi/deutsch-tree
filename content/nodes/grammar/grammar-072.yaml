# Grammar list row 72.
id: grammar-072
kind: grammar
level: B1
chapter: b1-genitive-nouns
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-062, grammar-071]
title:
  en: "*n-Deklination*"
  fa: "صرف اسم با *-n* (*n-Deklination*)"
  de: "n-Deklination"

explanations:
  en:
    rule: >
      Some masculine nouns take *-n* or *-en* in every form except the
      *Nominativ* singular: in the *Akkusativ*, the *Dativ* and the *Genitiv*
      (*den Kollegen*, *dem Kollegen*, *des Kollegen*), and in the whole
      plural. This is the *n-Deklination*. It has most masculine nouns in
      *-e* that name people or animals (*der Kollege*, *der Kunde*, *der
      Junge*), masculine nouns in *-ant*, *-ent*, *-ist* and *-at* (*der
      Praktikant*, *der Student*, *der Polizist*, *der Soldat*), and a few
      others: *der Herr*, *der Mensch*, *der Nachbar*. *Herr* is *Herrn* in
      the singular and *Herren* in the plural. *Der Name* takes *-ns* in the
      *Genitiv* (*des Namens*), and the neuter *das Herz* is *das Herz*,
      *dem Herzen*, *des Herzens*. Other nouns do not change in the singular
      *Akkusativ* and *Dativ*: *den Lehrer*, *dem Lehrer*.
  fa:
    rule: >
      برخی اسم‌های مذکر در همهٔ شکل‌ها، جز حالت *Nominativ* (حالت فاعلی)
      مفرد، پایانهٔ *-n* یا *-en* می‌گیرند: در حالت *Akkusativ* (حالت مفعولی)،
      حالت *Dativ* (حالت مفعول باواسطه) و حالت *Genitiv* (حالت ملکی)، مانند
      *den Kollegen*، *dem Kollegen* و *des Kollegen*، و نیز در همهٔ شکل‌های
      جمع. به این صرف اسم با *-n* (*n-Deklination*) می‌گویند. بیشتر اسم‌های
      مذکری که به *-e* ختم می‌شوند و نام انسان یا جانورند در این گروه‌اند
      (*der Kollege*، *der Kunde*، *der Junge*)، همچنین اسم‌های مذکری که به
      *-ant*، *-ent*، *-ist* و *-at* ختم می‌شوند (*der Praktikant*، *der
      Student*، *der Polizist*، *der Soldat*)، و چند اسم دیگر: *der Herr*،
      *der Mensch* و *der Nachbar*. *Herr* در مفرد *Herrn* می‌شود و در جمع
      *Herren*. *der Name* در حالت *Genitiv* پایانهٔ *-ns* می‌گیرد (*des
      Namens*) و اسم خنثی *das Herz* این شکل‌ها را دارد: *das Herz*، *dem
      Herzen* و *des Herzens*. اسم‌های دیگر در حالت *Akkusativ* و *Dativ*
      مفرد تغییری نمی‌کنند: *den Lehrer* و *dem Lehrer*.
  de:
    rule: >
      Einige maskuline Nomen bekommen *-n* oder *-en*, aber nicht im
      Nominativ Singular: im Akkusativ, im Dativ und im Genitiv (*den
      Kollegen*, *dem Kollegen*, *des Kollegen*) und im ganzen Plural. Das ist
      die n-Deklination. Dazu gehören viele maskuline Nomen auf *-e* für
      Menschen oder Tiere (*der Kollege*, *der Kunde*, *der Junge*), maskuline
      Nomen auf *-ant*, *-ent*, *-ist* und *-at* (*der Praktikant*, *der
      Student*, *der Polizist*, *der Soldat*) und einige andere: *der Herr*,
      *der Mensch*, *der Nachbar*. *Herr* ist im Singular *Herrn*, im Plural
      *Herren*. *Der Name* hat im Genitiv *-ns* (*des Namens*). *Das Herz* ist
      neutral: *das Herz*, *dem Herzen*, *des Herzens*. Andere Nomen ändern
      sich im Akkusativ und Dativ Singular nicht: *den Lehrer*, *dem Lehrer*.

