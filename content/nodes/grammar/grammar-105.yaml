      fa: "*lieber* مانند *gern* درست پس از فعل آمده است. جمله درست است."
      de: "*Lieber* steht wie *gern* direkt nach dem Verb. Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Nein, danke. Ich trinke ___ (gern, Komparativ) Wasser.
    answers: [lieber]
    explanation:
      en: "The *Komparativ* of *gern* is *lieber*."
      fa: "صفت تفضیلی *gern* می‌شود *lieber*."
      de: "Der Komparativ von *gern* ist *lieber*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Wer kocht ___ (gut, Komparativ), du oder ich?
    answers: [besser]
    explanation:
      en: "The *Komparativ* of *gut* is *besser*."
      fa: "صفت تفضیلی *gut* می‌شود *besser*."
      de: "Der Komparativ von *gut* ist *besser*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Ich möchte ___ (viel, Komparativ) Freizeit.
    answers: [mehr]
    explanation:
      en: "The *Komparativ* of *viel* is *mehr*, without an ending."
      fa: "صفت تفضیلی *viel* می‌شود *mehr*، بدون پایانه."
      de: "Der Komparativ von *viel* ist *mehr*, ohne Endung."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Was machst du am ___ (gern)?
    answers: [liebsten]
    explanation:
      en: "After *am* the form of *gern* is *liebsten*: *am liebsten*."
      fa: "پس از *am* صورت *gern* می‌شود *liebsten*: *am liebsten*."
      de: "Nach *am* heißt die Form von *gern* *liebsten*: *am liebsten*."
  - id: error-1
    type: find-error
    prompt: Ich esse gerner Reis.
    answer: gerner
    explanation:
      en: '*Gerner* does not exist. "Like more" is *lieber*.'
      fa: "*gerner* در آلمانی وجود ندارد. «بیشتر دوست داشتن» می‌شود *lieber*."
      de: "*Gerner* gibt es nicht. Man sagt *lieber*."
  - id: error-2
    type: find-error
    prompt: Ich spiele am liebste Fußball.
    answer: liebste
    explanation:
      en: "After *am* the form ends in *-en*: *am liebsten*."
      fa: "پس از *am* واژه به *-en* ختم می‌شود: *am liebsten*."
      de: "Nach *am* endet das Wort auf *-en*: *am liebsten*."
  - id: order-1
    type: word-order
    answers:
      - [was, trinkst, du, am liebsten]
    end: "?"
    explanation:
      en: "The question word first, then the verb and the subject; *am liebsten* follows them."
      fa: "اول واژهٔ پرسشی، بعد فعل و فاعل؛ *am liebsten* پس از آن‌ها می‌آید."
      de: "Zuerst das Fragewort, dann das Verb und das Subjekt. *Am liebsten* kommt danach."
  - id: order-2
    type: word-order
    answers:
      - [am liebsten, esse, ich, Pizza]
      - [ich, esse, am liebsten, Pizza]
      - [Pizza, esse, ich, am liebsten]
      - [ich, esse, Pizza, am liebsten]
    explanation:
      en: "The verb is in position 2. Before it can stand *am liebsten*, the subject or *Pizza*; after it, *Pizza* and *am liebsten* in either order."
      fa: "فعل در جایگاه دوم است. پیش از آن *am liebsten*، فاعل یا *Pizza* می‌تواند بیاید و پس از آن *Pizza* و *am liebsten* به هر ترتیبی."
      de: "Das Verb steht auf Position 2. Davor kann *am liebsten*, das Subjekt oder *Pizza* stehen."
  - id: match-1
    type: matching
    answer:
      - [gern, lieber]
      - [gut, besser]
      - [viel, mehr]
    explanation:
      en: "The three irregular forms: *gern – lieber*, *gut – besser*, *viel – mehr*."
      fa: "سه صورت بی‌قاعده: *gern – lieber*، *gut – besser*، *viel – mehr*."
      de: "Die drei besonderen Formen: *gern – lieber*, *gut – besser*, *viel – mehr*."

