    - [Sie, fährt, morgen, nicht, nach Hause.]
    - [Ich, warte, –, nicht, auf dich.]
    - [Das Essen, ist, heute, nicht, gut.]
    - [Er, fährt, –, nicht, schnell.]

# Two sentences with the same words. The bracket shows how much nicht
# negates: the whole sentence, or only das Buch. The slot of nicht is tinted.
diagrams:
  - caption:
      en: >
        How much *nicht* negates. At the end, before *gekauft*, it negates the
        whole sentence: I did not buy the book. Directly before *das Buch*, it
        negates only that part: I bought something, but something else.
      fa: >
        واژهٔ *nicht* چه اندازه از جمله را منفی می‌کند؟ در پایان جمله، پیش از
        *gekauft*، کل جمله را منفی می‌کند: کتاب را نخریده‌ام. درست پیش از
        *das Buch* فقط همان بخش را منفی می‌کند: چیزی خریده‌ام، اما چیز دیگری.
      de: >
        Was *nicht* verneint. Am Ende, vor *gekauft*, verneint es den ganzen
        Satz: Ich habe das Buch nicht gekauft. Direkt vor *das Buch* verneint
        es nur diesen Teil: Ich habe etwas gekauft, aber etwas anderes.
    labels:
      whole: { en: the whole sentence is negated, fa: کل جمله منفی است, de: der ganze Satz ist verneint }
      part: { en: only this part is negated, fa: فقط این بخش منفی است, de: nur dieser Teil ist verneint }
