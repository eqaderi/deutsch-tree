# Grammar list row 156.
id: grammar-156
kind: grammar
level: B1
chapter: b1-connectors-negation
order: 5
status: published
recogniseOnly: false
prerequisites: [grammar-146, grammar-154]
title:
  en: "Position of *nicht* in detail"
  fa: "جایگاه *nicht* با جزئیات"
  de: "Die Position von *nicht* im Detail"

explanations:
  en:
    rule: >
      *Nicht* can negate the whole sentence or only one part of it. To negate
      the whole sentence, *nicht* stands as late as it can: after the verb in
      position 2, after pronouns and objects with *der*, *die*, *das* or
      *mein* (*Ich kenne ihn nicht.*), and after a time such as *heute* or
      *morgen*. But it comes before the parts that belong closely to the
      verb: the second part of the verb at the end (*Ich habe den Film nicht
      gesehen.* *Der Zug fährt heute nicht ab.*), a place or a direction
      (*nicht nach Hause*), an adjective or a noun after *sein*, an object
      with a preposition (*Ich warte nicht auf dich.*) and a word that says
      how (*nicht schnell*). To negate only one part, *nicht* stands directly
      before that part, and *sondern* often gives the right one: *Das sind
      nicht die Äpfel von Klara, sondern von Paul.* *Nicht ich habe das
      gesagt, sondern Tom.*
  fa:
    rule: >
      *nicht* می‌تواند کل جمله را منفی کند یا فقط یک بخش آن را. برای نفی کل
      جمله، *nicht* تا جای ممکن دیرتر می‌آید: پس از فعلِ جایگاه دوم، پس از
      ضمیرها و پس از مفعولی که با *der*، *die*، *das* یا *mein* می‌آید
      (*Ich kenne ihn nicht.*)، و پس از قید زمانی مانند *heute* یا *morgen*.
      اما *nicht* پیش از بخش‌هایی می‌آید که پیوند نزدیکی با فعل دارند: بخش
      دوم فعل در پایان جمله (*Ich habe den Film nicht gesehen.* و *Der Zug
      fährt heute nicht ab.*)، مکان یا مقصد (*nicht nach Hause*)، صفت یا
      اسمِ پس از *sein*، مفعولی که با حرف اضافه می‌آید (*Ich warte nicht auf
      dich.*) و قیدی که چگونگی را می‌گوید (*nicht schnell*). برای نفی فقط یک
      بخش، *nicht* درست پیش از همان بخش می‌آید و اغلب *sondern* بخش درست را
      می‌آورد: *Das sind nicht die Äpfel von Klara, sondern von Paul.* و
      *Nicht ich habe das gesagt, sondern Tom.*
  de:
    rule: >
      Mit *nicht* verneint man den ganzen Satz oder nur einen Teil. Für den
      ganzen Satz steht *nicht* möglichst spät: nach dem Verb auf Position 2,
      nach Pronomen und nach einem Objekt mit *der*, *die*, *das* oder *mein*
      (*Ich kenne ihn nicht.*), und nach einer Zeit wie *heute* oder *morgen*.
      Aber *nicht* steht vor den Teilen, die eng zum Verb gehören: vor dem
      zweiten Teil vom Verb am Ende (*Ich habe den Film nicht gesehen.* *Der
      Zug fährt heute nicht ab.*), vor einem Ort oder einer Richtung (*nicht
      nach Hause*), vor einem Adjektiv oder Nomen nach *sein*, vor einem
      Objekt mit Präposition (*Ich warte nicht auf dich.*) und vor einem Wort,
      das sagt, wie (*nicht schnell*). Für nur einen Teil steht *nicht* direkt
      vor diesem Teil. Oft nennt *sondern* dann das Richtige: *Das sind nicht
      die Äpfel von Klara, sondern von Paul.* *Nicht ich habe das gesagt,
      sondern Tom.*

