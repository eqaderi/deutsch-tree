# Grammar list row 24. The list says: recognise it, produce it with nachdem.
# The conjunction nachdem itself and its tense rule with the Präsens are row
# 168; here it only frames the Plusquamperfekt.
id: grammar-024
kind: grammar
level: B1
chapter: b1-tenses
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-020, grammar-023]
title:
  en: "*Plusquamperfekt*"
  fa: "گذشتهٔ بعید (*Plusquamperfekt*)"
  de: "Plusquamperfekt"

explanations:
  en:
    rule: >
      The *Plusquamperfekt* tells what had already happened before another
      moment in the past. It is the *Präteritum* of *haben* or *sein* with
      the *Partizip II* at the end: *ich hatte gegessen*, *wir waren
      gegangen*. A verb that takes *haben* in the *Perfekt* takes *hatte*
      here, and one that takes *sein* takes *war*: *ich habe gegessen*, so
      *ich hatte gegessen*; *ich bin gegangen*, so *ich war gegangen*. The
      later action is usually in the *Präteritum* or the *Perfekt*: *Als ich
      ankam, war der Zug schon abgefahren.* You meet it most often after
      *nachdem*: *Nachdem wir gegessen hatten, gingen wir nach Hause.* In a
      subordinate clause the form of *hatte* or *war* goes to the very end.
  fa:
    rule: >
      گذشتهٔ بعید (*Plusquamperfekt*) کاری را نشان می‌دهد که پیش از لحظه‌ای
      دیگر در گذشته انجام شده بود. این زمان از گذشتهٔ ساده (*Präteritum*)
      *haben* یا *sein* و صفت مفعولی (*Partizip II*) در پایان جمله ساخته
      می‌شود: *ich hatte gegessen*، *wir waren gegangen*. فعلی که در گذشتهٔ
      نقلی (*Perfekt*) با *haben* می‌آید، در این زمان با *hatte* می‌آید و فعلی
      که با *sein* می‌آید، با *war*: *ich habe gegessen*، پس *ich hatte
      gegessen*؛ *ich bin gegangen*، پس *ich war gegangen*. کار بعدی معمولاً
      در گذشتهٔ ساده یا گذشتهٔ نقلی است: *Als ich ankam, war der Zug schon
      abgefahren.* این زمان را بیش از همه پس از *nachdem* می‌بینید: *Nachdem
      wir gegessen hatten, gingen wir nach Hause.* در جملهٔ پیرو، *hatte* یا
      *war* به پایان جمله می‌رود.
  de:
    rule: >
      Das Plusquamperfekt sagt, was vor einem anderen Moment in der
      Vergangenheit schon passiert war. Man bildet es mit dem Präteritum von
      *haben* oder *sein* und dem Partizip II am Ende: *ich hatte gegessen*,
      *wir waren gegangen*. Ein Verb mit *haben* im Perfekt hat hier
      *hatte*, ein Verb mit *sein* hat *war*: *ich habe gegessen*, also *ich
      hatte gegessen*; *ich bin gegangen*, also *ich war gegangen*. Die
      spätere Handlung steht meistens im Präteritum oder im Perfekt: *Als ich
      ankam, war der Zug schon abgefahren.* Sehr oft steht das
      Plusquamperfekt nach *nachdem*: *Nachdem wir gegessen hatten, gingen
      wir nach Hause.* Im Nebensatz steht *hatte* oder *war* ganz am Ende.

# Two time lines, one for each sentence of the caption. The earlier action
# (Plusquamperfekt) and the later one (Präteritum) both lie before now.
diagrams:
  - caption:
      en: >
        *Nachdem wir gegessen hatten, gingen wir nach Hause.* and *Als ich
        ankam, war der Zug schon abgefahren.* On the time line the
        *Plusquamperfekt* is the earlier of two past actions and the
        *Präteritum* the later one. Both lie before now.
      fa: >
        *Nachdem wir gegessen hatten, gingen wir nach Hause.* و *Als ich
        ankam, war der Zug schon abgefahren.* روی خط زمان، گذشتهٔ بعید
        (*Plusquamperfekt*) کار زودتر از دو کار گذشته است و گذشتهٔ ساده
        (*Präteritum*) کار بعدی. هر دو پیش از اکنون‌اند.
      de: >
        *Nachdem wir gegessen hatten, gingen wir nach Hause.* und *Als ich
        ankam, war der Zug schon abgefahren.* Auf der Zeitlinie ist das
        Plusquamperfekt die frühere von zwei Handlungen, das Präteritum die
        spätere. Beide sind vor jetzt.
    labels:
      first: { en: first, fa: اول, de: zuerst }
      then: { en: then, fa: سپس, de: danach }
      now: { en: now, fa: اکنون, de: jetzt }
