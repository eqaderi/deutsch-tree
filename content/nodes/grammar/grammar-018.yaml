      fa: "بن بدون دو نقطه + *-te*: *konnte*، *musste*، *durfte*، *wollte*، *sollte*."
      de: "Stamm ohne Umlaut + *-te*: *konnte*, *musste*, *durfte*, *wollte*, *sollte*."

