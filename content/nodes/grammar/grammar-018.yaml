      en: "*Mein Sohn* is *er*, which has the same form as *ich*: *sollte*."
      fa: "*mein Sohn* سوم‌شخص مفرد است (*er*) و صورت فعلش مانند *ich* است: *sollte*."
      de: "*Mein Sohn* ist *er*. Die Form ist wie bei *ich*: *sollte*."
  - id: typed-1
    type: typed-answer
    prompt: "Präteritum: ich kann"
    answers: [ich konnte, konnte]
    explanation:
      en: "*Können* loses its umlaut: *ich konnte*."
      fa: "*können* دو نقطهٔ خود را از دست می‌دهد: *ich konnte*."
      de: "*Können* hat im Präteritum keinen Umlaut: *ich konnte*."
  - id: typed-2
