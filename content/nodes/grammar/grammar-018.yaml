# Grammar list row 18.
id: grammar-018
kind: grammar
level: A2
chapter: a2-past
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-013, grammar-026]
title:
  en: "*Präteritum* of modal verbs"
  fa: "گذشتهٔ ساده (*Präteritum*) فعل‌های وجهی"
  de: "Präteritum der Modalverben"

explanations:
  en:
    rule: >
      For the past of a modal verb German uses the *Präteritum*, in speech as
      well as in writing: *Ich konnte gestern nicht kommen.* The form is the
      stem without its umlaut + *-te*: *können*, *konnte*; *müssen*,
      *musste*; *dürfen*, *durfte*; *wollen*, *wollte*; *sollen*, *sollte*.
      *Ich* and *er* / *sie* / *es* have the same form with no further ending,
      as with *war*; the other persons add the endings you know (*du
      konntest*, *wir konnten*, *ihr konntet*). As in the present, the modal
      verb stands in position 2 and the infinitive at the end. *Möchten* has
      no *Präteritum* of its own: for a wish in the past, say *wollte*: *Ich
      wollte einen Kaffee.*
  fa:
    rule: >
      در آلمانی برای گذشتهٔ فعل‌های وجهی، هم در گفتار و هم در نوشتار، گذشتهٔ
      ساده (*Präteritum*) به کار می‌رود: *Ich konnte gestern nicht kommen.*
      این صورت از بن فعل بدون دو نقطه (*Umlaut*) + *-te* ساخته می‌شود: *können*،
      *konnte*؛ *müssen*، *musste*؛ *dürfen*، *durfte*؛ *wollen*، *wollte*؛
      *sollen*، *sollte*. صورت اول‌شخص مفرد (*ich*) و سوم‌شخص مفرد (*er/sie/es*)
      یکی است و مانند *war* شناسهٔ دیگری نمی‌گیرد. شخص‌های دیگر شناسه‌های
      آشنا را می‌گیرند (*du konntest*، *wir konnten*، *ihr konntet*). مانند
      زمان حال، فعل وجهی در جایگاه دوم و مصدر در پایان جمله می‌آید. *möchten*
      گذشتهٔ سادهٔ جداگانه ندارد؛ برای خواستن در گذشته *wollte* به کار
      می‌رود: *Ich wollte einen Kaffee.*
  de:
    rule: >
      Für die Vergangenheit der Modalverben benutzt man das Präteritum, beim
      Sprechen und beim Schreiben: *Ich konnte gestern nicht kommen.* Die Form
      ist der Stamm ohne Umlaut + *-te*: *können*, *konnte*; *müssen*,
      *musste*; *dürfen*, *durfte*; *wollen*, *wollte*; *sollen*, *sollte*.
      Bei *ich* und *er/sie/es* ist die Form gleich und hat keine Endung, wie
      bei *war*. Die anderen Personen haben die bekannten Endungen: *du
      konntest*, *wir konnten*, *ihr konntet*. Das Modalverb steht auf
      Position 2, der Infinitiv am Ende. *Möchten* hat kein Präteritum. Man
      sagt *wollte*: *Ich wollte einen Kaffee.*

table:
  columns:
    - { en: Infinitive, fa: مصدر, de: Infinitiv }
