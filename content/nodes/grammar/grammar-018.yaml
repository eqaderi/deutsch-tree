    type: multiple-choice
    prompt: Ihr ___ um acht Uhr am Bahnhof sein.
    options: [solltet, solltest, sollten]
    answer: solltet
    explanation:
      en: "With *ihr* the ending is *-t*: *solltet*."
      fa: "با *ihr* شناسهٔ فعل *-t* است: *solltet*."
      de: "Bei *ihr* ist die Endung *-t*: *solltet*."
  - id: choice-2
    type: multiple-choice
    prompt: Gestern ___ ich leider nicht zum Kurs kommen.
    options: [konnte, kann, können]
    answer: konnte
    explanation:
      en: "*Gestern* asks for the past: *konnte*."
      fa: "*gestern* گذشته را می‌خواهد: *konnte*."
      de: "*Gestern* ist Vergangenheit: *konnte*."
  - id: choice-3
    type: multiple-choice
    prompt: Früher ___ ich Pilot werden.
    options: [wollte, möchtete, mochtete]
    answer: wollte
    explanation:
      en: "*Möchten* has no *Präteritum*; for a wish in the past, say *wollte*."
      fa: "*möchten* گذشتهٔ ساده ندارد؛ برای خواستن در گذشته *wollte* به کار می‌رود."
      de: "*Möchten* hat kein Präteritum. Man sagt *wollte*."
  - id: choice-4
    type: multiple-choice
    prompt: Er ___ gestern zum Arzt gehen.
    options: [musste, muss, müssen]
    answer: musste
    explanation:
      en: "*Gestern* asks for the past, and *er* has the form *musste*, without umlaut."
      fa: "*gestern* گذشته را می‌خواهد و صورت فعل با *er* *musste* است، بدون دو نقطه."
      de: "*Gestern* ist Vergangenheit, und bei *er* heißt es *musste*, ohne Umlaut."
  - id: true-1
    type: true-false
    prompt: Wir konnten das Spiel nicht gewinnen.
    answer: true
    explanation:
      en: "*Wir konnten* in position 2, the infinitive *gewinnen* at the end. The sentence is correct."
      fa: "*wir konnten* در جایگاه دوم و مصدر *gewinnen* در پایان جمله. جمله درست است."
      de: "*Konnten* auf Position 2, der Infinitiv *gewinnen* am Ende. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Ich wollte dich gestern anrufen.
    answer: true
    explanation:
      en: "*Ich wollte* with the infinitive *anrufen* at the end. The sentence is correct."
      fa: "*ich wollte* با مصدر *anrufen* در پایان جمله. جمله درست است."
      de: "*Ich wollte* und der Infinitiv *anrufen* am Ende. Der Satz ist richtig."
  - id: true-3
    type: true-false
    prompt: Ich möchtete gestern ins Kino gehen.
    answer: false
    explanation:
      en: "*Möchten* has no *Präteritum*: *Ich wollte gestern ins Kino gehen.*"
      fa: "*möchten* گذشتهٔ ساده ندارد: *Ich wollte gestern ins Kino gehen.*"
      de: "*Möchten* hat kein Präteritum: *Ich wollte gestern ins Kino gehen.*"
  - id: true-4
    type: true-false
    prompt: Gestern ich konnte nicht schlafen.
    answer: false
    explanation:
      en: "The modal verb stays in position 2: *Gestern konnte ich nicht schlafen.*"
      fa: "فعل وجهی در جایگاه دوم می‌ماند: *Gestern konnte ich nicht schlafen.*"
      de: "Das Modalverb steht auf Position 2: *Gestern konnte ich nicht schlafen.*"
  - id: error-1
    type: find-error
    prompt: Ihr musstet gestern lange gewartet.
    answer: gewartet
    explanation:
      en: "After a modal verb comes the infinitive: *Ihr musstet gestern lange warten.*"
      fa: "پس از فعل وجهی مصدر می‌آید: *Ihr musstet gestern lange warten.*"
      de: "Nach dem Modalverb steht der Infinitiv: *Ihr musstet gestern lange warten.*"
  - id: error-2
    type: find-error
    prompt: Wir konntet den Bus nicht finden.
    answer: konntet
    explanation:
      en: "With *wir* the form is *konnten*: *Wir konnten den Bus nicht finden.*"
      fa: "با *wir* صورت فعل *konnten* است: *Wir konnten den Bus nicht finden.*"
      de: "Bei *wir* heißt es *konnten*: *Wir konnten den Bus nicht finden.*"
  - id: error-3
    type: find-error
    prompt: Er wollt gestern nicht mitkommen.
    answer: wollt
    explanation:
      en: "The *Präteritum* has *-te*: *Er wollte gestern nicht mitkommen.*"
      fa: "گذشتهٔ ساده *-te* دارد: *Er wollte gestern nicht mitkommen.*"
      de: "Das Präteritum hat *-te*: *Er wollte gestern nicht mitkommen.*"
  - id: error-4
    type: find-error
    prompt: Du solltet mich gestern anrufen.
    answer: solltet
    explanation:
      en: "With *du* the ending is *-st*: *Du solltest mich gestern anrufen.*"
      fa: "با *du* شناسهٔ فعل *-st* است: *Du solltest mich gestern anrufen.*"
      de: "Bei *du* ist die Endung *-st*: *Du solltest mich gestern anrufen.*"
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Ich ___ gestern lange arbeiten (müssen).
    answers: [musste]
    explanation:
      en: "*Müssen* loses its umlaut in the *Präteritum*: *ich musste*."
      fa: "*müssen* در گذشتهٔ ساده دو نقطهٔ خود را از دست می‌دهد: *ich musste*."
      de: "*Müssen* hat im Präteritum keinen Umlaut: *ich musste*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Gestern ___ wir den Film nicht sehen (dürfen).
    answers: [durften]
    explanation:
      en: "*Dürfen* loses its umlaut, and *wir* adds *-n*: *durften*."
      fa: "*dürfen* دو نقطهٔ خود را از دست می‌دهد و *wir* *-n* می‌گیرد: *durften*."
      de: "*Dürfen* hat keinen Umlaut, und bei *wir* kommt *-n* dazu: *durften*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: ___ du gestern nicht kommen (können)?
    answers: [Konntest]
    explanation:
      en: "With *du*: *konntest*, without umlaut."
      fa: "با *du*: *konntest*، بدون دو نقطه."
      de: "Bei *du*: *konntest*, ohne Umlaut."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Letztes Jahr ___ ihr nach Spanien fahren (wollen).
    answers: [wolltet]
    explanation:
      en: "With *ihr* the ending is *-t*: *wolltet*."
      fa: "با *ihr* شناسهٔ فعل *-t* است: *wolltet*."
      de: "Bei *ihr* ist die Endung *-t*: *wolltet*."
  - id: typed-gap-5
    type: typed-gap-fill
    prompt: Mein Sohn ___ früher jeden Tag Klavier üben (sollen).
    answers: [sollte]
