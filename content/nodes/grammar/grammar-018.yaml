examples:
  - de: Ich konnte gestern nicht kommen.
    en: I couldn't come yesterday.
    fa: دیروز نتوانستم بیایم.
  - de: Früher musste ich jeden Tag mit dem Bus fahren.
    en: I used to have to take the bus every day.
    fa: قبلاً مجبور بودم هر روز با اتوبوس بروم.
  - de: Wir wollten ins Kino gehen, aber es war schon zu spät.
    en: We wanted to go to the cinema, but it was already too late.
    fa: می‌خواستیم به سینما برویم، اما دیگر دیر شده بود.
  - de: Durftest du als Kind lange fernsehen?
    en: Were you allowed to watch TV for long as a child?
    fa: در کودکی اجازه داشتی مدت زیادی تلویزیون تماشا کنی؟
  - de: Wir sollten um acht Uhr da sein, aber der Zug hatte Verspätung.
    en: We were supposed to be there at eight, but the train was late.
    fa: قرار بود ساعت هشت آن‌جا باشیم، اما قطار تأخیر داشت.
  - de: Ihr musstet lange warten, oder?
    en: You (plural) had to wait a long time, didn't you?
    fa: شما (جمع) مجبور شدید مدت زیادی منتظر بمانید، نه؟
  - de: Ich wollte einen Kaffee, aber die Maschine war kaputt.
    en: I wanted a coffee, but the machine was broken.
    fa: یک قهوه می‌خواستم، اما دستگاه خراب بود.
  - de: Leider konnten wir nicht lange bleiben.
    en: Unfortunately we couldn't stay long.
    fa: متأسفانه نتوانستیم زیاد بمانیم.

mistakes:
  - wrong: Ich könnte gestern nicht kommen.
    right: Ich konnte gestern nicht kommen.
    why:
      en: "The *Präteritum* of a modal verb has no umlaut: *konnte*."
      fa: "گذشتهٔ سادهٔ فعل وجهی دو نقطه ندارد: *konnte*."
      de: "Das Präteritum der Modalverben hat keinen Umlaut: *konnte*."
  - wrong: Gestern ich musste lange arbeiten.
    right: Gestern musste ich lange arbeiten.
    why:
      en: "The modal verb stays in position 2: after *gestern* comes *musste*, then the subject."
      fa: "فعل وجهی در جایگاه دوم می‌ماند: پس از *gestern*، *musste* و سپس فاعل می‌آید."
      de: "Das Modalverb steht auf Position 2: nach *gestern* kommt *musste*, dann das Subjekt."
  - wrong: Ich möchtete ein Eis.
    right: Ich wollte ein Eis.
    why:
      en: "*Möchten* has no *Präteritum*. For a wish in the past, say *wollte*."
      fa: "*möchten* گذشتهٔ ساده ندارد. برای خواستن در گذشته *wollte* به کار می‌رود."
      de: "*Möchten* hat kein Präteritum. Man sagt *wollte*."
  - wrong: Wir mussten gestern lange gewartet.
    right: Wir mussten gestern lange warten.
    why:
      en: "After a modal verb the second verb is an infinitive: *warten*, not a *Partizip II*."
      fa: "پس از فعل وجهی، فعل دوم مصدر است: *warten*، نه صفت مفعولی."
      de: "Nach dem Modalverb steht der Infinitiv: *warten*, nicht das Partizip II."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Ich ___ gestern nicht kommen.
    options: [konnte, konntest, konnten]
    answer: konnte
    explanation:
      en: "With *ich* the form is *konnte*, with no further ending."
      fa: "با *ich* صورت فعل *konnte* است، بدون شناسهٔ دیگر."
      de: "Bei *ich* heißt es *konnte*, ohne weitere Endung."
  - id: gap-2
    type: gap-fill
    prompt: Wir ___ am Samstag arbeiten.
    options: [mussten, musstet, musste]
    answer: mussten
    explanation:
      en: "With *wir* the form is *mussten*, with *-n*."
      fa: "با *wir* صورت فعل *mussten* است، با *-n*."
      de: "Bei *wir* heißt es *mussten*, mit *-n*."
  - id: gap-3
    type: gap-fill
    prompt: ___ du als Kind lange aufbleiben?
    options: [Durftest, Durfte, Durften]
    answer: Durftest
    explanation:
      en: "With *du* the ending is *-st*: *durftest*."
      fa: "با *du* شناسهٔ فعل *-st* است: *durftest*."
      de: "Bei *du* ist die Endung *-st*: *durftest*."
  - id: gap-4
    type: gap-fill
    prompt: Meine Schwester ___ schon immer Ärztin werden.
    options: [wollte, wolltest, wollten]
    answer: wollte
    explanation:
      en: "*Meine Schwester* is *sie* (singular), which has the same form as *ich*: *wollte*."
      fa: "*meine Schwester* سوم‌شخص مفرد است (*sie*) و صورت فعلش مانند *ich* است: *wollte*."
      de: "*Meine Schwester* ist *sie* (Singular). Die Form ist wie bei *ich*: *wollte*."
