    - { en: "*du*", fa: "*du*", de: "*du*" }
    - { en: "*wir* / *sie* / *Sie*", fa: "*wir* / *sie* / *Sie*", de: "*wir* / *sie* / *Sie*" }
    - { en: "*ihr*", fa: "*ihr*", de: "*ihr*" }
  rows:
    - [können, konnte, konntest, konnten, konntet]
    - [müssen, musste, musstest, mussten, musstet]
