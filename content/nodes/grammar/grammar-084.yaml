# Grammar list row 84.
id: grammar-084
kind: grammar
level: A1
chapter: a1-pronouns
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-081]
title:
  en: "*man*"
  fa: "*man*"
  de: "*man*"

explanations:
  en:
    rule: >
      *Man* means people in general, or anyone; English says "you", "one" or
      "they": *Kann man hier Fahrkarten kaufen?* (Can you buy tickets here?)
      *Man* is the subject, and the verb takes the *er*/*sie*/*es* form: *man
      spricht*, *man kann*, *man isst*. Use it for what is usual, possible or
      allowed: *Hier darf man nicht rauchen.* *Man* is written with one *n* and
      a small letter; *der Mann* (the man) has two.
  fa:
    rule: >
      *man* یعنی «مردم به طور کلی» یا «هر کسی». فارسی در این معنا اغلب فعل را
      سوم‌شخص جمع می‌آورد یا از «می‌شود» کمک می‌گیرد: «این‌جا بلیت
      می‌فروشند»، «این‌جا می‌شود بلیت خرید». در آلمانی *man* فاعل جمله است و
      فعل شکل سوم‌شخص مفرد را می‌گیرد، مانند *er*، *sie* و *es*: *man
      spricht*، *man kann*، *man isst*. با *man* از کار معمول، ممکن یا مجاز
      سخن می‌گوییم: *Kann man hier Fahrkarten kaufen?* (این‌جا می‌شود بلیت
      خرید؟) و *Hier darf man nicht rauchen.* (این‌جا سیگار کشیدن ممنوع است.)
      *man* با یک *n* و با حرف کوچک نوشته می‌شود؛ *der Mann* (مرد) دو *n* دارد.
  de:
    rule: >
      *Man* heißt: alle Leute, jede Person. *Man* ist das Subjekt, und das
      Verb hat die Form von *er*, *sie* und *es*: *man spricht*, *man kann*,
      *man isst*. Mit *man* sagt man, was normal, möglich oder erlaubt ist:
      *Kann man hier Fahrkarten kaufen?* *Man* schreibt man klein und mit
      einem *n*. *Der Mann* hat zwei *n*.

table:
  columns:
    - { en: Infinitive, fa: مصدر, de: Infinitiv }
    - { en: "With *man*", fa: "با *man*", de: "Mit *man*" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [sprechen, man spricht, In Österreich spricht man Deutsch.]
    - [kaufen, man kauft, Wo kauft man Fahrkarten?]
    - [essen, man isst, In Italien isst man viel Pasta.]
    - [sagen, man sagt, Wie sagt man das auf Deutsch?]
    - [können, man kann, Kann man hier parken?]
    - [dürfen, man darf, Hier darf man nicht rauchen.]
    - [müssen, man muss, Im Zug muss man eine Fahrkarte haben.]

examples:
  - de: Kann man hier Fahrkarten kaufen?
    en: Can you buy tickets here?
    fa: این‌جا می‌شود بلیت خرید؟
  - de: Wie schreibt man das?
    en: How do you spell that?
    fa: این را چطور می‌نویسند؟
  - de: Hier darf man nicht rauchen.
    en: You are not allowed to smoke here.
    fa: این‌جا سیگار کشیدن ممنوع است.
  - de: In Österreich spricht man Deutsch.
    en: In Austria people speak German.
    fa: در اتریش آلمانی حرف می‌زنند.
  - de: Von hier sieht man den Bahnhof.
    en: You can see the station from here.
    fa: از این‌جا ایستگاه قطار دیده می‌شود.
  - de: Am Sonntag arbeitet man in Deutschland meistens nicht.
    en: In Germany people mostly don't work on Sundays.
    fa: در آلمان یکشنبه‌ها معمولاً کسی کار نمی‌کند.
  - de: Im Bus muss man eine Fahrkarte haben.
    en: On the bus you must have a ticket.
    fa: در اتوبوس باید بلیت داشت.

mistakes:
  - wrong: Hier können man nicht parken.
    right: Hier kann man nicht parken.
    why:
      en: "*Man* takes the *er*/*sie*/*es* form of the verb: *man kann*."
      fa: "فعلِ *man* شکل سوم‌شخص مفرد را می‌گیرد: *man kann*."
      de: "Bei *man* hat das Verb die Form von *er*, *sie*, *es*: *man kann*."
  - wrong: Wie schreiben man das?
    right: Wie schreibt man das?
    why:
      en: "*Man* is one subject, not several: *man schreibt*, like *er schreibt*."
      fa: "*man* سوم‌شخص مفرد است، نه جمع: *man schreibt*، مانند *er schreibt*."
      de: "*Man* ist wie *er*: *man schreibt*, nicht *man schreiben*."
  - wrong: Hier spricht Mann Deutsch.
    right: Hier spricht man Deutsch.
    why:
      en: "“People” is *man*, with one *n* and a small letter. *Mann* means “man”."
      fa: "«مردم» در این‌جا *man* است، با یک *n* و حرف کوچک. *Mann* یعنی «مرد»."
      de: "*Man* (alle Leute) schreibt man klein und mit einem *n*. *Mann* ist eine Person."

