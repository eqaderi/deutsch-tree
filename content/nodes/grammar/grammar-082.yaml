      en: "*Der Film* is the object, so *er* becomes *ihn*."
      fa: "*der Film* مفعول است، پس *er* به *ihn* تبدیل می‌شود."
      de: "*Der Film* ist das Objekt. *Er* wird zu *ihn*."
