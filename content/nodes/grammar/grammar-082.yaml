    explanation:
      en: "*Sie* (she) stays *sie* in the *Akkusativ*."
      fa: "*sie* (او، زن) در حالت *Akkusativ* هم *sie* است."
      de: "*Sie* (eine Frau) bleibt im Akkusativ *sie*."
  - id: typed-1
