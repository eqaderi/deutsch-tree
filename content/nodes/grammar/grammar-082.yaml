    answer: du
    explanation:
      en: "As the object of *lieben*, *du* becomes *dich*."
      fa: "*du* در نقش مفعولِ *lieben* به *dich* تبدیل می‌شود."
      de: "Als Objekt von *lieben* wird *du* zu *dich*."
  - id: match-1
