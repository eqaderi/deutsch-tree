title:
  en: "*Personalpronomen*, *Akkusativ*"
  fa: "ضمیرهای شخصی در حالت *Akkusativ*"
  de: "Personalpronomen im Akkusativ"

explanations:
  en:
    rule: >
      When a personal pronoun is the object of the verb, it takes its
      *Akkusativ* form: *mich*, *dich*, *ihn*, *sie*, *es*, *uns*, *euch*,
      *sie* and *Sie*. It answers *Wen?* (whom?) or *Was?* (what?), after verbs
      such as *sehen*, *besuchen*, *lieben*, *kennen*, *fragen* and *brauchen*.
      In the third person only the masculine changes, as with the article:
      *er* becomes *ihn*, just as *der* becomes *den*. *Sie*, *es* and polite
      *Sie* stay the same; *ich*, *du*, *wir* and *ihr* have forms of their
      own. For a thing, the pronoun follows the gender of the noun: *Der Kuchen
      ist gut. Ich esse ihn.*
  fa:
    rule: >
      وقتی ضمیر شخصی مفعول فعل است، در حالت *Akkusativ* (حالت مفعولی) می‌آید:
      *mich*، *dich*، *ihn*، *sie*، *es*، *uns*، *euch*، *sie* و *Sie*. این
      ضمیرها به پرسش *Wen?* (چه کسی را؟) یا *Was?* (چه چیزی را؟) پاسخ می‌دهند و
      پس از فعل‌هایی مانند *sehen*، *besuchen*، *lieben*، *kennen*، *fragen* و
      *brauchen* می‌آیند. در سوم‌شخص، همانند حرف تعریف، فقط مذکر تغییر می‌کند:
      *er* به *ihn* تبدیل می‌شود، همان‌طور که *der* به *den*. *sie*، *es* و
      *Sie* رسمی تغییر نمی‌کنند، ولی *ich*، *du*، *wir* و *ihr* شکل ویژهٔ خود
      را دارند. در فارسی «مرا» و «او را» می‌گوییم؛ در آلمانی خود ضمیر شکلش را
      عوض می‌کند. ضمیرِ یک چیز از جنس اسم پیروی می‌کند: *Der Kuchen ist gut.
      Ich esse ihn.*
  de:
    rule: >
      Wenn ein Personalpronomen das Objekt ist, steht es im Akkusativ: *mich*,
      *dich*, *ihn*, *sie*, *es*, *uns*, *euch*, *sie*, *Sie*. Man fragt *Wen?*
      oder *Was?*. Bei *er* ist es wie beim Artikel: *er* wird zu *ihn*, so wie
      *der* zu *den* wird. *Sie*, *es* und *Sie* bleiben gleich. Bei Sachen
      kommt das Pronomen vom Artikel: *Der Kuchen ist gut. Ich esse ihn.*

# The article-change table of content/README.md: each pronoun from its
# Nominativ form, with the noun it stands for in the third person.
table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "*Akkusativ*", fa: "حالت *Akkusativ*", de: Akkusativ }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [ich, mich, Besuchst du mich?]
    - [du, dich, Ich liebe dich.]
    - [er (der Film), ihn (den Film), Ich sehe ihn heute.]
    - [sie (die Jacke), sie (die Jacke), Ich kaufe sie.]
    - [es (das Buch), es (das Buch), Ich lese es.]
    - [wir, uns, Besuchst du uns?]
    - [ihr, euch, Ich frage euch.]
    - ["sie (die Kinder, Plural)", sie (die Kinder), Ich suche sie.]
    - [Sie, Sie, Ich verstehe Sie nicht.]

examples:
  - de: Ich liebe dich.
    en: I love you.
    fa: دوستت دارم.
  - de: Kennst du ihn? – Ja, er ist mein Nachbar.
    en: Do you know him? – Yes, he is my neighbour.
    fa: او را می‌شناسی؟ – بله، همسایهٔ من است.
  - de: Der Kuchen ist lecker. Ich esse ihn gern.
    en: The cake is tasty. I like eating it.
    fa: کیک خوشمزه است. خوردنش را دوست دارم.
  - de: Wo ist meine Tasche? Ich brauche sie.
    en: Where is my bag? I need it.
    fa: کیفم کجاست؟ لازمش دارم.
  - de: Das Buch ist gut. Ich kaufe es.
    en: The book is good. I'll buy it.
    fa: کتاب خوبی است. آن را می‌خرم.
  - de: Besuchst du uns am Sonntag?
    en: Will you visit us on Sunday?
    fa: یکشنبه به دیدن ما می‌آیی؟
  - de: Kinder, ich höre euch nicht!
    en: Children, I can't hear you!
    fa: بچه‌ها، صدایتان را نمی‌شنوم!
  - de: Entschuldigung, ich verstehe Sie nicht.
    en: Excuse me, I don't understand you.
    fa: ببخشید، حرفتان را نمی‌فهمم.

mistakes:
  - wrong: Ich liebe du.
    right: Ich liebe dich.
    why:
      en: "*Du* is the subject form. As the object of *lieben* it is *dich*."
      fa: "*du* شکل فاعلی است. ضمیر در نقش مفعولِ *lieben* می‌شود *dich*."
      de: "*Du* ist das Subjekt. Als Objekt von *lieben* sagt man *dich*."
  - wrong: Der Film ist gut. Ich sehe er heute.
    right: Der Film ist gut. Ich sehe ihn heute.
    why:
      en: "The film is the object of *sehen*, so *er* becomes *ihn*."
      fa: "فیلم مفعولِ *sehen* است، پس *er* به *ihn* تبدیل می‌شود."
      de: "Der Film ist das Objekt von *sehen*. Darum wird *er* zu *ihn*."
  - wrong: Der Rock ist schön. Ich kaufe es.
    right: Der Rock ist schön. Ich kaufe ihn.
    why:
      en: "*Rock* is a *der* noun, so the object pronoun is *ihn*, also for a thing. Do not copy the English “it”."
      fa: "*Rock* اسم مذکر (*der*) است، پس ضمیر مفعولی‌اش *ihn* است، حتی برای یک چیز. «آن» فارسی را به *es* برنگردانید."
      de: "*Rock* hat den Artikel *der*. Das Pronomen im Akkusativ ist *ihn*, auch bei einer Sache."
  - wrong: Besuchst du wir morgen?
    right: Besuchst du uns morgen?
    why:
      en: "*Wir* is the subject form. As an object it is *uns*."
      fa: "*wir* شکل فاعلی است. ضمیر در نقش مفعول می‌شود *uns*."
      de: "*Wir* ist das Subjekt. Als Objekt sagt man *uns*."

