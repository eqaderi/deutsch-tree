    prompt: Die Jacke ist schön. Ich kaufe ___.
    options: [sie, ihn, es]
    answer: sie
    explanation:
      en: "*Die Jacke* becomes *sie*, and *sie* stays the same in the *Akkusativ*."
      fa: "به جای *die Jacke* ضمیر *sie* می‌آید و *sie* در حالت *Akkusativ* تغییر نمی‌کند."
      de: "*Die Jacke* wird zu *sie*. *Sie* bleibt im Akkusativ gleich."
  - id: gap-3
