    prompt: Die Äpfel sind gut. Ich nehme ___.
    options: [sie, ihn, es]
    answer: sie
    explanation:
      en: "*Die Äpfel* is plural, so the pronoun is *sie*, the same in the *Akkusativ*."
      fa: "*die Äpfel* جمع است، پس ضمیرش *sie* است که در حالت *Akkusativ* هم همین است."
      de: "*Die Äpfel* ist Plural. Das Pronomen ist *sie*, auch im Akkusativ."
  - id: gap-5
    type: gap-fill
    prompt: Wo bist du? Ich sehe ___ nicht.
    options: [dich, du, dir]
    answer: dich
    explanation:
      en: "*Du* is the object of *sehen*, so its *Akkusativ* form *dich*."
      fa: "*du* مفعولِ *sehen* است، پس شکل *Akkusativ* آن می‌آید: *dich*."
      de: "*Du* ist das Objekt von *sehen*. Im Akkusativ: *dich*."
  - id: choice-1
    type: multiple-choice
    prompt: Wir wohnen jetzt in Köln. Besuchst du ___?
    options: [uns, wir, euch]
    answer: uns
    explanation:
      en: "The object is *wir*, and the *Akkusativ* of *wir* is *uns*."
      fa: "مفعول *wir* است و شکل *Akkusativ* آن *uns* است."
      de: "Das Objekt ist *wir*. Im Akkusativ: *uns*."
  - id: choice-2
    type: multiple-choice
    prompt: Kinder, ich höre ___ nicht!
    options: [euch, ihr, dich]
    answer: euch
    explanation:
      en: "You speak to several children (*ihr*), and the *Akkusativ* of *ihr* is *euch*."
      fa: "با چند کودک حرف می‌زنید (*ihr*) و شکل *Akkusativ* آن *euch* است."
      de: "Man spricht mit mehreren Kindern (*ihr*). Im Akkusativ: *euch*."
  - id: choice-3
    type: multiple-choice
    prompt: Frau Lang, ich verstehe ___ nicht.
    options: [Sie, Ihnen, du]
    answer: Sie
    explanation:
      en: "Ms Lang is addressed with polite *Sie*, which stays *Sie* in the *Akkusativ*."
      fa: "خانم لانگ با *Sie* رسمی خطاب می‌شود و *Sie* در حالت *Akkusativ* هم *Sie* است."
      de: "Zu *Frau Lang* sagt man *Sie*. Im Akkusativ bleibt es *Sie*."
  - id: true-1
    type: true-false
    prompt: Mein Bruder ist nett. Ich besuche er oft.
    answer: false
    explanation:
      en: "The brother is the object of *besuchen*: *Ich besuche ihn oft.*"
      fa: "برادر مفعولِ *besuchen* است: *Ich besuche ihn oft.*"
      de: "Der Bruder ist das Objekt von *besuchen*: *Ich besuche ihn oft.*"
  - id: true-2
    type: true-false
    prompt: Wo ist mein Handy? Ich brauche es.
    answer: true
    explanation:
      en: "*Das Handy* becomes *es*, also in the *Akkusativ*. The sentence is correct."
      fa: "به جای *das Handy* ضمیر *es* می‌آید، در حالت *Akkusativ* هم. جمله درست است."
      de: "*Das Handy* wird zu *es*, auch im Akkusativ. Der Satz ist richtig."
  - id: true-3
    type: true-false
    prompt: Der Tee ist kalt. Ich trinke es nicht.
    answer: false
    explanation:
      en: "*Tee* is a *der* noun, so the object pronoun is *ihn*: *Ich trinke ihn nicht.*"
      fa: "*Tee* اسم مذکر (*der*) است، پس ضمیر مفعولی‌اش *ihn* است: *Ich trinke ihn nicht.*"
      de: "*Tee* hat den Artikel *der*. Im Akkusativ: *Ich trinke ihn nicht.*"
  - id: true-4
    type: true-false
    prompt: Tom, ich frage dich morgen.
    answer: true
    explanation:
      en: "Tom is the object of *fragen*, so *dich*. The sentence is correct."
      fa: "تام مفعولِ *fragen* است، پس *dich* می‌آید. جمله درست است."
      de: "Tom ist das Objekt von *fragen*: *dich*. Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Der Salat ist gut. Ich esse ___ (er).
    answers: [ihn]
    explanation:
      en: "In the *Akkusativ*, *er* becomes *ihn*."
      fa: "در حالت *Akkusativ*، *er* به *ihn* تبدیل می‌شود."
