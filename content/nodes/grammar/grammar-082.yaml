  - id: error-1
    type: find-error
    prompt: Die Uhr ist schön. Ich kaufe ihn.
    answer: ihn
    explanation:
      en: "*Uhr* is a *die* noun, so the pronoun is *sie*: *Ich kaufe sie.*"
      fa: "*Uhr* اسم مؤنث (*die*) است، پس ضمیرش *sie* است: *Ich kaufe sie.*"
      de: "*Uhr* hat den Artikel *die*. Das Pronomen ist *sie*: *Ich kaufe sie.*"
