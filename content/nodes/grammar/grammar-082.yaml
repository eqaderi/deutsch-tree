    prompt: Das Brot ist frisch. Ich esse ___.
    options: [es, ihn, sie]
    answer: es
    explanation:
      en: "*Das Brot* becomes *es*, and *es* stays the same in the *Akkusativ*."
      fa: "به جای *das Brot* ضمیر *es* می‌آید و *es* در حالت *Akkusativ* تغییر نمی‌کند."
      de: "*Das Brot* wird zu *es*. *Es* bleibt im Akkusativ gleich."
