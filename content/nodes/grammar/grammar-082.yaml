      fa: "در حالت *Akkusativ*، *du* به *dich* تبدیل می‌شود."
      de: "Im Akkusativ wird *du* zu *dich*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Das ist Frau Weber. Kennst du ___ (sie)?
