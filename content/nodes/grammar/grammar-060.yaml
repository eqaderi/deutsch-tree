# Grammar list row 60.
id: grammar-060
kind: grammar
level: A1
chapter: a1-nouns-articles
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-059]
title:
  en: "Plural formation"
  fa: "ساختن جمع"
  de: "Der Plural"

explanations:
  en:
    rule: >
      German has several plural endings: *-e*, *-er*, *-(e)n*, *-s* or none,
      and *a*, *o* and *u* often take an umlaut (*der Apfel – die Äpfel*). A
      few rules of thumb help. Most feminine nouns take *-(e)n*, and *-in*
      becomes *-innen*. Masculine and neuter nouns in *-er*, *-el*, *-en*,
      *-chen* and *-lein* take no ending. Nouns in *-a*, *-i* or *-o* and many
      words from English take *-s*. Foreign nouns in *-um* change it to *-en*:
      *das Zentrum – die Zentren*. The article in the plural is always *die*.
      Some nouns have no plural (*das Obst*) and some have only a plural (*die
      Eltern*), so learn each noun with its plural.
  fa:
    rule: >
      آلمانی چند پایانهٔ جمع دارد: *-e*، *-er*، *-(e)n*، *-s* یا بدون پایانه؛
      و *a*، *o* و *u* اغلب دو نقطه (*Umlaut*) می‌گیرند: *der Apfel – die
      Äpfel*. چند قاعدهٔ سرانگشتی کمک می‌کند. بیشتر اسم‌های مؤنث *-(e)n*
      می‌گیرند و *-in* به *-innen* تبدیل می‌شود. اسم‌های مذکر و خنثی که به
      *-er*، *-el*، *-en*، *-chen* و *-lein* ختم می‌شوند پایانه‌ای نمی‌گیرند.
      اسم‌هایی که به *-a*، *-i* یا *-o* ختم می‌شوند و بسیاری از واژه‌های
      انگلیسی *-s* می‌گیرند. در اسم‌های بیگانه‌ای که به *-um* ختم می‌شوند،
      *-um* به *-en* تبدیل می‌شود: *das Zentrum – die Zentren*. حرف تعریف جمع
      همیشه *die* است. برخی اسم‌ها جمع ندارند (*das Obst*) و برخی فقط جمع
      دارند (*die Eltern*)؛ پس هر اسم را همراه شکل جمعش یاد بگیرید.
  de:
    rule: >
      Es gibt verschiedene Endungen im Plural: *-e*, *-er*, *-(e)n*, *-s* oder
      keine Endung. Oft bekommen *a*, *o* und *u* einen Umlaut: *der Apfel –
      die Äpfel*. Feminine Nomen haben meistens *-(e)n*, aus *-in* wird
      *-innen*. Maskuline und neutrale Nomen auf *-er*, *-el*, *-en*, *-chen*
      und *-lein* haben keine Endung. Nomen auf *-a*, *-i*, *-o* und viele
      Wörter aus dem Englischen haben *-s*. Aus *-um* wird *-en*: *das Zentrum
      – die Zentren*. Der Artikel im Plural ist immer *die*. Manche Nomen
      haben keinen Plural (*das Obst*), manche nur einen Plural (*die
      Eltern*). Lernen Sie jedes Nomen mit dem Plural.

