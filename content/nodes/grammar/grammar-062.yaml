# Grammar list row 62.
id: grammar-062
kind: grammar
level: A1
chapter: a1-cases
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-061, grammar-076]
title:
  en: "*Akkusativ*"
  fa: "حالت مفعولی (*Akkusativ*)"
  de: "Akkusativ"

explanations:
  en:
    rule: >
      The *Akkusativ* is the case of the direct object: the person or thing
      that the action is done to, after verbs such as *haben*, *brauchen*,
      *kaufen*, *nehmen* and *sehen*. Ask *Was?* (what?) or *Wen?* (whom?).
      Only masculine nouns change: *der* becomes *den*, *ein* becomes *einen*
      and *kein* becomes *keinen*. Feminine, neuter and plural nouns keep their
      *Nominativ* form. *Es gibt* (there is) takes the *Akkusativ* too: *Es
      gibt einen Park.*
  fa:
    rule: >
      حالت *Akkusativ* (حالت مفعولی) حالت مفعول مستقیم است: کسی یا چیزی که
      کار بر آن انجام می‌شود، پس از فعل‌هایی مانند *haben*، *brauchen*،
      *kaufen*، *nehmen* و *sehen*. برای پیدا کردن آن می‌پرسیم *Was?* (چه
      چیزی را؟) یا *Wen?* (چه کسی را؟). در این حالت فقط اسم مذکر تغییر
      می‌کند: *der* به *den*، *ein* به *einen* و *kein* به *keinen* تبدیل
      می‌شود. اسم‌های مؤنث، خنثی و جمع همان شکل حالت *Nominativ* را دارند.
      در فارسی مفعول را اغلب با «را» می‌شناسیم؛ در آلمانی حرف تعریف این نقش
      را نشان می‌دهد. پس از *es gibt* (هست، وجود دارد) نیز حالت *Akkusativ*
      می‌آید: *Es gibt einen Park.*
  de:
    rule: >
      Der Akkusativ ist der Fall für das Objekt nach Verben wie *haben*,
      *brauchen*, *kaufen*, *nehmen* und *sehen*. Man fragt *Was?* oder
      *Wen?*. Nur maskuline Nomen ändern sich: *der* wird zu *den*, *ein* wird
      zu *einen*, *kein* wird zu *keinen*. Feminine und neutrale Nomen und der
      Plural bleiben wie im Nominativ. Auch nach *es gibt* steht der
      Akkusativ: *Es gibt einen Park.*

# The same two nouns in two orders: the article, not the place, shows who
# does what. German only, so no labels.
diagrams:
  - caption:
      en: >
        *Der Mann* is the subject (*Nominativ*) and *den Tisch* the object
        (*Akkusativ*), in either order. The article shows who does what, not
        the place in the sentence.
      fa: >
        *der Mann* فاعل است (حالت *Nominativ*) و *den Tisch* مفعول (حالت
        *Akkusativ*)، به هر ترتیبی که بیایند. نقش هر اسم را حرف تعریفش نشان
        می‌دهد، نه جایش در جمله.
      de: >
        *Der Mann* ist das Subjekt (Nominativ), *den Tisch* ist das Objekt
        (Akkusativ), in beiden Sätzen. Der Artikel zeigt, wer was macht, nicht
        die Position im Satz.
