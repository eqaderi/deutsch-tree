# Grammar list row 139.
id: grammar-139
kind: grammar
level: A1
chapter: a1-first-sentences
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-001]
title:
  en: "Statement, verb second"
  fa: "جملهٔ خبری: فعل در جایگاه دوم"
  de: "Aussagesatz: Verb auf Position 2"

explanations:
  en:
    rule: >
      In a German statement the conjugated verb always stands in position 2.
      Position 1 is usually the subject, and everything else comes after the
      verb. A position is one part of the sentence, not one word: *mein
      Bruder* or *Anna und Tom* fill position 1 together. Words such as
      *morgen*, *gern* or *heute* never push in between the subject and the
      verb, as they can in English ("I often go").
  fa:
    rule: >
      در جملهٔ خبری آلمانی، فعل صرف‌شده همیشه در جایگاه دوم می‌آید؛ نه در پایان
      جمله، آن‌گونه که در فارسی می‌آید. جایگاه اول معمولاً از آنِ فاعل است و
      بقیهٔ جمله پس از فعل می‌آید. هر جایگاه یک جزء جمله است، نه یک واژه:
      *mein Bruder* یا *Anna und Tom* با هم جایگاه اول را پر می‌کنند. واژه‌هایی
      مانند *morgen*، *gern* یا *heute* هیچ‌گاه میان فاعل و فعل نمی‌آیند.
  de:
    rule: >
      Im Aussagesatz steht das konjugierte Verb immer auf Position 2. Auf
      Position 1 steht meistens das Subjekt. Alles andere kommt nach dem Verb.
      Eine Position ist ein Satzteil, nicht ein Wort: *mein Bruder* oder *Anna
      und Tom* sind zusammen Position 1. Wörter wie *morgen*, *gern* oder
      *heute* stehen nie zwischen dem Subjekt und dem Verb.

table:
  columns:
    - { en: Position 1, fa: جایگاه اول, de: Position 1 }
    - { en: "Position 2: verb", fa: "جایگاه دوم: فعل", de: "Position 2: Verb" }
    - { en: The rest, fa: بقیهٔ جمله, de: Rest }
  rows:
    - [Ich, fahre, morgen nach Paris.]
    - [Mein Bruder, wohnt, in Wien.]
    - [Frau Schulz, ist, Lehrerin.]
    - [Anna und Tom, lernen, zusammen Deutsch.]
    - [Wir, trinken, jeden Morgen Tee.]

# The slots of a statement: position 2 is always the verb.
diagrams:
  - caption:
      en: >
        Three statements. Position 1 can be one word or several; position 2,
        shaded, is always the verb; the rest follows.
      fa: >
        سه جملهٔ خبری. جایگاه اول می‌تواند یک واژه یا چند واژه باشد؛ جایگاه دوم،
        که رنگی است، همیشه از آنِ فعل است و بقیهٔ جمله پس از آن می‌آید.
      de: >
        Drei Aussagesätze. Position 1 ist ein Wort oder mehrere Wörter.
        Position 2 (farbig) ist immer das Verb. Dann kommt der Rest.
