title:
  en: "*Satzklammer*"
  fa: "قاب جمله (*Satzklammer*)"
  de: "Satzklammer"

explanations:
  en:
    rule: >
      Many German sentences have a verb in two parts. The conjugated part
      stands in position 2, and the second part goes to the very end.
      Together they frame the rest of the sentence: this is the
      *Satzklammer* (sentence bracket). Three things make the frame: a modal
      verb and an infinitive (*Ich will meine Tante besuchen.*), *haben* or
      *sein* and a *Partizip II* in the *Perfekt* (*Ich habe gestern Tee
      gemacht.*), and a separable verb and its prefix (*Der Kurs fängt um 9
      Uhr an.*). Words that belong closely to the verb go to the end too: an
      adjective after *sein* (*Das Wetter ist heute sehr schön.*) and a noun
      that makes one idea with the verb (*Ich spiele am Samstag mit Freunden
      Karten.*). In a question the conjugated part moves, and the second part
      still stays at the end: *Kannst du mir heute helfen?*
  fa:
    rule: >
      در بسیاری از جمله‌های آلمانی فعل دو بخش دارد. بخش صرف‌شده در جایگاه دوم
      می‌آید و بخش دوم به پایان جمله می‌رود. این دو بخش بقیهٔ جمله را در میان
      می‌گیرند؛ به این قاب جمله (*Satzklammer*) می‌گویند. قاب جمله سه گونه
      است: فعل وجهی و مصدر (*Ich will meine Tante besuchen.*)، *haben* یا
      *sein* و صفت مفعولی (*Partizip II*) در گذشتهٔ نقلی (*Perfekt*) (*Ich
      habe gestern Tee gemacht.*)، و فعل جداشدنی و پیشوندش (*Der Kurs fängt
      um 9 Uhr an.*). واژه‌هایی که پیوند نزدیکی با فعل دارند نیز به پایان
      جمله می‌روند: صفت پس از *sein* (*Das Wetter ist heute sehr schön.*) و
      اسمی که با فعل یک معنا می‌سازد (*Ich spiele am Samstag mit Freunden
      Karten.*). در پرسش، بخش صرف‌شده جابه‌جا می‌شود، ولی بخش دوم باز هم در
      پایان جمله می‌ماند: *Kannst du mir heute helfen?* در فارسی هم فعل در
      پایان جمله است؛ در آلمانی فقط بخش دوم آن به پایان می‌رود.
  de:
    rule: >
      Oft hat das Verb zwei Teile. Der konjugierte Teil steht auf Position 2,
      der zweite Teil ganz am Ende. Die zwei Teile sind wie eine Klammer um
      den Rest: die Satzklammer. So ist es beim Modalverb mit Infinitiv (*Ich
      will meine Tante besuchen.*), beim Perfekt mit *haben* oder *sein* und
      dem Partizip II (*Ich habe gestern Tee gemacht.*) und beim trennbaren
      Verb mit dem Präfix (*Der Kurs fängt um 9 Uhr an.*). Auch ein Adjektiv
      nach *sein* (*Das Wetter ist heute sehr schön.*) und ein Nomen, das mit
      dem Verb zusammengehört (*Ich spiele am Samstag mit Freunden Karten.*),
      stehen am Ende. In der Frage steht der konjugierte Teil an einer anderen
      Stelle, der zweite Teil bleibt am Ende: *Kannst du mir heute helfen?*

table:
  columns:
    - { en: Position 1, fa: جایگاه اول, de: Position 1 }
    - { en: "Position 2: verb, part 1", fa: "جایگاه دوم: بخش اول فعل", de: "Position 2: Verb, Teil 1" }
    - { en: Middle, fa: میانهٔ جمله, de: Mitte }
    - { en: "End: verb, part 2", fa: "پایان جمله: بخش دوم فعل", de: "Ende: Verb, Teil 2" }
  rows:
    - [Ich, will, meine Tante, besuchen.]
    - [Wir, müssen, heute lange, arbeiten.]
    - [Ich, habe, gestern Tee, gemacht.]
    - [Sie, ist, am Wochenende nach Hamburg, gefahren.]
    - [Der Kurs, fängt, um 9 Uhr, an.]
    - [Ich, rufe, dich morgen, an.]
    - [Das Wetter, ist, heute sehr, schön.]
    - [Ich, spiele, am Samstag mit Freunden, Karten.]

# Three sentences as rows of slots: a modal verb, the Perfekt and a separable
# verb. The two verb parts are shaded; a bracket under each row joins them.
