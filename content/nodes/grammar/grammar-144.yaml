        *Ich will meine Tante besuchen.*, *Ich habe gestern Tee gemacht.* and
        *Er ruft dich morgen an.* In each sentence the two parts of the verb
        (shaded) stand in position 2 and at the very end, and frame the rest:
        the *Satzklammer*.
      fa: >
        *Ich will meine Tante besuchen.*، *Ich habe gestern Tee gemacht.* و
        *Er ruft dich morgen an.* در هر جمله دو بخش فعل (رنگی) در جایگاه دوم
        و در پایان جمله می‌آیند و بقیهٔ جمله را در میان می‌گیرند: قاب جمله
        (*Satzklammer*).
