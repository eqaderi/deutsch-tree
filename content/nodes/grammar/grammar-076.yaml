    - [die Lampe, eine Lampe, keine Lampe, Das ist keine Lampe.]
    - [das Buch, ein Buch, kein Buch, Das ist kein Buch.]
    - [die Tische (Plural), –, keine Tische, Das sind keine Tische.]

examples:
  - de: Er ist kein Lehrer.
    en: He is not a teacher.
    fa: او معلم نیست.
  - de: Das ist keine Katze, das ist ein Hund.
    en: That is not a cat, it is a dog.
    fa: این گربه نیست، سگ است.
  - de: Das ist kein Problem.
    en: That is no problem.
    fa: مشکلی نیست.
  - de: Das sind keine Äpfel, das sind Birnen.
    en: These are not apples, they are pears.
    fa: این‌ها سیب نیستند، گلابی‌اند.
  - de: Heute ist kein Unterricht.
    en: There are no classes today.
    fa: امروز کلاس نیست.
  - de: Im Kühlschrank ist keine Milch.
    en: There is no milk in the fridge.
    fa: در یخچال شیر نیست.
  - de: Sie ist keine Ärztin.
    en: She is not a doctor.
    fa: او پزشک نیست.
  - de: Hier ist kein Platz.
    en: There is no room here.
    fa: این‌جا جا نیست.

mistakes:
  - wrong: Das ist nicht ein Tisch.
    right: Das ist kein Tisch.
    why:
      en: "*Nicht* and *ein* together become *kein*."
      fa: "*nicht* و *ein* با هم *kein* می‌شوند."
      de: "*Nicht* und *ein* zusammen sind *kein*."
  - wrong: Das ist kein Lampe.
    right: Das ist keine Lampe.
    why:
      en: "*Lampe* is feminine, so *keine*, as in *eine Lampe*."
      fa: "*Lampe* اسم مؤنث است، پس *keine* می‌آید، مانند *eine Lampe*."
      de: "*Lampe* ist feminin. Darum *keine*, wie bei *eine Lampe*."
  - wrong: Das sind kein Äpfel.
    right: Das sind keine Äpfel.
    why:
      en: "In the plural it is always *keine*."
      fa: "در جمع همیشه *keine* می‌آید."
      de: "Im Plural heißt es immer *keine*."

