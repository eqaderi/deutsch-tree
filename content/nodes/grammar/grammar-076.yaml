title:
  en: "*Negativartikel* *kein*"
  fa: "حرف تعریف منفی *kein*"
  de: "Negativartikel *kein*"

explanations:
  en:
    rule: >
      *Kein* negates a noun that would have *ein* or no article: *Das ist ein
      Tisch. – Das ist kein Tisch.* *Er ist Lehrer. – Er ist kein Lehrer.* It
      has the endings of *ein*: *kein* for masculine and neuter nouns, *keine*
      for feminine ones. Unlike *ein*, it has a plural: *keine Äpfel*. The
      verb stays as it is; *kein* alone makes the sentence negative.
  fa:
    rule: >
      *kein* اسمی را منفی می‌کند که با *ein* یا بدون حرف تعریف می‌آید: *Das
      ist ein Tisch. – Das ist kein Tisch.* و *Er ist Lehrer. – Er ist kein
      Lehrer.* پایانه‌های آن مانند *ein* است: *kein* برای اسم‌های مذکر و خنثی
      و *keine* برای اسم‌های مؤنث. ولی برخلاف *ein*، شکل جمع هم دارد: *keine
      Äpfel*. در فارسی فعل را منفی می‌کنیم: «او معلم نیست». در آلمانی فعل
      مثبت می‌ماند و *kein* پیش از اسم، جمله را منفی می‌کند.
  de:
    rule: >
      *Kein* verneint ein Nomen mit *ein* oder ohne Artikel: *Das ist ein
      Tisch. – Das ist kein Tisch.* *Er ist Lehrer. – Er ist kein Lehrer.*
      *Kein* hat die Endungen von *ein*: *kein* bei maskulinen und neutralen
      Nomen, *keine* bei femininen Nomen. Anders als *ein* hat *kein* einen
      Plural: *keine Äpfel*.

table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "With *ein*", fa: "با *ein*", de: "Mit *ein*" }
    - { en: "With *kein*", fa: "با *kein*", de: "Mit *kein*" }
    - { en: Example, fa: مثال, de: Beispiel }
