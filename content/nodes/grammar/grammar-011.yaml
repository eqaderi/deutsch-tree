# Grammar list row 11.
id: grammar-011
kind: grammar
level: A1
chapter: a1-verb-patterns
order: 7
status: published
recogniseOnly: false
prerequisites: [grammar-139]
title:
  en: "Verb + *Infinitiv* without *zu* (*gehen*, *bleiben*)"
  fa: "فعل + مصدر بدون *zu* (*gehen*، *bleiben*)"
  de: "Verb + Infinitiv ohne *zu* (*gehen*, *bleiben*)"

explanations:
  en:
    rule: >
      *Gehen* and *bleiben* can take a second verb in the infinitive, without
      *zu*. The conjugated verb stands in position 2 and the infinitive goes
      to the end: *Wir gehen heute einkaufen.* With *gehen* you say what you
      go and do (*schwimmen gehen*, *essen gehen*, *spazieren gehen*); with
      *bleiben* that someone stays as they are (*sitzen bleiben*, *stehen
      bleiben*). The infinitive at the end has no ending and stays one word,
      also a separable verb: *einkaufen*.
  fa:
    rule: >
      *gehen* و *bleiben* می‌توانند فعل دومی را به شکل مصدر و بدون *zu* با
      خود بیاورند. فعل صرف‌شده در جایگاه دوم می‌آید و مصدر به پایان جمله
      می‌رود: *Wir gehen heute einkaufen.* با *gehen* می‌گوییم برای چه کاری
      می‌رویم (*schwimmen gehen*، *essen gehen*، *spazieren gehen*) و با
      *bleiben* می‌گوییم کسی یا چیزی در همان حال می‌ماند (*sitzen bleiben*،
      *stehen bleiben*). مصدرِ پایان جمله شناسه نمی‌گیرد و یک واژه می‌ماند،
      حتی اگر فعل جداشدنی باشد: *einkaufen*.
  de:
    rule: >
      Nach *gehen* und *bleiben* kann ein zweites Verb im Infinitiv stehen,
      ohne *zu*. Das konjugierte Verb steht auf Position 2, der Infinitiv am
      Ende: *Wir gehen heute einkaufen.* Mit *gehen* sagt man, was man
      machen geht (*schwimmen gehen*, *essen gehen*). Mit *bleiben* sagt man,
      dass jemand so bleibt (*sitzen bleiben*, *stehen bleiben*). Der
      Infinitiv bleibt ein Wort, auch *einkaufen*.

table:
  columns:
    - { en: Position 1, fa: جایگاه اول, de: Position 1 }
    - {
        en: "Position 2: *gehen* / *bleiben*",
        fa: "جایگاه دوم: *gehen* / *bleiben*",
        de: "Position 2: *gehen* / *bleiben*",
      }
    - { en: Middle, fa: میانهٔ جمله, de: Mitte }
    - { en: "End: infinitive", fa: "پایان جمله: مصدر", de: "Ende: Infinitiv" }
  rows:
    - [Wir, gehen, heute, einkaufen.]
    - [Ich, gehe, am Samstag, schwimmen.]
    - [Am Abend, gehen, wir, essen.]
    - [Mein Opa, geht, jeden Tag, spazieren.]
    - [Die Kinder, bleiben, noch, sitzen.]
    - [Der Bus, bleibt, an der Ampel, stehen.]

examples:
  - de: Wir gehen heute einkaufen.
    en: We're going shopping today.
    fa: ما امروز به خرید می‌رویم.
  - de: Ich gehe am Samstag schwimmen.
    en: I'm going swimming on Saturday.
    fa: من شنبه به شنا می‌روم.
  - de: Gehen wir heute Abend essen?
    en: Shall we go out to eat tonight?
    fa: امشب برای شام بیرون برویم؟
  - de: Mein Opa geht jeden Morgen spazieren.
    en: My grandpa goes for a walk every morning.
    fa: پدربزرگم هر صبح قدم می‌زند.
  - de: Bleiben Sie bitte sitzen!
    en: Please stay seated!
    fa: لطفاً از جایتان بلند نشوید!
  - de: Der Bus bleibt an der Ampel stehen.
    en: The bus stops at the traffic lights.
    fa: اتوبوس پشت چراغ راهنمایی می‌ایستد.
  - de: Geht ihr am Wochenende tanzen?
    en: Are you going dancing at the weekend?
    fa: آخر هفته برای رقصیدن بیرون می‌روید؟
  - de: Heute bleibe ich im Bett liegen.
    en: Today I'm staying in bed.
    fa: امروز در رختخواب می‌مانم.

mistakes:
  - wrong: Wir gehen heute zu einkaufen.
    right: Wir gehen heute einkaufen.
    why:
      en: "After *gehen* and *bleiben* the infinitive has no *zu*."
      fa: "پس از *gehen* و *bleiben* مصدر بدون *zu* می‌آید."
      de: "Nach *gehen* und *bleiben* steht der Infinitiv ohne *zu*."
  - wrong: Ich gehe heute Abend esse.
    right: Ich gehe heute Abend essen.
    why:
      en: "Only *gehen* is conjugated; the second verb stays in the infinitive."
      fa: "فقط *gehen* صرف می‌شود و فعل دوم به شکل مصدر می‌ماند."
      de: "Nur *gehen* ist konjugiert. Das zweite Verb bleibt im Infinitiv."
  - wrong: Wir gehen heute kaufen ein.
    right: Wir gehen heute einkaufen.
    why:
      en: "The infinitive at the end stays one word, also a separable verb."
      fa: "مصدرِ پایان جمله یک واژه می‌ماند، حتی اگر فعل جداشدنی باشد."
      de: "Der Infinitiv am Ende bleibt ein Wort, auch bei trennbaren Verben."
  - wrong: Ich schwimmen gehe am Samstag.
    right: Ich gehe am Samstag schwimmen.
    why:
      en: "The conjugated verb is in position 2 and the infinitive at the end."
      fa: "فعل صرف‌شده در جایگاه دوم می‌آید و مصدر در پایان جمله."
      de: "Das konjugierte Verb steht auf Position 2, der Infinitiv am Ende."

