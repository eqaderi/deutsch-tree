examples:
  - de: Das ist der Moment, auf den ich lange gewartet habe.
    en: That's the moment I've waited a long time for.
    fa: این همان لحظه‌ای است که مدت‌ها منتظرش بودم.
  - de: Die Freundin, mit der ich in Urlaub fahre, kommt aus Wien.
    en: The friend I'm going on holiday with is from Vienna.
    fa: دوستی که با او به تعطیلات می‌روم اهل وین است.
  - de: Das ist das Haus, in dem ich geboren bin.
    en: That's the house I was born in.
    fa: این همان خانه‌ای است که در آن به دنیا آمدم.
  - de: Die Kollegen, mit denen ich arbeite, sind sehr nett.
    en: The colleagues I work with are very nice.
    fa: همکارانی که با آن‌ها کار می‌کنم خیلی مهربان‌اند.
  - de: Der Kurs, für den ich mich angemeldet habe, beginnt im März.
    en: The course I signed up for starts in March.
    fa: دوره‌ای که برایش ثبت‌نام کرده‌ام در ماه مارس شروع می‌شود.
  - de: Gibt es ein Thema, über das du nicht gern sprichst?
    en: Is there a topic you don't like talking about?
    fa: موضوعی هست که دوست نداری درباره‌اش حرف بزنی؟
  - de: Der Urlaub, auf den wir uns so gefreut haben, war leider zu kurz.
    en: The holiday we were so looking forward to was too short, unfortunately.
    fa: تعطیلاتی که آن‌همه انتظارش را می‌کشیدیم، متأسفانه خیلی کوتاه بود.
  - de: Wie heißt der Mann, von dem du mir erzählt hast?
    en: What's the name of the man you told me about?
    fa: اسم مردی که درباره‌اش برایم تعریف کردی چیست؟
  - de: Das ist die Stadt, in die wir nächstes Jahr ziehen.
    en: That's the city we're moving to next year.
    fa: این همان شهری است که سال آینده به آن نقل مکان می‌کنیم.
  - de: Die Firma, bei der meine Schwester arbeitet, sucht neue Leute.
    en: The company my sister works for is looking for new people.
    fa: شرکتی که خواهرم در آن کار می‌کند، دنبال نیروی تازه است.

mistakes:
  - wrong: Das ist die Frau, die ich gestern mit gesprochen habe.
    right: Das ist die Frau, mit der ich gestern gesprochen habe.
    why:
      en: 'German never leaves the preposition at the end, as English does ("the woman I spoke with"). *Mit der* goes to the front together.'
      fa: "در آلمانی حرف اضافه، برخلاف انگلیسی، هرگز در پایان جمله نمی‌ماند. *mit der* با هم به آغاز جملهٔ موصولی می‌رود."
      de: "Die Präposition steht nie am Ende. *Mit der* steht zusammen am Anfang vom Relativsatz."
  - wrong: Das ist das Haus, im ich wohne.
    right: Das ist das Haus, in dem ich wohne.
    why:
      en: "A preposition and a relative pronoun are never shortened: *in dem*, not *im*."
      fa: "حرف اضافه و ضمیر موصولی هرگز کوتاه نمی‌شوند: *in dem*، نه *im*."
      de: "Präposition und Relativpronomen werden nie kurz: *in dem*, nicht *im*."
  - wrong: Die Kollegen, mit den ich arbeite, sind sehr nett.
    right: Die Kollegen, mit denen ich arbeite, sind sehr nett.
    why:
      en: "*Mit* takes the *Dativ*, and the plural *Dativ* relative pronoun is *denen*, not *den*."
      fa: "*mit* با حالت *Dativ* می‌آید و ضمیر موصولی جمع در این حالت *denen* است، نه *den*."
      de: "Nach *mit* steht der Dativ. Im Plural heißt das Relativpronomen *denen*, nicht *den*."
  - wrong: Der Termin, auf dem ich warte, ist um zehn Uhr.
    right: Der Termin, auf den ich warte, ist um zehn Uhr.
    why:
      en: "*Warten auf* takes the *Akkusativ* (*Ich warte auf den Termin*), so *auf den*."
      fa: "*warten auf* با حالت *Akkusativ* می‌آید (*Ich warte auf den Termin*)، پس *auf den*."
      de: "*Warten auf* hat den Akkusativ: *Ich warte auf den Termin.* Also *auf den*."
  - wrong: Das ist meine Nachbarin, mit die ich oft spazieren gehe.
    right: Das ist meine Nachbarin, mit der ich oft spazieren gehe.
    why:
      en: "*Mit* always takes the *Dativ*, and feminine *die* becomes *der*."
      fa: "*mit* همیشه با حالت *Dativ* می‌آید و *die* مؤنث به *der* تبدیل می‌شود."
      de: "Nach *mit* steht immer der Dativ: *die* wird zu *der*."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Das ist der Moment, auf ___ ich lange gewartet habe.
    options: [dem, der, den]
    answer: den
    explanation:
      en: "*Warten auf* takes the *Akkusativ* (*Ich habe auf den Moment gewartet*), so *auf den*."
      fa: "*warten auf* با حالت *Akkusativ* می‌آید (*Ich habe auf den Moment gewartet*)، پس *auf den*."
      de: "*Warten auf* hat den Akkusativ: *Ich habe auf den Moment gewartet.* Also *auf den*."
  - id: gap-2
    type: gap-fill
    prompt: Die Kollegen, mit ___ ich arbeite, sind sehr nett.
    options: [den, denen, die]
    answer: denen
    explanation:
      en: "*Mit* takes the *Dativ*; in the plural the relative pronoun is *denen*."
      fa: "*mit* با حالت *Dativ* می‌آید و ضمیر موصولی جمع در این حالت *denen* است."
      de: "Nach *mit* steht der Dativ. Im Plural heißt das Relativpronomen *denen*."
  - id: gap-3
    type: gap-fill
    prompt: Das ist das Haus, ___ ich seit zehn Jahren wohne.
    options: [im, in das, in dem]
    answer: in dem
    explanation:
      en: "*Wo?*, so *in* takes the *Dativ*: *in dem*. With a relative pronoun it is never shortened to *im*."
      fa: "پرسش *Wo?* است، پس *in* با حالت *Dativ* می‌آید: *in dem*. با ضمیر موصولی هرگز به *im* کوتاه نمی‌شود."
      de: "Frage *Wo?*, also Dativ: *in dem*. Mit Relativpronomen sagt man nie *im*."
  - id: gap-4
    type: gap-fill
    prompt: Die Freundin, ___ ich in Urlaub fahre, kommt aus Wien.
    options: [die mit, mit der, mit die]
    answer: mit der
    explanation:
      en: "The preposition comes first, and *mit* takes the *Dativ*: *mit der*."
      fa: "حرف اضافه اول می‌آید و *mit* با حالت *Dativ* می‌آید: *mit der*."
      de: "Die Präposition steht zuerst, nach *mit* steht der Dativ: *mit der*."
  - id: gap-5
    type: gap-fill
    prompt: Der Kurs, für ___ ich mich angemeldet habe, beginnt im März.
    options: [den, das, dem]
    answer: den
    explanation:
      en: "*Für* takes the *Akkusativ*, and *Kurs* is a *der* noun: *für den*."
      fa: "*für* با حالت *Akkusativ* می‌آید و *Kurs* اسم مذکر (*der*) است: *für den*."
      de: "Nach *für* steht der Akkusativ. *Kurs* hat den Artikel *der*: *für den*."
  - id: choice-1
    type: multiple-choice
    prompt: Wie heißt der Mann, …
    options: [von den du mir erzählt hast?, dem du mir von erzählt hast?, von dem du mir erzählt hast?]
    answer: von dem du mir erzählt hast?
    explanation:
      en: "The preposition comes first, and *von* takes the *Dativ*: *von dem*."
      fa: "حرف اضافه اول می‌آید و *von* با حالت *Dativ* می‌آید: *von dem*."
      de: "Die Präposition steht zuerst, nach *von* steht der Dativ: *von dem*."
  - id: choice-2
    type: multiple-choice
    prompt: Gibt es ein Thema, …
    options: [über das du nicht gern sprichst?, über dem du nicht gern sprichst?, das du nicht gern über sprichst?]
    answer: über das du nicht gern sprichst?
    explanation:
      en: "*Sprechen über* takes the *Akkusativ*, and *Thema* is a *das* noun: *über das*, at the front."
      fa: "*sprechen über* با حالت *Akkusativ* می‌آید و *Thema* اسم خنثی (*das*) است: *über das*، در آغاز جملهٔ موصولی."
      de: "*Sprechen über* hat den Akkusativ. *Thema* hat den Artikel *das*: *über das*, am Anfang."
  - id: choice-3
    type: multiple-choice
    prompt: Das ist die Stadt, …
    options: [in der wir nächstes Jahr ziehen., in dem wir nächstes Jahr ziehen., in die wir nächstes Jahr ziehen.]
    answer: in die wir nächstes Jahr ziehen.
    explanation:
      en: "Moving to a place answers *Wohin?*, so *in* takes the *Akkusativ*: *in die*."
      fa: "نقل مکان به جایی پاسخ *Wohin?* است، پس *in* با حالت *Akkusativ* می‌آید: *in die*."
      de: "Umziehen beantwortet die Frage *Wohin?*. Also Akkusativ: *in die*."
  - id: true-1
    type: true-false
    prompt: Die Firma, bei der meine Schwester arbeitet, sucht neue Leute.
    answer: true
    explanation:
      en: "*Bei* takes the *Dativ*, and *Firma* is a *die* noun: *bei der*. The sentence is correct."
      fa: "*bei* با حالت *Dativ* می‌آید و *Firma* اسم مؤنث (*die*) است: *bei der*. جمله درست است."
      de: "Nach *bei* steht der Dativ. *Firma* hat den Artikel *die*: *bei der*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Das ist der Lehrer, den ich gestern mit gesprochen habe.
    answer: false
    explanation:
      en: "The preposition goes to the front with the pronoun, and *mit* takes the *Dativ*: *mit dem ich gestern gesprochen habe*."
      fa: "حرف اضافه با ضمیر به آغاز جمله می‌رود و *mit* با حالت *Dativ* می‌آید: *mit dem ich gestern gesprochen habe*."
      de: "Die Präposition steht mit dem Pronomen am Anfang, nach *mit* steht der Dativ: *mit dem ich gestern gesprochen habe*."
  - id: true-3
    type: true-false
    prompt: Der Urlaub, auf den wir uns so gefreut haben, war zu kurz.
    answer: true
    explanation:
      en: "*Sich freuen auf* takes the *Akkusativ*: *auf den*. The sentence is correct."
      fa: "*sich freuen auf* با حالت *Akkusativ* می‌آید: *auf den*. جمله درست است."
      de: "*Sich freuen auf* hat den Akkusativ: *auf den*. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Das ist das Restaurant, im wir uns kennengelernt haben.
    answer: false
    explanation:
      en: "Preposition and relative pronoun are never shortened: *in dem wir uns kennengelernt haben*."
      fa: "حرف اضافه و ضمیر موصولی هرگز کوتاه نمی‌شوند: *in dem wir uns kennengelernt haben*."
      de: "Präposition und Relativpronomen werden nie kurz: *in dem wir uns kennengelernt haben*."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Die Kinder, mit ___ ich am Nachmittag spiele, sind meine Neffen.
    answers: [denen, welchen]
    explanation:
      en: "*Mit* takes the *Dativ*; in the plural the relative pronoun is *denen*."
      fa: "*mit* با حالت *Dativ* می‌آید و ضمیر موصولی جمع در این حالت *denen* است."
      de: "Nach *mit* steht der Dativ. Im Plural: *denen*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Das ist der Stuhl, auf ___ ich immer sitze.
    answers: [dem, welchem]
    explanation:
      en: "Sitting somewhere answers *Wo?*, so *auf* takes the *Dativ*: *auf dem*."
      fa: "نشستن در جایی پاسخ *Wo?* است، پس *auf* با حالت *Dativ* می‌آید: *auf dem*."
      de: "Sitzen beantwortet die Frage *Wo?*. Also Dativ: *auf dem*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Die Frau, von ___ ich das Fahrrad gekauft habe, wohnt in Bonn.
    answers: [der, welcher]
    explanation:
      en: "*Von* takes the *Dativ*, and *die* becomes *der*: *von der*."
      fa: "*von* با حالت *Dativ* می‌آید و *die* به *der* تبدیل می‌شود: *von der*."
      de: "Nach *von* steht der Dativ: *die* wird zu *der*, also *von der*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Das ist ein Problem, über ___ wir morgen sprechen müssen.
    answers: [das, welches]
    explanation:
      en: "*Sprechen über* takes the *Akkusativ*, and *Problem* is a *das* noun: *über das*."
      fa: "*sprechen über* با حالت *Akkusativ* می‌آید و *Problem* اسم خنثی (*das*) است: *über das*."
      de: "*Sprechen über* hat den Akkusativ. *Problem* hat den Artikel *das*: *über das*."
  - id: error-1
    type: find-error
    prompt: Die Freunde, mit den ich nach Italien fahre, kommen aus Köln.
    answer: den
    explanation:
      en: "*Mit* takes the *Dativ*; in the plural the relative pronoun is *denen*: *mit denen*."
      fa: "*mit* با حالت *Dativ* می‌آید و ضمیر موصولی جمع در این حالت *denen* است: *mit denen*."
      de: "Nach *mit* steht der Dativ. Im Plural: *mit denen*."
  - id: error-2
    type: find-error
    prompt: Der Brief, auf dem ich warte, ist noch nicht gekommen.
    answer: dem
    explanation:
      en: "*Warten auf* takes the *Akkusativ* (*Ich warte auf den Brief*): *auf den*."
      fa: "*warten auf* با حالت *Akkusativ* می‌آید (*Ich warte auf den Brief*): *auf den*."
      de: "*Warten auf* hat den Akkusativ: *Ich warte auf den Brief.* Richtig ist *auf den*."
  - id: error-3
    type: find-error
    prompt: Das ist meine Nachbarin, mit die ich oft spazieren gehe.
    answer: die
    explanation:
      en: "*Mit* always takes the *Dativ*, and feminine *die* becomes *der*: *mit der*."
      fa: "*mit* همیشه با حالت *Dativ* می‌آید و *die* مؤنث به *der* تبدیل می‌شود: *mit der*."
      de: "Nach *mit* steht immer der Dativ: *mit der*."
  - id: order-1
