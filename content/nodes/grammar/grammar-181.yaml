# Top: the main clause with its noun (shaded). Middle: the relative clause,
# preposition and pronoun together in one shaded slot under the noun.
# Bottom: the relative clause as a sentence of its own: the preposition
# stands before the noun there too, and gives the case.
diagrams:
  - caption:
      en: >
        *Das ist die Freundin, mit der ich reise.* *Mit der* goes to the front
        together. *Der* has the gender of *Freundin*, and *mit* gives the
        *Dativ*, as in the relative clause on its own: *Ich reise mit der
        Freundin.*
      fa: >
        حرف اضافه و ضمیر، یعنی *mit der*، با هم به آغاز جملهٔ موصولی
        می‌روند. *der* با *Freundin* هم‌جنس است و *mit* حالت *Dativ* را
        می‌خواهد، همان‌طور که در جملهٔ موصولی به‌تنهایی: *Ich reise mit der
        Freundin.* جملهٔ کامل: *Das ist die Freundin, mit der ich reise.*
      de: >
        *Das ist die Freundin, mit der ich reise.* *Mit der* steht zusammen
        am Anfang. *Der* passt zu *Freundin*, und nach *mit* steht der Dativ,
        wie im Relativsatz allein: *Ich reise mit der Freundin.*
    labels:
      main: { en: main clause, fa: جملهٔ پایه, de: Hauptsatz }
      relative: { en: relative clause, fa: جملهٔ موصولی, de: Relativsatz }
      same: { en: same gender, fa: هم‌جنس, de: gleiches Genus }
      alone: { en: "the relative clause on its own:", fa: جملهٔ موصولی به‌تنهایی, de: "der Relativsatz allein:" }
