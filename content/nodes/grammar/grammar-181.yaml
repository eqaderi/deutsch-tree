# Grammar list row 181.
id: grammar-181
kind: grammar
level: B1
chapter: b1-relative-clauses
order: 2
status: coming-soon
recogniseOnly: false
prerequisites: [grammar-126, grammar-180]
title:
  en: "Relative clause with preposition"
  fa: "جملهٔ موصولی با حرف اضافه"
  de: "Relativsatz mit Präposition"

explanations:
  en:
    rule: >
      When a preposition belongs to the relative pronoun, the two go
      together to the front of the relative clause, right after the comma:
      *Das ist der Moment, auf den ich gewartet habe.* The preposition never
      stays at the end, as it does in English ("the moment I waited for").
      The gender and number of the pronoun come from the noun; its case comes
      from the preposition: *mit*, *bei*, *von* and *zu* take the *Dativ*
      (*mit dem*, *mit der*, *mit denen* in the plural), *für* takes the
      *Akkusativ* (*für den*, *für die*, *für das*). With a verb that has its
      own preposition (*warten auf*, *sich freuen auf*, *sprechen über*), the
      verb decides: *auf den*, *über das*. A two-way preposition takes the
      *Dativ* for *Wo?* and the *Akkusativ* for *Wohin?*: *das Haus, in dem
      ich wohne*, *die Stadt, in die wir ziehen*. Preposition and pronoun are
      never shortened: *in dem*, never *im*. To find the form, say the
      relative clause as a sentence of its own: *Ich habe auf den Moment
      gewartet.*
  fa:
    rule: >
      اگر ضمیر موصولی با حرف اضافه بیاید، حرف اضافه و ضمیر با هم به آغاز
      جملهٔ موصولی می‌روند، درست پس از ویرگول: *Das ist der Moment, auf den
      ich gewartet habe.* حرف اضافه هرگز مانند انگلیسی در پایان جمله
      نمی‌ماند. جنس و شمار ضمیر از اسم می‌آید، ولی حالت آن را حرف اضافه
      تعیین می‌کند: *mit*، *bei*، *von* و *zu* با حالت *Dativ* (حالت مفعول
      باواسطه) می‌آیند (*mit dem*، *mit der* و برای جمع *mit denen*) و *für*
      با حالت *Akkusativ* (حالت مفعولی) (*für den*، *für die*، *für das*).
      اگر فعل حرف اضافهٔ خاص خود را داشته باشد (*warten auf*، *sich freuen
      auf*، *sprechen über*)، فعل تعیین می‌کند: *auf den*، *über das*. حرف
      اضافهٔ دوحالته برای *Wo?* با حالت *Dativ* و برای *Wohin?* با حالت
      *Akkusativ* می‌آید: *das Haus, in dem ich wohne* و *die Stadt, in die
      wir ziehen*. حرف اضافه و ضمیر هرگز کوتاه نمی‌شوند: *in dem*، نه *im*.
      برای یافتن شکل درست، جملهٔ موصولی را جمله‌ای مستقل فرض کنید: *Ich habe
      auf den Moment gewartet.*
  de:
    rule: >
      Gehört eine Präposition zum Relativpronomen, stehen beide zusammen am
      Anfang vom Relativsatz, direkt nach dem Komma: *Das ist der Moment, auf
      den ich gewartet habe.* Die Präposition steht nie am Ende. Das Genus
      kommt vom Nomen, der Kasus von der Präposition: Nach *mit*, *bei*,
      *von* und *zu* steht der Dativ (*mit dem*, *mit der*, im Plural *mit
      denen*), nach *für* der Akkusativ (*für den*, *für die*, *für das*). Hat
      das Verb eine feste Präposition (*warten auf*, *sich freuen auf*,
      *sprechen über*), bestimmt das Verb den Kasus: *auf den*, *über das*.
      Bei Wechselpräpositionen gilt: *Wo?* mit Dativ, *Wohin?* mit
      Akkusativ: *das Haus, in dem ich wohne*, *die Stadt, in die wir
      ziehen*. Präposition und Pronomen werden nie kurz: *in dem*, nie *im*.
      So finden Sie die Form: Sagen Sie den Relativsatz als eigenen Satz:
      *Ich habe auf den Moment gewartet.*

