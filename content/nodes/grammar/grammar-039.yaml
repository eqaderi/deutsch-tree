recogniseOnly: false
prerequisites: [grammar-035, grammar-036, grammar-037]
title:
  en: "*wäre*, *hätte*, *würde*, *könnte* as a paradigm"
  fa: "*wäre*، *hätte*، *würde* و *könnte*: همهٔ صیغه‌ها"
  de: "*wäre*, *hätte*, *würde*, *könnte*: alle Formen"

explanations:
  en:
    rule: >
      *Wäre*, *hätte*, *würde* and *könnte* are the *Konjunktiv II* of *sein*,
      *haben*, *werden* and *können*. Each is the past (*Präteritum*) with an
      umlaut: *war* → *wäre*, *hatte* → *hätte*, *wurde* → *würde*, *konnte* →
      *könnte*. All four take the same endings: *ich* and *er* / *sie* / *es*
      end in *-e*, *du* in *-st* (*du hättest*, *du würdest*, *du könntest*,
      *du wärst* or *wärest*), *wir* and *sie* / *Sie* in *-n*, *ihr* in *-t*
      (*ihr wärt* or *wäret*). They say what is wished or imagined, not what
      is real: a wish (*Ich wäre jetzt gern zu Hause.*), a suggestion (*Wir
      könnten morgen wandern.*), a polite question (*Würdest du mir helfen?*)
      or what you think of an idea (*Das wäre schön!*). The umlaut matters:
      without it, *war*, *hatte*, *wurde* and *konnte* are the past.
  fa:
    rule: >
      *wäre*، *hätte*، *würde* و *könnte* صورت *Konjunktiv II* (وجه شرطی)
      فعل‌های *sein*، *haben*، *werden* و *können* هستند. هر کدام همان گذشتهٔ
      ساده (*Präteritum*) است با دو نقطه (*Umlaut*): *wäre* از *war*، *hätte* از
      *hatte*، *würde* از *wurde* و *könnte* از *konnte*. هر چهار فعل شناسه‌های
      یکسانی دارند: *ich* و *er* / *sie* / *es* به *-e* ختم می‌شوند، *du* به
      *-st* (*du hättest*، *du würdest*، *du könntest*، *du wärst* یا
      *wärest*)، *wir* و *sie* / *Sie* به *-n* و *ihr* به *-t* (*ihr wärt* یا
      *wäret*). این صورت‌ها از آرزو یا تصور سخن می‌گویند، نه از واقعیت: آرزو
      (*Ich wäre jetzt gern zu Hause.*)، پیشنهاد (*Wir könnten morgen
      wandern.*)، پرسش مؤدبانه (*Würdest du mir helfen?*) یا نظر دربارهٔ یک
      فکر (*Das wäre schön!*). دو نقطه مهم است: بی آن، *war*، *hatte*، *wurde*
      و *konnte* گذشته‌اند.
  de:
    rule: >
      *Wäre*, *hätte*, *würde* und *könnte* sind der Konjunktiv II von *sein*,
      *haben*, *werden* und *können*. Man bildet sie aus dem Präteritum mit
      Umlaut: *war* → *wäre*, *hatte* → *hätte*, *wurde* → *würde*, *konnte*
      → *könnte*. Alle vier haben die gleichen Endungen: *ich* und *er* /
      *sie* / *es* enden auf *-e*, *du* auf *-st* (*du hättest*, *du würdest*,
      *du könntest*, *du wärst* oder *wärest*), *wir* und *sie* / *Sie* auf
      *-n*, *ihr* auf *-t* (*ihr wärt* oder *wäret*). Die Formen sagen, was
      man sich wünscht oder vorstellt, nicht was wirklich ist: einen Wunsch
      (*Ich wäre jetzt gern zu Hause.*), einen Vorschlag (*Wir könnten morgen
      wandern.*), eine höfliche Frage (*Würdest du mir helfen?*) oder eine
      Meinung zu einer Idee (*Das wäre schön!*). Der Umlaut ist wichtig: Ohne
      Umlaut sind *war*, *hatte*, *wurde* und *konnte* Präteritum.

