# Grammar list row 204.
id: grammar-204
kind: grammar
level: A2
chapter: a2-reflexive-prepositional
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-096, grammar-126]
title:
  en: "Verbs with fixed prepositions"
  fa: "فعل‌هایی با حرف اضافهٔ ثابت"
  de: "Verben mit festen Präpositionen"

explanations:
  en:
    rule: >
      Many verbs go with a fixed preposition: *warten auf* (to wait for),
      *sich interessieren für* (to be interested in), *träumen von* (to dream
      of). The preposition belongs to the verb and often differs from the
      English one, so learn the verb with its preposition and its case:
      *warten auf* + *Akkusativ*, *Ich warte auf den Bus.* The verb decides
      the case, also after a two-way preposition: *denken an* takes the
      *Akkusativ* (*an den Urlaub*), *teilnehmen an* the *Dativ* (*am Kurs*).
      With these verbs *auf* and *über* mostly take the *Akkusativ*, *vor*
      the *Dativ* (*Angst vor dem Hund*). After *mit*, *von*, *zu*, *bei* and
      *nach* it is always the *Dativ*, after *für* and *um* always the
      *Akkusativ*. One verb can take two prepositions with two meanings:
      *sich freuen auf* is for something still to come (to look forward to),
      *sich freuen über* for something that is here or has happened (to be
      glad about). To ask about a person, put the preposition before *wen*
      or *wem*: *Auf wen wartest du?* About a thing you ask with *wo(r)-*:
      *Worauf wartest du?*, the next topic.
  fa:
    rule: >
      بسیاری از فعل‌ها با حرف اضافهٔ ثابتی می‌آیند: *warten auf* (منتظر کسی
      یا چیزی بودن)، *sich interessieren für* (به چیزی علاقه داشتن)، *träumen
      von* (آرزوی چیزی را داشتن). این حرف اضافه جزئی از فعل است و اغلب با
      حرف اضافهٔ فارسی جور درنمی‌آید؛ پس فعل را همراه حرف اضافه و حالتش یاد
      بگیرید: *warten auf* با حالت *Akkusativ*، *Ich warte auf den Bus.* حالت
      را فعل تعیین می‌کند، حتی پس از حرف اضافهٔ دوحالته: *denken an* با حالت
      *Akkusativ* می‌آید (*an den Urlaub*) و *teilnehmen an* با حالت *Dativ*
      (*am Kurs*). در این فعل‌ها *auf* و *über* بیشتر با حالت *Akkusativ*
      می‌آیند و *vor* با حالت *Dativ* (*Angst vor dem Hund*). پس از *mit*،
      *von*، *zu*، *bei* و *nach* همیشه حالت *Dativ* می‌آید و پس از *für* و
      *um* همیشه حالت *Akkusativ*. یک فعل می‌تواند دو حرف اضافه با دو معنا
      داشته باشد: *sich freuen auf* برای چیزی است که هنوز در پیش است (مشتاق
      چیزی بودن) و *sich freuen über* برای چیزی که هست یا رخ داده است (از
      چیزی خوشحال بودن). برای پرسیدن دربارهٔ شخص، حرف اضافه پیش از *wen* یا
      *wem* می‌آید: *Auf wen wartest du?* دربارهٔ چیزها با *wo(r)-* می‌پرسیم:
      *Worauf wartest du?* که موضوع درس بعدی است.
  de:
    rule: >
      Viele Verben haben eine feste Präposition: *warten auf*, *sich
      interessieren für*, *träumen von*. Die Präposition gehört zum Verb.
      Lernen Sie das Verb darum mit Präposition und Kasus: *warten auf* +
      Akkusativ, *Ich warte auf den Bus.* Das Verb bestimmt den Kasus, auch
      bei Wechselpräpositionen: *denken an* + Akkusativ (*an den Urlaub*),
      aber *teilnehmen an* + Dativ (*am Kurs*). Bei diesen Verben haben *auf*
      und *über* meistens den Akkusativ, *vor* den Dativ (*Angst vor dem
      Hund*). Nach *mit*, *von*, *zu*, *bei* und *nach* steht immer der
      Dativ, nach *für* und *um* immer der Akkusativ. Ein Verb kann zwei
      Präpositionen mit zwei Bedeutungen haben: *sich freuen auf* für etwas,
      das noch kommt, *sich freuen über* für etwas, das schon da ist oder
      passiert ist. Fragen nach Personen: Präposition + *wen* oder *wem*:
      *Auf wen wartest du?* Fragen nach Sachen: mit *wo(r)-*, *Worauf wartest
      du?* Das kommt im nächsten Thema.

table:
  columns:
    - { en: Verb with preposition, fa: فعل و حرف اضافه, de: Verb mit Präposition }
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: After the preposition, fa: پس از حرف اضافه, de: Nach der Präposition }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [warten auf + Akkusativ, der Bus, auf den Bus, Ich warte auf den Bus.]
    - [sich freuen auf + Akkusativ, der Urlaub, auf den Urlaub, Wir freuen uns auf den Urlaub.]
    - [sich freuen über + Akkusativ, das Geschenk, über das Geschenk, Sie freut sich über das Geschenk.]
    - [sich interessieren für + Akkusativ, das Angebot, für das Angebot, Ich interessiere mich für das Angebot.]
    - [denken an + Akkusativ, die Kinder (Plural), an die Kinder, Sie denkt oft an die Kinder.]
    - [sich kümmern um + Akkusativ, die Katze, um die Katze, Wer kümmert sich um die Katze?]
    - [sich ärgern über + Akkusativ, der Fehler, über den Fehler, Er ärgert sich über den Fehler.]
    - [Angst haben vor + Dativ, der Hund, vor dem Hund, Das Kind hat Angst vor dem Hund.]
    - [teilnehmen an + Dativ, der Kurs, am Kurs (an dem Kurs), Ich nehme am Kurs teil.]
    - [träumen von + Dativ, eine Reise, von einer Reise, Er träumt von einer Reise nach Japan.]
    - [sprechen mit + Dativ, die Lehrerin, mit der Lehrerin, Ich spreche mit der Lehrerin.]
    - [sich bedanken bei + Dativ, die Nachbarin, bei der Nachbarin, Ich bedanke mich bei der Nachbarin.]
    - [gehören zu + Dativ, die Familie, zur Familie (zu der Familie), Der Hund gehört zur Familie.]

examples:
  - de: Ich warte schon seit zehn Minuten auf den Bus.
    en: I've been waiting for the bus for ten minutes.
    fa: ده دقیقه است که منتظر اتوبوسم.
  - de: Wir freuen uns auf die Ferien.
    en: We are looking forward to the holidays.
    fa: مشتاق تعطیلات هستیم.
  - de: Sie hat sich sehr über die Blumen gefreut.
    en: She was very pleased with the flowers.
    fa: از گل‌ها خیلی خوشحال شد.
  - de: Interessierst du dich für Fußball?
    en: Are you interested in football?
    fa: به فوتبال علاقه داری؟
  - de: Ich denke oft an meine Großeltern.
    en: I often think of my grandparents.
    fa: اغلب به پدربزرگ و مادربزرگم فکر می‌کنم.
  - de: Wer kümmert sich um die Katze, wenn ihr im Urlaub seid?
    en: Who looks after the cat when you are on holiday?
    fa: وقتی به تعطیلات می‌روید، چه کسی از گربه مراقبت می‌کند؟
  - de: Das Kind hat Angst vor dem Hund.
    en: The child is afraid of the dog.
    fa: بچه از سگ می‌ترسد.
  - de: Nächste Woche nehme ich an einem Deutschkurs teil.
    en: Next week I'm taking part in a German course.
    fa: هفتهٔ آینده در یک کلاس آلمانی شرکت می‌کنم.
  - de: Er träumt von einem eigenen Haus.
    en: He dreams of a house of his own.
    fa: آرزوی خانه‌ای از آن خودش را دارد.
  - de: Wir haben lange über den Film gesprochen.
    en: We talked about the film for a long time.
    fa: مدت زیادی دربارهٔ فیلم حرف زدیم.
  - de: Ich möchte mich bei Ihnen für die Hilfe bedanken.
    en: I would like to thank you for your help.
    fa: می‌خواهم از شما برای کمکتان تشکر کنم.
  - de: Auf wen wartest du? – Auf meine Schwester.
    en: Who are you waiting for? – For my sister.
    fa: منتظر چه کسی هستی؟ – منتظر خواهرم.
  - de: Mit wem hast du telefoniert? – Mit meinem Chef.
    en: Who did you talk to on the phone? – With my boss.
    fa: با چه کسی تلفنی حرف زدی؟ – با رئیسم.
  - de: Das hängt vom Wetter ab.
    en: That depends on the weather.
    fa: این به هوا بستگی دارد.

mistakes:
  - wrong: Ich warte für den Bus.
    right: Ich warte auf den Bus.
    why:
      en: 'English says "wait for", German says *warten auf*.'
      fa: "در آلمانی حرف اضافهٔ این فعل *auf* است: *warten auf*."
      de: "Das Verb heißt *warten auf*, nicht *für*."
  - wrong: Ich interessiere mich in Musik.
    right: Ich interessiere mich für Musik.
    why:
      en: 'English says "interested in", German says *sich interessieren für*.'
      fa: "حرف اضافهٔ این فعل *für* است: *sich interessieren für*."
      de: "Das Verb heißt *sich interessieren für*."
  - wrong: Das Kind hat Angst vor den Hund.
    right: Das Kind hat Angst vor dem Hund.
    why:
      en: "*Angst haben vor* takes the *Dativ*: *vor dem Hund*."
      fa: "*Angst haben vor* با حالت *Dativ* می‌آید: *vor dem Hund*."
      de: "*Angst haben vor* hat den Dativ: *vor dem Hund*."
  - wrong: Nächste Woche haben wir Ferien. Wir freuen uns über die Ferien.
    right: Nächste Woche haben wir Ferien. Wir freuen uns auf die Ferien.
    why:
      en: "The holidays are still to come, so *sich freuen auf*. *Über* is for what is already here."
      fa: "تعطیلات هنوز در پیش است، پس *sich freuen auf* می‌آید. *über* برای چیزی است که اکنون هست یا رخ داده است."
      de: "Die Ferien kommen noch. Darum *sich freuen auf*. *Über* sagt man, wenn etwas schon da ist."
  - wrong: Ich denke oft an dir.
    right: Ich denke oft an dich.
    why:
      en: "*Denken an* takes the *Akkusativ*: *an dich*."
      fa: "*denken an* با حالت *Akkusativ* می‌آید: *an dich*."
      de: "*Denken an* hat den Akkusativ: *an dich*."
  - wrong: Wen wartest du?
    right: Auf wen wartest du?
    why:
      en: "The preposition belongs to the verb, so it stays in the question: *auf wen*."
      fa: "حرف اضافه جزئی از فعل است و در پرسش هم می‌ماند: *auf wen*."
      de: "Die Präposition gehört zum Verb. Sie steht auch in der Frage: *auf wen*."

