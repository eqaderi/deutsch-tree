# Grammar list row 26.
id: grammar-026
kind: grammar
level: A1
chapter: a1-modal-verbs
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-139]
title:
  en: "*können* + *Satzklammer*"
  fa: "*können* و قاب جمله (*Satzklammer*)"
  de: "*können* + Satzklammer"

explanations:
  en:
    rule: >
      *Können* is a modal verb: it says that someone is able to do something
      (*Ich kann schwimmen.*), that something is possible (*Wir können morgen
      kommen.*) or that it is allowed (*Kann man hier mit Karte zahlen?*). The
      modal verb is conjugated and stands in position 2; the second verb goes
      to the very end as an infinitive. Together they frame the rest of the
      sentence: this is the *Satzklammer*. In a yes/no question the modal verb
      moves to position 1, and the infinitive still stays at the end. *Ich*
      and *er* / *sie* / *es* have the same form, *kann*, with no ending, and
      the vowel changes to *a* in the singular. When the meaning is clear, the
      infinitive can be dropped: *Sie kann gut Spanisch.*
  fa:
    rule: >
      *können* یک فعل وجهی است و نشان می‌دهد کسی توانایی کاری را دارد
      (*Ich kann schwimmen.*)، کاری شدنی است (*Wir können morgen kommen.*) یا
      اجازهٔ آن هست (*Kann man hier mit Karte zahlen?*). فعل وجهی صرف می‌شود و
      در جایگاه دوم می‌آید، ولی فعل دوم صرف نمی‌شود و به شکل مصدر به پایان
      جمله می‌رود. این دو فعل بقیهٔ جمله را در میان می‌گیرند؛ به این قاب
      جمله (*Satzklammer*) می‌گویند. در پرسش بله یا نه فعل وجهی به جایگاه اول
      می‌آید و مصدر باز هم در پایان می‌ماند. *ich* و *er* / *sie* / *es*
      صورت یکسان *kann* را دارند، بدون شناسه، و در مفرد واکهٔ *ö* به *a*
      تبدیل می‌شود. اگر معنا روشن باشد، مصدر را می‌توان انداخت: *Sie kann gut
      Spanisch.*
  de:
    rule: >
      *Können* ist ein Modalverb. Es sagt: Jemand hat eine Fähigkeit (*Ich kann
      schwimmen.*), etwas ist möglich (*Wir können morgen kommen.*) oder
      etwas ist erlaubt (*Kann man hier mit Karte zahlen?*). Das Modalverb
      ist konjugiert und steht auf Position 2. Das zweite Verb steht im
      Infinitiv ganz am Ende. Die zwei Verben sind wie eine Klammer um den
      Satz: die Satzklammer. In einer Ja/Nein-Frage steht das Modalverb auf
      Position 1, der Infinitiv bleibt am Ende. *Ich* und *er* / *sie* / *es*
      haben die gleiche Form *kann*, ohne Endung. Ist die Bedeutung klar,
      kann der Infinitiv fehlen: *Sie kann gut Spanisch.*

