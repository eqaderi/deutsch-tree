prerequisites: [grammar-062, grammar-141]
title:
  en: "*Frageartikel* *welch-*"
  fa: "حرف تعریف پرسشی *welch-*"
  de: "Frageartikel *welch-*"

explanations:
  en:
    rule: >
      *Welch-* (which) asks for one out of several. It stands before a noun
      and has the endings of *dieser*: *welcher* (*der*), *welche* (*die*),
      *welches* (*das*), and *welche* for the plural. In the *Akkusativ*
      only the masculine changes: *welchen*. The question word and its noun
      come first, then the verb: *Welchen Film meinst du?* The answer often
      uses *dieser* or *der*: *Diesen hier.*
  fa:
    rule: >
      *welch-* (کدام) میان چند چیز یکی را می‌پرسد. این واژه پیش از اسم می‌آید
      و پایانه‌هایش همان پایانه‌های *dieser* است: *welcher* (*der*)،
      *welche* (*die*)، *welches* (*das*) و برای جمع *welche*. در حالت
      *Akkusativ* (حالت مفعولی) فقط مذکر تغییر می‌کند: *welchen*. واژهٔ پرسشی
      با اسمش در آغاز جمله می‌آید و فعل پس از آن: *Welchen Film meinst du?*
      در پاسخ اغلب *dieser* یا *der* به کار می‌رود: *Diesen hier.* «کدام» در
      فارسی تغییر نمی‌کند، ولی *welch-* در آلمانی پایانه می‌گیرد.
  de:
    rule: >
      Mit *welch-* fragt man nach einer Sache aus einer Gruppe. *Welch-* steht
      vor einem Nomen und hat die Endungen von *dieser*: *welcher* (*der*),
      *welche* (*die*), *welches* (*das*) und im Plural *welche*. Im
      Akkusativ ändert sich nur das Maskulinum: *welchen*. Das Fragewort mit
      dem Nomen steht am Anfang, dann kommt das Verb: *Welchen Film meinst
      du?*

table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "With *welch-*", fa: "با *welch-*", de: "Mit *welch-*" }
    - { en: "*Akkusativ* with *welch-*", fa: "حالت *Akkusativ* با *welch-*", de: "Akkusativ mit *welch-*" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [der Film, welcher Film, welchen Film, Welchen Film meinst du?]
