    - [das Buch, welches Buch, welches Buch, Welches Buch liest du?]
    - [die Schuhe (Plural), welche Schuhe, welche Schuhe, Welche Schuhe kaufst du?]

examples:
  - de: Welchen Film meinst du?
    en: Which film do you mean?
    fa: منظورت کدام فیلم است؟
  - de: Welche Farbe hat dein Auto?
    en: What colour is your car?
    fa: ماشینت چه رنگی است؟
  - de: Welches Kleid gefällt dir?
    en: Which dress do you like?
    fa: از کدام لباس خوشت می‌آید؟
  - de: Welcher Bus fährt zum Bahnhof?
    en: Which bus goes to the station?
    fa: کدام اتوبوس به ایستگاه قطار می‌رود؟
  - de: Welche Sprachen sprechen Sie?
    en: Which languages do you speak?
    fa: به چه زبان‌هایی صحبت می‌کنید؟
  - de: Welchen Kuchen möchtest du? – Den mit Äpfeln.
    en: Which cake would you like? – The one with apples.
    fa: کدام کیک را می‌خواهی؟ – کیک سیب را.
  - de: Welches Zimmer nehmen wir?
    en: Which room shall we take?
    fa: کدام اتاق را بگیریم؟
  - de: Welcher Tag ist heute?
    en: What day is it today?
    fa: امروز چه روزی است؟

mistakes:
  - wrong: Welcher Film siehst du?
    right: Welchen Film siehst du?
    why:
      en: "The film is the object of *sehen*, so the *Akkusativ*: *welchen*, like *den*."
      fa: "فیلم مفعول *sehen* است، پس در حالت *Akkusativ* می‌آید: *welchen*، مانند *den*."
      de: "Der Film ist das Objekt von *sehen*. Darum Akkusativ: *welchen*, wie *den*."
  - wrong: Welche Buch liest du?
    right: Welches Buch liest du?
    why:
      en: "*Buch* is a *das* noun, so *welches*: it ends in *-s*, like *das*."
      fa: "*Buch* اسم خنثی (*das*) است، پس *welches* می‌آید که مانند *das* به *-s* ختم می‌شود."
      de: "*Buch* hat den Artikel *das*. Darum *welches*, mit *-s* wie *das*."
  - wrong: Welchen Film du meinst?
    right: Welchen Film meinst du?
    why:
      en: "After *welch-* and its noun comes the verb, in position 2, and then the subject."
      fa: "پس از *welch-* و اسمش، فعل در جایگاه دوم می‌آید و فاعل پس از آن."
      de: "Nach *welch-* und dem Nomen kommt das Verb auf Position 2, dann das Subjekt."

