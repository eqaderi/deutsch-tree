    options: [Der, Die, Das]
    answer: Die
    explanation:
      en: "Nouns in *-ung* are feminine: *die Übung*."
      fa: "اسم‌هایی که به *-ung* ختم می‌شوند مؤنث‌اند: *die Übung*."
      de: "Nomen auf *-ung* sind feminin: *die Übung*."
  - id: q2
    type: gap-fill
    prompt: ___ Drucker druckt nicht.
    options: [Der, Die, Das]
    answer: Der
    explanation:
      en: "A device in *-er* made from a verb is masculine: *der Drucker*."
      fa: "دستگاهی که با *-er* از فعل ساخته می‌شود مذکر است: *der Drucker*."
      de: "Ein Gerät auf *-er* ist maskulin: *der Drucker*."
  - id: q3
    type: gap-fill
    prompt: Frau Weber ist ___.
    options: [Lehrer, Lehrerin, Lehrerinnen]
    answer: Lehrerin
    explanation:
      en: "One woman: *-in*, so *Lehrerin*."
      fa: "یک زن است، پس با *-in*: *Lehrerin*."
      de: "Eine Frau: *-in*, also *Lehrerin*."
  - id: q4
    type: gap-fill
    prompt: Die zwei ___ kommen aus München.
    options: [Fahrer, Fahrers, Fahrerin]
    answer: Fahrer
    explanation:
      en: "Plural of *der Fahrer*: no ending, *die Fahrer*."
      fa: "جمع *der Fahrer* پایانه‌ای ندارد: *die Fahrer*."
      de: "Der Plural von *der Fahrer* hat keine Endung: *die Fahrer*."
  - id: q5
    type: gap-fill
    prompt: In der Klinik arbeiten drei ___.
    options: [Ärztin, Ärztinen, Ärztinnen]
    answer: Ärztinnen
    explanation:
      en: "The plural of *-in* is *-innen*: *die Ärztinnen*."
      fa: "جمع *-in* می‌شود *-innen*: *die Ärztinnen*."
      de: "Der Plural von *-in* ist *-innen*: *die Ärztinnen*."
