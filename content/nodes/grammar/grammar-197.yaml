examples:
  - de: Der Fahrer wartet vor dem Hotel.
    en: The driver is waiting in front of the hotel.
    fa: راننده جلوی هتل منتظر است.
  - de: Meine Lehrerin kommt aus Österreich.
    en: My teacher (a woman) comes from Austria.
    fa: خانم معلمم اهل اتریش است.
  - de: Nach dem Spiel sind die Spieler müde.
    en: After the game the players are tired.
    fa: بازیکنان بعد از بازی خسته‌اند.
  - de: Der Drucker im Büro ist kaputt.
    en: The printer in the office is broken.
    fa: چاپگر دفتر خراب است.
  - de: Ich bin Berlinerin, aber ich wohne in München.
    en: I'm from Berlin (a woman), but I live in Munich.
    fa: اهل برلینم، ولی در مونیخ زندگی می‌کنم.
  - de: In der Praxis arbeiten zwei Ärztinnen.
    en: Two doctors (women) work at the practice.
    fa: در این مطب دو پزشک زن کار می‌کنند.
  - de: Unsere Wohnung hat drei Zimmer.
    en: Our flat has three rooms.
    fa: آپارتمان ما سه اتاق دارد.
  - de: Die Rechnung kommt per E-Mail.
    en: The bill comes by e-mail.
    fa: صورت‌حساب با ایمیل می‌آید.
  - de: Vielen Dank für die Einladung!
    en: Thank you very much for the invitation!
    fa: از دعوتتان خیلی ممنونم!

mistakes:
  - wrong: Die Lehrerinen sind sehr nett.
    right: Die Lehrerinnen sind sehr nett.
    why:
      en: "The plural of *-in* is *-innen*, with two *n*."
      fa: "جمع *-in* با دو *n* است: *-innen*."
      de: "Der Plural von *-in* ist *-innen*, mit zwei *n*."
  - wrong: Das Wohnung ist groß.
    right: Die Wohnung ist groß.
    why:
      en: "Nouns in *-ung* are always feminine: *die Wohnung*."
      fa: "اسم‌هایی که به *-ung* ختم می‌شوند همیشه مؤنث‌اند: *die Wohnung*."
      de: "Nomen auf *-ung* sind immer feminin: *die Wohnung*."
  - wrong: Die Fahrers warten schon.
    right: Die Fahrer warten schon.
    why:
      en: "Masculine nouns in *-er* add nothing in the plural: *die Fahrer*."
      fa: "اسم‌های مذکری که به *-er* ختم می‌شوند در جمع پایانه‌ای نمی‌گیرند: *die Fahrer*."
      de: "Maskuline Nomen auf *-er* haben im Plural keine Endung: *die Fahrer*."
  - wrong: Sie ist Arztin.
    right: Sie ist Ärztin.
    why:
      en: "*Arzt* takes an umlaut when *-in* is added: *die Ärztin*."
      fa: "*Arzt* با پسوند *-in* دو نقطه می‌گیرد: *die Ärztin*."
      de: "Bei *Arzt* kommt mit *-in* ein Umlaut: *die Ärztin*."

