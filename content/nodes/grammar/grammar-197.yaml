    type: gap-fill
    prompt: Wir suchen eine neue ___.
    options: [Wohnen, Wohnung, Wohner]
    answer: Wohnung
    explanation:
      en: "*wohnen* + *-ung* = *die Wohnung*, a flat; it fits *eine neue*."
      fa: "*wohnen* + *-ung* = *die Wohnung* (آپارتمان)، که با *eine neue* جور است."
      de: "*wohnen* + *-ung* = *die Wohnung*. Das passt zu *eine neue*."
  - id: q7
    type: gap-fill
    prompt: Herr Huber kommt aus Wien. Er ist ___.
    options: [Wiener, Wienerin, Wienung]
    answer: Wiener
    explanation:
      en: "A man from Vienna is a *Wiener*; *Wienerin* is a woman."
      fa: "مردی اهل وین *Wiener* است؛ *Wienerin* برای زن است."
      de: "Ein Mann aus Wien ist *Wiener*. *Wienerin* ist eine Frau."
  - id: q8
    type: gap-fill
    prompt: Ich sehe am Abend fern. Der ___ ist neu.
    options: [Fernseher, Fernsehung, Fernseherin]
    answer: Fernseher
    explanation:
      en: "The device for *fernsehen* ends in *-er*: *der Fernseher*."
      fa: "دستگاهِ *fernsehen* با *-er* ساخته می‌شود: *der Fernseher*."
      de: "Das Gerät zum Fernsehen hat *-er*: *der Fernseher*."
  - id: q9
    type: multiple-choice
    prompt: Was ist ein Spieler?
    options: ["eine Person, die spielt", ein Platz zum Spielen, ein Spiel für Kinder]
    answer: "eine Person, die spielt"
    explanation:
      en: "*-er* on a verb stem gives the person who does it: *spielen* → *der Spieler*."
      fa: "*-er* پس از بن فعل کسی را می‌سازد که آن کار را می‌کند: *spielen* – *der Spieler*."
      de: "*-er* nach einem Verb ist die Person: *spielen* – *der Spieler*."
  - id: q10
    type: multiple-choice
    prompt: Welches Nomen hat den Artikel die?
    options: [Wohnung, Drucker, Fahrer]
    answer: Wohnung
    explanation:
      en: "*-ung* is feminine (*die Wohnung*); *Drucker* and *Fahrer* are masculine."
      fa: "*-ung* مؤنث است (*die Wohnung*)؛ *Drucker* و *Fahrer* مذکرند."
      de: "*-ung* ist feminin: *die Wohnung*. *Drucker* und *Fahrer* sind maskulin."
  - id: q11
    type: multiple-choice
    prompt: Die Einladung ist von Maria. Was hat Maria gemacht?
    options: [Sie hat uns eingeladen., Sie hat uns angerufen., Sie hat uns besucht.]
    answer: Sie hat uns eingeladen.
    explanation:
      en: "*die Einladung* comes from *einladen* (to invite)."
      fa: "*die Einladung* از *einladen* (دعوت کردن) ساخته شده است."
      de: "*Die Einladung* kommt von *einladen*."
  - id: q12
    type: true-false
    prompt: Die Studentinnen lernen zusammen.
    answer: true
    explanation:
      en: "*die Studentin*, plural *die Studentinnen*: right."
      fa: "*die Studentin*، جمع: *die Studentinnen*؛ درست است."
      de: "*Die Studentin*, Plural *die Studentinnen*: richtig."
  - id: q13
    type: true-false
    prompt: Das Rechnung ist falsch.
    answer: false
    explanation:
      en: "Nouns in *-ung* are feminine: *Die Rechnung ist falsch.*"
      fa: "اسم‌هایی که به *-ung* ختم می‌شوند مؤنث‌اند: *Die Rechnung ist falsch.*"
      de: "Nomen auf *-ung* sind feminin: *Die Rechnung ist falsch.*"
  - id: q14
