    - { en: Plural, fa: جمع, de: Plural }
  rows:
    - ["-er (Person)", fahren, der Fahrer, die Fahrer]
    - ["-er (Person)", spielen, der Spieler, die Spieler]
    - ["-er (Gerät)", drucken, der Drucker, die Drucker]
    - ["-er (Gerät)", fernsehen, der Fernseher, die Fernseher]
    - ["-er (aus einer Stadt, einem Land)", Berlin, der Berliner, die Berliner]
    - ["-er (aus einer Stadt, einem Land)", Österreich, der Österreicher, die Österreicher]
    - ["-in", der Lehrer, die Lehrerin, die Lehrerinnen]
    - ["-in", der Berliner, die Berlinerin, die Berlinerinnen]
    - ["-in (mit Umlaut)", der Arzt, die Ärztin, die Ärztinnen]
    - ["-ung", wohnen, die Wohnung, die Wohnungen]
    - ["-ung", rechnen, die Rechnung, die Rechnungen]
