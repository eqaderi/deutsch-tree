# Grammar list row 197.
id: grammar-197
kind: grammar
level: A1
chapter: a1-word-building
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-060, grammar-205]
title:
  en: "*-in*, *-er*, *-ung*"
  fa: "پسوندهای *-in*، *-er*، *-ung*"
  de: "Nomen mit *-in*, *-er*, *-ung*"

explanations:
  en:
    rule: >
      Three endings make new nouns, and each one fixes the gender and the
      plural. *-er* on a verb stem gives a masculine noun: the person who does
      it (*fahren* → *der Fahrer*) or a device that does it (*drucken* → *der
      Drucker*); after the name of a city or country it gives the people who
      live there (*Berlin* → *der Berliner*). These nouns add nothing in the
      plural: *die Fahrer*. *-in* makes the noun for a woman (*der Lehrer* →
      *die Lehrerin*), sometimes with an umlaut (*der Arzt* → *die Ärztin*);
      its plural is *-innen*: *die Lehrerinnen*. *-ung* on a verb stem gives a
      feminine noun, usually the action or its result (*wohnen* → *die
      Wohnung*); its plural is *-en*: *die Wohnungen*.
  fa:
    rule: >
      سه پسوند از واژه‌های دیگر اسم می‌سازند، و هر کدام جنس دستوری و جمع اسم
      تازه را هم تعیین می‌کند. *-er* پس از بن فعل اسم مذکر می‌سازد: کسی که
      آن کار را می‌کند (*fahren* – *der Fahrer*، راننده) یا دستگاهی که آن
      کار را انجام می‌دهد (*drucken* – *der Drucker*، چاپگر). پس از نام شهر
      یا کشور، *-er* اهل آن‌جا را نشان می‌دهد (*Berlin* – *der Berliner*).
      این اسم‌ها در جمع پایانه‌ای نمی‌گیرند: *die Fahrer*. *-in* اسم زن را
      می‌سازد (*der Lehrer* – *die Lehrerin*)، گاهی با دو نقطه (*Umlaut*):
      *der Arzt* – *die Ärztin*. جمع آن *-innen* است: *die Lehrerinnen*.
      *-ung* پس از بن فعل اسم مؤنث می‌سازد که معمولاً خودِ کار یا نتیجهٔ آن
      است (*wohnen* – *die Wohnung*)؛ جمع آن *-en* است: *die Wohnungen*.
  de:
    rule: >
      Mit drei Endungen macht man neue Nomen. Die Endung gibt auch den Artikel
      und den Plural. *-er* nach einem Verb: die Person, die etwas macht
      (*fahren* – *der Fahrer*), oder ein Gerät (*drucken* – *der Drucker*).
      *-er* nach einer Stadt oder einem Land: die Menschen von dort (*Berlin* –
      *der Berliner*). Diese Nomen sind maskulin und haben im Plural keine
      Endung: *die Fahrer*. *-in* sagt: Es ist eine Frau (*der Lehrer* – *die
      Lehrerin*), manchmal mit Umlaut (*der Arzt* – *die Ärztin*). Der Plural
      ist *-innen*: *die Lehrerinnen*. *-ung* nach einem Verb macht ein
      feminines Nomen (*wohnen* – *die Wohnung*). Der Plural ist *-en*: *die
      Wohnungen*.

