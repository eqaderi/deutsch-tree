# Grammar list row 192. The file format is described in content/README.md.
# The ordinal numbers as a topic of their own are grammar-106; here they are
# only what a date needs.
id: grammar-192
kind: grammar
level: A1
chapter: a1-numbers-time
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-190]
title:
  en: "Dates, days, months, seasons, times of day"
  fa: "تاریخ، روزهای هفته، ماه‌ها، فصل‌ها و بخش‌های روز"
  de: "Datum, Tage, Monate, Jahreszeiten, Tageszeiten"

explanations:
  en:
    rule: >
      Days, months, seasons and times of day are *der* nouns, except *die
      Nacht*. To say when, use *am* (*an dem*) with a day, a date or a time of
      day: *am Montag*, *am 25. Juli*, *am Abend*, but *in der Nacht*. Use
      *im* (*in dem*) with a month or a season: *im Juli*, *im Sommer*. The
      day of a date is an ordinal number, written with a point: *der 3. Mai*
      is *der dritte Mai*, and after *am* it ends in *-en*: *am dritten Mai*.
      Up to 19 the number adds *-te* (*zweite*, *vierte*, but *erste*,
      *dritte*, *siebte*), from 20 on *-ste* (*zwanzigste*). A year stands
      alone or after *im Jahr*: *1990* is *neunzehnhundertneunzig*, *2025* is
      *zweitausendfünfundzwanzig*.
  fa:
    rule: >
      روزهای هفته، ماه‌ها، فصل‌ها و بخش‌های روز همه اسم مذکر (*der*) هستند،
      به جز *die Nacht*. برای گفتن زمان یک کار، با روز، تاریخ و بخش‌های روز
      *am* (کوتاه‌شدهٔ *an dem*) می‌آید: *am Montag*، *am 25. Juli*، *am
      Abend*؛ ولی *in der Nacht*. با ماه و فصل *im* (کوتاه‌شدهٔ *in dem*)
      می‌آید: *im Juli*، *im Sommer*. روز ماه در تاریخ، عدد ترتیبی است و با
      نقطه نوشته می‌شود: *der 3. Mai* را *der dritte Mai* می‌خوانند و پس از
      *am* پایانهٔ *-en* می‌گیرد: *am dritten Mai*. تا ۱۹ به عدد *-te* افزوده
      می‌شود (*zweite*، *vierte*؛ ولی *erste*، *dritte*، *siebte*) و از ۲۰ به
      بعد *-ste* (*zwanzigste*). سال یا تنها می‌آید یا پس از *im Jahr*:
      *1990* را *neunzehnhundertneunzig* و *2025* را
      *zweitausendfünfundzwanzig* می‌خوانند.
  de:
    rule: >
      Tage, Monate, Jahreszeiten und Tageszeiten haben den Artikel *der*, nur
      *die Nacht* nicht. Auf die Frage *Wann?* sagt man bei Tagen, beim Datum
      und bei Tageszeiten *am* (*an dem*): *am Montag*, *am 25. Juli*, *am
      Abend*. Aber: *in der Nacht*. Bei Monaten und Jahreszeiten sagt man
      *im* (*in dem*): *im Juli*, *im Sommer*. Das Datum ist eine Ordinalzahl
      mit Punkt: *der 3. Mai* ist *der dritte Mai*, nach *am* mit *-en*: *am
      dritten Mai*. Bis 19 kommt *-te* dazu (*zweite*, *vierte*, aber
      *erste*, *dritte*, *siebte*), ab 20 *-ste* (*zwanzigste*). Ein Jahr
      steht allein oder nach *im Jahr*: *1990* sagt man
      *neunzehnhundertneunzig*.

