    - [wie viele, Wie viele Kinder hast du?, Zwei.]
    - [warum, Warum lernst du Deutsch?, Ich wohne jetzt hier.]

# Three ways to say "where": the place, where something comes from, where it goes.
diagrams:
  - caption:
      en: >
        *wo?* asks for the place where something is, *woher?* for the place it
        comes from, *wohin?* for the place it goes to. The dashed circle shows
        where the ball was or will be.
      fa: >
        *wo?* جایی را می‌پرسد که چیزی در آن است، *woher?* جایی را که از آن
        می‌آید و *wohin?* جایی را که به آن می‌رود. دایرهٔ خط‌چین جای پیشین یا
        جای بعدی توپ را نشان می‌دهد.
      de: >
        *Wo?* fragt nach dem Ort, an dem etwas ist. *Woher?* fragt nach dem
        Ort, von dem es kommt. *Wohin?* fragt nach dem Ort, zu dem es geht. Der
        Kreis mit Strichen zeigt, wo der Ball war oder sein wird.
