examples:
  - de: Wo wohnst du? – In Hamburg.
    en: Where do you live? – In Hamburg.
    fa: کجا زندگی می‌کنی؟ – در هامبورگ.
  - de: Woher kommen Sie? – Ich komme aus dem Iran.
    en: Where are you from? – I am from Iran.
    fa: اهل کجا هستید؟ – اهل ایرانم.
  - de: Wohin fahrt ihr im Sommer? – Nach Italien.
    en: Where are you (plural) going in the summer? – To Italy.
    fa: تابستان کجا می‌روید؟ – به ایتالیا.
  - de: Wann beginnt der Kurs? – Um neun Uhr.
    en: When does the course start? – At nine o'clock.
    fa: کلاس کی شروع می‌شود؟ – ساعت نه.
  - de: Wie heißen Sie? – Ich heiße Karim Rahimi.
    en: What is your name? – My name is Karim Rahimi.
    fa: نام شما چیست؟ – نام من کریم رحیمی است.
  - de: Wie alt bist du? – Ich bin dreißig.
    en: How old are you? – I am thirty.
    fa: چند سالت است؟ – سی سالم است.
  - de: Wie viel kostet der Kaffee? – Zwei Euro.
    en: How much is the coffee? – Two euros.
    fa: قهوه چند است؟ – دو یورو.
  - de: Wie viele Geschwister hast du? – Zwei.
    en: How many brothers and sisters do you have? – Two.
    fa: چند خواهر و برادر داری؟ – دو تا.
  - de: Warum lernst du Deutsch? – Ich arbeite bald in Wien.
    en: Why are you learning German? – I will soon work in Vienna.
    fa: چرا آلمانی یاد می‌گیری؟ – به‌زودی در وین کار می‌کنم.

mistakes:
  - wrong: Wo kommst du?
    right: Woher kommst du?
    why:
      en: "To ask where someone is from, say *woher*. *Wo* asks only where someone or something is."
      fa: "برای پرسیدن این‌که کسی اهل کجاست *woher* به کار می‌رود. *wo* فقط جای کسی یا چیزی را می‌پرسد."
      de: "Man fragt *Woher kommst du?* *Wo* fragt nur nach dem Ort, an dem etwas ist."
  - wrong: Wo fährst du?
    right: Wohin fährst du?
    why:
      en: "*Fahren* goes to a goal, so ask with *wohin*."
      fa: "*fahren* به سوی مقصدی است، پس با *wohin* می‌پرسیم."
      de: "Bei *fahren* gibt es ein Ziel. Darum fragt man mit *wohin*."
  - wrong: Wenn kommst du?
    right: Wann kommst du?
    why:
      en: 'The question word for "when" is *wann*. *Wenn* is a different word that you will meet later.'
      fa: "واژهٔ پرسشی برای «کی» *wann* است. *wenn* واژهٔ دیگری است که بعدها با آن آشنا می‌شوید."
      de: "Das Fragewort ist *wann*. *Wenn* ist ein anderes Wort. Das kommt später."
  - wrong: Wieviel kostet das?
    right: Wie viel kostet das?
    why:
      en: "*Wie viel* is written as two words."
      fa: "*wie viel* دو واژهٔ جدا نوشته می‌شود."
      de: "*Wie viel* schreibt man in zwei Wörtern."

