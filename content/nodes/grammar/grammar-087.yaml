# Grammar list row 87.
id: grammar-087
kind: grammar
level: A1
chapter: a1-first-sentences
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-001]
title:
  en: "W-question words"
  fa: "واژه‌های پرسشی (*wo*، *woher*، *wann*، *wie* …)"
  de: "W-Fragewörter (*wo*, *woher*, *wann*, *wie* …)"

explanations:
  en:
    rule: >
      A question word asks for one piece of information and stands at the
      start of the question: *wo* (where), *woher* (where from), *wohin*
      (where to), *wann* (when), *wie* (how), *wie viel* (how much) and
      *warum* (why). English has one "where", German has three: *wo* asks for
      the place, *woher* for the starting point, *wohin* for the goal. *Wie*
      also asks for a name (*Wie heißt du?*) and goes with an adjective (*Wie
      alt bist du?*). *Wie viel* is two words; before a plural noun it is *wie
      viele*: *Wie viele Kinder hast du?*
  fa:
    rule: >
      واژهٔ پرسشی یک آگاهی مشخص را می‌پرسد و در آغاز پرسش می‌آید: *wo*
      (کجا)، *woher* (از کجا)، *wohin* (به کجا)، *wann* (کی، چه وقت)، *wie*
      (چطور، چگونه)، *wie viel* (چقدر) و *warum* (چرا). آلمانی برای «کجا» سه
      واژه دارد: *wo* جای چیزی را می‌پرسد، *woher* مبدأ را و *wohin* مقصد را.
      *wie* برای پرسیدن نام هم به کار می‌رود (*Wie heißt du?*) و با صفت هم
      می‌آید (*Wie alt bist du?*، «چند سالت است؟»). *wie viel* دو واژهٔ جداست؛
      پیش از اسم جمع *wie viele* می‌آید: *Wie viele Kinder hast du?*
  de:
    rule: >
      Ein Fragewort fragt nach einer Information. Es steht am Anfang von der
      Frage: *wo*, *woher*, *wohin*, *wann*, *wie*, *wie viel* und *warum*.
      *Wo* fragt nach dem Ort, *woher* nach dem Start und *wohin* nach dem
      Ziel. Mit *wie* fragt man auch nach dem Namen (*Wie heißt du?*) und mit
      einem Adjektiv (*Wie alt bist du?*). *Wie viel* schreibt man in zwei
      Wörtern, vor einem Nomen im Plural sagt man *wie viele*.

