# Grammar list row 134.
id: grammar-134
kind: grammar
level: B1
chapter: b1-prepositions
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-071]
title:
  en: "*während* + *Genitiv*/*Dativ*"
  fa: "*während* + *Genitiv* یا *Dativ*"
  de: "*während* + Genitiv / Dativ"

explanations:
  en:
    rule: >
      *Während* (during) before a noun says that something happens in the
      time of an event: *während des Essens*, *während der Pause*. In written
      German it takes the *Genitiv*: *der* and *das* become *des*, and the
      masculine or neuter noun gets *-s* or *-es* (*des Urlaubs*, *des
      Fluges*); *die* becomes *der*, in the plural too (*während der
      Ferien*). With *ein* it is *eines* and *einer*. In everyday speech many
      people use the *Dativ* (*während dem Essen*); in a letter, an e-mail to
      an office and in the exam, write the *Genitiv*. Before a clause with
      the verb at the end, *während* is a conjunction, a topic of its own.
  fa:
    rule: >
      *während* (در طول، هنگام) پیش از اسم می‌گوید کاری در زمان یک رویداد رخ
      می‌دهد: *während des Essens* (سر غذا) و *während der Pause* (در وقت
      استراحت). در زبان نوشتاری، *während* با حالت *Genitiv* (حالت ملکی)
      می‌آید: *der* و *das* به *des* تبدیل می‌شوند و اسم مذکر یا خنثی پایانهٔ
      *-s* یا *-es* می‌گیرد (*des Urlaubs*، *des Fluges*). *die* به *der*
      تبدیل می‌شود، در جمع نیز (*während der Ferien*). با *ein* صورت‌ها
      *eines* و *einer* است. در گفتار روزمره بسیاری از آلمانی‌زبان‌ها حالت
      *Dativ* را به کار می‌برند (*während dem Essen*)، ولی در نامه، ایمیل
      اداری و امتحان حالت *Genitiv* را بنویسید. *während* پیش از جمله‌ای که
      فعلش در پایان می‌آید حرف ربط است و موضوع درسی دیگری است.
  de:
    rule: >
      *Während* vor einem Nomen sagt: Etwas passiert in der Zeit von etwas
      anderem, zum Beispiel *während des Essens*, *während der Pause*. In der
      geschriebenen Sprache steht nach *während* der Genitiv: *der* und *das*
      werden zu *des*, und das Nomen bekommt *-s* oder *-es* (*des Urlaubs*,
      *des Fluges*). *Die* wird zu *der*, auch im Plural (*während der
      Ferien*). Mit *ein*: *eines*, *einer*. Im Alltag sagen viele Leute auch
      den Dativ (*während dem Essen*). In einem Brief, in einer E-Mail an ein
      Amt und in der Prüfung schreibt man den Genitiv. Vor einem Nebensatz
      mit dem Verb am Ende ist *während* eine Konjunktion. Das ist ein
      anderes Thema.

