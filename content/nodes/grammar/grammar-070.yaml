# Grammar list row 70.
id: grammar-070
kind: grammar
level: A2
chapter: a2-dativ-objects
order: 6
status: published
recogniseOnly: false
prerequisites: [grammar-062, grammar-192]
title:
  en: "Time expressions in the *Akkusativ*"
  fa: "عبارت‌های زمانی در حالت *Akkusativ*"
  de: "Zeitangaben im Akkusativ"

explanations:
  en:
    rule: >
      A time said without a preposition is in the *Akkusativ*. It answers
      *Wann?*, *Wie oft?* or *Wie lange?*: *jeden Morgen*, *nächsten
      Montag*, *letzte Woche*, *diesen Sommer*, *den ganzen Tag*, *einen
      Monat*. As in every *Akkusativ*, only masculine nouns show it: *jeder*
      becomes *jeden*, *nächster* becomes *nächsten*, *ein* becomes *einen*.
      Feminine, neuter and plural times keep their form: *jede Woche*,
      *jedes Jahr*, *die nächsten Tage*. After *bis* the time is in the
      *Akkusativ* too: *Bis nächsten Montag!* With a preposition the time
      follows it instead: *am Montag*, but *nächsten Montag*.
  fa:
    rule: >
      زمانی که بدون حرف اضافه گفته می‌شود در حالت *Akkusativ* (حالت مفعولی)
      می‌آید. این عبارت‌ها به پرسش‌های *Wann?* (کی؟)، *Wie oft?* (چند وقت
      یک بار؟) یا *Wie lange?* (چه مدت؟) پاسخ می‌دهند: *jeden Morgen*،
      *nächsten Montag*، *letzte Woche*، *diesen Sommer*، *den ganzen Tag*،
      *einen Monat*. مانند هر جای دیگر حالت *Akkusativ*، فقط اسم مذکر تغییر
      را نشان می‌دهد: *jeder* به *jeden*، *nächster* به *nächsten* و *ein*
      به *einen* تبدیل می‌شود. زمان‌های مؤنث، خنثی و جمع شکل خود را نگه
      می‌دارند: *jede Woche*، *jedes Jahr*، *die nächsten Tage*. پس از *bis*
      نیز زمان در حالت *Akkusativ* می‌آید: *Bis nächsten Montag!* اگر حرف
      اضافه بیاید، زمان از آن پیروی می‌کند: *am Montag*، ولی *nächsten
      Montag*.
  de:
    rule: >
      Eine Zeit ohne Präposition steht im Akkusativ. Sie sagt, wann, wie oft
      oder wie lange: *jeden Morgen*, *nächsten Montag*, *letzte Woche*,
      *diesen Sommer*, *den ganzen Tag*, *einen Monat*. Wie immer im
      Akkusativ ändern sich nur maskuline Nomen: *jeder* wird zu *jeden*,
      *nächster* zu *nächsten*, *ein* zu *einen*. Feminin, neutral und
      Plural bleiben gleich: *jede Woche*, *jedes Jahr*, *die nächsten Tage*.
      Auch nach *bis* steht der Akkusativ: *Bis nächsten Montag!* Mit
      Präposition ist es anders: *am Montag*, aber *nächsten Montag*.

# The article-change table of content/README.md: each time from its
# Nominativ form to the Akkusativ; the column with ein says how long.
table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "*Akkusativ*", fa: "حالت *Akkusativ*", de: Akkusativ }
    - { en: "With *ein*", fa: "با *ein*", de: "Mit *ein*" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [jeder Tag, jeden Tag, einen Tag, Ich lerne jeden Tag Deutsch.]
    - [jede Woche, jede Woche, eine Woche, Wir bleiben eine Woche in Wien.]
    - [jedes Jahr, jedes Jahr, ein Jahr, Sie fährt jedes Jahr nach Italien.]
    - [die nächsten Tage (Plural), die nächsten Tage, –, Die nächsten Tage bin ich zu Hause.]

examples:
  - de: Sie steht jeden Morgen um sieben Uhr auf.
    en: She gets up at seven every morning.
    fa: او هر روز صبح ساعت هفت بیدار می‌شود.
  - de: Bis nächsten Montag!
    en: See you next Monday!
    fa: تا دوشنبهٔ آینده!
  - de: Letzte Woche war ich krank.
    en: I was ill last week.
    fa: هفتهٔ پیش بیمار بودم.
  - de: Wir fahren nächstes Jahr nach Kanada.
    en: We are going to Canada next year.
    fa: سال آینده به کانادا می‌رویم.
  - de: Ich habe den ganzen Tag gearbeitet.
    en: I worked all day.
    fa: تمام روز کار کردم.
  - de: Er bleibt einen Monat in Berlin.
    en: He is staying in Berlin for a month.
    fa: او یک ماه در برلین می‌ماند.
  - de: Diesen Sommer machen wir Urlaub am Meer.
    en: This summer we are having a holiday by the sea.
    fa: این تابستان کنار دریا به تعطیلات می‌رویم.
  - de: Jeden Abend sehe ich fern.
    en: I watch TV every evening.
    fa: هر شب تلویزیون تماشا می‌کنم.
  - de: Wir haben eine Stunde gewartet.
    en: We waited for an hour.
    fa: یک ساعت منتظر ماندیم.
  - de: Jedes Wochenende besuche ich meine Eltern.
    en: I visit my parents every weekend.
    fa: هر آخر هفته به دیدن پدر و مادرم می‌روم.

mistakes:
  - wrong: Ich lerne jeder Tag Deutsch.
    right: Ich lerne jeden Tag Deutsch.
    why:
      en: "A time without a preposition is in the *Akkusativ*: *jeder Tag* becomes *jeden Tag*."
      fa: "زمانِ بدون حرف اضافه در حالت *Akkusativ* می‌آید: *jeder Tag* به *jeden Tag* تبدیل می‌شود."
      de: "Eine Zeit ohne Präposition steht im Akkusativ: *jeder Tag* wird zu *jeden Tag*."
  - wrong: Bis nächster Montag!
    right: Bis nächsten Montag!
    why:
      en: "After *bis* the time is in the *Akkusativ*: *nächsten Montag*."
      fa: "پس از *bis* زمان در حالت *Akkusativ* می‌آید: *nächsten Montag*."
      de: "Nach *bis* steht die Zeit im Akkusativ: *nächsten Montag*."
  - wrong: Wir fahren in nächstes Jahr nach Kanada.
    right: Wir fahren nächstes Jahr nach Kanada.
    why:
      en: "*Nächstes Jahr* needs no preposition; it is a time in the *Akkusativ*. With a preposition it would be *im nächsten Jahr*."
      fa: "*nächstes Jahr* حرف اضافه نمی‌خواهد؛ زمانی در حالت *Akkusativ* است. با حرف اضافه می‌شود *im nächsten Jahr*."
      de: "*Nächstes Jahr* braucht keine Präposition. Es ist eine Zeit im Akkusativ. Mit Präposition heißt es *im nächsten Jahr*."
  - wrong: Ich habe der ganze Tag gearbeitet.
    right: Ich habe den ganzen Tag gearbeitet.
    why:
      en: "*Der ganze Tag* says how long, so it is in the *Akkusativ*: *den ganzen Tag*."
      fa: "*der ganze Tag* مدت را می‌گوید، پس در حالت *Akkusativ* می‌آید: *den ganzen Tag*."
      de: "*Der ganze Tag* sagt, wie lange. Darum Akkusativ: *den ganzen Tag*."
  - wrong: Er bleibt ein Monat in Berlin.
    right: Er bleibt einen Monat in Berlin.
    why:
      en: "*Monat* is masculine, so in the *Akkusativ* *ein* becomes *einen*: *einen Monat*."
      fa: "*Monat* اسم مذکر است، پس در حالت *Akkusativ*، *ein* به *einen* تبدیل می‌شود: *einen Monat*."
      de: "*Monat* ist maskulin. Im Akkusativ wird *ein* zu *einen*: *einen Monat*."

