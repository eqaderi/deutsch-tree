# Grammar list row 122. A1 core only: nach, zu and in. The systematic choice
# by type of place (an den See, auf den Markt, nach Hause) is A2.
id: grammar-122
kind: grammar
level: A1
chapter: a1-prepositions
order: 4
status: published
recogniseOnly: false
prerequisites: [grammar-062, grammar-121]
title:
  en: "Local, *Wohin?*: *nach*, *zu*, *in* + *Akkusativ*"
  fa: "مقصد، *Wohin?*: *nach*، *zu*، *in* + حالت *Akkusativ*"
  de: "Richtung, *Wohin?*: *nach*, *zu*, *in* + Akkusativ"

explanations:
  en:
    rule: >
      To say where someone goes (*Wohin?*), A1 uses three prepositions.
      *Nach* goes with cities and with countries that have no article: *nach
      Paris*, *nach Deutschland*. *Zu* goes with people and with places you go
      to, such as a shop or a doctor: *zu meiner Freundin*, *zum Arzt*, *zur
      Post*. *Zu* always takes the *Dativ* and is usually shortened: *zum*
      (*zu dem*), *zur* (*zu der*). *In* goes into a place: *in die Stadt*,
      *ins Kino*, and into a country with an article: *in die Schweiz*. For a
      direction, *in* takes the *Akkusativ*: only *der* changes, to *den* (*in
      den Park*), and *in das* is shortened to *ins*.
  fa:
    rule: >
      برای گفتن این‌که کسی به کجا می‌رود (*Wohin?*)، در سطح *A1* سه حرف اضافه
      به کار می‌رود. *nach* با شهرها و با کشورهای بی‌حرف تعریف می‌آید: *nach
      Paris* و *nach Deutschland*. *zu* با اشخاص و با جاهایی می‌آید که به آن‌ها
      سر می‌زنیم، مانند یک مغازه یا پزشک: *zu meiner Freundin*، *zum Arzt* و
      *zur Post*. *zu* همیشه با حالت *Dativ* (حالت مفعول باواسطه) می‌آید و
      معمولاً کوتاه می‌شود: *zum* (*zu dem*) و *zur* (*zu der*). *in* یعنی
      رفتن به درون یک مکان: *in die Stadt* و *ins Kino*؛ و نیز رفتن به کشوری
      که حرف تعریف دارد: *in die Schweiz*. *in* برای جهت با حالت *Akkusativ*
      (حالت مفعولی) می‌آید: فقط *der* تغییر می‌کند و *den* می‌شود (*in den
      Park*)، و *in das* کوتاه می‌شود: *ins*.
  de:
    rule: >
      Auf die Frage *Wohin?* stehen auf A1 drei Präpositionen. *Nach* steht
      bei Städten und bei Ländern ohne Artikel: *nach Paris*, *nach
      Deutschland*. *Zu* steht bei Personen und bei Orten, zu denen man geht,
      zum Beispiel ein Geschäft oder ein Arzt: *zu meiner Freundin*, *zum
      Arzt*, *zur Post*. Nach *zu* steht immer der Dativ, meistens kurz: *zum*
      (*zu dem*), *zur* (*zu der*). *In* heißt: hinein, zum Beispiel *in die
      Stadt*, *ins Kino*, und bei Ländern mit Artikel: *in die Schweiz*. Bei
      einer Richtung steht nach *in* der Akkusativ: Nur *der* wird zu *den*
      (*in den Park*), und *in das* sagt man kurz *ins*.

table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "*in* + *Akkusativ*", fa: "*in* + حالت *Akkusativ*", de: "*in* + Akkusativ" }
    - { en: "*zu* + *Dativ*", fa: "*zu* + حالت *Dativ*", de: "*zu* + Dativ" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [der Park, in den Park, zum Park, Wir gehen in den Park.]
    - [die Schule, in die Schule, zur Schule, Die Kinder gehen zur Schule.]
    - [das Kino, ins Kino (in das), zum Kino, Gehen wir ins Kino?]
    - [die Berge (Plural), in die Berge, zu den Bergen, Wir fahren in die Berge.]

# Three directions: to a city, up to a place, into a place.
diagrams:
  - caption:
      en: >
        *Wohin?* With *nach* you go to a city. With *zu* you go up to a person
        or a place. With *in* you go inside: the arrow ends in the room.
      fa: >
        *Wohin?* با *nach* به یک شهر می‌روید. با *zu* تا کنار یک شخص یا یک
        مکان می‌روید. با *in* به درون می‌روید: پیکان درون اتاق تمام می‌شود.
      de: >
        *Wohin?* Mit *nach* fährt man in eine Stadt. Mit *zu* geht man bis zu
        einer Person oder einem Ort. Mit *in* geht man hinein: Der Pfeil endet
        im Raum.
