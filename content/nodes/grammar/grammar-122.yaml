      <svg viewBox="0 0 320 228">
        <!-- nach: to a city -->
        <text class="label" x="120" y="36" text-anchor="middle">nach Paris</text>
        <circle class="object" cx="30" cy="54" r="10"/>
        <line class="line" x1="44" y1="54" x2="206" y2="54"/>
