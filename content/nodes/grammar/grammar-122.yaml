        <rect class="surface" x="232" y="100" width="64" height="48"/>
        <!-- in: into a room whose edges are dashed -->
        <text class="label" x="120" y="184" text-anchor="middle">ins Kino</text>
        <circle class="object" cx="30" cy="202" r="10"/>
        <rect class="guide" x="232" y="174" width="64" height="48"/>
