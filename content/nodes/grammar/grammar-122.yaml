        <rect class="surface" x="254" y="30" width="16" height="40"/>
        <rect class="surface" x="274" y="44" width="14" height="26"/>
        <!-- zu: up to a building, not into it -->
        <text class="label" x="120" y="110" text-anchor="middle">zum Arzt</text>
        <circle class="object" cx="30" cy="128" r="10"/>
        <line class="line" x1="44" y1="128" x2="212" y2="128"/>
