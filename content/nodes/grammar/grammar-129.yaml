    explanation:
      en: "The question is *Wohin?*, so the answer takes the *Akkusativ*: *auf den Tisch*."
      fa: "پرسش *Wohin?* است، پس پاسخ با حالت *Akkusativ* می‌آید: *auf den Tisch*."
      de: "Die Frage ist *Wohin?*. Darum steht in der Antwort der Akkusativ: *auf den Tisch*."
