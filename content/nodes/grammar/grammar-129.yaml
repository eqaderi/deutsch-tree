# Grammar list row 129.
id: grammar-129
kind: grammar
level: A2
chapter: a2-prepositions
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-122, grammar-128]
title:
  en: "Two-way prepositions, *Wohin?* + *Akkusativ*, and the contrast"
  fa: "حرف‌های اضافهٔ دوحالته، *Wohin?* + حالت *Akkusativ*، و تفاوت آن با *Wo?*"
  de: "Wechselpräpositionen, *Wohin?* + Akkusativ, und der Unterschied zu *Wo?*"

explanations:
  en:
    rule: >
      The nine two-way prepositions *an*, *auf*, *hinter*, *in*, *neben*,
      *über*, *unter*, *vor* and *zwischen* take two cases. For a place, in
      answer to *Wo?* (where?), they take the *Dativ*: *Der Computer steht
      unter dem Tisch.* For a movement to a new place, in answer to *Wohin?*
      (where to?), they take the *Akkusativ*: *Ich stelle den Computer unter
      den Tisch.* In the *Akkusativ* only *der* changes, to *den* (*ein* to
      *einen*); *die*, *das* and plural *die* stay as they are. *In das* and
      *an das* are usually shortened to *ins* and *ans*. A movement that stays
      inside one place is still *Wo?*: *Die Kinder laufen im Park.*
  fa:
    rule: >
      نُه حرف اضافهٔ دوحالته، یعنی *an*، *auf*، *hinter*، *in*، *neben*،
      *über*، *unter*، *vor* و *zwischen*، با دو حالت می‌آیند. وقتی جای چیزی
      را نشان می‌دهند، یعنی در پاسخ به پرسش *Wo?* (کجا؟)، با حالت *Dativ*
      (حالت مفعول باواسطه) می‌آیند: *Der Computer steht unter dem Tisch.* وقتی
      حرکت به جایی تازه را نشان می‌دهند، یعنی در پاسخ به پرسش *Wohin?* (به
      کجا؟)، با حالت *Akkusativ* (حالت مفعولی) می‌آیند: *Ich stelle den
      Computer unter den Tisch.* در حالت *Akkusativ* فقط *der* تغییر می‌کند و
      *den* می‌شود (*ein* نیز *einen*)؛ *die*، *das* و *die* جمع همان می‌مانند.
      *in das* و *an das* معمولاً کوتاه می‌شوند: *ins* و *ans*. حرکتی که درون
      یک مکان می‌ماند همچنان پاسخ *Wo?* است: *Die Kinder laufen im Park.*
  de:
    rule: >
      Die Wechselpräpositionen *an*, *auf*, *hinter*, *in*, *neben*, *über*,
      *unter*, *vor* und *zwischen* haben zwei Kasus. Auf die Frage *Wo?* (ein
      Ort) steht der Dativ: *Der Computer steht unter dem Tisch.* Auf die
      Frage *Wohin?* (eine Bewegung zu einem neuen Ort) steht der Akkusativ:
      *Ich stelle den Computer unter den Tisch.* Im Akkusativ ändert sich nur
      *der*: Er wird zu *den* (*ein* zu *einen*). *Die*, *das* und *die* im
      Plural bleiben gleich. *In das* und *an das* sagt man meistens kurz:
      *ins* und *ans*. Bleibt eine Bewegung an einem Ort, fragt man *Wo?*:
      *Die Kinder laufen im Park.*

# Two columns: on the left the ball is in or on the box (Wo?), on the right
# it moves there (Wohin?), and the dashed ball is where it ends.
diagrams:
  - caption:
      en: >
        On the left the ball is somewhere: *Wo?* + *Dativ*. On the right it
        moves there: *Wohin?* + *Akkusativ*. The dashed ball shows where the
        movement ends.
      fa: >
        در سمت چپ توپ جایی قرار دارد: *Wo?* + حالت *Dativ*. در سمت راست توپ
        به آن‌جا می‌رود: *Wohin?* + حالت *Akkusativ*. توپ خط‌چین جایی را نشان
        می‌دهد که حرکت در آن تمام می‌شود.
      de: >
        Links ist der Ball an einem Ort: *Wo?* + Dativ. Rechts bewegt er sich
        dorthin: *Wohin?* + Akkusativ. Der Ball mit Strichen zeigt, wo die
        Bewegung endet.
