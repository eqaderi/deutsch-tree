examples:
  - de: Ich stelle den Computer unter den Tisch.
    en: I put the computer under the table.
    fa: کامپیوتر را زیر میز می‌گذارم.
  - de: Jetzt steht der Computer unter dem Tisch.
    en: Now the computer is under the table.
    fa: حالا کامپیوتر زیر میز است.
  - de: Wir gehen heute Abend ins Kino.
    en: We are going to the cinema tonight.
    fa: امشب به سینما می‌رویم.
  - de: Am Abend sind wir im Kino.
    en: In the evening we are at the cinema.
    fa: شب در سینما هستیم.
  - de: Sie hängt das Bild an die Wand.
    en: She hangs the picture on the wall.
    fa: او تابلو را به دیوار آویزان می‌کند.
  - de: Leg den Schlüssel bitte auf den Tisch.
    en: Please put the key on the table.
    fa: کلید را روی میز بگذار.
  - de: Im Sommer fahren wir oft ans Meer.
    en: In summer we often go to the seaside.
    fa: تابستان‌ها اغلب به کنار دریا می‌رویم.
  - de: Er fährt das Auto in die Garage.
    en: He drives the car into the garage.
    fa: او ماشین را به داخل پارکینگ می‌برد.
  - de: Stell die Flasche zwischen die Gläser.
    en: Put the bottle between the glasses.
    fa: بطری را میان لیوان‌ها بگذار.
  - de: Die Kinder laufen im Park.
    en: The children are running in the park.
    fa: بچه‌ها در پارک می‌دوند.

mistakes:
  - wrong: Ich lege das Buch auf dem Tisch.
    right: Ich lege das Buch auf den Tisch.
    why:
      en: "*Legen* is a movement to a new place (*Wohin?*), so the *Akkusativ* follows: *den Tisch*."
      fa: "*legen* حرکت به جایی تازه است (*Wohin?*)، پس حالت *Akkusativ* می‌آید: *den Tisch*."
      de: "*Legen* ist eine Bewegung zu einem neuen Ort (*Wohin?*). Darum Akkusativ: *den Tisch*."
  - wrong: Wir gehen in dem Park.
    right: Wir gehen in den Park.
    why:
      en: "You go from outside into the park (*Wohin?*): *in den Park*. *Im Park* says where you already are."
      fa: "از بیرون به درون پارک می‌روید (*Wohin?*): *in den Park*. *im Park* می‌گوید که از پیش کجا هستید."
      de: "Man geht von draußen in den Park (*Wohin?*): *in den Park*. *Im Park* sagt, wo man schon ist."
  - wrong: Er geht in die Kino.
    right: Er geht ins Kino.
    why:
      en: "*Kino* is a *das* noun. *Das* stays *das* in the *Akkusativ*: *in das Kino*, shortened to *ins Kino*."
      fa: "*Kino* اسم خنثی (*das*) است. *das* در حالت *Akkusativ* همان *das* می‌ماند: *in das Kino* که کوتاه می‌شود: *ins Kino*."
      de: "*Kino* hat den Artikel *das*. Im Akkusativ bleibt *das*: *in das Kino*, kurz *ins Kino*."
  - wrong: Sie hängt die Lampe über dem Tisch.
    right: Sie hängt die Lampe über den Tisch.
    why:
      en: "She moves the lamp to a new place (*Wohin?*), so *über* takes the *Akkusativ*: *über den Tisch*."
      fa: "او چراغ را به جایی تازه می‌برد (*Wohin?*)، پس *über* با حالت *Akkusativ* می‌آید: *über den Tisch*."
      de: "Sie bringt die Lampe an einen neuen Ort (*Wohin?*). Darum *über* mit Akkusativ: *über den Tisch*."
  - wrong: Ich stelle die Tasche neben der Stuhl.
    right: Ich stelle die Tasche neben den Stuhl.
    why:
      en: "*Stuhl* is a *der* noun. In the *Akkusativ* *der* becomes *den*: *neben den Stuhl*."
      fa: "*Stuhl* اسم مذکر (*der*) است. در حالت *Akkusativ*، *der* به *den* تبدیل می‌شود: *neben den Stuhl*."
      de: "*Stuhl* hat den Artikel *der*. Im Akkusativ wird *der* zu *den*: *neben den Stuhl*."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Ich lege das Buch auf ___ Tisch.
    options: [den, dem, der]
    answer: den
    explanation:
      en: "*Legen* is a movement (*Wohin?*): *der Tisch* in the *Akkusativ* is *den Tisch*."
      fa: "*legen* حرکت است (*Wohin?*)؛ *der Tisch* در حالت *Akkusativ* می‌شود *den Tisch*."
      de: "*Legen* ist eine Bewegung (*Wohin?*). *Der Tisch* im Akkusativ: *den Tisch*."
  - id: gap-2
    type: gap-fill
    prompt: Das Buch liegt auf ___ Tisch.
    options: [dem, den, das]
    answer: dem
    explanation:
      en: "*Liegen* says where something is (*Wo?*): *der Tisch* in the *Dativ* is *dem Tisch*."
      fa: "*liegen* جای چیزی را نشان می‌دهد (*Wo?*)؛ *der Tisch* در حالت *Dativ* می‌شود *dem Tisch*."
      de: "*Liegen* sagt, wo etwas ist (*Wo?*). *Der Tisch* im Dativ: *dem Tisch*."
  - id: gap-3
    type: gap-fill
    prompt: Sie hängt das Foto an ___ Wand.
    options: [die, der, den]
    answer: die
    explanation:
      en: "She moves the photo to the wall (*Wohin?*). *Die* stays *die* in the *Akkusativ*."
      fa: "او عکس را به دیوار می‌برد (*Wohin?*). *die* در حالت *Akkusativ* همان *die* می‌ماند."
      de: "Sie bringt das Foto an die Wand (*Wohin?*). *Die* bleibt im Akkusativ *die*."
  - id: gap-4
    type: gap-fill
    prompt: Wir gehen heute Abend ___ Kino.
    options: [ins, im, in den]
    answer: ins
    explanation:
      en: "A movement into the cinema (*Wohin?*): *in das Kino*, shortened to *ins*. *Im* says where you are."
      fa: "حرکت به درون سینما (*Wohin?*): *in das Kino* که کوتاه می‌شود: *ins*. *im* می‌گوید کجا هستید."
      de: "Bewegung ins Kino (*Wohin?*): *in das Kino*, kurz *ins*. *Im* sagt, wo man ist."
  - id: gap-5
    type: gap-fill
    prompt: Am Abend sind wir ___ Kino.
    options: [im, ins, in die]
    answer: im
    explanation:
      en: "*Sein* says where you are (*Wo?*): *in dem Kino*, shortened to *im Kino*."
      fa: "*sein* جای کسی را نشان می‌دهد (*Wo?*): *in dem Kino* که کوتاه می‌شود: *im Kino*."
      de: "*Sein* sagt, wo man ist (*Wo?*): *in dem Kino*, kurz *im Kino*."
  - id: choice-1
    type: multiple-choice
    prompt: Wohin stellst du die Blumen? – ___ Fenster.
    options: [Ans, Am, Im]
    answer: Ans
    explanation:
      en: "*Wohin?* asks for the *Akkusativ*: *an das Fenster*, shortened to *ans Fenster*."
      fa: "*Wohin?* حالت *Akkusativ* می‌خواهد: *an das Fenster* که کوتاه می‌شود: *ans Fenster*."
      de: "*Wohin?* braucht den Akkusativ: *an das Fenster*, kurz *ans Fenster*."
  - id: choice-2
    type: multiple-choice
    prompt: Ich stelle die Lampe neben ___ Sofa.
    options: [das, dem, den]
    answer: das
    explanation:
      en: "*Stellen* is a movement (*Wohin?*). *Das Sofa* stays *das Sofa* in the *Akkusativ*."
      fa: "*stellen* حرکت است (*Wohin?*). *das Sofa* در حالت *Akkusativ* همان *das Sofa* می‌ماند."
      de: "*Stellen* ist eine Bewegung (*Wohin?*). *Das Sofa* bleibt im Akkusativ *das Sofa*."
  - id: choice-3
    type: multiple-choice
    prompt: Der Vater setzt das Kind ___ Stuhl.
    options: [auf den, auf dem, auf der]
    answer: auf den
    explanation:
      en: "*Setzen* moves the child to a new place (*Wohin?*): *der Stuhl* in the *Akkusativ* is *den Stuhl*."
      fa: "*setzen* بچه را به جایی تازه می‌برد (*Wohin?*)؛ *der Stuhl* در حالت *Akkusativ* می‌شود *den Stuhl*."
      de: "*Setzen* bringt das Kind an einen neuen Ort (*Wohin?*). *Der Stuhl* im Akkusativ: *den Stuhl*."
  - id: true-1
    type: true-false
    prompt: Ich hänge die Jacke in den Schrank.
    answer: true
    explanation:
      en: "The jacket moves into the wardrobe (*Wohin?*): *in den Schrank*. The sentence is correct."
      fa: "کت به درون کمد می‌رود (*Wohin?*): *in den Schrank*. جمله درست است."
      de: "Die Jacke kommt in den Schrank (*Wohin?*): *in den Schrank*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Sie legt das Handy in der Tasche.
    answer: false
    explanation:
      en: "*Legen* is a movement (*Wohin?*), so the *Akkusativ*: *in die Tasche*."
      fa: "*legen* حرکت است (*Wohin?*)، پس حالت *Akkusativ* می‌آید: *in die Tasche*."
      de: "*Legen* ist eine Bewegung (*Wohin?*). Darum Akkusativ: *in die Tasche*."
  - id: true-3
    type: true-false
    prompt: Die Kinder spielen im Garten.
    answer: true
    explanation:
      en: "Playing stays inside the garden (*Wo?*), so the *Dativ*: *im Garten*. The sentence is correct."
      fa: "بازی درون باغ می‌ماند (*Wo?*)، پس حالت *Dativ* می‌آید: *im Garten*. جمله درست است."
      de: "Das Spielen bleibt im Garten (*Wo?*). Darum Dativ: *im Garten*. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Er fährt das Auto in die Garage.
    answer: true
    explanation:
      en: "The car moves into the garage (*Wohin?*). *Die* stays *die* in the *Akkusativ*. The sentence is correct."
      fa: "ماشین به درون پارکینگ می‌رود (*Wohin?*). *die* در حالت *Akkusativ* همان می‌ماند. جمله درست است."
      de: "Das Auto kommt in die Garage (*Wohin?*). *Die* bleibt im Akkusativ gleich. Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Ich stelle die Milch in ___ (der) Kühlschrank.
    answers: [den]
    explanation:
      en: "*Stellen* is a movement (*Wohin?*): *der* becomes *den* in the *Akkusativ*."
