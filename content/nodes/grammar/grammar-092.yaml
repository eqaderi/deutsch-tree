# Grammar list row 92.
id: grammar-092
kind: grammar
level: A2
chapter: a2-articles-pronouns
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-078]
title:
  en: "*alle*, *jeder*"
  fa: "*alle* و *jeder*"
  de: "*alle*, *jeder*"

explanations:
  en:
    rule: >
      *Jeder* (every, each) goes with a singular noun and has the endings of
      *dieser*: *jeder Tag*, *jede Woche*, *jedes Jahr*; in the *Akkusativ*
      *jeden Tag*, in the *Dativ* *jedem*, *jeder*, *jedem*. *Alle* (all)
      goes with a plural noun, and the verb is plural: *Alle Kursteilnehmer
      machen mit.* In the *Dativ* it is *allen*, with *-n* on the noun:
      *mit allen Kindern*. Both can stand alone for people: *Jeder kennt das.*
      (everyone, singular verb) and *Alle sind da.* (everyone, plural verb).
      Time phrases such as *jeden Tag* and *jede Woche* are in the
      *Akkusativ* and need no preposition.
  fa:
    rule: >
      *jeder* (هر) با اسم مفرد می‌آید و پایانه‌هایش همان پایانه‌های *dieser*
      است: *jeder Tag*، *jede Woche*، *jedes Jahr*. در حالت *Akkusativ* (حالت
      مفعولی) مذکر *jeden* می‌شود و در حالت *Dativ* (حالت مفعول باواسطه)
      *jedem*، *jeder* و *jedem*. *alle* (همهٔ) با اسم جمع می‌آید و فعل نیز
      جمع است: *Alle Kursteilnehmer machen mit.* در حالت *Dativ* می‌شود
      *allen* و اسم نیز *-n* می‌گیرد: *mit allen Kindern*. هر دو بی‌اسم هم
      برای آدم‌ها به کار می‌روند: *Jeder kennt das.* (همه این را می‌شناسند؛
      فعل مفرد) و *Alle sind da.* (همه آمده‌اند؛ فعل جمع). در فارسی «هر» با
      اسم مفرد می‌آید و «همهٔ» با اسم جمع؛ آلمانی هم همین‌طور است. قیدهای
      زمانی مانند *jeden Tag* (هر روز) و *jede Woche* (هر هفته) در حالت
      *Akkusativ* می‌آیند و حرف اضافه نمی‌خواهند.
  de:
    rule: >
      *Jeder* steht bei einem Nomen im Singular und hat die Endungen von
      *dieser*: *jeder Tag*, *jede Woche*, *jedes Jahr*. Im Akkusativ heißt
      es *jeden Tag*, im Dativ *jedem*, *jeder*, *jedem*. *Alle* steht bei
      einem Nomen im Plural, und das Verb steht im Plural: *Alle
      Kursteilnehmer machen mit.* Im Dativ heißt es *allen*, und das Nomen
      bekommt *-n*: *mit allen Kindern*. Beide stehen auch allein für
      Personen: *Jeder kennt das.* (Verb im Singular), *Alle sind da.* (Verb
      im Plural). *Jeden Tag* und *jede Woche* stehen im Akkusativ, ohne
      Präposition.

