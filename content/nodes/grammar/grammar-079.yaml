# Grammar list row 79.
id: grammar-079
kind: grammar
level: A1
chapter: a1-more-articles
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-062]
title:
  en: "*Demonstrativpronomen* *der*, *das*, *die*"
  fa: "ضمیر اشاره *der*، *das*، *die*"
  de: "Demonstrativpronomen *der*, *das*, *die*"

explanations:
  en:
    rule: >
      In speech, *der*, *die* and *das* often stand alone, without a noun, in
      place of *er*, *sie* and *es*. They point back to a person or thing just
      named and stress it, so they usually come first in the sentence: *Die
      Jacke? Die ist gut!* They have the forms of the definite article: *der*,
      *die*, *das*, and *die* for the plural. In the *Akkusativ* only the
      masculine changes: *Der Rock? Den nehme ich.*
  fa:
    rule: >
      در گفتار، *der*، *die* و *das* اغلب بی‌آن‌که اسمی پس از آن‌ها بیاید، به
      جای *er*، *sie* و *es* به کار می‌روند. این ضمیر اشاره به کس یا چیزی
      برمی‌گردد که همین حالا نامش آمده است و بر آن تأکید می‌کند؛ از این رو
      معمولاً در آغاز جمله می‌آید: *Die Jacke? Die ist gut!* شکل‌های آن همان
      شکل‌های حرف تعریف معین است: *der*، *die*، *das* و برای جمع *die*. در
      حالت *Akkusativ* (حالت مفعولی) فقط مذکر تغییر می‌کند: *Der Rock? Den
      nehme ich.* معنای آن نزدیک به «همین» یا «این یکی» در فارسی است.
  de:
    rule: >
      Beim Sprechen stehen *der*, *die* und *das* oft allein, ohne Nomen, statt
      *er*, *sie* und *es*. Sie zeigen auf eine Person oder Sache, die man
      gerade genannt hat. Darum stehen sie meistens am Satzanfang: *Die Jacke?
      Die ist gut!* Die Formen sind wie beim Artikel: *der*, *die*, *das* und
      im Plural *die*. Im Akkusativ ändert sich nur das Maskulinum: *Der Rock?
      Den nehme ich.*

table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: Pronoun, fa: ضمیر, de: Pronomen }
    - { en: "Pronoun in the *Akkusativ*", fa: "ضمیر در حالت *Akkusativ*", de: Pronomen im Akkusativ }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [der Rock, der, den, Der Rock? Den nehme ich.]
    - [die Jacke, die, die, Die Jacke? Die ist gut!]
    - [das Hemd, das, das, Das Hemd? Das ist zu teuer.]
    - [die Schuhe (Plural), die, die, Die Schuhe? Die sind bequem.]

examples:
  - de: Die Jacke? Die ist gut!
    en: The jacket? That one's good!
    fa: کاپشن؟ این یکی خوب است!
  - de: Wie findest du den Rock? – Den finde ich schön.
    en: What do you think of the skirt? – I think it's nice.
    fa: دامن را چطور می‌بینی؟ – به نظرم قشنگ است.
  - de: Wo ist das Buch? – Das liegt auf dem Tisch.
    en: Where is the book? – It's on the table.
    fa: کتاب کجاست؟ – روی میز است.
  - de: Kennst du Herrn Weber? – Ja, den kenne ich gut.
    en: Do you know Mr Weber? – Yes, I know him well.
    fa: آقای وبر را می‌شناسی؟ – بله، او را خوب می‌شناسم.
  - de: Die Schuhe sind schön. – Ja, aber die sind zu teuer.
    en: The shoes are nice. – Yes, but they're too expensive.
    fa: کفش‌ها قشنگ‌اند. – بله، ولی زیادی گران‌اند.
  - de: Der Kaffee hier? Der ist sehr gut.
    en: The coffee here? It's very good.
    fa: قهوهٔ این‌جا؟ خیلی خوب است.
  - de: Ich suche meine Brille. – Die ist im Bad.
    en: I'm looking for my glasses. – They're in the bathroom.
    fa: دنبال عینکم می‌گردم. – در حمام است.
  - de: Nimmst du das Zimmer? – Ja, das nehme ich.
    en: Are you taking the room? – Yes, I'll take it.
    fa: اتاق را می‌گیری؟ – بله، همین را می‌گیرم.

mistakes:
  - wrong: Der Rock? Der nehme ich.
    right: Der Rock? Den nehme ich.
    why:
      en: "The skirt is the object of *nehmen*, so the *Akkusativ*: *den*, as in *den Rock*."
      fa: "دامن مفعول *nehmen* است، پس در حالت *Akkusativ* می‌آید: *den*، مانند *den Rock*."
      de: "Der Rock ist das Objekt von *nehmen*. Darum Akkusativ: *den*, wie bei *den Rock*."
  - wrong: Die Jacke? Der ist schön.
    right: Die Jacke? Die ist schön.
    why:
      en: "The pronoun has the gender of the noun it stands for. *Jacke* is feminine: *die*."
      fa: "ضمیر جنس همان اسمی را دارد که به جای آن آمده است. *Jacke* اسم مؤنث است: *die*."
      de: "Das Pronomen hat das Genus vom Nomen. *Jacke* ist feminin: *die*."
  - wrong: Die Äpfel? Der sind gut.
    right: Die Äpfel? Die sind gut.
    why:
      en: "For a plural the pronoun is *die*, as the article is."
      fa: "برای اسم جمع، ضمیر مانند حرف تعریف *die* است."
      de: "Im Plural ist das Pronomen *die*, wie der Artikel."

