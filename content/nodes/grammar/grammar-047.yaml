      fa: "*die Kinder* جمع است، پس *werden* نیز جمع می‌آید: *Die Kinder werden um vier Uhr abgeholt.*"
      de: "*Die Kinder* ist Plural. Darum: *Die Kinder werden um vier Uhr abgeholt.*"
  - id: true-4
