      en: >
        *Das Auto wird heute repariert.* and *Die Briefe werden jetzt
        gebracht.* *Werden* (shaded) stands in position 2 and agrees with the
        subject; the *Partizip II* (shaded) stands at the very end. Together
        they frame the rest: the *Satzklammer*.
      fa: >
        *Das Auto wird heute repariert.* و *Die Briefe werden jetzt
        gebracht.* *werden* (رنگی) در جایگاه دوم می‌آید و با فاعل مطابقت
        می‌کند؛ صفت مفعولی (رنگی) در پایان جمله است. این دو بقیهٔ جمله را در
        میان می‌گیرند: قاب جمله (*Satzklammer*).
      de: >
        *Das Auto wird heute repariert.* und *Die Briefe werden jetzt
        gebracht.* *Werden* (farbig) steht auf Position 2 und passt zum
        Subjekt. Das Partizip II (farbig) steht ganz am Ende. Sie sind die
        Satzklammer um den Rest.
