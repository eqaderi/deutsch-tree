      en: "*Von Herrn Weber* names the person who does it: Herr Weber pays."
      fa: "*von Herrn Weber* کسی را نام می‌برد که کار را انجام می‌دهد: آقای وبر صورت‌حساب را می‌پردازد."
      de: "*Von Herrn Weber* nennt die Person: Herr Weber bezahlt."
  - id: true-1
    type: true-false
    prompt: Die Briefe werden jeden Morgen gebracht.
    answer: true
    explanation:
      en: "Plural subject, *werden*, *Partizip II* at the end. The sentence is correct."
      fa: "فاعل جمع، *werden*، و صفت مفعولی در پایان جمله. جمله درست است."
      de: "Subjekt im Plural, *werden*, Partizip II am Ende. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Die Rechnung wird morgen bezahlen.
    answer: false
