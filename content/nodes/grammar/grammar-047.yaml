# Grammar list row 47.
id: grammar-047
kind: grammar
level: A2
chapter: a2-werden-lassen-passive
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-017, grammar-021]
title:
  en: "*Passiv Präsens*"
  fa: "مجهول در زمان حال (*Passiv Präsens*)"
  de: "Passiv Präsens"

explanations:
  en:
    rule: >
      The passive (*Passiv*) puts the action and the thing it happens to
      first, not the person who does it: *Das Auto wird repariert.* (The car
      is being repaired.) It is formed with *werden* in position 2 and the
      *Partizip II* at the end. The thing the action happens to is the
      subject, in the *Nominativ*, and *werden* agrees with it: *Die Autos
      werden repariert.* An active sentence with *man* says the same: *Man
      repariert das Auto.* The object of the active sentence (*den
      Fernseher*) becomes the subject of the passive one (*der Fernseher*).
      To name the person who does it, use *von* + *Dativ*: *Der Kuchen wird
      von meiner Oma gebacken.*
  fa:
    rule: >
      در جملهٔ مجهول (*Passiv*) خودِ کار و چیزی که کار بر آن انجام می‌شود
      مهم است، نه کسی که آن را انجام می‌دهد: *Das Auto wird repariert.*
      (ماشین تعمیر می‌شود.) مجهول با *werden* در جایگاه دوم و صفت مفعولی
      (*Partizip II*) در پایان جمله ساخته می‌شود. چیزی که کار بر آن انجام
      می‌شود فاعل جمله است و در حالت *Nominativ* (حالت فاعلی) می‌آید، و
      *werden* با آن مطابقت می‌کند: *Die Autos werden repariert.* جملهٔ
      معلوم با *man* همین معنا را دارد: *Man repariert das Auto.* مفعول
      جملهٔ معلوم (*den Fernseher*) در جملهٔ مجهول فاعل می‌شود (*der
      Fernseher*). برای نام بردن از کسی که کار را انجام می‌دهد، *von* +
      حالت *Dativ* به کار می‌رود: *Der Kuchen wird von meiner Oma gebacken.*
  de:
    rule: >
      Im Passiv ist die Handlung wichtig, nicht die Person: *Das Auto wird
      repariert.* Man bildet es mit *werden* auf Position 2 und dem Partizip
      II am Ende. Das Subjekt ist die Sache, mit der etwas passiert. Es steht
      im Nominativ, und *werden* passt zu ihm: *Die Autos werden repariert.*
      Ein Satz mit *man* sagt das Gleiche: *Man repariert das Auto.* Das
      Objekt im Aktiv (*den Fernseher*) ist im Passiv das Subjekt (*der
      Fernseher*). Die Person nennt man mit *von* + Dativ: *Der Kuchen wird
      von meiner Oma gebacken.*

# The table puts each active sentence beside its passive, so the change of
# the object (den Fernseher) into the subject (der Fernseher) shows in a row.
table:
  columns:
    - { en: "Active (*Aktiv*)", fa: "معلوم (*Aktiv*)", de: Aktiv }
    - { en: "Passive (*Passiv*)", fa: "مجهول (*Passiv*)", de: Passiv }
  rows:
    - [Man repariert den Fernseher., Der Fernseher wird repariert.]
    - [Man putzt die Küche., Die Küche wird geputzt.]
    - [Man öffnet das Fenster., Das Fenster wird geöffnet.]
    - [Man wäscht die Handtücher., Die Handtücher werden gewaschen.]
    - [Mein Vater kocht das Essen., Das Essen wird von meinem Vater gekocht.]

diagrams:
