examples:
  - de: Das Auto wird heute repariert.
    en: The car is being repaired today.
    fa: ماشین امروز تعمیر می‌شود.
  - de: In Österreich wird Deutsch gesprochen.
    en: German is spoken in Austria.
    fa: در اتریش آلمانی صحبت می‌کنند.
  - de: Die Briefe werden jeden Morgen gebracht.
    en: The letters are brought every morning.
    fa: نامه‌ها را هر روز صبح می‌آورند.
  - de: Das Paket wird morgen geliefert.
    en: The parcel will be delivered tomorrow.
    fa: بسته را فردا تحویل می‌دهند.
  - de: Die Fenster werden einmal im Monat geputzt.
    en: The windows are cleaned once a month.
    fa: پنجره‌ها ماهی یک بار تمیز می‌شوند.
  - de: Der Kuchen wird von meiner Oma gebacken.
    en: The cake is baked by my grandma.
    fa: کیک را مادربزرگم می‌پزد.
  - de: Wann wird das Zimmer geputzt?
    en: When is the room cleaned?
    fa: اتاق کی تمیز می‌شود؟
  - de: Hier wird jeden Tag frisches Brot gebacken.
    en: Fresh bread is baked here every day.
    fa: این‌جا هر روز نان تازه می‌پزند.

mistakes:
  - wrong: Das Auto wird reparieren.
    right: Das Auto wird repariert.
    why:
      en: "The passive needs the *Partizip II* at the end: *repariert*, not the infinitive."
      fa: "در مجهول صفت مفعولی (*Partizip II*) در پایان جمله می‌آید: *repariert*، نه مصدر."
      de: "Im Passiv steht das Partizip II am Ende: *repariert*, nicht der Infinitiv."
  - wrong: Die Fenster wird geputzt.
    right: Die Fenster werden geputzt.
    why:
      en: "*Die Fenster* is plural, so *werden* is plural too."
      fa: "*die Fenster* جمع است، پس *werden* نیز جمع می‌آید."
      de: "*Die Fenster* ist Plural. Darum steht *werden*."
  - wrong: Den Fernseher wird repariert.
    right: Der Fernseher wird repariert.
    why:
      en: "In the passive the thing is the subject, in the *Nominativ*: *der Fernseher*."
      fa: "در مجهول، این چیز فاعل جمله است و در حالت *Nominativ* می‌آید: *der Fernseher*."
      de: "Im Passiv ist die Sache das Subjekt, im Nominativ: *der Fernseher*."
  - wrong: Der Kuchen wird von meine Oma gebacken.
    right: Der Kuchen wird von meiner Oma gebacken.
    why:
      en: "*Von* takes the *Dativ*: *meine Oma* becomes *meiner Oma*."
      fa: "*von* با حالت *Dativ* می‌آید: *meine Oma* می‌شود *meiner Oma*."
      de: "Nach *von* steht der Dativ: *meiner Oma*."

