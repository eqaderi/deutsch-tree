    type: gap-fill
    prompt: Das Paket wird morgen ___.
    options: [liefern, geliefert, liefert]
    answer: geliefert
    explanation:
      en: "The passive takes the *Partizip II*: *geliefert*."
      fa: "مجهول با صفت مفعولی (*Partizip II*) ساخته می‌شود: *geliefert*."
      de: "Im Passiv steht das Partizip II: *geliefert*."
