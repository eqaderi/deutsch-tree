    type: gap-fill
    prompt: ___ Fernseher wird heute repariert.
    options: [Den, Der, Dem]
    answer: Der
    explanation:
      en: "The television is the subject of the passive, in the *Nominativ*: *der Fernseher*."
      fa: "تلویزیون فاعل جملهٔ مجهول است و در حالت *Nominativ* می‌آید: *der Fernseher*."
      de: "Der Fernseher ist im Passiv das Subjekt, im Nominativ: *der Fernseher*."
  - id: gap-5
    type: gap-fill
    prompt: Der Kuchen wird von ___ Oma gebacken.
    options: [meine, meinen, meiner]
    answer: meiner
    explanation:
      en: "*Von* takes the *Dativ*: *meine Oma* becomes *meiner Oma*."
      fa: "*von* با حالت *Dativ* می‌آید: *meine Oma* می‌شود *meiner Oma*."
      de: "Nach *von* steht der Dativ: *meiner Oma*."
  - id: choice-1
    type: multiple-choice
    prompt: Man putzt das Zimmer.
    options:
      - Das Zimmer putzt.
      - Das Zimmer wird geputzt.
      - Das Zimmer wird putzen.
    answer: Das Zimmer wird geputzt.
    explanation:
      en: "The passive is *werden* + *Partizip II*: *Das Zimmer wird geputzt.*"
      fa: "مجهول با *werden* + صفت مفعولی ساخته می‌شود: *Das Zimmer wird geputzt.*"
      de: "Passiv ist *werden* + Partizip II: *Das Zimmer wird geputzt.*"
  - id: choice-2
    type: multiple-choice
    prompt: In Österreich ___ Deutsch gesprochen.
    options: [hat, ist, wird]
    answer: wird
    explanation:
      en: "The passive is formed with *werden*: *Deutsch wird gesprochen*."
      fa: "مجهول با *werden* ساخته می‌شود: *Deutsch wird gesprochen*."
      de: "Das Passiv bildet man mit *werden*: *Deutsch wird gesprochen*."
  - id: choice-3
