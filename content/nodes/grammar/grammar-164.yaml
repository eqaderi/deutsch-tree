      de: "*Jedes Mal*: oft in der Vergangenheit. Darum *wenn*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Als wir in Berlin ___ (ankommen), regnete es.
    answers: [ankamen, angekommen sind]
    explanation:
      en: "In the *als* clause the separable verb is one word at the end: *ankamen*."
      fa: "در جملهٔ پیرو با *als* فعل جداشدنی یک‌جا در پایان جمله می‌آید: *ankamen*."
      de: "Im *als*-Satz steht das trennbare Verb zusammen am Ende: *ankamen*."
  - id: error-1
    type: find-error
    prompt: Wenn ich letztes Jahr in Spanien war, habe ich viel Spanisch gelernt.
    answer: Wenn
    explanation:
      en: "*Letztes Jahr* is one period in the past: *Als ich letztes Jahr in Spanien war, …*"
      fa: "*letztes Jahr* یک دوره در گذشته است: *Als ich letztes Jahr in Spanien war, …*"
      de: "*Letztes Jahr* ist eine Zeit in der Vergangenheit: *Als ich letztes Jahr in Spanien war, …*"
  - id: error-2
    type: find-error
    prompt: Als ich Kind bin, lebten wir in Graz.
    answer: bin
    explanation:
      en: "*Als* is about the past, so the verb is in the past too: *Als ich Kind war, …*"
      fa: "*als* دربارهٔ گذشته است، پس فعل هم در گذشته می‌آید: *Als ich Kind war, …*"
      de: "*Als* spricht über die Vergangenheit. Das Verb steht auch in der Vergangenheit: *Als ich Kind war, …*"
  - id: error-3
    type: find-error
    prompt: Ich weiß nicht, als der Zug ankommt.
    answer: als
    explanation:
      en: "You ask for a time, so the question word *wann*: *Ich weiß nicht, wann der Zug ankommt.*"
      fa: "زمان پرسیده می‌شود، پس واژهٔ پرسشی *wann* می‌آید: *Ich weiß nicht, wann der Zug ankommt.*"
      de: "Man fragt nach der Zeit. Darum das Fragewort *wann*: *Ich weiß nicht, wann der Zug ankommt.*"
  - id: order-1
    type: word-order
    answers:
      - ["als ich jung war,", wohnte, ich, in Köln]
    explanation:
      en: "The *als* clause is position 1, so the verb *wohnte* comes next, then the subject."
      fa: "جملهٔ پیرو با *als* جایگاه اول است، پس فعل *wohnte* و سپس فاعل می‌آید."
      de: "Der *als*-Satz ist Position 1. Dann kommt das Verb *wohnte*, danach das Subjekt."
  - id: order-2
    type: word-order
    answers:
      - ["es regnete,", als, wir, im Park, waren]
    explanation:
      en: "*Als* starts the clause, then the subject, and the verb *waren* comes last."
      fa: "*als* جمله را آغاز می‌کند، سپس فاعل می‌آید و فعل *waren* در آخر."
      de: "*Als* beginnt den Satz, dann kommt das Subjekt, das Verb *waren* steht am Ende."
  - id: match-1
    type: matching
    answer:
      - ["___ ich Kind war, lebten wir in Bonn.", als]
      - ["___ kommst du nach Hause?", wann]
      - ["Ruf mich an, ___ du in Bonn bist.", wenn]
    explanation:
      en: "Once in the past: *als*. A question for a time: *wann*. Now or later: *wenn*."
      fa: "یک بار در گذشته: *als*. پرسش دربارهٔ زمان: *wann*. حال یا آینده: *wenn*."
      de: "Einmal in der Vergangenheit: *als*. Eine Frage nach der Zeit: *wann*. Jetzt oder später: *wenn*."

