# Grammar list row 164.
id: grammar-164
kind: grammar
level: B1
chapter: b1-time-clauses
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-023, grammar-160]
title:
  en: "*als* for a single past event, vs *wenn*"
  fa: "*als* برای یک رویداد در گذشته، در برابر *wenn*"
  de: "*als* für ein einzelnes Ereignis in der Vergangenheit, im Vergleich mit *wenn*"

explanations:
  en:
    rule: >
      *Als* starts a subordinate clause about one event or one period in the
      past: *Als ich Kind war, lebten wir auf dem Land.* *Als ich in Wien
      ankam, regnete es.* As after *wenn*, the conjugated verb goes to the
      end, and it is mostly in the *Präteritum*. For something that happened
      again and again in the past, German uses *wenn*, often with *immer* or
      *jedes Mal*: *Immer wenn wir Oma besuchten, backte sie einen Kuchen.*
      For the present and the future it is always *wenn*: *Wenn ich in Wien
      ankomme, rufe ich dich an.* So: once in the past, *als*; in every other
      case, *wenn*. English says "when" for both, and the question word
      *wann* (when?) only asks for a time.
  fa:
    rule: >
      *als* جملهٔ پیرو را برای یک رویداد یا یک دوره در گذشته آغاز می‌کند:
      *Als ich Kind war, lebten wir auf dem Land.* و *Als ich in Wien ankam,
      regnete es.* مانند جملهٔ پیرو با *wenn*، فعل صرف‌شده به پایان جمله
      می‌رود و بیشتر در گذشتهٔ ساده (*Präteritum*) است. برای کاری که در
      گذشته بارها تکرار شده است، آلمانی *wenn* را به کار می‌برد، اغلب همراه
      *immer* یا *jedes Mal*: *Immer wenn wir Oma besuchten, backte sie einen
      Kuchen.* برای زمان حال و آینده همیشه *wenn* می‌آید: *Wenn ich in Wien
      ankomme, rufe ich dich an.* پس برای یک بار در گذشته *als* و در همهٔ
      موارد دیگر *wenn*. در فارسی هر دو را «وقتی» ترجمه می‌کنیم؛ واژهٔ
      پرسشی *wann* (کی؟) فقط زمان را می‌پرسد.
  de:
    rule: >
      Mit *als* beginnt ein Nebensatz über ein Ereignis oder eine Zeit in der
      Vergangenheit, die es nur einmal gab: *Als ich Kind war, lebten wir auf
      dem Land.* *Als ich in Wien ankam, regnete es.* Wie nach *wenn* steht
      das konjugierte Verb am Ende, meistens im Präteritum. Ist etwas in der
      Vergangenheit oft passiert, sagt man *wenn*, oft mit *immer* oder
      *jedes Mal*: *Immer wenn wir Oma besuchten, backte sie einen Kuchen.*
      In der Gegenwart und in der Zukunft sagt man immer *wenn*: *Wenn ich in
      Wien ankomme, rufe ich dich an.* Also: einmal in der Vergangenheit
      *als*, sonst *wenn*. Das Fragewort *wann* fragt nur nach der Zeit.

table:
  columns:
    - { en: "Once in the past: *als*", fa: "یک بار در گذشته: *als*", de: "Einmal in der Vergangenheit: *als*" }
    - {
        en: "Again and again in the past: *wenn*",
        fa: "بارها در گذشته: *wenn*",
        de: "Oft in der Vergangenheit: *wenn*",
      }
    - { en: "Now or later: *wenn*", fa: "حال یا آینده: *wenn*", de: "Jetzt oder später: *wenn*" }
  rows:
    - ["Als ich krank war, …", "Immer wenn ich krank war, …", "Wenn ich krank bin, …"]
    - ["Als wir in Rom waren, …", "Jedes Mal, wenn wir in Rom waren, …", "Wenn wir in Rom sind, …"]
    - ["Als der Brief kam, …", "Immer wenn ein Brief kam, …", "Wenn der Brief kommt, …"]

# A time line with "jetzt" on the right. One point in the past for als,
# three points in the past for immer wenn, one point after now for wenn.
diagrams:
  - caption:
      en: >
        Time runs to the right. One event in the past takes *als*. Something
        that happened again and again in the past takes *immer wenn*. After
        *jetzt*, in the future, it is *wenn* too.
      fa: >
        زمان به سمت راست پیش می‌رود. برای یک رویداد در گذشته *als* می‌آید.
        برای کاری که در گذشته بارها رخ داده است *immer wenn* می‌آید. پس از
        *jetzt*، یعنی در آینده، هم *wenn* می‌آید.
      de: >
        Die Zeit läuft nach rechts. Für ein Ereignis in der Vergangenheit sagt
        man *als*. Ist etwas in der Vergangenheit oft passiert, sagt man
        *immer wenn*. Nach *jetzt*, in der Zukunft, sagt man auch *wenn*.
    labels:
      past: { en: past, fa: گذشته, de: Vergangenheit }
      future: { en: future, fa: آینده, de: Zukunft }
    svg: |
      <svg viewBox="0 0 320 196">
        <!-- als: one point in the past -->
        <text class="label" x="50" y="30" text-anchor="middle">als</text>
        <circle class="object" cx="50" cy="48" r="7"/>
        <line class="guide" x1="50" y1="55" x2="50" y2="144"/>
        <!-- immer wenn: three points in the past -->
        <text class="label" x="150" y="80" text-anchor="middle">immer wenn</text>
        <circle class="object" cx="115" cy="98" r="7"/>
        <circle class="object" cx="150" cy="98" r="7"/>
        <circle class="object" cx="185" cy="98" r="7"/>
        <line class="guide" x1="115" y1="105" x2="115" y2="144"/>
        <line class="guide" x1="150" y1="105" x2="150" y2="144"/>
        <line class="guide" x1="185" y1="105" x2="185" y2="144"/>
        <!-- wenn: one point after now -->
        <text class="label" x="276" y="30" text-anchor="middle">wenn</text>
        <circle class="object" cx="276" cy="48" r="7"/>
        <line class="guide" x1="276" y1="55" x2="276" y2="144"/>
        <!-- the time line, with an arrow to the right; jetzt on it -->
        <line class="line" x1="10" y1="150" x2="304" y2="150"/>
