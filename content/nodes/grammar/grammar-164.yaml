      </svg>

examples:
  - de: Als ich Kind war, lebten wir auf dem Land.
    en: When I was a child, we lived in the country.
    fa: وقتی بچه بودم، در روستا زندگی می‌کردیم.
  - de: Als ich in Wien ankam, regnete es.
    en: When I arrived in Vienna, it was raining.
    fa: وقتی به وین رسیدم، باران می‌بارید.
  - de: Als das Telefon klingelte, stand ich unter der Dusche.
    en: When the phone rang, I was in the shower.
    fa: وقتی تلفن زنگ زد، زیر دوش بودم.
  - de: Meine Eltern haben sich kennengelernt, als sie Studenten waren.
    en: My parents met when they were students.
    fa: پدر و مادرم وقتی دانشجو بودند با هم آشنا شدند.
  - de: Immer wenn wir Oma besuchten, backte sie einen Kuchen.
    en: Whenever we visited grandma, she baked a cake.
    fa: هر بار که به دیدن مادربزرگ می‌رفتیم، کیک می‌پخت.
  - de: Jedes Mal, wenn ich ihn anrief, war er nicht zu Hause.
    en: Every time I called him, he wasn't at home.
    fa: هر بار که به او زنگ می‌زدم، خانه نبود.
  - de: Wenn ich in Wien ankomme, rufe ich dich an.
    en: When I arrive in Vienna, I'll call you.
    fa: وقتی به وین رسیدم، به تو زنگ می‌زنم.
  - de: Wann bist du nach Deutschland gekommen? – Als ich zwanzig war.
    en: When did you come to Germany? – When I was twenty.
    fa: کی به آلمان آمدی؟ – وقتی بیست سالم بود.

mistakes:
  - wrong: Wenn ich gestern nach Hause kam, war niemand da.
    right: Als ich gestern nach Hause kam, war niemand da.
    why:
      en: '*Gestern* is one event in the past, so *als*. *Wenn* in the past means "every time".'
      fa: "*gestern* یک رویداد در گذشته است، پس *als* می‌آید. *wenn* در گذشته یعنی «هر بار»."
      de: "*Gestern* ist ein Ereignis in der Vergangenheit. Darum *als*. *Wenn* heißt in der Vergangenheit: jedes Mal."
  - wrong: Als ich morgen Zeit habe, rufe ich dich an.
    right: Wenn ich morgen Zeit habe, rufe ich dich an.
    why:
      en: "*Als* is only for the past. For the present and the future it is always *wenn*."
      fa: "*als* فقط برای گذشته است. برای حال و آینده همیشه *wenn* می‌آید."
      de: "*Als* gibt es nur für die Vergangenheit. Für jetzt und später sagt man immer *wenn*."
  - wrong: Als ich klein war, ich spielte viel draußen.
    right: Als ich klein war, spielte ich viel draußen.
    why:
      en: "The *als* clause is position 1, so the main clause starts with its verb: *spielte ich*."
      fa: "جملهٔ پیرو با *als* جایگاه اول است، پس جملهٔ پایه با فعلش آغاز می‌شود: *spielte ich*."
      de: "Der *als*-Satz ist Position 1. Danach kommt sofort das Verb: *spielte ich*."
  - wrong: Als ich war jung, wohnte ich in Bonn.
    right: Als ich jung war, wohnte ich in Bonn.
    why:
      en: "In the *als* clause the conjugated verb *war* goes to the end."
      fa: "در جملهٔ پیرو با *als* فعل صرف‌شدهٔ *war* به پایان جمله می‌رود."
      de: "Im *als*-Satz steht das konjugierte Verb *war* am Ende."
  - wrong: Wann ich jung war, wohnte ich in Bonn.
    right: Als ich jung war, wohnte ich in Bonn.
    why:
      en: "*Wann* only asks for a time. A time in the past that is not a question is *als*."
      fa: "*wann* فقط زمان را می‌پرسد. برای زمانی در گذشته که پرسش نیست *als* می‌آید."
      de: "*Wann* fragt nur nach der Zeit. Eine Zeit in der Vergangenheit ohne Frage: *als*."

questions:
  - id: gap-1
    type: gap-fill
    prompt: ___ ich Kind war, wohnten wir in Hamburg.
    options: [Wenn, Als]
    answer: Als
    explanation:
      en: "Childhood is one period in the past: *als*."
      fa: "کودکی یک دوره در گذشته است: *als*."
      de: "Die Kindheit ist eine Zeit in der Vergangenheit, die es einmal gab: *als*."
  - id: gap-2
    type: gap-fill
    prompt: ___ ich nach Hause komme, rufe ich dich an.
    options: [Als, Wenn]
    answer: Wenn
    explanation:
      en: "This is about the future, so *wenn*. *Als* is only for the past."
      fa: "این جمله دربارهٔ آینده است، پس *wenn* می‌آید. *als* فقط برای گذشته است."
      de: "Das ist in der Zukunft. Darum *wenn*. *Als* gibt es nur für die Vergangenheit."
  - id: gap-3
    type: gap-fill
    prompt: Immer ___ wir Oma besuchten, backte sie einen Kuchen.
    options: [als, wenn]
    answer: wenn
    explanation:
      en: "*Immer*: it happened again and again in the past, so *wenn*."
      fa: "*immer* نشان می‌دهد که این کار در گذشته بارها رخ داده است، پس *wenn* می‌آید."
      de: "*Immer*: Es ist in der Vergangenheit oft passiert. Darum *wenn*."
  - id: gap-4
    type: gap-fill
    prompt: ___ wir letzten Sommer in Italien ankamen, schien die Sonne.
    options: [Wann, Wenn, Als]
    answer: Als
    explanation:
      en: "One arrival, last summer: one event in the past, so *als*."
      fa: "یک بار رسیدن در تابستان گذشته، یعنی یک رویداد در گذشته: *als*."
      de: "Letzten Sommer, eine Ankunft: ein Ereignis in der Vergangenheit. Darum *als*."
  - id: gap-5
    type: gap-fill
    prompt: Weißt du, ___ der Film anfängt?
    options: [als, wann, wenn]
    answer: wann
    explanation:
      en: "You ask for a time, so the question word *wann*, also inside the sentence."
      fa: "زمان پرسیده می‌شود، پس واژهٔ پرسشی *wann* می‌آید، درون جمله هم."
      de: "Man fragt nach der Zeit. Darum das Fragewort *wann*, auch im Satz."
  - id: choice-1
    type: multiple-choice
    prompt: Als ich gestern nach Hause kam, …
    options: [niemand war da., war niemand da., niemand da war.]
    answer: war niemand da.
    explanation:
      en: "The *als* clause is position 1, so the main clause starts with its verb: *war niemand da*."
      fa: "جملهٔ پیرو با *als* جایگاه اول است، پس جملهٔ پایه با فعلش آغاز می‌شود: *war niemand da*."
      de: "Der *als*-Satz ist Position 1. Der Hauptsatz beginnt mit dem Verb: *war niemand da*."
  - id: choice-2
    type: multiple-choice
    prompt: Mein Vater hat mich gestern angerufen, …
    options: [als ich saß im Bus., wenn ich im Bus saß., als ich im Bus saß.]
    answer: als ich im Bus saß.
    explanation:
      en: "One call, yesterday: *als*, with the verb *saß* at the end."
      fa: "یک تماس در دیروز: *als* می‌آید و فعل *saß* در پایان جمله است."
      de: "Ein Anruf, gestern: *als*. Das Verb *saß* steht am Ende."
  - id: choice-3
    type: multiple-choice
    prompt: "Immer wenn ich in Berlin war, habe ich meinen Onkel besucht. Was heißt das?"
    options: [Das ist einmal passiert., Das ist oft passiert., Das passiert bald.]
    answer: Das ist oft passiert.
    explanation:
      en: "*Immer wenn* in the past means every time: it happened often."
      fa: "*immer wenn* در گذشته یعنی هر بار؛ پس این کار بارها رخ داده است."
      de: "*Immer wenn* in der Vergangenheit heißt: jedes Mal. Es ist also oft passiert."
  - id: true-1
    type: true-false
    prompt: Als ich jung war, spielte ich oft Fußball.
    answer: true
    explanation:
      en: "Youth is one period in the past, so *als*, even though the football was often. The sentence is correct."
      fa: "جوانی یک دوره در گذشته است، پس *als* می‌آید، هرچند فوتبال بازی کردن بارها بوده است. جمله درست است."
      de: "Die Jugend ist eine Zeit in der Vergangenheit: *als*, auch wenn das Fußballspielen oft war. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Wenn ich gestern im Kino war, habe ich Anna getroffen.
    answer: false
    explanation:
      en: "*Gestern*: one event in the past, so *als*: *Als ich gestern im Kino war, …*"
      fa: "*gestern* یک رویداد در گذشته است، پس *als* می‌آید: *Als ich gestern im Kino war, …*"
      de: "*Gestern*: ein Ereignis in der Vergangenheit. Darum *als*: *Als ich gestern im Kino war, …*"
  - id: true-3
    type: true-false
    prompt: Immer wenn ich in Wien war, habe ich Sachertorte gegessen.
    answer: true
    explanation:
      en: "*Immer wenn*: again and again in the past, so *wenn*. The sentence is correct."
      fa: "*immer wenn* یعنی بارها در گذشته، پس *wenn* درست است. جمله درست است."
      de: "*Immer wenn*: oft in der Vergangenheit. Darum *wenn*. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Als ich morgen Zeit habe, komme ich vorbei.
    answer: false
    explanation:
      en: "*Morgen* is in the future, so *wenn*: *Wenn ich morgen Zeit habe, …*"
      fa: "*morgen* در آینده است، پس *wenn* می‌آید: *Wenn ich morgen Zeit habe, …*"
      de: "*Morgen* ist in der Zukunft. Darum *wenn*: *Wenn ich morgen Zeit habe, …*"
  - id: true-5
    type: true-false
    prompt: Als das Telefon klingelte, stand ich unter der Dusche.
    answer: true
    explanation:
      en: "One call in the past: *als*, with *klingelte* at the end and the main clause verb first. The sentence is correct."
      fa: "یک زنگ در گذشته: *als*، با *klingelte* در پایان جملهٔ پیرو و فعل در آغاز جملهٔ پایه. جمله درست است."
      de: "Ein Anruf in der Vergangenheit: *als*. *Klingelte* steht am Ende, der Hauptsatz beginnt mit dem Verb. Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Als ich nach Hause ___ (kommen), war das Essen schon fertig.
    answers: [kam, gekommen bin]
    explanation:
      en: "In the *als* clause the verb goes to the end, mostly in the *Präteritum*: *kam*."
      fa: "در جملهٔ پیرو با *als* فعل به پایان جمله می‌رود و بیشتر در گذشتهٔ ساده است: *kam*."
      de: "Im *als*-Satz steht das Verb am Ende, meistens im Präteritum: *kam*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: ___ (als / wenn) ich klein war, hatte ich einen Hund.
    answers: [Als]
    explanation:
      en: "Being small is one period in the past: *als*."
      fa: "کودکی یک دوره در گذشته است: *als*."
      de: "Klein sein ist eine Zeit in der Vergangenheit, die es einmal gab: *als*."
  - id: typed-gap-3
