# Grammar list row 133.
id: grammar-133
kind: grammar
level: A2
chapter: a2-prepositions
order: 5
status: published
recogniseOnly: false
prerequisites: [grammar-122, grammar-127]
title:
  en: "Direction adverbs and *hin-*/*her-*"
  fa: "قیدهای جهت و *hin-* / *her-*"
  de: "Richtungsadverbien und *hin-* / *her-*"

explanations:
  en:
    rule: >
      The place adverbs *hier*, *da*, *dort*, *oben*, *unten*, *links* and
      *rechts* answer *Wo?*. For a direction, in answer to *Wohin?*, they
      change: *hier* becomes *hierhin* or *hierher*, *da* and *dort* become
      *dahin* and *dorthin*, and the others take *nach*: *nach oben*, *nach
      links*. *Hin* points away from the speaker, *her* towards the speaker:
      *Komm her!* The question *Wohin?* is often split: *Wo gehst du hin?*
      Joined to *ein*, *aus*, *auf* and *unter*, they make *herein*, *hinaus*,
      *herauf*, *hinunter* and so on. In everyday speech these are short, and
      the same for both directions: *rein*, *raus*, *rauf*, *runter*. As the
      prefix of a verb they go to the end: *Komm sofort runter!*
  fa:
    rule: >
      قیدهای مکان *hier*، *da*، *dort*، *oben*، *unten*، *links* و *rechts*
      پاسخ پرسش *Wo?* (کجا؟) هستند. برای جهت، یعنی در پاسخ به *Wohin?* (به
      کجا؟)، تغییر می‌کنند: *hier* می‌شود *hierhin* یا *hierher*، *da* و
      *dort* می‌شوند *dahin* و *dorthin*، و بقیه با *nach* می‌آیند: *nach oben*
      و *nach links*. *hin* جهتِ دور شدن از گوینده را نشان می‌دهد و *her* جهتِ
      نزدیک شدن به گوینده را: *Komm her!* پرسش *Wohin?* اغلب دو تکه می‌شود:
      *Wo gehst du hin?* این دو با *ein*، *aus*، *auf* و *unter* واژه‌هایی
      مانند *herein*، *hinaus*، *herauf* و *hinunter* می‌سازند. در گفتار
      روزمره شکل کوتاه آن‌ها به کار می‌رود که برای هر دو جهت یکی است: *rein*،
      *raus*، *rauf* و *runter*. وقتی پیشوند فعل باشند، به پایان جمله
      می‌روند: *Komm sofort runter!*
  de:
    rule: >
      Die Ortsadverbien *hier*, *da*, *dort*, *oben*, *unten*, *links* und
      *rechts* antworten auf *Wo?*. Bei einer Richtung, auf die Frage
      *Wohin?*, ändern sie sich: *hier* wird zu *hierhin* oder *hierher*, *da*
      und *dort* werden zu *dahin* und *dorthin*, und die anderen bekommen
      *nach*: *nach oben*, *nach links*. *Hin* heißt: weg vom Sprecher. *Her*
      heißt: zum Sprecher. *Komm her!* Die Frage *Wohin?* teilt man oft: *Wo
      gehst du hin?* Mit *ein*, *aus*, *auf* und *unter* gibt es *herein*,
      *hinaus*, *herauf*, *hinunter* und so weiter. Im Alltag sagt man sie kurz,
      und für beide Richtungen gleich: *rein*, *raus*, *rauf*, *runter*. Als
      Präfix von einem Verb stehen sie am Ende: *Komm sofort runter!*

# Three rows: hin and her seen from the speaker, into and out of a house,
# up and down. German only, so no labels.
diagrams:
  - caption:
      en: >
        *Her* comes towards the speaker (*ich*), *hin* goes away. *Rein* goes
        into the house, *raus* out of it. *Nach oben* or *rauf* goes up, *nach
        unten* or *runter* goes down.
      fa: >
        *her* به سوی گوینده (*ich*) می‌آید و *hin* از او دور می‌شود. *rein* به
        درون خانه می‌رود و *raus* بیرون از آن. *nach oben* یا *rauf* به بالا
        می‌رود و *nach unten* یا *runter* به پایین.
      de: >
        *Her* kommt zum Sprecher (*ich*), *hin* geht weg. *Rein* geht ins Haus,
        *raus* aus dem Haus. *Nach oben* oder *rauf* geht nach oben, *nach
        unten* oder *runter* nach unten.
