      - [draußen, nach draußen]
    explanation:
      en: "Each *Wo?* word and its *Wohin?* form: *hier*, *hierhin*; *dort*, *dorthin*; *oben*, *nach oben*; *draußen*, *nach draußen*."
      fa: "هر واژهٔ *Wo?* و شکل *Wohin?* آن: *hier* و *hierhin*؛ *dort* و *dorthin*؛ *oben* و *nach oben*؛ *draußen* و *nach draußen*."
      de: "Jedes *Wo?*-Wort und seine *Wohin?*-Form: *hier*, *hierhin*; *dort*, *dorthin*; *oben*, *nach oben*; *draußen*, *nach draußen*."

