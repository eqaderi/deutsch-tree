    type: gap-fill
    prompt: Der Aufzug fährt ___.
    options: [nach oben, oben, dort]
    answer: nach oben
    explanation:
      en: "*Fahren* is a movement (*Wohin?*): *oben* becomes *nach oben*."
      fa: "*fahren* حرکت است (*Wohin?*): *oben* می‌شود *nach oben*."
      de: "*Fahren* ist eine Bewegung (*Wohin?*): *oben* wird zu *nach oben*."
  - id: gap-2
    type: gap-fill
    prompt: Mein Zimmer ist ganz ___, unter dem Dach.
    options: [oben, nach oben, rauf]
    answer: oben
    explanation:
      en: "*Sein* says where (*Wo?*): *oben*, with no *nach*."
      fa: "*sein* جای چیزی را می‌گوید (*Wo?*): *oben*، بدون *nach*."
      de: "*Sein* sagt, wo etwas ist (*Wo?*): *oben*, ohne *nach*."
  - id: gap-3
    type: gap-fill
    prompt: Kennst du das neue Café? Wir gehen heute Abend ___.
    options: [dorthin, dort, hier]
    answer: dorthin
    explanation:
      en: "*Gehen* to a place is *Wohin?*: *dort* becomes *dorthin*."
      fa: "*gehen* به جایی، پاسخ *Wohin?* است: *dort* می‌شود *dorthin*."
      de: "*Gehen* zu einem Ort: *Wohin?*. *Dort* wird zu *dorthin*."
  - id: gap-4
    type: gap-fill
    prompt: Es regnet. Komm schnell ___!
    options: [rein, drinnen, hier]
    answer: rein
    explanation:
      en: "A movement into the house: *rein* (*herein*). *Drinnen* says where."
      fa: "حرکت به درون خانه: *rein* (*herein*). *drinnen* جای چیزی را می‌گوید."
      de: "Eine Bewegung ins Haus: *rein* (*herein*). *Drinnen* sagt, wo etwas ist."
  - id: gap-5
    type: gap-fill
    prompt: Die Kinder spielen ___ im Garten.
    options: [draußen, raus, nach draußen]
    answer: draußen
    explanation:
      en: "Playing stays in one place (*Wo?*): *draußen*."
      fa: "بازی در یک جا می‌ماند (*Wo?*): *draußen*."
      de: "Beim Spielen bleibt man an einem Ort (*Wo?*): *draußen*."
  - id: gap-6
    type: gap-fill
    prompt: Gehen Sie an der Kreuzung ___ links.
    options: [nach, zu, in]
    answer: nach
    explanation:
      en: "A direction with *links* takes *nach*: *nach links*."
      fa: "جهت با *links* با *nach* می‌آید: *nach links*."
      de: "Eine Richtung mit *links*: *nach links*."
  - id: choice-1
    type: multiple-choice
    prompt: "Jemand klopft an die Tür. Sie rufen: „___!“"
    options: [Herein, Hinein, Hinaus]
    answer: Herein
    explanation:
      en: "The visitor comes into the room, towards you: *her* + *ein*, *Herein!*"
      fa: "مهمان به درون اتاق و به سوی شما می‌آید: *her* + *ein*، یعنی *Herein!*"
      de: "Der Besuch kommt ins Zimmer, zu Ihnen: *her* + *ein*, *Herein!*"
  - id: choice-2
    type: multiple-choice
    prompt: "Du bist oben am Fenster. Dein Freund ist unten auf der Straße. Du rufst: „Komm doch ___!“"
    options: [rauf, runter, raus]
    answer: rauf
    explanation:
      en: "Your friend should come up to you: *rauf* (*herauf*)."
      fa: "دوستت باید بالا پیش تو بیاید: *rauf* (*herauf*)."
      de: "Dein Freund soll zu dir nach oben kommen: *rauf* (*herauf*)."
  - id: choice-3
    type: multiple-choice
    prompt: Wo ist die Toilette? – ___
    options: [Dort links., Dorthin., Nach links.]
    answer: Dort links.
    explanation:
      en: "*Wo?* asks where, so the adverbs without *hin* or *nach*: *dort links*."
      fa: "*Wo?* جای چیزی را می‌پرسد، پس قیدها بدون *hin* و *nach* می‌آیند: *dort links*."
      de: "*Wo?* fragt nach dem Ort. Darum ohne *hin* und ohne *nach*: *dort links*."
  - id: true-1
    type: true-false
    prompt: Stell die Tasche bitte hierhin.
    answer: true
    explanation:
      en: "*Stellen* is a movement (*Wohin?*): *hierhin*. The sentence is correct."
      fa: "*stellen* حرکت است (*Wohin?*): *hierhin*. جمله درست است."
      de: "*Stellen* ist eine Bewegung (*Wohin?*): *hierhin*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Ich fahre nächste Woche nach Hamburg. Fährst du auch dort?
    answer: false
    explanation:
      en: "*Fahren* to a place is *Wohin?*: *Fährst du auch dorthin?*"
      fa: "*fahren* به جایی، پاسخ *Wohin?* است: *Fährst du auch dorthin?*"
      de: "*Fahren* zu einem Ort: *Wohin?*. *Fährst du auch dorthin?*"
  - id: true-3
    type: true-false
    prompt: Der Aufzug fährt nach unten.
    answer: true
    explanation:
      en: "A direction: *nach unten*. The sentence is correct."
      fa: "جهت: *nach unten*. جمله درست است."
      de: "Eine Richtung: *nach unten*. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Ich gehe kurz oben und hole meine Jacke.
    answer: false
    explanation:
      en: "*Gehen* is a movement (*Wohin?*): *nach oben* or *rauf*."
      fa: "*gehen* حرکت است (*Wohin?*): *nach oben* یا *rauf*."
      de: "*Gehen* ist eine Bewegung (*Wohin?*): *nach oben* oder *rauf*."
  - id: true-5
    type: true-false
    prompt: Wo gehst du hin?
    answer: true
    explanation:
      en: "*Wohin?* is often split: *Wo … hin?* The sentence is correct."
      fa: "*Wohin?* اغلب دو تکه می‌شود: *Wo … hin?* جمله درست است."
      de: "*Wohin?* teilt man oft: *Wo … hin?* Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
