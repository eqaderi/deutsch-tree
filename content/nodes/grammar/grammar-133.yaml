table:
  columns:
    - { en: "*Wo?*", fa: "*Wo?*", de: "*Wo?*" }
    - { en: "*Wohin?*", fa: "*Wohin?*", de: "*Wohin?*" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [hier, "hierhin, hierher", Komm bitte hierher!]
    - [da / dort, "dahin, dorthin", Wir fahren morgen dorthin.]
    - [oben, "nach oben, rauf", Der Aufzug fährt nach oben.]
    - [unten, "nach unten, runter", Komm sofort runter!]
    - [links / rechts, nach links / nach rechts, Gehen Sie dann nach rechts.]
    - [drinnen, "rein (herein, hinein)", Komm doch rein!]
    - [draußen, "raus (heraus, hinaus)", Die Kinder gehen raus.]

examples:
  - de: Komm sofort runter!
    en: Come down at once!
    fa: همین حالا بیا پایین!
  - de: Der Aufzug fährt nach oben.
    en: The lift is going up.
    fa: آسانسور بالا می‌رود.
  - de: Komm bitte hierher!
    en: Please come here!
    fa: بیا این‌جا!
  - de: Stell den Koffer bitte hierhin.
    en: Please put the suitcase here.
    fa: چمدان را این‌جا بگذار.
  - de: Das Konzert ist im Park. Wir gehen auch dorthin.
    en: The concert is in the park. We are going there too.
    fa: کنسرت در پارک است. ما هم به آن‌جا می‌رویم.
  - de: Wo gehst du hin? – Zum Bäcker.
    en: Where are you going? – To the baker's.
    fa: کجا می‌روی؟ – به نانوایی.
  - de: An der Ampel gehen Sie nach links.
    en: At the traffic lights go left.
    fa: سر چراغ راهنمایی به چپ بروید.
  - de: Es klopft. – Herein!
    en: Someone is knocking. – Come in!
    fa: کسی در می‌زند. – بفرمایید!
  - de: Es ist kalt. Komm doch rein!
    en: It's cold. Do come in!
    fa: هوا سرد است. بیا داخل!
  - de: Die Kinder gehen raus und spielen im Garten.
    en: The children go out and play in the garden.
    fa: بچه‌ها بیرون می‌روند و در باغ بازی می‌کنند.

mistakes:
  - wrong: Ich gehe oben.
    right: Ich gehe nach oben.
    why:
      en: "*Oben* says where (*Wo?*). For a direction (*Wohin?*) it takes *nach*: *nach oben*."
      fa: "*oben* جای چیزی را می‌گوید (*Wo?*). برای جهت (*Wohin?*) با *nach* می‌آید: *nach oben*."
      de: "*Oben* sagt, wo etwas ist (*Wo?*). Für eine Richtung (*Wohin?*) sagt man *nach oben*."
  - wrong: Wir fahren morgen dort.
    right: Wir fahren morgen dorthin.
    why:
      en: "*Fahren* goes somewhere (*Wohin?*), so *dort* becomes *dorthin*."
      fa: "*fahren* به جایی رفتن است (*Wohin?*)، پس *dort* می‌شود *dorthin*."
      de: "*Fahren* ist eine Bewegung (*Wohin?*). Darum wird *dort* zu *dorthin*."
  - wrong: Stell den Koffer bitte hier.
    right: Stell den Koffer bitte hierhin.
    why:
      en: "*Stellen* is a movement to a place (*Wohin?*), so *hier* becomes *hierhin*."
      fa: "*stellen* حرکت به یک جاست (*Wohin?*)، پس *hier* می‌شود *hierhin*."
      de: "*Stellen* ist eine Bewegung (*Wohin?*). Darum wird *hier* zu *hierhin*."
  - wrong: Wo fährst du im Sommer?
    right: Wohin fährst du im Sommer?
    why:
      en: "*Fahren* to a place needs *Wohin?*, or the split form *Wo fährst du im Sommer hin?*"
      fa: "برای رفتن به جایی *Wohin?* لازم است، یا شکل دو تکهٔ آن: *Wo fährst du im Sommer hin?*"
      de: "Für eine Fahrt zu einem Ort fragt man *Wohin?* oder geteilt: *Wo fährst du im Sommer hin?*"
  - wrong: Die Kinder spielen raus.
    right: Die Kinder spielen draußen.
    why:
      en: "Playing stays in one place (*Wo?*): *draußen*. *Raus* is the movement out: *Die Kinder gehen raus.*"
      fa: "بازی در یک جا می‌ماند (*Wo?*): *draußen*. *raus* حرکت به بیرون است: *Die Kinder gehen raus.*"
      de: "Beim Spielen bleibt man an einem Ort (*Wo?*): *draußen*. *Raus* ist die Bewegung: *Die Kinder gehen raus.*"

questions:
