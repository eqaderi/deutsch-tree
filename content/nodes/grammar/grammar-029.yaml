prerequisites: [grammar-026, grammar-146]
title:
  en: "*dürfen* / *nicht dürfen*"
  fa: "*dürfen* و *nicht dürfen*"
  de: "*dürfen* / *nicht dürfen*"

explanations:
  en:
    rule: >
      *Dürfen* says that something is allowed: *Darf ich das Fenster
      aufmachen?* With *nicht* it says that something is forbidden: *Sie
      dürfen hier nicht rauchen.* *Nicht* stands before the infinitive at the
      end. Rules and signs often use *man* (with the form of *er*): *Hier darf
      man nicht parken.* Like every modal verb, *dürfen* is conjugated in
      position 2 and the second verb goes to the end as an infinitive. *Ich*
      and *er* / *sie* / *es* have the same form, *darf*, with no ending, and
      the vowel changes to *a* in the singular. When the meaning is clear, the
      infinitive can be dropped: *Darf ich heute ins Kino?*
  fa:
    rule: >
      *dürfen* می‌گوید کاری مجاز است و اجازهٔ آن هست: *Darf ich das Fenster
      aufmachen?* همراه با *nicht* می‌گوید کاری ممنوع است: *Sie dürfen hier
      nicht rauchen.* در این حالت *nicht* پیش از مصدرِ پایان جمله می‌آید.
      قاعده‌ها و تابلوها اغلب با *man* بیان می‌شوند که صورت سوم‌شخص مفرد
      می‌گیرد: *Hier darf man nicht parken.* مانند همهٔ فعل‌های وجهی، *dürfen*
      صرف می‌شود و در جایگاه دوم می‌آید و فعل دوم به شکل مصدر به پایان جمله
      می‌رود. *ich* و *er* / *sie* / *es* صورت یکسان *darf* را دارند، بدون
      شناسه، و در مفرد واکهٔ *ü* به *a* تبدیل می‌شود. اگر معنا روشن باشد،
      مصدر را می‌توان انداخت: *Darf ich heute ins Kino?*
  de:
    rule: >
      Mit *dürfen* sagt man: Etwas ist erlaubt. *Darf ich das Fenster
      aufmachen?* Mit *nicht* heißt es: Etwas ist verboten. *Sie dürfen hier
      nicht rauchen.* *Nicht* steht vor dem Infinitiv am Ende. Regeln und
      Schilder sagen oft *man* (mit der Form von *er*): *Hier darf man nicht
      parken.* *Dürfen* ist konjugiert und steht auf Position 2, das zweite
      Verb steht im Infinitiv am Ende. *Ich* und *er* / *sie* / *es* haben die
      gleiche Form *darf*, ohne Endung. Ist die Bedeutung klar, kann der
      Infinitiv fehlen: *Darf ich heute ins Kino?*

table:
  columns:
    - { en: Person, fa: شخص, de: Person }
