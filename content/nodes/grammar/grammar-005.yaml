table:
  columns:
    - { en: Infinitive, fa: مصدر, de: Infinitiv }
    - { en: Position 1, fa: جایگاه اول, de: Position 1 }
    - { en: "Position 2: verb", fa: "جایگاه دوم: فعل", de: "Position 2: Verb" }
    - { en: Middle, fa: میانهٔ جمله, de: Mitte }
    - { en: "End: prefix", fa: "پایان جمله: پیشوند", de: "Ende: Präfix" }
  rows:
    - [anfangen, Der Kurs, fängt, um 9 Uhr, an.]
    - [aufstehen, Ich, stehe, um 7 Uhr, auf.]
    - [einkaufen, Wir, kaufen, heute, ein.]
    - [anrufen, Anna, ruft, ihre Mutter, an.]
    - [fernsehen, Mein Sohn, sieht, am Abend, fern.]
