      fa: >
        *anfangen* دو بخش می‌شود: بخش فعلی *fängt* به جایگاه دوم می‌رود و
        پیشوند *an* به پایان جمله.
      de: >
        *anfangen* teilt sich: *fängt* steht auf Position 2, das Präfix *an*
