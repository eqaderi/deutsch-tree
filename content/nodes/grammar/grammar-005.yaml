# Grammar list row 5.
id: grammar-005
kind: grammar
level: A1
chapter: a1-verb-patterns
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-001, grammar-139]
title:
  en: "*Trennbare Verben* in *Präsens*"
  fa: "فعل‌های جداشدنی در زمان حال"
  de: "Trennbare Verben im Präsens"

explanations:
  en:
    rule: >
      A separable verb (*trennbares Verb*) is a verb with a stressed prefix
      such as *an-*, *auf-*, *aus-*, *ein-*, *mit-*, *zu-* or *fern-*. In a
      sentence the verb splits: the conjugated verb stands in its usual place,
      position 2 in a statement, and the prefix goes to the very end:
      *anfangen*, *Der Kurs fängt um 9 Uhr an.* The verb part takes the
      normal endings and vowel changes (*du fängst … an*). In the dictionary
      and in the infinitive the verb is one word.
  fa:
    rule: >
      فعل جداشدنی (*trennbares Verb*) فعلی است با پیشوندی تکیه‌دار مانند
      *an-*، *auf-*، *aus-*، *ein-*، *mit-*، *zu-* یا *fern-*. این فعل در جمله
      دو بخش می‌شود: فعل صرف‌شده در جای همیشگی خود می‌آید، یعنی در جملهٔ خبری
      در جایگاه دوم، و پیشوند به پایان جمله می‌رود: *anfangen*، *Der Kurs
      fängt um 9 Uhr an.* بخش فعلی همان شناسه‌ها و تغییر واکه‌های معمول را
      می‌گیرد (*du fängst … an*). در فرهنگ لغت و در مصدر، فعل یک واژه است.
  de:
    rule: >
      Ein trennbares Verb hat ein betontes Präfix, zum Beispiel *an-*,
      *auf-*, *aus-*, *ein-*, *mit-*, *zu-* oder *fern-*. Im Satz teilt sich
      das Verb: Das konjugierte Verb steht an seinem normalen Platz, im
      Aussagesatz auf Position 2. Das Präfix steht ganz am Ende: *anfangen*,
      *Der Kurs fängt um 9 Uhr an.* Im Wörterbuch und im Infinitiv ist das
      Verb ein Wort.

# The verb splits: the verb part to position 2, the prefix to the end.
