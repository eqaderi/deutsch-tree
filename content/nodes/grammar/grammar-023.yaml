    prompt: Gestern ___ (anrufen) mich mein Chef dreimal an.
    answers: [rief]
    explanation:
      en: "*Anrufen* is separable and irregular: *rief … an*. The *an* is already at the end."
      fa: "*anrufen* جداشدنی و بی‌قاعده است: *rief … an*. *an* از پیش در پایان جمله هست."
      de: "*Anrufen* ist trennbar und unregelmäßig: *rief … an*. Das *an* steht schon am Ende."
