    type: typed-gap-fill
    prompt: Damals ___ (sprechen) ihr noch kein Deutsch.
    answers: [spracht]
    explanation:
      en: "*Sprechen* is irregular: *sprach*, and *-t* with *ihr*: *spracht*."
      fa: "*sprechen* بی‌قاعده است: *sprach*، و با *ihr* *-t*: *spracht*."
      de: "*Sprechen* ist unregelmäßig: *sprach*, bei *ihr* mit *-t*: *spracht*."
  - id: typed-gap-6
    type: typed-gap-fill
    prompt: Früher ___ (antworten) du immer sofort.
    answers: [antwortetest]
    explanation:
      en: "The stem *antwort-* ends in *-t*, so *-ete*, and *-st* with *du*: *antwortetest*."
      fa: "بن *antwort-* به *-t* ختم می‌شود، پس *-ete*، و با *du* *-st*: *antwortetest*."
      de: "Der Stamm *antwort-* endet auf *-t*: *-ete*, bei *du* mit *-st*: *antwortetest*."
  - id: typed-1
    type: typed-answer
    prompt: "Präteritum: er nimmt"
    answers: [er nahm, nahm]
    explanation:
      en: "*Nehmen* is irregular: *nehmen*, *nahm*, *hat genommen*."
      fa: "*nehmen* بی‌قاعده است: *nehmen*، *nahm*، *hat genommen*."
      de: "*Nehmen* ist unregelmäßig: *nehmen*, *nahm*, *hat genommen*."
  - id: typed-2
    type: typed-answer
    prompt: "Präteritum: ich weiß"
    answers: [ich wusste, wusste]
