examples:
  - de: Als ich klein war, wohnten wir in einem Dorf.
    en: When I was little, we lived in a village.
    fa: وقتی کوچک بودم، در روستایی زندگی می‌کردیم.
  - de: Meine Großmutter arbeitete vierzig Jahre in einer Bäckerei.
    en: My grandmother worked in a bakery for forty years.
    fa: مادربزرگم چهل سال در یک نانوایی کار کرد.
  - de: Er schrieb ihr jeden Tag einen Brief.
    en: He wrote her a letter every day.
    fa: او هر روز برایش نامه‌ای می‌نوشت.
  - de: Plötzlich stand ein Mann vor der Tür.
    en: Suddenly a man was standing at the door.
    fa: ناگهان مردی جلوی در ایستاده بود.
  - de: Der Zug fuhr pünktlich um acht Uhr ab.
    en: The train left on time at eight o'clock.
    fa: قطار سر وقت، ساعت هشت حرکت کرد.
  - de: Nach dem Essen tranken wir noch einen Kaffee.
    en: After the meal we had a coffee as well.
    fa: بعد از غذا یک قهوه هم خوردیم.
  - de: Ich wusste nicht, dass du Geburtstag hattest.
    en: I didn't know it was your birthday.
    fa: نمی‌دانستم که تولدت بود.
  - de: Sie brachte ihren Kindern ein Geschenk mit.
    en: She brought her children a present.
    fa: او برای بچه‌هایش هدیه‌ای آورد.
  - de: Damals kannte ich in der Stadt niemanden.
    en: Back then I didn't know anyone in the town.
    fa: آن زمان در آن شهر کسی را نمی‌شناختم.
  - de: Die Kinder schliefen schon, als wir nach Hause kamen.
    en: The children were already asleep when we got home.
    fa: وقتی به خانه رسیدیم، بچه‌ها خواب بودند.
  - de: Der Film fing um neun Uhr an und dauerte zwei Stunden.
    en: The film started at nine and lasted two hours.
    fa: فیلم ساعت نه شروع شد و دو ساعت طول کشید.

mistakes:
  - wrong: Er bringte mir Blumen.
    right: Er brachte mir Blumen.
    why:
      en: "*Bringen* is a mixed verb: a new vowel and *-te*: *brachte*."
      fa: "*bringen* فعل آمیخته است: هم واکهٔ تازه و هم *-te*: *brachte*."
      de: "*Bringen* ist gemischt: neuer Vokal und *-te*: *brachte*."
  - wrong: Letzten Sommer fahrten wir ans Meer.
    right: Letzten Sommer fuhren wir ans Meer.
    why:
      en: "*Fahren* is irregular: the new stem *fuhr*, no *-te*, and *-en* with *wir*."
      fa: "*fahren* بی‌قاعده است: بن تازهٔ *fuhr*، بدون *-te*، و با *wir* شناسهٔ *-en*."
      de: "*Fahren* ist unregelmäßig: neuer Stamm *fuhr*, kein *-te*, bei *wir* mit *-en*."
  - wrong: Sie arbeitte bis spät am Abend.
    right: Sie arbeitete bis spät am Abend.
    why:
      en: "The stem *arbeit-* ends in *-t*, so it takes *-ete*: *arbeitete*."
      fa: "بن *arbeit-* به *-t* ختم می‌شود، پس *-ete* می‌گیرد: *arbeitete*."
      de: "Der Stamm *arbeit-* endet auf *-t*. Darum *-ete*: *arbeitete*."
  - wrong: Der Film anfing um acht Uhr.
    right: Der Film fing um acht Uhr an.
    why:
      en: "*Anfangen* is separable: *fing* stands in position 2 and *an* goes to the end."
      fa: "*anfangen* فعل جداشدنی است: *fing* در جایگاه دوم می‌آید و *an* به پایان جمله می‌رود."
      de: "*Anfangen* ist trennbar: *fing* steht auf Position 2, *an* am Ende."
  - wrong: Ich schriebte meiner Mutter eine Karte.
    right: Ich schrieb meiner Mutter eine Karte.
    why:
      en: "An irregular verb never takes *-te*: *schreiben*, *schrieb*."
      fa: "فعل بی‌قاعده هیچ‌گاه *-te* نمی‌گیرد: *schreiben*، *schrieb*."
      de: "Ein unregelmäßiges Verb bekommt nie *-te*: *schreiben*, *schrieb*."

attemptSize: 12

questions:
  - id: gap-1
    type: gap-fill
    prompt: Früher ___ meine Eltern in einem kleinen Dorf.
    options: [wohnen, wohnte, wohnten]
    answer: wohnten
    explanation:
      en: "*Wohnen* is regular: *wohn-* + *-te*, and *-n* for *meine Eltern* (*sie*, plural): *wohnten*."
      fa: "*wohnen* باقاعده است: *wohn-* + *-te*، و برای *meine Eltern* (سوم‌شخص جمع) *-n*: *wohnten*."
      de: "*Wohnen* ist regelmäßig: *wohn-* + *-te*, bei *meine Eltern* (*sie*, Plural) mit *-n*: *wohnten*."
  - id: gap-2
    type: gap-fill
    prompt: Gestern ___ sie bis spät in der Nacht.
    options: [arbeitte, arbeitete, arbeitet]
    answer: arbeitete
    explanation:
      en: "*Gestern* asks for the past, and the stem *arbeit-* ends in *-t*, so *-ete*: *arbeitete*."
      fa: "*gestern* گذشته را می‌خواهد و بن *arbeit-* به *-t* ختم می‌شود، پس *-ete*: *arbeitete*."
      de: "*Gestern* ist Vergangenheit, und der Stamm *arbeit-* endet auf *-t*. Darum *-ete*: *arbeitete*."
  - id: gap-3
    type: gap-fill
    prompt: Letzten Sommer ___ wir mit dem Zug nach Italien.
    options: [fahrten, fuhren, fuhrten]
    answer: fuhren
    explanation:
      en: "*Fahren* is irregular: *fuhr*, no *-te*, and *-en* with *wir*: *fuhren*."
      fa: "*fahren* بی‌قاعده است: *fuhr*، بدون *-te*، و با *wir* *-en*: *fuhren*."
      de: "*Fahren* ist unregelmäßig: *fuhr*, kein *-te*, bei *wir* mit *-en*: *fuhren*."
  - id: gap-4
    type: gap-fill
    prompt: Ich ___ nicht, dass du krank warst.
    options: [wusste, wisste, weißte]
    answer: wusste
    explanation:
      en: "*Wissen* is a mixed verb: *wusste*, with a new vowel and *-te*."
      fa: "*wissen* فعل آمیخته است: *wusste*، با واکهٔ تازه و *-te*."
      de: "*Wissen* ist gemischt: *wusste*, mit neuem Vokal und *-te*."
  - id: gap-5
    type: gap-fill
    prompt: Zum Geburtstag ___ er mir Blumen.
    options: [bringte, gebracht, brachte]
    answer: brachte
    explanation:
      en: "*Bringen* is a mixed verb: *brachte*. *Gebracht* is the *Partizip II* and needs *hat*."
      fa: "*bringen* فعل آمیخته است: *brachte*. *gebracht* صفت مفعولی است و *hat* لازم دارد."
      de: "*Bringen* ist gemischt: *brachte*. *Gebracht* ist das Partizip II und braucht *hat*."
  - id: choice-1
    type: multiple-choice
    prompt: Der Film ___ um acht Uhr an.
    options: [fing, anfing, fang]
    answer: fing
    explanation:
      en: "*Anfangen* is separable and irregular: *fing … an*, with *an* at the end."
      fa: "*anfangen* جداشدنی و بی‌قاعده است: *fing … an*، و *an* در پایان جمله."
      de: "*Anfangen* ist trennbar und unregelmäßig: *fing … an*, *an* steht am Ende."
  - id: choice-2
    type: multiple-choice
    prompt: Plötzlich ___ ein Mann vor der Tür.
    options: [stehte, stand, standete]
    answer: stand
    explanation:
      en: "*Stehen* is irregular: *stand*, with no *-te* and no ending."
      fa: "*stehen* بی‌قاعده است: *stand*، بدون *-te* و بدون شناسه."
      de: "*Stehen* ist unregelmäßig: *stand*, ohne *-te* und ohne Endung."
  - id: choice-3
    type: multiple-choice
    prompt: Warum ___ du gestern nicht ans Telefon?
    options: [gingt, gehtest, gingst]
    answer: gingst
    explanation:
      en: "*Gehen* is irregular: *ging*, and *-st* with *du*: *gingst*. *Gingt* goes with *ihr*."
      fa: "*gehen* بی‌قاعده است: *ging*، و با *du* *-st*: *gingst*. *gingt* با *ihr* می‌آید."
      de: "*Gehen* ist unregelmäßig: *ging*, bei *du* mit *-st*: *gingst*. *Gingt* sagt man bei *ihr*."
  - id: choice-4
    type: multiple-choice
    prompt: nehmen – ___ – hat genommen
    options: [nehmte, nahm, nimmte]
    answer: nahm
    explanation:
      en: "The principal parts of *nehmen* are *nehmen*, *nahm*, *hat genommen*."
      fa: "سه صورت اصلی *nehmen* این‌هاست: *nehmen*، *nahm*، *hat genommen*."
      de: "Die Stammformen von *nehmen* sind *nehmen*, *nahm*, *hat genommen*."
  - id: choice-5
    type: multiple-choice
    prompt: denken – ___ – hat gedacht
    options: [dachte, denkte, dacht]
    answer: dachte
    explanation:
      en: "*Denken* is a mixed verb: *denken*, *dachte*, *hat gedacht*."
      fa: "*denken* فعل آمیخته است: *denken*، *dachte*، *hat gedacht*."
      de: "*Denken* ist gemischt: *denken*, *dachte*, *hat gedacht*."
  - id: true-1
    type: true-false
    prompt: Nach dem Essen tranken wir noch einen Kaffee.
    answer: true
    explanation:
      en: "*Trinken* is irregular: *trank*, and *-en* with *wir*. The sentence is correct."
      fa: "*trinken* بی‌قاعده است: *trank*، و با *wir* *-en*. جمله درست است."
      de: "*Trinken* ist unregelmäßig: *trank*, bei *wir* mit *-en*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Gestern schriebte ich meiner Oma einen Brief.
    answer: false
    explanation:
      en: "*Schreiben* is irregular and takes no *-te*: *Gestern schrieb ich meiner Oma einen Brief.*"
      fa: "*schreiben* بی‌قاعده است و *-te* نمی‌گیرد: *Gestern schrieb ich meiner Oma einen Brief.*"
      de: "*Schreiben* ist unregelmäßig, ohne *-te*: *Gestern schrieb ich meiner Oma einen Brief.*"
  - id: true-3
    type: true-false
    prompt: Er öffnete langsam die Tür.
    answer: true
    explanation:
      en: "The stem *öffn-* is hard to say with *-te* alone, so it takes *-ete*: *öffnete*. The sentence is correct."
      fa: "بن *öffn-* با *-te* تنها به‌سختی گفته می‌شود، پس *-ete* می‌گیرد: *öffnete*. جمله درست است."
      de: "Der Stamm *öffn-* bekommt *-ete*, sonst kann man ihn schwer sprechen: *öffnete*. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Der Zug abfuhr pünktlich um acht Uhr.
    answer: false
    explanation:
      en: "*Abfahren* is separable: *Der Zug fuhr pünktlich um acht Uhr ab.*"
      fa: "*abfahren* فعل جداشدنی است: *Der Zug fuhr pünktlich um acht Uhr ab.*"
      de: "*Abfahren* ist trennbar: *Der Zug fuhr pünktlich um acht Uhr ab.*"
  - id: error-1
    type: find-error
    prompt: Sie bringte ihrer Mutter einen Kuchen.
    answer: bringte
    explanation:
      en: "*Bringen* is a mixed verb: *Sie brachte ihrer Mutter einen Kuchen.*"
      fa: "*bringen* فعل آمیخته است: *Sie brachte ihrer Mutter einen Kuchen.*"
      de: "*Bringen* ist gemischt: *Sie brachte ihrer Mutter einen Kuchen.*"
  - id: error-2
    type: find-error
    prompt: Die Kinder spielte den ganzen Tag im Garten.
    answer: spielte
    explanation:
      en: "*Die Kinder* is *sie* (plural), so *-n* follows the *-te*: *Die Kinder spielten den ganzen Tag im Garten.*"
      fa: "*die Kinder* سوم‌شخص جمع است (*sie*)، پس پس از *-te* شناسهٔ *-n* می‌آید: *Die Kinder spielten den ganzen Tag im Garten.*"
      de: "*Die Kinder* ist *sie* (Plural). Nach *-te* kommt *-n*: *Die Kinder spielten den ganzen Tag im Garten.*"
  - id: error-3
    type: find-error
    prompt: Er arbeitte zehn Jahre bei der Post.
    answer: arbeitte
    explanation:
      en: "The stem *arbeit-* ends in *-t*, so *-ete*: *Er arbeitete zehn Jahre bei der Post.*"
      fa: "بن *arbeit-* به *-t* ختم می‌شود، پس *-ete*: *Er arbeitete zehn Jahre bei der Post.*"
      de: "Der Stamm *arbeit-* endet auf *-t*. Darum *-ete*: *Er arbeitete zehn Jahre bei der Post.*"
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Früher ___ (spielen) wir jeden Tag Fußball.
    answers: [spielten]
    explanation:
      en: "*Spielen* is regular: *spiel-* + *-te* + *-n* with *wir*: *spielten*."
      fa: "*spielen* باقاعده است: *spiel-* + *-te* + *-n* با *wir*: *spielten*."
      de: "*Spielen* ist regelmäßig: *spiel-* + *-te* + *-n* bei *wir*: *spielten*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Letzte Nacht ___ (schlafen) ich sehr schlecht.
    answers: [schlief]
    explanation:
      en: "*Schlafen* is irregular: *schlafen*, *schlief*, *hat geschlafen*. With *ich* there is no ending."
      fa: "*schlafen* بی‌قاعده است: *schlafen*، *schlief*، *hat geschlafen*. با *ich* شناسه‌ای نمی‌آید."
      de: "*Schlafen* ist unregelmäßig: *schlafen*, *schlief*, *hat geschlafen*. Bei *ich* keine Endung."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Letztes Jahr ___ (fliegen) meine Schwester nach Kanada.
    answers: [flog]
    explanation:
      en: "*Fliegen* is irregular: *fliegen*, *flog*, *ist geflogen*."
      fa: "*fliegen* بی‌قاعده است: *fliegen*، *flog*، *ist geflogen*."
      de: "*Fliegen* ist unregelmäßig: *fliegen*, *flog*, *ist geflogen*."
  - id: typed-gap-4
