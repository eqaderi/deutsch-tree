# Grammar list row 23. sein, haben and the modal verbs (rows 13, 18) and the
# five very frequent verbs of row 19 come earlier; this node gives the whole
# system and the principal parts.
id: grammar-023
kind: grammar
level: B1
chapter: b1-tenses
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-016, grammar-019]
title:
  en: "*Präteritum* of all verbs, with principal parts"
  fa: "گذشتهٔ ساده (*Präteritum*) همهٔ فعل‌ها، با سه صورت اصلی فعل"
  de: "Präteritum von allen Verben, mit den Stammformen"

explanations:
  en:
    rule: >
      The *Präteritum* is the tense of written stories, reports and life
      stories. A regular verb adds *-te* to its stem, then the ending: *ich
      machte*, *du machtest*, *wir machten*, *ihr machtet*. After a stem in
      *-t* or *-d* it is *-ete*: *arbeitete*, *redete*. An irregular verb
      takes no *-te* but has a new stem: *gehen*, *ging*; *fahren*, *fuhr*.
      A mixed verb does both, a new vowel and *-te*: *bringen*, *brachte*;
      *denken*, *dachte*; *wissen*, *wusste*. With *ich* and *er* / *sie* /
      *es* nothing follows the *-te* or the new stem (*ich ging*, *er
      machte*). The prefix of a separable verb goes to the end: *Der Zug fuhr
      um acht Uhr ab.* No rule tells you the new stem, so learn each
      irregular verb with its three principal parts: infinitive,
      *Präteritum* and *Partizip II* with its auxiliary (*gehen*, *ging*,
      *ist gegangen*).
  fa:
    rule: >
      گذشتهٔ ساده (*Präteritum*) زمان داستان، گزارش و زندگی‌نامهٔ نوشته‌شده
      است. فعل باقاعده به بن خود *-te* و سپس شناسه می‌افزاید: *ich machte*،
      *du machtest*، *wir machten*، *ihr machtet*. اگر بن به *-t* یا *-d*
      ختم شود، *-ete* می‌آید: *arbeitete*، *redete*. فعل بی‌قاعده *-te*
      نمی‌گیرد، بلکه بن تازه‌ای دارد: *gehen*، *ging*؛ *fahren*، *fuhr*. فعل
      آمیخته هر دو را دارد، هم واکهٔ تازه و هم *-te*: *bringen*، *brachte*؛
      *denken*، *dachte*؛ *wissen*، *wusste*. با *ich* و *er/sie/es* پس از
      *-te* یا بن تازه شناسه‌ای نمی‌آید (*ich ging*، *er machte*). پیشوند فعل
      جداشدنی به پایان جمله می‌رود: *Der Zug fuhr um acht Uhr ab.* هیچ قاعده‌ای
      بن تازه را نشان نمی‌دهد؛ از این رو هر فعل بی‌قاعده را با سه صورت اصلی‌اش
      از بر کنید: مصدر، گذشتهٔ ساده و صفت مفعولی (*Partizip II*) همراه با فعل
      کمکی‌اش (*gehen*، *ging*، *ist gegangen*).
  de:
    rule: >
      Das Präteritum benutzt man in Geschichten, Berichten und Lebensläufen,
      vor allem beim Schreiben. Ein regelmäßiges Verb bekommt *-te* und dann
      die Endung: *ich machte*, *du machtest*, *wir machten*, *ihr machtet*.
      Endet der Stamm auf *-t* oder *-d*, dann *-ete*: *arbeitete*,
      *redete*. Ein unregelmäßiges Verb bekommt kein *-te*, es hat einen
      neuen Stamm: *gehen*, *ging*; *fahren*, *fuhr*. Ein gemischtes Verb hat
      beides, einen neuen Vokal und *-te*: *bringen*, *brachte*; *denken*,
      *dachte*; *wissen*, *wusste*. Bei *ich* und *er/sie/es* kommt nach
      *-te* oder dem neuen Stamm keine Endung (*ich ging*, *er machte*). Das
      Präfix von einem trennbaren Verb steht am Ende: *Der Zug fuhr um acht
      Uhr ab.* Den neuen Stamm kann man nicht raten. Lernen Sie jedes
      unregelmäßige Verb mit den drei Stammformen: Infinitiv, Präteritum und
      Partizip II mit dem Hilfsverb (*gehen*, *ging*, *ist gegangen*).

