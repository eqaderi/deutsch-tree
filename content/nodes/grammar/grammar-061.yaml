# Grammar list row 61.
id: grammar-061
kind: grammar
level: A1
chapter: a1-cases
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-059, grammar-074]
title:
  en: "*Nominativ*"
  fa: "حالت فاعلی (*Nominativ*)"
  de: "Nominativ"

explanations:
  en:
    rule: >
      The *Nominativ* is the basic form of a noun, the one in the dictionary.
      The subject, the person or thing that does something, is always in the
      *Nominativ*: ask *Wer?* (who?) for a person and *Was?* (what?) for a
      thing. A noun after *sein* is in the *Nominativ* too: *Das ist ein
      Tisch.* The articles are the ones you know: *der*, *die*, *das*, plural
      *die*; *ein*, *eine*; *kein*, *keine*. The subject need not come first
      (*Heute kommt der Bus.*), but its article still shows the *Nominativ*.
  fa:
    rule: >
      حالت *Nominativ* (حالت فاعلی) شکل پایهٔ اسم است؛ همان شکلی که در
      واژه‌نامه می‌آید. فاعل جمله، یعنی کسی یا چیزی که کاری انجام می‌دهد،
      همیشه در حالت *Nominativ* است. برای پیدا کردن آن، دربارهٔ انسان
      می‌پرسیم *Wer?* (چه کسی؟) و دربارهٔ چیز *Was?* (چه چیزی؟). اسمی که پس
      از *sein* می‌آید نیز در حالت *Nominativ* است: *Das ist ein Tisch.*
      حرف‌های تعریف این حالت همان‌هایی‌اند که تا این‌جا آموخته‌اید: *der*،
      *die*، *das* و *die* جمع؛ *ein* و *eine*؛ *kein* و *keine*. فاعل همیشه
      در آغاز جمله نیست (*Heute kommt der Bus.*)، ولی حرف تعریفش حالت
      *Nominativ* را نشان می‌دهد.
  de:
    rule: >
      Der Nominativ ist die Grundform von einem Nomen. So steht es im
      Wörterbuch. Das Subjekt steht immer im Nominativ. Man fragt *Wer?* für
      Personen und *Was?* für Sachen. Auch nach *sein* steht der Nominativ:
      *Das ist ein Tisch.* Die Artikel sind *der*, *die*, *das*, im Plural
      *die*, und *ein*, *eine*, *kein*, *keine*. Das Subjekt steht nicht immer
      am Anfang: *Heute kommt der Bus.*

# Two sentences: the subject, and the noun after sein. The drawing is German
# only, so it needs no labels.
