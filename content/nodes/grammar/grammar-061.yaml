        Bus kommt heute.* After *sein* both nouns are in the *Nominativ*:
        *Tom ist Lehrer.*
      fa: >
        فاعل پاسخ پرسش *Wer?* یا *Was?* است و در حالت *Nominativ* می‌آید:
        *Der Bus kommt heute.* پس از *sein* هر دو اسم در حالت *Nominativ*
        هستند: *Tom ist Lehrer.*
      de: >
        Das Subjekt antwortet auf *Wer?* oder *Was?* und steht im Nominativ:
        *Der Bus kommt heute.* Nach *sein* stehen beide Nomen im Nominativ:
        *Tom ist Lehrer.*
