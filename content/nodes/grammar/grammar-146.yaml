# Grammar list row 146.
id: grammar-146
kind: grammar
level: A1
chapter: a1-negation
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-139]
title:
  en: "Negation with *nicht*"
  fa: "نفی با *nicht*"
  de: "Verneinung mit *nicht*"

explanations:
  en:
    rule: >
      *Nicht* makes a sentence negative. It never stands before the verb in
      position 2: it comes after the verb, the object and a time such as
      *heute*, usually at the end (*Ich verstehe das nicht.*). It stands before
      the part that completes the sentence: an adjective or a noun after *sein*
      (*Das ist nicht gut.*), a place (*Er wohnt nicht in Berlin.*) and *gern*
      (*Ich tanze nicht gern.*). A noun with *ein* or with no article is
      negated with *kein*, the next topic.
  fa:
    rule: >
      *nicht* جمله را منفی می‌کند. در فارسی نفی به خود فعل می‌چسبد
      («نمی‌فهمم»)، ولی *nicht* هرگز پیش از فعلِ جایگاه دوم نمی‌آید. جای آن
      پس از فعل، مفعول و قید زمانی مانند *heute* است و بیشتر در پایان جمله
      می‌نشیند: *Ich verstehe das nicht.* اما *nicht* پیش از بخشی می‌آید که
      جمله را کامل می‌کند: صفت یا اسمِ پس از *sein* (*Das ist nicht gut.*)،
      مکان (*Er wohnt nicht in Berlin.*) و *gern* (*Ich tanze nicht gern.*).
      اسمی که با *ein* یا بدون حرف تعریف می‌آید با *kein* منفی می‌شود که
      موضوع درس بعدی است.
  de:
    rule: >
      Mit *nicht* verneint man einen Satz. *Nicht* steht nie vor dem Verb auf
      Position 2. Es steht nach dem Verb, nach dem Objekt und nach einer Zeit
      wie *heute*, meistens am Ende: *Ich verstehe das nicht.* Aber *nicht*
      steht vor einem Adjektiv oder Nomen nach *sein* (*Das ist nicht gut.*),
      vor einem Ort (*Er wohnt nicht in Berlin.*) und vor *gern* (*Ich tanze
      nicht gern.*). Ein Nomen mit *ein* oder ohne Artikel verneint man mit
      *kein*. Das kommt im nächsten Thema.

# Three sentences as rows of slots. The slot of nicht is tinted; the note under
# it says where it stands. German is in the drawing, the notes are labels.
