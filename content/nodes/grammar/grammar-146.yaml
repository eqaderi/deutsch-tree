table:
  columns:
    - { en: Positive, fa: جملهٔ مثبت, de: Ohne Verneinung }
    - { en: "With *nicht*", fa: "با *nicht*", de: "Mit *nicht*" }
  rows:
    - [Ich verstehe das., Ich verstehe das nicht.]
    - [Anna kommt heute., Anna kommt heute nicht.]
    - [Das ist gut., Das ist nicht gut.]
    - [Das ist der Bus., Das ist nicht der Bus.]
    - [Er wohnt in Berlin., Er wohnt nicht in Berlin.]
    - [Ich tanze gern., Ich tanze nicht gern.]

examples:
  - de: Leider verstehe ich das nicht.
    en: Unfortunately I don't understand that.
    fa: متأسفانه این را نمی‌فهمم.
  - de: Ich kenne Tom nicht.
    en: I don't know Tom.
    fa: من تام را نمی‌شناسم.
  - de: Anna kommt heute nicht.
    en: Anna isn't coming today.
    fa: آنا امروز نمی‌آید.
  - de: Das Essen ist nicht teuer.
    en: The food isn't expensive.
    fa: غذا گران نیست.
  - de: Das ist nicht der Bus nach Köln.
    en: That isn't the bus to Cologne.
    fa: این اتوبوسی نیست که به کلن می‌رود.
  - de: Wir wohnen nicht in Berlin.
    en: We don't live in Berlin.
    fa: ما در برلین زندگی نمی‌کنیم.
  - de: Ich tanze nicht gern.
    en: I don't like dancing.
    fa: رقصیدن را دوست ندارم.
  - de: Warum kommst du nicht?
    en: Why aren't you coming?
    fa: چرا نمی‌آیی؟

mistakes:
  - wrong: Ich nicht verstehe das.
    right: Ich verstehe das nicht.
    why:
      en: "*Nicht* never stands before the verb in position 2. Here it goes to the end, after the object *das*."
      fa: "*nicht* هرگز پیش از فعلِ جایگاه دوم نمی‌آید. این‌جا به پایان جمله می‌رود، پس از مفعول *das*."
      de: "*Nicht* steht nie vor dem Verb auf Position 2. Hier steht es am Ende, nach dem Objekt *das*."
  - wrong: Das ist nein gut.
    right: Das ist nicht gut.
    why:
      en: "*Nein* is only an answer (\"no\"). Inside a sentence the negation is *nicht*."
      fa: "*nein* فقط پاسخ است («نه»). برای منفی کردن جمله *nicht* به کار می‌رود."
      de: "*Nein* ist nur eine Antwort. Im Satz verneint man mit *nicht*."
  - wrong: Er wohnt in Berlin nicht.
    right: Er wohnt nicht in Berlin.
    why:
      en: "A place completes the sentence, so *nicht* stands before it. Only a strong contrast on the verb puts it after the place."
      fa: "مکان جمله را کامل می‌کند، پس *nicht* پیش از آن می‌آید. فقط وقتی تأکید ویژه‌ای روی فعل باشد، *nicht* پس از مکان می‌نشیند."
      de: "Ein Ort macht den Satz komplett. Darum steht *nicht* davor. Nur bei einem starken Gegensatz zum Verb steht es nach dem Ort."
  - wrong: Ich tanze gern nicht.
    right: Ich tanze nicht gern.
    why:
      en: "*Nicht* stands before *gern*: *nicht gern* means \"don't like to\"."
      fa: "*nicht* پیش از *gern* می‌آید: *nicht gern* یعنی «دوست ندارم که …»."
      de: "*Nicht* steht vor *gern*: *nicht gern*."
  - wrong: Ich arbeite nicht heute.
    right: Ich arbeite heute nicht.
    why:
      en: "A time such as *heute* stays before *nicht*. *Nicht heute* is only for a contrast: *nicht heute, sondern morgen*."
      fa: "قید زمانی مانند *heute* پیش از *nicht* می‌ماند. *nicht heute* فقط برای مقایسه است: *nicht heute, sondern morgen* (نه امروز، بلکه فردا)."
      de: "Eine Zeit wie *heute* steht vor *nicht*. *Nicht heute* sagt man nur bei einem Gegensatz: *nicht heute, sondern morgen*."

questions:
  - id: choice-1
    type: multiple-choice
    prompt: "Ich verstehe das. → verneint:"
    options: [Ich verstehe das nicht., Ich verstehe nicht das., Ich nicht verstehe das.]
    answer: Ich verstehe das nicht.
    explanation:
      en: "*Nicht* goes to the end, after the verb and the object *das*."
      fa: "*nicht* به پایان جمله می‌رود، پس از فعل و مفعول *das*."
      de: "*Nicht* steht am Ende, nach dem Verb und dem Objekt *das*."
  - id: choice-2
    type: multiple-choice
    prompt: "Das Wetter ist schön. → verneint:"
    options: [Das Wetter ist nicht schön., Das Wetter ist schön nicht., Das Wetter nicht ist schön.]
    answer: Das Wetter ist nicht schön.
    explanation:
      en: "*Nicht* stands before the adjective after *sein*: *nicht schön*."
      fa: "*nicht* پیش از صفتِ پس از *sein* می‌آید: *nicht schön*."
      de: "*Nicht* steht vor dem Adjektiv nach *sein*: *nicht schön*."
  - id: choice-3
    type: multiple-choice
    prompt: "Er wohnt in Hamburg. → verneint:"
    options: [Er wohnt nicht in Hamburg., Er nicht wohnt in Hamburg., Er wohnt in nicht Hamburg.]
    answer: Er wohnt nicht in Hamburg.
    explanation:
      en: "*Nicht* stands before the place: *nicht in Hamburg*."
      fa: "*nicht* پیش از مکان می‌آید: *nicht in Hamburg*."
      de: "*Nicht* steht vor dem Ort: *nicht in Hamburg*."
  - id: choice-4
    type: multiple-choice
    prompt: "Ich koche gern. → verneint:"
    options: [Ich koche nicht gern., Ich koche gern nicht., Ich nicht koche gern.]
    answer: Ich koche nicht gern.
    explanation:
      en: "*Nicht* stands before *gern*: *nicht gern*."
      fa: "*nicht* پیش از *gern* می‌آید: *nicht gern*."
      de: "*Nicht* steht vor *gern*: *nicht gern*."
  - id: gap-1
    type: gap-fill
    prompt: Ist das richtig? – Nein, das ist ___ richtig.
    options: [nicht, nein, kein]
    answer: nicht
    explanation:
      en: "*Nein* is the answer; inside the sentence the adjective *richtig* is negated with *nicht*."
      fa: "*nein* پاسخ است؛ درون جمله صفت *richtig* با *nicht* منفی می‌شود."
      de: "*Nein* ist die Antwort. Im Satz verneint man das Adjektiv *richtig* mit *nicht*."
  - id: gap-2
    type: gap-fill
    prompt: Kommst du heute? – Nein, ich komme heute ___.
    options: [nicht, nein, kein]
    answer: nicht
    explanation:
      en: "The verb is negated with *nicht*, at the end after *heute*. *Nein* is only the answer at the start."
      fa: "فعل با *nicht* منفی می‌شود و *nicht* پس از *heute* در پایان جمله می‌آید. *nein* فقط پاسخِ آغاز جمله است."
      de: "Das Verb verneint man mit *nicht*, am Ende nach *heute*. *Nein* ist nur die Antwort am Anfang."
  - id: true-1
    type: true-false
    prompt: Das Essen ist nicht teuer.
    answer: true
    explanation:
      en: "*Nicht* stands before the adjective *teuer*. The sentence is correct."
      fa: "*nicht* پیش از صفت *teuer* آمده است. جمله درست است."
      de: "*Nicht* steht vor dem Adjektiv *teuer*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Ich verstehe nicht das.
    answer: false
    explanation:
      en: "*Nicht* comes after the object: *Ich verstehe das nicht.*"
      fa: "*nicht* پس از مفعول می‌آید: *Ich verstehe das nicht.*"
      de: "*Nicht* steht nach dem Objekt: *Ich verstehe das nicht.*"
  - id: true-3
    type: true-false
    prompt: Anna kommt heute nicht.
    answer: true
    explanation:
      en: "*Heute* stays before *nicht*, and *nicht* is at the end. The sentence is correct."
      fa: "*heute* پیش از *nicht* می‌ماند و *nicht* در پایان جمله است. جمله درست است."
      de: "*Heute* steht vor *nicht*, und *nicht* steht am Ende. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Wir wohnen nicht in Berlin.
    answer: true
    explanation:
      en: "*Nicht* stands before the place *in Berlin*. The sentence is correct."
      fa: "*nicht* پیش از مکان *in Berlin* آمده است. جمله درست است."
      de: "*Nicht* steht vor dem Ort *in Berlin*. Der Satz ist richtig."
  - id: true-5
    type: true-false
    prompt: Er nicht arbeitet.
    answer: false
    explanation:
      en: "The verb stays in position 2 and *nicht* comes after it: *Er arbeitet nicht.*"
      fa: "فعل در جایگاه دوم می‌ماند و *nicht* پس از آن می‌آید: *Er arbeitet nicht.*"
      de: "Das Verb bleibt auf Position 2, *nicht* steht danach: *Er arbeitet nicht.*"
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Das Zimmer ist ___ (groß / nicht).
    answers: [nicht groß]
    explanation:
      en: "*Nicht* stands before the adjective: *nicht groß*."
      fa: "*nicht* پیش از صفت می‌آید: *nicht groß*."
      de: "*Nicht* steht vor dem Adjektiv: *nicht groß*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Meine Eltern wohnen ___ (in Köln / nicht).
    answers: [nicht in Köln]
    explanation:
      en: "*Nicht* stands before the place: *nicht in Köln*."
      fa: "*nicht* پیش از مکان می‌آید: *nicht in Köln*."
      de: "*Nicht* steht vor dem Ort: *nicht in Köln*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Tom arbeitet ___ (nicht / heute).
    answers: [heute nicht]
    explanation:
      en: "A time such as *heute* stays before *nicht*: *heute nicht*."
      fa: "قید زمانی مانند *heute* پیش از *nicht* می‌ماند: *heute nicht*."
      de: "Eine Zeit wie *heute* steht vor *nicht*: *heute nicht*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Ich schwimme ___ (gern / nicht).
    answers: [nicht gern]
    explanation:
      en: "*Nicht* stands before *gern*: *nicht gern*."
      fa: "*nicht* پیش از *gern* می‌آید: *nicht gern*."
      de: "*Nicht* steht vor *gern*: *nicht gern*."
  - id: order-1
    type: word-order
    answers:
      - [ich, verstehe, das, nicht]
      - [das, verstehe, ich, nicht]
    explanation:
      en: "The verb comes second and *nicht* goes to the end."
      fa: "فعل در جایگاه دوم می‌آید و *nicht* در پایان جمله."
      de: "Das Verb steht auf Position 2, *nicht* steht am Ende."
  - id: order-2
    type: word-order
    answers:
      - [der Bus, kommt, heute, nicht]
      - [heute, kommt, der Bus, nicht]
    explanation:
      en: "The verb comes second. *Heute* stays before *nicht*, and *nicht* goes to the end."
      fa: "فعل در جایگاه دوم می‌آید. *heute* پیش از *nicht* می‌ماند و *nicht* در پایان جمله است."
      de: "Das Verb steht auf Position 2. *Heute* steht vor *nicht*, *nicht* steht am Ende."
  - id: order-3
    type: word-order
    answers:
      - [er, wohnt, nicht, in Berlin]
      - [in Berlin, wohnt, er, nicht]
    explanation:
      en: "*Nicht* stands before the place. If the place comes first, *nicht* goes to the end."
      fa: "*nicht* پیش از مکان می‌آید. اگر مکان در آغاز جمله باشد، *nicht* به پایان جمله می‌رود."
      de: "*Nicht* steht vor dem Ort. Steht der Ort am Anfang, steht *nicht* am Ende."
  - id: order-4
    type: word-order
    end: "?"
    answers:
      - [ist, das Zimmer, nicht, groß]
    explanation:
      en: "In a yes/no question the verb comes first. *Nicht* stands before the adjective."
      fa: "در پرسش بله و خیر، فعل در آغاز می‌آید. *nicht* پیش از صفت است."
      de: "In einer Ja/Nein-Frage steht das Verb am Anfang. *Nicht* steht vor dem Adjektiv."

