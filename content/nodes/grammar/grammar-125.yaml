    prompt: Der Kuchen ist für ___ (der) Chef.
    answers: [den]
    explanation:
      en: "*Für* takes the *Akkusativ*: *der* becomes *den*."
      fa: "*für* با حالت *Akkusativ* می‌آید: *der* به *den* تبدیل می‌شود."
      de: "Nach *für* steht der Akkusativ: *der* wird zu *den*."
  - id: typed-gap-3
