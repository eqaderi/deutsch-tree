examples:
  - de: Ich fahre mit dem Auto zur Arbeit.
    en: I drive to work.
    fa: با ماشین سر کار می‌روم.
  - de: Ich gehe mit meiner Freundin ins Kino.
    en: I'm going to the cinema with my girlfriend.
    fa: با دوستم به سینما می‌روم.
  - de: Einen Kaffee mit Milch, bitte.
    en: A coffee with milk, please.
    fa: یک قهوه با شیر، لطفاً.
  - de: Ich trinke Tee ohne Zucker.
    en: I drink tea without sugar.
    fa: چای را بدون شکر می‌نوشم.
  - de: Ich komme nicht ohne dich.
    en: I'm not coming without you.
    fa: بدون تو نمی‌آیم.
  - de: Die Blumen sind für meine Mutter.
    en: The flowers are for my mother.
    fa: این گل‌ها برای مادرم است.
  - de: Das Geschenk ist für dich.
    en: The present is for you.
    fa: این هدیه برای توست.
  - de: Der Tisch ist aus Holz.
    en: The table is made of wood.
    fa: میز چوبی است.
  - de: Die Flasche ist aus Plastik.
    en: The bottle is made of plastic.
    fa: بطری پلاستیکی است.
  - de: Ich arbeite als Krankenpfleger.
    en: I work as a nurse.
    fa: به‌عنوان پرستار کار می‌کنم.
  - de: Sie arbeitet als Lehrerin in Köln.
    en: She works as a teacher in Cologne.
    fa: او در کلن معلم است.

mistakes:
  - wrong: Ich fahre mit die U-Bahn.
    right: Ich fahre mit der U-Bahn.
    why:
      en: "*Mit* takes the *Dativ*: *die* becomes *der*."
      fa: "*mit* با حالت *Dativ* می‌آید: *die* به *der* تبدیل می‌شود."
      de: "Nach *mit* steht der Dativ: *die* wird zu *der*."
  - wrong: Das Geschenk ist für meinem Bruder.
    right: Das Geschenk ist für meinen Bruder.
    why:
      en: "*Für* takes the *Akkusativ*, not the *Dativ*: *meinen Bruder*."
      fa: "*für* با حالت *Akkusativ* می‌آید، نه *Dativ*: *meinen Bruder*."
      de: "Nach *für* steht der Akkusativ, nicht der Dativ: *meinen Bruder*."
  - wrong: Ich gehe ohne meinem Mann.
    right: Ich gehe ohne meinen Mann.
    why:
      en: "*Ohne* takes the *Akkusativ*: *meinen Mann*."
      fa: "*ohne* با حالت *Akkusativ* می‌آید: *meinen Mann*."
      de: "Nach *ohne* steht der Akkusativ: *meinen Mann*."
  - wrong: Ich arbeite als ein Lehrer.
    right: Ich arbeite als Lehrer.
    why:
      en: 'English says "as a teacher"; German names a job after *als* with no article.'
      fa: "پس از *als* شغل بدون حرف تعریف می‌آید: *als Lehrer*."
      de: "Nach *als* steht der Beruf ohne Artikel: *als Lehrer*."
  - wrong: Der Tisch ist aus dem Holz.
    right: Der Tisch ist aus Holz.
    why:
      en: "A material after *aus* has no article: *aus Holz*, *aus Glas*."
      fa: "جنس پس از *aus* حرف تعریف نمی‌گیرد: *aus Holz* و *aus Glas*."
      de: "Beim Material nach *aus* steht kein Artikel: *aus Holz*, *aus Glas*."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Wir fahren mit ___ U-Bahn.
    options: [der, die, dem]
    answer: der
    explanation:
      en: "*Mit* takes the *Dativ*. *U-Bahn* is feminine: *die* becomes *der*."
      fa: "*mit* با حالت *Dativ* می‌آید. *U-Bahn* اسم مؤنث است: *die* به *der* تبدیل می‌شود."
      de: "Nach *mit* steht der Dativ. *U-Bahn* ist feminin: *die* wird zu *der*."
  - id: gap-2
    type: gap-fill
    prompt: Die Blumen sind für ___ Mutter.
    options: [meine, meiner, meinem]
    answer: meine
    explanation:
      en: "*Für* takes the *Akkusativ*, and feminine *meine* stays *meine*."
      fa: "*für* با حالت *Akkusativ* می‌آید و *meine* مؤنث تغییر نمی‌کند."
      de: "Nach *für* steht der Akkusativ. Feminin bleibt *meine*."
  - id: gap-3
    type: gap-fill
    prompt: Das Geschenk ist für ___ Vater.
    options: [meinen, meinem, mein]
    answer: meinen
    explanation:
      en: "*Für* takes the *Akkusativ*. *Vater* is masculine: *mein* becomes *meinen*."
      fa: "*für* با حالت *Akkusativ* می‌آید. *Vater* اسم مذکر است: *mein* به *meinen* تبدیل می‌شود."
      de: "Nach *für* steht der Akkusativ. *Vater* ist maskulin: *mein* wird zu *meinen*."
  - id: gap-4
    type: gap-fill
    prompt: Der Teller ist ___ Glas.
    options: [aus, als, für]
    answer: aus
    explanation:
      en: "What a thing is made of: *aus Glas*."
      fa: "جنس یک چیز: *aus Glas*."
      de: "Das Material: *aus Glas*."
  - id: gap-5
    type: gap-fill
    prompt: Er arbeitet ___ Koch in einem Restaurant.
    options: [als, für, mit]
    answer: als
    explanation:
      en: "A job takes *als*, with no article: *als Koch*."
      fa: "شغل با *als* و بدون حرف تعریف می‌آید: *als Koch*."
      de: "Beim Beruf steht *als* ohne Artikel: *als Koch*."
  - id: choice-1
    type: multiple-choice
    prompt: Mit wem gehst du ins Kino? – ___
    options: [Mit meinem Bruder., Mit meinen Bruder., Mit mein Bruder.]
    answer: Mit meinem Bruder.
    explanation:
      en: "*Mit* takes the *Dativ*: *mein Bruder* becomes *meinem Bruder*."
      fa: "*mit* با حالت *Dativ* می‌آید: *mein Bruder* به *meinem Bruder* تبدیل می‌شود."
      de: "Nach *mit* steht der Dativ: *mein Bruder* wird zu *meinem Bruder*."
  - id: choice-2
    type: multiple-choice
    prompt: Das Buch ist ___ meinen Sohn.
    options: [für, mit, aus]
    answer: für
    explanation:
      en: "*Meinen Sohn* is *Akkusativ*, and of these three only *für* takes it."
      fa: "*meinen Sohn* در حالت *Akkusativ* است و از این سه، فقط *für* با این حالت می‌آید."
      de: "*Meinen Sohn* ist Akkusativ. Von den drei steht nur *für* mit Akkusativ."
  - id: choice-3
    type: multiple-choice
    prompt: Ich arbeite ___.
    options: [als Ärztin, als eine Ärztin, für Ärztin]
    answer: als Ärztin
    explanation:
      en: "A job takes *als*, with no article: *als Ärztin*."
      fa: "شغل با *als* و بدون حرف تعریف می‌آید: *als Ärztin*."
      de: "Beim Beruf steht *als* ohne Artikel: *als Ärztin*."
  - id: true-1
    type: true-false
    prompt: Der Stuhl ist aus Holz.
    answer: true
    explanation:
      en: "A material after *aus*, with no article. The sentence is correct."
      fa: "جنس پس از *aus* و بدون حرف تعریف. جمله درست است."
      de: "Material nach *aus*, ohne Artikel. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Ich gehe nie ohne mein Handy aus dem Haus.
    answer: true
    explanation:
      en: "*Ohne* takes the *Akkusativ*, and neuter *mein* stays *mein*. The sentence is correct."
      fa: "*ohne* با حالت *Akkusativ* می‌آید و *mein* خنثی تغییر نمی‌کند. جمله درست است."
      de: "Nach *ohne* steht der Akkusativ. Neutral bleibt *mein*. Der Satz ist richtig."
  - id: true-3
    type: true-false
    prompt: Sie arbeitet als eine Verkäuferin.
