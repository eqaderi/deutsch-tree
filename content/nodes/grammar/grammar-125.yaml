    answers: [für einen Freund]
    explanation:
      en: "*Für* takes the *Akkusativ*: masculine *ein* becomes *einen*."
      fa: "*für* با حالت *Akkusativ* می‌آید: *ein* مذکر به *einen* تبدیل می‌شود."
