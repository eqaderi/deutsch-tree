    explanation:
      en: "No milk: *ohne Milch*, with no article."
      fa: "بدون شیر: *ohne Milch*، بدون حرف تعریف."
      de: "Keine Milch: *ohne Milch*, ohne Artikel."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Mein Onkel arbeitet ___ Taxifahrer.
    answers: [als]
    explanation:
      en: "A job takes *als*: *als Taxifahrer*."
      fa: "شغل با *als* می‌آید: *als Taxifahrer*."
      de: "Beim Beruf steht *als*: *als Taxifahrer*."
  - id: typed-1
