# Grammar list row 125.
id: grammar-125
kind: grammar
level: A1
chapter: a1-prepositions
order: 7
status: published
recogniseOnly: false
prerequisites: [grammar-062, grammar-063]
title:
  en: "Modal: *mit*, *ohne*, *für*, *aus* (material), *als* (job)"
  fa: "حرف‌های اضافهٔ *mit*، *ohne*، *für*، *aus* (جنس) و *als* (شغل)"
  de: "*mit*, *ohne*, *für*, *aus* (Material), *als* (Beruf)"

explanations:
  en:
    rule: >
      *Mit* (with) takes the *Dativ*: *mit dem Auto*, *mit meiner Freundin*,
      *Kaffee mit Milch*. *Ohne* (without) takes the *Akkusativ* and usually
      has no article: *Kaffee ohne Zucker*, *ohne Jacke*; with a person, *ohne
      meinen Mann*, *ohne dich*. *Für* (for) takes the *Akkusativ*: *für
      meinen Bruder*, *für dich*. In the *Akkusativ* only masculine *der*
      changes, to *den* (*ein* to *einen*, *mein* to *meinen*). *Aus* says
      what a thing is made of, with no article: *aus Holz*, *aus Plastik*.
      *Als* names a job or a role, also with no article: *Ich arbeite als
      Lehrerin.*
  fa:
    rule: >
      *mit* (با) با حالت *Dativ* (حالت مفعول باواسطه) می‌آید: *mit dem Auto*،
      *mit meiner Freundin* و *Kaffee mit Milch*. *ohne* (بدون) با حالت
      *Akkusativ* (حالت مفعولی) می‌آید و معمولاً حرف تعریف نمی‌گیرد: *Kaffee
      ohne Zucker* و *ohne Jacke*؛ با یک شخص: *ohne meinen Mann* و *ohne
      dich*. *für* (برای) هم با حالت *Akkusativ* می‌آید: *für meinen Bruder*
      و *für dich*. در حالت *Akkusativ* فقط *der* مذکر تغییر می‌کند و *den*
      می‌شود (*ein* به *einen* و *mein* به *meinen*). *aus* جنس چیزی را
      می‌گوید و حرف تعریف نمی‌گیرد: *aus Holz* و *aus Plastik*. *als* شغل یا
      نقش کسی را می‌گوید و آن هم بدون حرف تعریف می‌آید: *Ich arbeite als
      Lehrerin.*
  de:
    rule: >
      Nach *mit* steht der Dativ: *mit dem Auto*, *mit meiner Freundin*,
      *Kaffee mit Milch*. Nach *ohne* steht der Akkusativ, meistens ohne
      Artikel: *Kaffee ohne Zucker*, *ohne Jacke*. Bei Personen: *ohne meinen
      Mann*, *ohne dich*. Nach *für* steht auch der Akkusativ: *für meinen
      Bruder*, *für dich*. Im Akkusativ ändert sich nur *der*: Er wird zu
      *den* (*ein* zu *einen*, *mein* zu *meinen*). *Aus* sagt, woraus etwas
      ist, ohne Artikel: *aus Holz*, *aus Plastik*. *Als* sagt den Beruf oder
      die Rolle, auch ohne Artikel: *Ich arbeite als Lehrerin.*

table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: "*mit* + *Dativ*", fa: "*mit* + حالت *Dativ*", de: "*mit* + Dativ" }
    - { en: "*für*, *ohne* + *Akkusativ*", fa: "*für* و *ohne* + حالت *Akkusativ*", de: "*für*, *ohne* + Akkusativ" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [der Freund, mit dem Freund, für den Freund, ein Geschenk für den Freund]
    - [die Freundin, mit der Freundin, für die Freundin, mit der Freundin ins Kino]
    - [das Kind, mit dem Kind, ohne das Kind, ein Buch für das Kind]
    - [die Kinder (Plural), mit den Kindern, für die Kinder, Urlaub mit den Kindern]
