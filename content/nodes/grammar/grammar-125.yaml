      fa: "پس از *als* شغل بدون حرف تعریف می‌آید: *als Verkäuferin*."
      de: "Nach *als* steht der Beruf ohne Artikel: *als Verkäuferin*."
  - id: true-4
    type: true-false
    prompt: Ich spiele mit meinen Freunden Fußball.
    answer: true
    explanation:
      en: "*Mit* takes the *Dativ*: plural *meinen Freunden*, with *-n*. The sentence is correct."
      fa: "*mit* با حالت *Dativ* می‌آید: جمع *meinen Freunden* با *-n*. جمله درست است."
      de: "Nach *mit* steht der Dativ: im Plural *meinen Freunden* mit *-n*. Der Satz ist richtig."
  - id: true-5
    type: true-false
    prompt: Das Geschenk ist für meinem Opa.
    answer: false
    explanation:
      en: "*Für* takes the *Akkusativ*: *für meinen Opa*."
      fa: "*für* با حالت *Akkusativ* می‌آید: *für meinen Opa*."
      de: "Nach *für* steht der Akkusativ: *für meinen Opa*."
