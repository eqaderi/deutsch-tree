# Grammar list row 65.
id: grammar-065
kind: grammar
level: A1
chapter: a1-cases
order: 5
status: published
recogniseOnly: false
prerequisites: [grammar-061]
title:
  en: "*Genitiv* *-s* on names"
  fa: "*-s* ملکی (حالت *Genitiv*) در نام‌ها"
  de: "Genitiv-*s* bei Namen"

explanations:
  en:
    rule: >
      To say whose something is, German adds *-s* to a name and puts the name
      before the noun, with no article and no apostrophe: *Annas Buch*
      (Anna's book), *Karls Freunde*. This is the *Genitiv*. A name that
      already ends in *-s*, *-x* or *-z* takes only an apostrophe: *Jonas'
      Fahrrad*, *Max' Auto*. The same works with *Mama* and *Papa*: *Mamas
      Auto*.
  fa:
    rule: >
      برای این‌که بگوییم چیزی مال کیست، در آلمانی به نام *-s* می‌افزاییم و
      نام را پیش از اسم می‌آوریم، بدون حرف تعریف و بدون آپاستروف: *Annas
      Buch* (کتاب آنا) و *Karls Freunde* (دوستان کارل). این حالت *Genitiv*
      (حالت ملکی) است. ترتیب برعکس فارسی است: در فارسی اول چیز می‌آید و بعد
      صاحبش، ولی در آلمانی اول صاحب و بعد چیز. نامی که خودش به *-s*، *-x* یا
      *-z* ختم می‌شود فقط آپاستروف می‌گیرد: *Jonas' Fahrrad* و *Max' Auto*.
      با *Mama* و *Papa* هم همین‌طور است: *Mamas Auto*.
  de:
    rule: >
      Wem gehört etwas? Man stellt den Namen mit *-s* vor das Nomen, ohne
      Artikel und ohne Apostroph: *Annas Buch*, *Karls Freunde*. Das ist der
      Genitiv. Endet der Name auf *-s*, *-x* oder *-z*, schreibt man nur einen
      Apostroph: *Jonas' Fahrrad*, *Max' Auto*. Das geht auch mit *Mama* und
      *Papa*: *Mamas Auto*.

