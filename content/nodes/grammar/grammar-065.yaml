examples:
  - de: Das ist Annas Buch.
    en: That is Anna's book.
    fa: این کتاب آناست.
  - de: Karls Freunde kommen heute.
    en: Karl's friends are coming today.
    fa: دوستان کارل امروز می‌آیند.
  - de: Wo ist Jonas' Fahrrad?
    en: Where is Jonas's bike?
    fa: دوچرخهٔ یوناس کجاست؟
  - de: Max' Schwester heißt Lena.
    en: Max's sister is called Lena.
    fa: نام خواهر ماکس لنا است.
  - de: Mamas Auto ist rot.
    en: Mum's car is red.
    fa: ماشین مامان قرمز است.
  - de: Das ist Peters Wohnung.
    en: That is Peter's flat.
    fa: این آپارتمان پتر است.
  - de: Sabines Kinder spielen im Garten.
    en: Sabine's children are playing in the garden.
    fa: بچه‌های زابینه در باغ بازی می‌کنند.
  - de: Ist das Toms Handy?
    en: Is that Tom's phone?
    fa: این گوشی تام است؟

mistakes:
  - wrong: Das ist Anna's Buch.
    right: Das ist Annas Buch.
    why:
      en: "German writes the *-s* straight onto the name, without the apostrophe of English *Anna's*."
      fa: "در آلمانی *-s* بی‌واسطه به نام می‌چسبد و آپاستروف انگلیسی (*Anna's*) را نمی‌نویسیم."
      de: "Im Deutschen schreibt man das *-s* direkt an den Namen, ohne Apostroph: *Annas*."
  - wrong: Wo ist die Peters Jacke?
    right: Wo ist Peters Jacke?
    why:
      en: "A name with *-s* takes the place of the article, so no *der*, *die* or *das* comes before it."
      fa: "نام با *-s* جای حرف تعریف را می‌گیرد، پس پیش از آن *der*، *die* یا *das* نمی‌آید."
      de: "Der Name mit *-s* steht an der Stelle vom Artikel. Davor steht kein *der*, *die* oder *das*."
  - wrong: Das ist Jonass Fahrrad.
    right: Das ist Jonas' Fahrrad.
    why:
      en: "*Jonas* already ends in *-s*, so it takes only an apostrophe: *Jonas'*."
      fa: "*Jonas* خودش به *-s* ختم می‌شود، پس فقط آپاستروف می‌گیرد: *Jonas'*."
      de: "*Jonas* endet schon auf *-s*. Darum schreibt man nur einen Apostroph: *Jonas'*."
  - wrong: Max's Auto ist neu.
    right: Max' Auto ist neu.
    why:
      en: "After a name in *-x* there is only an apostrophe, never *'s*."
      fa: "پس از نامی که به *-x* ختم می‌شود فقط آپاستروف می‌آید، هرگز *'s*."
      de: "Nach einem Namen auf *-x* steht nur ein Apostroph, nie *'s*."

