title:
  en: "Reflexive verbs and pronouns, *Akkusativ*"
  fa: "فعل‌ها و ضمیرهای انعکاسی در حالت *Akkusativ*"
  de: "Reflexive Verben und Reflexivpronomen im Akkusativ"

explanations:
  en:
    rule: >
      A reflexive verb has a pronoun that points back to the subject: *Ich
      wasche mich.* (I wash myself.) In the *Akkusativ* the reflexive pronoun
      is *mich*, *dich*, *uns* and *euch*, as you know them, and *sich* for
      *er*, *sie*, *es*, plural *sie* and polite *Sie*. Some verbs are always
      reflexive, such as *sich beeilen* (to hurry) and *sich freuen* (to be
      glad); English often has no "myself" there, but German needs the
      pronoun: *Ich beeile mich.* Others can take another object instead:
      *Ich wasche mich* or *Ich wasche das Auto*. The pronoun stands right
      after the conjugated verb, and after a pronoun subject that follows the
      verb: *Heute hat sie sich verspätet.* With a modal verb it stays in the
      middle and the infinitive goes to the end: *Ich kann mich nicht
      erinnern.* In the *Perfekt* a reflexive verb always takes *haben*: *Ich
      habe mich beeilt.*
  fa:
    rule: >
      فعل انعکاسی ضمیری دارد که به خود فاعل برمی‌گردد: *Ich wasche mich.*
      (خودم را می‌شویم.) ضمیر انعکاسی در حالت *Akkusativ* (حالت مفعولی) برای
      *ich*، *du*، *wir* و *ihr* همان ضمیرهای آشنای *mich*، *dich*، *uns* و
      *euch* است و برای *er*، *sie*، *es*، *sie* جمع و *Sie* رسمی *sich*.
      برخی فعل‌ها همیشه انعکاسی‌اند، مانند *sich beeilen* (عجله کردن) و *sich
      freuen* (خوشحال شدن). در فارسی این فعل‌ها «خود» ندارند، ولی در آلمانی
      ضمیر لازم است: *Ich beeile mich.* برخی دیگر می‌توانند به‌جای ضمیر
      انعکاسی مفعول دیگری بگیرند: *Ich wasche mich* یا *Ich wasche das Auto*.
      ضمیر انعکاسی درست پس از فعل صرف‌شده می‌آید؛ اگر فاعل ضمیر باشد و پس از
      فعل بیاید، ضمیر انعکاسی پس از فاعل قرار می‌گیرد: *Heute hat sie sich
      verspätet.* با فعل وجهی، ضمیر در میانهٔ جمله می‌ماند و مصدر به پایان
      می‌رود: *Ich kann mich nicht erinnern.* در گذشتهٔ نقلی (*Perfekt*) فعل
      انعکاسی همیشه با *haben* می‌آید: *Ich habe mich beeilt.*
  de:
    rule: >
      Ein reflexives Verb hat ein Pronomen, das zum Subjekt zurückgeht: *Ich
      wasche mich.* Im Akkusativ heißt das Reflexivpronomen *mich*, *dich*,
      *uns* und *euch* wie bekannt, und *sich* bei *er*, *sie*, *es*, *sie*
      (Plural) und *Sie*. Manche Verben sind immer reflexiv, zum Beispiel
      *sich beeilen* und *sich freuen*: *Ich beeile mich.* Andere können auch
      ein anderes Objekt haben: *Ich wasche mich* oder *Ich wasche das Auto*.
      Das Pronomen steht direkt nach dem konjugierten Verb. Steht ein
      Pronomen als Subjekt nach dem Verb, kommt es danach: *Heute hat sie
      sich verspätet.* Mit einem Modalverb steht es in der Mitte, der
      Infinitiv am Ende: *Ich kann mich nicht erinnern.* Im Perfekt haben
      reflexive Verben immer *haben*: *Ich habe mich beeilt.*

