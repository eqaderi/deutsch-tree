    answer: Die
    explanation:
      en: "The last part is *die Karte*, so *die Postkarte*."
      fa: "جزء آخر *die Karte* است، پس *die Postkarte*."
      de: "Das letzte Wort ist *die Karte*, also *die Postkarte*."
  - id: q2
    type: gap-fill
    prompt: ___ Handschuh liegt im Auto.
    options: [Der, Die, Das]
    answer: Der
    explanation:
      en: "The last part is *der Schuh*, so *der Handschuh*, although *Hand* is feminine."
      fa: "جزء آخر *der Schuh* است، پس *der Handschuh*؛ با اینکه *Hand* مؤنث است."
      de: "Das letzte Wort ist *der Schuh*, also *der Handschuh*. *Die Hand* ist egal."
