# Grammar list row 196.
id: grammar-196
kind: grammar
level: A1
chapter: a1-word-building
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-059]
title:
  en: "Noun compounds"
  fa: "اسم‌های مرکب"
  de: "Zusammengesetzte Nomen"

explanations:
  en:
    rule: >
      German joins two or more words into one noun, a compound, written as one
      word with a capital letter only at the start: *die Post* + *die Karte* =
      *die Postkarte*. The last part is the main word. It gives the compound
      its gender and its plural (*das Haus* + *die Tür* = *die Haustür*,
      plural *die Haustüren*), and the parts before it say what kind: a
      *Haustür* is a kind of door. The first part can also be a verb stem or
      an adjective (*der Schreibtisch*, *der Kühlschrank*). Sometimes a
      linking *-s-* or *-n-* stands between the parts (*der
      Geburtstagskuchen*, *die Sonnenbrille*). The stress is on the first
      part: *KÜHLschrank*.
  fa:
    rule: >
      در آلمانی دو یا چند واژه به هم می‌پیوندند و یک اسم مرکب می‌سازند. اسم
      مرکب یک‌جا نوشته می‌شود و فقط حرف اولش بزرگ است: *die Post* + *die
      Karte* = *die Postkarte*. جزء آخر واژهٔ اصلی است و جنس دستوری و جمع
      اسم مرکب را تعیین می‌کند (*das Haus* + *die Tür* = *die Haustür*، جمع:
      *die Haustüren*). اجزای پیش از آن نوعش را نشان می‌دهند: *Haustür* نوعی
      در است، یعنی در ورودی خانه. جزء اول می‌تواند بن فعل یا صفت هم باشد
      (*der Schreibtisch*، *der Kühlschrank*). گاهی میان دو جزء حرف میانجی
      *-s-* یا *-n-* می‌آید (*der Geburtstagskuchen*، *die Sonnenbrille*).
      تکیهٔ واژه روی جزء اول است: *KÜHLschrank*.
  de:
    rule: >
      Man kann zwei oder mehr Wörter zu einem Nomen verbinden: *die Post* +
      *die Karte* = *die Postkarte*. Man schreibt es als ein Wort, nur der
      erste Buchstabe ist groß. Das letzte Wort ist das wichtigste: Es gibt
      den Artikel und den Plural (*das Haus* + *die Tür* = *die Haustür*,
      Plural *die Haustüren*). Die Wörter davor sagen, was für eine Sache es
      ist. Das erste Wort kann auch ein Verb oder ein Adjektiv sein: *der
      Schreibtisch*, *der Kühlschrank*. Manchmal steht ein *-s-* oder ein
      *-n-* zwischen den Wörtern: *der Geburtstagskuchen*, *die
      Sonnenbrille*. Man betont das erste Wort: *KÜHLschrank*.

table:
  columns:
    - { en: First part, fa: جزء اول, de: Erstes Wort }
    - {
        en: "Last part (gives *der*, *die*, *das*)",
        fa: "جزء آخر (جنس را تعیین می‌کند)",
        de: "Letztes Wort (gibt den Artikel)",
      }
    - { en: Compound, fa: اسم مرکب, de: Zusammengesetztes Nomen }
    - { en: Plural, fa: جمع, de: Plural }
  rows:
    - [die Post, die Karte, die Postkarte, die Postkarten]
    - [das Haus, die Tür, die Haustür, die Haustüren]
    - [die Hand, der Schuh, der Handschuh, die Handschuhe]
    - [die Kinder (Plural), das Zimmer, das Kinderzimmer, die Kinderzimmer]
    - [schreiben (Verb), der Tisch, der Schreibtisch, die Schreibtische]
    - [kühl (Adjektiv), der Schrank, der Kühlschrank, die Kühlschränke]
    - [die Sonne, die Brille, die Sonnenbrille (mit -n-), die Sonnenbrillen]
    - [die Woche, das Ende, das Wochenende (mit -n-), die Wochenenden]
    - [der Geburtstag, der Kuchen, der Geburtstagskuchen (mit -s-), die Geburtstagskuchen]
    - [die Arbeit, der Platz, der Arbeitsplatz (mit -s-), die Arbeitsplätze]
    - [das Haus + die Tür, der Schlüssel, der Haustürschlüssel, die Haustürschlüssel]

examples:
  - de: Ich schreibe meiner Oma eine Postkarte.
    en: I'm writing my grandma a postcard.
    fa: برای مادربزرگم کارت پستال می‌نویسم.
  - de: Der Kühlschrank ist fast leer.
    en: The fridge is almost empty.
    fa: یخچال تقریباً خالی است.
  - de: Wo ist meine Sonnenbrille?
    en: Where are my sunglasses?
    fa: عینک آفتابی‌ام کجاست؟
  - de: Der Geburtstagskuchen schmeckt wunderbar.
    en: The birthday cake tastes wonderful.
    fa: کیک تولد خیلی خوشمزه است.
  - de: Unsere Haustür ist rot.
    en: Our front door is red.
    fa: در ورودی خانهٔ ما قرمز است.
  - de: Das Kinderzimmer ist klein, aber hell.
    en: The children's room is small but bright.
    fa: اتاق بچه‌ها کوچک ولی روشن است.
  - de: Im Winter brauche ich Handschuhe.
    en: In winter I need gloves.
    fa: زمستان‌ها دستکش لازم دارم.
  - de: Mein Schreibtisch steht am Fenster.
    en: My desk is by the window.
    fa: میز تحریرم کنار پنجره است.
  - de: Am Wochenende besuchen wir meine Eltern.
    en: At the weekend we visit my parents.
    fa: آخر هفته به دیدن پدر و مادرم می‌رویم.
  - de: Ich finde den Haustürschlüssel nicht.
    en: I can't find the front-door key.
    fa: کلید در خانه را پیدا نمی‌کنم.

mistakes:
  - wrong: Das Haustür ist offen.
    right: Die Haustür ist offen.
    why:
      en: "The last part gives the gender: *die Tür*, so *die Haustür*."
      fa: "جنس را جزء آخر تعیین می‌کند: *die Tür*، پس *die Haustür*."
      de: "Das letzte Wort gibt den Artikel: *die Tür*, also *die Haustür*."
  - wrong: Ich suche meine Sonnebrille.
    right: Ich suche meine Sonnenbrille.
    why:
      en: "*Sonnenbrille* has a linking *-n-*: *Sonne* + *n* + *Brille*."
      fa: "*Sonnenbrille* حرف میانجی *-n-* دارد: *Sonne* + *n* + *Brille*."
      de: "In *Sonnenbrille* steht ein *-n-* zwischen den Wörtern: *Sonne* + *n* + *Brille*."
  - wrong: Wo ist die Post Karte?
    right: Wo ist die Postkarte?
    why:
      en: A compound is one word, with a capital letter only at the start.
      fa: اسم مرکب یک واژه است و فقط حرف اولش بزرگ نوشته می‌شود.
      de: Ein zusammengesetztes Nomen ist ein Wort. Nur der erste Buchstabe ist groß.
  - wrong: Die Handschuhen sind warm.
    right: Die Handschuhe sind warm.
    why:
      en: "The plural is the plural of the last part: *die Schuhe*, so *die Handschuhe*."
      fa: "جمع اسم مرکب همان جمع جزء آخر است: *die Schuhe*، پس *die Handschuhe*."
      de: "Der Plural ist der Plural vom letzten Wort: *die Schuhe*, also *die Handschuhe*."

