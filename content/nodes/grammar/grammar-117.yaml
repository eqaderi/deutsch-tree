    explanation:
      en: "The *Partizip II* before a noun says what has been done to it: someone has repaired it."
      fa: "صفت مفعولی پیش از اسم می‌گوید چه کاری روی آن انجام شده است: کسی آن را تعمیر کرده است."
      de: "Das Partizip II vor dem Nomen sagt, was man damit gemacht hat: Jemand hat sie repariert."
