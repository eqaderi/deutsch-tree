# Grammar list row 117.
id: grammar-117
kind: grammar
level: B1
chapter: b1-adjectives-participles
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-017, grammar-107]
title:
  en: "*Partizip II* as adjective"
  fa: "صفت مفعولی (*Partizip II*) پیش از اسم"
  de: "Partizip II als Adjektiv"

explanations:
  en:
    rule: >
      The *Partizip II* can stand before a noun like an adjective. It then
      takes the usual adjective endings, after the whole participle: *ein
      gemietetes Fahrrad* (a rented bike), *die geschlossene Tür*, *mit
      gekochten Eiern*. It says what has been done to the thing: *ein
      repariertes Auto* is a car that someone has repaired. Every kind of
      participle can do this: regular (*gemietet*), irregular (*das
      gestohlene Auto*), separable (*die eingeladenen Gäste*) and without
      *ge-* (*der reparierte Computer*). After *sein* the participle takes no
      ending: *Die Tür ist geschlossen.*
  fa:
    rule: >
      صفت مفعولی (*Partizip II*) می‌تواند مانند صفت پیش از اسم بیاید. در این
      صورت همان پایانه‌های معمول صفت را می‌گیرد که به آخر خود صفت مفعولی
      افزوده می‌شوند: *ein gemietetes Fahrrad* (دوچرخهٔ اجاره‌ای)، *die
      geschlossene Tür* (در بسته)، *mit gekochten Eiern* (با تخم‌مرغ
      آب‌پز). این صفت می‌گوید چه کاری روی آن چیز انجام شده است: *ein
      repariertes Auto* ماشینی است که کسی آن را تعمیر کرده است. فارسی هم
      همین کار را می‌کند: *das zerbrochene Glas* یعنی «شیشهٔ شکسته». همهٔ
      صفت‌های مفعولی این‌طور به کار می‌روند: باقاعده (*gemietet*)، بی‌قاعده
      (*das gestohlene Auto*)، از فعل جداشدنی (*die eingeladenen Gäste*) و
      بدون *ge-* (*der reparierte Computer*). پس از *sein* صفت مفعولی پایانه
      نمی‌گیرد: *Die Tür ist geschlossen.*
  de:
    rule: >
      Das Partizip II kann wie ein Adjektiv vor einem Nomen stehen. Dann hat
      es die normalen Adjektivendungen, am Ende vom ganzen Partizip: *ein
      gemietetes Fahrrad*, *die geschlossene Tür*, *mit gekochten Eiern*. Es
      sagt, was man mit der Sache gemacht hat: *Ein repariertes Auto* ist ein
      Auto, das jemand repariert hat. Das geht mit jedem Partizip:
      regelmäßig (*gemietet*), unregelmäßig (*das gestohlene Auto*),
      trennbar (*die eingeladenen Gäste*) und ohne *ge-* (*der reparierte
      Computer*). Nach *sein* hat das Partizip keine Endung: *Die Tür ist
      geschlossen.*

# How the form is made, with one example each. The endings themselves are the
# ones of grammar-107 to grammar-109, so this table shows the participle.
table:
  columns:
    - { en: Infinitive, fa: مصدر, de: Infinitiv }
    - { en: "*Partizip II*", fa: "صفت مفعولی (*Partizip II*)", de: Partizip II }
    - { en: Before a noun, fa: پیش از اسم, de: Vor einem Nomen }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [mieten, gemietet, ein gemietetes Fahrrad, Wir fahren mit gemieteten Fahrrädern.]
    - [kochen, gekocht, gekochte Eier (Plural), Zum Frühstück gibt es gekochte Eier.]
    - [schließen, geschlossen, die geschlossene Tür, Hinter der geschlossenen Tür ist es still.]
    - [stehlen, gestohlen, das gestohlene Auto, Die Polizei hat das gestohlene Auto gefunden.]
    - [einladen, eingeladen, die eingeladenen Gäste (Plural), Die eingeladenen Gäste sind alle gekommen.]
    - [ausfüllen, ausgefüllt, das ausgefüllte Formular, Bitte bringen Sie das ausgefüllte Formular mit.]
    - [reparieren, repariert, der reparierte Computer, Der reparierte Computer funktioniert wieder.]

examples:
  - de: Im Urlaub fahren wir mit gemieteten Fahrrädern.
    en: On holiday we ride rented bikes.
    fa: در تعطیلات با دوچرخه‌های اجاره‌ای گردش می‌کنیم.
  - de: Zum Frühstück gibt es gekochte Eier.
    en: There are boiled eggs for breakfast.
    fa: برای صبحانه تخم‌مرغ آب‌پز داریم.
  - de: Die Polizei hat das gestohlene Auto gefunden.
    en: The police have found the stolen car.
    fa: پلیس ماشین دزدیده‌شده را پیدا کرده است.
  - de: Die eingeladenen Gäste sind alle gekommen.
    en: The invited guests have all come.
    fa: مهمان‌های دعوت‌شده همه آمده‌اند.
  - de: Ich habe ein gebrauchtes Auto gekauft.
    en: I bought a used car.
    fa: یک ماشین دست‌دوم خریدم.
  - de: Bitte bringen Sie das ausgefüllte Formular mit.
    en: Please bring the completed form with you.
    fa: لطفاً فرم پرشده را با خودتان بیاورید.
  - de: Der reparierte Computer funktioniert wieder.
    en: The repaired computer works again.
    fa: کامپیوتر تعمیرشده دوباره کار می‌کند.
  - de: Hinter der geschlossenen Tür war es ganz still.
    en: Behind the closed door it was completely quiet.
    fa: پشت در بسته کاملاً ساکت بود.
  - de: Wir haben eine renovierte Wohnung gemietet.
    en: We have rented a renovated flat.
    fa: یک آپارتمان بازسازی‌شده اجاره کرده‌ایم.

mistakes:
  - wrong: Das ist ein gestohlen Fahrrad.
    right: Das ist ein gestohlenes Fahrrad.
    why:
      en: "Before a noun the *Partizip II* takes an adjective ending: after *ein* with a neuter noun, *-es*."
      fa: "صفت مفعولی پیش از اسم پایانهٔ صفت می‌گیرد: پس از *ein* و با اسم خنثی، *-es*."
      de: "Vor einem Nomen hat das Partizip II eine Adjektivendung: nach *ein* bei *das*-Nomen *-es*."
  - wrong: Die Gäste sind eingeladenen.
    right: Die Gäste sind eingeladen.
    why:
      en: "After *sein* the participle takes no ending, like any adjective after *sein*."
      fa: "پس از *sein* صفت مفعولی پایانه نمی‌گیرد، مانند هر صفت دیگری پس از *sein*."
      de: "Nach *sein* hat das Partizip keine Endung, wie jedes Adjektiv nach *sein*."
  - wrong: Der gereparierte Computer funktioniert wieder.
    right: Der reparierte Computer funktioniert wieder.
    why:
      en: "Verbs in *-ieren* have no *ge-* in the *Partizip II*, also before a noun: *repariert*."
      fa: "فعل‌های *-ieren* در صفت مفعولی *ge-* نمی‌گیرند، پیش از اسم هم: *repariert*."
      de: "Verben auf *-ieren* haben im Partizip II kein *ge-*, auch nicht vor einem Nomen: *repariert*."
  - wrong: Wir begrüßen die eingeladene Gäste.
    right: Wir begrüßen die eingeladenen Gäste.
    why:
      en: "After plural *die* the ending is *-en*, also on a participle: *die eingeladenen Gäste*."
      fa: "پس از *die* جمع پایانه *-en* است، روی صفت مفعولی هم: *die eingeladenen Gäste*."
      de: "Nach *die* im Plural ist die Endung *-en*, auch beim Partizip: *die eingeladenen Gäste*."

