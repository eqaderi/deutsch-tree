      en: "After *das* in the *Akkusativ* the ending is *-e*: *das gestohlene Auto*."
      fa: "پس از *das* در حالت *Akkusativ* پایانه *-e* است: *das gestohlene Auto*."
      de: "Nach *das* im Akkusativ ist die Endung *-e*: *das gestohlene Auto*."
