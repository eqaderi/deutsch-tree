    explanation:
      en: "*Gebraucht* is the *Partizip II* of *gebrauchen* (to use): a used car, one that someone had before."
      fa: "*gebraucht* صفت مفعولی *gebrauchen* (به کار بردن) است: ماشین دست‌دوم، یعنی ماشینی که پیش‌تر کسی از آن استفاده کرده است."
      de: "*Gebraucht* ist das Partizip II von *gebrauchen*: Jemand hatte das Auto schon vorher."
