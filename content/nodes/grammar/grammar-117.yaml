    explanation:
      en: "*Mit* takes the *Dativ*; plural without an article: *-en*, after the whole participle."
      fa: "*mit* با حالت *Dativ* می‌آید. در جمع و بدون حرف تعریف، پایانه *-en* است که به آخر صفت مفعولی افزوده می‌شود."
      de: "Nach *mit* steht der Dativ. Plural ohne Artikel: *-en*, am Ende vom Partizip."
