    - [trennbar, fernsehen, ferngesehen, Habt ihr ferngesehen?]
    - [trennbar, aufstehen, aufgestanden, Er ist früh aufgestanden.]
    - [untrennbar, besuchen, besucht, Ich habe Oma besucht.]
    - [untrennbar, erzählen, erzählt, Sie hat viel erzählt.]
