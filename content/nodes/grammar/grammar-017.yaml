# Grammar list row 17.
id: grammar-017
kind: grammar
level: A2
chapter: a2-past
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-005, grammar-006, grammar-016]
title:
  en: "*Perfekt* of separable, inseparable and *-ieren* verbs"
  fa: "گذشتهٔ نقلی (*Perfekt*) فعل‌های جداشدنی، جدانشدنی و فعل‌های *-ieren*"
  de: "Perfekt von trennbaren Verben, untrennbaren Verben und Verben auf *-ieren*"

explanations:
  en:
    rule: >
      Three groups of verbs build their *Partizip II* in their own way. A
      separable verb puts *ge-* between the prefix and the rest of the verb:
      *anrufen*, *angerufen*; *einkaufen*, *eingekauft*. An inseparable verb
      (*be-*, *ver-*, *er-*, *ent-*) takes no *ge-*: *verstehen*,
      *verstanden*; *besuchen*, *besucht*. A verb in *-ieren* takes no *ge-*
      either and always ends in *-t*: *telefonieren*, *telefoniert*. Whether
      the participle ends in *-t* or *-en* comes from the simple verb (*rufen*,
      *gerufen*, so *angerufen*), and verbs of movement or change still take
      *sein*: *Ich bin früh aufgestanden.*
  fa:
    rule: >
      سه گروه از فعل‌ها صفت مفعولی (*Partizip II*) را به شیوهٔ خود می‌سازند.
      در فعل جداشدنی، *ge-* میان پیشوند و بقیهٔ فعل می‌آید: *anrufen*،
      *angerufen*؛ *einkaufen*، *eingekauft*. فعل جدانشدنی (با پیشوند *be-*،
      *ver-*، *er-* یا *ent-*) *ge-* نمی‌گیرد: *verstehen*، *verstanden*؛
      *besuchen*، *besucht*. فعل‌هایی که به *-ieren* ختم می‌شوند نیز *ge-*
      نمی‌گیرند و همیشه به *-t* ختم می‌شوند: *telefonieren*، *telefoniert*.
      این‌که صفت مفعولی به *-t* ختم شود یا به *-en*، به فعل ساده بستگی دارد
      (*rufen*، *gerufen*؛ پس *angerufen*). فعل‌های حرکت و تغییر در این‌جا هم
      با *sein* می‌آیند: *Ich bin früh aufgestanden.*
  de:
    rule: >
      Drei Gruppen von Verben bilden das Partizip II anders. Bei trennbaren
      Verben steht *ge-* zwischen dem Präfix und dem Verb: *anrufen*,
      *angerufen*; *einkaufen*, *eingekauft*. Untrennbare Verben (*be-*,
      *ver-*, *er-*, *ent-*) haben kein *ge-*: *verstehen*, *verstanden*;
      *besuchen*, *besucht*. Verben auf *-ieren* haben auch kein *ge-* und
      enden immer auf *-t*: *telefonieren*, *telefoniert*. Ob das Partizip auf
      *-t* oder *-en* endet, sagt das einfache Verb: *rufen*, *gerufen*, also
      *angerufen*. Verben der Bewegung und der Veränderung haben wie immer
      *sein*: *Ich bin früh aufgestanden.*

