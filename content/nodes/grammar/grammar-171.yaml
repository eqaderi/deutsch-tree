examples:
  - de: Ich warte hier, bis du zurückkommst.
    en: I'll wait here until you come back.
    fa: این‌جا منتظر می‌مانم تا برگردی.
  - de: Wir bleiben im Café, bis der Regen aufhört.
    en: We'll stay in the café until the rain stops.
    fa: در کافه می‌مانیم تا باران بند بیاید.
  - de: Lies bitte weiter, bis ich dich rufe.
    en: Please keep reading until I call you.
    fa: لطفاً به خواندن ادامه بده تا صدایت کنم.
  - de: Es dauert noch eine Stunde, bis der Zug kommt.
    en: It will be another hour until the train comes.
    fa: یک ساعت دیگر مانده تا قطار برسد.
  - de: Er hat in der Firma gearbeitet, bis er in Rente gegangen ist.
    en: He worked at the company until he retired.
    fa: او تا زمان بازنشستگی در آن شرکت کار کرد.
  - de: Wir müssen warten, bis die Ampel grün ist.
    en: We have to wait until the light is green.
    fa: باید صبر کنیم تا چراغ سبز شود.
  - de: Bis du kommst, bin ich fertig.
    en: By the time you come, I'll be finished.
    fa: تا تو برسی، کارم تمام شده است.
  - de: Der Laden ist bis 20 Uhr geöffnet.
    en: The shop is open until 8 p.m.
    fa: فروشگاه تا ساعت ۸ شب باز است.

mistakes:
  - wrong: Ich warte hier, bis du kommst zurück.
    right: Ich warte hier, bis du zurückkommst.
    why:
      en: "In the *bis* clause a separable verb is one word at the end: *zurückkommst*."
      fa: "در جملهٔ پیرو با *bis* فعل جداشدنی یک‌جا در پایان جمله می‌آید: *zurückkommst*."
      de: "Im *bis*-Satz steht ein trennbares Verb zusammen am Ende: *zurückkommst*."
  - wrong: Warte bitte, bevor ich fertig bin.
    right: Warte bitte, bis ich fertig bin.
    why:
      en: 'The waiting lasts up to the moment I am finished: *bis*, "until". *Bevor* only says what comes earlier.'
      fa: "منتظر ماندن تا لحظه‌ای ادامه دارد که کار من تمام شود: *bis*. *bevor* فقط می‌گوید چه چیزی زودتر است."
      de: "Das Warten dauert bis zu dem Moment, in dem ich fertig bin: *bis*. *Bevor* sagt nur, was früher passiert."
  - wrong: Bis der Film anfängt, wir trinken noch etwas.
    right: Bis der Film anfängt, trinken wir noch etwas.
    why:
      en: "The *bis* clause is position 1, so the main clause starts with its verb: *trinken wir*."
      fa: "جملهٔ پیرو با *bis* جایگاه اول است، پس جملهٔ پایه با فعلش آغاز می‌شود: *trinken wir*."
      de: "Der *bis*-Satz ist Position 1. Danach kommt sofort das Verb: *trinken wir*."
  - wrong: Wir bleiben hier, bis der Regen hört auf.
    right: Wir bleiben hier, bis der Regen aufhört.
    why:
      en: "In the *bis* clause the conjugated verb goes to the end, a separable verb as one word: *aufhört*."
      fa: "در جملهٔ پیرو با *bis* فعل صرف‌شده به پایان جمله می‌رود و فعل جداشدنی یک‌جا نوشته می‌شود: *aufhört*."
      de: "Im *bis*-Satz steht das konjugierte Verb am Ende, ein trennbares Verb zusammen: *aufhört*."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Ich warte hier, ___ du zurückkommst.
    options: [als, seit, bis]
    answer: bis
    explanation:
      en: 'The waiting lasts up to your return: *bis*, "until".'
      fa: "منتظر ماندن تا برگشتن تو ادامه دارد: *bis*، یعنی «تا»."
      de: "Das Warten dauert bis zu deiner Rückkehr: *bis*."
  - id: gap-2
    type: gap-fill
    prompt: Wir bleiben im Café, bis der Regen ___.
    options: [hört auf, aufhört, aufhören]
    answer: aufhört
    explanation:
      en: "In the *bis* clause the separable verb is one word at the end: *aufhört*."
      fa: "در جملهٔ پیرو با *bis* فعل جداشدنی یک‌جا در پایان جمله می‌آید: *aufhört*."
      de: "Im *bis*-Satz steht das trennbare Verb zusammen am Ende: *aufhört*."
  - id: gap-3
    type: gap-fill
    prompt: Der Laden hat heute ___ 20 Uhr geöffnet, dann schließt er.
    options: [bevor, bis, als]
    answer: bis
    explanation:
      en: 'Before a time, "until" is the preposition *bis*: *bis 20 Uhr*.'
      fa: "پیش از زمان، «تا» حرف اضافهٔ *bis* است: *bis 20 Uhr*."
      de: "Vor einer Uhrzeit steht die Präposition *bis*: *bis 20 Uhr*."
  - id: gap-4
    type: gap-fill
    prompt: Es dauert noch eine Stunde, ___ der Zug kommt.
    options: [bis, als, seit]
    answer: bis
    explanation:
      en: "One more hour, up to the train's arrival: *bis*."
      fa: "یک ساعت دیگر، تا رسیدن قطار: *bis*."
      de: "Noch eine Stunde, bis zur Ankunft vom Zug: *bis*."
  - id: choice-1
    type: multiple-choice
    prompt: Bis der Film anfängt, …
    options: [wir trinken noch etwas., trinken wir noch etwas., noch etwas wir trinken.]
    answer: trinken wir noch etwas.
    explanation:
      en: "The *bis* clause is position 1, so the main clause starts with its verb: *trinken wir*."
      fa: "جملهٔ پیرو با *bis* جایگاه اول است، پس جملهٔ پایه با فعلش آغاز می‌شود: *trinken wir*."
      de: "Der *bis*-Satz ist Position 1. Der Hauptsatz beginnt mit dem Verb: *trinken wir*."
  - id: choice-2
    type: multiple-choice
    prompt: "Ich bleibe im Büro, bis mein Chef kommt. Wann gehe ich frühestens?"
    options: [Bevor mein Chef kommt., Wenn mein Chef da ist., Ich gehe gar nicht.]
    answer: Wenn mein Chef da ist.
    explanation:
      en: "I stay up to the moment the boss comes, so I can leave once he is there, not earlier."
      fa: "تا لحظهٔ آمدن رئیس می‌مانم، پس زودتر از آمدن او نمی‌روم و وقتی آمد می‌توانم بروم."
      de: "Ich bleibe bis zu dem Moment, in dem der Chef kommt. Also gehe ich erst, wenn er da ist."
  - id: choice-3
    type: multiple-choice
    prompt: Lies bitte weiter, …
    options: [bis ich rufe dich., bis ich dich rufe., bis rufe ich dich.]
    answer: bis ich dich rufe.
    explanation:
      en: "After *bis* come the subject and the object, and the verb *rufe* goes to the end."
      fa: "پس از *bis* فاعل و مفعول می‌آیند و فعل *rufe* به پایان جمله می‌رود."
      de: "Nach *bis* kommen Subjekt und Objekt, das Verb *rufe* steht am Ende."
  - id: true-1
    type: true-false
    prompt: Wir müssen warten, bis die Ampel grün ist.
    answer: true
    explanation:
      en: "*Bis* with *ist* at the end. The sentence is correct."
      fa: "*bis* با *ist* در پایان جمله. جمله درست است."
      de: "*Bis* mit *ist* am Ende. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Ich warte hier, bis du kommst zurück.
    answer: false
    explanation:
      en: "The separable verb is one word at the end: *…, bis du zurückkommst.*"
      fa: "فعل جداشدنی یک‌جا در پایان جمله می‌آید: *…, bis du zurückkommst.*"
      de: "Das trennbare Verb steht zusammen am Ende: *…, bis du zurückkommst.*"
  - id: true-3
    type: true-false
    prompt: Bis du kommst, bin ich fertig.
    answer: true
    explanation:
      en: 'The *bis* clause is position 1, *bin* comes next. "By the time you come, I''ll be finished." The sentence is correct.'
      fa: "جملهٔ پیرو با *bis* جایگاه اول است و *bin* پس از آن می‌آید: «تا تو برسی، کارم تمام شده است». جمله درست است."
      de: "Der *bis*-Satz ist Position 1, danach kommt *bin*. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Bis der Bus kommt, wir warten hier.
    answer: false
    explanation:
      en: "After the *bis* clause the verb comes first: *…, warten wir hier.*"
      fa: "پس از جملهٔ پیرو با *bis* فعل اول می‌آید: *…, warten wir hier.*"
      de: "Nach dem *bis*-Satz kommt zuerst das Verb: *…, warten wir hier.*"
  - id: true-5
    type: true-false
    prompt: Er hat in der Firma gearbeitet, bis er in Rente gegangen ist.
    answer: true
    explanation:
      en: "*Bis* with *gegangen ist* at the end, both clauses in the *Perfekt*. The sentence is correct."
      fa: "*bis* با *gegangen ist* در پایان جمله و هر دو جمله در گذشتهٔ نقلی. جمله درست است."
      de: "*Bis* mit *gegangen ist* am Ende, beide Sätze im Perfekt. Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Ich warte hier, bis du ___ (zurückkommen).
    answers: [zurückkommst]
    explanation:
      en: "With *du*: *kommst*, and the separable verb is one word at the end: *zurückkommst*."
      fa: "با *du* می‌شود *kommst* و فعل جداشدنی یک‌جا در پایان جمله می‌آید: *zurückkommst*."
      de: "Bei *du*: *kommst*. Das trennbare Verb steht zusammen am Ende: *zurückkommst*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Bis der Bus kommt, ___ (lesen) ich noch ein bisschen.
    answers: [lese]
    explanation:
      en: "The *bis* clause is position 1, so the verb *lese* comes next, before *ich*."
      fa: "جملهٔ پیرو با *bis* جایگاه اول است، پس فعل *lese* پیش از *ich* می‌آید."
      de: "Der *bis*-Satz ist Position 1. Danach kommt das Verb *lese*, vor *ich*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Wir bleiben hier, ___ (bis / bevor) der Regen aufhört.
    answers: [bis]
    explanation:
      en: "We stay up to the moment the rain stops: *bis*."
      fa: "تا لحظه‌ای که باران بند بیاید می‌مانیم: *bis*."
      de: "Wir bleiben bis zu dem Moment, in dem der Regen aufhört: *bis*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Es dauert noch zehn Minuten, bis das Essen fertig ___ (sein).
    answers: [ist]
    explanation:
      en: "The *bis* clause is about something still to come, in the *Präsens*, with *ist* at the end."
      fa: "جملهٔ پیرو با *bis* دربارهٔ کاری است که هنوز در پیش است، پس زمان حال می‌آید و *ist* در پایان جمله."
      de: "Der *bis*-Satz spricht über später, im Präsens. *Ist* steht am Ende."
  - id: error-1
    type: find-error
    prompt: Ich bleibe zu Hause, seit der Regen aufhört.
    answer: seit
    explanation:
      en: "Staying at home lasts up to the moment the rain stops: *…, bis der Regen aufhört.*"
      fa: "در خانه ماندن تا لحظهٔ بند آمدن باران ادامه دارد: *…, bis der Regen aufhört.*"
      de: "Ich bleibe bis zu dem Moment, in dem der Regen aufhört: *…, bis der Regen aufhört.*"
  - id: error-2
    type: find-error
    prompt: Warte bitte, bevor ich fertig bin.
    answer: bevor
    explanation:
      en: "The waiting lasts up to the moment I am finished: *Warte bitte, bis ich fertig bin.*"
      fa: "منتظر ماندن تا لحظه‌ای ادامه دارد که کار من تمام شود: *Warte bitte, bis ich fertig bin.*"
      de: "Das Warten dauert, bis ich fertig bin: *Warte bitte, bis ich fertig bin.*"
  - id: order-1
    type: word-order
    answers:
      - ["bis der Bus kommt,", warten, wir, hier]
    explanation:
      en: "The *bis* clause is position 1, so the verb *warten* comes next, then the subject."
      fa: "جملهٔ پیرو با *bis* جایگاه اول است، پس فعل *warten* و سپس فاعل می‌آید."
      de: "Der *bis*-Satz ist Position 1. Dann kommt das Verb *warten*, danach das Subjekt."
  - id: order-2
    type: word-order
    answers:
      - ["ich warte hier,", bis, du, zurückkommst]
    explanation:
      en: "*Bis* starts the clause, then the subject, and the separable verb *zurückkommst* comes last as one word."
      fa: "*bis* جمله را آغاز می‌کند، سپس فاعل می‌آید و فعل جداشدنی *zurückkommst* یک‌جا در آخر."
      de: "*Bis* beginnt den Satz, dann kommt das Subjekt, das trennbare Verb *zurückkommst* steht zusammen am Ende."
  - id: match-1
    type: matching
    answer:
      - ["Ich warte hier, ___ du zurückkommst.", bis]
      - ["Ruf mich an, ___ du losfährst.", bevor]
      - ["___ ich gegessen hatte, ging ich ins Bett.", nachdem]
    explanation:
      en: "The waiting lasts up to the return: *bis*. The call comes earlier than leaving: *bevor*. The meal was finished first, in the *Plusquamperfekt*: *nachdem*."
      fa: "منتظر ماندن تا برگشتن ادامه دارد: *bis*. تماس پیش از راه افتادن است: *bevor*. غذا خوردن اول تمام شده و در گذشتهٔ بعید است: *nachdem*."
      de: "Das Warten dauert bis zur Rückkehr: *bis*. Der Anruf kommt vor der Abfahrt: *bevor*. Das Essen war zuerst fertig, im Plusquamperfekt: *nachdem*."

