# Grammar list row 171.
id: grammar-171
kind: grammar
level: B1
chapter: b1-time-clauses
order: 6
status: published
recogniseOnly: false
prerequisites: [grammar-120, grammar-157]
title:
  en: "*bis* as conjunction"
  fa: "*bis* به‌عنوان حرف ربط"
  de: "*bis* als Konjunktion"

explanations:
  en:
    rule: >
      *Bis* (until) can start a subordinate clause, so the conjugated verb
      goes to the end: *Ich warte hier, bis du zurückkommst.* The main clause
      says what goes on; the *bis* clause names the moment when it stops.
      For something still to come, both clauses are usually in the
      *Präsens*. The *bis* clause can also come first, often with the
      meaning "by the time"; then the main clause starts with its verb: *Bis
      du kommst, bin ich fertig.* Before a time or a noun, *bis* is the
      preposition you know: *bis Freitag*, *bis zum Abend*. Do not use
      *bevor* for "until": *bevor* only says that one thing comes earlier,
      *bis* says that it lasts up to the other.
  fa:
    rule: >
      *bis* (تا، تا وقتی که) می‌تواند جملهٔ پیرو را آغاز کند، پس فعل
      صرف‌شده به پایان جمله می‌رود: *Ich warte hier, bis du zurückkommst.*
      جملهٔ پایه می‌گوید چه کاری ادامه دارد و جملهٔ پیرو با *bis* لحظه‌ای را
      می‌گوید که آن کار تمام می‌شود. برای کاری که هنوز در پیش است، هر دو
      جمله معمولاً در زمان حال (*Präsens*) می‌آیند. جملهٔ پیرو با *bis*
      می‌تواند اول هم بیاید، اغلب به معنای «تا وقتی که … برسد»؛ آن‌گاه جملهٔ
      پایه با فعلش آغاز می‌شود: *Bis du kommst, bin ich fertig.* پیش از
      زمان یا اسم، *bis* همان حرف اضافه‌ای است که می‌شناسید: *bis Freitag*،
      *bis zum Abend*. برای «تا» از *bevor* استفاده نکنید: *bevor* فقط
      می‌گوید کاری زودتر است، ولی *bis* می‌گوید کار تا رسیدن کار دیگر ادامه
      دارد.
  de:
    rule: >
      Mit *bis* kann ein Nebensatz beginnen. Das konjugierte Verb steht am
      Ende: *Ich warte hier, bis du zurückkommst.* Der Hauptsatz sagt, was
      dauert. Der *bis*-Satz sagt, wann es aufhört. Geht es um später, stehen
      meistens beide Sätze im Präsens. Der *bis*-Satz kann auch zuerst
      stehen. Dann beginnt der Hauptsatz mit dem Verb: *Bis du kommst, bin
      ich fertig.* Vor einer Zeit oder einem Nomen ist *bis* die Präposition:
      *bis Freitag*, *bis zum Abend*. Sagen Sie hier nicht *bevor*: *Bevor*
      sagt nur, was früher passiert. *Bis* sagt, dass etwas so lange dauert.

table:
  columns:
    - { en: "Main clause: what goes on", fa: "جملهٔ پایه: کاری که ادامه دارد", de: "Hauptsatz: was dauert" }
    - { en: "*Bis* clause: when it stops", fa: "جملهٔ پیرو با *bis*: کی تمام می‌شود", de: "*Bis*-Satz: wann es aufhört" }
  rows:
    - ["Ich warte hier,", bis du zurückkommst.]
    - ["Wir bleiben im Café,", bis der Regen aufhört.]
    - ["Lies bitte weiter,", bis ich dich rufe.]
    - ["Es dauert noch eine Stunde,", bis der Zug kommt.]
    - ["Er hat dort gearbeitet,", bis er in Rente gegangen ist.]

# A bar on the time line that runs up to a stop. The bar is the main clause,
# the stop is the bis clause.
diagrams:
  - caption:
      en: >
        *Ich warte hier, bis du zurückkommst.* The waiting goes on up to one
        moment: the *bis* clause names that moment.
      fa: >
        در جملهٔ *Ich warte hier, bis du zurückkommst.* منتظر ماندن تا یک لحظه ادامه
        دارد و جملهٔ پیرو با *bis* همان لحظه را می‌گوید.
      de: >
        *Ich warte hier, bis du zurückkommst.* Das Warten dauert bis zu einem
        Moment. Der *bis*-Satz nennt diesen Moment.
