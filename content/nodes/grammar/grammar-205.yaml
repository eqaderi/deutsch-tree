  - id: choice-1
    type: multiple-choice
    prompt: Welches Nomen ist feminin?
    options: [Zeitung, Tischchen, Dienstag]
    answer: Zeitung
    explanation:
      en: "*-ung* is feminine: *die Zeitung*. *Das Tischchen* is neuter (*-chen*) and *der Dienstag* masculine (a day)."
      fa: "*-ung* مؤنث است: *die Zeitung*. *das Tischchen* خنثی است (*-chen*) و *der Dienstag* مذکر (نام روز)."
      de: "*-ung* ist feminin: *die Zeitung*. *Das Tischchen* ist neutral (*-chen*), *der Dienstag* ist maskulin (ein Tag)."
