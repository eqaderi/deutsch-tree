      fa: "بیشتر اسم‌هایی که به *-e* ختم می‌شوند مؤنث‌اند (*die Lampe*، *die Straße*)، ولی *Name* استثناست: *der Name*."
      de: "Die meisten Nomen auf *-e* sind feminin (*die Lampe*, *die Straße*). *Name* ist eine Ausnahme: *der Name*."
