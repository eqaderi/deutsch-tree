# Grammar list row 205.
id: grammar-205
kind: grammar
level: A1
chapter: a1-nouns-articles
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-059]
title:
  en: "Gender rules of thumb"
  fa: "قاعده‌های سرانگشتی برای جنس دستوری"
  de: "Faustregeln für das Genus"

explanations:
  en:
    rule: >
      The meaning or the ending of a noun often tells you its gender. Days,
      months, seasons, weather words, alcoholic drinks and car makes are
      masculine (*der*). Nouns ending in *-ung*, *-heit*, *-keit*, *-ion* and
      *-in* are feminine (*die*), and so are most nouns in *-e*. Nouns in
      *-chen* and *-lein* are always neuter (*das*), and so are most nouns
      that begin with *Ge-* and many that end in *-o*. These are rules of
      thumb: learn the common exceptions in the table with them, and still
      learn every noun with its article.
  fa:
    rule: >
      معنا یا پایانهٔ اسم اغلب جنس دستوری آن را نشان می‌دهد. نام روزها،
      ماه‌ها و فصل‌ها، واژه‌های مربوط به هوا، نوشیدنی‌های الکلی و مارک‌های
      خودرو مذکرند (*der*). اسم‌هایی که به *-ung*، *-heit*، *-keit*، *-ion* و
      *-in* ختم می‌شوند مؤنث‌اند (*die*)؛ بیشتر اسم‌هایی که به *-e* ختم
      می‌شوند نیز مؤنث‌اند. اسم‌هایی که به *-chen* و *-lein* ختم می‌شوند
      همیشه خنثی‌اند (*das*)، و همچنین بیشتر اسم‌هایی که با *Ge-* آغاز
      می‌شوند و بسیاری از اسم‌هایی که به *-o* ختم می‌شوند. این‌ها قاعده‌های
      سرانگشتی‌اند: استثناهای رایج جدول را همراه آن‌ها یاد بگیرید و باز هم هر
      اسم را با حرف تعریفش بیاموزید.
  de:
    rule: >
      Oft zeigt die Bedeutung oder die Endung das Genus. Wochentage, Monate,
      Jahreszeiten, Wörter für das Wetter, alkoholische Getränke und
      Automarken sind maskulin: *der*. Nomen auf *-ung*, *-heit*, *-keit*,
      *-ion* und *-in* sind feminin: *die*. Die meisten Nomen auf *-e* sind
      auch feminin. Nomen auf *-chen* und *-lein* sind immer neutral: *das*.
      Die meisten Nomen mit *Ge-* und viele Nomen auf *-o* sind auch neutral.
      Es gibt Ausnahmen. Lernen Sie den Artikel immer mit.

table:
  columns:
    - { en: Sign, fa: نشانه, de: Merkmal }
    - { en: Article, fa: حرف تعریف, de: Artikel }
    - { en: Examples, fa: مثال, de: Beispiele }
    - { en: Exceptions, fa: استثنا, de: Ausnahmen }
  rows:
    - ["Wochentage, Monate, Jahreszeiten", der, "der Montag, der Mai, der Herbst", das Frühjahr]
    - [Wetter, der, "der Regen, der Schnee, der Nebel", "das Wetter, das Gewitter"]
    - [alkoholische Getränke, der, "der Wein, der Sekt, der Schnaps", das Bier]
    - [Automarken, der, "der BMW, der Mercedes, der VW", –]
    - ["-ung, -heit, -keit, -ion", die, "die Rechnung, die Möglichkeit, die Station", –]
    - ["-in (Frauen)", die, "die Lehrerin, die Freundin", –]
    - ["-e (die meisten)", die, "die Lampe, die Straße, die Woche", "der Name, der Junge, der Käse, das Ende"]
    - ["-chen, -lein", das, "das Mädchen, das Tischchen, das Brötchen", –]
    - ["Ge- (die meisten)", das, "das Gebäude, das Gemüse, das Geschenk", "der Geburtstag, die Geschichte"]
    - ["-o (viele)", das, "das Auto, das Konto, das Kino", der Euro]

examples:
  - de: Der Montag ist mein Lieblingstag.
    en: Monday is my favourite day.
    fa: دوشنبه روز محبوب من است.
  - de: Der Herbst ist in Berlin oft kalt.
    en: Autumn in Berlin is often cold.
    fa: پاییز در برلین اغلب سرد است.
  - de: Der Nebel ist heute sehr dicht.
    en: The fog is very thick today.
    fa: امروز مه خیلی غلیظ است.
  - de: Die Rechnung ist zu hoch.
    en: The bill is too high.
    fa: مبلغ صورت‌حساب خیلی بالاست.
  - de: Die Lehrerin heißt Frau Schmidt.
    en: The teacher is called Ms Schmidt.
    fa: نام معلم خانم *Schmidt* است.
  - de: Das Brötchen ist noch warm.
    en: The bread roll is still warm.
    fa: نان هنوز گرم است.
  - de: Das Gemüse ist frisch.
    en: The vegetables are fresh.
    fa: سبزی‌ها تازه‌اند.
  - de: Das Konto ist leer.
    en: The account is empty.
    fa: حساب بانکی خالی است.
  - de: Der Käse kommt aus Holland.
    en: The cheese comes from Holland.
    fa: پنیر از هلند می‌آید.
  - de: Das Bier ist kalt.
    en: The beer is cold.
    fa: آبجو سرد است.

mistakes:
  - wrong: Das Zeitung liegt hier.
    right: Die Zeitung liegt hier.
    why:
      en: "Nouns in *-ung* are always feminine: *die Zeitung*."
      fa: "اسم‌هایی که به *-ung* ختم می‌شوند همیشه مؤنث‌اند: *die Zeitung*."
      de: "Nomen auf *-ung* sind immer feminin: *die Zeitung*."
  - wrong: Die Brötchen ist warm.
    right: Das Brötchen ist warm.
    why:
      en: "Nouns in *-chen* are always neuter: *das Brötchen*."
      fa: "اسم‌هایی که به *-chen* ختم می‌شوند همیشه خنثی‌اند: *das Brötchen*."
      de: "Nomen auf *-chen* sind immer neutral: *das Brötchen*."
  - wrong: Die Käse ist gut.
    right: Der Käse ist gut.
    why:
      en: "Most nouns in *-e* are feminine, but *Käse* is an exception: *der Käse*."
      fa: "بیشتر اسم‌هایی که به *-e* ختم می‌شوند مؤنث‌اند، ولی *Käse* استثناست: *der Käse*."
      de: "Die meisten Nomen auf *-e* sind feminin. *Käse* ist eine Ausnahme: *der Käse*."
  - wrong: Der Bier ist kalt.
    right: Das Bier ist kalt.
    why:
      en: "Alcoholic drinks are masculine, but *Bier* is the exception: *das Bier*."
      fa: "نوشیدنی‌های الکلی مذکرند، ولی *Bier* استثناست: *das Bier*."
      de: "Alkoholische Getränke sind maskulin. *Bier* ist die Ausnahme: *das Bier*."

