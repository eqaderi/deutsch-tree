    explanation:
      en: "*-chen* is always neuter: *das Brötchen*. *Die Freundin* is feminine (*-in*) and *der Schnee* masculine (weather)."
      fa: "*-chen* همیشه خنثی است: *das Brötchen*. *die Freundin* مؤنث است (*-in*) و *der Schnee* مذکر (هوا)."
      de: "*-chen* ist immer neutral: *das Brötchen*. *Die Freundin* ist feminin (*-in*), *der Schnee* ist maskulin (Wetter)."
