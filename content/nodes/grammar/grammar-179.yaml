# Grammar list row 179.
id: grammar-179
kind: grammar
level: A2
chapter: a2-relative-clauses
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-177]
title:
  en: "Embedded relative clause"
  fa: "جملهٔ موصولی در میان جملهٔ پایه"
  de: "Relativsatz in der Mitte vom Hauptsatz"

explanations:
  en:
    rule: >
      A relative clause stands right after its noun. When the noun begins the
      main clause, the relative clause goes into the middle of it: *Der Mann,
      der dort steht, ist mein Chef.* It then has a comma before it and a
      comma after it. The noun and its relative clause together are position
      1, so after the second comma comes the conjugated verb of the main
      clause, in position 2, and then the rest. Each clause keeps its own
      verb: *steht* goes with *der* and stands at the end of the relative
      clause; *ist* goes with *der Mann*. The pronoun is in the *Nominativ*
      or the *Akkusativ*, as in any relative clause: *Der Tisch, den wir
      gekauft haben, war kaputt.*
  fa:
    rule: >
      جملهٔ موصولی درست پس از اسم خود می‌آید. اگر این اسم در آغاز جملهٔ
      پایه باشد، جملهٔ موصولی در میان جملهٔ پایه قرار می‌گیرد: *Der Mann,
      der dort steht, ist mein Chef.* فارسی هم همین‌طور است: «مردی که آن‌جا
      ایستاده رئیس من است». در آلمانی جملهٔ موصولی در این حالت یک ویرگول پیش
      از خود و یک ویرگول پس از خود دارد. اسم و جملهٔ موصولی‌اش روی هم جایگاه
      اول جملهٔ پایه‌اند؛ بنابراین پس از ویرگول دوم فعل صرف‌شدهٔ جملهٔ پایه در
      جایگاه دوم می‌آید و سپس بقیهٔ جمله. هر جمله فعل خودش را دارد: *steht*
      به *der* برمی‌گردد و در پایان جملهٔ موصولی می‌آید و *ist* به *der
      Mann*. ضمیر موصولی مانند هر جملهٔ موصولی دیگر در حالت *Nominativ* یا
      *Akkusativ* است: *Der Tisch, den wir gekauft haben, war kaputt.*
  de:
    rule: >
      Ein Relativsatz steht direkt nach seinem Nomen. Steht das Nomen am
      Anfang vom Hauptsatz, kommt der Relativsatz in die Mitte: *Der Mann,
      der dort steht, ist mein Chef.* Dann steht vor dem Relativsatz ein
      Komma und nach ihm auch. Das Nomen und der Relativsatz sind zusammen
      Position 1. Nach dem zweiten Komma kommt also das konjugierte Verb vom
      Hauptsatz auf Position 2, dann der Rest. Jeder Satz hat sein eigenes
      Verb: *steht* gehört zu *der* und steht am Ende vom Relativsatz. *Ist*
      gehört zu *der Mann*. Das Relativpronomen steht wie immer im Nominativ
      oder im Akkusativ: *Der Tisch, den wir gekauft haben, war kaputt.*

table:
  columns:
    - { en: "Position 1: noun", fa: "جایگاه اول: اسم", de: "Position 1: Nomen" }
    - { en: Relative clause, fa: جملهٔ موصولی, de: Relativsatz }
    - { en: "Position 2: verb", fa: "جایگاه دوم: فعل", de: "Position 2: Verb" }
    - { en: Rest of the main clause, fa: بقیهٔ جملهٔ پایه, de: Rest vom Hauptsatz }
  rows:
    - ["Der Mann,", "der dort steht,", ist, mein Chef.]
    - ["Die Frau,", "die neben uns wohnt,", arbeitet, im Krankenhaus.]
    - ["Das Auto,", "das vor dem Haus steht,", gehört, meinem Bruder.]
    - ["Die Leute,", "die hier warten,", haben, einen Termin.]
    - ["Der Tisch,", "den wir gekauft haben,", war, kaputt.]
    - ["Das Buch,", "das du mir geschenkt hast,", ist, sehr spannend.]

# Top: a main clause in three slots, the verb (shaded) in position 2. Below:
# the same clause with a relative clause after the noun. The noun and the
# relative clause (shaded inside) are one tall slot, position 1, and the verb
# still comes second.
diagrams:
  - caption:
      en: >
        *Der Mann ist mein Chef.* has *Der Mann* in position 1 and *ist* in
        position 2. In *Der Mann, der dort steht, ist mein Chef.* the relative
        clause comes right after *Der Mann*. Both together are position 1, so
        *ist* still comes second, after the second comma.
      fa: >
        در *Der Mann ist mein Chef.* عبارت *Der Mann* در جایگاه اول و *ist* در
        جایگاه دوم است. در *Der Mann, der dort steht, ist mein Chef.* جملهٔ
        موصولی درست پس از *Der Mann* می‌آید. این دو روی هم جایگاه اول‌اند، پس
        *ist* باز هم دوم است و پس از ویرگول دوم می‌آید.
      de: >
        In *Der Mann ist mein Chef.* ist *Der Mann* Position 1 und *ist*
        Position 2. In *Der Mann, der dort steht, ist mein Chef.* steht der
        Relativsatz direkt nach *Der Mann*. Beides zusammen ist Position 1.
        Darum kommt *ist* nach dem zweiten Komma auf Position 2.
