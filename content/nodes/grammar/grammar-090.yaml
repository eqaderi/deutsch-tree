# Grammar list row 90.
id: grammar-090
kind: grammar
level: A2
chapter: a2-articles-pronouns
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-066, grammar-077]
title:
  en: "*Possessivartikel* in the *Dativ*; *euer*"
  fa: "حرف تعریف ملکی در حالت *Dativ*؛ *euer*"
  de: "Possessivartikel im Dativ; *euer*"

explanations:
  en:
    rule: >
      In the *Dativ* (after *mit*, *bei*, *zu*, *von*, after verbs such as
      *helfen* and for the person you give something to) a possessive article
      has the endings of *ein*: *meinem* for masculine and neuter nouns,
      *meiner* for feminine nouns, and *meinen* for the plural, with *-n* on
      the noun as well: *mit meinem Freund*, *mit meiner Schwester*, *mit
      meinen Kindern*. *Euer* is the possessive for *ihr* (you, more than one
      person you say *du* to). When it takes an ending, the *e* before the
      *r* drops: *euer Sohn*, but *eure Tochter*, *euren Sohn*, *eurem Sohn*.
  fa:
    rule: >
      در حالت *Dativ* (حالت مفعول باواسطه)، یعنی پس از حرف‌های اضافه‌ای مانند
      *mit*، *bei*، *zu* و *von*، پس از فعل‌هایی مانند *helfen* و برای کسی که
      چیزی به او می‌دهیم، حرف تعریف ملکی همان پایانه‌های *ein* را می‌گیرد:
      *meinem* برای اسم مذکر و خنثی، *meiner* برای اسم مؤنث و *meinen* برای
      جمع. در جمع، خود اسم نیز *-n* می‌گیرد: *mit meinem Freund*، *mit meiner
      Schwester*، *mit meinen Kindern*. *euer* حرف تعریف ملکی دوم‌شخص جمع
      است، یعنی برای *ihr*، وقتی چند نفر را که با آن‌ها *du* می‌گوییم مخاطب
      قرار می‌دهیم: *euer Auto* یعنی «ماشینتان». هرگاه *euer* پایانه بگیرد،
      حرف *e* پیش از *r* می‌افتد: *euer Sohn*، ولی *eure Tochter*، *euren Sohn* و
      *eurem Sohn*.
  de:
    rule: >
      Im Dativ (nach *mit*, *bei*, *zu*, *von*, nach Verben wie *helfen* und
      für die Person, die etwas bekommt) hat der Possessivartikel die
      Endungen von *ein*: *meinem* bei maskulinen und neutralen Nomen,
      *meiner* bei femininen Nomen und *meinen* im Plural. Im Plural bekommt
      auch das Nomen *-n*: *mit meinen Kindern*. *Euer* ist der
      Possessivartikel für *ihr*. Mit Endung fällt das *e* vor dem *r* weg:
      *euer Sohn*, aber *eure Tochter*, *euren Sohn*, *eurem Sohn*.

