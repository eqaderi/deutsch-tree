      de: "*Bis zu* mit Dativ: *zu dem Bahnhof*, kurz *zum*. Der Satz ist richtig."
  - id: true-3
    type: true-false
    prompt: Gehen Sie entlang den Fluss.
    answer: false
    explanation:
      en: "With the *Akkusativ*, *entlang* comes after the noun: *den Fluss entlang*."
      fa: "با حالت *Akkusativ*، *entlang* پس از اسم می‌آید: *den Fluss entlang*."
      de: "Mit Akkusativ steht *entlang* nach dem Nomen: *den Fluss entlang*."
  - id: true-4
