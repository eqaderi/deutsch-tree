    prompt: Wir gehen durch den Wald nach Hause.
    answer: true
    explanation:
      en: "*Durch* with the *Akkusativ*: *durch den Wald*. The sentence is correct."
      fa: "*durch* با حالت *Akkusativ*: *durch den Wald*. جمله درست است."
      de: "*Durch* mit Akkusativ: *durch den Wald*. Der Satz ist richtig."
  - id: true-2
