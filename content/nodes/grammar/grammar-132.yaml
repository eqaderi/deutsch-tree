table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - en: "*Akkusativ*: *durch*, *um*, *gegen*, *entlang*"
      fa: "حالت *Akkusativ*: *durch*، *um*، *gegen*، *entlang*"
      de: "Akkusativ: *durch*, *um*, *gegen*, *entlang*"
    - en: "*Dativ*: *an … vorbei*, *bis zu*, *gegenüber*"
      fa: "حالت *Dativ*: *an … vorbei*، *bis zu*، *gegenüber*"
      de: "Dativ: *an … vorbei*, *bis zu*, *gegenüber*"
  rows:
    - [der Park, durch den Park, am Park vorbei]
    - [die Ecke, um die Ecke, bis zur Ecke]
    - [das Rathaus, um das Rathaus herum, gegenüber dem Rathaus]
    - [der Fluss, den Fluss entlang, bis zum Fluss]
    - [die Bäume (Plural), um die Bäume herum, an den Bäumen vorbei]
    - [ein Baum, gegen einen Baum, an einem Baum vorbei]

examples:
  - de: Gehen Sie hier um die Ecke.
    en: Go around the corner here.
    fa: این‌جا از سر نبش بپیچید.
  - de: Gehen Sie die Straße entlang bis zur Ampel.
    en: Go along the street as far as the traffic lights.
    fa: در امتداد خیابان تا چراغ راهنمایی بروید.
  - de: Dann gehen Sie durch den Park.
    en: Then go through the park.
    fa: بعد از میان پارک بگذرید.
  - de: Fahren Sie am Rathaus vorbei.
    en: Drive past the town hall.
    fa: از کنار شهرداری رد شوید.
  - de: Die Apotheke ist gegenüber dem Bahnhof.
    en: The pharmacy is opposite the station.
    fa: داروخانه روبه‌روی ایستگاه قطار است.
  - de: Am Sonntag laufen wir um den See herum.
    en: On Sunday we walk around the lake.
    fa: یکشنبه دور دریاچه راه می‌رویم.
  - de: Der Bus fährt nur bis zum Bahnhof.
    en: The bus only goes as far as the station.
    fa: اتوبوس فقط تا ایستگاه قطار می‌رود.
  - de: Der Ball fliegt gegen das Fenster.
    en: The ball flies against the window.
    fa: توپ به پنجره می‌خورد.
  - de: Mein Bruder sitzt mir gegenüber.
    en: My brother is sitting opposite me.
    fa: برادرم روبه‌رویم نشسته است.
  - de: Der Zug fährt durch den Tunnel.
    en: The train goes through the tunnel.
    fa: قطار از تونل می‌گذرد.

mistakes:
  - wrong: Gehen Sie durch dem Park.
    right: Gehen Sie durch den Park.
    why:
      en: "*Durch* always takes the *Akkusativ*: *der Park* becomes *den Park*."
      fa: "*durch* همیشه با حالت *Akkusativ* می‌آید: *der Park* می‌شود *den Park*."
      de: "Nach *durch* steht immer der Akkusativ: *der Park* wird zu *den Park*."
  - wrong: Fahren Sie bis die Ampel.
    right: Fahren Sie bis zur Ampel.
    why:
      en: "Before a place with an article, *bis* needs *zu*, with the *Dativ*: *bis zur Ampel*."
      fa: "پیش از مکانی که حرف تعریف دارد، *bis* به *zu* و حالت *Dativ* نیاز دارد: *bis zur Ampel*."
      de: "Vor einem Ort mit Artikel braucht *bis* noch *zu*, mit Dativ: *bis zur Ampel*."
  - wrong: Gehen Sie entlang die Straße.
    right: Gehen Sie die Straße entlang.
    why:
      en: "With the *Akkusativ*, *entlang* comes after the noun: *die Straße entlang*."
      fa: "با حالت *Akkusativ*، *entlang* پس از اسم می‌آید: *die Straße entlang*."
      de: "Mit Akkusativ steht *entlang* nach dem Nomen: *die Straße entlang*."
  - wrong: Die Bank ist gegenüber die Post.
    right: Die Bank ist gegenüber der Post.
    why:
      en: "*Gegenüber* takes the *Dativ*: *die Post* becomes *der Post*."
      fa: "*gegenüber* با حالت *Dativ* می‌آید: *die Post* می‌شود *der Post*."
      de: "Nach *gegenüber* steht der Dativ: *die Post* wird zu *der Post*."
  - wrong: Gehen Sie an den Bahnhof vorbei.
    right: Gehen Sie am Bahnhof vorbei.
    why:
      en: "*An … vorbei* takes the *Dativ*: *an dem Bahnhof*, shortened to *am Bahnhof*."
      fa: "*an … vorbei* با حالت *Dativ* می‌آید: *an dem Bahnhof* که کوتاه می‌شود: *am Bahnhof*."
      de: "Bei *an … vorbei* steht der Dativ: *an dem Bahnhof*, kurz *am Bahnhof*."

questions:
