# Grammar list row 132. Entlang is taught after the noun with the Akkusativ;
# entlang before the noun (with Genitiv or Dativ) is later.
id: grammar-132
kind: grammar
level: A2
chapter: a2-prepositions
order: 4
status: published
recogniseOnly: false
prerequisites: [grammar-126]
title:
  en: "Route prepositions"
  fa: "حرف‌های اضافهٔ مسیر (*durch*، *um*، *entlang* …)"
  de: "Präpositionen für den Weg (*durch*, *um*, *entlang* …)"

explanations:
  en:
    rule: >
      These prepositions describe a way, as when you give directions. *Durch*
      (through), *um* (around) and *gegen* (against, into) take the
      *Akkusativ*: *durch den Park*, *um die Ecke*, *gegen einen Baum*. For a
      whole circle *herum* is often added at the end: *um den See herum*.
      *Entlang* (along) usually stands after the noun, with the *Akkusativ*:
      *die Straße entlang*. *An … vorbei* (past) and *bis zu* (up to, as far
      as) take the *Dativ*: *am Rathaus vorbei*, *bis zur Ampel*. *Gegenüber*
      (opposite) says where something is, also with the *Dativ*: *gegenüber
      dem Bahnhof*; after a pronoun it comes last: *mir gegenüber*.
  fa:
    rule: >
      این حرف‌های اضافه مسیر را نشان می‌دهند، مثلاً وقتی نشانی می‌دهیم.
      *durch* (از میان)، *um* (دور) و *gegen* (به، برخورد با) با حالت
      *Akkusativ* (حالت مفعولی) می‌آیند: *durch den Park*، *um die Ecke* و
      *gegen einen Baum*. برای یک دور کامل اغلب *herum* هم در پایان می‌آید:
      *um den See herum*. *entlang* (در امتداد) معمولاً پس از اسم و با حالت
      *Akkusativ* می‌آید: *die Straße entlang*. *an … vorbei* (از کنار چیزی
      گذشتن) و *bis zu* (تا) با حالت *Dativ* (حالت مفعول باواسطه) می‌آیند: *am
      Rathaus vorbei* و *bis zur Ampel*. *gegenüber* (روبه‌روی) جای چیزی را
      نشان می‌دهد و آن هم با حالت *Dativ* می‌آید: *gegenüber dem Bahnhof*؛ با
      ضمیر، *gegenüber* پس از ضمیر می‌آید: *mir gegenüber*.
  de:
    rule: >
      Diese Präpositionen beschreiben einen Weg, zum Beispiel bei einer
      Wegbeschreibung. Nach *durch*, *um* und *gegen* steht der Akkusativ:
      *durch den Park*, *um die Ecke*, *gegen einen Baum*. Für einen ganzen
      Kreis sagt man oft noch *herum* am Ende: *um den See herum*. *Entlang*
      steht meistens nach dem Nomen, mit Akkusativ: *die Straße entlang*. Nach
      *an … vorbei* und *bis zu* steht der Dativ: *am Rathaus vorbei*, *bis zur
      Ampel*. *Gegenüber* sagt, wo etwas ist, auch mit Dativ: *gegenüber dem
      Bahnhof*. Nach einem Pronomen steht es am Ende: *mir gegenüber*.

# Seven small pictures, one per preposition. German only, so no labels.
diagrams:
  - caption:
      en: >
        One picture for each preposition. *Durch*: through the park. *Um …
        herum*: around it. *Entlang*: along the river. *An … vorbei*: past a
        house. *Bis zu*: up to a line, and no further. *Gegen*: into a wall.
        *Gegenüber*: two houses on opposite sides of the street.
      fa: >
        برای هر حرف اضافه یک تصویر. *durch*: از میان پارک. *um … herum*: دور
        آن. *entlang*: در امتداد رودخانه. *an … vorbei*: از کنار یک خانه. *bis
        zu*: تا یک خط و نه دورتر. *gegen*: برخورد با دیوار. *gegenüber*: دو خانه
        در دو سوی خیابان، روبه‌روی هم.
      de: >
        Ein Bild für jede Präposition. *Durch*: durch den Park. *Um … herum*:
        rund um etwas. *Entlang*: am Fluss entlang. *An … vorbei*: an einem
        Haus vorbei. *Bis zu*: bis zu einer Linie und nicht weiter. *Gegen*:
        gegen eine Wand. *Gegenüber*: zwei Häuser auf den zwei Seiten der
        Straße.
