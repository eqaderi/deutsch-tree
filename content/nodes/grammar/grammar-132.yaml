    type: gap-fill
    prompt: Gehen Sie ___ Park, das ist kürzer.
    options: [durch den, durch dem, durch der]
    answer: durch den
    explanation:
      en: "*Durch* takes the *Akkusativ*: *der Park* becomes *den Park*."
      fa: "*durch* با حالت *Akkusativ* می‌آید: *der Park* می‌شود *den Park*."
      de: "Nach *durch* steht der Akkusativ: *der Park* wird zu *den Park*."
  - id: gap-2
    type: gap-fill
    prompt: Fahren Sie bis ___ Ampel und dann rechts.
    options: [zur, zum, die]
    answer: zur
    explanation:
      en: "*Bis zu* takes the *Dativ*: *die Ampel*, *zu der*, shortened to *zur*."
      fa: "*bis zu* با حالت *Dativ* می‌آید: *die Ampel*، *zu der* که کوتاه می‌شود: *zur*."
      de: "*Bis zu* hat den Dativ: *die Ampel*, *zu der*, kurz *zur*."
