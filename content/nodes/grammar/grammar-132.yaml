    type: gap-fill
    prompt: Die Apotheke ist gegenüber ___ Bahnhof.
    options: [dem, den, der]
    answer: dem
    explanation:
      en: "*Gegenüber* takes the *Dativ*: *der Bahnhof* becomes *dem Bahnhof*."
      fa: "*gegenüber* با حالت *Dativ* می‌آید: *der Bahnhof* می‌شود *dem Bahnhof*."
      de: "Nach *gegenüber* steht der Dativ: *der Bahnhof* wird zu *dem Bahnhof*."
  - id: gap-4
    type: gap-fill
    prompt: Gehen Sie die Straße ___ bis zur Kirche.
    options: [entlang, durch, gegenüber]
    answer: entlang
    explanation:
      en: "*Entlang* comes after the noun: *die Straße entlang*, along the street."
      fa: "*entlang* پس از اسم می‌آید: *die Straße entlang*، یعنی در امتداد خیابان."
      de: "*Entlang* steht nach dem Nomen: *die Straße entlang*."
  - id: gap-5
    type: gap-fill
    prompt: Der Bus fährt am Rathaus ___.
    options: [vorbei, herum, durch]
    answer: vorbei
    explanation:
      en: "*Am Rathaus* with *vorbei*: the bus goes past the town hall."
      fa: "*am Rathaus* با *vorbei*: اتوبوس از کنار شهرداری می‌گذرد."
      de: "*Am Rathaus* mit *vorbei*: Der Bus fährt am Rathaus vorbei."
  - id: gap-6
    type: gap-fill
    prompt: Wir laufen einmal um ___ See herum.
    options: [den, dem, der]
    answer: den
    explanation:
      en: "*Um* takes the *Akkusativ*: *der See* becomes *den See*."
      fa: "*um* با حالت *Akkusativ* می‌آید: *der See* می‌شود *den See*."
      de: "Nach *um* steht der Akkusativ: *der See* wird zu *den See*."
  - id: choice-1
    type: multiple-choice
    prompt: Ein Unfall! Das Auto ist ___ einen Baum gefahren.
    options: [gegen, durch, entlang]
    answer: gegen
    explanation:
      en: "Hitting something is *gegen*: *gegen einen Baum*."
      fa: "برای برخورد با چیزی *gegen* می‌آید: *gegen einen Baum*."
      de: "Wenn man etwas trifft, sagt man *gegen*: *gegen einen Baum*."
  - id: choice-2
    type: multiple-choice
    prompt: Wo ist das Café? – ___ dem Kino.
    options: [Gegenüber, Durch, Um]
    answer: Gegenüber
    explanation:
      en: "*Wo?* asks for a place, and *gegenüber* takes the *Dativ*: *gegenüber dem Kino*. *Durch* and *um* take the *Akkusativ*."
      fa: "*Wo?* جای چیزی را می‌پرسد و *gegenüber* با حالت *Dativ* می‌آید: *gegenüber dem Kino*. *durch* و *um* با حالت *Akkusativ* می‌آیند."
      de: "*Wo?* fragt nach einem Ort. *Gegenüber* hat den Dativ: *gegenüber dem Kino*. *Durch* und *um* haben den Akkusativ."
  - id: choice-3
    type: multiple-choice
    prompt: Gehen Sie hier ___ Ecke, dann sehen Sie die Post.
    options: [um die, um der, durch die]
    answer: um die
    explanation:
      en: "Around the corner is *um die Ecke*: *um* takes the *Akkusativ*, and *die* stays *die*."
      fa: "«از سر نبش پیچیدن» می‌شود *um die Ecke*: *um* با حالت *Akkusativ* می‌آید و *die* همان می‌ماند."
      de: "Es heißt *um die Ecke*: Nach *um* steht der Akkusativ, *die* bleibt *die*."
  - id: true-1
