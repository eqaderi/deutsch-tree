    explanation:
      en: "*Darauf* closes the main clause, then the *dass* clause follows with *kommt* at the end."
      fa: "*darauf* جملهٔ پایه را می‌بندد، سپس جملهٔ *dass* با *kommt* در پایان می‌آید."
