    - [denken an, daran, "Denk bitte daran, dass der Laden morgen geschlossen ist."]
    - [sich erinnern an, daran, "Ich erinnere mich gut daran, wie wir uns kennengelernt haben."]
    - [sich ärgern über, darüber, "Er ärgert sich darüber, dass er den Bus verpasst hat."]
