# Grammar list row 175.
id: grammar-175
kind: grammar
level: B1
chapter: b1-reason-condition-clauses
order: 6
status: published
recogniseOnly: false
prerequisites: [grammar-097, grammar-159]
title:
  en: "Verb + preposition + clause"
  fa: "فعل + حرف اضافه + جملهٔ پیرو (*darauf, dass …*)"
  de: "Verb + Präposition + Nebensatz (*darauf, dass …*)"

explanations:
  en:
    rule: >
      Many verbs go with a fixed preposition: *sich freuen auf*, *warten
      auf*, *denken an*. When what follows the preposition is a whole
      clause, the preposition cannot stand right before it. It becomes a
      *da(r)-* word in the main clause, and the clause follows after a
      comma: *Ich freue mich auf euren Besuch.* becomes *Ich freue mich
      darauf, dass ihr kommt.* The *da(r)-* word is built as in *darauf*,
      *daran*, *darüber*, *davon*, and it points ahead to the clause. The
      clause can be a *dass* clause or an indirect question with *ob* or a
      question word: *Es hängt davon ab, ob das Wetter gut ist.* *Wir haben
      darüber gesprochen, wohin wir fahren.* Either way, its conjugated verb
      goes to the end. An infinitive with *zu* works the same way: *Ich
      freue mich darauf, euch zu sehen.* After a few verbs of feeling, such
      as *sich freuen* and *sich ärgern*, the *da(r)-* word may be left out;
      it is safest to keep it, and after some verbs, such as *abhängen von*,
      it must stay. You ask with *wo(r)-*: *Worauf freust du dich? –
      Darauf, dass bald Ferien sind.*
  fa:
    rule: >
      بسیاری از فعل‌ها با حرف اضافهٔ ثابتی می‌آیند: *sich freuen auf*،
      *warten auf*، *denken an*. اگر پس از حرف اضافه جمله‌ای کامل بیاید،
      حرف اضافه نمی‌تواند درست پیش از آن بنشیند. در این صورت در جملهٔ پایه
      به واژه‌ای با *da(r)-* تبدیل می‌شود و جملهٔ پیرو پس از ویرگول می‌آید:
      از *Ich freue mich auf euren Besuch.* می‌رسیم به *Ich freue mich darauf,
      dass ihr kommt.* این واژه مانند *darauf*، *daran*، *darüber* و *davon*
      ساخته می‌شود و به جملهٔ پس از خود اشاره می‌کند. جملهٔ پیرو می‌تواند
      جمله‌ای با *dass* باشد یا پرسش غیرمستقیم با *ob* یا واژهٔ پرسشی: *Es
      hängt davon ab, ob das Wetter gut ist.* *Wir haben darüber gesprochen,
      wohin wir fahren.* در هر دو حالت فعل صرف‌شده به پایان جمله می‌رود.
      مصدر با *zu* هم همین‌طور می‌آید: *Ich freue mich darauf, euch zu sehen.*
      پس از چند فعل احساسی، مانند *sich freuen* و *sich ärgern*، می‌توان
      واژهٔ *da(r)-* را حذف کرد؛ ولی بهتر است آن را نگه دارید، و پس از برخی
      فعل‌ها، مانند *abhängen von*، حتماً باید بماند. پرسش با *wo(r)-* ساخته
      می‌شود: *Worauf freust du dich? – Darauf, dass bald Ferien sind.*
  de:
    rule: >
      Viele Verben haben eine feste Präposition: *sich freuen auf*, *warten
      auf*, *denken an*. Kommt nach der Präposition ein ganzer Satz, kann
      die Präposition nicht direkt davor stehen. Dann steht im Hauptsatz ein
      Wort mit *da(r)-*, und nach einem Komma kommt der Nebensatz: aus *Ich
      freue mich auf euren Besuch.* wird *Ich freue mich darauf, dass ihr
      kommt.* Das Wort baut man wie *darauf*, *daran*, *darüber*, *davon*.
      Es zeigt auf den Satz danach. Der Nebensatz kann ein *dass*-Satz sein
      oder eine indirekte Frage mit *ob* oder einem Fragewort: *Es hängt
      davon ab, ob das Wetter gut ist.* *Wir haben darüber gesprochen, wohin
      wir fahren.* Das konjugierte Verb steht immer am Ende. Mit *zu* + Infinitiv
      geht es genauso: *Ich freue mich darauf, euch zu sehen.* Bei ein paar
      Verben für Gefühle, zum Beispiel *sich freuen* und *sich ärgern*, kann
      das Wort mit *da(r)-* fehlen. Sicherer ist es mit. Bei manchen Verben,
      zum Beispiel *abhängen von*, muss es stehen. Man fragt mit *wo(r)-*:
      *Worauf freust du dich? – Darauf, dass bald Ferien sind.*

