      fa: >
        هرچه بیشتر تمرین کنید (چپ)، آلمانی‌تان بهتر می‌شود (راست): این دو با
        هم بالا می‌روند. *Je mehr du übst, desto besser wird dein Deutsch.*
      de: >
        *Je mehr du übst, desto besser wird dein Deutsch.* Mehr Übung (links),
        besseres Deutsch (rechts): Beides wächst zusammen.
