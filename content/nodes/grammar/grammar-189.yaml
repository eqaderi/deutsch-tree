# Grammar list row 189.
id: grammar-189
kind: grammar
level: B1
chapter: b1-two-part-connectors
order: 6
status: published
recogniseOnly: false
prerequisites: [grammar-110, grammar-157]
title:
  en: "*je … desto* / *umso*"
  fa: "*je … desto* / *umso*"
  de: "*je … desto* / *umso*"

explanations:
  en:
    rule: >
      *Je … desto* (the … the …) links two changes: as one grows, so does the
      other. *Je* starts a subordinate clause. Right after *je* comes a
      *Komparativ*, and the conjugated verb goes to the end: *Je mehr du
      übst, …* The main clause starts with *desto* or *umso*, which mean the
      same, and a second *Komparativ*. Together they are position 1, so the
      verb comes next and then the subject: *…, desto besser wird dein
      Deutsch.* A noun stays right after its *Komparativ*: *Je mehr Zeit ich
      habe, desto mehr Bücher lese ich.* Short and fixed: *Je früher, desto
      besser.* When the main clause comes first, *umso* or *desto* stands
      inside it: *Die Wohnungen sind umso teurer, je näher sie am Zentrum
      liegen.*
  fa:
    rule: >
      *je … desto* (هرچه … ، … تر) دو تغییر را به هم پیوند می‌دهد: هرچه یکی
      بیشتر شود، دیگری هم بیشتر می‌شود. *je* جملهٔ پیرو را آغاز می‌کند. درست
      پس از *je* صفت تفضیلی (*Komparativ*) می‌آید و فعل صرف‌شده به پایان جمله
      می‌رود: *Je mehr du übst, …* جملهٔ پایه با *desto* یا *umso*، که یک
      معنا دارند، و صفت تفضیلی دوم آغاز می‌شود. این دو با هم جایگاه اول‌اند،
      پس فعل پس از آن‌ها می‌آید و سپس فاعل: *…, desto besser wird dein
      Deutsch.* اسم درست پس از صفت تفضیلی‌اش می‌ماند: *Je mehr Zeit ich habe,
      desto mehr Bücher lese ich.* کوتاه و ثابت: *Je früher, desto besser.*
      اگر جملهٔ پایه اول بیاید، *umso* یا *desto* درون آن قرار می‌گیرد: *Die
      Wohnungen sind umso teurer, je näher sie am Zentrum liegen.*
  de:
    rule: >
      Mit *je … desto* verbindet man zwei Veränderungen: Wird das eine mehr,
      wird auch das andere mehr. *Je* beginnt einen Nebensatz. Direkt nach
      *je* kommt ein Komparativ, und das konjugierte Verb steht am Ende: *Je
      mehr du übst, …* Der Hauptsatz beginnt mit *desto* oder *umso* (beide
      bedeuten das Gleiche) und einem zweiten Komparativ. Zusammen sind sie
      Position 1. Dann kommt das Verb und danach das Subjekt: *…, desto besser
      wird dein Deutsch.* Ein Nomen steht direkt nach seinem Komparativ: *Je
      mehr Zeit ich habe, desto mehr Bücher lese ich.* Kurz sagt man: *Je
      früher, desto besser.* Kommt der Hauptsatz zuerst, steht *umso* oder
      *desto* im Satz: *Die Wohnungen sind umso teurer, je näher sie am
      Zentrum liegen.*

table:
  columns:
    - { en: "*Je* clause: verb at the end", fa: "جملهٔ پیرو با *je*: فعل در پایان", de: "*Je*-Satz: Verb am Ende" }
    - { en: "*Desto* / *umso* + comparative", fa: "*desto* / *umso* + صفت تفضیلی", de: "*Desto* / *umso* + Komparativ" }
    - { en: Verb, fa: فعل, de: Verb }
    - { en: The rest, fa: بقیهٔ جمله, de: Rest }
  rows:
    - ["Je mehr du übst,", desto besser, wird, dein Deutsch.]
    - ["Je älter mein Opa wird,", umso ruhiger, wird, er.]
    - ["Je früher wir losfahren,", desto weniger Verkehr, gibt, es.]
    - ["Je mehr Geld er verdient,", umso mehr, gibt, er aus.]

# Two sets of three bars that grow together: the left set is the je clause,
# the right set the desto clause, with an arrow from one to the other.
