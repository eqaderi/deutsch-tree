      fa: "*Fahrrad* اسم خنثی است: *ihrs* (یا *ihres*)."
      de: "*Fahrrad* ist neutral: *ihrs* (oder *ihres*)."
  - id: match-1
    type: matching
    answer:
      - [Der Hut? Das ist ___., meiner]
      - [Die Uhr? Das ist ___., meine]
      - [Das Kleid? Das ist ___., meins]
    explanation:
      en: "The pronoun takes the gender of the noun: masculine *meiner*, feminine *meine*, neuter *meins*."
      fa: "ضمیر جنس اسم را می‌گیرد: مذکر *meiner*، مؤنث *meine* و خنثی *meins*."
      de: "Das Pronomen hat das Genus vom Nomen: maskulin *meiner*, feminin *meine*, neutral *meins*."

