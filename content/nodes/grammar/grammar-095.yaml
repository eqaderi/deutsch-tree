examples:
  - de: Wem gehört die Tasche? – Das ist meine.
    en: Whose bag is this? – It's mine.
    fa: این کیف مال کیست؟ – مال من است.
  - de: Ist das dein Schlüssel? – Ja, das ist meiner.
    en: Is that your key? – Yes, it's mine.
    fa: این کلید توست؟ – بله، مال من است.
  - de: Das Handy ist nicht meins. Ist es deins?
    en: The phone isn't mine. Is it yours?
    fa: این گوشی مال من نیست. مال توست؟
  - de: Mein Laptop ist kaputt. Kann ich deinen benutzen?
    en: My laptop is broken. Can I use yours?
    fa: لپ‌تاپم خراب است. می‌توانم از مال تو استفاده کنم؟
  - de: Ist das Peters Jacke? – Ja, das ist seine.
    en: Is that Peter's jacket? – Yes, it's his.
    fa: این کاپشن پیتر است؟ – بله، مال اوست.
  - de: Sind das eure Fahrräder? – Ja, das sind unsere.
    en: Are those your bikes? – Yes, they're ours.
    fa: این دوچرخه‌ها مال شماست؟ – بله، مال ماست.
  - de: Unser Auto ist alt, Ihres ist neu.
    en: Our car is old. Yours is new.
    fa: ماشین ما قدیمی است. ماشین شما نو است.
  - de: Ich habe meinen Schirm vergessen. Hast du deinen dabei?
    en: I've forgotten my umbrella. Have you got yours with you?
    fa: چترم را جا گذاشته‌ام. چترت همراهت است؟

mistakes:
  - wrong: Ist das dein Schlüssel? – Ja, das ist mein.
    right: Ist das dein Schlüssel? – Ja, das ist meiner.
    why:
      en: "Without a noun the word needs its ending: *Schlüssel* is masculine, so *meiner*."
      fa: "بی‌اسم، واژه پایانه لازم دارد: *Schlüssel* اسم مذکر است، پس *meiner*."
      de: "Ohne Nomen braucht das Wort eine Endung. *Schlüssel* ist maskulin: *meiner*."
  - wrong: Ist das Annas Tasche? – Ja, das ist seine.
    right: Ist das Annas Tasche? – Ja, das ist ihre.
    why:
      en: "The owner is Anna, a woman, so *ihr-*; *Tasche* is feminine: *ihre*."
      fa: "دارنده آنا است که زن است، پس *ihr-* می‌آید؛ *Tasche* اسم مؤنث است: *ihre*."
      de: "Anna ist eine Frau. Darum *ihr-*. *Tasche* ist feminin: *ihre*."
  - wrong: Mein Stift ist leer. Kann ich deiner haben?
    right: Mein Stift ist leer. Kann ich deinen haben?
    why:
      en: "The pen is the object of *haben*, so the masculine *Akkusativ*: *deinen*."
      fa: "خودکار مفعول *haben* است، پس شکل مذکر در حالت *Akkusativ* می‌آید: *deinen*."
      de: "Der Stift ist das Objekt von *haben*. Darum Akkusativ maskulin: *deinen*."
  - wrong: Das Buch? Das ist meiner.
    right: Das Buch? Das ist meins.
    why:
      en: "The pronoun takes the gender of *Buch*, which is neuter: *meins*."
      fa: "ضمیر جنس *Buch* را می‌گیرد که خنثی است: *meins*."
      de: "Das Pronomen hat das Genus von *Buch*. *Buch* ist neutral: *meins*."

