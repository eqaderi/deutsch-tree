    explanation:
      en: "Without a noun the pronoun needs its ending: *meiner*."
      fa: "بی‌اسم، ضمیر پایانه لازم دارد: *meiner*."
      de: "Ohne Nomen braucht das Pronomen eine Endung: *meiner*."
  - id: error-2
