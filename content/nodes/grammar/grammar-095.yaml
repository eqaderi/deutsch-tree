# Grammar list row 95.
id: grammar-095
kind: grammar
level: A2
chapter: a2-articles-pronouns
order: 6
status: published
recogniseOnly: false
prerequisites: [grammar-077, grammar-094]
title:
  en: "*Possessivpronomen*"
  fa: "ضمیر ملکی (*meiner*، *deins*)"
  de: "Possessivpronomen (*meiner*, *deins*)"

explanations:
  en:
    rule: >
      A possessive pronoun stands alone, without its noun: *Wem gehört die
      Tasche? – Das ist meine.* It is the possessive article with the endings
      of *einer*, *eine*, *eins*: *meiner* (masculine), *meine* (feminine),
      *meins* (neuter, also *meines*), *meine* (plural); in the *Akkusativ*
      only the masculine changes: *meinen*. The gender comes from the noun it
      stands for, the word from the owner, as with the article: *Ist das dein
      Schlüssel? – Ja, das ist meiner.* *Das Handy ist nicht meins, es ist
      seins.* The same goes for *deiner*, *seiner*, *ihrer*, *unserer*,
      *eurer* and *Ihrer*.
  fa:
    rule: >
      ضمیر ملکی بی‌اسم می‌آید و جای اسم را می‌گیرد: *Wem gehört die Tasche? –
      Das ist meine.* (این کیف مال کیست؟ – مال من است.) این ضمیر همان حرف
      تعریف ملکی است با پایانه‌های *einer*، *eine* و *eins*: *meiner* برای
      مذکر، *meine* برای مؤنث، *meins* (یا *meines*) برای خنثی و *meine* برای
      جمع. در حالت *Akkusativ* (حالت مفعولی) فقط مذکر تغییر می‌کند: *meinen*.
      جنس ضمیر را اسمی تعیین می‌کند که به جای آن آمده است و خود واژه را
      دارنده، درست مانند حرف تعریف ملکی: *Ist das dein Schlüssel? – Ja, das
      ist meiner.* و *Das Handy ist nicht meins, es ist seins.* در فارسی
      می‌گوییم «مال من» و این عبارت هیچ‌گاه تغییر نمی‌کند، ولی در آلمانی پایانه
      با جنس اسم عوض می‌شود. *deiner*، *seiner*، *ihrer*، *unserer*، *eurer*
      و *Ihrer* نیز همین قاعده را دارند.
  de:
    rule: >
      Das Possessivpronomen steht allein, ohne Nomen: *Wem gehört die Tasche?
      – Das ist meine.* Es ist der Possessivartikel mit den Endungen von
      *einer*, *eine*, *eins*: *meiner* (maskulin), *meine* (feminin),
      *meins* (neutral, auch *meines*), *meine* (Plural). Im Akkusativ ändert
      sich nur das Maskulinum: *meinen*. Das Genus kommt vom Nomen, das Wort
      vom Besitzer: *Ist das dein Schlüssel? – Ja, das ist meiner.* *Das
      Handy ist nicht meins, es ist seins.* Genauso bei *deiner*, *seiner*,
      *ihrer*, *unserer*, *eurer* und *Ihrer*.

