      fa: "*Koffer* اسم مذکر است: *meiner*."
      de: "*Koffer* ist maskulin: *meiner*."
  - id: gap-2
    type: gap-fill
    prompt: Ist das deine Jacke? – Ja, das ist ___.
    options: [meine, meiner, meins]
    answer: meine
    explanation:
      en: "*Jacke* is feminine: *meine*."
      fa: "*Jacke* اسم مؤنث است: *meine*."
      de: "*Jacke* ist feminin: *meine*."
  - id: gap-3
    type: gap-fill
    prompt: Das Fahrrad gehört nicht mir. Es ist ___, Lisa.
    options: [deins, deiner, deinen]
    answer: deins
    explanation:
      en: "*Fahrrad* is neuter, and you say *du* to Lisa: *deins*."
      fa: "*Fahrrad* اسم خنثی است و با لیزا با *du* سخن می‌گوییم: *deins*."
      de: "*Fahrrad* ist neutral, und zu Lisa sagt man *du*: *deins*."
  - id: gap-4
    type: gap-fill
    prompt: Mein Handy ist leer. Kann ich ___ benutzen, Tom?
    options: [deins, deiner, deine]
    answer: deins
    explanation:
      en: "*Handy* is neuter; neuter is the same in the *Akkusativ*: *deins*."
      fa: "*Handy* اسم خنثی است و خنثی در حالت *Akkusativ* تغییر نمی‌کند: *deins*."
      de: "*Handy* ist neutral. Im Akkusativ bleibt es gleich: *deins*."
  - id: gap-5
    type: gap-fill
    prompt: Ist das Pauls Mantel? – Ja, das ist ___.
    options: [seiner, ihrer, seine]
    answer: seiner
    explanation:
      en: "The owner is Paul (*er*), so *sein-*; *Mantel* is masculine: *seiner*."
      fa: "دارنده پاول (*er*) است، پس *sein-* می‌آید؛ *Mantel* اسم مذکر است: *seiner*."
      de: "Paul ist *er*. Darum *sein-*. *Mantel* ist maskulin: *seiner*."
  - id: choice-1
    type: multiple-choice
    prompt: Sind das eure Koffer? – Ja, das sind ___.
    options: [unsere, unserer, unseres]
    answer: unsere
    explanation:
      en: "*Koffer* is a plural here (*sind*): *unsere*."
      fa: "*Koffer* این‌جا جمع است (*sind*): *unsere*."
      de: "*Koffer* ist hier Plural (*sind*): *unsere*."
  - id: choice-2
    type: multiple-choice
    prompt: Ich habe meinen Schirm vergessen. Hast du ___ dabei?
    options: [deinen, deiner, deins]
    answer: deinen
    explanation:
      en: "*Schirm* is masculine and the object of *haben*: *deinen*."
      fa: "*Schirm* اسم مذکر و مفعول *haben* است: *deinen*."
      de: "*Schirm* ist maskulin und das Objekt von *haben*: *deinen*."
  - id: choice-3
    type: multiple-choice
    prompt: Was bedeutet „Das ist nicht meins.“?
    options: [Das gehört mir nicht., Das gefällt mir nicht., Das kenne ich nicht.]
    answer: Das gehört mir nicht.
    explanation:
      en: "*Meins* says whose it is: it does not belong to me."
      fa: "*meins* دارنده را نشان می‌دهد: مال من نیست."
      de: "*Meins* sagt, wem etwas gehört: Es gehört mir nicht."
  - id: true-1
    type: true-false
    prompt: Wem gehört die Brille? – Das ist meine.
    answer: true
    explanation:
      en: "*Brille* is feminine: *meine*. The sentence is correct."
      fa: "*Brille* اسم مؤنث است: *meine*. جمله درست است."
      de: "*Brille* ist feminin: *meine*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Ist das Annas Buch? – Ja, das ist seins.
    answer: false
    explanation:
      en: "The owner is Anna, so *ihr-*: *Ja, das ist ihrs.*"
      fa: "دارنده آنا است، پس *ihr-* می‌آید: *Ja, das ist ihrs.*"
      de: "Anna ist eine Frau. Darum *ihr-*: *Ja, das ist ihrs.*"
  - id: true-3
    type: true-false
    prompt: Unser Garten ist klein, aber eurer ist groß.
    answer: true
    explanation:
      en: "*Garten* is masculine and *euer* loses its *e*: *eurer*. The sentence is correct."
      fa: "*Garten* اسم مذکر است و در *euer* حرف *e* می‌افتد: *eurer*. جمله درست است."
      de: "*Garten* ist maskulin, und bei *euer* fällt das *e* weg: *eurer*. Der Satz ist richtig."
