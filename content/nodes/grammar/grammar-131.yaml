# Grammar list row 131.
id: grammar-131
kind: grammar
level: A2
chapter: a2-prepositions
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-120]
title:
  en: "Temporal: *über*, *von … an*, *zwischen*, *zu*"
  fa: "حرف‌های اضافهٔ زمان: *über*، *von … an*، *zwischen*، *zu*"
  de: "Zeit: *über*, *von … an*, *zwischen*, *zu*"

explanations:
  en:
    rule: >
      *Über* with a length of time means more than: *über eine Stunde*, *über
      zwei Jahre*; the length keeps the form it has without *über*. With the
      weekend or a holiday, *über* means during all of it and takes the
      *Akkusativ*: *übers Wochenende* (*über das*), *über Ostern*. *Von … an*
      gives the start of something that goes on, with the *Dativ*: *vom
      Herbst an*, *von Montag an*; it means the same as *ab*. *Zwischen*
      gives a time between two points, with the *Dativ*: *zwischen 8 und 9
      Uhr*, *zwischen Weihnachten und Neujahr*; the second point comes after
      *und*, never after *bis*. *Zu* names an occasion or a meal, with the
      *Dativ*: *zum Frühstück*, *zum Geburtstag*, and without an article *zu
      Weihnachten*, *zu Ostern*.
  fa:
    rule: >
      *über* با یک مدت زمان یعنی «بیش از»: *über eine Stunde* و *über zwei
      Jahre*؛ مدت همان شکلی را دارد که بدون *über* دارد. *über* با آخر هفته
      یا یک تعطیلی یعنی «در تمام آن مدت» و با حالت *Akkusativ* (حالت مفعولی)
      می‌آید: *übers Wochenende* (*über das*) و *über Ostern*. *von … an* آغاز
      کاری را نشان می‌دهد که ادامه دارد و با حالت *Dativ* (حالت مفعول
      باواسطه) می‌آید: *vom Herbst an* و *von Montag an*؛ معنای آن با *ab*
      یکی است. *zwischen* زمانی میان دو نقطه را نشان می‌دهد و با حالت *Dativ*
      می‌آید: *zwischen 8 und 9 Uhr* و *zwischen Weihnachten und Neujahr*؛
      نقطهٔ دوم پس از *und* می‌آید، هرگز پس از *bis*. *zu* یک مناسبت یا یک
      وعدهٔ غذا را نام می‌برد و با حالت *Dativ* می‌آید: *zum Frühstück* و *zum
      Geburtstag*، و بدون حرف تعریف: *zu Weihnachten* و *zu Ostern*.
  de:
    rule: >
      *Über* mit einer Zeitdauer heißt: mehr als. *Über eine Stunde*, *über
      zwei Jahre*. Die Zeitdauer bleibt so wie ohne *über*. Mit dem Wochenende
      oder einem Fest heißt *über*: die ganze Zeit. Dann steht der Akkusativ:
      *übers Wochenende* (*über das*), *über Ostern*. *Von … an* sagt, wann
      etwas beginnt, das dann weitergeht. Danach steht der Dativ: *vom Herbst
      an*, *von Montag an*. Das heißt dasselbe wie *ab*. *Zwischen* sagt: eine
      Zeit zwischen zwei Punkten, mit Dativ: *zwischen 8 und 9 Uhr*, *zwischen
      Weihnachten und Neujahr*. Vor dem zweiten Punkt steht *und*, nicht
      *bis*. *Zu* nennt einen Anlass oder ein Essen, mit Dativ: *zum
      Frühstück*, *zum Geburtstag*, und ohne Artikel *zu Weihnachten*, *zu
      Ostern*.

# Three time lines, time running to the right.
diagrams:
  - caption:
      en: >
        Time runs to the right. *Von Montag an*: it starts on Monday and goes
        on. *Zwischen 8 und 9 Uhr*: somewhere between the two points. *Über
        eine Stunde*: longer than the dashed bar of one hour.
      fa: >
        زمان به سمت راست پیش می‌رود. *von Montag an*: از دوشنبه شروع می‌شود و
        ادامه دارد. *zwischen 8 und 9 Uhr*: زمانی میان دو نقطه. *über eine
        Stunde*: بلندتر از نوار خط‌چینِ یک ساعت.
      de: >
        Die Zeit läuft nach rechts. *Von Montag an*: Es beginnt am Montag und
        geht weiter. *Zwischen 8 und 9 Uhr*: irgendwann zwischen den zwei
        Punkten. *Über eine Stunde*: länger als der Balken mit Strichen, eine
        Stunde.
