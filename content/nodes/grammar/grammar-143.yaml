# Grammar list row 143.
id: grammar-143
kind: grammar
level: A1
chapter: a1-first-sentences
order: 7
status: published
recogniseOnly: false
prerequisites: [grammar-142]
title:
  en: "*ja* – *nein* – *doch*"
  fa: "*ja* – *nein* – *doch*"
  de: "*ja* – *nein* – *doch*"

explanations:
  en:
    rule: >
      A yes/no question is answered with *ja* (yes) or *nein* (no). A
      negative question has *nicht* (not) or *kein* (no, not a) in it: *Kommst
      du nicht?* When the answer to it is positive, say *doch*: *Doch, ich
      komme.* When you agree with the negative, say *nein*: *Nein, ich komme
      nicht.* So after a negative question *ja* is wrong; *doch* says "yes,
      it is so after all".
  fa:
    rule: >
      پاسخ پرسش بله یا نه *ja* (بله) یا *nein* (نه) است. پرسش منفی *nicht*
      (نه، نمی‌…) یا *kein* (هیچ) دارد: *Kommst du nicht?* («نمی‌آیی؟»). اگر
      پاسخ این پرسش مثبت باشد، *doch* می‌گوییم: *Doch, ich komme.* *doch* درست
      مانند «چرا» در فارسی است: «نمی‌آیی؟ – چرا، می‌آیم.» اگر منفی بودن را
      تأیید کنیم، *nein* می‌گوییم: *Nein, ich komme nicht.* بنابراین پس از پرسش منفی
      *ja* نادرست است.
  de:
    rule: >
      Auf eine Ja/Nein-Frage antwortet man mit *ja* oder *nein*. Eine negative
      Frage hat *nicht* oder *kein*: *Kommst du nicht?* Ist die Antwort
      positiv, sagt man *doch*: *Doch, ich komme.* Ist die Antwort negativ,
      sagt man *nein*: *Nein, ich komme nicht.* Nach einer negativen Frage ist
      *ja* falsch.

table:
  columns:
    - { en: Question, fa: پرسش, de: Frage }
    - { en: Positive answer, fa: پاسخ مثبت, de: Positive Antwort }
    - { en: Negative answer, fa: پاسخ منفی, de: Negative Antwort }
  rows:
    - [Kommst du?, "Ja, ich komme.", "Nein, ich komme nicht."]
    - [Kommst du nicht?, "Doch, ich komme.", "Nein, ich komme nicht."]
    - [Hast du Zeit?, "Ja, ich habe Zeit.", "Nein, ich habe keine Zeit."]
    - [Hast du keine Zeit?, "Doch, ich habe Zeit.", "Nein, ich habe keine Zeit."]

examples:
  - de: Bist du müde? – Ja, sehr.
    en: Are you tired? – Yes, very.
    fa: خسته‌ای؟ – بله، خیلی.
  - de: Bist du nicht müde? – Doch, ein bisschen.
    en: Aren't you tired? – Yes, a little.
    fa: خسته نیستی؟ – چرا، کمی.
  - de: Kommt Anna nicht? – Doch, sie kommt später.
    en: Isn't Anna coming? – Yes, she is coming later.
    fa: آنا نمی‌آید؟ – چرا، دیرتر می‌آید.
  - de: Hast du keine Zeit? – Nein, heute nicht.
    en: Don't you have time? – No, not today.
    fa: وقت نداری؟ – نه، امروز نه.
  - de: Hast du kein Handy? – Doch, hier ist es.
    en: Don't you have a phone? – Yes, here it is.
    fa: گوشی نداری؟ – چرا، این‌جاست.
  - de: Sprechen Sie Deutsch? – Ja, ein bisschen.
    en: Do you speak German? – Yes, a little.
    fa: آلمانی صحبت می‌کنید؟ – بله، کمی.

mistakes:
  - wrong: Kommst du nicht? – Ja, ich komme.
    right: Kommst du nicht? – Doch, ich komme.
    why:
      en: "After a negative question a positive answer starts with *doch*, not *ja*."
      fa: "پس از پرسش منفی، پاسخ مثبت با *doch* آغاز می‌شود، نه با *ja*؛ مانند «چرا» در فارسی."
      de: "Nach einer negativen Frage beginnt eine positive Antwort mit *doch*, nicht mit *ja*."
  - wrong: Hast du keine Zeit? – Doch, ich habe keine Zeit.
    right: Hast du keine Zeit? – Nein, ich habe keine Zeit.
    why:
      en: "*Doch* says the opposite of the negative. To agree that you have no time, say *nein*."
      fa: "*doch* خلاف منفی بودن پرسش را می‌گوید. برای تأیید این‌که وقت ندارید، *nein* بگویید."
      de: "*Doch* sagt das Gegenteil. Hat man keine Zeit, sagt man *nein*."
  - wrong: Bist du müde? – Doch, sehr.
    right: Bist du müde? – Ja, sehr.
    why:
      en: "*Doch* answers only a negative question. A question without *nicht* or *kein* gets *ja*."
      fa: "*doch* فقط پاسخ پرسش منفی است. پرسش بی *nicht* یا *kein* پاسخ *ja* می‌گیرد."
      de: "*Doch* sagt man nur nach einer negativen Frage. Ohne *nicht* oder *kein* sagt man *ja*."

