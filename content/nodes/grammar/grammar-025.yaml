      de: "Mit *werden* bleibt das Verb im Infinitiv: *besuchen*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Ihr ___ (werden) bestimmt viel Spaß haben.
    answers: [werdet]
    explanation:
      en: "With *ihr* the form of *werden* is *werdet*."
      fa: "با *ihr* صورت *werden* *werdet* است."
      de: "Bei *ihr* heißt es *werdet*."
  - id: typed-gap-5
    type: typed-gap-fill
    prompt: Ich glaube, dass es morgen regnen ___ (werden).
    answers: [wird]
    explanation:
      en: "With *es* the form is *wird*, at the very end of the clause with *dass*."
      fa: "با *es* صورت فعل *wird* است، در پایان جملهٔ پیرو با *dass*."
      de: "Bei *es* heißt es *wird*, ganz am Ende vom Nebensatz mit *dass*."
  - id: typed-gap-6
    type: typed-gap-fill
    prompt: Die Kinder ___ (werden) jetzt wahrscheinlich schon schlafen.
    answers: [werden]
    explanation:
      en: "*Die Kinder* is *sie* (plural): *werden*. With *wahrscheinlich* it is a guess about now."
      fa: "*die Kinder* سوم‌شخص جمع است: *werden*. همراه با *wahrscheinlich* حدسی دربارهٔ اکنون است."
      de: "*Die Kinder* ist *sie* (Plural): *werden*. Mit *wahrscheinlich* ist es eine Vermutung über jetzt."
  - id: typed-1
    type: typed-answer
    prompt: "Futur I: es regnet"
    answers: [es wird regnen]
    explanation:
      en: "*Wird* in position 2 and the infinitive at the end: *es wird regnen*."
      fa: "*wird* در جایگاه دوم و مصدر در پایان: *es wird regnen*."
      de: "*Wird* auf Position 2, der Infinitiv am Ende: *es wird regnen*."
  - id: typed-2
    type: typed-answer
    prompt: "Futur I: ich rufe dich an"
    answers: [ich werde dich anrufen]
    explanation:
      en: "The separable verb stays whole in the infinitive at the end: *ich werde dich anrufen*."
      fa: "فعل جداشدنی به صورت مصدر، یکپارچه، در پایان می‌آید: *ich werde dich anrufen*."
      de: "Das trennbare Verb steht ganz als Infinitiv am Ende: *ich werde dich anrufen*."
  - id: typed-3
    type: typed-answer
    prompt: "Futur I: sie kommt"
    answers: [sie wird kommen]
    explanation:
      en: "*Sie kommt* is one person, so *wird*: *sie wird kommen*."
      fa: "*sie kommt* سوم‌شخص مفرد است، پس *wird*: *sie wird kommen*."
      de: "*Sie kommt* ist eine Person. Darum *wird*: *sie wird kommen*."
