# Grammar list row 25. The Präsens for the future is row 12 and werden as a
# full verb row 21; Futur I for assumptions is taught here and only recognised
# again in row 33.
id: grammar-025
kind: grammar
level: B1
chapter: b1-tenses
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-012, grammar-021]
title:
  en: "*Futur I*"
  fa: "زمان آینده (*Futur I*)"
  de: "Futur I"

explanations:
  en:
    rule: >
      The *Futur I* is a form of *werden* in position 2 and the infinitive at
      the end: *Ich werde dich anrufen.* It is used for a prediction (*Morgen
      wird es regnen.*), for a promise or a firm plan (*Ich werde dich
      bestimmt besuchen.*) and, with *wohl*, *wahrscheinlich* or *sicher*,
      for a guess about now (*Er wird wohl noch im Büro sein.*). The forms of
      *werden* are *ich werde*, *du wirst*, *er* / *sie* / *es wird*, *wir
      werden*, *ihr werdet*, *sie* / *Sie werden*. In a subordinate clause
      *werden* goes to the very end, after the infinitive: *…, dass er
      pünktlich kommen wird.* For plans, speech mostly uses the *Präsens*
      with a time word (*Morgen fahre ich nach Hamburg.*); the *Futur I* is
      more formal and the choice for promises, predictions and guesses. Only
      *werden* with an infinitive is the *Futur I*: with an adjective or a
      noun it means "become" (*Er wird Arzt.*).
  fa:
    rule: >
      زمان آینده (*Futur I*) از صورت صرف‌شدهٔ *werden* در جایگاه دوم و مصدر
      در پایان جمله ساخته می‌شود: *Ich werde dich anrufen.* این زمان برای
      پیش‌بینی (*Morgen wird es regnen.*)، برای قول یا تصمیم قطعی (*Ich werde
      dich bestimmt besuchen.*) و همراه با *wohl*، *wahrscheinlich* یا
      *sicher* برای حدس دربارهٔ اکنون به کار می‌رود (*Er wird wohl noch im
      Büro sein.*). صورت‌های *werden* این‌هاست: *ich werde*، *du wirst*،
      *er/sie/es wird*، *wir werden*، *ihr werdet*، *sie/Sie werden*. در
      جملهٔ پیرو، *werden* پس از مصدر به پایان جمله می‌رود: *…, dass er
      pünktlich kommen wird.* در گفتار، برای برنامه‌ها بیشتر زمان حال
      (*Präsens*) همراه با قید زمان به کار می‌رود (*Morgen fahre ich nach
      Hamburg.*)؛ زمان آینده رسمی‌تر است و برای قول، پیش‌بینی و حدس انتخاب
      می‌شود. فقط *werden* همراه با مصدر زمان آینده است؛ *werden* همراه با
      صفت یا اسم یعنی «شدن» (*Er wird Arzt.*).
  de:
    rule: >
      Das Futur I bildet man mit einer Form von *werden* auf Position 2 und
      dem Infinitiv am Ende: *Ich werde dich anrufen.* Man benutzt es für
      eine Vorhersage (*Morgen wird es regnen.*), für ein Versprechen oder
      einen festen Plan (*Ich werde dich bestimmt besuchen.*) und mit *wohl*,
      *wahrscheinlich* oder *sicher* für eine Vermutung über jetzt (*Er wird
      wohl noch im Büro sein.*). Die Formen von *werden* sind *ich werde*,
      *du wirst*, *er/sie/es wird*, *wir werden*, *ihr werdet*, *sie/Sie
      werden*. Im Nebensatz steht *werden* ganz am Ende, nach dem Infinitiv:
      *…, dass er pünktlich kommen wird.* Für Pläne benutzt man beim Sprechen
      meistens das Präsens mit einer Zeitangabe (*Morgen fahre ich nach
      Hamburg.*). Das Futur I ist formeller. Man nimmt es für Versprechen,
      Vorhersagen und Vermutungen. Nur *werden* mit Infinitiv ist Futur I.
      Mit einem Adjektiv oder Nomen heißt *werden* etwas anderes: *Er wird
      Arzt.*

diagrams:
  - caption:
      en: >
        *Ich werde dich morgen anrufen.* and *…, dass er morgen kommen
        wird.* In a main clause *werden* (shaded) stands in position 2 and the
        infinitive (shaded) at the end: the *Satzklammer*. In a subordinate
        clause both are at the end, *werden* last.
      fa: >
        *Ich werde dich morgen anrufen.* و *…, dass er morgen kommen wird.*
        در جملهٔ پایه *werden* (رنگی) در جایگاه دوم و مصدر (رنگی) در پایان
        جمله است: قاب جمله (*Satzklammer*). در جملهٔ پیرو هر دو در پایان
        می‌آیند و *werden* در آخر.
      de: >
        *Ich werde dich morgen anrufen.* und *…, dass er morgen kommen
        wird.* Im Hauptsatz steht *werden* (farbig) auf Position 2 und der
        Infinitiv (farbig) am Ende: die Satzklammer. Im Nebensatz stehen beide
        am Ende, *werden* ganz zuletzt.
    labels:
      second: { en: position 2, fa: جایگاه دوم, de: Position 2 }
      end: { en: the end, fa: پایان جمله, de: Ende }
