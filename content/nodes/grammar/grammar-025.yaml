        <text class="note" x="276" y="18" text-anchor="middle">{{end}}</text>
        <rect class="surface" x="2" y="26" width="48" height="40"/>
        <rect class="shade" x="54" y="26" width="60" height="40"/>
        <rect class="surface" x="118" y="26" width="112" height="40"/>
        <rect class="shade" x="234" y="26" width="84" height="40"/>
        <text class="label" x="26" y="52" text-anchor="middle">Ich</text>
