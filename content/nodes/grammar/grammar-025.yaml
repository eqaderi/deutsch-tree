        <text class="label" x="174" y="52" text-anchor="middle">dich morgen</text>
        <text class="label" x="276" y="52" text-anchor="middle">anrufen.</text>
        <polyline class="line" points="84,70 84,80 276,80 276,70"/>
        <text class="note" x="180" y="98" text-anchor="middle">Satzklammer</text>
        <!-- …, dass er morgen kommen wird. -->
        <text class="note" x="250" y="124" text-anchor="middle">{{end}}</text>
