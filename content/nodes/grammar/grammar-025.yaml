        <text class="label" x="288" y="158" text-anchor="middle">wird.</text>
      </svg>

table:
  columns:
    - { en: Person, fa: شخص, de: Person }
    - { en: "*werden*", fa: "*werden*", de: "*werden*" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [ich, werde, Ich werde dich morgen anrufen.]
    - [du, wirst, Du wirst das bestimmt schaffen.]
    - [er / sie / es, wird, Es wird bald regnen.]
    - [wir, werden, Wir werden pünktlich sein.]
    - [ihr, werdet, Ihr werdet viel Spaß haben.]
    - [sie / Sie, werden, Sie werden es nicht glauben.]

examples:
  - de: Morgen wird es regnen.
    en: It will rain tomorrow.
    fa: فردا باران خواهد بارید.
  - de: Ich werde dich bestimmt besuchen.
    en: I will definitely visit you.
    fa: حتماً به دیدنت خواهم آمد.
  - de: Keine Sorge, ich werde pünktlich sein.
    en: Don't worry, I will be on time.
    fa: نگران نباش، سر وقت خواهم آمد.
  - de: Er wird wohl noch im Büro sein.
    en: He is probably still at the office.
    fa: لابد هنوز در دفتر است.
  - de: Wirst du mir beim Umzug helfen?
    en: Will you help me with the move?
    fa: در اسباب‌کشی به من کمک خواهی کرد؟
  - de: Nächstes Jahr werden wir nach Spanien fahren.
    en: Next year we will go to Spain.
    fa: سال آینده به اسپانیا خواهیم رفت.
  - de: Ich glaube, dass sie die Prüfung bestehen wird.
    en: I think she will pass the exam.
    fa: فکر می‌کنم در امتحان قبول خواهد شد.
  - de: Das Hotel wird Ihnen bestimmt gefallen.
    en: You will certainly like the hotel.
    fa: حتماً از هتل خوشتان خواهد آمد.
  - de: Die Kinder werden jetzt wahrscheinlich schon schlafen.
    en: The children are probably asleep by now.
    fa: بچه‌ها حالا احتمالاً خوابند.

mistakes:
  - wrong: Morgen wird es regnet.
    right: Morgen wird es regnen.
    why:
      en: "After *werden* the verb stays in the infinitive: *regnen*."
      fa: "پس از *werden* فعل به صورت مصدر می‌آید: *regnen*."
      de: "Mit *werden* steht das Verb im Infinitiv: *regnen*."
  - wrong: Ich werde morgen anrufen dich.
    right: Ich werde dich morgen anrufen.
    why:
      en: "The infinitive goes to the very end, after everything else."
      fa: "مصدر به پایان جمله می‌رود، پس از همهٔ اجزای دیگر."
      de: "Der Infinitiv steht ganz am Ende, nach allen anderen Wörtern."
  - wrong: Du wird das schaffen.
    right: Du wirst das schaffen.
    why:
      en: "With *du* the form of *werden* is *wirst*."
      fa: "با *du* صورت *werden* *wirst* است."
      de: "Bei *du* heißt es *wirst*."
  - wrong: Ich weiß, dass er wird kommen.
    right: Ich weiß, dass er kommen wird.
    why:
      en: "In a subordinate clause *werden* goes to the very end, after the infinitive."
      fa: "در جملهٔ پیرو *werden* پس از مصدر به پایان جمله می‌رود."
      de: "Im Nebensatz steht *werden* ganz am Ende, nach dem Infinitiv."

attemptSize: 12

questions:
  - id: gap-1
    type: gap-fill
    prompt: Morgen ___ es regnen.
    options: [wirst, wird, werdet]
    answer: wird
    explanation:
      en: "With *es* the form of *werden* is *wird*."
      fa: "با *es* صورت *werden* *wird* است."
      de: "Bei *es* heißt es *wird*."
  - id: gap-2
    type: gap-fill
    prompt: Ich ___ dich bestimmt besuchen.
    options: [wird, werden, werde]
    answer: werde
    explanation:
      en: "With *ich* the form of *werden* is *werde*."
      fa: "با *ich* صورت *werden* *werde* است."
      de: "Bei *ich* heißt es *werde*."
  - id: gap-3
    type: gap-fill
    prompt: ___ du mir morgen helfen?
    options: [Wirst, Wird, Werdet]
    answer: Wirst
    explanation:
      en: "With *du* the form of *werden* is *wirst*. In a yes/no question it stands first."
      fa: "با *du* صورت *werden* *wirst* است. در پرسش بله یا نه در آغاز جمله می‌آید."
      de: "Bei *du* heißt es *wirst*. In der Ja/Nein-Frage steht es am Anfang."
  - id: gap-4
    type: gap-fill
    prompt: Ihr ___ das schon schaffen.
    options: [werden, werdet, wird]
    answer: werdet
    explanation:
      en: "With *ihr* the form of *werden* is *werdet*."
      fa: "با *ihr* صورت *werden* *werdet* است."
      de: "Bei *ihr* heißt es *werdet*."
  - id: gap-5
    type: gap-fill
    prompt: Wir werden nächstes Jahr nach Spanien ___.
    options: [gefahren, fahren, fahrt]
    answer: fahren
    explanation:
      en: "After *werden* the infinitive comes at the end: *fahren*."
      fa: "پس از *werden* مصدر در پایان جمله می‌آید: *fahren*."
      de: "Mit *werden* steht der Infinitiv am Ende: *fahren*."
  - id: choice-1
    type: multiple-choice
    prompt: "Er wird wohl noch im Büro sein. Was bedeutet das?"
    options: [Er kommt später ins Büro., Er ist wahrscheinlich noch im Büro., Er war gestern im Büro.]
    answer: Er ist wahrscheinlich noch im Büro.
    explanation:
      en: "*Werden* with *wohl* is a guess about now: he is probably still at the office."
      fa: "*werden* همراه با *wohl* حدسی دربارهٔ اکنون است: او احتمالاً هنوز در دفتر است."
      de: "*Werden* mit *wohl* ist eine Vermutung über jetzt: Er ist wahrscheinlich noch im Büro."
  - id: choice-2
    type: multiple-choice
    prompt: Ich weiß, dass du die Prüfung ___.
    options: [wirst bestehen, bestanden wirst, bestehen wirst]
    answer: bestehen wirst
    explanation:
      en: "After *dass*, *werden* goes to the very end, after the infinitive: *bestehen wirst*."
      fa: "پس از *dass*، *werden* پس از مصدر به پایان جمله می‌رود: *bestehen wirst*."
      de: "Nach *dass* steht *werden* ganz am Ende, nach dem Infinitiv: *bestehen wirst*."
  - id: choice-3
    type: multiple-choice
    prompt: Sie sagt, dass sie morgen früher kommen ___.
    options: [werden, wird, wirst]
    answer: wird
    explanation:
      en: "*Sie* here is one woman (*sagt*), so *wird*, at the end of the subordinate clause."
      fa: "*sie* این‌جا سوم‌شخص مفرد است (*sagt*)، پس *wird* در پایان جملهٔ پیرو می‌آید."
      de: "*Sie* ist hier eine Frau (*sagt*). Darum *wird*, am Ende vom Nebensatz."
  - id: choice-4
    type: multiple-choice
    prompt: Morgen ___ wir zu Hause bleiben.
    options: [wird, werdet, werden]
    answer: werden
    explanation:
      en: "With *wir* the form of *werden* is *werden*."
      fa: "با *wir* صورت *werden* همان *werden* است."
      de: "Bei *wir* heißt es *werden*."
  - id: true-1
    type: true-false
    prompt: Ich werde dich morgen anrufen.
    answer: true
    explanation:
      en: "*Werde* stands in position 2 and the infinitive *anrufen* at the end. The sentence is correct."
      fa: "*werde* در جایگاه دوم و مصدر *anrufen* در پایان جمله است. جمله درست است."
      de: "*Werde* steht auf Position 2, der Infinitiv *anrufen* am Ende. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Er wird morgen kommt.
    answer: false
    explanation:
      en: "After *werden* comes the infinitive: *Er wird morgen kommen.*"
      fa: "پس از *werden* مصدر می‌آید: *Er wird morgen kommen.*"
      de: "Mit *werden* steht der Infinitiv: *Er wird morgen kommen.*"
  - id: true-3
    type: true-false
    prompt: Ich wird dir am Wochenende helfen.
    answer: false
    explanation:
      en: "With *ich* the form is *werde*: *Ich werde dir am Wochenende helfen.*"
      fa: "با *ich* صورت فعل *werde* است: *Ich werde dir am Wochenende helfen.*"
      de: "Bei *ich* heißt es *werde*: *Ich werde dir am Wochenende helfen.*"
  - id: true-4
    type: true-false
    prompt: Ich glaube, dass es morgen schneien wird.
    answer: true
    explanation:
      en: "After *dass*, *wird* stands at the very end, after the infinitive. The sentence is correct."
      fa: "پس از *dass*، *wird* پس از مصدر در پایان جمله است. جمله درست است."
      de: "Nach *dass* steht *wird* ganz am Ende, nach dem Infinitiv. Der Satz ist richtig."
  - id: true-5
    type: true-false
    prompt: Wirst du am Samstag zu meiner Party kommen?
    answer: true
    explanation:
      en: "*Wirst* goes with *du*, and *kommen* is at the end. The sentence is correct."
      fa: "*wirst* با *du* می‌آید و *kommen* در پایان جمله است. جمله درست است."
      de: "*Wirst* passt zu *du*, und *kommen* steht am Ende. Der Satz ist richtig."
  - id: error-1
    type: find-error
    prompt: Morgen wird es bestimmt regnet.
    answer: regnet
    explanation:
      en: "After *werden* comes the infinitive: *Morgen wird es bestimmt regnen.*"
      fa: "پس از *werden* مصدر می‌آید: *Morgen wird es bestimmt regnen.*"
      de: "Mit *werden* steht der Infinitiv: *Morgen wird es bestimmt regnen.*"
  - id: error-2
    type: find-error
    prompt: Ich weiß, dass er nicht kommen werdet.
    answer: werdet
    explanation:
      en: "With *er* the form is *wird*: *Ich weiß, dass er nicht kommen wird.*"
      fa: "با *er* صورت فعل *wird* است: *Ich weiß, dass er nicht kommen wird.*"
      de: "Bei *er* heißt es *wird*: *Ich weiß, dass er nicht kommen wird.*"
  - id: error-3
    type: find-error
    prompt: Du wird das bestimmt schaffen.
    answer: wird
    explanation:
      en: "With *du* the form is *wirst*: *Du wirst das bestimmt schaffen.*"
      fa: "با *du* صورت فعل *wirst* است: *Du wirst das bestimmt schaffen.*"
      de: "Bei *du* heißt es *wirst*: *Du wirst das bestimmt schaffen.*"
  - id: typed-gap-1
