    answer: Könnten Sie bitte das Fenster schließen?
    explanation:
      en: "*Könnten* with *bitte* makes a polite request. The other two are an order and an obligation."
      fa: "*könnten* همراه با *bitte* درخواستی مؤدبانه می‌سازد. دو جملهٔ دیگر دستور و اجبارند."
      de: "*Könnten* mit *bitte* ist eine höfliche Bitte. Die anderen Sätze sind ein Befehl und eine Pflicht."
