# Grammar list row 37.
id: grammar-037
kind: grammar
level: A2
chapter: a2-polite-forms
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-026, grammar-036]
title:
  en: "*könnte* for polite requests and suggestions"
  fa: "*könnte* برای درخواست مؤدبانه و پیشنهاد"
  de: "*könnte* für höfliche Bitten und Vorschläge"

explanations:
  en:
    rule: >
      To ask politely, say *könnte* instead of *kann*: *Könnten Sie mir bitte
      helfen?* sounds softer than *Können Sie mir helfen?* *Könnte* is the
      *Konjunktiv II* of *können*: the past *konnte* with an umlaut, *ö*. It
      works like *kann*: in a yes/no question it comes first, in a statement
      in position 2, and the second verb goes to the end as an infinitive.
      *Ich* and *er* / *sie* / *es* have the same form, *könnte*; *du
      könntest*, *wir* / *sie* / *Sie könnten*, *ihr könntet*. Two more polite
      forms work the same way: *Würden Sie bitte kurz warten?* asks someone to
      do something, and *Dürfte ich Sie etwas fragen?* asks for permission. In
      a statement, *könnte* makes a suggestion: *Wir könnten ins Kino gehen.*
  fa:
    rule: >
      برای درخواست مؤدبانه به جای *kann* از *könnte* استفاده کنید: *Könnten
      Sie mir bitte helfen?* نرم‌تر از *Können Sie mir helfen?* است. *könnte*
      صورت *Konjunktiv II* (وجه شرطی) فعل *können* است: همان گذشتهٔ *konnte*
      با دو نقطه (*Umlaut*) روی *ö*. این صورت مانند *kann* رفتار می‌کند: در
      پرسش بله یا نه در آغاز جمله و در جملهٔ خبری در جایگاه دوم می‌آید و فعل
      دوم به شکل مصدر به پایان جمله می‌رود. *ich* و *er* / *sie* / *es* صورت
      یکسان *könnte* را دارند؛ *du könntest*، *wir* / *sie* / *Sie könnten*،
      *ihr könntet*. دو صورت مؤدبانهٔ دیگر نیز همین‌گونه‌اند: با *Würden Sie
      bitte kurz warten?* از کسی می‌خواهیم کاری بکند و با *Dürfte ich Sie
      etwas fragen?* اجازه می‌گیریم. در جملهٔ خبری، *könnte* پیشنهاد می‌دهد:
      *Wir könnten ins Kino gehen.*
  de:
    rule: >
      Für eine höfliche Bitte sagt man *könnte* statt *kann*: *Könnten Sie mir
      bitte helfen?* klingt freundlicher als *Können Sie mir helfen?*
      *Könnte* ist der Konjunktiv II von *können*: das Präteritum *konnte* mit
      Umlaut, *ö*. Es funktioniert wie *kann*: In der Ja/Nein-Frage steht es am
      Anfang, im Aussagesatz auf Position 2. Das zweite Verb steht im
      Infinitiv am Ende. *Ich* und *er* / *sie* / *es* haben die gleiche Form
      *könnte*; *du könntest*, *wir* / *sie* / *Sie könnten*, *ihr könntet*.
      Zwei andere höfliche Formen funktionieren genauso: Mit *Würden Sie bitte
      kurz warten?* bittet man um etwas, mit *Dürfte ich Sie etwas fragen?*
      fragt man um Erlaubnis. Im Aussagesatz macht *könnte* einen Vorschlag:
      *Wir könnten ins Kino gehen.*

table:
  columns:
    - { en: Direct, fa: مستقیم, de: Direkt }
    - { en: Polite, fa: مؤدبانه, de: Höflich }
  rows:
    - [Kannst du mir helfen?, Könntest du mir helfen?]
    - [Können Sie das Fenster öffnen?, Könnten Sie bitte das Fenster öffnen?]
    - [Warten Sie!, Würden Sie bitte kurz warten?]
    - [Kann ich Sie etwas fragen?, Dürfte ich Sie etwas fragen?]
    - [Wir gehen ins Kino., Wir könnten ins Kino gehen.]
    - [Nehmt den Bus!, Ihr könntet den Bus nehmen.]

examples:
  - de: Könnten Sie mir bitte helfen?
    en: Could you help me, please?
    fa: ممکن است لطفاً به من کمک کنید؟
  - de: Könntest du mir das Salz geben?
    en: Could you pass me the salt?
    fa: می‌شود نمک را به من بدهی؟
  - de: Würden Sie bitte kurz warten?
    en: Would you wait a moment, please?
    fa: ممکن است لطفاً لحظه‌ای صبر کنید؟
  - de: Dürfte ich Sie etwas fragen?
    en: May I ask you something?
    fa: اجازه می‌دهید چیزی از شما بپرسم؟
  - de: Könnten Sie das bitte noch einmal sagen?
    en: Could you say that again, please?
    fa: ممکن است لطفاً دوباره بگویید؟
  - de: Wir könnten am Wochenende ins Kino gehen.
    en: We could go to the cinema at the weekend.
    fa: می‌توانیم آخر هفته به سینما برویم.
  - de: Du könntest deine Schwester fragen.
    en: You could ask your sister.
    fa: می‌توانی از خواهرت بپرسی.
  - de: Könnten wir uns morgen treffen?
    en: Could we meet tomorrow?
    fa: می‌شود فردا همدیگر را ببینیم؟

mistakes:
  - wrong: Konnten Sie mir bitte helfen?
    right: Könnten Sie mir bitte helfen?
    why:
      en: "*Konnten*, without the umlaut, is the past (*Präteritum*). A polite request needs *könnten*, with *ö*."
      fa: "*konnten* بی دو نقطه (*Umlaut*) گذشتهٔ ساده (*Präteritum*) است. درخواست مؤدبانه *könnten* با *ö* لازم دارد."
      de: "*Konnten* ohne Umlaut ist Präteritum. Für eine höfliche Bitte braucht man *könnten* mit *ö*."
  - wrong: Könntest Sie bitte das Fenster öffnen?
    right: Könnten Sie bitte das Fenster öffnen?
    why:
      en: "With the polite *Sie* the form is *könnten*, as with *wir*."
      fa: "با *Sie* رسمی صورت فعل *könnten* است، همانند *wir*."
      de: "Bei *Sie* (höflich) heißt es *könnten*, wie bei *wir*."
  - wrong: Könntest du mir hilfst?
    right: Könntest du mir helfen?
    why:
      en: "Only *könntest* is conjugated. The second verb is an infinitive at the end."
      fa: "فقط *könntest* صرف می‌شود؛ فعل دوم به شکل مصدر در پایان جمله می‌آید."
      de: "Nur *könntest* ist konjugiert. Das zweite Verb steht im Infinitiv am Ende."
  - wrong: Ihr könntest den Bus nehmen.
    right: Ihr könntet den Bus nehmen.
    why:
      en: "With *ihr* the form is *könntet*."
      fa: "با *ihr* صورت فعل *könntet* است."
      de: "Bei *ihr* heißt es *könntet*."

