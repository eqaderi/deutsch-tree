# Grammar list row 152.
id: grammar-152
kind: grammar
level: B1
chapter: b1-connectors-negation
order: 1
status: published
recogniseOnly: false
prerequisites: [grammar-151, grammar-165]
title:
  en: "*trotzdem*"
  fa: "*trotzdem*"
  de: "*trotzdem*"

explanations:
  en:
    rule: >
      *Trotzdem* (still, all the same, anyway) says that something happens
      although the first fact speaks against it: *Das Wasser ist kalt,
      trotzdem geht sie schwimmen.* It is the opposite of *deshalb*, which
      gives the result you would expect. Like *deshalb*, *trotzdem* is an
      adverb, not a conjunction: at the start of a clause it takes position 1,
      so the verb comes next and the subject after it (*trotzdem geht sie*).
      It can also stand after the verb, often in a new sentence or after
      *aber*: *Sie geht trotzdem schwimmen.* *aber sie geht trotzdem
      schwimmen.* The fact that speaks against it can also go into a clause
      with *obwohl*, with the verb at the end: *Sie geht schwimmen, obwohl
      das Wasser kalt ist.*
  fa:
    rule: >
      *trotzdem* (با این حال، با وجود این) می‌گوید کاری انجام می‌شود، هرچند
      واقعیت نخست با آن جور درنمی‌آید: *Das Wasser ist kalt, trotzdem geht
      sie schwimmen.* این واژه وارونهٔ *deshalb* است که نتیجهٔ مورد انتظار را
      می‌آورد. *trotzdem* نیز مانند *deshalb* قید است، نه حرف ربط. اگر در آغاز
      جمله بیاید، خودش جایگاه اول را می‌گیرد؛ پس فعل پس از آن می‌آید و فاعل
      پس از فعل: *trotzdem geht sie*. جای آن می‌تواند پس از فعل هم باشد، به‌ویژه
      در جمله‌ای تازه یا پس از *aber*: *Sie geht trotzdem schwimmen.* و *aber
      sie geht trotzdem schwimmen.* همان واقعیتِ مخالف را می‌توان در جمله‌ای
      با *obwohl* هم گفت که فعلش به پایان جمله می‌رود: *Sie geht schwimmen,
      obwohl das Wasser kalt ist.*
  de:
    rule: >
      *Trotzdem* sagt: Etwas passiert, aber man erwartet es nicht. Der erste
      Satz spricht dagegen: *Das Wasser ist kalt, trotzdem geht sie
      schwimmen.* Bei *deshalb* ist es anders: Danach kommt die Folge, die man
      erwartet. *Trotzdem* ist ein Adverb wie *deshalb*, keine Konjunktion. Am
      Anfang vom Satz ist es Position 1. Dann kommt das Verb und danach das
      Subjekt: *trotzdem geht sie*. *Trotzdem* kann auch nach dem Verb stehen,
      oft in einem neuen Satz oder nach *aber*: *Sie geht trotzdem schwimmen.*
      *aber sie geht trotzdem schwimmen.* Man kann das Gleiche auch mit
      *obwohl* sagen. Dann steht das Verb am Ende: *Sie geht schwimmen, obwohl
      das Wasser kalt ist.*

table:
  columns:
    - { en: First clause, fa: جملهٔ نخست, de: Erster Satz }
    - { en: Position 1, fa: جایگاه اول, de: Position 1 }
    - { en: "Position 2: verb", fa: "جایگاه دوم: فعل", de: "Position 2: Verb" }
    - { en: Subject, fa: فاعل, de: Subjekt }
    - { en: The rest, fa: بقیهٔ جمله, de: Rest }
  rows:
    - ["Das Wasser ist kalt,", trotzdem, geht, sie, schwimmen.]
    - ["Ich bin müde,", trotzdem, lerne, ich, noch eine Stunde.]
    - ["Es regnet,", trotzdem, fahren, wir, mit dem Rad.]
    - ["Er hat wenig Geld, und", trotzdem, kauft, er, ein neues Handy.]
    - ["Der Film war lang.", Trotzdem, hat, er, mir gefallen.]

# Three ways to join one fact to what follows from it: deshalb (what you
# expect), trotzdem (what you don't expect), and obwohl, which puts the fact
# into a clause after the surprise. The bent arrow marks the surprise.
diagrams:
  - caption:
      en: >
        One fact, two results. With *deshalb* comes what you expect; with
        *trotzdem* comes what you do not expect. *Obwohl* says the same as
        *trotzdem* the other way round: the surprise first, then the fact, with
        the verb at the end.
      fa: >
        یک واقعیت و دو نتیجه. پس از *deshalb* نتیجهٔ طبیعی می‌آید و پس از
        *trotzdem* نتیجه‌ای که کسی انتظارش را ندارد. *obwohl* همان معنای
        *trotzdem* را به ترتیب وارونه می‌گوید: نخست نتیجهٔ غیرمنتظره، سپس
        واقعیت، با فعل در پایان جمله.
      de: >
        Eine Tatsache, zwei Folgen. Nach *deshalb* kommt, was man erwartet. Nach
        *trotzdem* kommt, was man nicht erwartet. Mit *obwohl* sagt man das
        Gleiche umgekehrt: Zuerst kommt die Überraschung, dann die Tatsache, mit
        dem Verb am Ende.
    labels:
      fact: { en: the fact, fa: واقعیت, de: die Tatsache }
      expected: { en: as expected, fa: نتیجهٔ طبیعی, de: erwartet }
      unexpected: { en: not as expected, fa: نتیجهٔ غیرمنتظره, de: nicht erwartet }
    svg: |
      <svg viewBox="0 0 320 306">
        <!-- deshalb: fact, then the expected result -->
        <rect class="surface" x="4" y="8" width="132" height="60"/>
        <rect class="surface" x="184" y="8" width="132" height="60"/>
        <text class="label" x="70" y="34" text-anchor="middle">Es regnet,</text>
        <text class="note" x="70" y="56" text-anchor="middle">{{fact}}</text>
        <text class="label" x="250" y="34" text-anchor="middle">deshalb …</text>
        <text class="note" x="250" y="56" text-anchor="middle">{{expected}}</text>
        <line class="line" x1="140" y1="38" x2="172" y2="38"/>
        <polygon class="object" points="180,38 170,32 170,44"/>
        <text class="note" x="160" y="90" text-anchor="middle">Es regnet, deshalb bleibe ich zu Hause.</text>
        <!-- trotzdem: fact, then the unexpected result; the arrow bends -->
        <rect class="surface" x="4" y="110" width="132" height="60"/>
        <rect class="shade" x="184" y="110" width="132" height="60"/>
        <text class="label" x="70" y="136" text-anchor="middle">Es regnet,</text>
        <text class="note" x="70" y="158" text-anchor="middle">{{fact}}</text>
        <text class="label" x="250" y="136" text-anchor="middle">trotzdem …</text>
        <text class="note" x="250" y="158" text-anchor="middle">{{unexpected}}</text>
        <polyline class="line" points="140,140 152,128 160,152 172,140"/>
        <polygon class="object" points="180,140 170,134 170,146"/>
        <text class="note" x="160" y="192" text-anchor="middle">Es regnet, trotzdem gehe ich spazieren.</text>
        <!-- obwohl: the unexpected result first, the fact after it -->
        <rect class="shade" x="4" y="212" width="132" height="60"/>
        <rect class="surface" x="184" y="212" width="132" height="60"/>
        <text class="label" x="70" y="238" text-anchor="middle">Ich gehe …,</text>
        <text class="note" x="70" y="260" text-anchor="middle">{{unexpected}}</text>
