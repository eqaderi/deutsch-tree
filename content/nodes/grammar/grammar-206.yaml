examples:
  - de: Im Urlaub haben wir viel Interessantes gesehen, aber nichts Gefährliches erlebt.
    en: On holiday we saw a lot of interesting things, but had no dangerous experiences.
    fa: در تعطیلات چیزهای جالب زیادی دیدیم، ولی هیچ اتفاق خطرناکی برایمان نیفتاد.
  - de: Alles Liebe zum Geburtstag!
    en: Lots of love on your birthday!
    fa: تولدت مبارک، با بهترین آرزوها!
  - de: Gibt es etwas Neues?
    en: Is there any news?
    fa: خبر تازه‌ای هست؟
  - de: Im Fernsehen kommt heute nichts Besonderes.
    en: There's nothing special on TV today.
    fa: امروز تلویزیون برنامهٔ خاصی ندارد.
  - de: Ich habe dir etwas Schönes mitgebracht.
    en: I've brought you something nice.
    fa: برایت چیز قشنگی آورده‌ام.
  - de: Das Gute an der Wohnung ist der große Balkon.
    en: The good thing about the flat is the big balcony.
    fa: خوبی این آپارتمان بالکن بزرگ آن است.
  - de: In der Zeitung steht heute wenig Neues.
    en: There is little news in the paper today.
    fa: امروز در روزنامه خبر تازهٔ چندانی نیست.
  - de: Ich wünsche dir alles Gute für die Prüfung.
    en: I wish you all the best for the exam.
    fa: برای امتحانت بهترین‌ها را آرزو می‌کنم.
  - de: Das Wichtigste ist die Gesundheit.
    en: The most important thing is health.
    fa: مهم‌ترین چیز سلامتی است.
  - de: Hast du etwas Süßes für die Kinder?
    en: Do you have something sweet for the children?
    fa: چیز شیرینی برای بچه‌ها داری؟

mistakes:
  - wrong: Gibt es etwas neues?
    right: Gibt es etwas Neues?
    why:
      en: "Used as a noun, the adjective is written with a capital letter: *etwas Neues*."
      fa: "صفتی که به‌عنوان اسم به کار رود با حرف بزرگ نوشته می‌شود: *etwas Neues*."
      de: "Als Nomen schreibt man das Adjektiv groß: *etwas Neues*."
  - wrong: Alles Gutes zum Geburtstag!
    right: Alles Gute zum Geburtstag!
    why:
      en: "After *alles* the ending is *-e*: *alles Gute*."
      fa: "پس از *alles* پایانه *-e* است: *alles Gute*."
      de: "Nach *alles* ist die Endung *-e*: *alles Gute*."
  - wrong: Wir haben nichts Gefährliche erlebt.
    right: Wir haben nichts Gefährliches erlebt.
    why:
      en: "After *nichts* the ending is *-es*: *nichts Gefährliches*."
      fa: "پس از *nichts* پایانه *-es* است: *nichts Gefährliches*."
      de: "Nach *nichts* ist die Endung *-es*: *nichts Gefährliches*."
  - wrong: Das Gutes an der Wohnung ist der Balkon.
    right: Das Gute an der Wohnung ist der Balkon.
    why:
      en: "After *das* the ending is *-e*: *das Gute*."
      fa: "پس از *das* پایانه *-e* است: *das Gute*."
      de: "Nach *das* ist die Endung *-e*: *das Gute*."

