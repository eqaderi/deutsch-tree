title:
  en: "Adjectives as neuter nouns"
  fa: "صفت به‌عنوان اسم خنثی (*etwas Neues*، *nichts Besonderes*)"
  de: "Adjektive als neutrale Nomen (*etwas Neues*, *nichts Besonderes*)"

explanations:
  en:
    rule: >
      An adjective can also name a thing or an idea: *etwas Neues*
      (something new), *nichts Besonderes* (nothing special), *das Gute*
      (the good thing). It is then a neuter noun and is written with a
      capital letter. After *etwas*, *nichts*, *viel* and *wenig* it takes
      *-es*: *etwas Neues*, *nichts Gutes*, *viel Interessantes*, *wenig
      Neues*. After *alles* and *das* it takes *-e*: *alles Gute*, *das
      Schöne*, also with a superlative (*das Beste*, *das Wichtigste*). The
      *Akkusativ* has the same form: *Ich habe etwas Schönes gekauft.*
      *Alles Gute!* and *Alles Liebe!* are fixed wishes for a birthday or at
      the end of a letter.
  fa:
    rule: >
      صفت می‌تواند نام یک چیز یا یک مفهوم هم باشد: *etwas Neues* (چیزی تازه)،
      *nichts Besonderes* (هیچ چیز خاصی) و *das Gute* (نکتهٔ خوب).
      در این حالت اسم خنثی است و با حرف بزرگ نوشته می‌شود. پس از *etwas*،
      *nichts*، *viel* و *wenig* پایانهٔ *-es* می‌گیرد: *etwas Neues*، *nichts
      Gutes*، *viel Interessantes* و *wenig Neues*. پس از *alles* و *das*
      پایانهٔ *-e* می‌گیرد: *alles Gute* و *das Schöne*، و نیز با صفت عالی
      (*das Beste*، *das Wichtigste*). در حالت *Akkusativ* (حالت مفعولی) هم
      همین شکل می‌آید: *Ich habe etwas Schönes gekauft.* عبارت‌های *Alles
      Gute!* و *Alles Liebe!* آرزوهای ثابتی‌اند برای تولد یا پایان نامه.
  de:
    rule: >
      Ein Adjektiv kann auch eine Sache sein: *etwas Neues*, *nichts
      Besonderes*, *das Gute*. Dann ist es ein neutrales Nomen, und man
      schreibt es groß. Nach *etwas*, *nichts*, *viel* und *wenig* hat es
      *-es*: *etwas Neues*, *nichts Gutes*, *viel Interessantes*, *wenig
      Neues*. Nach *alles* und *das* hat es *-e*: *alles Gute*, *das Schöne*,
      auch beim Superlativ (*das Beste*, *das Wichtigste*). Im Akkusativ ist
      die Form gleich: *Ich habe etwas Schönes gekauft.* *Alles Gute!* und
      *Alles Liebe!* sagt man zum Geburtstag oder schreibt man am Ende von
      einem Brief.

