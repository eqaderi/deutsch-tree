id: grammar-001
kind: grammar
level: A1
chapter: a1-verbs-present
order: 1
status: published
recogniseOnly: false
prerequisites: []
title:
  en: "*Präsens*, regular conjugation"
  fa: زمان حال (*Präsens*)، صرف فعل‌های باقاعده
  de: Präsens, regelmäßige Verben

explanations:
  en:
    rule: >
      In the present tense (*Präsens*) a regular verb keeps its stem and adds an
      ending for the person. Take *-en* off the infinitive to get the stem:
      *wohnen* has the stem *wohn-*. German has only this one present tense,
      so *ich wohne* means both "I live" and "I am living".
  fa:
    rule: >
      در زمان حال (*Präsens*)، بن فعل باقاعده ثابت می‌ماند و برای هر شخص
      شناسهٔ ویژهٔ خود را می‌گیرد. بن فعل، مصدر بدون *-en* پایانی است: بن
      *wohnen* می‌شود *wohn-*. آلمانی فقط همین یک زمان حال را دارد؛ از این رو
      *ich wohne* هم به معنای «زندگی می‌کنم» است و هم «دارم زندگی می‌کنم».
  de:
    rule: >
      Im Präsens bleibt der Stamm von einem regelmäßigen Verb gleich. Jede
      Person hat eine Endung. Der Stamm ist der Infinitiv ohne *-en*:
      *wohnen* hat den Stamm *wohn-*.

table:
  columns:
    - en: Person
      fa: شخص
      de: Person
    - en: Ending
      fa: شناسه
      de: Endung
    - en: Example
      fa: مثال
      de: Beispiel
  rows:
    - [ich, -e, ich wohne]
    - [du, -st, du wohnst]
    - [er / sie / es, -t, er wohnt]
    - [wir, -en, wir wohnen]
    - [ihr, -t, ihr wohnt]
    - [sie / Sie, -en, sie wohnen]

examples:
  - de: Ich wohne in Berlin.
    en: I live in Berlin.
    fa: من در برلین زندگی می‌کنم.
  - de: Lernst du Deutsch?
    en: Are you learning German?
    fa: آلمانی یاد می‌گیری؟
  - de: Anna kocht heute Suppe.
    en: Anna is cooking soup today.
    fa: آنا امروز سوپ می‌پزد.
  - de: Wir spielen am Samstag Fußball.
    en: We play football on Saturday.
    fa: ما شنبه فوتبال بازی می‌کنیم.
  - de: Kommt ihr aus Spanien?
    en: Do you (plural) come from Spain?
    fa: شما (جمع) اهل اسپانیا هستید؟
  - de: Anna und Tom lernen zusammen.
    en: Anna and Tom study together.
    fa: آنا و تام با هم درس می‌خوانند.

mistakes:
  - wrong: Er wohne in Köln.
    right: Er wohnt in Köln.
    why:
      en: With *er*, *sie* and *es* the ending is *-t*, not *-e*.
      fa: با *er*، *sie* و *es* شناسهٔ فعل *-t* است، نه *-e*.
      de: Bei *er*, *sie* und *es* ist die Endung *-t*, nicht *-e*.
  - wrong: Du lernt Deutsch.
    right: Du lernst Deutsch.
    why:
      en: With *du* the ending is *-st*.
      fa: با *du* شناسهٔ فعل *-st* است.
      de: Bei *du* ist die Endung *-st*.
  - wrong: Ich bin wohne in Berlin.
    right: Ich wohne in Berlin.
    why:
      en: Do not add *sein* to copy the English "I am living". The verb alone is enough.
      fa: «دارم زندگی می‌کنم» را با افزودن *sein* نسازید؛ خودِ فعل همین معنا را دارد.
      de: Man braucht kein *sein* vor dem Verb. Das Verb allein ist genug.

questions:
  - id: q1
    type: multiple-choice
    prompt: Ich ___ in Berlin.
    options: [wohne, wohnst, wohnt]
    answer: wohne
    explanation:
      en: With *ich* the ending is *-e*.
      fa: با *ich* شناسهٔ فعل *-e* است.
      de: Bei *ich* ist die Endung *-e*.
  - id: q2
    type: multiple-choice
    prompt: ___ du Deutsch?
    options: [Lerne, Lernst, Lernt]
    answer: Lernst
    explanation:
      en: With *du* the ending is *-st*.
      fa: با *du* شناسهٔ فعل *-st* است.
      de: Bei *du* ist die Endung *-st*.
  - id: q3
    type: multiple-choice
    prompt: Anna ___ heute Suppe.
    options: [koche, kochst, kocht]
    answer: kocht
    explanation:
      en: Anna is one person you talk about (*sie*), so the ending is *-t*.
      fa: آنا سوم‌شخص مفرد است (*sie*)، پس شناسهٔ فعل *-t* است.
      de: Anna ist eine Person (*sie*). Die Endung ist *-t*.
  - id: q4
    type: multiple-choice
    prompt: Wir ___ am Samstag Fußball.
    options: [spielst, spielt, spielen]
    answer: spielen
    explanation:
      en: With *wir* the ending is *-en*.
      fa: با *wir* شناسهٔ فعل *-en* است.
      de: Bei *wir* ist die Endung *-en*.
  - id: q5
    type: multiple-choice
    prompt: Ihr ___ in Hamburg.
    options: [wohnt, wohnen, wohnst]
    answer: wohnt
    explanation:
      en: With *ihr* the ending is *-t*.
      fa: با *ihr* شناسهٔ فعل *-t* است.
      de: Bei *ihr* ist die Endung *-t*.
  - id: q6
    type: multiple-choice
    prompt: Anna und Tom ___ zusammen.
    options: [lernt, lernst, lernen]
    answer: lernen
    explanation:
      en: Anna and Tom are two people (*sie*, plural), so the ending is *-en*.
      fa: آنا و تام سوم‌شخص جمع‌اند (*sie*)، پس شناسهٔ فعل *-en* است.
      de: Anna und Tom sind zwei Personen (*sie*, Plural). Die Endung ist *-en*.
  - id: q7
    type: multiple-choice
    prompt: Was ___ du heute?
    options: [mache, machst, macht]
    answer: machst
    explanation:
      en: With *du* the ending is *-st*.
      fa: با *du* شناسهٔ فعل *-st* است.
      de: Bei *du* ist die Endung *-st*.
  - id: q8
    type: multiple-choice
    prompt: Herr Weber, wo ___ Sie?
    options: [wohnst, wohnt, wohnen]
    answer: wohnen
    explanation:
      en: With the polite *Sie* the ending is *-en*.
      fa: با *Sie* رسمی شناسهٔ فعل *-en* است.
      de: Bei *Sie* (höflich) ist die Endung *-en*.
  - id: q9
    type: multiple-choice
    prompt: Ich ___ Musik.
    options: [hören, höre, hörst]
    answer: höre
    explanation:
      en: With *ich* the ending is *-e*.
      fa: با *ich* شناسهٔ فعل *-e* است.
      de: Bei *ich* ist die Endung *-e*.
  - id: q10
    type: multiple-choice
    prompt: Tom ___ ein Buch.
    options: [kauft, kaufe, kaufst]
    answer: kauft
    explanation:
      en: Tom is one person you talk about (*er*), so the ending is *-t*.
      fa: تام سوم‌شخص مفرد است (*er*)، پس شناسهٔ فعل *-t* است.
      de: Tom ist eine Person (*er*). Die Endung ist *-t*.
  - id: q11
    type: multiple-choice
    prompt: Woher ___ ihr?
    options: [kommst, kommen, kommt]
    answer: kommt
    explanation:
      en: With *ihr* the ending is *-t*.
      fa: با *ihr* شناسهٔ فعل *-t* است.
      de: Bei *ihr* ist die Endung *-t*.
  - id: q12
    type: multiple-choice
    prompt: Wir ___ Wasser.
    options: [trinken, trinkst, trinke]
    answer: trinken
    explanation:
      en: With *wir* the ending is *-en*.
      fa: با *wir* شناسهٔ فعل *-en* است.
      de: Bei *wir* ist die Endung *-en*.
  - id: q13
    type: multiple-choice
    prompt: Die Kinder ___ im Garten.
    options: [spielt, spielen, spielst]
    answer: spielen
    explanation:
      en: "*Die Kinder* are several people (*sie*, plural), so the ending is *-en*."
      fa: "*die Kinder* سوم‌شخص جمع است (*sie*)، پس شناسهٔ فعل *-en* است."
      de: "*Die Kinder* sind mehrere Personen (*sie*, Plural). Die Endung ist *-en*."
  - id: q14
    type: multiple-choice
    prompt: ___ wohnst in Wien.
    options: [Ich, Du, Wir]
    answer: Du
    explanation:
      en: The ending *-st* goes only with *du*.
      fa: شناسهٔ *-st* فقط با *du* می‌آید.
      de: Die Endung *-st* gibt es nur bei *du*.
  - id: q15
    type: multiple-choice
    prompt: ___ lerne Deutsch.
    options: [Er, Ihr, Ich]
    answer: Ich
    explanation:
      en: The ending *-e* goes only with *ich*.
      fa: شناسهٔ *-e* فقط با *ich* می‌آید.
      de: Die Endung *-e* gibt es nur bei *ich*.
  - id: q16
    type: multiple-choice
    prompt: Das Kind ___ Milch.
    options: [trinke, trinkt, trinkst]
    answer: trinkt
    explanation:
      en: "*Das Kind* is one person you talk about (*es*), so the ending is *-t*."
      fa: "*das Kind* سوم‌شخص مفرد است (*es*)، پس شناسهٔ فعل *-t* است."
      de: "*Das Kind* ist eine Person (*es*). Die Endung ist *-t*."

