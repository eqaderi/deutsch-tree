# Grammar list row 194. "am Montag", "am Abend" and "heute Abend" are
# grammar-192 and grammar-193; here is the adverb that means "every time".
id: grammar-194
kind: grammar
level: A2
chapter: a2-adverbs
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-192, grammar-193]
title:
  en: "Adverbs in *-s*"
  fa: "قیدهای مختوم به *-s* (*montags*، *abends*)"
  de: "Adverbien auf *-s* (*montags*, *abends*)"

explanations:
  en:
    rule: >
      A day of the week or a time of day with *-s* added says that something
      happens regularly, every time: *Montags habe ich Deutschkurs.* (every
      Monday), *Abends sehe ich fern.* (every evening, in the evening). These
      words are adverbs, not nouns: they have no article and no *am*, and they
      are written with a small letter, except at the start of a sentence. The
      same goes for *morgens*, *vormittags*, *mittags*, *nachmittags* and
      *nachts*; *nachts* takes the *-s* too, although it comes from *die Nacht*.
      *Am Montag* usually means one Monday: *Am Montag habe ich einen Termin.*
      After *heute*, *gestern* and *morgen* the time of day is a noun with a
      capital: *heute Morgen*, *gestern Abend*, not *heute morgens*. Like other time adverbs, the word can
      stand first or after the verb: *Ich arbeite vormittags.*
  fa:
    rule: >
      وقتی به نام روزهای هفته یا بخش‌های روز *-s* افزوده شود، معنای «هر بار،
      به‌طور منظم» می‌دهد: *Montags habe ich Deutschkurs.* (دوشنبه‌ها، هر
      دوشنبه)، *Abends sehe ich fern.* (شب‌ها، هر شب). این واژه‌ها قیدند، نه
      اسم: حرف تعریف و *am* ندارند و با حرف کوچک نوشته می‌شوند، مگر در آغاز
      جمله. *morgens*، *vormittags*، *mittags*، *nachmittags* و *nachts* نیز
      همین‌طورند؛ *nachts* هم با آن‌که از *die Nacht* می‌آید، *-s* می‌گیرد.
      *am Montag* بیشتر به یک دوشنبهٔ مشخص اشاره دارد: *Am Montag habe ich einen
      Termin.* پس از *heute*، *gestern* و *morgen*، بخش روز اسم است و با حرف
      بزرگ نوشته می‌شود: *heute Morgen*، *gestern Abend*، نه *heute morgens*. این قیدها نیز مانند دیگر قیدهای زمان
      می‌توانند در آغاز جمله یا پس از فعل بیایند: *Ich arbeite vormittags.*
  de:
    rule: >
      Ein Tag oder eine Tageszeit mit *-s* sagt: Das passiert regelmäßig, jedes
      Mal. *Montags habe ich Deutschkurs.* (jeden Montag), *Abends sehe ich
      fern.* (jeden Abend). Diese Wörter sind Adverbien, keine Nomen: Sie haben
      keinen Artikel und kein *am*, und man schreibt sie klein, nur am
      Satzanfang groß. So ist es auch bei *morgens*, *vormittags*, *mittags*,
      *nachmittags* und *nachts*. Auch *nachts* hat ein *-s*, obwohl es *die
      Nacht* heißt. *Am Montag* meint meistens einen Montag: *Am Montag habe
      ich einen Termin.* Nach *heute*, *gestern* und *morgen* ist die
      Tageszeit ein Nomen und groß: *heute Morgen*, *gestern Abend*, nicht
      *heute morgens*. Wie andere Zeitadverbien
      steht das Wort am Anfang oder nach dem Verb: *Ich arbeite vormittags.*

