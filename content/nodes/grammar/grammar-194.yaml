examples:
  - de: Montags habe ich Deutschkurs.
    en: I have German class on Mondays.
    fa: دوشنبه‌ها کلاس آلمانی دارم.
  - de: Am Montag habe ich einen Termin beim Arzt.
    en: On Monday I have a doctor's appointment.
    fa: دوشنبه نزد پزشک وقت دارم.
  - de: Samstags gehen wir auf den Markt.
    en: On Saturdays we go to the market.
    fa: شنبه‌ها به بازار می‌رویم.
  - de: Sonntags schlafe ich lange.
    en: On Sundays I sleep in.
    fa: یکشنبه‌ها تا دیروقت می‌خوابم.
  - de: Morgens trinke ich immer einen Kaffee.
    en: In the morning I always drink a coffee.
    fa: صبح‌ها همیشه یک قهوه می‌نوشم.
  - de: Meine Mutter arbeitet vormittags im Büro.
    en: My mother works in the office in the mornings.
    fa: مادرم پیش از ظهرها در دفتر کار می‌کند.
  - de: Mittags esse ich in der Kantine.
    en: At lunchtime I eat in the canteen.
    fa: ظهرها در غذاخوری محل کار غذا می‌خورم.
  - de: Abends sehen wir oft fern.
    en: In the evenings we often watch TV.
    fa: شب‌ها اغلب تلویزیون تماشا می‌کنیم.
  - de: Nachts ist es in unserer Straße sehr ruhig.
    en: At night it is very quiet in our street.
    fa: شب‌ها خیابان ما خیلی آرام است.
  - de: Heute Morgen war ich beim Bäcker.
    en: This morning I was at the baker's.
    fa: امروز صبح به نانوایی رفتم.

mistakes:
  - wrong: Am Montags habe ich frei.
    right: Montags habe ich frei.
    why:
      en: "*Montags* is an adverb and takes no *am*. With *am* it is the noun: *am Montag*."
      fa: "*montags* قید است و *am* نمی‌گیرد. با *am* باید اسم بیاید: *am Montag*."
      de: "*Montags* ist ein Adverb, ohne *am*. Mit *am* steht das Nomen: *am Montag*."
  - wrong: Ich arbeite Abends im Restaurant.
    right: Ich arbeite abends im Restaurant.
    why:
      en: "*Abends* is an adverb, not a noun, so it has a small letter inside the sentence."
      fa: "*abends* قید است، نه اسم؛ پس در میان جمله با حرف کوچک نوشته می‌شود."
      de: "*Abends* ist ein Adverb, kein Nomen. Darum schreibt man es im Satz klein."
  - wrong: Heute morgens war ich beim Arzt.
    right: Heute Morgen war ich beim Arzt.
    why:
      en: "After *heute* comes the noun with a capital: *heute Morgen*. *Morgens* means every morning."
      fa: "پس از *heute* اسم با حرف بزرگ می‌آید: *heute Morgen*. *morgens* یعنی هر روز صبح."
      de: "Nach *heute* steht das Nomen, groß: *heute Morgen*. *Morgens* heißt: jeden Morgen."
  - wrong: In der Nachts schlafe ich schlecht.
    right: Nachts schlafe ich schlecht.
    why:
      en: "Either the adverb *nachts* alone, or the noun with its article: *in der Nacht*."
      fa: "یا قید *nachts* به‌تنهایی، یا اسم با حرف تعریفش: *in der Nacht*."
      de: "Entweder das Adverb *nachts* allein oder das Nomen mit Artikel: *in der Nacht*."

