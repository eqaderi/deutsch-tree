title:
  en: "*Personalpronomen*, *Nominativ*"
  fa: "ضمیرهای شخصی در حالت *Nominativ*"
  de: "Personalpronomen im Nominativ"

explanations:
  en:
    rule: >
      A personal pronoun stands for a person or a thing and is the subject of
      the sentence: *ich*, *du*, *er*, *sie*, *es*, *wir*, *ihr*, *sie* and
      *Sie*. Say *du* (and *ihr* to several people) to family, friends and
      children, and *Sie* to adults you do not know well; *Sie* always has a
      capital letter. For a thing the pronoun follows the article of the noun:
      *der* becomes *er*, *die* becomes *sie*, *das* becomes *es*, and plural
      *die* becomes *sie*. So *sie* can mean "she", "it" or "they", and *Sie*
      means polite "you": the ending of the verb and the context tell you which.
  fa:
    rule: >
      ضمیر شخصی جای اسمِ یک شخص یا یک چیز می‌نشیند و فاعل جمله است: *ich*،
      *du*، *er*، *sie*، *es*، *wir*، *ihr*، *sie* و *Sie*. با خانواده، دوستان
      و کودکان *du* به کار می‌رود (و برای چند نفر *ihr*)، و با بزرگسالی که او
      را خوب نمی‌شناسید *Sie*؛ *Sie* رسمی همیشه با حرف بزرگ نوشته می‌شود. ضمیرِ
      یک چیز از حرف تعریف اسم پیروی می‌کند: به جای *der* می‌آید *er*، به جای
      *die* می‌آید *sie*، به جای *das* می‌آید *es* و به جای *die* جمع می‌آید
      *sie*. در فارسی برای همهٔ این‌ها «آن» یا «آن‌ها» می‌گوییم، ولی در آلمانی
      جنس اسم تعیین‌کننده است. از این رو *sie* می‌تواند «او» (زن)، «آن» یا
      «آن‌ها» باشد و *Sie* همان «شما»ی رسمی است؛ شناسهٔ فعل و بافت جمله معنا را
      روشن می‌کنند.
  de:
    rule: >
      Ein Personalpronomen steht für eine Person oder eine Sache. Es ist das
      Subjekt im Satz: *ich*, *du*, *er*, *sie*, *es*, *wir*, *ihr*, *sie* und
      *Sie*. Zu Familie, Freunden und Kindern sagt man *du* (zu mehreren
      Personen *ihr*). Zu Erwachsenen, die man nicht gut kennt, sagt man *Sie*.
      *Sie* schreibt man immer groß. Bei Sachen kommt das Pronomen vom Artikel:
      *der* wird zu *er*, *die* zu *sie*, *das* zu *es*, und im Plural *die* zu
      *sie*.

# Persons at a glance: who speaks, who is spoken to, who is spoken about.
# The table below is the article-change table of content/README.md.
diagrams:
  - caption:
      en: >
        The persons: *ich* and *wir* speak, *du* and *ihr* are spoken to, *er*,
        *sie*, *es* and plural *sie* are spoken about. Polite *Sie* is for one
        person or for several.
      fa: >
        شخص‌ها: *ich* و *wir* گوینده‌اند، *du* و *ihr* شنونده، و *er*، *sie*،
        *es* و *sie* جمع کسی یا چیزی که درباره‌اش حرف می‌زنیم. *Sie* رسمی هم
        برای یک نفر به کار می‌رود و هم برای چند نفر.
      de: >
        Die Personen: *ich* und *wir* sprechen, mit *du* und *ihr* spricht man,
        über *er*, *sie*, *es* und *sie* (Plural) spricht man. Das höfliche
        *Sie* ist für eine Person oder für mehrere.
    labels:
      singular: { en: singular, fa: مفرد, de: Singular }
      plural: { en: plural, fa: جمع, de: Plural }
      first: { en: 1st person, fa: اول‌شخص, de: 1. Person }
      second: { en: 2nd person, fa: دوم‌شخص, de: 2. Person }
      third: { en: 3rd person, fa: سوم‌شخص, de: 3. Person }
      polite: { en: polite, fa: رسمی, de: höflich }
