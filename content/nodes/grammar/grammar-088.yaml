examples:
  - de: Wir sehen uns morgen!
    en: See you tomorrow!
    fa: فردا همدیگر را می‌بینیم!
  - de: Wir treffen uns um acht vor dem Kino.
    en: We're meeting at eight in front of the cinema.
    fa: ساعت هشت جلوی سینما همدیگر را می‌بینیم.
  - de: Kennt ihr euch schon?
    en: Do you (plural) already know each other?
    fa: شما (جمع) همدیگر را می‌شناسید؟
  - de: Anna und Tom lieben sich.
    en: Anna and Tom love each other.
    fa: آنا و تام همدیگر را دوست دارند.
  - de: Die Nachbarn besuchen sich oft.
    en: The neighbours often visit each other.
    fa: همسایه‌ها اغلب به دیدن همدیگر می‌روند.
  - de: Wir verstehen uns gut.
    en: We get on well.
    fa: ما با هم خوب کنار می‌آییم.
  - de: Frau Roth, Herr Lang, kennen Sie sich schon?
    en: Ms Roth, Mr Lang, do you already know each other?
    fa: خانم روت، آقای لانگ، شما همدیگر را می‌شناسید؟

mistakes:
  - wrong: Wir sehen sich morgen.
    right: Wir sehen uns morgen.
    why:
      en: "With *wir* the pronoun is *uns*. *Sich* is only for *sie* and *Sie*."
      fa: "با *wir* ضمیر *uns* می‌آید. *sich* فقط برای *sie* و *Sie* است."
      de: "Bei *wir* sagt man *uns*. *Sich* gibt es nur bei *sie* und *Sie*."
  - wrong: Wir treffen um acht.
    right: Wir treffen uns um acht.
    why:
      en: "English says “we meet”, but German needs the pronoun: *wir treffen uns*."
      fa: "*treffen* بی‌مفعول نمی‌آید؛ «همدیگر را می‌بینیم» می‌شود *wir treffen uns*."
      de: "*Treffen* braucht ein Objekt: *wir treffen uns*."
  - wrong: Kennt ihr sich?
    right: Kennt ihr euch?
    why:
      en: "With *ihr* the pronoun is *euch*."
      fa: "با *ihr* ضمیر *euch* می‌آید."
      de: "Bei *ihr* sagt man *euch*."
  - wrong: Kennen Sie Sich?
    right: Kennen Sie sich?
    why:
      en: "Only polite *Sie* has a capital letter. *Sich* is always small."
      fa: "فقط *Sie* رسمی با حرف بزرگ نوشته می‌شود. *sich* همیشه با حرف کوچک است."
      de: "Nur das höfliche *Sie* schreibt man groß. *Sich* schreibt man immer klein."

