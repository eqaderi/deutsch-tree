# Grammar list row 88.
id: grammar-088
kind: grammar
level: A1
chapter: a1-pronouns
order: 6
status: published
recogniseOnly: false
prerequisites: [grammar-082]
title:
  en: "Reciprocal *sich* / *uns*"
  fa: "*sich* و *uns* به معنای «همدیگر»"
  de: "*sich* / *uns* mit der Bedeutung „einander“"

explanations:
  en:
    rule: >
      With a plural subject, *uns*, *euch* and *sich* can mean "each other":
      *Wir sehen uns morgen.* (We'll see each other tomorrow.) The pronoun goes
      with the subject: *wir … uns*, *ihr … euch*, and *sie* or polite *Sie …
      sich*. *Uns* and *euch* are the *Akkusativ* forms you know; *sich* is new
      and always has a small letter, also with *Sie*. Common verbs are
      *sehen*, *treffen*, *kennen*, *lieben*, *besuchen* and *verstehen*.
      English often leaves "each other" out (*We meet at eight*), but German
      needs the pronoun: *Wir treffen uns um acht.*
  fa:
    rule: >
      وقتی فاعل جمع است، *uns*، *euch* و *sich* می‌توانند به معنای «همدیگر»
      باشند: *Wir sehen uns morgen.* (فردا همدیگر را می‌بینیم.) این ضمیر با
      فاعل جور می‌شود: *wir … uns*، *ihr … euch*، و برای *sie* جمع و *Sie*
      رسمی *sich*. *uns* و *euch* همان شکل‌های حالت *Akkusativ* هستند؛ *sich* تازه
      است و همیشه با حرف کوچک نوشته می‌شود، حتی با *Sie*. فعل‌های رایج در این
      کاربرد *sehen*، *treffen*، *kennen*، *lieben*، *besuchen* و *verstehen*
      هستند. در فارسی «همدیگر» برای همهٔ شخص‌ها یکی است، ولی در آلمانی ضمیر
      با فاعل عوض می‌شود. *treffen* هم بی‌مفعول نمی‌آید: «ساعت هشت همدیگر را
      می‌بینیم» می‌شود *Wir treffen uns um acht.*
  de:
    rule: >
      Bei einem Subjekt im Plural können *uns*, *euch* und *sich* „einander“
      heißen: *Wir sehen uns morgen.* Das Pronomen passt zum Subjekt: *wir …
      uns*, *ihr … euch*, *sie* und *Sie … sich*. *Sich* schreibt man immer
      klein, auch bei *Sie*. Oft sagt man das mit *sehen*, *treffen*,
      *kennen*, *lieben*, *besuchen* und *verstehen*: *Wir treffen uns um
      acht.*

# One arrow for "Anna sieht Tom", two for "Anna und Tom sehen sich": the
# pronoun means the seeing goes both ways. German only, so no labels.
