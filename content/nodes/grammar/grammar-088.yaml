table:
  columns:
    - { en: "*Nominativ*", fa: "حالت *Nominativ*", de: Nominativ }
    - { en: Each other, fa: همدیگر, de: einander }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [wir, uns, Wir sehen uns morgen.]
    - [ihr, euch, Kennt ihr euch schon?]
