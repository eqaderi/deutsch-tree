    answer: sich
    explanation:
      en: "*Anna und Tom* is plural *sie*, and the pronoun for “each other” is *sich*."
      fa: "*Anna und Tom* سوم‌شخص جمع است (*sie*) و ضمیرِ «همدیگر» *sich* است."
      de: "*Anna und Tom* ist *sie* (Plural). „Einander“ heißt *sich*."
  - id: gap-4
    type: gap-fill
    prompt: Frau Roth, Herr Lang, kennen Sie ___ schon?
    options: [sich, Sich, Ihnen]
    answer: sich
    explanation:
      en: "With polite *Sie* the pronoun is *sich*, with a small letter."
      fa: "با *Sie* رسمی ضمیر *sich* می‌آید، با حرف کوچک."
      de: "Bei *Sie* heißt es *sich*, klein geschrieben."
  - id: choice-1
    type: multiple-choice
    prompt: "Lisa und Paul sehen sich jeden Tag. Das heißt: …"
    options:
      - Lisa sieht Paul, und Paul sieht Lisa.
      - Lisa und Paul sehen andere Leute.
      - Lisa sieht Paul, aber Paul sieht Lisa nicht.
    answer: Lisa sieht Paul, und Paul sieht Lisa.
    explanation:
      en: "*Sich* here means “each other”: each one sees the other."
      fa: "*sich* در این‌جا یعنی «همدیگر»: هر کدام دیگری را می‌بیند."
      de: "*Sich* heißt hier „einander“: jeder sieht den anderen."
  - id: choice-2
    type: multiple-choice
    prompt: Meine Freundin und ich verstehen ___ gut.
    options: [uns, sich, wir]
    answer: uns
    explanation:
      en: "*Meine Freundin und ich* is *wir*, so the pronoun is *uns*."
      fa: "*Meine Freundin und ich* یعنی *wir* (ما)، پس ضمیر *uns* است."
      de: "*Meine Freundin und ich*, das ist *wir*. Darum: *uns*."
  - id: true-1
    type: true-false
    prompt: Wir sehen uns am Montag.
    answer: true
    explanation:
      en: "With *wir* the pronoun is *uns*. The sentence is correct."
      fa: "با *wir* ضمیر *uns* می‌آید. جمله درست است."
      de: "Bei *wir* sagt man *uns*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Wir kennen sich schon lange.
    answer: false
    explanation:
      en: "With *wir* the pronoun is *uns*: *Wir kennen uns schon lange.*"
      fa: "با *wir* ضمیر *uns* می‌آید: *Wir kennen uns schon lange.*"
      de: "Bei *wir* sagt man *uns*: *Wir kennen uns schon lange.*"
  - id: true-3
    type: true-false
    prompt: Kennt ihr euch?
    answer: true
    explanation:
      en: "With *ihr* the pronoun is *euch*. The sentence is correct."
      fa: "با *ihr* ضمیر *euch* می‌آید. جمله درست است."
      de: "Bei *ihr* sagt man *euch*. Der Satz ist richtig."
  - id: true-4
