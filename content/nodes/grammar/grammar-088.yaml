  - caption:
      en: >
        Above, *Anna sieht Tom*: one arrow, from Anna to Tom. Below, *Anna und
        Tom sehen sich*: two arrows, each sees the other. That is the meaning
        of *sich* here.
      fa: >
        بالا، *Anna sieht Tom*: یک پیکان، از آنا به تام. پایین، *Anna und Tom
        sehen sich*: دو پیکان، هر کدام دیگری را می‌بیند. معنای *sich* در این‌جا
        همین است.
      de: >
        Oben, *Anna sieht Tom*: ein Pfeil, von Anna zu Tom. Unten, *Anna und
        Tom sehen sich*: zwei Pfeile, jeder sieht den anderen. Das bedeutet
        *sich* hier.
