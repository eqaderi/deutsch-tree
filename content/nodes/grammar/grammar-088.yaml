    explanation:
      en: "“Each other” follows the subject: *wir … uns*, *ihr … euch*, *sie … sich*."
      fa: "ضمیرِ «همدیگر» با فاعل جور می‌شود: *wir … uns*، *ihr … euch*، *sie … sich*."
      de: "„Einander“ passt zum Subjekt: *wir … uns*, *ihr … euch*, *sie … sich*."

