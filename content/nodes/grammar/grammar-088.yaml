      fa: "با *ihr* ضمیر *euch* می‌آید: *Ihr seht euch morgen.*"
      de: "Bei *ihr* sagt man *euch*: *Ihr seht euch morgen.*"
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Ich sehe dich, und du siehst mich. Wir sehen ___.
