    answers: [euch, einander, euch gegenseitig]
    explanation:
      en: "Each knows the other, and with *ihr* that is *euch*."
      fa: "هر کدام دیگری را می‌شناسد و با *ihr* این ضمیر *euch* است."
      de: "Jeder kennt den anderen. Bei *ihr* sagt man *euch*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Sara liebt Ali, und Ali liebt Sara. Sie lieben ___.
    answers: [sich, einander, sich gegenseitig]
    explanation:
      en: "Each loves the other, and with plural *sie* that is *sich*."
      fa: "هر کدام دیگری را دوست دارد و با *sie* جمع این ضمیر *sich* است."
      de: "Jeder liebt den anderen. Bei *sie* (Plural) sagt man *sich*."
  - id: error-1
    type: find-error
    prompt: Wir sehen sich morgen im Büro.
    answer: sich
    explanation:
      en: "With *wir* the pronoun is *uns*: *Wir sehen uns morgen im Büro.*"
      fa: "با *wir* ضمیر *uns* می‌آید: *Wir sehen uns morgen im Büro.*"
      de: "Bei *wir* sagt man *uns*: *Wir sehen uns morgen im Büro.*"
  - id: error-2
    type: find-error
    prompt: Kennt ihr sich schon?
    answer: sich
    explanation:
      en: "With *ihr* the pronoun is *euch*: *Kennt ihr euch schon?*"
      fa: "با *ihr* ضمیر *euch* می‌آید: *Kennt ihr euch schon?*"
      de: "Bei *ihr* sagt man *euch*: *Kennt ihr euch schon?*"
  - id: error-3
    type: find-error
    prompt: Herr Lang und Frau Roth kennen Sich schon.
    answer: Sich
    explanation:
      en: "*Sich* is always written with a small letter: *kennen sich schon*."
      fa: "*sich* همیشه با حرف کوچک نوشته می‌شود: *kennen sich schon*."
      de: "*Sich* schreibt man immer klein: *kennen sich schon*."
  - id: order-1
    type: word-order
    answers:
      - [wir, sehen, uns, morgen]
      - [morgen, sehen, wir, uns]
    explanation:
      en: "The verb comes second, and *uns* follows the verb and the subject."
      fa: "فعل در جایگاه دوم می‌آید و *uns* پس از فعل و فاعل."
      de: "Das Verb steht an Position 2. *Uns* steht nach dem Verb und dem Subjekt."
  - id: match-1
    type: matching
    answer:
