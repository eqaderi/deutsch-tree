# Grammar list row 168.
id: grammar-168
kind: grammar
level: B1
chapter: b1-time-clauses
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-024, grammar-167]
title:
  en: "*nachdem*"
  fa: "*nachdem*"
  de: "*nachdem*"

explanations:
  en:
    rule: >
      *Nachdem* (after) starts a subordinate clause, so the conjugated verb
      goes to the end. What the *nachdem* clause says happened first and was
      finished before the main clause. That is why the *nachdem* clause goes
      one tense back. Main clause in the *Präteritum* or *Perfekt*:
      *nachdem* clause in the *Plusquamperfekt* (*hatte* or *war* + *Partizip
      II*): *Nachdem wir gegessen hatten, gingen wir spazieren.* Main clause
      in the *Präsens*: *nachdem* clause in the *Perfekt*: *Nachdem ich
      gegessen habe, gehe ich spazieren.* *Haben* or *sein* is chosen as in
      the *Perfekt*: *Nachdem er angekommen war, …* Before a noun, "after" is
      the preposition *nach* with the *Dativ* (*nach dem Essen*), and "after
      that" on its own is *danach*.
  fa:
    rule: >
      *nachdem* (پس از آن‌که) جملهٔ پیرو را آغاز می‌کند، پس فعل صرف‌شده به
      پایان جمله می‌رود. کاری که جملهٔ پیرو با *nachdem* می‌گوید اول رخ داده
      و پیش از کار جملهٔ پایه تمام شده است. برای همین زمان فعل در جملهٔ
      پیرو یک پله عقب‌تر می‌رود. اگر جملهٔ پایه در گذشتهٔ ساده
      (*Präteritum*) یا گذشتهٔ نقلی (*Perfekt*) باشد، جملهٔ پیرو در گذشتهٔ
      بعید (*Plusquamperfekt*) می‌آید، یعنی *hatte* یا *war* با صفت مفعولی:
      *Nachdem wir gegessen hatten, gingen wir spazieren.* اگر جملهٔ پایه در
      زمان حال (*Präsens*) باشد، جملهٔ پیرو در گذشتهٔ نقلی می‌آید: *Nachdem
      ich gegessen habe, gehe ich spazieren.* انتخاب *haben* یا *sein* مانند
      گذشتهٔ نقلی است: *Nachdem er angekommen war, …* پیش از اسم، «پس از»
      حرف اضافهٔ *nach* با حالت *Dativ* است (*nach dem Essen*) و «پس از آن»
      به‌تنهایی *danach* است.
  de:
    rule: >
      Mit *nachdem* beginnt ein Nebensatz. Das konjugierte Verb steht am
      Ende. Was im *nachdem*-Satz steht, ist zuerst passiert und war schon
      fertig. Darum geht der *nachdem*-Satz eine Zeitform zurück. Steht der
      Hauptsatz im Präteritum oder Perfekt, steht der *nachdem*-Satz im
      Plusquamperfekt (*hatte* oder *war* + Partizip II): *Nachdem wir
      gegessen hatten, gingen wir spazieren.* Steht der Hauptsatz im Präsens,
      steht der *nachdem*-Satz im Perfekt: *Nachdem ich gegessen habe, gehe
      ich spazieren.* *Haben* oder *sein* wählt man wie im Perfekt: *Nachdem
      er angekommen war, …* Vor einem Nomen sagt man *nach* mit Dativ (*nach
      dem Essen*), und allein sagt man *danach*.

table:
  columns:
    - { en: "*Nachdem* clause: earlier", fa: "جملهٔ پیرو با *nachdem*: زودتر", de: "*Nachdem*-Satz: früher" }
    - { en: "Main clause: later", fa: "جملهٔ پایه: بعدتر", de: "Hauptsatz: später" }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [Plusquamperfekt, Präteritum, "Nachdem wir gegessen hatten, gingen wir spazieren."]
    - [Plusquamperfekt, Perfekt, "Nachdem er angekommen war, hat er mich angerufen."]
    - [Perfekt, Präsens, "Nachdem ich gegessen habe, gehe ich spazieren."]
    - [Perfekt, Präsens, "Nachdem die Kinder eingeschlafen sind, sehen wir fern."]

# Two rows. In each, the earlier action (the nachdem clause) on the left, an
# arrow, and the later one (the main clause) on the right, with the tense of
# each underneath. Top: in the past; bottom: in the present.
diagrams:
  - caption:
      en: >
        First the *nachdem* clause, then the main clause. In the past the
        *nachdem* clause is in the *Plusquamperfekt* and the main clause in
        the *Präteritum*. In the present the *nachdem* clause is in the
        *Perfekt* and the main clause in the *Präsens*.
      fa: >
        اول جملهٔ پیرو با *nachdem* و سپس جملهٔ پایه. در گذشته جملهٔ پیرو در
        گذشتهٔ بعید (*Plusquamperfekt*) است و جملهٔ پایه در گذشتهٔ ساده
        (*Präteritum*). در زمان حال جملهٔ پیرو در گذشتهٔ نقلی (*Perfekt*) است
        و جملهٔ پایه در زمان حال (*Präsens*).
      de: >
        Zuerst der *nachdem*-Satz, dann der Hauptsatz. In der Vergangenheit
        steht der *nachdem*-Satz im Plusquamperfekt und der Hauptsatz im
        Präteritum. In der Gegenwart steht der *nachdem*-Satz im Perfekt und
        der Hauptsatz im Präsens.
    labels:
      first: { en: first, fa: اول, de: zuerst }
      then: { en: then, fa: سپس, de: danach }
