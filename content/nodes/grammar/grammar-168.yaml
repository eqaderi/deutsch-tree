examples:
  - de: Nachdem wir gegessen hatten, gingen wir spazieren.
    en: After we had eaten, we went for a walk.
    fa: پس از آن‌که غذا خوردیم، به پیاده‌روی رفتیم.
  - de: Nachdem Lea geduscht hatte, frühstückte sie.
    en: After Lea had showered, she had breakfast.
    fa: لئا پس از آن‌که دوش گرفت، صبحانه خورد.
  - de: Nachdem er angekommen war, hat er mich sofort angerufen.
    en: After he had arrived, he called me straight away.
    fa: پس از آن‌که رسید، فوراً به من زنگ زد.
  - de: Wir haben ein Taxi genommen, nachdem wir den letzten Bus verpasst hatten.
    en: We took a taxi after we had missed the last bus.
    fa: پس از آن‌که آخرین اتوبوس را از دست دادیم، تاکسی گرفتیم.
  - de: Nachdem ich gefrühstückt habe, gehe ich zur Arbeit.
    en: After I've had breakfast, I go to work.
    fa: پس از آن‌که صبحانه خوردم، سر کار می‌روم.
  - de: Nachdem du die Prüfung bestanden hast, kannst du dich ausruhen.
    en: Once you've passed the exam, you can have a rest.
    fa: پس از آن‌که در امتحان قبول شدی، می‌توانی استراحت کنی.
  - de: Nach dem Essen gingen wir spazieren.
    en: After the meal we went for a walk.
    fa: پس از غذا به پیاده‌روی رفتیم.
  - de: Wir haben eingekauft. Danach haben wir zusammen gekocht.
    en: We did the shopping. After that we cooked together.
    fa: خرید کردیم. پس از آن با هم آشپزی کردیم.

mistakes:
  - wrong: Nachdem ich aß, ging ich spazieren.
    right: Nachdem ich gegessen hatte, ging ich spazieren.
    why:
      en: "The main clause is in the *Präteritum*, so the *nachdem* clause goes one step back, to the *Plusquamperfekt*: *gegessen hatte*."
      fa: "جملهٔ پایه در گذشتهٔ ساده است، پس جملهٔ پیرو با *nachdem* یک پله عقب‌تر، در گذشتهٔ بعید، می‌آید: *gegessen hatte*."
      de: "Der Hauptsatz steht im Präteritum. Darum geht der *nachdem*-Satz eine Zeitform zurück, ins Plusquamperfekt: *gegessen hatte*."
  - wrong: Nachdem ich gegessen hatte, gehe ich spazieren.
    right: Nachdem ich gegessen habe, gehe ich spazieren.
    why:
      en: "The main clause is in the *Präsens*, so the *nachdem* clause is in the *Perfekt*: *gegessen habe*."
      fa: "جملهٔ پایه در زمان حال است، پس جملهٔ پیرو با *nachdem* در گذشتهٔ نقلی می‌آید: *gegessen habe*."
      de: "Der Hauptsatz steht im Präsens. Darum steht der *nachdem*-Satz im Perfekt: *gegessen habe*."
  - wrong: Nachdem sie angekommen hatte, rief sie an.
    right: Nachdem sie angekommen war, rief sie an.
    why:
      en: "*Ankommen* forms its *Perfekt* with *sein*, so its *Plusquamperfekt* is with *war*."
      fa: "گذشتهٔ نقلی *ankommen* با *sein* ساخته می‌شود، پس گذشتهٔ بعید آن با *war* است."
      de: "*Ankommen* bildet das Perfekt mit *sein*. Darum steht im Plusquamperfekt *war*."
  - wrong: Nachdem wir hatten gegessen, gingen wir spazieren.
    right: Nachdem wir gegessen hatten, gingen wir spazieren.
    why:
      en: "In the *nachdem* clause the conjugated verb *hatten* goes to the very end, after the *Partizip II*."
      fa: "در جملهٔ پیرو با *nachdem* فعل صرف‌شدهٔ *hatten* پس از صفت مفعولی و در آخر جمله می‌آید."
      de: "Im *nachdem*-Satz steht das konjugierte Verb *hatten* ganz am Ende, nach dem Partizip II."
  - wrong: Nachdem dem Kurs gehen wir essen.
    right: Nach dem Kurs gehen wir essen.
    why:
      en: "Before a noun it is the preposition *nach*: *nach dem Kurs*. *Nachdem* starts a clause."
      fa: "پیش از اسم حرف اضافهٔ *nach* می‌آید: *nach dem Kurs*. *nachdem* جملهٔ پیرو را آغاز می‌کند."
      de: "Vor einem Nomen steht die Präposition *nach*: *nach dem Kurs*. Mit *nachdem* beginnt ein Nebensatz."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Nachdem wir gegessen ___, gingen wir spazieren.
    options: [haben, sind, hatten]
    answer: hatten
    explanation:
      en: "Main clause in the *Präteritum* (*gingen*), so the *Plusquamperfekt*: *gegessen hatten*."
      fa: "جملهٔ پایه در گذشتهٔ ساده است (*gingen*)، پس گذشتهٔ بعید می‌آید: *gegessen hatten*."
      de: "Der Hauptsatz steht im Präteritum (*gingen*). Darum Plusquamperfekt: *gegessen hatten*."
  - id: gap-2
    type: gap-fill
    prompt: Nachdem ich gefrühstückt ___, gehe ich zur Arbeit.
    options: [habe, hatte, bin]
    answer: habe
    explanation:
      en: "Main clause in the *Präsens* (*gehe*), so the *Perfekt*: *gefrühstückt habe*."
      fa: "جملهٔ پایه در زمان حال است (*gehe*)، پس گذشتهٔ نقلی می‌آید: *gefrühstückt habe*."
      de: "Der Hauptsatz steht im Präsens (*gehe*). Darum Perfekt: *gefrühstückt habe*."
  - id: gap-3
    type: gap-fill
    prompt: Nachdem der Zug abgefahren ___, gingen wir nach Hause.
    options: [hatte, war, ist]
    answer: war
    explanation:
      en: "*Abfahren* takes *sein*, and the main clause is in the *Präteritum*: *abgefahren war*."
      fa: "*abfahren* با *sein* می‌آید و جملهٔ پایه در گذشتهٔ ساده است: *abgefahren war*."
      de: "*Abfahren* bildet das Perfekt mit *sein*, der Hauptsatz steht im Präteritum: *abgefahren war*."
  - id: gap-4
    type: gap-fill
    prompt: ___ dem Kurs gehen wir essen.
    options: [Nachdem, Danach, Nach]
    answer: Nach
    explanation:
      en: "A noun follows, *dem Kurs*, so the preposition *nach*."
      fa: "پس از جای خالی اسم می‌آید (*dem Kurs*)، پس حرف اضافهٔ *nach*."
      de: "Danach kommt ein Nomen, *dem Kurs*. Darum die Präposition *nach*."
  - id: gap-5
    type: gap-fill
    prompt: Wir haben eingekauft. ___ haben wir gekocht.
    options: [Nachdem, Danach, Nach]
    answer: Danach
    explanation:
      en: "No clause and no noun follows; the verb *haben* comes right after the gap. So *danach*, \"after that\"."
      fa: "پس از جای خالی نه جملهٔ پیرو می‌آید و نه اسم، بلکه بی‌درنگ فعل *haben*. پس *danach* یعنی «پس از آن»."
      de: "Danach kommt kein Nebensatz und kein Nomen, sondern sofort das Verb *haben*. Darum *danach*."
  - id: choice-1
    type: multiple-choice
    prompt: Nachdem sie die Prüfung bestanden hatte, …
    options: [sie feierte mit Freunden., feiert sie mit Freunden., feierte sie mit Freunden.]
    answer: feierte sie mit Freunden.
    explanation:
      en: "*Plusquamperfekt* in the *nachdem* clause goes with the *Präteritum*, and the main clause starts with its verb: *feierte sie*."
      fa: "گذشتهٔ بعید در جملهٔ پیرو با گذشتهٔ ساده در جملهٔ پایه می‌آید و جملهٔ پایه با فعلش آغاز می‌شود: *feierte sie*."
      de: "Zum Plusquamperfekt im *nachdem*-Satz passt das Präteritum. Der Hauptsatz beginnt mit dem Verb: *feierte sie*."
  - id: choice-2
    type: multiple-choice
    prompt: "Nachdem ich die E-Mail gelesen hatte, rief ich Tom an. Was war zuerst?"
    options: [Ich las die E-Mail., Ich rief Tom an., Beides war zur gleichen Zeit.]
    answer: Ich las die E-Mail.
    explanation:
      en: "What the *nachdem* clause says happened first: first the e-mail, then the call."
      fa: "کار جملهٔ پیرو با *nachdem* اول رخ داده است: اول ایمیل، سپس تماس."
      de: "Was im *nachdem*-Satz steht, war zuerst: erst die E-Mail, dann der Anruf."
  - id: choice-3
    type: multiple-choice
    prompt: Ich rufe dich an, …
    options: [nachdem ich angekommen war., nachdem ich bin angekommen., nachdem ich angekommen bin.]
    answer: nachdem ich angekommen bin.
    explanation:
      en: "Main clause in the *Präsens*, so the *Perfekt*, with *bin* at the very end."
      fa: "جملهٔ پایه در زمان حال است، پس گذشتهٔ نقلی می‌آید و *bin* در آخر جمله."
      de: "Der Hauptsatz steht im Präsens. Darum Perfekt, und *bin* steht ganz am Ende."
  - id: true-1
    type: true-false
    prompt: Nachdem er die Tür abgeschlossen hatte, ging er zur Arbeit.
    answer: true
    explanation:
      en: "*Plusquamperfekt* in the *nachdem* clause, *Präteritum* in the main clause. The sentence is correct."
      fa: "گذشتهٔ بعید در جملهٔ پیرو و گذشتهٔ ساده در جملهٔ پایه. جمله درست است."
      de: "Plusquamperfekt im *nachdem*-Satz, Präteritum im Hauptsatz. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Nachdem ich aß, ging ich ins Bett.
    answer: false
    explanation:
      en: "The *nachdem* clause goes one tense back: *Nachdem ich gegessen hatte, …*"
      fa: "زمان جملهٔ پیرو با *nachdem* یک پله عقب‌تر می‌رود: *Nachdem ich gegessen hatte, …*"
      de: "Der *nachdem*-Satz geht eine Zeitform zurück: *Nachdem ich gegessen hatte, …*"
  - id: true-3
    type: true-false
    prompt: Nachdem du die Prüfung bestanden hast, kannst du dich ausruhen.
    answer: true
    explanation:
      en: "*Perfekt* in the *nachdem* clause, *Präsens* in the main clause. The sentence is correct."
      fa: "گذشتهٔ نقلی در جملهٔ پیرو و زمان حال در جملهٔ پایه. جمله درست است."
      de: "Perfekt im *nachdem*-Satz, Präsens im Hauptsatz. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Nachdem sie nach Hause gekommen hatte, kochte sie.
    answer: false
    explanation:
      en: "*Kommen* takes *sein*: *Nachdem sie nach Hause gekommen war, …*"
      fa: "*kommen* با *sein* می‌آید: *Nachdem sie nach Hause gekommen war, …*"
      de: "*Kommen* bildet das Perfekt mit *sein*: *Nachdem sie nach Hause gekommen war, …*"
  - id: true-5
    type: true-false
    prompt: Nachdem wir gegessen hatten, wir gingen spazieren.
    answer: false
    explanation:
      en: "After the *nachdem* clause the verb comes first: *…, gingen wir spazieren.*"
      fa: "پس از جملهٔ پیرو با *nachdem* فعل اول می‌آید: *…, gingen wir spazieren.*"
      de: "Nach dem *nachdem*-Satz kommt zuerst das Verb: *…, gingen wir spazieren.*"
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Nachdem wir den Film gesehen ___ (haben), gingen wir essen.
    answers: [hatten]
    explanation:
      en: "Main clause in the *Präteritum*, so the *Plusquamperfekt*: *gesehen hatten*."
      fa: "جملهٔ پایه در گذشتهٔ ساده است، پس گذشتهٔ بعید می‌آید: *gesehen hatten*."
      de: "Der Hauptsatz steht im Präteritum. Darum Plusquamperfekt: *gesehen hatten*."
