      fa: "جملهٔ پایه در گذشتهٔ ساده است، پس گذشتهٔ بعید با *sein* می‌آید: *angekommen war*."
      de: "Der Hauptsatz steht im Präteritum. Darum Plusquamperfekt mit *sein*: *angekommen war*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Nachdem ich die Hausaufgaben gemacht ___ (haben), gehe ich zum Training.
