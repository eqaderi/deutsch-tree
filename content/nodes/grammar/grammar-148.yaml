    explanation:
      en: "*Wasser* has no article, so *kein*, and *mehr* comes after the noun."
      fa: "*Wasser* حرف تعریف ندارد، پس *kein* می‌گیرد و *mehr* پس از اسم می‌آید."
      de: "*Wasser* steht ohne Artikel. Darum *kein*, und *mehr* steht nach dem Nomen."
