# Grammar list row 148.
id: grammar-148
kind: grammar
level: A1
chapter: a1-negation
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-146, grammar-147]
title:
  en: "*kein … mehr*, *nicht mehr*, *nichts*, *nie*"
  fa: "*kein … mehr*، *nicht mehr*، *nichts*، *nie*"
  de: "*kein … mehr*, *nicht mehr*, *nichts*, *nie*"

explanations:
  en:
    rule: >
      *Kein … mehr* and *nicht mehr* say that something has stopped or is used
      up: *Ich habe kein Geld mehr.* (no more money), *Er wohnt nicht mehr
      hier.* (not any more). *Mehr* comes right after the noun with *kein*, and
      right after *nicht*. *Nichts* means "not anything" (*Ich sehe nichts.*)
      and *nie* means "not ever" (*Sie ist nie krank.*). A German sentence has
      only one negation word: *Er sagt nie etwas*, not *nie nichts*.
  fa:
    rule: >
      *kein … mehr* و *nicht mehr* نشان می‌دهند که کاری دیگر انجام نمی‌شود یا
      چیزی تمام شده است: *Ich habe kein Geld mehr.* (دیگر پول ندارم)، *Er wohnt
      nicht mehr hier.* (دیگر این‌جا زندگی نمی‌کند). *mehr* با *kein* درست پس
      از اسم می‌آید و با *nicht* درست پس از *nicht*. *nichts* یعنی «هیچ‌چیز»
      (*Ich sehe nichts.*) و *nie* یعنی «هیچ‌وقت» (*Sie ist nie krank.*). در
      فارسی «هیچ» با فعل منفی می‌آید («هیچ‌وقت چیزی نمی‌گوید»)، ولی جملهٔ
      آلمانی فقط یک واژهٔ نفی دارد: *Er sagt nie etwas*، نه *nie nichts*.
  de:
    rule: >
      *Kein … mehr* und *nicht mehr* sagen: Etwas ist zu Ende oder alle. *Ich
      habe kein Geld mehr.* *Er wohnt nicht mehr hier.* Mit *kein* steht *mehr*
      direkt nach dem Nomen, mit *nicht* direkt nach *nicht*. *Nichts* ist das
      Gegenteil von *etwas* (*Ich sehe nichts.*), *nie* ist das Gegenteil von
      *immer* (*Sie ist nie krank.*). Ein deutscher Satz hat nur ein Wort für
      die Verneinung: *Er sagt nie etwas*, nicht *nie nichts*.

table:
  columns:
    - { en: Word, fa: واژه, de: Wort }
    - { en: Positive, fa: جملهٔ مثبت, de: Ohne Verneinung }
    - { en: Negative, fa: جملهٔ منفی, de: Mit Verneinung }
  rows:
    - [kein … mehr, Ich habe noch Geld., Ich habe kein Geld mehr.]
    - [nicht mehr, Er wohnt noch hier., Er wohnt nicht mehr hier.]
    - [nichts, Ich sehe etwas., Ich sehe nichts.]
    - [nie, Er kommt immer pünktlich., Er kommt nie pünktlich.]

examples:
  - de: Wir haben keine Eier mehr.
    en: We have no more eggs.
    fa: دیگر تخم‌مرغ نداریم.
  - de: Ich habe keine Zeit mehr.
    en: I have no time left.
    fa: دیگر وقت ندارم.
  - de: Mein Opa arbeitet nicht mehr.
    en: My grandpa doesn't work any more.
    fa: پدربزرگم دیگر کار نمی‌کند.
  - de: Anna wohnt nicht mehr in Hamburg.
    en: Anna doesn't live in Hamburg any more.
    fa: آنا دیگر در هامبورگ زندگی نمی‌کند.
  - de: Im Kühlschrank ist nichts.
    en: There is nothing in the fridge.
    fa: در یخچال هیچ‌چیز نیست.
  - de: Das Kind isst heute nichts.
    en: The child isn't eating anything today.
    fa: بچه امروز هیچ‌چیز نمی‌خورد.
  - de: Er hat nie Zeit.
    en: He never has time.
    fa: او هیچ‌وقت وقت ندارد.
  - de: Ich trinke nie Kaffee.
    en: I never drink coffee.
    fa: من هیچ‌وقت قهوه نمی‌نوشم.

mistakes:
  - wrong: Ich habe nicht Geld mehr.
    right: Ich habe kein Geld mehr.
    why:
      en: "*Geld* has no article, so it takes *kein*, also with *mehr*."
      fa: "*Geld* حرف تعریف ندارد، پس با *mehr* هم *kein* می‌گیرد."
      de: "*Geld* steht ohne Artikel. Darum *kein*, auch mit *mehr*."
  - wrong: Ich habe kein mehr Geld.
    right: Ich habe kein Geld mehr.
    why:
      en: "*Mehr* comes after the noun: *kein Geld mehr*."
      fa: "*mehr* پس از اسم می‌آید: *kein Geld mehr*."
      de: "*Mehr* steht nach dem Nomen: *kein Geld mehr*."
  - wrong: Mein Vater raucht kein mehr.
    right: Mein Vater raucht nicht mehr.
    why:
      en: "There is no noun to negate, only the verb, so it is *nicht mehr*."
      fa: "این‌جا اسمی نیست که منفی شود، فقط فعل؛ پس *nicht mehr* درست است."
      de: "Hier gibt es kein Nomen, nur das Verb. Darum *nicht mehr*."
  - wrong: Er sagt nie nichts.
    right: Er sagt nie etwas.
    why:
      en: "Only one negation word: with *nie*, *nichts* becomes *etwas*."
      fa: "جمله فقط یک واژهٔ نفی دارد: با *nie*، به جای *nichts* واژهٔ *etwas* می‌آید."
      de: "Nur ein Wort für die Verneinung: Mit *nie* sagt man *etwas*, nicht *nichts*."
  - wrong: Ich verstehe nicht etwas.
    right: Ich verstehe nichts.
    why:
      en: "*Nicht* and *etwas* together become *nichts*."
      fa: "*nicht* و *etwas* با هم می‌شوند *nichts*."
      de: "*Nicht* und *etwas* zusammen werden zu *nichts*."

