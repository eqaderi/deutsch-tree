    prompt: Er wohnt jetzt in Köln. Er wohnt ___ in Berlin.
    options: [nicht mehr, kein mehr, nichts mehr]
    answer: nicht mehr
    explanation:
      en: "He lived in Berlin before and has stopped: *nicht mehr* before the place."
      fa: "او پیش‌تر در برلین زندگی می‌کرد و حالا نه: *nicht mehr* پیش از مکان می‌آید."
      de: "Früher war er in Berlin, jetzt nicht: *nicht mehr* vor dem Ort."
