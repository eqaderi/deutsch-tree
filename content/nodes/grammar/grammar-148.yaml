    explanation:
      en: "In a yes/no question the verb comes first. *Mehr* comes after the noun."
      fa: "در پرسش بله و خیر، فعل در آغاز می‌آید. *mehr* پس از اسم است."
      de: "In einer Ja/Nein-Frage steht das Verb am Anfang. *Mehr* steht nach dem Nomen."
  - id: order-2
