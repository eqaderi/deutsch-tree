title:
  en: "*Genus* and definite article"
  fa: "جنس دستوری (*Genus*) و حرف تعریف معین"
  de: "Genus und bestimmter Artikel"

explanations:
  en:
    rule: >
      Every German noun has a grammatical gender (*Genus*): masculine,
      feminine or neuter. The definite article shows it: *der* for a masculine
      noun, *die* for a feminine one and *das* for a neuter one. In the plural
      every noun takes *die*. The gender belongs to the word, not to the
      thing: a table is masculine (*der Tisch*), and a girl is neuter (*das
      Mädchen*). So learn every noun together with its article. A noun always
      begins with a capital letter.
  fa:
    rule: >
      هر اسم آلمانی جنس دستوری (*Genus*) دارد: مذکر، مؤنث یا خنثی. حرف تعریف
      معین این جنس را نشان می‌دهد: *der* برای اسم مذکر، *die* برای اسم مؤنث و
      *das* برای اسم خنثی. در جمع، همهٔ اسم‌ها *die* می‌گیرند. جنس دستوری به
      خود واژه بستگی دارد، نه به معنای آن: میز مذکر است (*der Tisch*) و دختر
      خنثی (*das Mädchen*). فارسی جنس دستوری ندارد، پس هر اسم را همراه حرف
      تعریفش یاد بگیرید. اسم در آلمانی همیشه با حرف بزرگ آغاز می‌شود.
  de:
    rule: >
      Jedes Nomen hat ein Genus: maskulin, feminin oder neutral. Der bestimmte
      Artikel zeigt das Genus: *der* ist maskulin, *die* ist feminin, *das*
      ist neutral. Im Plural haben alle Nomen *die*. Das Genus gehört zum
      Wort, nicht zur Sache: *der Tisch*, *das Mädchen*. Lernen Sie jedes
      Nomen mit dem Artikel. Nomen schreibt man immer groß.

table:
  columns:
    - { en: Gender, fa: جنس دستوری, de: Genus }
    - { en: Article, fa: حرف تعریف, de: Artikel }
    - { en: Examples, fa: مثال, de: Beispiele }
  rows:
    - [maskulin, der, "der Apfel, der Tisch, der Mann"]
    - [feminin, die, "die Sonne, die Lampe, die Frau"]
    - [neutral, das, "das Kind, das Buch, das Mädchen"]
    - [Plural, die, "die Äpfel, die Lampen, die Kinder"]

examples:
  - de: Der Apfel ist rot.
    en: The apple is red.
    fa: سیب قرمز است.
  - de: Die Sonne scheint.
    en: The sun is shining.
    fa: خورشید می‌تابد.
  - de: Das Kind spielt.
    en: The child is playing.
    fa: بچه بازی می‌کند.
  - de: Der Tisch ist neu.
    en: The table is new.
    fa: میز نو است.
  - de: Das Mädchen heißt Lena.
    en: The girl is called Lena.
    fa: اسم آن دختر لنا است.
  - de: Die Frau kommt aus Wien.
    en: The woman comes from Vienna.
    fa: آن زن اهل وین است.
  - de: Wo ist die Tasche?
    en: Where is the bag?
    fa: کیف کجاست؟
  - de: Die Kinder lernen Deutsch.
    en: The children are learning German.
    fa: بچه‌ها آلمانی یاد می‌گیرند.

mistakes:
  - wrong: Die Tisch ist groß.
    right: Der Tisch ist groß.
    why:
      en: "*Tisch* is masculine: *der Tisch*. A thing has a gender too."
      fa: "*Tisch* اسم مذکر است: *der Tisch*. اشیا هم جنس دستوری دارند."
      de: "*Tisch* ist maskulin: *der Tisch*. Auch Sachen haben ein Genus."
  - wrong: Der Mädchen ist zehn Jahre alt.
    right: Das Mädchen ist zehn Jahre alt.
    why:
      en: "*Mädchen* is neuter: *das Mädchen*. The gender of the word is not the sex of the person."
      fa: "*Mädchen* اسم خنثی است: *das Mädchen*. جنس دستوری واژه با جنسیت آدم یکی نیست."
      de: "*Mädchen* ist neutral: *das Mädchen*. Das Genus ist nicht immer Mann oder Frau."
  - wrong: Der Lampen sind neu.
    right: Die Lampen sind neu.
    why:
      en: "In the plural every noun takes *die*."
      fa: "در جمع، همهٔ اسم‌ها *die* می‌گیرند."
      de: "Im Plural haben alle Nomen *die*."
  - wrong: Das kind spielt.
    right: Das Kind spielt.
    why:
      en: "A German noun always begins with a capital letter."
      fa: "اسم آلمانی همیشه با حرف بزرگ آغاز می‌شود."
      de: "Ein Nomen schreibt man immer groß."

