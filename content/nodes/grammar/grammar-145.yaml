# Grammar list row 145.
id: grammar-145
kind: grammar
level: A1
chapter: a1-building-sentences
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-062, grammar-064, grammar-121]
title:
  en: "Verb complements"
  fa: "متمم‌های فعل"
  de: "Verben und ihre Ergänzungen"

explanations:
  en:
    rule: >
      The verb decides what else a sentence needs. Some verbs need only a
      subject: *Das Baby schläft.* Many need an object in the *Akkusativ*:
      *Ich suche meinen Schlüssel.* A dictionary calls the first kind
      intransitive and the second transitive. Some verbs need a person in the
      *Dativ*: *Ich helfe meiner Mutter.* A *Dativ* without a preposition is
      normally a person. *Geben* takes both, the person in the *Dativ* and the
      thing in the *Akkusativ*: *Ich gebe dem Kind einen Apfel.* *Wohnen*
      needs a place: *Wir wohnen in der Heinestraße 7.* *Sein* takes a second
      *Nominativ* or an adjective: *Das ist mein Bruder.* *Er ist müde.* The
      subject is always in the *Nominativ*. Learn each verb with what it needs.
  fa:
    rule: >
      فعل تعیین می‌کند که جمله به چه بخش‌های دیگری نیاز دارد؛ به این بخش‌ها
      متمم‌های فعل می‌گویند. برخی فعل‌ها فقط فاعل لازم دارند: *Das Baby
      schläft.* بسیاری از فعل‌ها مفعولی در حالت *Akkusativ* (حالت مفعولی)
      می‌خواهند: *Ich suche meinen Schlüssel.* در فرهنگ لغت، نوع اول را فعل
      لازم و نوع دوم را فعل متعدی می‌نامند. برخی فعل‌ها شخصی را در حالت
      *Dativ* (حالت مفعول باواسطه) می‌خواهند: *Ich helfe meiner Mutter.* حالت
      *Dativ* بدون حرف اضافه معمولاً یک شخص است، مانند «به مادرم» در «به مادرم
      کمک می‌کنم». *geben* هر دو را می‌گیرد: شخص در حالت *Dativ* و چیز در
      حالت *Akkusativ*: *Ich gebe dem Kind einen Apfel.* *wohnen* به مکان
      نیاز دارد: *Wir wohnen in der Heinestraße 7.* پس از *sein* اسمی دیگر در
      حالت *Nominativ* (حالت فاعلی) یا یک صفت می‌آید: *Das ist mein Bruder.*
      *Er ist müde.* فاعل همیشه در حالت *Nominativ* است. هر فعل را همراه با
      متمم‌هایش یاد بگیرید.
  de:
    rule: >
      Das Verb sagt, was ein Satz noch braucht. Manche Verben brauchen nur ein
      Subjekt: *Das Baby schläft.* Viele Verben brauchen ein Objekt im
      Akkusativ: *Ich suche meinen Schlüssel.* Im Wörterbuch heißen sie
      intransitiv und transitiv. Manche Verben brauchen eine Person im Dativ:
      *Ich helfe meiner Mutter.* Ein Dativ ohne Präposition ist meistens eine
      Person. *Geben* hat beides, die Person im Dativ und die Sache im
      Akkusativ: *Ich gebe dem Kind einen Apfel.* *Wohnen* braucht einen Ort:
      *Wir wohnen in der Heinestraße 7.* Nach *sein* steht noch ein Nominativ
      oder ein Adjektiv: *Das ist mein Bruder.* *Er ist müde.* Das Subjekt
      steht immer im Nominativ. Lernen Sie jedes Verb mit seinen Ergänzungen.

table:
  columns:
    - { en: Verb, fa: فعل, de: Verb }
    - { en: What it needs, fa: متمم, de: Ergänzung }
    - { en: Example, fa: مثال, de: Beispiel }
  rows:
    - [schlafen, –, Das Baby schläft.]
    - [suchen, Akkusativ, Ich suche meinen Schlüssel.]
    - [kaufen, Akkusativ, Wir kaufen einen Tisch.]
    - [helfen, Dativ, Ich helfe meiner Mutter.]
    - [gehören, Dativ, Das Fahrrad gehört dem Lehrer.]
    - [geben, Dativ + Akkusativ, Ich gebe dem Kind einen Apfel.]
    - [wohnen, Ort, Wir wohnen in der Heinestraße 7.]
    - [sein, Nominativ / Adjektiv, Das ist mein Bruder. Er ist müde.]

