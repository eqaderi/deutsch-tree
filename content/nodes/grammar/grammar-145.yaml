examples:
  - de: Das Baby schläft.
    en: The baby is sleeping.
    fa: بچه خوابیده است.
  - de: Ich suche meinen Schlüssel.
    en: I'm looking for my key.
    fa: دنبال کلیدم می‌گردم.
  - de: Wir kaufen einen Tisch.
    en: We are buying a table.
    fa: یک میز می‌خریم.
  - de: Ich helfe meiner Mutter.
    en: I help my mother.
    fa: به مادرم کمک می‌کنم.
  - de: Das Fahrrad gehört dem Lehrer.
    en: The bike belongs to the teacher.
    fa: دوچرخه مال معلم است.
  - de: Ich gebe dem Kind einen Apfel.
    en: I give the child an apple.
    fa: به بچه یک سیب می‌دهم.
  - de: Wir wohnen in der Heinestraße 7.
    en: We live at Heinestraße 7.
    fa: ما در خیابان هاینه، پلاک ۷ زندگی می‌کنیم.
  - de: Das ist mein Bruder.
    en: This is my brother.
    fa: این برادر من است.
  - de: Er ist müde.
    en: He is tired.
    fa: او خسته است.

mistakes:
  - wrong: Ich helfe meine Mutter.
    right: Ich helfe meiner Mutter.
    why:
      en: "*Helfen* takes the person in the *Dativ*: *meine Mutter* becomes *meiner Mutter*."
      fa: "*helfen* شخص را در حالت *Dativ* می‌گیرد: *meine Mutter* می‌شود *meiner Mutter*."
      de: "*Helfen* hat die Person im Dativ: *meine Mutter* wird zu *meiner Mutter*."
  - wrong: Ich suche mein Schlüssel.
    right: Ich suche meinen Schlüssel.
    why:
      en: "*Suchen* takes an *Akkusativ*, and *der Schlüssel* is masculine: *meinen Schlüssel*."
      fa: "*suchen* مفعولی در حالت *Akkusativ* می‌خواهد و *Schlüssel* اسم مذکر (*der*) است: *meinen Schlüssel*."
      de: "*Suchen* hat ein Objekt im Akkusativ. *Schlüssel* ist maskulin: *meinen Schlüssel*."
  - wrong: Wir wohnen Berlin.
    right: Wir wohnen in Berlin.
    why:
      en: "*Wohnen* needs a place, and a place needs its preposition: *in Berlin*."
      fa: "*wohnen* به مکان نیاز دارد و مکان با حرف اضافه می‌آید: *in Berlin*."
      de: "*Wohnen* braucht einen Ort. Der Ort hat eine Präposition: *in Berlin*."
  - wrong: Ich gebe den Kind einen Apfel.
    right: Ich gebe dem Kind einen Apfel.
    why:
      en: "The person who gets something is in the *Dativ*: *das Kind* becomes *dem Kind*."
      fa: "کسی که چیزی می‌گیرد در حالت *Dativ* می‌آید: *das Kind* می‌شود *dem Kind*."
      de: "Die Person, die etwas bekommt, steht im Dativ: *das Kind* wird zu *dem Kind*."

questions:
  - id: gap-1
    type: gap-fill
    prompt: Ich helfe ___ Mutter.
    options: [meiner, meine, meinen]
    answer: meiner
    explanation:
      en: "*Helfen* takes the *Dativ*; *meine Mutter* in the *Dativ* is *meiner Mutter*."
      fa: "*helfen* با حالت *Dativ* می‌آید؛ *meine Mutter* در حالت *Dativ* می‌شود *meiner Mutter*."
      de: "*Helfen* hat den Dativ. *Meine Mutter* im Dativ: *meiner Mutter*."
  - id: gap-2
    type: gap-fill
    prompt: Ich suche ___ Schlüssel.
    options: [meinen, meinem, mein]
    answer: meinen
    explanation:
      en: "*Suchen* takes the *Akkusativ*; *mein Schlüssel* in the *Akkusativ* is *meinen Schlüssel*."
      fa: "*suchen* با حالت *Akkusativ* می‌آید؛ *mein Schlüssel* در حالت *Akkusativ* می‌شود *meinen Schlüssel*."
      de: "*Suchen* hat den Akkusativ. *Mein Schlüssel* im Akkusativ: *meinen Schlüssel*."
  - id: gap-3
    type: gap-fill
    prompt: Das Fahrrad gehört ___ Lehrer.
    options: [dem, den, der]
    answer: dem
    explanation:
      en: "*Gehören* takes the person in the *Dativ*: *der Lehrer* becomes *dem Lehrer*."
      fa: "*gehören* شخص را در حالت *Dativ* می‌گیرد: *der Lehrer* می‌شود *dem Lehrer*."
      de: "*Gehören* hat die Person im Dativ: *der Lehrer* wird zu *dem Lehrer*."
  - id: gap-4
    type: gap-fill
    prompt: Ich gebe ___ Kind einen Apfel.
    options: [dem, das, den]
    answer: dem
    explanation:
      en: "The person who gets the apple is in the *Dativ*: *dem Kind*."
      fa: "کسی که سیب را می‌گیرد در حالت *Dativ* می‌آید: *dem Kind*."
      de: "Die Person, die den Apfel bekommt, steht im Dativ: *dem Kind*."
  - id: gap-5
    type: gap-fill
    prompt: Wir wohnen ___ Goethestraße.
    options: [in der, die, der]
    answer: in der
    explanation:
      en: "*Wohnen* needs a place with a preposition: *in der Goethestraße*."
      fa: "*wohnen* به مکانی با حرف اضافه نیاز دارد: *in der Goethestraße*."
      de: "*Wohnen* braucht einen Ort mit Präposition: *in der Goethestraße*."
  - id: choice-1
    type: multiple-choice
    prompt: Das Baby ___.
    options: [schläft, sucht, braucht]
    answer: schläft
    explanation:
      en: "*Schlafen* needs nothing but the subject. *Suchen* and *brauchen* need an object."
      fa: "*schlafen* جز فاعل چیزی لازم ندارد. *suchen* و *brauchen* مفعول می‌خواهند."
      de: "*Schlafen* braucht nur das Subjekt. *Suchen* und *brauchen* brauchen ein Objekt."
  - id: choice-2
    type: multiple-choice
    prompt: Wir ___ in Köln.
    options: [wohnen, besuchen, brauchen]
    answer: wohnen
    explanation:
      en: "*Wohnen* takes a place. *Besuchen* and *brauchen* need an object in the *Akkusativ*."
      fa: "*wohnen* با مکان می‌آید. *besuchen* و *brauchen* مفعولی در حالت *Akkusativ* می‌خواهند."
      de: "*Wohnen* hat einen Ort. *Besuchen* und *brauchen* brauchen ein Objekt im Akkusativ."
  - id: choice-3
    type: multiple-choice
    prompt: Mein Bruder ist ___.
    options: [müde, den Arzt, dem Kind]
    answer: müde
    explanation:
      en: "After *sein* comes an adjective or a *Nominativ*, never an *Akkusativ* or a *Dativ*."
      fa: "پس از *sein* صفت یا اسمی در حالت *Nominativ* می‌آید، نه حالت *Akkusativ* یا *Dativ*."
      de: "Nach *sein* steht ein Adjektiv oder ein Nominativ, kein Akkusativ und kein Dativ."
  - id: choice-4
    type: multiple-choice
    prompt: Die Jacke gehört ___.
    options: [meiner Schwester, meine Schwester, meinen Schwester]
    answer: meiner Schwester
    explanation:
      en: "*Gehören* takes the person in the *Dativ*: *meiner Schwester*."
      fa: "*gehören* شخص را در حالت *Dativ* می‌گیرد: *meiner Schwester*."
      de: "*Gehören* hat die Person im Dativ: *meiner Schwester*."
  - id: true-1
    type: true-false
    prompt: Ich danke dem Lehrer.
    answer: true
    explanation:
      en: "*Danken* takes the person in the *Dativ*: *dem Lehrer*. The sentence is correct."
      fa: "*danken* شخص را در حالت *Dativ* می‌گیرد: *dem Lehrer*. جمله درست است."
      de: "*Danken* hat die Person im Dativ: *dem Lehrer*. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Ich brauche einen Computer.
    answer: true
    explanation:
      en: "*Brauchen* takes the *Akkusativ*: *einen Computer*. The sentence is correct."
      fa: "*brauchen* با حالت *Akkusativ* می‌آید: *einen Computer*. جمله درست است."
      de: "*Brauchen* hat den Akkusativ: *einen Computer*. Der Satz ist richtig."
  - id: true-3
    type: true-false
    prompt: Ich helfe den Mann.
    answer: false
    explanation:
      en: "*Helfen* takes the *Dativ*: *Ich helfe dem Mann.*"
      fa: "*helfen* با حالت *Dativ* می‌آید: *Ich helfe dem Mann.*"
      de: "*Helfen* hat den Dativ: *Ich helfe dem Mann.*"
  - id: true-4
    type: true-false
    prompt: Meine Eltern wohnen in Hamburg.
    answer: true
    explanation:
      en: "*Wohnen* with a place: *in Hamburg*. The sentence is correct."
      fa: "*wohnen* با مکان آمده است: *in Hamburg*. جمله درست است."
      de: "*Wohnen* mit einem Ort: *in Hamburg*. Der Satz ist richtig."
  - id: typed-gap-1
    type: typed-gap-fill
    prompt: Kannst du ___ (der) Mann helfen?
    answers: [dem]
    explanation:
      en: "*Helfen* takes the *Dativ*, and *der* becomes *dem*."
      fa: "*helfen* با حالت *Dativ* می‌آید و *der* به *dem* تبدیل می‌شود."
      de: "*Helfen* hat den Dativ: *der* wird zu *dem*."
  - id: typed-gap-2
    type: typed-gap-fill
    prompt: Ich sehe ___ (der) Bus.
    answers: [den]
    explanation:
      en: "*Sehen* takes the *Akkusativ*, and *der* becomes *den*."
      fa: "*sehen* با حالت *Akkusativ* می‌آید و *der* به *den* تبدیل می‌شود."
      de: "*Sehen* hat den Akkusativ: *der* wird zu *den*."
  - id: typed-gap-3
    type: typed-gap-fill
    prompt: Die Tasche gehört ___ (die) Frau.
    answers: [der]
    explanation:
      en: "*Gehören* takes the person in the *Dativ*, and *die* becomes *der*."
      fa: "*gehören* شخص را در حالت *Dativ* می‌گیرد و *die* به *der* تبدیل می‌شود."
      de: "*Gehören* hat die Person im Dativ: *die* wird zu *der*."
  - id: typed-gap-4
    type: typed-gap-fill
    prompt: Ich gebe ___ (der) Lehrer das Heft.
    answers: [dem]
    explanation:
      en: "The person who gets the exercise book is in the *Dativ*: *dem Lehrer*."
      fa: "کسی که دفتر را می‌گیرد در حالت *Dativ* می‌آید: *dem Lehrer*."
      de: "Die Person, die das Heft bekommt, steht im Dativ: *dem Lehrer*."
  - id: error-1
    type: find-error
    prompt: Ich helfe meinen Vater.
    answer: meinen
    explanation:
      en: "*Helfen* takes the *Dativ*: *meinem Vater*."
      fa: "*helfen* با حالت *Dativ* می‌آید: *meinem Vater*."
      de: "*Helfen* hat den Dativ: *meinem Vater*."
  - id: error-2
    type: find-error
    prompt: Wir kaufen ein Tisch.
    answer: ein
    explanation:
      en: "*Kaufen* takes the *Akkusativ*, and *der Tisch* is masculine: *einen Tisch*."
      fa: "*kaufen* با حالت *Akkusativ* می‌آید و *Tisch* اسم مذکر (*der*) است: *einen Tisch*."
      de: "*Kaufen* hat den Akkusativ. *Tisch* ist maskulin: *einen Tisch*."
  - id: match-1
    type: matching
    answer:
      - [Ich suche, meinen Schlüssel.]
      - [Ich helfe, meinem Bruder.]
      - [Ich bin, müde.]
    explanation:
      en: "*Suchen* takes the *Akkusativ*, *helfen* the *Dativ*, and *sein* an adjective."
      fa: "*suchen* با حالت *Akkusativ* می‌آید، *helfen* با حالت *Dativ* و *sein* با صفت."
      de: "*Suchen* hat den Akkusativ, *helfen* den Dativ und *sein* ein Adjektiv."

