# the case under each part. German only, so no labels.
diagrams:
  - caption:
      en: >
        Four verbs and what they need. *Schlafen* needs only the subject.
        *Suchen* needs an object in the *Akkusativ*, *helfen* a person in the
        *Dativ*, and *geben* both: the person in the *Dativ* and the thing in
        the *Akkusativ*. The verb is shaded.
      fa: >
        چهار فعل و متمم‌هایشان. *schlafen* فقط فاعل لازم دارد. *suchen* مفعولی
        در حالت *Akkusativ* می‌خواهد، *helfen* شخصی در حالت *Dativ* و *geben*
        هر دو را: شخص در حالت *Dativ* و چیز در حالت *Akkusativ*. فعل رنگی است.
      de: >
        Vier Verben und ihre Ergänzungen. *Schlafen* braucht nur das Subjekt.
        *Suchen* braucht ein Objekt im Akkusativ, *helfen* eine Person im
        Dativ und *geben* beides: die Person im Dativ und die Sache im
        Akkusativ. Das Verb ist farbig.
