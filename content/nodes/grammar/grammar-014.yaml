# Grammar list row 14.
id: grammar-014
kind: grammar
level: A1
chapter: a1-past
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-002]
title:
  en: "*Perfekt* with *haben*, regular *Partizip II*"
  fa: "گذشتهٔ نقلی (*Perfekt*) با *haben* و صفت مفعولی باقاعده"
  de: "Perfekt mit *haben*, regelmäßiges Partizip II"

explanations:
  en:
    rule: >
      In speech, German talks about the past mostly with the *Perfekt*. It has
      two parts: *haben* in the present tense in position 2, and the past
      participle (*Partizip II*) at the very end of the sentence. A regular
      verb makes its *Partizip II* with *ge-* + stem + *-t*: *machen* becomes
      *gemacht*, so *Ich habe Tee gemacht* (I made tea). When the stem ends in
      *-t* or *-d*, add *-et*: *arbeiten*, *gearbeitet*.
  fa:
    rule: >
      در گفتار، آلمانی بیشتر با گذشتهٔ نقلی (*Perfekt*) از گذشته سخن می‌گوید.
      این زمان دو بخش دارد: فعل کمکی *haben* که در زمان حال صرف می‌شود و در
      جایگاه دوم می‌آید، و صفت مفعولی (*Partizip II*) که در پایان جمله
      می‌نشیند. صفت مفعولی فعل باقاعده از *ge-* + بن فعل + *-t* ساخته می‌شود:
      *machen* می‌شود *gemacht*؛ پس *Ich habe Tee gemacht* یعنی «چای درست
      کردم». اگر بن فعل به *-t* یا *-d* ختم شود، *-et* می‌گیرد: *arbeiten*،
      *gearbeitet*.
  de:
    rule: >
      Wenn man über die Vergangenheit spricht, sagt man meistens das Perfekt.
      Es hat zwei Teile: *haben* im Präsens auf Position 2 und das Partizip II
      ganz am Ende. Bei regelmäßigen Verben ist das Partizip II *ge-* + Stamm
      + *-t*: *machen*, *gemacht*. *Ich habe Tee gemacht.* Endet der Stamm auf
      *-t* oder *-d*, kommt *-et* dazu: *arbeiten*, *gearbeitet*.

