        The form of *haben* (shaded) stands in position 2 and the
        *Partizip II* (shaded) at the end. Together they frame the rest of the
        sentence: the *Satzklammer*.
      fa: >
        *Ich habe gestern Tee gemacht.* و *Was hast du gestern gemacht?*
        صورت صرف‌شدهٔ *haben* (رنگی) در جایگاه دوم و صفت مفعولی (رنگی) در
        پایان جمله است. این دو با هم بقیهٔ جمله را در میان می‌گیرند: قاب جمله
        (*Satzklammer*).
      de: >
        *Ich habe gestern Tee gemacht.* und *Was hast du gestern gemacht?*
        Die Form von *haben* (farbig) steht auf Position 2, das Partizip II
        (farbig) am Ende. Zusammen sind sie die Satzklammer um den Rest.
