      de: "Nach *vieles* steht *was*."
  - id: error-1
    type: find-error
    prompt: Ich habe alles gemacht, das du mir gesagt hast.
    answer: das
    explanation:
      en: "After *alles* the relative word is *was*: *alles, was du mir gesagt hast*."
      fa: "پس از *alles* واژهٔ موصولی *was* است: *alles, was du mir gesagt hast*."
      de: "Nach *alles* steht *was*: *alles, was du mir gesagt hast*."
  - id: error-2
    type: find-error
    prompt: Die Stadt, was ich geboren bin, liegt am Meer.
    answer: was
    explanation:
      en: "For a place the relative word is *wo* (or *in der*), not *was*."
      fa: "برای مکان واژهٔ موصولی *wo* است (یا *in der*)، نه *was*."
      de: "Für einen Ort steht *wo* (oder *in der*), nicht *was*."
  - id: error-3
    type: find-error
    prompt: In Wien, was mein Onkel wohnt, gibt es viele Cafés.
    answer: was
    explanation:
