      de: "Nach *nichts* steht *was*."
  - id: gap-5
    type: gap-fill
    prompt: Ich verbringe den Sommer in Spanien, ___ meine Eltern ein Haus haben.
    options: [was, wo, das]
    answer: wo
    explanation:
      en: "After the name of a country the relative word is *wo*."
      fa: "پس از نام کشور واژهٔ موصولی *wo* است."
      de: "Nach dem Namen eines Landes steht *wo*."
  - id: choice-1
    type: multiple-choice
    prompt: Hast du alles, …
    options: [das du für die Reise brauchst?, was du für die Reise brauchst?, wo du für die Reise brauchst?]
    answer: was du für die Reise brauchst?
    explanation:
      en: "After *alles* the relative word is *was*, never *das*."
      fa: "پس از *alles* واژهٔ موصولی *was* است، هرگز *das*."
      de: "Nach *alles* steht *was*, nie *das*."
  - id: choice-2
    type: multiple-choice
    prompt: Die Stadt, …
    options:
      [
        "in die ich studiert habe, ist sehr klein.",
        "was ich studiert habe, ist sehr klein.",
        "wo ich studiert habe, ist sehr klein.",
      ]
    answer: wo ich studiert habe, ist sehr klein.
    explanation:
      en: "For a place the relative word is *wo* (or *in der*, for *Wo?*). *In die* would be for *Wohin?*."
      fa: "برای مکان واژهٔ موصولی *wo* است (یا *in der* برای *Wo?*). *in die* برای *Wohin?* است."
      de: "Für einen Ort steht *wo* (oder *in der*, Frage *Wo?*). *In die* passt zur Frage *Wohin?*."
  - id: choice-3
    type: multiple-choice
    prompt: "Das ist alles, was ich weiß. Was heißt das?"
    options: [Ich weiß alles., Mehr weiß ich nicht., "Ich weiß, wo alles ist."]
    answer: Mehr weiß ich nicht.
    explanation:
      en: "*Alles, was ich weiß*: everything I know, and there is no more."
      fa: "*alles, was ich weiß* یعنی همهٔ آنچه می‌دانم؛ بیش از این نمی‌دانم."
      de: "*Alles, was ich weiß*: Das ist alles. Mehr weiß ich nicht."
  - id: true-1
    type: true-false
    prompt: Gibt es hier ein Café, wo man gut frühstücken kann?
    answer: true
    explanation:
      en: "A café is a place, so *wo* fits, and *kann* stands at the end. The sentence is correct."
      fa: "کافه مکان است، پس *wo* درست است و *kann* در پایان جمله آمده. جمله درست است."
      de: "Ein Café ist ein Ort, also passt *wo*. *Kann* steht am Ende. Der Satz ist richtig."
  - id: true-2
    type: true-false
    prompt: Das ist alles, das ich gesehen habe.
    answer: false
    explanation:
      en: "After *alles* the relative word is *was*: *alles, was ich gesehen habe*."
      fa: "پس از *alles* واژهٔ موصولی *was* است: *alles, was ich gesehen habe*."
      de: "Nach *alles* steht *was*: *alles, was ich gesehen habe*."
  - id: true-3
    type: true-false
    prompt: Das, was du gesagt hast, stimmt nicht.
    answer: true
    explanation:
      en: "*Das, was …*: after *das* standing alone, the relative word is *was*. The sentence is correct."
      fa: "در *das, was …* پس از *das* که تنها آمده، واژهٔ موصولی *was* است. جمله درست است."
      de: "*Das, was …*: Nach *das* allein steht *was*. Der Satz ist richtig."
  - id: true-4
    type: true-false
    prompt: Ich wohne jetzt in Köln, in dem es viele Brücken gibt.
    answer: false
    explanation:
      en: "After the name of a city the relative word is *wo*: *in Köln, wo es viele Brücken gibt*."
      fa: "پس از نام شهر واژهٔ موصولی *wo* است: *in Köln, wo es viele Brücken gibt*."
      de: "Nach dem Namen einer Stadt steht *wo*: *in Köln, wo es viele Brücken gibt*."
