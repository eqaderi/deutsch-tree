# Grammar list row 182.
id: grammar-182
kind: grammar
level: B1
chapter: b1-relative-clauses
order: 3
status: published
recogniseOnly: false
prerequisites: [grammar-178]
title:
  en: "Relative clause with *wo* and *was*"
  fa: "جملهٔ موصولی با *wo* و *was*"
  de: "Relativsatz mit *wo* und *was*"

explanations:
  en:
    rule: >
      Two relative words never change for gender or case. *Was* does not
      refer to a noun but to a word for "everything" or "nothing": *alles*,
      *nichts*, *vieles*, *etwas*, and *das* in *das, was …*: *Das ist alles,
      was ich weiß.* It also follows a superlative used as a noun (*das
      Beste*, *das Schönste*): *Das ist das Beste, was ich je gegessen habe.*
      *Was* stays *was* as subject and as object: *alles, was mir gefällt*,
      *alles, was ich kenne*. After *alles* it is never *das*; after *etwas*
      you will also read *das*. *Wo* refers to a place. After the name of a
      city or a country it is the only choice: *In Ankara, wo ich geboren
      bin, …* After a noun for a place it can stand instead of a preposition
      and a pronoun: *die Stadt, wo ich wohne* means *die Stadt, in der ich
      wohne*. Both open a subordinate clause: a comma comes before it, and
      the conjugated verb goes to the end.
  fa:
    rule: >
      دو واژهٔ موصولی هرگز با جنس و حالت تغییر نمی‌کنند. *was* به اسم
      برنمی‌گردد، بلکه به واژه‌هایی مانند «همه‌چیز» و «هیچ‌چیز»: *alles*،
      *nichts*، *vieles*، *etwas* و *das* در *das, was …*: *Das ist alles,
      was ich weiß.* پس از صفت عالی‌ای که در نقش اسم آمده (*das Beste*،
      *das Schönste*) نیز *was* می‌آید: *Das ist das Beste, was ich je
      gegessen habe.* *was* چه فاعل باشد و چه مفعول، همان *was* می‌ماند:
      *alles, was mir gefällt* و *alles, was ich kenne*. پس از *alles* هرگز
      *das* نمی‌آید؛ پس از *etwas* گاهی *das* هم دیده می‌شود. *wo* به مکان
      برمی‌گردد. پس از نام شهر یا کشور تنها همین واژه درست است: *In Ankara,
      wo ich geboren bin, …* پس از اسمی که بر مکان دلالت می‌کند، *wo* می‌تواند
      جای حرف اضافه و ضمیر را بگیرد: *die Stadt, wo ich wohne* همان *die
      Stadt, in der ich wohne* است. هر دو جملهٔ پیرو را آغاز می‌کنند: پیش از
      آن ویرگول می‌آید و فعل صرف‌شده به پایان جمله می‌رود.
  de:
    rule: >
      Zwei Relativwörter ändern sich nie, nicht nach Genus und nicht nach
      Kasus. *Was* steht nicht nach einem Nomen, sondern nach Wörtern wie
      *alles*, *nichts*, *vieles*, *etwas* und *das* (*das, was …*): *Das ist
      alles, was ich weiß.* Auch nach einem Superlativ als Nomen (*das
      Beste*, *das Schönste*) steht *was*: *Das ist das Beste, was ich je
      gegessen habe.* *Was* bleibt immer *was*, als Subjekt und als Objekt:
      *alles, was mir gefällt*, *alles, was ich kenne*. Nach *alles* steht
      nie *das*. Nach *etwas* liest man auch *das*. *Wo* steht für einen Ort.
      Nach dem Namen einer Stadt oder eines Landes ist nur *wo* richtig: *In
      Ankara, wo ich geboren bin, …* Nach einem Nomen für einen Ort kann *wo*
      für Präposition und Pronomen stehen: *die Stadt, wo ich wohne*, also
      *die Stadt, in der ich wohne*. Beide beginnen einen Nebensatz: Vor ihm
      steht ein Komma, und das konjugierte Verb steht am Ende.

