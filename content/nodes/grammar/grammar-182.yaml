      fa: "پس از نام شهر واژهٔ موصولی *wo* است."
      de: "Nach dem Namen einer Stadt steht *wo*."
  - id: order-1
    type: word-order
    answers:
      - ["das ist alles,", was, ich, gehört, habe]
    explanation:
      en: "*Was* opens the relative clause, then the subject *ich*; the conjugated *habe* goes last."
      fa: "*was* جملهٔ موصولی را آغاز می‌کند، سپس فاعل *ich* می‌آید و فعل صرف‌شدهٔ *habe* در آخر."
      de: "*Was* steht am Anfang vom Relativsatz, dann das Subjekt *ich*. Das konjugierte Verb *habe* steht am Ende."
  - id: order-2
    type: word-order
    answers:
      - ["ich wohne in Graz,", wo, meine Eltern, auch, wohnen]
      - ["ich wohne in Graz,", wo, auch, meine Eltern, wohnen]
    explanation:
      en: "*Wo* opens the relative clause, and the conjugated *wohnen* goes last. *Auch* may stand before or after *meine Eltern*."
      fa: "*wo* جملهٔ موصولی را آغاز می‌کند و فعل صرف‌شدهٔ *wohnen* در آخر می‌آید. *auch* می‌تواند پیش یا پس از *meine Eltern* بیاید."
      de: "*Wo* steht am Anfang vom Relativsatz, das konjugierte Verb *wohnen* am Ende. *Auch* kann vor oder nach *meine Eltern* stehen."
  - id: match-1
    type: matching
    answer:
