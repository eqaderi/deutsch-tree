    explanation:
      en: "After a superlative used as a noun (*das Beste*) the relative word is *was*."
      fa: "پس از صفت عالی در نقش اسم (*das Beste*) واژهٔ موصولی *was* است."
      de: "Nach einem Superlativ als Nomen (*das Beste*) steht *was*."
