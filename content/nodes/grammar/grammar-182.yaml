      - ["in Berlin, ___ ich wohne", wo]
      - ["der Mann, ___ ich kenne", den]
    explanation:
      en: "*Was* after *alles*, *wo* after the name of a city, and after a noun a relative pronoun: *den* (*Ich kenne den Mann*)."
      fa: "*was* پس از *alles*، *wo* پس از نام شهر و پس از اسم، ضمیر موصولی: *den* (*Ich kenne den Mann*)."
      de: "*Was* nach *alles*, *wo* nach dem Namen einer Stadt, und nach einem Nomen ein Relativpronomen: *den* (*Ich kenne den Mann*)."

