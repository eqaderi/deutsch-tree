examples:
  - de: Das ist alles, was ich weiß.
    en: That's all I know.
    fa: همهٔ آنچه می‌دانم همین است.
  - de: In Ankara, wo ich geboren bin, wohnt noch meine Großmutter.
    en: My grandmother still lives in Ankara, where I was born.
    fa: مادربزرگم هنوز در آنکارا زندگی می‌کند، شهری که من در آن به دنیا آمده‌ام.
  - de: Es gibt nichts, was ich lieber esse als Pizza.
    en: There's nothing I'd rather eat than pizza.
    fa: هیچ غذایی را بیشتر از پیتزا دوست ندارم.
  - de: Das ist das Beste, was mir heute passiert ist.
    en: That's the best thing that has happened to me today.
    fa: این بهترین اتفاقی است که امروز برایم افتاده است.
  - de: Hast du alles, was du für die Reise brauchst?
    en: Have you got everything you need for the trip?
    fa: هرچه برای سفر لازم داری همراهت هست؟
  - de: Die Stadt, wo ich studiert habe, ist sehr klein.
    en: The town where I studied is very small.
    fa: شهری که در آن درس خوانده‌ام خیلی کوچک است.
  - de: Ich besuche Freunde in Hamburg, wo es fast jeden Tag regnet.
    en: I'm visiting friends in Hamburg, where it rains almost every day.
    fa: به دیدن دوستانم در هامبورگ می‌روم؛ آن‌جا تقریباً هر روز باران می‌بارد.
  - de: Vieles, was er erzählt, ist nicht wahr.
    en: A lot of what he says isn't true.
    fa: بسیاری از چیزهایی که تعریف می‌کند راست نیست.
  - de: Das, was du gesagt hast, stimmt nicht.
    en: What you said isn't right.
    fa: آنچه گفتی درست نیست.
  - de: Gibt es hier ein Café, wo man gut frühstücken kann?
    en: Is there a café here where you can have a good breakfast?
    fa: این‌جا کافه‌ای هست که بشود در آن صبحانهٔ خوبی خورد؟

mistakes:
  - wrong: Das ist alles, das ich weiß.
    right: Das ist alles, was ich weiß.
    why:
      en: "*Alles* is not a noun, so the relative word is *was*, never *das*."
      fa: "*alles* اسم نیست، پس واژهٔ موصولی *was* است، هرگز *das*."
      de: "*Alles* ist kein Nomen. Darum steht *was*, nie *das*."
  - wrong: Ich wohne in Berlin, in dem es viele Parks gibt.
    right: Ich wohne in Berlin, wo es viele Parks gibt.
    why:
      en: "After the name of a city the relative word is *wo*."
      fa: "پس از نام شهر واژهٔ موصولی *wo* است."
      de: "Nach dem Namen einer Stadt steht *wo*."
  - wrong: Die Stadt, was ich wohne, ist klein.
    right: Die Stadt, wo ich wohne, ist klein.
    why:
      en: "For a place the relative word is *wo* (or *in der*). *Was* is for *alles*, *nichts* and the like."
      fa: "برای مکان واژهٔ موصولی *wo* است (یا *in der*). *was* برای *alles*، *nichts* و مانند آن‌هاست."
      de: "Für einen Ort steht *wo* (oder *in der*). *Was* steht nach *alles*, *nichts* und so weiter."
  - wrong: Das ist alles, was ich habe gesehen.
    right: Das ist alles, was ich gesehen habe.
    why:
      en: "A relative clause with *was* is a subordinate clause: the conjugated verb goes to the very end."
      fa: "جملهٔ موصولی با *was* جملهٔ پیرو است و فعل صرف‌شده در آخر جمله می‌آید."
      de: "Der Relativsatz mit *was* ist ein Nebensatz. Das konjugierte Verb steht ganz am Ende."

