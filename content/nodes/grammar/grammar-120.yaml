# Grammar list row 120.
id: grammar-120
kind: grammar
level: A1
chapter: a1-prepositions
order: 2
status: published
recogniseOnly: false
prerequisites: [grammar-063, grammar-119]
title:
  en: "Temporal: *vor*, *nach*, *in*, *für*, *seit*, *bis*"
  fa: "حرف‌های اضافهٔ زمان: *vor*، *nach*، *in*، *für*، *seit*، *bis*"
  de: "Zeit: *vor*, *nach*, *in*, *für*, *seit*, *bis*"

explanations:
  en:
    rule: >
      *Vor* (before) and *nach* (after) place one thing before or after
      another: *vor dem Konzert*, *nach der Arbeit*. With a length of time,
      *vor* means ago: *vor einer Woche*, and *in* means from now: *in einer
      Stunde*. *Seit* says that something began in the past and is still
      going on, so the verb stays in the present: *Ich wohne seit einem Jahr
      hier*. *Für* gives a planned length of time: *für zwei Wochen*. *Bis*
      gives the end: *bis Freitag*, *bis 18 Uhr*. *Vor*, *nach*, *in* and
      *seit* take the *Dativ* (*einer Woche*, *dem Konzert*, plural *drei
      Tagen* with *-n*); *für* takes the *Akkusativ* (*eine Woche*).
  fa:
    rule: >
      *vor* (پیش از) و *nach* (پس از) نشان می‌دهند که کاری پیش یا پس از کاری
      دیگر است: *vor dem Konzert* و *nach der Arbeit*. با یک مدت زمان، *vor*
      یعنی «پیش»: *vor einer Woche* (یک هفته پیش) و *in* یعنی «دیگر»: *in
      einer Stunde* (یک ساعت دیگر). *seit* می‌گوید کاری در گذشته شروع شده و
      هنوز ادامه دارد؛ به همین دلیل فعل در زمان حال (*Präsens*) می‌ماند: *Ich
      wohne seit einem Jahr hier* (یک سال است که این‌جا زندگی می‌کنم). *für*
      مدتی از پیش تعیین‌شده را می‌گوید: *für zwei Wochen*. *bis* پایان را
      نشان می‌دهد: *bis Freitag* و *bis 18 Uhr*. *vor*، *nach*، *in* و *seit*
      با حالت *Dativ* (حالت مفعول باواسطه) می‌آیند (*einer Woche*، *dem
      Konzert* و در جمع *drei Tagen* با *-n*)؛ *für* با حالت *Akkusativ*
      (حالت مفعولی) می‌آید (*eine Woche*).
  de:
    rule: >
      *Vor* und *nach* sagen, was vorher und was nachher ist: *vor dem
      Konzert*, *nach der Arbeit*. Mit einer Zeitdauer heißt *vor*: Das war
      früher, zum Beispiel *vor einer Woche*. *In* heißt: Das kommt später,
      zum Beispiel *in einer Stunde*. *Seit* sagt: Es hat früher begonnen und
      ist noch nicht vorbei. Das Verb steht im Präsens: *Ich wohne seit einem
      Jahr hier.* *Für* sagt, wie lange etwas dauern soll: *für zwei Wochen*.
      *Bis* sagt das Ende: *bis Freitag*, *bis 18 Uhr*. Nach *vor*, *nach*,
      *in* und *seit* steht der Dativ (*einer Woche*, *dem Konzert*, im Plural
      *drei Tagen* mit *-n*), nach *für* der Akkusativ (*eine Woche*).

