# Grammar list row 142.
id: grammar-142
kind: grammar
level: A1
chapter: a1-first-sentences
order: 6
status: published
recogniseOnly: false
prerequisites: [grammar-139]
title:
  en: "Yes/no question"
  fa: "پرسش بله یا نه"
  de: "Ja/Nein-Frage"

explanations:
  en:
    rule: >
      A question that is answered with *ja* or *nein* starts with the
      conjugated verb. The verb stands in position 1, the subject comes right
      after it, and then the rest: *Kommst du morgen?* There is no question
      word, and no helper verb like English "do" or "are". The verb keeps the
      same ending as in a statement. At the end the voice goes up.
  fa:
    rule: >
      پرسشی که پاسخش *ja* (بله) یا *nein* (نه) است، با فعل صرف‌شده آغاز
      می‌شود. فعل در جایگاه اول می‌آید، فاعل بلافاصله پس از آن و سپس بقیهٔ
      جمله: *Kommst du morgen?* در فارسی چنین پرسشی را با لحن صدا یا با «آیا»
      می‌سازیم؛ آلمانی برای آن واژهٔ جداگانه‌ای ندارد و فعل را به آغاز جمله
      می‌برد. شناسهٔ فعل همان شناسهٔ جملهٔ خبری است. در پایان پرسش لحن صدا بالا
      می‌رود.
  de:
    rule: >
      Auf eine Ja/Nein-Frage antwortet man mit *ja* oder *nein*. Die Frage
      beginnt mit dem konjugierten Verb. Das Verb steht auf Position 1, das
      Subjekt direkt danach, dann der Rest: *Kommst du morgen?* Es gibt kein
      Fragewort. Das Verb hat die gleiche Endung wie im Aussagesatz. Am Ende
      geht die Stimme nach oben.

table:
  columns:
    - { en: "Position 1: verb", fa: "جایگاه اول: فعل", de: "Position 1: Verb" }
    - { en: Subject, fa: فاعل, de: Subjekt }
    - { en: The rest, fa: بقیهٔ جمله, de: Rest }
  rows:
    - [Kommst, du, morgen?]
    - [Hast, du, heute Zeit?]
    - [Wohnen, Sie, in Köln?]
    - [Ist, das, dein Fahrrad?]
    - [Spielt, Tom, gern Fußball?]
    - [Lernt, ihr, zusammen?]

# A statement becomes a yes/no question: the verb moves to the front.
diagrams:
  - caption:
      en: >
        *Du kommst morgen.* becomes *Kommst du morgen?*: the verb, shaded,
        moves to position 1 and the subject comes after it.
      fa: >
        *Du kommst morgen.* به *Kommst du morgen?* تبدیل می‌شود: فعل، که رنگی
        است، به جایگاه اول می‌رود و فاعل پس از آن می‌آید.
      de: >
        Aus *Du kommst morgen.* wird *Kommst du morgen?*: Das Verb (farbig)
        geht auf Position 1, das Subjekt kommt danach.
    labels:
      statement: { en: statement, fa: جملهٔ خبری, de: Aussagesatz }
      question: { en: yes/no question, fa: پرسش بله یا نه, de: Ja/Nein-Frage }
