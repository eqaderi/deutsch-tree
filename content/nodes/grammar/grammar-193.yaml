      en: >
        *Wie oft?* From *immer* (always) to *nie* (never): the longer the bar,
        the more often it happens.
      fa: >
        *Wie oft?* از *immer* (همیشه) تا *nie* (هرگز): هر چه نوار بلندتر باشد،
        کار بیشتر تکرار می‌شود.
      de: >
        *Wie oft?* Von *immer* bis *nie*: Je länger der Balken, desto öfter
