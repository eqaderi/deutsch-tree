id: grammar-193
kind: grammar
level: A1
chapter: a1-numbers-time
order: 4
status: published
recogniseOnly: false
prerequisites: [grammar-139]
title:
  en: "Time and frequency adverbs"
  fa: "قیدهای زمان و تکرار (*heute*، *oft*، *nie* …)"
  de: "Adverbien für Zeit und Häufigkeit (*heute*, *oft*, *nie* …)"

explanations:
  en:
    rule: >
      Time adverbs say when: *gestern*, *heute*, *morgen*, *jetzt*, *bald*,
      *später*. Frequency adverbs say how often: *immer*, *oft*, *manchmal*,
      *nie*. Such an adverb often stands right after the verb: *Ich gehe oft
      ins Kino.* It can also stand first; then the verb stays in position 2
      and the subject comes after it: *Heute habe ich frei.* With *morgen* the
      present tense is enough for the future: *Morgen fahre ich nach Köln.* A
      time of day after *heute*, *morgen* or *gestern* is a noun and has a
      capital: *heute Abend*, *morgen Vormittag*.
  fa:
    rule: >
      قیدهای زمان می‌گویند کاری کی انجام می‌شود: *gestern* (دیروز)، *heute*
      (امروز)، *morgen* (فردا)، *jetzt* (حالا)، *bald* (به‌زودی)، *später*
      (بعداً). قیدهای تکرار می‌گویند کاری هر چند وقت یک بار انجام می‌شود:
      *immer* (همیشه)، *oft* (اغلب)، *manchmal* (گاهی)، *nie* (هرگز). این قیدها
      بیشتر درست پس از فعل می‌آیند: *Ich gehe oft ins Kino.* در آغاز جمله هم
      می‌توانند بیایند؛ در این صورت فعل همچنان در جایگاه دوم می‌ماند و فاعل پس
      از آن می‌آید: *Heute habe ich frei.* با *morgen* زمان حال برای آینده
      کافی است: *Morgen fahre ich nach Köln.* بخش روز پس از *heute*، *morgen*
      و *gestern* اسم است و با حرف بزرگ نوشته می‌شود: *heute Abend* (امشب)،
      *morgen Vormittag* (فردا پیش از ظهر).
  de:
    rule: >
      Adverbien für die Zeit sagen, wann etwas passiert: *gestern*, *heute*,
      *morgen*, *jetzt*, *bald*, *später*. Adverbien für die Häufigkeit sagen,
      wie oft: *immer*, *oft*, *manchmal*, *nie*. Das Adverb steht meistens
      direkt nach dem Verb: *Ich gehe oft ins Kino.* Es kann auch am Anfang
      stehen. Dann bleibt das Verb auf Position 2, und das Subjekt kommt
      danach: *Heute habe ich frei.* Mit *morgen* reicht das Präsens für die
      Zukunft: *Morgen fahre ich nach Köln.* Nach *heute*, *morgen* und
      *gestern* schreibt man die Tageszeit groß: *heute Abend*, *morgen
      Vormittag*.

