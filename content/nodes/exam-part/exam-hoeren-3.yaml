        explanation:
          en: "She often works at home *und braucht ein eigenes Arbeitszimmer*."
          fa: "او اغلب در خانه کار می‌کند *und braucht ein eigenes Arbeitszimmer*."
          de: "Sie arbeitet oft zu Hause *und braucht ein eigenes Arbeitszimmer*."
      - id: i3
        type: richtig-falsch
        prompt: Viele andere Leute wollten die Wohnung am Park auch haben.
        answer: true
        explanation:
          en: "At the viewing there were *noch dreißig andere Leute*: thirty other people."
          fa: "هنگام دیدن خانه *noch dreißig andere Leute* آن‌جا بودند: سی نفر دیگر."
          de: "Bei der Wohnung waren *noch dreißig andere Leute*."
      - id: i4
        type: richtig-falsch
        prompt: Tobias weiß schon, dass er die Wohnung am Park bekommt.
        answer: false
        explanation:
          en: "The landlord will answer by Friday, and Tobias says *ich glaube nicht, dass ich sie bekomme*."
          fa: "صاحب‌خانه تا جمعه خبر می‌دهد، و *Tobias* می‌گوید *ich glaube nicht, dass ich sie bekomme*."
          de: "Der Vermieter meldet sich erst bis Freitag, und Tobias sagt: *Ich glaube nicht, dass ich sie bekomme.*"
      - id: i5
        type: richtig-falsch
        prompt: Die Wohnung von Anna hat einen großen Balkon.
        answer: false
        explanation:
          en: "Anna's flat is *leider ohne Balkon*; its kitchen is large."
          fa: "خانهٔ *Anna* بالکن ندارد (*leider ohne Balkon*)؛ در عوض آشپزخانه‌اش بزرگ است."
          de: "Annas Wohnung ist *leider ohne Balkon*. Groß ist die Küche."
      - id: i6
        type: richtig-falsch
        prompt: Julia will Anna fragen, ob Tobias die Wohnung ansehen kann.
        answer: true
        explanation:
          en: "Tobias asks her to, and she says *Klar, ich sehe sie morgen im Büro*."
          fa: "*Tobias* این را از او می‌خواهد و او می‌گوید *Klar, ich sehe sie morgen im Büro*."
          de: "Tobias bittet sie darum, und Julia sagt: *Klar, ich sehe sie morgen im Büro.*"
      - id: i7
        type: richtig-falsch
        prompt: Julia geht meistens abends nach der Arbeit laufen.
        answer: false
        explanation:
          en: "She runs *meistens morgens vor der Arbeit*: mostly in the morning, before work."
          fa: "او *meistens morgens vor der Arbeit* می‌دود: بیشتر صبح‌ها، پیش از کار."
          de: "Sie läuft *meistens morgens vor der Arbeit*."

