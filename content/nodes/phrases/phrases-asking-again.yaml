purpose:
  en: "Say that you did not understand, ask the other person to repeat or explain, and check that you understood."
  fa: "بگویید که متوجه نشده‌اید، از طرف مقابل بخواهید تکرار کند یا توضیح دهد، و مطمئن شوید که درست فهمیده‌اید."
  de: "Sagen, dass man etwas nicht verstanden hat, um Wiederholung oder Erklärung bitten und prüfen, ob man es richtig verstanden hat."
