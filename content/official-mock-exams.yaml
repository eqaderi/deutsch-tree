        en: Look for the recordings of this set on the practice page of the Goethe-Institut for B1.
        fa: فایل‌های شنیداری این مجموعه را در صفحهٔ تمرین *Goethe-Institut* برای *B1* پیدا کنید.
        de: Such die Hörtexte zu diesem Satz auf der Übungsseite vom Goethe-Institut für B1.

