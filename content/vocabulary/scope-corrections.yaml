# Corrections to the headwords extracted from the Goethe A1, A2 and B1 word
# lists, applied by `pnpm vocabulary:scope` before the scope rule
# (src/vocabulary-scope/index.ts). Written by hand.
#
# `word` is always the headword as the extracted lists spell it. The keys:
#   rename      the headword to use instead
#   sameAs      another spelling or form of that headword: one word, at the lower level of the two
#   class, article, plural, reflexive
#               what the lists do not print, or what the extraction got wrong
#   drop        no word at all
#   isWord      true: a word although written with a hyphen; false: a word-building part
#   feminineOf  the masculine noun this is the feminine form of; null: a word of its own
#   variantOf   the word used in Germany that this Austrian or Swiss word stands for; null: used in Germany too
#   region      with variantOf: where the word is used (A, CH), when the lists print no region
#
# Only headwords, articles, plural markers and word classes belong here.
# Never a sentence, a definition or a translation from a word list.

# The word class of every word that is neither noun nor verb. The lists print none.
