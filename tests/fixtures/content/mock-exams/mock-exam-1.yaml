  # Teil 4: one radio discussion of a moderator and two guests, heard twice; who says what?
  - texts:
      - id: a
        title: Arbeiten von zu Hause
        speakers:
          - { name: Moderatorin, voice: kerstin }
          - { name: Herr Wolf, voice: thorsten }
          - { name: Frau Roth, voice: mls-5424 }
        lines:
          - {
              speaker: Moderatorin,
              text: "Heute sprechen wir über das Arbeiten von zu Hause. Ich finde das Thema sehr wichtig.",
            }
          - { speaker: Herr Wolf, text: "Ich arbeite gern zu Hause. Ich spare jeden Tag viel Zeit." }
          - {
              speaker: Frau Roth,
              text: "Mir fehlen zu Hause meine Kollegen. Im Büro kann man besser zusammen sprechen.",
            }
          - { speaker: Moderatorin, text: "Viele Eltern sagen, dass sie zu Hause mehr Zeit für die Kinder haben." }
          - { speaker: Herr Wolf, text: "Man braucht aber einen ruhigen Platz zum Arbeiten." }
          - { speaker: Frau Roth, text: "Ich gehe lieber jeden Tag ins Büro. Dort ist mein Tag besser geplant." }
          - { speaker: Moderatorin, text: "Zum Schluss eine Frage an unsere Hörer. Schreiben Sie uns Ihre Meinung!" }
          - { speaker: Herr Wolf, text: "Die Firmen sollen den Mitarbeitern die Wahl lassen." }
    items:
      - { id: i1, type: who-says, prompt: Das Thema ist sehr wichtig., answer: Moderatorin, explanation: *why }
      - { id: i2, type: who-says, prompt: Zu Hause spart man Zeit., answer: Herr Wolf, explanation: *why }
      - {
