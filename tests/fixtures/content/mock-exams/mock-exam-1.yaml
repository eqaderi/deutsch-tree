  # Teil 4: seven comments on one question; is the person for it?
  - texts:
      - { id: a, title: Lisa, body: "Ein Verbot finde ich richtig. Handys stören im Unterricht." }
      - { id: b, title: Tom, body: "Ich brauche mein Handy, wenn meine Eltern anrufen. Kein Verbot!" }
      - { id: c, title: Mia, body: "In der Pause sollen alle miteinander sprechen. Also bitte ein Verbot." }
      - { id: d, title: Ben, body: "Wir lernen mit dem Handy auch viel. Ein Verbot ist falsch." }
      - { id: e, title: Ella, body: "Ohne Handys ist es in der Klasse ruhiger. Ich bin dafür." }
      - { id: f, title: Max, body: "Die Schüler sollen selbst entscheiden. Ich bin dagegen." }
      - { id: g, title: Zoe, body: "Ein Verbot ist gut, dann gibt es weniger Streit." }
