# Fixture mock exam for tests. Invented, short, and stable: tests assert on these words.
# Every part has the format of its exam part (number of texts and items, item types),
# but the texts are far shorter than in a real exam.
id: mock-exam-1
order: 1
status: published
title:
  en: Fixture mock exam
  fa: آزمون آزمایشی
