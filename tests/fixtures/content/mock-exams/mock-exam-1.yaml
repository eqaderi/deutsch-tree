lesen:
  # Teil 1: one personal text, six statements, Richtig or Falsch.
  - texts:
      - id: a
        title: Endlich in Leipzig
        body: |
          Liebe Anna,

          seit einem Monat wohne ich jetzt in Leipzig. Die Wohnung ist klein, aber hell.
          Meine Arbeit im Café beginnt schon um sechs Uhr, darum stehe ich sehr früh auf.

          Am Wochenende fahre ich mit dem Fahrrad an den See. Komm mich doch im Mai besuchen!

          Viele Grüße
          Paula
    items:
      - id: i1
        type: richtig-falsch
        prompt: Paula wohnt seit einem Jahr in Leipzig.
        answer: false
        explanation: &why { en: The text says so., fa: متن همین را می‌گوید., de: So steht es im Text. }
      - id: i2
        type: richtig-falsch
        prompt: Die Wohnung ist hell.
        answer: true
        explanation: *why
      - id: i3
        type: richtig-falsch
        prompt: Paula arbeitet in einem Café.
        answer: true
        explanation: *why
      - id: i4
        type: richtig-falsch
        prompt: Paula steht spät auf.
        answer: false
        explanation: *why
      - id: i5
        type: richtig-falsch
        prompt: Am Wochenende fährt Paula mit dem Zug an den See.
        answer: false
        explanation: *why
      - id: i6
        type: richtig-falsch
        prompt: Paula lädt Anna ein.
        answer: true
        explanation: *why

  # Teil 2: two press texts, three questions each, a, b or c.
  - texts:
      - id: a
        title: Neue Bibliothek im Zentrum
        body: |
          Die Stadt hat eine neue Bibliothek eröffnet. Sie ist jeden Tag bis zwanzig Uhr offen.
          Kinder bekommen ihren Ausweis kostenlos.
      - id: b
        title: Mehr Busse am Abend
        body: |
          Ab Juni fahren die Busse am Abend öfter. Die Linie drei fährt dann auch nachts.
          Die Fahrkarten kosten so viel wie vorher.
    items:
      - id: i1
        type: multiple-choice
        prompt: In dem Text geht es um …
        options: [eine neue Bibliothek., eine neue Schule., ein neues Museum.]
        answer: eine neue Bibliothek.
        explanation: *why
      - id: i2
        type: multiple-choice
        prompt: Die Bibliothek ist …
        options: [nur am Wochenende offen., jeden Tag offen., am Abend geschlossen.]
        answer: jeden Tag offen.
        explanation: *why
      - id: i3
        type: multiple-choice
        prompt: Kinder …
        options: [zahlen für den Ausweis., bekommen den Ausweis kostenlos., brauchen keinen Ausweis.]
        answer: bekommen den Ausweis kostenlos.
        explanation: *why
      - id: i4
        type: multiple-choice
        prompt: In dem Text geht es um …
        options: [neue Fahrräder., mehr Busse am Abend., teure Fahrkarten.]
        answer: mehr Busse am Abend.
        explanation: *why
      - id: i5
        type: multiple-choice
        prompt: Die Linie drei …
        options: [fährt auch nachts., fährt nicht mehr., fährt nur am Morgen.]
        answer: fährt auch nachts.
        explanation: *why
      - id: i6
        type: multiple-choice
        prompt: Die Fahrkarten …
        options: [werden teurer., werden billiger., kosten so viel wie vorher.]
        answer: kosten so viel wie vorher.
        explanation: *why

