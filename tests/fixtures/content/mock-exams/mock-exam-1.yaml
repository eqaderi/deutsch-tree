      - { id: i6, type: who-says, prompt: Im Büro ist der Tag besser geplant., answer: Frau Roth, explanation: *why }
      - {
          id: i7,
          type: who-says,
          prompt: Die Hörer sollen ihre Meinung schreiben.,
          answer: Moderatorin,
          explanation: *why,
