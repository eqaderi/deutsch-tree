  # Teil 5: one set of rules, four questions, a, b or c.
  - texts:
      - id: a
        title: Regeln im Fitnessstudio
        body: |
          Bitte bringen Sie immer ein Handtuch mit. Essen ist im Studio nicht erlaubt.
          Kinder unter vierzehn Jahren dürfen nur mit einem Erwachsenen trainieren.
          Wer seinen Vertrag kündigen will, schreibt uns einen Brief.
    items:
      - id: i1
        type: multiple-choice
        prompt: Was müssen Sie mitbringen?
        options: [Ein Handtuch., Etwas zu essen., Einen Ausweis.]
        answer: Ein Handtuch.
        explanation: *why
      - id: i2
        type: multiple-choice
        prompt: Essen im Studio ist …
        options: [erlaubt., nicht erlaubt., nur am Abend erlaubt.]
        answer: nicht erlaubt.
        explanation: *why
      - id: i3
        type: multiple-choice
        prompt: Kinder unter vierzehn Jahren …
        options: [dürfen nicht trainieren., trainieren mit einem Erwachsenen., trainieren allein.]
        answer: trainieren mit einem Erwachsenen.
        explanation: *why
      - id: i4
        type: multiple-choice
        prompt: Wie kündigt man den Vertrag?
        options: [Mit einem Anruf., Mit einem Brief., Im Studio an der Kasse.]
        answer: Mit einem Brief.
        explanation: *why

hoeren:
  # Teil 1: five short texts, each heard twice; per text a statement and a question.
  - texts:
      - id: a
        title: Auf dem Anrufbeantworter
        speakers: [{ name: Frau Berg, voice: kerstin }]
        lines:
          - {
              speaker: Frau Berg,
              text: "Hallo Herr Klein, Ihr Auto ist fertig. Sie können es morgen ab neun Uhr abholen.",
            }
      - id: b
        title: Im Radio
        speakers: [{ name: Sprecher, voice: thorsten }]
        lines:
          - {
              speaker: Sprecher,
              text: "Auf der Autobahn nach Bremen gibt es einen langen Stau. Fahren Sie lieber über die Landstraße.",
            }
      - id: c
