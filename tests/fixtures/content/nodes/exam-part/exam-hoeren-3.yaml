            text: Super. Die Party beginnt erst um acht.
          - speaker: Lena
            text: Soll ich etwas mitbringen?
          - speaker: Jonas
            text: Vielleicht einen Salat. Die Getränke kaufe ich selbst.
          - speaker: Lena
            text: Gern. Kommt deine Schwester auch?
          - speaker: Jonas
            text: Nein, sie ist am Wochenende in München.
          - speaker: Lena
            text: Schade. Dann bis Freitag!
