# Fixture node for tests. Invented, short, and stable: tests assert on these words.
id: grammar-103
kind: grammar
level: A2
chapter: fixture-nouns
order: 3
status: published
recogniseOnly: false
prerequisites: []
title:
  en: Fixture negation
  fa: نفی آزمایشی
  de: Test-Negation

explanations:
  en:
    rule: "A fixture sentence is negated with *nicht*. Before a noun without an article it is *kein*."
  fa:
    rule: "جملهٔ آزمایشی با *nicht* منفی می‌شود. پیش از اسمِ بدون حرف تعریف، *kein* می‌آید."
  de:
    rule: "Einen Test-Satz verneint man mit *nicht*. Vor einem Nomen ohne Artikel steht *kein*."

table:
  columns:
    - en: With
      fa: مثبت
      de: Positiv
    - en: Without
      fa: منفی
      de: Negativ
  rows:
    - [ein Auto, kein Auto]
    - [eine Katze, keine Katze]
    - [müde, nicht müde]

examples:
  - de: Ich habe kein Auto.
    en: I have no car.
    fa: من ماشین ندارم.
  - de: Er ist nicht müde.
    en: He is not tired.
    fa: او خسته نیست.

mistakes:
  - wrong: Ich habe nicht Auto.
    right: Ich habe kein Auto.
    why:
      en: "Before a noun without an article the negation is *kein*; with a *die* noun it is *keine*."
      fa: "پیش از اسمِ بدون حرف تعریف، نفی با *kein* است؛ برای اسم با *die* می‌شود *keine*."
      de: "Vor einem Nomen ohne Artikel steht *kein*; bei einem Nomen mit *die* steht *keine*."

