# Fixture node for tests. Invented, short, and stable: tests assert on these words.
id: grammar-101
kind: grammar
level: A2
chapter: fixture-nouns
order: 1
status: published
recogniseOnly: false
prerequisites: []
title:
  en: Fixture articles
  fa: حرف تعریف‌های آزمایشی
  de: Test-Artikel

explanations:
  en:
    rule: "A fixture noun has one of three articles: *der*, *die* or *das*."
  fa:
    rule: "اسم آزمایشی یکی از سه حرف تعریف را دارد: *der*، *die* یا *das*."
  de:
    rule: "Ein Test-Nomen hat einen von drei Artikeln: *der*, *die* oder *das*."

# The fixture's one diagram: German drawn in it, and one label in the learner's language.
diagrams:
  - caption:
      en: "The book lies *auf dem Tisch*."
      fa: "کتاب *auf dem Tisch* است."
      de: "Das Buch liegt *auf dem Tisch*."
    labels:
      table:
        en: the table
        fa: میز
        de: der Tisch
    svg: |
      <svg viewBox="0 0 320 180">
        <rect class="surface" x="60" y="110" width="200" height="20" rx="8"/>
        <rect class="object" x="130" y="86" width="60" height="24" rx="4"/>
        <text class="label" x="160" y="60" text-anchor="middle">auf dem Tisch</text>
        <text class="note" x="160" y="160" text-anchor="middle">{{table}}</text>
      </svg>

table:
  columns:
    - en: Article
      fa: حرف تعریف
      de: Artikel
    - en: Noun
      fa: اسم
      de: Nomen
  rows:
    - [der, Tisch]
    - [die, Lampe]
    - [das, Buch]

examples:
  - de: Der Tisch ist hier.
    en: The table is here.
    fa: میز این‌جاست.
  - de: Das Buch ist hier.
    en: The book is here.
    fa: کتاب این‌جاست.

mistakes:
  - wrong: Die Tisch ist hier.
    right: Der Tisch ist hier.
    why:
      en: "*Tisch* is masculine: *der Tisch*."
      fa: "*Tisch* مذکر است: *der Tisch*."
      de: "*Tisch* ist maskulin: *der Tisch*."

# 15 questions: the smallest pool a published node may have.
questions:
  - id: q1
    type: multiple-choice
    prompt: ___ Tisch ist hier.
    options: [Der, Die, Das]
    answer: Der
    explanation:
      en: "*Tisch* is masculine: *der Tisch*."
      fa: "*Tisch* مذکر است: *der Tisch*."
      de: "*Tisch* ist maskulin: *der Tisch*."
  - id: q2
    type: gap-fill
    prompt: ___ Lampe ist hier.
    options: [Der, Die, Das]
    answer: Die
    explanation:
      en: "*Lampe* is feminine: *die Lampe*."
      fa: "*Lampe* مؤنث است: *die Lampe*."
      de: "*Lampe* ist feminin: *die Lampe*."
  - id: q3
    type: multiple-choice
    prompt: ___ Buch ist hier.
    options: [Der, Die, Das]
    answer: Das
    explanation:
      en: "*Buch* is neuter: *das Buch*."
      fa: "*Buch* خنثی است: *das Buch*."
      de: "*Buch* ist neutral: *das Buch*."
