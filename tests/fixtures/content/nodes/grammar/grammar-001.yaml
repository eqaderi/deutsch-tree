# Fixture node for tests. Invented, short, and stable: tests assert on these words.
id: grammar-001
kind: grammar
level: A1
chapter: fixture-basics
order: 1
status: published
recogniseOnly: false
prerequisites: []
title:
  en: Fixture verbs
  fa: فعل‌های آزمایشی
  de: Test-Verben

explanations:
  en:
    rule: >
      A fixture verb takes the ending of its person. With *ich* the ending
      is *-e*.
  fa:
    rule: >
      فعل آزمایشی پایانهٔ شخص خود را می‌گیرد. با *ich* پایانه *-e* است.
  de:
    rule: >
      Ein Test-Verb bekommt die Endung der Person. Bei *ich* ist die Endung *-e*.

table:
  columns:
    - en: Person
      fa: شخص
      de: Person
    - en: Form
      fa: صورت
      de: Form
  rows:
    - [ich, wohne]
    - [du, wohnst]

examples:
  - de: Ich wohne in Berlin.
    en: I live in Berlin.
    fa: من در برلین زندگی می‌کنم.
  - de: Wohnst du hier?
    en: Do you live here?
    fa: تو این‌جا زندگی می‌کنی؟

mistakes:
  - wrong: Du wohne hier.
    right: Du wohnst hier.
    why:
      en: With *du* the ending is *-st*.
      fa: با *du* پایانه *-st* است.
      de: Bei *du* ist die Endung *-st*.

# The first 15 questions are the smallest pool a published node may have.
questions:
  - id: q1
    type: multiple-choice
    prompt: Ich ___ in Berlin.
    options: [wohne, wohnst, wohnt]
    answer: wohne
    explanation:
      en: With *ich* the ending is *-e*.
      fa: با *ich* پایانه *-e* است.
      de: Bei *ich* ist die Endung *-e*.
  - id: q2
    type: multiple-choice
    prompt: Du ___ hier.
    options: [wohne, wohnst, wohnen]
    answer: wohnst
    explanation:
      en: With *du* the ending is *-st*.
      fa: با *du* پایانه *-st* است.
      de: Bei *du* ist die Endung *-st*.
  - id: q3
    type: multiple-choice
    prompt: Er ___ in Köln.
    options: [wohne, wohnst, wohnt]
    answer: wohnt
    explanation:
      en: With *er* the ending is *-t*.
      fa: با *er* پایانه *-t* است.
      de: Bei *er* ist die Endung *-t*.
  - id: q4
    type: gap-fill
    prompt: Wir ___ in Wien.
    options: [wohnst, wohnt, wohnen]
    answer: wohnen
    explanation:
      en: With *wir* the ending is *-en*.
      fa: با *wir* پایانه *-en* است.
      de: Bei *wir* ist die Endung *-en*.
