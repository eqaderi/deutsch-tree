  - id: q7
    type: multiple-choice
    prompt: Du ___ Deutsch.
    options: [lerne, lernst, lernen]
    answer: lernst
    explanation:
      en: With *du* the ending is *-st*.
      fa: با *du* پایانه *-st* است.
      de: Bei *du* ist die Endung *-st*.
  - id: q8
    type: multiple-choice
    prompt: Er ___ Deutsch.
    options: [lerne, lernst, lernt]
    answer: lernt
    explanation:
      en: With *er* the ending is *-t*.
      fa: با *er* پایانه *-t* است.
      de: Bei *er* ist die Endung *-t*.
  - id: q9
    type: gap-fill
    prompt: Wir ___ Fußball.
    options: [spiele, spielst, spielen]
    answer: spielen
    explanation:
      en: With *wir* the ending is *-en*.
      fa: با *wir* پایانه *-en* است.
      de: Bei *wir* ist die Endung *-en*.
  - id: q10
    type: multiple-choice
    prompt: Ihr ___ Fußball.
    options: [spielt, spielen, spiele]
    answer: spielt
    explanation:
      en: With *ihr* the ending is *-t*.
      fa: با *ihr* پایانه *-t* است.
      de: Bei *ihr* ist die Endung *-t*.
  - id: q11
    type: multiple-choice
    prompt: Ich ___ Suppe.
    options: [koche, kochst, kocht]
    answer: koche
    explanation:
      en: With *ich* the ending is *-e*.
      fa: با *ich* پایانه *-e* است.
      de: Bei *ich* ist die Endung *-e*.
  - id: q12
    type: gap-fill
    prompt: Du ___ Suppe.
    options: [koche, kochst, kochen]
    answer: kochst
    explanation:
      en: With *du* the ending is *-st*.
      fa: با *du* پایانه *-st* است.
      de: Bei *du* ist die Endung *-st*.
  - id: q13
    type: true-false
    prompt: Er kochst Suppe.
    answer: false
    explanation:
      en: It must be *er kocht*.
      fa: باید *er kocht* باشد.
      de: Es muss *er kocht* heißen.
  - id: q14
    type: true-false
    prompt: Wir kochen Suppe.
    answer: true
    explanation:
      en: With *wir* the ending is *-en*.
      fa: با *wir* پایانه *-en* است.
      de: Bei *wir* ist die Endung *-en*.
  - id: q15
    type: true-false
    prompt: Ihr koche Suppe.
    answer: false
    explanation:
      en: It must be *ihr kocht*.
      fa: باید *ihr kocht* باشد.
      de: Es muss *ihr kocht* heißen.
  # One of each further type, and a word ordering question with two right orders.
  - id: order-1
    type: word-order
    answer: [wo, wohnst, du]
    end: "?"
    explanation:
      en: In a question with *wo* the verb comes second.
      fa: در پرسش با *wo* فعل در جای دوم می‌آید.
      de: In einer Frage mit *wo* steht das Verb auf Platz 2.
  - id: order-2
    type: word-order
    answer: [ich, wohne, in Berlin]
    alsoAccepted:
      - [in Berlin, wohne, ich]
    explanation:
      en: The verb is in second place; *ich* or *in Berlin* can come first.
      fa: فعل در جای دوم است؛ *ich* یا *in Berlin* می‌تواند اول بیاید.
      de: Das Verb steht auf Platz 2. *ich* oder *in Berlin* kann am Anfang stehen.
  - id: error-1
    type: find-error
    prompt: Wir wohnst in Wien.
    answer: wohnst
    explanation:
      en: It must be *wir wohnen*.
      fa: باید *wir wohnen* باشد.
      de: Es muss *wir wohnen* heißen.
  - id: match-1
    type: matching
    answer:
      - [ich, lerne]
      - [du, lernst]
      - [wir, lernen]
    explanation:
      en: With *ich* the ending is *-e*, with *du* it is *-st* and with *wir* it is *-en*.
      fa: با *ich* پایانه *-e* است، با *du* پایانه *-st* و با *wir* پایانه *-en*.
      de: Bei *ich* ist die Endung *-e*, bei *du* ist sie *-st* und bei *wir* ist sie *-en*.

