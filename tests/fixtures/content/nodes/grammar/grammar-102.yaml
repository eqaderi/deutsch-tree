# Fixture node for tests. Invented, short, and stable: tests assert on these words.
id: grammar-102
kind: grammar
level: A2
chapter: fixture-nouns
order: 2
status: published
recogniseOnly: false
prerequisites: []
title:
  en: Fixture plurals
  fa: جمع‌های آزمایشی
  de: Test-Plural

explanations:
  en:
    rule: "A fixture noun has its own plural form. Many end in *-e*, *-en* or *-er*."
  fa:
    rule: "هر اسم آزمایشی صورت جمع خودش را دارد. بسیاری به *-e*، *-en* یا *-er* ختم می‌شوند."
  de:
    rule: "Ein Test-Nomen hat eine eigene Pluralform. Viele enden auf *-e*, *-en* oder *-er*."

table:
  columns:
    - en: One
      fa: مفرد
      de: Singular
    - en: Many
      fa: جمع
      de: Plural
  rows:
    - [Tisch, Tische]
    - [Lampe, Lampen]
    - [Buch, Bücher]

examples:
  - de: Hier sind zwei Tische.
    en: Here are two tables.
    fa: این‌جا دو میز هست.
  - de: Hier sind zwei Lampen.
    en: Here are two lamps.
    fa: این‌جا دو چراغ هست.

mistakes:
  - wrong: Hier sind zwei Buchs.
    right: Hier sind zwei Bücher.
    why:
      en: "The plural of *Buch* is *Bücher*."
      fa: "جمع *Buch* می‌شود *Bücher*."
      de: "Der Plural von *Buch* ist *Bücher*."

